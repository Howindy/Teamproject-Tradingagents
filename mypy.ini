[mypy]
python_version = 3.11
files = src/tradingagents, src/cli, scripts/ci_checks.py, scripts/ci_semantic_eval.py, test/offline/test_ci_gates.py
check_untyped_defs = True
no_implicit_optional = False
ignore_missing_imports = True
show_error_codes = True
pretty = False
no_error_summary = True
warn_unused_ignores = False
