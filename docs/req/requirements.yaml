validation:
  status: "passed"
  machine_status: "passed"
  human_review_status: "pending"
  human_review_notes: "Machine checks passed; human approval of the revised requirements and schema remains pending."
  schema: "docs/req/req-schema.json"
  script: "docs/req/validate_requirements.py"
  command: "python3 -m pip install pyyaml jsonschema && python3 docs/req/validate_requirements.py"
  result_record: "docs/req/validation-results.json"
  tool: "Python pyyaml + jsonschema Draft 2020-12 and custom Python checks"
  checks:
    - id: "schema_compile"
      result: "pass"
      details: "req-schema.json declares draft 2020-12 and compiles in a draft-2020-12 validator; date fields are enforced by ISO-date patterns."
    - id: "schema_validation"
      result: "pass"
      details: "requirements.yaml version 1.9.0 was loaded as YAML and validated against req-schema.json; result: valid."
    - id: "run_manifest_schema"
      result: "pass"
      details: "run-manifest-schema.json compiles under draft 2020-12; it carries artifact_binding, formal_decision, audit-only model_proposal, critical_profile, coverage_snapshot, provenance_digest, run_clock, inheritance record, memory entry binding, write/run security scans, full availability records with supports links and ordered attempts, and completed-state constraints; it accepts representative running, completed, failed-gate, failed-startup, and memory-disabled manifests while rejecting completed records with not_run/error gates, failed security scans, pending formal decisions, cross-field contradictions, or missing report/final-state/memory-entry artifacts."
    - id: "availability_decision_table"
      result: "pass"
      details: "FR-03 defines closed record, requirement, and coverage status sets; per-component evidence contracts; deterministic component and requirement aggregation with empty-set and threshold rules; fallback clearing; effective critical profile defaults; component_missing records and supports links; and ten acceptance criteria."
    - id: "gate_decision_table"
      result: "pass"
      details: "SB-01 defines the trusted coverage snapshot, the formal decision body with reason-specific review classes, model-proposal separation, closed gate statuses and reason codes, the complete blocked-input decision table, fail-closed gate failure with error.stage = gate, formal/intermediate output boundaries, and ten acceptance criteria."
    - id: "artifact_binding_contract"
      result: "pass"
      details: "INV-01 defines the completed checkpoint, artifact_binding, per-artifact contract, canonicalization, source-status granularity, legal fallback versus silent substitution, retry/partial-write behavior, memory entry binding and artifact hash scope, same-day rerun, memory-disabled behavior, and settlement/rotation lifecycle."
    - id: "secret_scan_contract"
      result: "pass"
      details: "SR-01 separates known-secret and versioned pattern checks, defines the closed scan scope and its limitation, separates per-write and final run scans, resolves the preference audit/restore endpoint conflict, specifies fail-closed behavior with an allowed minimal incident record, preserves existing get_scrubbed and .env 0600 controls, and adds over-redaction controls."
    - id: "duplicate_ids"
      result: "pass"
      details: "No duplicate IDs across requirements, acceptance criteria, stakeholders, baseline observations, conflict resolutions, or open questions."
    - id: "missing_references"
      result: "pass"
