      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: SB-01-FC09
      input: Hold-rating fault-injection fixtures where the gate raises, times out, or has an internal error, including
        a late success after timeout and an unsafe-write case where no failed manifest can be written.
      expected_result: Gate_result.status = error with gate_internal_error; blocked_for_review; REVIEW; review_class
        = gate_system_error; the formal text states that the gate is unavailable and manual review is required; no tradeable
        output; silent pass = 0. A safe failed record is written when possible with error.stage = gate; when it is not
        safe to write, no record is required and the system does not claim one. A late success does not overwrite the terminal failure or trigger
        publication. Gate failure does not wait for the terminal manifest and creates no circular dependency.
      verification: Fault-injection integration test for each failure mode; assert error propagation, failed run record,
        review notice, and absence of tradeable output.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: SB-01-FC10
      input: One passed run and one blocked run with manifest, report, final-state, memory, and API return. When FR-04
        applies, the passed run carries a gate-produced passed risk result with input_ref, input_digest, policy snapshot,
        and policy_digest; the blocked run carries its actual real evidence state, including valid input with invalid
        policy, invalid/missing input with a safe diagnostic, and a historical reused entry separately.
      expected_result: Manifest safety_gate status, reason_codes, primary_reason_code, coverage_status, critical_gap_ids,
