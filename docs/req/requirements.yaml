validation:
  status: "passed"
  machine_status: "passed"
  human_review_status: "pending"
  human_review_notes: "Machine checks passed for version 1.20.0; all 17 active requirements are draft, QR-02 is deferred and outside current acceptance, and human approval remains pending."
  schema: "docs/req/req-schema.json"
  script: "docs/req/validate_requirements.py"
  command: "python3 -m pip install pyyaml jsonschema && python3 docs/req/validate_requirements.py"
  result_record: "docs/req/validation-results.json"
  tool: "Python pyyaml + jsonschema Draft 2020-12 and custom Python checks"
  checks:
    - id: schema_compile
      result: pass
      details: req-schema.json declares draft 2020-12 and compiles; fit_criterion, sources, tradeoff, and structured non-functional fields are validated.
    - id: schema_validation
      result: pass
      details: requirements.yaml version 1.20.0 was loaded as YAML and validated against req-schema.json.
    - id: scope_status_consistency
      result: pass
      details: scope.approved_ids is empty; scope.draft_ids lists 17 requirements; scope.deferred_ids lists QR-02; every requirement status matches exactly one list.
    - id: requirement_count
      result: pass
      details: '18 requirements: 8 functional, 3 invariant, 2 performance (1 active, 1 deferred), 1 cost, 1 governance, 1 quality, 2 security.'
    - id: fit_criterion_count
      result: pass
      details: 119 fit criteria; active, deferred, and legacy mappings are recorded in docs/req/requirement-mapping.csv.
    - id: traceability_paths
      result: pass
      details: All requirement, traceability, and source evidence paths resolve.
    - id: brief_contract_v2
      result: pass
      details: Contract v2 is a revision draft; v1 is retained. It separates pre-run inputs, post-run result evidence, retry attempts, usage completeness, aggregation, and claim classification; unapproved thresholds remain null and blocked; measurement scope is local cost attribution.
    - id: spec_consistency
      result: pass
      details: PR-01 write/overhead formulas; GR-01 Stage A/B and dependency direction; CR-01 measurement/quality/safety/target/claim separation; FR-01-AC7 merged into AC6; QR-01 per-metric criteria; QR-02 performance/deferred; deferred items absent from active fit criteria; clause-level clarifications do not change status or priority.
    - id: threshold_ref_resolution
      result: pass
      details: CR-01 threshold refs resolve to contract v2; net_cost_max and quality_loss_max are null/unresolved and are not treated as approved numeric targets.
    - id: gr01_freeze_fixture
      result: pass
      details: Stage A passes without an implementation record; missing/incomplete material fails; Stage B fails on early, retrospective, or version-mismatched implementation.
  notes: "Machine validation passed for version 1.20.0; human review is pending. This revision removes contradictory clauses and fixes acceptance boundaries without changing status, MoSCoW, approval, or deferred scope. No application implementation or live evaluation was performed."

open_questions:
  - id: OQ-02
    question: "How long should run manifests and memory entries be retained after the storage location is fixed?"
    impact: "FR-02 manifest retention and INV-01 memory lifecycle; storage location itself is resolved."
    blocking: false
  - id: OQ-04
    question: "Which existing vendor caches remain cross-run, and what TTL applies to each?"
    impact: "FR-01 vendor-cache-hit accounting and vendor-cache retention policy; the run-cache definition is resolved."
    blocking: false
  - id: OQ-05
    question: "Are the PR-01-AC1/AC2 pre-replace write p95 thresholds (100 ms each), PR-01-AC3 percent overhead p95 (1%), and PR-01-AC4 absolute overhead p95 (1 second) accepted for a payload at most 256 KiB?"
    impact: "PR-01 acceptance thresholds and publisher benchmark design."
    blocking: false
  - id: OQ-08
    question: "Can concurrent runs share a manifest or preference directory without a locking policy?"
    impact: "FR-01 cache isolation and FR-02 manifest writes."
    blocking: false
  - id: OQ-09
    question: "Who is the authoritative supplier of portfolio_value, cash_balance, current_asset_quantity, current_asset_value, valuation_price, order_quantity, proposed_order_value, entry_price, stop_loss_price, currency, and valuation_time, and which broker or portfolio source is approved?"
    impact: "FR-04 input ownership, provenance, currency scope, valuation consistency, and applicability; implementation is blocked until the source and missing-input policy are approved."
    blocking: true
  - id: OQ-10
    question: "Are the provisional 30% concentration limit, 5% stop-distance limit, valuation freshness window, and precision rule approved, and what policy_ref, policy_version, and human_approval_ref should bind them?"
    impact: "FR-04 threshold comparisons, gate REVIEW rate, policy snapshot, threshold_status, and policy_digest; the values remain provisional until human approval."
    blocking: true
  - id: OQ-11
    question: "Is the timezone-aware historical valuation cutoff (end of run_clock.as_of_date in run_clock.timezone) and the point-in-time portfolio source approved for historical and backtest analyses?"
    impact: "FR-04 historical applicability, valuation freshness, and the scope of INV-02 evidence; the cutoff is defined, but the data source and backtest behavior need human confirmation."
    blocking: false
  - id: OQ-12
    question: "Should a new risk-policy behavior-evaluation set and contract version be created, and what separate REVIEW-rate and quality thresholds should apply to it?"
    impact: "FR-04, INV-02, and QR-01 behavior evaluation; the frozen v1 eval set remains unchanged, and risk-policy effects cannot be scored under the cache A/B thresholds."
    blocking: true
  - id: OQ-13
    question: "If QR-02 is reactivated, is the 2.000-second nearest-rank p95 target approved, and which local filesystems and hardware profiles are supported?"
    impact: "QR-02 future performance acceptance; QR-02 is deferred and does not block current acceptance."
    blocking: false
  - id: OQ-14
    question: "Which two non-NVDA reference companies, fiscal periods, and independently published sources should be frozen before FR-07 implementation?"
    impact: "GR-01-AC1–AC6, FR-07 Stage A implementation gate, and independent error tolerances; implementation is blocked until the reference manifest is frozen and Stage A passes."
    blocking: true
  - id: OQ-15
    question: "If TTM metrics are reactivated, is approximate TTM EPS acceptable, or should only fiscal-year P/E be reported?"
    impact: "Future FR-07 TTM EPS/P-E scope; the current version reports fiscal-year P/E only and defers TTM."
    blocking: false
  - id: OQ-16
    question: "What mandatory/compressible brief budgets, quality_loss_max, net_cost_max, prices, and evaluation-contract terms should govern FR-08/CR-01?"
    impact: "CR-01 local cost evaluation and claim classification, FR-08 brief budgets, and brief-eval-contract-v2; no cost or token saving may be claimed until thresholds are approved and measured."
    blocking: true
