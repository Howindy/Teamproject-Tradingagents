    analyst briefs. Resolution: FR-10 is the sole current identifier for deterministic financial metrics; historical
    formula tag fr07-direct-v1 is retained only as provenance.'
  assumptions:
  - Ten fixed metric families only; TTM, FCF YoY, and quarter-by-subtraction remain excluded.
  - Date-level cutoff is 00:00 America/New_York on the analysis date; historical prices are reconstructed daily
    bars rather than intraday snapshots.
  - Shared downstream briefs remain excluded from FR-10 and stay on the personal branch.
  notes: 'Added in v1.50.0 (PR #14 FM-PREP-2) as the current D1 successor to the personal branch''s historical financial
