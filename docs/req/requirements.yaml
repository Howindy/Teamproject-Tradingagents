  problem: 'Existing provider request helpers already replace one configured API key, and report settings use an
    allowlist, but configuration summaries and CLI endpoint preferences were not explicitly limited to safe fields.
    A preference could persist an endpoint with inline userinfo, query, or fragment, and a supported request error
    could still carry a known credential through a different presentation path. The baseline did not establish an
    actual key leak; this requirement is about protecting the explicitly supported configuration and diagnostic
    paths, not about adding a universal secret scanner.

    '
  statement: 'In the explicitly supported configuration-save, CLI-preference, and provider-request-error display
    paths, the system MUST NOT save or show credential fields or known credential values used in this run. The configuration
    summary reuses the existing allowlist; an unsafe endpoint is not saved or restored as a preference; and a known
    credential in a supported request error is replaced with a fixed marker. When an item cannot be handled safely,
    the affected field is omitted or a fixed safe diagnostic is used; raw sensitive content MUST NOT be returned
    as a fallback, and diagnostic handling MUST NOT replace the original analysis result or error. This version
    does not provide generic unknown-secret scanning, credential migration, or a no-leak guarantee for arbitrary
    output channels. Supported scope is limited to: (1) the existing report and final-state configuration summaries;
    (2) CLI preference save/load for the endpoint; (3) the existing get_scrubbed() request-error paths at src/tradingagents/dataflows/net.py,
    the Alpha Vantage common.py get_scrubbed call and its scrubbed notice helper, and the FRED fred.py get_scrubbed
    call including its passthrough 400 error_message path; and (4) warnings produced by these handlers. Provider-internal
    logs, third-party exception frameworks, and any unlisted display path are not included. If a path cannot be
    confirmed, it is listed as out of scope rather than claimed covered. Out of scope for this version: model-generated
    full report bodies, arbitrary third-party logs, raw debug/stream output, the complete API return object, historical
    files, recovery material, and all future outputs. Existing protections remain, but they MUST NOT be described
    as a comprehensive scan of those channels. Configuration summary: reuse the existing run_settings() allowlist
    and do not save the complete configuration. Credential fields such as API key, password, and Authorization do
    not enter the summary. If an allowlisted field contains a known credential value used in this run, omit that
    field rather than keep the original value. Other normal configuration, ticker, date, and model names MUST NOT
    be removed merely for length or shape. Known credentials come only from credentials actually configured or used
    by the application; do not collect all environment variables and do not write a credential registry file. Empty
    strings do not participate in matching. Do not add generic provider-key, JWT, or arbitrary-encoding recognition,
    and do not use "looks like a long string" as a secret test. No rule version, source, effective time, or detection
    counter is required. An exact known-value match may collide with normal content; only the affected field or
    diagnostic is handled, not a whole-output cleanup system. Endpoint preference rule: an ordinary endpoint with
    no embedded authentication may be saved and restored. The system MUST NOT save or restore as a default any endpoint
    containing URL userinfo; containing a query or fragment, whether or not it appears sensitive; having a host,
    path, or other part matching a known credential; or being unparseable. Even an empty query or fragment counts
    when the input explicitly contains its separator, and the system MUST NOT strip query/fragment and save a different
    address. Handling: omit the entire endpoint preference item, state that the address was not remembered and must
    be re-entered next time, and do not save a "***" pseudo-endpoint. Do not extract credentials into .env, environment
    variables, or another store, and do not add secret_ref, a credential resolver, migration, or encryption. The
    rule limits only preference save/restore and does not change the user''s current explicit use of that endpoint.
    For old preferences: do not use an unsafe endpoint as a default on load, do not automatically modify .env or
    migrate credentials, omit the item on the next normal preference save, do not require a startup rewrite, do
    not guarantee erasure of every historical secret on disk, and leave other legal preferences unchanged. Supported
    error handling: in the listed request-error paths, replace a known credential value with a fixed marker such
    as "***". Do not re-attach an unprocessed URL-bearing request/response object, exception chain, or raw exception
    body to the visible diagnostic. Preserve the safe error category and necessary diagnostics. The same exception
    object or original traceback is not required, and no guarantee is added for unknown tokens, arbitrary encodings,
    or external provider logs. A real analysis exception keeps its original flow; outward diagnostics are protected,
    but diagnostic handling does not replace the original analysis error category. Handling failure: if configuration
    or a preference cannot be handled safely, omit the affected field; if a diagnostic cannot be handled safely,
    use a fixed safe message and do not echo the raw exception. A warning-handling failure MUST NOT echo a sensitive
    original value or override the original analysis result or error. No global security failure hard-exits analysis,
    and no incident file, publication rollback, history repair, or security state machine is added. Existing get_scrubbed
    and .env 0600 behavior are preserved as existing protections, not claimed as new results.'
  fit_criterion:
  - id: SR-01-FC01
    input: A controlled configuration containing API key, Authorization, password, endpoint, and normal allowlisted
      fields, and a case where an allowlisted field contains a known test credential.
    expected_result: The configuration summaries in the report and final-state save only allowed fields and contain
      no credential field. An allowed field is omitted when a known credential's literal exact string appears anywhere
      in that field value, including a whole-value match or an occurrence inside a larger value; empty credentials
      do not participate. No encoding recognition, fuzzy matching, or unknown-credential detection is added. Normal
      non-sensitive fields remain, long strings are not indiscriminately removed, and the report body is not scanned.
    verification: Actual configuration output inspection and independent test-secret matching.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: SR-01-FC02
    input: An ordinary endpoint; endpoints with userinfo, query, or fragment; an endpoint with a known credential
      in host or path; an unparseable endpoint; and an existing unsafe preference.
    expected_result: An ordinary safe endpoint can be saved and restored. An unsafe item is not saved and is not
      restored as a default, and the user is told to re-enter it. Query/fragment is not judged by apparent sensitivity.
      No masked pseudo-endpoint is saved, .env is not modified, credentials are not migrated, and other preferences
      remain normal.
    verification: Offline tests of the real preference load/save path; no network call.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: SR-01-FC03
    input: The explicitly supported error-adapter paths, with exception text and attached information containing
      a known credential and normal diagnostics.
    expected_result: The known credential is replaced by a fixed marker and is not re-shown through an unprocessed
      URL, attached request/response, or exception chain; the safe error category and necessary information remain.
      No detection of unknown tokens or arbitrary encodings is claimed.
    verification: Mock request exceptions, actual diagnostic capture, and existing get_scrubbed regression tests.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: SR-01-FC04
    input: Configuration, preference, or error-diagnostic handling failures.
    expected_result: The affected field is omitted or a fixed safe message is used, with no echo of the original
      content. No credential file is added and .env is not modified. Existing get_scrubbed and .env permission protections
      remain, and no scan counter or publication block is added.
    verification: Finite fault injection and relevant existing regression tests; no all-boundary security-scan system
      is established.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  tradeoff: Prioritize limited, auditable credential protection in the explicitly supported configuration and diagnostic
    paths. Accept that no generic unknown-secret scan, arbitrary output-channel guarantee, or credential migration
    is provided. Manifest/history-specific path confinement remains deferred SR-02; existing ticker protection is
    retained.
  implementation_dependencies: []
  constraint_relations: []
  conflicts:
  - 'Redaction reduces debugging detail. Resolution: replace only known credential values and preserve safe error
    categories and necessary diagnostics.'
  - 'Reports and final-state saves need configuration summaries while credential fields must not be saved. Resolution:
    reuse the existing allowlist and omit a field containing a known credential value.'
  - 'Preferences need the endpoint for the next run, but some endpoints carry credentials. Resolution: do not save
    or restore endpoints with userinfo, query, fragment, a known value, or an unparseable form; omit the preference
    item and require re-entry.'
  - 'Exact matching can collide with normal content. Resolution: handle only the affected field or diagnostic, not
    the whole output.'
  - 'Handling failure could leak the original value. Resolution: omit the field or use a fixed safe message, and
    do not echo raw content.'
  assumptions:
  - Supported scope is existing report and final-state config summaries, CLI endpoint preference save/load, the
    listed get_scrubbed request-error paths, and warnings from these handlers.
  - Configuration summary reuses the existing run_settings() allowlist; credential fields and known credential values
    are not saved.
  - Known credentials come only from credentials actually configured or used by the application; all environment
    variables are not collected and no credential registry file is written.
  - Empty strings do not match; no generic provider-key, JWT, arbitrary-encoding, or long-string heuristic is added.
  - An endpoint with userinfo, query, fragment, a known credential in host/path, or an unparseable form is never
    saved or restored as a preference; the item is omitted and re-entry is required.
  - Supported request errors replace known credentials with a fixed marker and do not reattach unprocessed URL-bearing
    objects, exception chains, or raw bodies.
  - If handling fails, omit the field or use a fixed safe diagnostic; handling must not override the original analysis
    result or error.
  - Existing get_scrubbed and .env 0600 behavior are preserved but are not new acceptance results.
  - 'Out of scope: model-generated full report bodies, arbitrary third-party logs, raw debug/stream, the complete
    API return object, historical files, recovery material, and future outputs.'
  notes: 'Revised in v1.43.0 to credential protection in configuration and diagnostics. FC mapping from the prior
    seven-FC version: prior FC01 (all-boundary known-value scan) maps to new FC01 for configuration summaries only;
    prior FC02 (pattern-rule categories) is removed; prior FC03 (audit/restore endpoint split) maps to new FC02
    for endpoint preference handling, with secret_ref/credential-store migration removed; prior FC04 (fail-closed
    scanner and post-commit leak) maps to new FC04 for safe fallback, with post-commit/immutable-evidence handling
    removed; prior FC05 (over-redaction) is removed; prior FC06 (boundary coverage/stream) is removed; prior FC07
    (existing controls plus new scope regression) maps to new FC03 for the listed get_scrubbed paths and FC04 for
    preserved protections. Removed capabilities are not re-expressed as hidden obligations. The current fit criteria
    count is four. At revision v1.43.0, the global FC count was 54. FR-02 is the only implementation dependency;
    the INV-01 binding/publication coupling is removed. Supported request-error paths are net.py get_scrubbed, the
    Alpha Vantage common.py get_scrubbed call and scrubbed notice helper, and the FRED fred.py get_scrubbed call
    including its passthrough 400 error_message path; unlisted provider/third-party paths are not covered. The baseline
    did not establish an actual key leak and no incident is claimed. The prior v1.25.0 approval and validation records
    remain historical; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json,
    docs/req/validation-results.json, and the D2 artifacts still describe the earlier contract and were not updated
    by this revision. No implementation or runtime result is claimed. Current v1.49.0 amendment: FR-02 dependency
    and manifest cases removed; SR-02 is deferred. Historical revision statements above are not current dependencies.
    Scope pre-approval: https://github.com/Howindy/Teamproject-Tradingagents/pull/12#issuecomment-7089283044.'
- id: SR-02
  type: security
  title: Basic confinement of controlled result paths
  priority: Must
  status: deferred
  stakeholders:
  - security_reviewer
  - operator
  - reviewer
  sources:
    origin: Split from SR-01-AC8 (pre-v1.24.0); repository path handling
    evidence:
    - path: TradingAgents/tradingagents/dataflows/symbols.py
      locator: normalize_symbol and safe_ticker_component
      description: Existing ticker normalization and path-component guard; it already provides partial protection
        and is reused rather than redesigned.
      source_type: code
    - path: TradingAgents/tradingagents/reporting.py
      locator: write_report_tree
      description: Report tree writer; user-chosen report locations follow the existing behavior.
      source_type: code
    - path: TradingAgents/tradingagents/graph/trading_graph.py
      locator: default_report_path and propagate
      description: Manifest/report path formation under the configured results directory.
      source_type: code
    - path: baseline/runs/baseline-20261020-01/results/reports/NVDA_20261020_193209/
      locator: report tree
      description: Baseline path-based report tree; the baseline did not establish a path-escape incident and existing
        ticker-component checks already existed.
      source_type: measured_baseline
  problem: 'FR-02 automatically creates the manifest path from the configured results directory and run_id, and
    FR-05 discovers manifests and reads complete_report.md from recorded report references. Without basic component/target
    checking, a crafted run_id or report reference could escape the configured root through traversal, absolute-path
    injection, or an existing symlink. Existing safe_ticker_component protection covers ticker path components but
    not these new controlled result paths. The baseline did not establish an actual path-escape incident.

    '
  statement: 'For FR-02''s automatically generated manifest path and FR-05''s history-report read path, the system
    MUST validate the identifier and actual path ownership to prevent directory traversal, absolute-path injection,
    and escape outside the configured results root through an existing symbolic link. Paths come from controlled
    identifiers and record fields, never from model report prose. Existing ticker path validation remains in place.
    Supported scope is limited to: (1) FR-02''s <results_dir>/<run_id>/run_manifest.json automatic path; (2) FR-05''s
    path for discovering the manifest from run_id and reading complete_report.md from the recorded report reference;
    and (3) the existing ticker-safe-component check used by those paths. This version does not add a cache, checkpoint,
    preference, recovery, cleanup, or quarantine path framework, a report-body path parser, historical proof, cross-run
    evidence authorization, or full artifact validation. Identifier rule: run_id MUST be a single safe path component:
    a non-empty string that does not contain path separators and is neither ".", "..", an absolute path, nor another
    path-injection form. A UUID or a new complex naming protocol is not required. ticker reuses the existing safe_ticker_component-style
    validation; no new symbol system is added and normal business identity is not changed. Trusted root and ownership:
    the results root comes from user/application configuration and is the trusted starting point. Resolve its actual
    location and use it as the ownership basis. A root configured through a link uses the resolved trusted actual
    location as the root; no new authorization approval or link policy is added. Decide candidate ownership by components
    and resolved target, not by string prefix: "/results-other" is not accepted merely because it starts with "/results".
    For a not-yet-created manifest, check the actual location of existing ancestors plus the controlled appended
    components; no check-then-use race guarantee is added. A candidate that resolves outside the root through an
    existing symbolic link MUST be rejected. A legitimate path inside the root is not rejected merely because it
    contains a link, and no new link-exception policy is added. The system MUST NOT silently switch to the current
    working directory or another root. No URL decoding or double-decoding is added when the application does not
    already perform it; the check uses the final path value the application actually uses, without building a generic
    encoding-attack parser. Absolute-path distinction: run_id itself cannot be an absolute path. An existing absolute
    report reference in FR-05 may be read when it still resolves inside the configured root; an out-of-root absolute
    reference is rejected. "Do not accept absolute-path injection" MUST NOT be miswritten as prohibiting every legitimate
    absolute report reference. User-chosen report location: a report save directory explicitly chosen by the user
    follows the existing feature, even when it is outside the results root, and this requirement does not universally
    prohibit it. Model text or report content cannot replace the user''s explicit choice. An out-of-root report
    is not automatically copied into or retrieved by FR-05, and the history read root or authorization is not expanded.
    Existing save code and return behavior are not changed. Failure behavior: if FR-02 cannot form the path safely,
    abandon that manifest write and attempt a safe warning; analysis continues without changing the successful return,
    model calls, or original analysis error, and no alternative directory is used. In FR-05, an illegal run_id is
    a parameter error, an out-of-root report reference is an invalid record, the list follows the existing FR-05
    rule of skipping bad records with a warning, and a direct read is rejected. Out-of-root content is not returned,
    and a rejection is not disguised as successful reading. A user-explicit report save failure keeps existing behavior.
    Diagnostics contain no credentials, raw report body, or unnecessary absolute paths. No security scanner, incident
    file, publication rollback, or global hard-failure rule is added. This version targets a local single-user environment
    with a controlled directory structure that is not maliciously modified concurrently, and it does not promise
    protection against check-then-replace races, hard links, mounts, or every platform link mechanism.'
  fit_criterion:
  - id: SR-02-FC01
    input: Legal run_id/ticker values; empty values, separators, ".", "..", directory traversal, absolute run_id,
      and root-prefix collision cases.
    expected_result: A legal automatic manifest path is inside the configured root. An illegal identifier causes
      no out-of-root creation or write. Existing ticker protection remains and normal business identity is not rewritten.
      An FR-02 path failure only warns while analysis continues, and the directory is not switched.
    verification: Temporary directories, an out-of-root write sentinel, and existing ticker-validation tests.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: SR-02-FC02
    input: Relative and absolute references inside the root, ".." escapes, prefix collisions, an existing symbolic
      link pointing outside the root, and report prose containing another path.
    expected_result: A legal in-root report is readable; an out-of-root resolved reference is not read; report prose
      does not control the target. Errors follow FR-05. The check covers the existing directory structure only and
      does not promise protection against malicious replacement after the check.
    verification: Actual temporary files and links plus an out-of-root read sentinel. If the test environment does
      not support a link mechanism, record it as unverified rather than claiming all-platform coverage; no platform
      matrix is forced.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: SR-02-FC03
    input: An FR-02 path failure, an FR-05 illegal reference, and a user explicitly choosing a report save location
      outside the results root.
    expected_result: FR-02 warns and analysis continues; FR-05 rejects the illegal read. The root or current directory
      is not switched. The user-explicit save location is not prohibited by this requirement but does not automatically
      enter history. Diagnostics contain no credentials or report body. No recovery, quarantine, or recursive cleanup
      is performed.
    verification: Finite entry integration reusing FR-02/FR-05 evidence without establishing duplicate tests.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  tradeoff: Prioritize basic confinement of the controlled FR-02 and FR-05 result paths with component/target checks
    and existing ticker protection. Accept that user-chosen out-of-root report locations, check-then-use races,
    hard links, mounts, and some platform link mechanisms are outside this version. No recovery, quarantine, cleanup,
    historical-proof, or publication-transaction guarantee is added.
  implementation_dependencies:
  - FR-02
  - FR-05
  constraint_relations: []
  conflicts:
  - 'Report prose can contain path-like text. Resolution: paths come only from controlled identifiers and record
    fields, never report prose.'
  - 'A prefix check can accept a sibling root. Resolution: compare components and the resolved target, not string
    prefixes.'
  - 'A link inside the root could still escape. Resolution: reject a candidate that resolves outside the root through
    an existing symbolic link, while allowing legitimate in-root paths.'
  - 'run_id cannot be absolute, but a legitimate report reference can be. Resolution: reject absolute run_id; allow
    an absolute report reference only when it resolves inside the root.'
  - 'A user may choose an out-of-root report location. Resolution: keep the existing user-chosen save behavior,
    but do not automatically retrieve or copy that report into FR-05 history.'
  - 'Path failure could block analysis. Resolution: FR-02 abandons that manifest write with a safe warning and analysis
    continues.'
  assumptions:
  - Supported scope is limited to FR-02's automatic manifest path and FR-05's history-report read path, using the
    existing ticker component check.
  - The configured results root is the trusted starting point; a root reached through a link uses its resolved actual
    location without new approval.
  - Ownership uses components and the resolved target, not string prefixes; a not-yet-created manifest checks existing
    ancestors and controlled appended components.
  - run_id is a single non-empty safe path component; no UUID or new naming protocol is required.
  - An absolute report reference is allowed only when it resolves inside the root; an absolute run_id is never allowed.
  - A user-explicit report save location follows existing behavior and is not automatically included in FR-05 history.
  - No generic encoding decoder, security scanner, incident file, recovery, quarantine, cleanup, or publication
    transaction is added.
  - The threat model is a local single-user controlled directory without malicious concurrent modification; check-then-replace
    races, hard links, mounts, and all platform link mechanisms are not guaranteed.
  notes: 'Revised in v1.44.0 to basic confinement of controlled result paths. FC mapping from the prior two-FC version:
    prior FC01 (all-operation archive/history/recovery confinement) maps to new FC01 for the FR-02 manifest path
    and new FC02 for the FR-05 report-read path; prior FC02 (link/race/platform/credential boundary) maps to new
    FC02 for existing symlink escape and new FC03 for scope/error behavior, with check-then-use race, hard-link/mount,
    all-platform, quarantine, cleanup, historical-proof, and SR-01 credential-scan requirements removed. Removed
    capabilities are not re-expressed as hidden obligations. The current fit criteria count is three. At revision
    v1.44.0, the global FC count was 55. FR-02 and FR-05 are the only implementation dependencies; FR-06 and SR-01
    prerequisites and the INV-01 publication coupling are removed. The baseline already had ticker-component protection
    and did not establish a path-escape incident. The prior v1.25.0 approval and validation records remain historical;
    docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json,
    docs/req/validation-results.json, and the D2 artifacts still describe the earlier contract and were not updated
    by this revision. No implementation, platform certification, or runtime result is claimed.'
conflict_resolutions:
- id: C-01
  requirements:
  - FR-02
  - SR-01
  description: FR-02 needs a configuration record; SR-01 forbids credential values in supported outputs.
  resolution: Future/deferred interaction only, not a current implementation task. FR-02 records a sanitized configuration
    allowlist; SR-01 omits known credential values in the listed summaries. No zero-match scan count is required.
- id: C-03
  requirements:
  - FR-03
  - INV-01
  description: A user-facing availability summary can omit detail that another artifact retains.
  resolution: FR-03 consumers may use the last completed result as of their own time. INV-01 does not compare every
    availability field or require identical snapshots.
- id: C-04
  requirements:
  - FR-03
  - SB-01
  description: FR-03 reports basic data completeness; SB-01 may reduce actionable output when its check does not
    pass.
  resolution: A missing necessary item in the FR-03 summary triggers SB-01 REVIEW. Supplementary-data failures and
    not_applicable do not by themselves block.
- id: C-05
  requirements:
  - FR-02
  - INV-01
  description: An auxiliary run record may not carry enough detail for the formal consistency invariant.
  resolution: Future/deferred interaction only, not a current implementation task. The FR-02 manifest is auxiliary
    and is not part of INV-01's rating or conclusion comparison; no new manifest binding field is added.
- id: C-06
  requirements:
  - FR-01
  - FR-02
  description: Reuse reduces repeated work, while the run record reports only basic analysis-scoped counts.
  resolution: Future/deferred interaction only, not a current implementation task. FR-01 run-scoped reuse adds no
    counter or provenance obligation to FR-02; the manifest reports only its existing basic call counts. Existing
    vendor-cache behavior is unchanged.
- id: C-07
  requirements:
  - FR-02
  - FR-01
  - SB-01
  description: Recording and checking add work to a latency-sensitive run.
  resolution: Future/deferred interaction only, not a current implementation task. The running record is attempted
    at analysis start and updated at completion; any manifest failure only warns and never blocks model calls. The
    SB-01 check is deterministic and calls no model.
- id: C-09
  requirements:
  - FR-04
  - SB-01
  description: A deterministic portfolio-risk limit can reduce actionable output, and a separate risk gate would
    fragment final authority.
  resolution: FR-04 computes the risk result. SB-01 consumes that already-generated result and does not recompute
    it; SB-01 forms the final rating but is not a publication authority.
- id: C-11
  requirements:
  - FR-04
  - FR-03
  - SB-01
  description: Coverage failure and portfolio-risk failure are independent blocking conditions and could be ordered
    differently across entry points.
  resolution: SB-01 retains a short reason list. It does not add primary/secondary priority, force a failed run
    status, or recompute risk.
- id: C-12
  requirements:
  - FR-02
  - FR-06
  description: A recovery mechanism can introduce a second commit authority or a separate archive transaction.
  resolution: Future/deferred interaction only, not a current implementation task. FR-06 is deferred and, if re-enabled,
    only completes a saved complete_report.md; it creates no commit authority, archive transaction, or manifest
    change.
- id: C-13
  requirements:
  - FR-05
  - FR-02
  description: History can mix old report files with a newer run.
  resolution: Future/deferred interaction only, not a current implementation task. A report enters FR-05 history
    only through its FR-02 completed-manifest registration. The read returns the current registered merged Markdown
    text and does not guarantee immutability or prevent later overwrite.
- id: C-15
  requirements:
  - FR-05
  - SR-02
  description: History report references can escape the results root.
  resolution: Future/deferred interaction only, not a current implementation task. FR-05 and SR-02 limit the history
    lookup to references that resolve inside the configured results root. This is a path boundary, not credential
    scanning.
- id: C-16
  requirements:
  - FR-02
  - FR-06
  description: Recovery could be assumed to duplicate or mutate trading-memory policy.
  resolution: Future/deferred interaction only, not a current implementation task. FR-06 is deferred and, if re-enabled,
    completes only complete_report.md; it does not recover or modify memory.
- id: C-19
  requirements:
  - FR-07
  - FR-03
  description: A downstream brief can drop the FR-03 program availability summary while meeting a character limit.
  resolution: The deferred FR-07 summary and the FR-03 program availability summary are distinct. The configurable
    character limit does not truncate the FR-03 summary; no metric block or budget engine is involved.
- id: C-20
  requirements:
  - FR-07
  - CR-01
  description: A brief can become a second formal context source or claim unmeasured token savings.
  resolution: The current deferred FR-07 keeps the original full reports. Any benefit can only be observed by the
    deferred CR-01 comparison; no formal artifact or publication protocol is added.
- id: C-21
  requirements:
  - FR-02
  - PR-01
  description: The auxiliary run record is functional; its write cost is a separate deferred measurement.
  resolution: Future/deferred interaction only, not a current implementation task. FR-02 owns the auxiliary manifest.
    PR-01 is deferred and would measure complete create and update operations with 20 samples each; thresholds remain
    undetermined and no paired overhead benchmark is retained.
- id: C-22
  requirements:
  - FR-07
  - CR-01
  description: The brief is functional delivery; net token/cost improvement is a separate cost observation.
  resolution: The deferred FR-07 function and the deferred CR-01 measurement are separate. Neither adds a mandatory
    semantic-fidelity or quality threshold.
- id: C-25
  requirements:
  - SR-01
  - SR-02
  description: Credential leakage and path escape have different threats and tests.
  resolution: Future/deferred interaction only, not a current implementation task. SR-01 covers limited credential
    protection in listed paths; SR-02 covers a limited result-path boundary. Neither is a general scanner or all-operation
    protection guarantee.
- id: C-26
  requirements:
  - FR-10
  - FR-03
  - SB-01
  description: FR-10 produces explicit n/a metric rows and uses SEC/price adapters while FR-03 and SB-01 govern
    data completeness and final recommendations.
  resolution: FR-10 does not compute FR-03 completeness, add new supported FR-03 observation paths, or introduce
    an SB-01 formal-rating veto.
- id: C-27
  requirements:
  - FR-10
  - FR-07
  description: Personal development records used FR-07 for financial metrics, whereas current D1 uses FR-07 for
    deferred analyst briefs.
  resolution: FR-10 carries deterministic disclosed financial metrics; current deferred FR-07 remains analyst briefs
    and is not activated by FR-10.
moscow:
  must:
  - FR-01
  - FR-02
  - FR-03
  - FR-04
  - FR-05
  - FR-06
  - FR-07
  - FR-10
  - SB-01
  - INV-01
  - SR-01
  - SR-02
  should:
  - PR-01
  - CR-01
  could: []
  wont:
  - id: StockTwits-alternative
    reason: The 403 root cause is unknown and no keyless replacement has been validated.
  - id: SEC-point-in-time-profile
    reason: Current SEC classification fields are not proven to be historical vintages and could leak later information.
  - id: parallel-risk-perspectives
    reason: It changes debate semantics and is outside the simplified D1 scope.
  - id: LLM-replay-cache
    reason: It can mask data or model changes and is outside the D1 scope.
  - id: full-exchange-calendar
    reason: It adds a new dependency; D1 does not require a calendar service.
  - id: multi-user-encryption
    reason: The D1 deployment is a single-user local tool; this is outside scope.
  rationale: 'All 14 IDs / 65 FCs retained. Current active scope is five requirements / 28 FCs: FR-03, FR-04, FR-10, SB-01, INV-01.
    Nine deferred requirements / 37 FCs: FR-01, FR-02, FR-05, FR-06, FR-07, SR-01, SR-02, PR-01, CR-01. Must/Should indicates priority if activated, not current acceptance. Six-active scope pre-approved in
    PR #12 comment 7089283044; FR-10 preparation and test specification pre-approved in PR #14 comment 7099714477.'
