      source_type: code
    - path: TradingAgents/tradingagents/graph/trading_graph.py
      locator: default_report_path; record_decision; save_reports
      description: API report export uses a second-resolution path. CLI/API final results pass through record_decision;
        archiving is not automatic there.
      source_type: code
    - path: TradingAgents/tradingagents/reporting.py
      locator: _SECTIONS; _report_parts; _header; write_report_tree
      description: A fixed section map renders into existing directories without a complete-bundle commit or recovery
        snapshot; headers use the current clock.
      source_type: code
  problem: Path reuse can replace the result of a previous completed analysis.
  statement: A committed archive MUST never be overwritten. One run ID maps to one immutable snapshot hash; repeated
    submission with the same ID/hash is a no-op and different content for an existing ID is RUN_ID_CONFLICT.
  acceptance_criteria:
  - id: INV-03-AC1
    input: Existing committed ID with same-content and changed-content requests.
    expected_result: Changed committed bytes = 0; duplicate commits = 0; changed content returns RUN_ID_CONFLICT.
    verification: 'T-RAR-03 and T-RAR-07: forced collision and repeated recovery; compare complete directory digests.'
    zero_tolerance: true
    measurement_status: not_measured
  metric: null
  dependencies: []
  conflicts:
  - Exclusive publication and validation consume I/O; zero violations takes precedence over throughput.
  assumptions:
  - One Windows host and an ordinary local NTFS archive root; no cloud synchronization or network share.
  - The source is a completed analysis result; report prose is untrusted data and never controls paths or commit
    state.
  notes: Specified behavior and acceptance targets; application implementation and benchmark results are not claimed.
- id: INV-04
  type: invariant
  title: Single-run report section isolation
  priority: must
  status: draft
  stakeholders:
  - analyst
  - operator
  source:
    origin: Static inspection of main at 2c8996e0e7aec5d6550a52d386cccba32f86ac94
    evidence:
    - path: TradingAgents/cli/run.py
      locator: _run_directory; save_report_section_decorator; run_analysis
