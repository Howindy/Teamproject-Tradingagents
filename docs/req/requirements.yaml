schema_version: "1.0"

document:
  id: "D1-REQ"
  title: "D1 Requirements: Data Availability, Safety Gate, Portfolio Risk, Financial Metrics, Downstream Brief, Archive Retrieval, Recovery, and Audit Records"
  version: "1.14.1"
  status: "approved"
  date: "2026-11-10"
  language: "en"
  description: >
    This document defines the approved D1 requirements for the TradingAgents
    baseline. It records the product narrative, the unified requirement
    registry, traceability to the repository and baseline, MoSCoW decisions,
    conflict resolutions, assumptions, open questions, and validation state.
    The six requirements in scope.approved_ids are the approved D1 baseline;
    the two draft requirements in scope.draft_ids are included in this registry
    pending human approval and do not change the approved baseline. Version
    1.1.0 revises FR-01 to limit logical query executions rather than external
    requests, defines data_query_key, and adds concurrency, terminal-outcome,
    vendor-cache, retry/fallback, and offline/live acceptance criteria. Version
    1.2.0 revises FR-02 to define the run lifecycle, a concrete manifest schema,
    identity/path coverage, measurement boundaries, missing-token handling,
    end-to-end overhead, and write-failure integrity. Version 1.3.0 revises
    FR-03 to define the minimal availability record, source identity, closed
    record/requirement status sets, the effective critical profile defaults,
    fallback clearing, multi-query aggregation, and deterministic reporting.
    Version 1.4.0 revises SB-01 to define the trusted gate input, the formal
    decision body, model-proposal separation, the complete blocked-input
    decision table, fail-closed gate-failure behavior, all formal and
    intermediate output boundaries, and entry-point coverage. Version 1.5.0
    revises INV-01 to define the completed checkpoint, artifact binding and
    per-artifact contract, canonicalization, source-status comparison
    granularity, legal fallback versus silent substitution, retry and partial-
    write behavior, and the separate memory decision/settlement lifecycle.
    Version 1.6.0 revises SR-01 to separate known-secret from versioned pattern
    checks, define the fixed scan scope and its limits, resolve the preference
    audit/restore endpoint conflict, add fail-closed failure behavior, preserve
    existing scrub and .env controls, and add over-redaction controls. Version
    1.7.0 renumbers the requirement IDs to match their types: FR-01, FR-02, and
    FR-03 for functional requirements, SB-01 for safety, INV-01 for invariant,
    and SR-01 for security. No requirement semantics changed in that renumbering.
    Version 1.8.0 synchronizes the manifest schema with INV-01, SB-01, FR-03, and
    SR-01; adds completed-state schema constraints; refines cache A/B comparison,
    canonicalization and hash inputs, memory entry binding, synthetic missing
    component records, mandatory capability ownership, security incident records,
    and external manifest timing. Version 1.9.0 adds the gate error stage,
    separates write-scan from run-scan results, carries critical profile,
    coverage snapshot, provenance and input hashes in the manifest, links
    evidence to multiple requirement components, counts HTTP requests, selects
    review wording by gate reason, fixes the run clock, and defines same-day
    rerun, memory-disabled, cross-field semantic, and empty query-set rules.
    Version 1.10.0 merged two draft requirements from Jiang Yiyang's proposal:
    FR-04 deterministic portfolio-risk evaluation of a structured candidate
    trade, and INV-02 deterministic portfolio-risk authority and zero unsafe
    approvals. Version 1.11.0 rewrites both requirements around one
    applicability rule, explicit first-entry and add-long fields, timezone-aware
    historical valuation cutoff, exact amount/price/cash/currency consistency,
    a locatable policy snapshot with provisional-threshold boundaries, current
    versus reused historical memory evidence, and separate cache and
    risk-policy evaluations. Version 1.12.0 fixes the FR-04-AC1 arithmetic,
    separates normalized risk-input artifacts from safe invalid-input
    diagnostics, defines the unique timezone-aware valuation cutoff and future
    analysis-date rejection, fixes the combined coverage-failure plus
    evaluator-exception result, and adds local evidence fixtures with digest,
    metric, policy, tamper, wrong-metric, and invalid-input checks. The 30%
    concentration and 5% stop-distance defaults remain provisional until human
    approval. Version 1.14.0 merges the corrected valuable parts of yhx:
    FR-07 deterministic derived financial metrics from structured filing facts
    and FR-08 unified downstream analyst-report brief. Version 1.13.0 merges the adoptable parts of pxs: FR-05 historical
    formal-publication retrieval, FR-06 startup recovery of pending formal
    publication, and QR-02 a provisional recovery-performance target. It merges
    pxs identity, section-isolation, truthful-completion, and model-free
    idempotent-recovery rules into FR-02, INV-01, and the existing publication
    contract; it reuses SR-01 for credentials and adds path-safety and
    export-conflict criteria. Version 1.14.0 adds FR-07 structured-fact
    financial metrics with period identity, TTM formulas, program metric blocks,
    narrative-conflict disclosure, and independent reference requirements, and
    FR-08 a downstream brief view with canonical gaps, separate mandatory and
    compressible budgets, downstream-role boundaries, and controlled token/quality
    evaluation. Version 1.14.1 corrects fiscal-period matching and coverage,
    fact subject/accession identity, metric persistence and model-free recovery,
    metric-claim conflict scope, brief budget precedence and audit metadata, and
    unified quality/lifecycle acceptance. New requirements remain draft in
    scope.draft_ids.
  baseline_ref: "baseline/runs/baseline-20261020-01"

scope:
  approved_ids:
    - FR-01
    - FR-02
    - FR-03
    - SB-01
    - INV-01
    - SR-01
  draft_ids:
    - FR-04
    - FR-05
    - FR-06
    - FR-07
    - FR-08
    - INV-02
    - QR-02
  in_scope:
    - "Run-scoped single execution of identical logical data queries, with separate retry and fallback budgets and explicit vendor-cache semantics."
    - "One lifecycle-complete run manifest per run invocation, with identity, sanitized configuration, data-source status, measurement counters, token usage, timing, safety-gate result, artifact hashes, and running/completed/failed states."
    - "One canonical run-scoped data-availability state with an effective critical profile, closed record and requirement status sets, deterministic aggregation, fallback clearing rules, and separate critical-gap and non-critical-limitation reporting."
    - "A deterministic fail-closed safety gate over a trusted coverage snapshot that produces a formal decision, keeps the unapproved model proposal separate, handles incomplete or contradictory inputs, and returns REVIEW with a formal manual-review notice when it blocks or fails."
    - "One bound formal result across report, manifest, final-state, and memory: identical run_id, record_version, decision_digest, gate/formal-decision fields, coverage and gap summary, canonical provenance, and memory lifecycle rules."
    - "Secret-safe app-controlled run records through separate known-value and versioned-pattern checks, fixed scan scope, audit/restore endpoint rules, fail-closed failure behavior, and over-redaction controls."
    - "Caller-supplied, point-in-time portfolio and structured new-long or add-long candidate-trade risk evaluation before formal finalization, with exact cash, amount, price, currency, and valuation checks, a versioned policy snapshot, and deterministic projected-concentration and stop-distance checks invoked by the shared SafetyGate."
    - "One consistent current-run portfolio-risk result across formal artifacts, with locatable input and policy evidence, fail-closed handling for missing, invalid, stale, inconsistent, insufficient-cash, or unsupported risk input, distinct reused historical memory evidence, and no second final decision authority."
    - "Historical formal publication listing and retrieval by ticker/date or run_id, with intersection filters, deterministic ordering, bounded results, read-time revalidation, and a verified versioned section manifest."
    - "Startup recovery of pending formal publication from saved, verified, redacted formal records and fixed render inputs, without repeating analysis or introducing a second commit authority."
    - "A provisional bounded recovery-performance target with a fixed workload, 30 trials, and nearest-rank p95 under documented local-filesystem conditions."
    - "Deterministic derived financial metrics from structured SEC filing facts, including period identity, TTM formulas, code-generated metric blocks, and narrative-conflict disclosure."
    - "A unified downstream analyst-report brief for the five debate roles, with canonical gap and metric content, separate mandatory/compressible budgets, and controlled token/quality evaluation."
  out_of_scope:
    - "Replacing StockTwits with another social vendor; the 403 root cause is not yet established."
    - "A point-in-time company profile sourced from SEC filings; the current filing fields are not proven to be historical vintages."
    - "Parallel Bull/Bear or risk-analyst execution; it changes debate semantics and requires a separate A/B evaluation."
    - "A full exchange calendar; the approved D1 scope does not include a new calendar dependency."
    - "Multi-user authentication, encryption at rest, and access control."
    - "Portfolio simulation, order execution, position accounting, slippage, fees, and any guarantee of maximum realized loss."
    - "Short, derivative, leveraged, multiple-order, and non-stock portfolio-risk policies in the first version; FX conversion between currencies."
    - "Enabling TypeSafe Jev screening by default."
    - "A production LLM response cache; replay caching remains outside D1."
    - "Graph resume redesign, a separate archive transaction, a standalone commit marker, legacy report migration, full-text indexing, automatic retention cleanup, multi-host/cloud storage, and power-loss guarantees."
    - "Direct vendor bypass for derived metrics, deriving a single quarter by subtraction, free-form model arithmetic as the numeric authority, non-SEC fundamentals vendors, and a second context assembler for the downstream brief."
  assumptions:
    - "The system remains a single-user local tool for D1."
    - "The effective critical set is generated from documented defaults for asset type, analysis mode, and enabled capabilities, then adjusted only by explicit recorded overrides; it is not left to implementation discretion."
    - "REVIEW is an acceptable terminal state for a run with critical data gaps or a blocked gate; it is a non-tradeable sentinel, not a sixth five-tier rating."
    - "The per-run cache is isolated between concurrent runs; existing vendor caches remain cross-run and are recorded as vendor-cache hits."
    - "A running manifest is written before model calls and atomically finalized after analysis; terminal writing does not block model calls."
    - "The portfolio-risk evaluator is a pure deterministic service invoked by the existing SafetyGate; it does not create a second final decision authority."
    - "Portfolio value, cash balance, current asset quantity and value, valuation price, order quantity and value, entry price, stop price, currency, and valuation time are supplied by the caller/application as validated decimals and an ISO 8601 timezone-aware timestamp; model prose and rendered portfolio text are never authoritative."
    - "The risk policy is a locatable snapshot with actual thresholds, freshness window, precision rule, threshold status, human approval reference, and digest; provisional values are labeled provisional and never described as approved."
    - "Historical valuation cutoff is the end of run_clock.as_of_date in run_clock.timezone at 23:59:59.999999 with that offset; current-date cutoff is run_clock.now_utc."
    - "The 30% concentration and 5% stop-distance defaults are provisional classroom values, not approved financial policy; they must be versioned and exposed as provisional until human approval."
    - "A passed risk check is not a guarantee of maximum loss or investment outcome; stop distance is a price-distance ratio only."
    - "Stock Buy and Overweight always enter risk review, including first-entry new_long and add_long proposals; crypto and other non-stock assets use not_applicable, while missing or unsupported stock candidates block."
    - "The team run_id is the publication identity; UUIDv4 is not required."
    - "Terminal manifest completed plus read-time INV-01 is the only formal-publication commit condition; no independent commit marker is authoritative."
    - "Recovery continues the existing formal publication process, is not graph resume, and uses only saved verified redacted formal records and fixed render inputs."
    - "Historical visibility is limited to verified committed publications; analysis completion alone is not publication success."
    - "The QR-02 recovery target is provisional, and Windows/NTFS is not the sole supported platform."
    - "Derived metrics use structured SEC filing facts through the existing unified data access and FR-01 counters; a non-NVDA reference manifest is frozen before implementation."
    - "The downstream brief is a view for the five debate roles only; mandatory canonical gaps, metric blocks, sources, and safety constraints are never truncated, and token savings remain unmeasured until the controlled evaluation runs."
    - "The repository analysis and the baseline artifacts are the authoritative source for this document."

stakeholders:
  - id: analyst
    name: "Research analyst"
    interest: "Needs reports that distinguish retrieved evidence from missing or fallback evidence."
  - id: trader
    name: "Trader"
    interest: "Needs a final decision that is safe when critical data is absent."
  - id: reviewer
    name: "Reviewer"
    interest: "Needs reproducible records that connect a decision to its sources and configuration."
  - id: operator
    name: "Operator"
    interest: "Needs bounded duplicate requests, clear run records, and no credential leakage."
  - id: security_reviewer
    name: "Security reviewer"
    interest: "Needs deterministic output checks and safe handling of external text and secrets."

definitions:
  data_query_key: >
    The stable, normalized identity of a logical data query: method name, asset
    type, normalized instrument or topic, analysis date, requested window or
    lookback, method-specific parameters such as indicator, series, frequency,
    or limit, vendor selector digest, and cache_key_version. Arguments that
    normalize to the same vendor resource share one key. Retries, fallback
    vendor attempts, call site, and timing do not change the key.
  logical_query: >
    The normalized query identity defined by data_query_key. Two callers with
    the same key are the same logical query within one run, regardless of which
    analyst, tool, or prefetch path issued them.
  query_execution: >
    One run-scoped attempt to satisfy a logical_query. It owns the retry and
    vendor fallback chain and produces one cached terminal outcome. It is not
    the same as an external HTTP request count.
  vendor_cache: >
    A pre-existing cross-run cache inside a vendor adapter, such as the Yahoo
    OHLCV cache or the SEC EDGAR JSON cache. A vendor-cache hit is recorded on a
    query_execution and is distinct from run-cache reuse.
  availability_record: >
    The minimal executed-query availability unit: one run-scoped query_execution
    identified by data_query_key and record_kind = executed. It records tool,
    category, capability, component, supports links, requested and observed
    window, status, reason_code, record_count, ordered attempt results with
    http_request_count, tried and serving sources, fallback state, cache kind,
    and provenance. Exactly one executed availability_record exists per
    data_query_key per run; supports maps the same evidence to every requirement
    component it satisfies.
  component_missing_record: >
    A synthetic record for a critical component that has no query_execution. Its
    identity is (run_id, requirement_id, capability, component) and record_kind =
    component_missing. It has data_query_key = null, attempts = [], status =
    not_attempted, and source = none. Exactly one component_missing_record
    exists per missing critical component. It participates in coverage, gaps, and
    summaries but is excluded from query_executions, external_requests,
    retry_attempts, fallback_attempts, vendor_cache_hits, and run_cache_hits.
  source: >
    The stable logical provider identity from the vendor registry, such as Yahoo
    Finance, SEC EDGAR, FRED, Polymarket, StockTwits, or Reddit. It is not the
    tool name, category, URL, or endpoint. A record keeps attempted_sources in
    order and a nullable serving_source; serving_source is set only when that
    provider returned usable evidence.
  critical_requirement: >
    One entry in the effective critical profile: requirement_id, capability,
    required components, per-component query rule (all, any, or min:N), minimum
    record count, window and point-in-time rule, fallback policy, and
    min_successful_components. The profile is derived from asset type, analysis
    mode, enabled capabilities, and explicit overrides, then recorded for the run.
  record_status: >
    Closed set: success, insufficient_evidence, no_data, unavailable, withheld,
    not_configured, not_attempted, error. success requires the evidence contract,
    not merely a completed call; insufficient_evidence covers too few records,
    partial or stale windows, or undated data barred by the point-in-time rule.
  requirement_status: >
    Closed set: satisfied, degraded, missing, not_required. satisfied means the
    component success count meets the requirement rule; degraded means some but
    not enough; missing means none; not_required means the capability is outside
    the effective critical profile.
  critical_gap: >
    A structured record for a critical requirement with requirement_status
    degraded or missing: requirement_id, capability, requirement_status,
    gap_reason from the closed set, missing_components, and provenance.
    critical_gap_ids is the separate ordered list of those requirement IDs.
    Non-critical gaps are limitations, not critical gaps.
  coverage_status: >
    Closed set: complete or partial. complete means every critical requirement
    has requirement_status satisfied. partial means at least one critical
    requirement is degraded or missing.
  critical_profile: >
    The effective critical profile computed once at run start from asset type,
    analysis mode, enabled capabilities, and recorded overrides. It contains
    profile_version, profile_source, contract_version, analysis_mode, asset_type,
    the ordered critical requirements, and profile_hash. Each requirement lists
    requirement_id, capability, query_rule, min_successful_components,
    min_record_count, fallback_policy, criticality, and per-component contracts:
    component, window_rule, min_record_count, point_in_time_rule, and required.
    It is stored in the manifest and referenced by the coverage_snapshot.
  inheritance_record: >
    Resume/inheritance fields in the manifest: inherited, origin_run_id,
    origin_attempt_id, inherited_counters (separate from current execution
    counters), inherited_evidence_digest, and snapshot_rebound_from. Inheritance
    is allowed only for verified checkpoint evidence from the same logical run
    lineage, never for ordinary cross-run cache reuse.
  run_clock: >
    The fixed run clock: as_of_date, now_utc, timezone, clock_source, derived
    analysis_mode, and mode_source. The mode is computed once at run start from
    this clock, never from a later call to today. as_of_date MUST NOT be after
    the current date in run_clock.timezone; a future analysis date is rejected
    before risk evaluation and before formal analysis with a
    future_analysis_date startup failure, and MUST NOT be silently clipped to
    the current date. Resume/replay inherits the original clock unless a
    clock_override is recorded.
  valuation_cutoff: >
    The unique timezone-aware valuation cutoff:
    min(run_clock.now_utc, end_of_day(run_clock.as_of_date, run_clock.timezone)),
    where end_of_day is 23:59:59.999999 on as_of_date with that timezone offset.
    A future as_of_date is rejected before this calculation; it is never
    clipped. valuation_time MUST be at or before this cutoff and within
    max_valuation_age_seconds before it.
  run_id: >
    The team's canonical identity for one run invocation. It is unique per
    invocation, safe as a path component, preserved across publication retries
    and startup recovery, and does not require UUIDv4. A resume is a new
    invocation with a new run_id and parent_run_id; a publication retry or
    recovery preserves the original run_id.
  formal_publication: >
    The lifecycle of one formal publication: pending_snapshot, snapshot_ready,
    publishing, committed, failed, or quarantined. committed is exactly the
    terminal manifest run_status = completed plus successful read-time INV-01
    validation. No independent commit marker is authoritative. analysis_complete
    means only that the graph finished producing a proposal; history_visible
    means the committed publication was revalidated by retrieval. After commit,
    the permanent publication_snapshot remains authoritative and readable;
    temporary pending recovery material may be cleaned without changing history
    visibility.
  publication_snapshot: >
    The permanent formal record set for one committed publication: formal
    decision, artifact_binding, terminal-manifest identity, report_section_manifest,
    complete report, final-state, risk evidence and policy references, the
    required memory entry or binding, metric_evidence_bundle when FR-07 applies,
    schema/renderer versions, and artifact hashes. It is retained after commit and is the source for history retrieval
    and every formal reference. It is distinct from the temporary recovery
    envelope; all formal references MUST resolve against this permanent snapshot
    after pending recovery material is cleaned.
  recovery_snapshot: >
    A complete, durably written, read-back-verified, redacted set of formal
    records and fixed rendering inputs for one run_id. Recovery guarantee begins
    only at snapshot_ready. It MUST include the formal decision and
    artifact_binding, terminal-manifest candidate identity, report_section_manifest
    and fixed rendering inputs, the risk input and policy references actually
    used, the original required memory decision identity and reserved entry
    version, and the required schema/renderer versions. References MUST resolve
    inside the snapshot and have validated digests; recovery MUST NOT depend on
    a separately lost external file. A missing, corrupt, or unsupported snapshot
    is quarantined and is not published as success. Recovery uses no model,
    external data, analysis graph, settlement, or reflection. The
    recovery_snapshot is a temporary pending-recovery envelope; after commit the
    permanent publication_snapshot is authoritative and remains readable. The
    temporary envelope may be cleaned without affecting history or formal
    references.
  recovery_claim: >
    An atomic per-run_id claim or lease used by startup recovery, carrying an
    owner identity and a fencing token. One worker is active per run_id; duplicate
    startup or duplicate claim does not create a second publication; a stale
    claim can be reclaimed after its lease expires, and takeover increments the
    fencing token. Every publication or memory write MUST check current claim
    ownership and fencing token at commit; a worker that lost its lease or was
    superseded MUST be rejected without writing. Task failure is isolated;
    retries are bounded; at most one successful formal publication exists per
    run_id and decision identity.
  report_section_manifest: >
    The ordered list of report sections generated for one committed publication
    from a versioned renderer and the current-run capability set. Each section
    records path, agent or state fields, byte size, and SHA-256; the complete
    report records its path and digest. Only applicable non-empty sections are
    listed. Foreign, stale, or old-run files are forbidden. Retrieval revalidates
    the manifest and section digests on read, and the formal report uses the
    gated formal decision with process suggestions marked unapproved.
  history_query: >
    A historical formal-publication query with optional ticker and
    analysis_date filters. Ticker is trimmed and canonically normalized; date
    is strict YYYY-MM-DD and is never defaulted; both filters use intersection
    semantics. Order is analysis_date descending, ticker ascending, run_id
    ascending. limit is an integer (not boolean) from 1 to 500 with default 50;
    offset is an integer (not boolean) >= 0 with default 0. Zero, negative,
    boolean, non-integer, or over-limit limit, and negative or non-integer
    offset, return INVALID_FILTER. The response reports total_matches, returned,
    truncated, and next_offset; next_offset is null when no more matches exist,
    otherwise it is offset + returned for the next page. Unknown ticker or no
    match returns an empty list; unknown run_id returns NOT_FOUND; corrupt
    record returns CORRUPT_RECORD.
  history_reference_closure: >
    The transitive proof required when a verified_package follows a
    reused_decision_ref. It MUST include source_run_id, source_decision_id,
    source_entry_digest, the source terminal manifest hash, source publication
    proof (terminal manifest completed plus read-time INV-01 evidence), source
    decision content or digest, and any source artifact_binding needed to verify
    the reference. If any source proof is unavailable, the package MUST be
    labeled historical_reference_unverified and its independent verification
    scope is limited to the current run; it MUST NOT claim full-history INV-01
    and MUST NOT depend on files that exist only on the original machine.
  export_target: >
    A user-selected destination for an additional report export. Two modes are
    distinct: display_copy contains the verified complete report, section
    manifest, and binding summary and is not independently verifiable as a full
    formal package; verified_package additionally contains the current terminal
    manifest, final-state, risk evidence and policy references, memory entry or
    binding, every artifact needed for read-time INV-01, and a
    history_reference_closure for every followed reused_decision_ref. If any
    historical source proof is unavailable, the package is labeled
    historical_reference_unverified and its independent verification scope is
    limited to the current run. It MUST NOT depend on original-machine-only
    historical files. A non-empty target returns EXPORT_CONFLICT and is never
    overwritten in either mode. Legacy
    report trees are not automatically migrated, indexed, or modified. Path
    confinement and credential protection reuse SR-01.
  financial_fact: >
    A structured SEC filing fact: fact_id, subject_id (CIK or equivalent issuer
    identity), accession_no, locatable filing_ref, concept, value, unit, currency,
    period_start, period_end, fiscal_year, fiscal_quarter, span
    annual/quarter/ytd/instant, cumulative_duration_days, filed_at, source, sign
    convention, and restatement lineage (restates_fact_id or supersedes). CIK
    identifies the subject but NEVER substitutes for the accession and filing_ref.
    Display CSV text, column position, and date proximity are not the
    authoritative fact identity.
  financial_period: >
    A period identity defined by subject_id, period_start, period_end,
    fiscal_year, fiscal_quarter, span annual/quarter/ytd/instant,
    cumulative_duration_days, and coverage_interval. Annual, quarterly,
    year-to-date, and point-in-time periods are distinct; a near-by date is a
    different period unless the structured identity is the same. Fiscal-year
    continuity is explicit: a current YTD period starts after the latest annual
    period end, its fiscal_year is the next fiscal year, and a prior-year YTD
    comparison has fiscal_year - 1, the same fiscal_quarter, the same span, and a
    matching cumulative duration. TTM periods therefore do NOT share start or end
    dates; they share fiscal position and cumulative coverage. Restatements
    retain period identity and a filed_at/accession lineage.
  derived_metric: >
    One deterministic metric result: metric_id, name, formula_id, formula_version,
    fact_schema_version, metric_policy_version, input fact_ids, period identity,
    unit, currency, precision and rounding rule, value or structured n/a reason,
    calculation status computed/approximate/n/a, and source fact references. A
    metric is verified only at the metric level when all inputs and the formula
    validate; it does not verify the whole analysis. Formula and policy versions
    are persisted with the result.
  metric_block: >
    The code-generated block appended to the formal numeric output. It contains
    stable metric_id values, source fact_ids, filing_refs, formula_id and
    formula_version, period, value or n/a reason, and calculation status. It is
    the authoritative numeric source for the listed derived metrics; model
    narrative cannot override it. It is not a second safety gate or a validation
    of the investment conclusion. The block and its metric_evidence_bundle are
    persisted in the formal publication_snapshot and recovery_snapshot; recovery
    reads them and MUST NOT refetch filings or call a model.
  metric_conflict: >
    A disclosed mismatch between a program-computed derived metric and a model
    claim that is reliably mapped by an explicit metric_id or a declared
    structured claim. Detection is limited to claims with a recognizable
    metric_id, period, and parseable numeric value; arbitrary natural-language
    financial numbers are not claimed to be comprehensively checked. The report
    MUST show the conflict, label the contradicted claim as unverified, and MUST
    NOT present the wrong number as authoritative. The metric_block remains the
    numeric authority.
  metric_claim: >
    A structured or reliably mapped model statement naming one metric_id, its
    period identity, and a parseable numeric value. Only such claims participate
    in deterministic metric-conflict detection; free-form prose without a
    recognizable metric_id is outside that detection scope and may be labelled
    as unscoped narrative.
  metric_evidence_bundle: >
    The persisted financial evidence for one formal publication: structured
    facts (with subject_id, accession_no, filing_ref, periods, units, currencies,
    filed_at, and restatement lineage), formula_version, fact_schema_version,
    metric_policy_version, the derived metric_block, input_digest, and
    result_digest. It is stored in the permanent publication_snapshot and in the
    recovery_snapshot. Recovery MUST use this bundle without refetching filings
    or calling a model; a missing or invalid bundle blocks a metric-dependent
    publication rather than triggering a live fetch.
  downstream_brief: >
    A downstream context view of analyst reports for the Bull Researcher, Bear
    Researcher, and the three risk debaters only. It contains mandatory
    non-compressible content (canonical coverage gaps, required metric block and
    source references, safety constraints) and compressible narrative (stance,
    key levels or triggers, conclusion). It is not a formal artifact and never
    replaces or mutates the full report, formal record, history, or recovery
    material. Its source summary, policy version, resolver handle, mandatory
    digests, fallback reason, budget decision, and omitted compressible
    information are recorded in a separate context_audit_metadata object; it is
    not a second context authority.
  context_audit_metadata: >
    The audit metadata for one downstream brief: source summary, policy version,
    mandatory-content digest, omitted compressible-content identifiers, budget
    decision, fallback or expansion reason, and reference handle if any. It is
    stored separately from the full report and does not mutate the full report,
    formal publication_snapshot, history, or recovery material. A reference
    handle must be resolvable by the receiving downstream consumer.
  brief_budget_policy: >
    A versioned policy separating the mandatory non-compressible budget from the
    compressible narrative budget. Mandatory content is budgeted first and is
    never truncated. The policy MUST define one ordered resolution sequence and
    its conditions, not leave the choice to the implementation: for example
    expand the total budget up to a recorded hard cap when expansion is allowed;
    otherwise use a downstream-resolvable reference when reference fallback is
    allowed; otherwise use the full report only when it fits the existing context
    hard cap; otherwise reject with a typed BRIEF_REJECTED. A reference must be
    resolvable by the receiving consumer; a path string that cannot be resolved
    is invalid. Full-report fallback MUST NOT bypass the existing context hard
    cap; if neither the brief, the reference, nor the full report can be safely
    accommodated, the policy MUST reject and must not truncate mandatory content.
    Character limits are auxiliary; token measurement uses the selected model or
    tokenizer. Unicode is normalized, and missing, duplicate, forged, or
    overlong markers use the policy's deterministic fallback or rejection path.
    Brief status is a closed set: ok, fallback, truncated, short_passthrough,
    short_narrative_plus_mandatory, expanded, reference, full_report,
    BRIEF_REJECTED, rejected_invalid_marker.
  brief_evaluation: >
    The controlled downstream-brief evaluation: a switch toggles brief delivery
    under the same model, configuration, data snapshot, risk policy, and frozen
    evaluation inputs. Added output tokens are brief-generation output; reduced
    downstream input tokens are full-report input minus brief input. added_output_cost
    = added_output_tokens x output_per_token; reduced_input_cost_saving =
    reduced_downstream_input_tokens x input_per_token; net_cost =
    added_output_cost - reduced_input_cost_saving; net_tokens = added_output_tokens
    - reduced_downstream_input_tokens. Negative net_tokens or net_cost means a
    saving. If either price is missing, added_output_cost, reduced_input_cost_saving,
    and net_cost are null rather than inferred from a single price. The FR-02
    counting boundary applies. Record fidelity,
    key-number and gap preservation, quality_loss (positive means degradation,
    negative means improvement), quality_loss_max, safety escapes, and latency.
    Safety escapes are zero-tolerance; quality loss is judged against the same
    approved quality_loss_max and must not be relaxed. Lifecycle states
    are blocked, ready, accepted, and failed with explicit evidence conditions:
    blocked when inputs/digests/thresholds/human approval are missing; ready when
    all fixed inputs, digests, thresholds, and human approval are present but no
    accepted result exists; accepted when measured results are within the approved
    quality_loss_max with zero safety escapes; failed when evidence, quality loss,
    or safety conditions fail. No cost optimization is claimed until accepted.
  recovery_benchmark: >
    The fixed recovery-performance workload and measurement contract: 100
    committed formal publications and 10 pending valid recovery snapshots on a
    documented supported local filesystem. Each pending snapshot contains the
    fixed 12-section report map, complete report, section manifest, one risk
    evidence object with policy reference, and one required memory idempotent
    write; rendered output is no larger than 1,048,576 bytes and the snapshot is
    no larger than 1,048,576 bytes. 30 independently reset trials, nearest-rank
    p95, and a provisional 2.000-second target pending approval. Timing includes
    claim, scans, fixed rendering, publication, the required memory write, and
    cleanup attempts. All samples, failures, timeouts, platform/OS, CPU/RAM,
    filesystem/mount, output sizes, fixture version, and source commit are
    recorded. Correctness and model-free behavior are zero-tolerance;
    validation is never skipped to meet the time target.
  evidence_requirement_link: >
    An explicit link from one availability record to one requirement component:
    requirement_id, capability, component, and criticality. One executed record
    may support multiple links; its primary link is repeated in the record's
    top-level requirement_id/capability/component fields. A component_missing
    record has exactly one link.
  coverage_snapshot: >
    Immutable run-scoped snapshot produced only by the availability program from
    the critical profile, run clock, and actual availability records. It is
    stored in the manifest and contains run_id, critical_profile_hash,
    provenance_digest, coverage_status, structured critical_gaps,
    critical_gap_ids, snapshot_version, snapshot_hash, computed_at, and
    computed_by = program. critical_profile_hash MUST equal the actual
    critical_profile.profile_hash. The model never creates or mutates it.
  input_hash: >
    SHA-256 over the canonical gate input: the coverage_snapshot hash, the
    model_proposal canonical fields, the portfolio_risk input_digest, the
    portfolio_risk diagnostic digest when input_digest is null, and the
    portfolio_risk policy digest when FR-04 applies (all null otherwise), and
    the gate_version. The safety_gate and FinalizedRunRecord carry the same
    input_hash for one gate evaluation.
  gate_input: >
    The trusted input to the gate: one immutable coverage_snapshot, one
    model_proposal, one validated portfolio_risk_input or safe diagnostic_ref
    and the portfolio_risk_policy_snapshot when FR-04 applies, and the
    gate_version. Coverage and gaps are read only from the snapshot; the model
    cannot supply or alter authoritative coverage state, risk input, diagnostic,
    or policy snapshot.
  gate_result: >
    Closed status passed, blocked, or error, plus reason_codes from the closed
    gate_reason_code set, primary_reason_code selected by the fixed priority
    order, run_id, coverage_status, critical_gap_ids, profile_version,
    snapshot_hash, gate_version, input_hash, evaluated_at, and the
    portfolio_risk_result when FR-04 applies.
  model_proposal: >
    The model's unapproved output: model rating (five-tier or REVIEW), decision
    text, and proposal_status = unapproved. It is retained for audit but is not
    the formal decision.
  formal_decision: >
    The deterministic gate output: status approved or blocked_for_review,
    final_rating, decision_text, and gate_result. When blocked, final_rating is
    REVIEW and decision_text uses the review_class matched to the primary gate
    reason; the model proposal is stored separately and marked not approved.
  gate_reason_code: >
    Closed set: critical_gap, coverage_gap_mismatch, invalid_coverage_status,
    missing_gap_list, invalid_gap_type, missing_availability_record,
    invalid_critical_profile, invalid_model_rating, model_review,
    missing_gate_input, stale_coverage_snapshot, snapshot_hash_mismatch,
    gate_internal_error, portfolio_risk_input_invalid,
    portfolio_risk_limit_exceeded, portfolio_risk_evaluator_error.
  artifact_binding: >
    The canonical identity and decision fields every formal artifact exposes in a
    machine-readable form: run_id, decision_id, record_version, decision_digest,
    gate_status, formal_decision_status, final_rating, coverage_status,
    critical_gap_ids, coverage_snapshot_hash, and an optional record_hash.
    run_id is the invocation identity; decision_id is the content identity used
    by memory reuse. Artifacts bind to one formal result only when these values
    match.
  canonicalization: >
    Per-field comparison rules. Encoding is UTF-8 with NFC and LF; object keys
    are sorted; scalar whitespace is trimmed. Arrays with semantic order keep it:
    attempts and attempted_sources preserve supplier attempt order, artifacts
    preserve their declared order, and critical_gap_ids are sorted by
    requirement_id. Run-level generated_at, the top-level safety_gate
    evaluated_at, and finished_at are excluded from equality and digests; the
    portfolio_risk evaluated_at and other immutable risk evidence timestamps
    are retained in the risk result. Evidence timestamps in attempts and
    observed windows are preserved in records and included in full-record
    comparison and provenance_digest. Absolute local paths and rendered report
    prose are excluded; the report binding block and required summary are
    compared.
  entry_digest: >
    SHA-256 over the stable decision-content projection: decision_id,
    trade_date/ticker, and formal decision status/rating/text. It excludes
    coverage_status, critical_gap_ids, provenance_digest, run_id, source snapshot
    hash, timestamps, commit_status, and reuse metadata so the same decision can
    be reused across normal reruns with different evidence. Portfolio-risk
    evidence is not an entry_digest input; only stable formal decision content
    controls reuse.
  evidence_digest: >
    SHA-256 over the per-run evidence projection for a memory entry:
    coverage_status, critical_gap_ids, and provenance_digest. It may differ
    across two runs with the same decision_id; evidence difference is not entry
    corruption and does not block reuse. Portfolio-risk evidence is stored in
    the current run manifest/final-state and in a newly written memory entry's
    declared summary; a reused historical entry retains its original evidence
    and is linked through reused_decision_ref.
  decision_digest: >
    SHA-256 over the canonical formal decision input: formal_decision.status,
    final_rating, and decision_text after UTF-8 NFC, LF, and trailing-whitespace
    trimming. Run-level timestamps, paths, and cache metadata are not inputs.
  provenance_digest: >
    SHA-256 over the canonical ordered availability records and fallback
    provenance, including data_query_key, record_kind, component identity,
    ordered attempts, attempt source/status/reason_code/record_count,
    evidence timestamps, tried and serving sources, and criticality. All cache
    metadata (cache_kind, vendor_cache_hit, run_cache_hit) and run-level
    generation timestamps are excluded from the digest input. Report and
    memory carry the digest plus a derived summary; manifest and final-state
    carry the full canonical records.
  record_hash: >
    Optional SHA-256 over the canonical FinalizedRunRecord projection excluding
    volatile run-level timestamps (including run_clock.now_utc), artifact paths,
    cache counters, and computed snapshot timestamps. When present, every artifact
    binding must carry the same value. It is not a hash of the shared memory file.
  memory_entry_binding: >
    A binding to one immutable memory decision entry: source_run_id, decision_id,
    record_version, decision_digest, trade_date/ticker identity, entry_digest,
    evidence_digest, a commit_status projection, pre-commit entry_version,
    optional supersedes, and an optional reused_decision_ref. The
    effective version is the highest entry_version whose source terminal manifest
    is committed; no post-commit write to an older entry is required. entry_digest
    covers only stable decision content (decision_id, trade_date/ticker, formal
    decision fields) and excludes coverage, gaps, provenance, source_run_id,
    source snapshot hash, timestamps, commit_status, and other run metadata.
    evidence_digest covers the per-run evidence and may differ without implying
    entry corruption. The current artifacts keep
    the current run_id; a reused historical entry is referenced through
    reused_decision_ref instead of rewriting its source run identity. The shared memory file itself is not hashed.
    Settlement/reflection and policy-based rotation of resolved entries are
    legal and do not change the binding; modifying or deleting a decision entry
    while it is retained is illegal. The manifest memory object records enabled, status, entry_version, entry_binding,
    entry_digest, evidence_digest, supersedes, reused_decision_ref,
    retention_status, and same_day_rerun.
    A memory artifact uses hash_scope = memory_entry, not a whole-file hash.
  behavior_evaluation_contract: >
    The frozen D1 behavior-evaluation contract: eval_set_version, rubric_version,
    fixed model/config/data snapshots, case count, rubric dimensions, pass
    thresholds, and blocking rules. FR-01 cache A/B holds the FR-04 policy
    snapshot, risk input fixtures, and gate version fixed and does not use a
    risk-policy change as its independent variable. FR-04 risk-policy effects
    are evaluated separately under fixed cache, model, and data settings and may
    increase REVIEW by design. The frozen files remain
    docs/req/evaluation/behavior-eval-contract-v1.json, eval-set-v1.json,
    rubric-v1.json, config-v1.json, prompt-v1.0.yaml, and snapshots-v1.json;
    actual snapshots remain pending capture. Any new risk-policy evaluation set
    requires a new version and a recorded decision; v1 is not edited in place.
  evaluation_rubric: >
    Five 0-to-5 dimensions: evidence fidelity, relevance, coverage correctness,
    safety, and actionability. The rubric records per-case scores and the
    aggregate mean. Safety and coverage correctness are zero-tolerance; quality
    thresholds allow only the declared degradation.
  eval_set_version: >
    A frozen evaluation set (docs/req/evaluation/eval-set-v1.json) of at least
    10 ticker/date cases, including the baseline NVDA 2026-10-19 case, with fixed
    data snapshots, model, configuration, and prompts for every A/B run. Snapshot
    capture is required before behavioral acceptance. The fixed config, prompt,
    and snapshot manifest are recorded with SHA-256 digests in the contract.
  decision_id: >
    The content identity of a formal decision, stable across same-day reruns
    when trade_date, ticker, and decision_digest match. run_id remains unique per
    invocation. Memory reuse is keyed by decision_id, not run_id. Repeating the
    same decision_id for the same trade_date/ticker is valid only when its
    stable decision content matches; a same decision_id with different stable
    content is a conflict and blocks reuse. A different decision_id for the same
    trade_date/ticker is a new decision version managed by INV-01, not a
    conflict.
  review_class: >
    Closed formal-review class derived from gate reason_codes: none,
    data_insufficient, model_rating_invalid, model_review, gate_system_error,
    input_invalid, coverage_inconsistent, or portfolio_risk_limit. It selects
    the wording of the blocked formal decision so a rating anomaly, system
    failure, or portfolio-risk limit is not mislabeled as missing data. Risk
    input, policy, cash, currency, or valuation-consistency failures use
    input_invalid; a risk limit breach uses portfolio_risk_limit; a risk
    evaluator exception uses gate_system_error.
  portfolio_risk_input: >
    Authoritative caller/application-supplied risk input for one candidate
    trade. It contains portfolio_value, cash_balance,
    current_asset_quantity, current_asset_value, valuation_price,
    valuation_time as an ISO 8601 timestamp with timezone, one non-empty
    currency label, position_effect new_long or add_long, order_quantity,
    entry_price, proposed_order_value, stop_loss_price, and a
    source/provenance identifier. Inputs are canonical decimal strings with at
    most 12 fractional digits, finite and without exponent notation. All
    monetary fields use the same currency and valuation_time; no FX conversion
    is performed. Model prose, rendered portfolio text, and Markdown are never
    authoritative. new_long requires current_asset_quantity = 0 and
    current_asset_value = 0; add_long requires both to be positive. Risk-input
    canonicalization includes complete input validation: presence, type, decimal
    scale, finiteness, applicability, currency, valuation time, cash, and
    arithmetic consistency. A value that can be serialized but fails any check
    is invalid and MUST NOT produce a normalized input artifact. Missing,
    malformed, non-finite, scale-inconsistent, stale, future-dated,
    currency-mismatched, or unsupported fields block an applicable proposal.
  candidate_trade: >
    The structured stock trade evaluated by FR-04. position_effect is new_long
    or add_long; action is Buy; instrument_type is common_stock; order_count is
    1; leverage is 1.0; order_quantity and proposed_order_value are positive;
    proposed_order_value equals order_quantity times entry_price exactly at the
    declared input scale; entry_price is positive; stop_loss_price is positive
    and strictly below entry_price; and every monetary field uses the portfolio
    currency. Short, derivative, leveraged, multiple-order, non-common-stock,
    and FX-conversion cases are unsupported when the applicability test is true
    and are blocked, not not_applicable.
  portfolio_risk_policy_snapshot: >
    Versioned, locatable policy snapshot actually used by one risk evaluation:
    policy_version, policy_ref, policy_digest, max_projected_weight,
    max_stop_distance, max_valuation_age_seconds, precision_rule,
    threshold_status, and human_approval_ref. The precision_rule is
    input<=12dp;internal>=28sd;exact_compare;display=6dp_half_up. The default
    max_projected_weight = 0.30 and max_stop_distance = 0.05 are provisional
    classroom defaults, not approved financial policy. threshold_status is
    provisional with human_approval_ref = null until a recorded human approval
    exists; approved requires a non-null human_approval_ref. A missing,
    unknown, or incomplete policy snapshot fails closed.
  portfolio_risk_result: >
    Deterministic evaluator output: evaluation_status passed, blocked,
    not_applicable, or error; risk_reason_codes from the closed FR-04 set; the
    portfolio_risk_policy_snapshot actually used; input_ref; input_digest;
    diagnostic_ref; valuation_time; valuation_cutoff; currency;
    projected_weight and stop_distance as canonical decimal strings;
    effective_order_value as a canonical decimal string (zero when blocked);
    and evaluated_at. A normalized input has a non-null input_ref and
    input_digest and a null diagnostic_ref. When canonicalization or any input
    validation check fails, input_ref and input_digest are null, a safe
    diagnostic_ref records the validation outcome, and raw invalid values such
    as NaN are not persisted in a normalized input artifact. It is produced by
    code, never by the model, and is consumed by the shared SafetyGate.
  risk_input_ref: >
    A run-scoped locatable reference to the canonical stored risk-input
    artifact: relative path, SHA-256, and hash_scope = file. The artifact exists
    only for an input that passed canonicalization and complete validation, is
    written under the run results directory, and is included in scan_scope. A
    reviewer can read the artifact, recompute input_digest, and independently
    reproduce projected_weight, stop_distance, and the policy comparison. The
    same reference shape is used for diagnostic_ref; a diagnostic reference
    contains only safe validation metadata and no raw invalid value.
  risk_reason_code: >
    Closed FR-04 set: POSITION_LIMIT_EXCEEDED, STOP_DISTANCE_EXCEEDED,
    MISSING_RISK_INPUT, INVALID_RISK_INPUT, STALE_RISK_INPUT,
    UNSUPPORTED_RISK_INPUT, CURRENCY_MISMATCH, VALUATION_INCONSISTENT,
    INSUFFICIENT_CASH, POLICY_SNAPSHOT_UNAVAILABLE, EVALUATOR_ERROR.
  risk_input_digest: >
    SHA-256 over the canonical stored risk-input artifact. It equals
    risk_input_ref.sha256, binds the exact input used by one evaluation, and is
    included with the policy snapshot digest in the gate input_hash and the
    immutable record.
  risk_behavior_evaluation: >
    Two separate evaluations. The cache A/B holds the portfolio-risk policy
    snapshot, risk input fixtures, and gate version fixed while comparing cache
    enabled versus disabled, so an intentional risk-driven REVIEW increase is
    not attributed to cache regression. The risk-policy evaluation compares
    policy variants under fixed cache, model, and data settings, uses its own
    thresholds, and may increase REVIEW by design. Deterministic risk fixtures
    cover crypto Buy, missing and unsupported candidates, zero position, add to
    long, insufficient cash, historical valuation cutoff, missing policy,
    dual over-limit, evaluator exception, and historical memory reuse.
  artifact_contract: >
    Per-artifact required content. Report carries the binding plus coverage,
    critical-gap, fallback, gate, and, when FR-04 applies, a portfolio-risk
    summary with status, reason codes, policy_ref, policy_digest,
    threshold_status, and metrics. Manifest and final-state carry the binding
    plus full availability records, full gate/formal-decision fields, the full
    portfolio_risk_result, input_ref, input_digest, and policy snapshot when
    FR-04 applies, the report_section_manifest, and the metric_evidence_bundle
    when FR-07 applies. The report carries the metric_block and any metric
    conflict disclosure. A newly written memory entry
    carries the binding plus final rating, formal decision text or digest,
    coverage and gap summary, provenance digest, and a declared risk summary
    with status, reason codes, policy_ref, policy_digest, and threshold_status.
    A reused historical entry retains its own original content and risk evidence
    and is linked through reused_decision_ref; the current run does not inject
    its current risk summary into that historical entry.
  publish_state: >
    Closed set running, staged, validated, completed, partial, failed. INV-01 is
    claimed only for completed; partial or failed runs are not formal success and
    may be retried with the same run_id, record_version, and record_hash.
  invariant_checkpoint: >
    The invariant is checked before completed is recorded, after publication on
    every read of a completed run's formal artifacts, and after any retry or
    resume. It is not claimed while artifacts are incomplete.
  secret_value: >
    A credential value actually configured or used by the run: an API key,
    access token, bearer token, password, client secret, URL userinfo password,
    or a sensitive query or header value. Values are collected in memory for the
    run and are never written to a record.
  secret_pattern_rule: >
    A versioned detection rule category for values not known in advance. The
    fixed minimum categories are provider key formats, generic bearer and JWT
    formats, URL userinfo, sensitive query parameter names and values, sensitive
    authorization headers, and password/token assignments. Each rule set carries
    secret_rule_version, secret_rule_source, and effective_at.
  scan_scope: >
    The closed set of app-controlled boundaries: run manifest, final-state,
    portfolio-risk input artifact, portfolio-risk diagnostic artifact,
    portfolio-risk policy snapshot, memory decision entry, formal report metadata
    and content, report section manifest, archive storage, history index and
    responses, recovery snapshot and diagnostics, export diagnostics, logs,
    preferences, error records, gate reasons, availability reasons, and formal
    API return. Vendor/provider logs, shell history, OS/network captures, and
    external service logs are out of scope and MUST be named as such.
  redaction_policy: >
    Known secret values are removed by exact match; pattern-matched values are
    redacted or block the record. Redaction replaces only the secret value with
    a stable marker such as *** and preserves keys, parameter names, structure,
    status, reason codes, counts, timings, source and vendor names, tickers,
    dates, model ids, and relative paths. Whole-record or whole-URL removal and
    indiscriminate long-string redaction are forbidden as over-redaction.
  secret_scan_result: >
    The recorded scan outcome: known_secret_match_count,
    pattern_match_count, redaction_count, scanner_error, rule_version, and the
    scanned scope. A clean result requires zero known-secret matches, zero
    unredacted pattern matches, and no scanner error. The result proves only the
    defined scope, rules, and fixtures, not the absence of unknown credential
    formats outside them.
  endpoint_audit_record: >
    The audit/display endpoint: scheme, host, and path only. Userinfo, query, and
    fragment are removed.
  endpoint_restore_record: >
    The preference restore endpoint: scheme, host, path, allowlisted
    non-sensitive query parameters, and secret_ref names. Inline sensitive values
    are forbidden; a sensitive component is resolved from .env or the process
    environment, and if it cannot be migrated the record marks re_entry_required.
  safety_gate: >
    Deterministic code that consumes the trusted coverage_snapshot,
    model_proposal, and validated portfolio_risk_input and policy snapshot when
    FR-04 applies; validates coverage, gaps, profile, snapshot provenance,
    availability records, model rating, and portfolio risk; and produces the
    formal_decision before any formal display, persistence, memory write,
    manifest, API return, or backtest scoring. It is fail-closed: invalid
    input, a risk limit breach, a risk evaluator exception, or a gate error
    yields REVIEW with a manual-review notice, and the model cannot override
    it. FR-04 is an internal evaluator of this gate, not a second finalization
    authority.
  zero_tolerance: >
    A pass requires exactly zero violations. A single violation fails the
    acceptance criterion; there is no percentage allowance.
  run_manifest: >
    The one machine-readable JSON record for a run invocation, written at
    <results_dir>/<run_id>/run_manifest.json and valid against
    docs/req/run-manifest-schema.json. It contains schema_version, run
    identity, parent_run_id, lifecycle status, sanitized configuration
    allowlist, timing, call and token counters, data-source status,
    safety-gate result, portfolio_risk_result with input_ref, input_digest,
    diagnostic_ref, and policy snapshot when FR-04 applies, report_section_manifest,
    metric_evidence_bundle when FR-07 applies, artifact hashes, and an optional
    error record.
  sensitive_url_parameter: >
    A URL userinfo component, query parameter, or fragment that can carry a
    credential, token, password, or API key. Sensitive parameters are excluded
    from all records.

