      source_type: code
    - path: TradingAgents/tradingagents/reporting.py
      locator: _SECTIONS; _report_parts; _header; write_report_tree
      description: A fixed section map renders into existing directories without a complete-bundle commit or recovery
        snapshot; headers use the current clock.
      source_type: code
  problem: Partial writes may otherwise be returned as a complete report after a save failure.
  statement: COMMITTED MUST require a final run directory containing a valid commit marker, matching manifest and
    snapshot identity, and every required report file with valid bytes and hashes. Incomplete, corrupt or unsupported
    archives MUST NOT be returned as successful complete reports.
  acceptance_criteria:
  - id: INV-05-AC1
    input: Missing marker, missing section, corrupt manifest and interruption at every commit boundary.
    expected_result: False COMMITTED results = 0; successful complete-report responses for incomplete/corrupt data
      = 0.
    verification: 'T-RAR-05, T-RAR-06 and T-RAR-14: fault injection and typed result assertions.'
    zero_tolerance: true
    measurement_status: not_measured
  metric: null
  dependencies: []
  conflicts:
  - Exclusive publication and validation consume I/O; zero violations takes precedence over throughput.
  assumptions:
  - One Windows host and an ordinary local NTFS archive root; no cloud synchronization or network share.
  - The source is a completed analysis result; report prose is untrusted data and never controls paths or commit
    state.
  notes: Specified behavior and acceptance targets; application implementation and benchmark results are not claimed.
- id: INV-06
  type: invariant
  title: Model-free idempotent archive recovery
  priority: must
  status: draft
  stakeholders:
  - analyst
  - operator
  source:
    origin: Static inspection of main at 2c8996e0e7aec5d6550a52d386cccba32f86ac94
    evidence:
    - path: TradingAgents/cli/run.py
      locator: _run_directory; save_report_section_decorator; run_analysis
