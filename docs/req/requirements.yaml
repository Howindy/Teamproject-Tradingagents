cope and MoSCoW listings, and its standalone deferred recovery-performance scope bullet and scope assumption are removed; QR-02 is not retained as deferred and its identifier is not reused. No other requirement or FC is renumbered, and no replacement requirement is added. The requirement count recomputes from 15 to 14, with 10 approved active requirements and 4 deferred (CR-01, FR-06, FR-07, PR-01); the global fit-criterion count recomputes from 80 to 78. References to QR-02, the 2-second target, 30 trials, or the recovery benchmark inside other requirements, shared definitions, conflict resolutions, and open questions are deliberately left unchanged and may now be dangling. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0 through v1.39.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. No application implementation, benchmark, test result, approved target, benefit, or full-document consistency is claimed. Version 1.40.0 converges SB-01 to deterministic checks for the final recommendation. It replaces the prior twelve fit criteria with five (normal pass, FR-03 data condition, applicable FR-04 risk condition, invalid input/check exception, and entry/formal-conclusion separation), removes the immutable coverage snapshot, critical profile, seal, hash, lineage, snapshot revalidation, forced FR-04 re-execution, policy snapshot/cash/freshness/digest rules, formal-publication and cross-artifact binding, memory/history/recovery proof, the full gate reason/review-class system, timeout/late-result protocol, and manifest-failure coupling. It adopts a minimal decision over the current analysis's FR-03 summary, applicable FR-04 result, and model rating, keeps the original model proposal separate, and produces REVIEW with a program-generated manual-review notice on blocked or error. SB-01 rema