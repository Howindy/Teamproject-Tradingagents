requirements:
  - id: FR-01
    type: "functional"
    title: "Single execution per identical logical data query within a run"
    priority: "Must"
    status: "approved"
    stakeholders: [analyst, trader, operator]
    sources:
      origin: "Repository analysis and measured baseline"
      evidence:
        - path: "TradingAgents/tradingagents/dataflows/router.py"
          locator: "L200 route_to_vendor"
          description: "Central data-tool dispatcher; no run-scoped query cache or single-flight guard is present."
          source_type: "code"
        - path: "TradingAgents/tradingagents/agents/analysts/sentiment_analyst.py"
          locator: "L66 get_news.func and L69 jev_screen"
          description: "Sentiment prefetch invokes data functions directly, so its ticker-news query does not pass through an analyst tool call."
          source_type: "code"
        - path: "TradingAgents/tradingagents/graph/setup.py"
          locator: "L157-L166 parallel analyst edges"
          description: "Analysts run concurrently, so identical logical queries can overlap in time."
          source_type: "code"
        - path: "TradingAgents/tradingagents/dataflows/vendors/yahoo/ohlcv.py"
          locator: "L146-L207 load_ohlcv cache"
          description: "The existing OHLCV vendor cache is cross-run and must remain distinct from the new run cache."
          source_type: "code"
        - path: "TradingAgents/tradingagents/dataflows/vendors/sec_edgar.py"
          locator: "L122-L132 _cached_json"
          description: "SEC EDGAR also has a cross-run vendor cache with its own TTL."
          source_type: "code"
        - path: "baseline/runs/baseline-20261020-01/transcripts/tool-events-clean.jsonl"
          locator: "seq 21 and seq 68 get_news rows"
          description: "Two news-analyst tool calls use the same ticker-news arguments within one run."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/transcripts/prefetch-events.jsonl"
          locator: "sentiment_news row"
          description: "A third ticker-news attempt with the same window is made by the sentiment prefetch."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/data-availability.csv"
          locator: "FRED, ticker-news, and prediction-market rows"
          description: "The six FRED rows are distinct indicators and the two prediction-market rows are distinct topics; both sets failed locally without an external request."
          source_type: "measured_baseline"
    problem: >
      The baseline made three logical ticker-news queries with the same key: one
      sentiment prefetch and two news-analyst tool calls. The six FRED rows and
      two prediction-market rows were distinct logical queries that failed
      locally because the source was not configured or withheld for the
      historical date, so they did not produce duplicate external requests.
      Repeating the logical work consumes tool rounds and model context, and the
      existing vendor caches make an external-request count an unreliable
      acceptance target.
    statement: >-
      Within one run, the system MUST start at most one query_execution per valid data_query_key. All application data-query entry points (registered tools, prefetch, deterministic preflight, SEC financial facts, CLI/API/backtest paths) MUST use the same run-scoped control. Query identity is determined by a versioned per-method normalization contract: semantically equivalent explicit/omitted defaults, aliases, and order-insensitive parameters share one key; semantically different windows, markets, frequency, limit, fields, vendor selector, or unknown parameters do not. Unknown or invalid parameters MUST be rejected before any vendor call and MUST NOT be silently dropped. Raw secrets MUST NOT enter a persisted key.
      The first caller atomically registers the shared execution; concurrent callers join it. The first caller has no privilege to cancel other callers. A single caller's cancellation or wait timeout ends only that caller's wait and does not change the shared execution, other waiters, or the run cache. An execution-level deadline, execution cancellation, or run cancellation terminates the shared execution and releases all remaining waiters with the same canonical terminal outcome. A late result after the deadline cannot replace that terminal outcome or start a new retry/fallback; if the underlying vendor cannot stop, its completion is diagnostic only and produces no business output.
      The immutable execution_policy is fixed at run start with a locatable policy_id/version/digest, vendor chain, retry_budget, fallback_budget, status-action table, request timeout, shared execution deadline, waiter timeout, and run-cache capacity. Budgets are non-negative integers and reject boolean, negative, or non-integer values; timeouts/deadlines are finite positive values. Missing or invalid policy fails before any vendor call. retry_budget is the number of additional attempts per vendor after its first attempt; fallback_budget is the number of vendor switches. Exhausting retry does not block a legal fallback; success ends the execution immediately; only when no legal action remains is the outcome terminal. Adapter-internal retries MUST be disabled or counted against the same budget. Pagination/batch/auth HTTP actions are counted in http_request_count but are not new query_executions.
      A success terminates only when the query's own evidence contract is met. withheld does not use a fallback to bypass point-in-time restrictions. not_configured does not retry the same unconfigured source and may fall back only to a configured source. no_data and insufficient_evidence may fall back only when the policy allows it. unavailable/error follows the fixed retry-then-fallback action table. The terminal outcome stores immutable payload, status, reason, provenance, attempts, and execution identity; all consumers receive isolated or immutable content. Caller cache-hit/wait metadata is separate and never rewrites provenance.
      The run cache is a run-scoped snapshot. Within a run, TTL, capacity eviction, or manual refresh MUST NOT cause a second execution for the same key. When capacity is full, a new distinct query is rejected and reported; an existing terminal outcome is never evicted to re-execute. The run cache releases its references at run end. Existing vendor caches remain cross-run under their own TTL and are counted separately. No ordinary cross-run run-cache reuse is allowed.
      Checkpoint evidence inheritance may reuse only verified terminal evidence supported by the existing checkpoint mechanism. It MUST validate lineage, query identity, window/as-of, canonical version, policy compatibility, and content digest; inherited items are not current query_executions and use inherited counters. Invalid inheritance is rejected before use with a safe reason and then follows one fixed path: reject-and-terminate or one fresh current-run query when remaining budget and run conditions allow. It is never silently treated as inherited success. In-memory locks, futures, and in-flight executions are not inheritable; no new resume capability is added.
      Under fixed replay, equivalent evidence, and fixed risk/gate conditions, enabling or disabling run-cache reuse MUST NOT change the canonical business conclusion. FR-01 does not claim live quality, HTTP-request, token, latency, or cost benefits; live quality is QR-01.
    fit_criterion:
      - id: FR-01-FC01
        input: >-
          An offline fixture with three sequential callers using tool, prefetch, and preflight paths for one logical query; the mock vendor succeeds on its first invocation. It includes method-normalization positive and negative cases: explicit/omitted defaults and aliases that resolve to the same semantic value; and different window, market, indicator, frequency, limit, field, or vendor-selector cases that must not merge.
        expected_result: >-
          Exactly one query_execution exists for the shared key; vendor invocation count = 1; all callers receive equal payload and provenance; duplicate executions = 0. Semantically equivalent parameters share one execution; non-equivalent parameters create separate keys and executions. Unknown/invalid parameters fail before vendor invocation. No persisted key contains a raw secret. The test compares semantic outcomes and independent vendor counts, not a hash generated by the implementation under test.
        verification: >-
          Unit test with a method-normalization table, a mock vendor call counter, and a shared run-scoped access service; assert key equivalence/inequivalence, vendor count, payload/provenance equality, and query_execution_count = 1.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-01-FC02
        input: >-
          An offline fixture with at least three concurrent callers joining one in-flight execution; one caller cancels or times out locally while others remain; the first caller exits; and separate cases exercise execution deadline, execution-level cancellation, run cancellation, a vendor that never returns, and a vendor that returns success after the deadline.
        expected_result: >-
          Exactly one query_execution starts and vendor invocation count = 1. A local waiter cancellation/timeout affects only that waiter; other waiters still receive the shared result and the run cache is unchanged. Execution-level termination releases every remaining waiter with the same canonical terminal status/reason in bounded time. The terminal outcome is committed once; a late success cannot replace it, cannot start a new retry/fallback, and cannot produce business output. A later caller does not re-execute. Test watchdogs confirm waiter/task release.
        verification: >-
          Barrier/event concurrency test with a controlled clock, blocking mock vendor, watchdog, and waiter/task leak assertions; assert one vendor call, one terminal record, identical outcomes, no duplicate execution, and no late rewrite.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-01-FC03
        input: >-
          Offline fixtures where the first execution reaches each terminal outcome under the fixed status-action table: success; no_data; withheld; not_configured; insufficient_evidence; unavailable; error; and not_attempted. Each is followed by two later callers, including a nested-payload mutation attempt by one consumer.
        expected_result: >-
          The action table is followed deterministically and the outcome is cached as the unique terminal result for the run. Later callers start no new execution and receive equal status, reason, and provenance. All consumers are isolated from mutation of nested payload/provenance; caller cache-hit/wait metadata does not alter evidence. insufficient_evidence is legal only as a record status and is not converted into a requirement aggregate status.
        verification: >-
          Table-driven mock vendor tests with an independent expected action trace; assert execution count, terminal equality, nested-mutation isolation, and that call-site metadata is separate from evidence.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-01-FC04
        input: >-
          Run A cold and Run B warm for the same key; concurrent Run A/Run B with the same key and separate run contexts; a run ending while another run is still active; and a run-cache capacity-pressure case.
        expected_result: >-
          Each run has its own query_execution and run cache; cross-run run-cache reuse/wait = 0. A warm vendor cache may satisfy Run B with HTTP count 0 and vendor_cache_hit = true; this is not run-cache reuse. A full run cache rejects new distinct queries with a typed report and never evicts/re-executes an existing key. Run-end cleanup releases run-cache references without affecting the other run or permanent evidence.
        verification: >-
          Two isolated run contexts with vendor-cache sentinels, concurrent and ending-run cases, reference-lifetime checks, and a capacity-pressure fixture; assert per-run execution counts, cache classification, zero cross-run waiting, and no re-execution after eviction pressure.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-01-FC05
        input: >-
          Scripted multi-vendor fixtures covering retry_budget 0/1 and fallback_budget 0/1, no_data, not_configured, unavailable/error, success short-circuit, adapter-internal retry, multi-page/batch requests, and deadline expiry. The configured chain has V vendors.
        expected_result: >-
          Per-vendor retries and vendor switches never exceed their budgets; the first attempt is not a retry; retry exhaustion does not block a legal fallback; no hidden adapter retry bypasses the policy; every HTTP action is counted at the request boundary; no new attempt starts after the deadline. For V available vendors, fallback F, and per-vendor retry R, vendor attempts do not exceed min(V,F+1)*(R+1); this is not an HTTP-request upper bound. Terminal status follows the policy and is never forced to unavailable merely because one budget is exhausted.
        verification: >-
          Independent scripted adapters plus HTTP-boundary sentinels; assert the exact attempt sequence, counters, deadline behavior, and the vendor-attempt bound separately from HTTP counts. The test does not claim a token/latency/cost benefit.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-01-FC06
        input: >-
          A fixed replay/stub with identical injected vendor evidence, the same request plan, clock, risk input/policy snapshot, gate version, and model replay; execute once with run-cache reuse enabled and once with only run-cache reuse disabled. Include success and failure cases, shuffled order, and two report languages.
        expected_result: >-
          Coverage status, requirement statuses, critical gaps, formal rating, and canonical formal-decision projection are identical; unsafe_output_escape_count = 0. Execution metadata (query_executions, HTTP/vendor/run cache hits, retries, fallbacks, timestamps, run_id, render language) is reported separately and may differ. The cache-off mode is a test condition only and MUST NOT disable the safety gate, risk evaluator, or formal-decision path. Live quality remains QR-01.
        verification: >-
          Deterministic replay plus an independent business-projection comparator; compare canonical business fields for equality, assert zero unsafe escapes, and report allowed metadata differences separately.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-01-FC07
        input: >-
          Parameter and policy negatives: missing required fields; unknown parameter; conflicting aliases; invalid window/timezone; illegal budget (boolean, negative, non-integer); zero/negative/infinite timeout or deadline; missing policy; and a valid existing key adjacent to each rejected request.
        expected_result: >-
          Vendor invocation count = 0 for every invalid request/policy; a stable typed error identifies the invalid stage; no success cache entry is inserted; existing valid keys are unaffected; errors are recorded at the FR-02/FR-03 boundary without inventing a new FR-03 record status. The execution policy is rejected before any query execution.
        verification: >-
          Parameter/policy negative table plus a vendor sentinel; assert zero vendor calls, stable error codes, no cache pollution, and preservation of existing valid keys.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-01-FC08
        input: >-
          Existing-checkpoint fixtures: a same-lineage valid terminal with matching identity/version/digest; and invalid cases with a different lineage, tampered digest, different query/as-of/version, or an in-memory future/in-flight execution.
        expected_result: >-
          The valid item is tagged inherited with origin_run_id and uses inherited counters, with current-run query_execution count = 0. Invalid items are rejected before evidence use and are not recorded as cache hits. Under the fixed reject/requery policy, at most one fresh current-run execution occurs when remaining budget/run conditions allow; no new resume capability is created. Inherited and current counters remain separate.
        verification: >-
          Checkpoint-injection fixtures with digest/lineage corruption; assert inherited/current counters, rejection reasons, and the fixed reject/requery path.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-01-FC09
        input: >-
          Entry-point inventory and integration fixtures for every real entry point: registered tools, sentiment prefetch, mandatory preflight, SEC financial facts, CLI, programmatic/API, and backtest paths, executed under the capabilities actually enabled in the build.
        expected_result: >-
          Every enabled data path reaches the same run-scoped DataAccessService control with the same run context; no adapter directly bypasses the control; concurrent callers in one run share context; different runs never share context. Entry points that are not yet implemented are marked pending and cannot be claimed as passing the whole AC.
        verification: >-
          Dependency-sentinel integration test enumerating real entry points and injecting a bypass sentinel; assert unified control, run-context isolation, and explicit pending status for unimplemented paths.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
    tradeoff: Prioritize one execution per valid logical query, bounded execution, exact provenance, and fixed-replay business equivalence. Vendor caches remain cross-run and are counted separately. No live quality, request, token, latency, or cost benefit is claimed; live quality is QR-01.
    implementation_dependencies: []
    constraint_relations:
      - FR-02
      - FR-03
      - INV-01
      - FR-07
      - QR-01
    conflicts:
      - "Cached success could hide an intra-run update. Resolution: the run cache is one run, the key includes the resolved window and analysis date, and capacity pressure rejects a new query rather than re-executing an old one."
      - "Vendor caches already exist across runs. Resolution: the run cache is per-run and never shared; vendor-cache hits are allowed, counted separately, and are not run-cache reuse."
      - "Cancellation could terminate work needed by other callers. Resolution: waiter cancellation and shared-execution termination are separate lifetimes."
      - "Hidden adapter retries could bypass the budget. Resolution: adapter retries are disabled or counted against the unified budget; HTTP is counted at the request boundary."
      - "Checkpoint inheritance could become ordinary cross-run caching. Resolution: only verified same-lineage terminal evidence is inherited, with separate counters and a fixed reject/requery path."
    assumptions:
      - "Each method family has a versioned normalization contract with positive and negative examples; the provisional default is docs/req/requirement-contracts-v1.json."
      - "The execution policy is immutable per run, locatable, versioned, and digest-bound; the provisional defaults are in docs/req/requirement-contracts-v1.json."
      - "A single caller's cancellation or wait timeout never cancels the shared execution; only execution/run-level cancellation or deadline does."
      - "The run cache rejects a new distinct query at capacity and never evicts an existing terminal key to re-execute it."
      - "Checkpoint inheritance is limited to the existing checkpoint mechanism; it adds no resume capability and never inherits locks, futures, or in-flight work."
      - "The fixed-replay comparison excludes execution metadata and rendered language but includes the safety gate and canonical formal decision."
    notes: >-
      FR-01 limits logical query executions and their lifecycle; it does not limit HTTP requests by itself and does not claim performance, token, latency, or cost benefits. pre-v1.24.0 AC7-AC9 are new in v1.21.0 and cover invalid requests/policy, inheritance, and real entry-point coverage. Live quality and risk-policy comparison remain QR-01. The prior AC7-merged-into-AC6 instruction is superseded by this revision.


  - id: FR-02
    type: "functional"
    title: "Emit one lifecycle-complete run manifest"
    priority: "Must"
    status: "approved"
    stakeholders: [reviewer, operator, analyst]
    sources:
      origin: "Repository analysis and measured baseline"
      evidence:
        - path: "TradingAgents/cli/stats_handler.py"
          locator: "L9 StatsCallbackHandler"
          description: "The callback counts LLM calls, tool calls, and token usage but does not persist them, measure duration, or expose prefetch/reflection counts."
          source_type: "code"
        - path: "TradingAgents/cli/run.py"
          locator: "L135-L140 results directory and message_tool.log"
          description: "The CLI writes reports and a tool-call log but no machine-readable run manifest or lifecycle record."
          source_type: "code"
        - path: "TradingAgents/tradingagents/graph/trading_graph.py"
          locator: "L167-L181 propagate and L372-L401 _run_graph"
          description: "The graph lifecycle has a start and completion path but no startup or terminal manifest writer."
          source_type: "code"
        - path: "TradingAgents/tradingagents/graph/trading_graph.py"
          locator: "L255-L275 run_settings"
          description: "An allowlisted settings view exists and excludes keys, endpoints, and local paths."
          source_type: "code"
        - path: "TradingAgents/tradingagents/graph/trading_graph.py"
          locator: "L308-L335 _memory_step"
          description: "Settlement and reflection run during the analysis and can make LLM calls that must be attributed by the counters."
          source_type: "code"
        - path: "TradingAgents/tradingagents/memory/reflection.py"
          locator: "L63 invoke"
          description: "The Reflector uses the quick-thinking LLM, so reflection calls are observable by the same callback boundary."
          source_type: "code"
        - path: "baseline/runs/baseline-20261020-01/metrics.json"
          locator: "inner counters and llm_usage_missing"
          description: "The baseline metrics were collected by an external wrapper and include llm_calls, tool_calls, tokens, prefetch_event_count, retry_events, and llm_usage_missing."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/run-manifest.json"
          locator: "all fields"
          description: "The baseline manifest is an external collection artifact with a different shape; it has no run_status lifecycle, safety_gate_result, or artifact hashes."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/logs/stderr.log"
          locator: "file size"
          description: "The baseline stderr log is empty; vendor warnings were not visible without an external logging wrapper."
          source_type: "measured_baseline"
    problem: >
      The baseline produced reports and a tool-call log but no native,
      machine-readable run record. The run metrics and manifest were collected
      by an external wrapper, not by the product, and the external manifest does
      not record lifecycle state, a schema version, sanitized configuration,
      artifact hashes, or a terminal failure record. The callback counts also do
      not distinguish prefetch, reflection, retry, fallback, or missing token
      usage, and the baseline contract does not say which calls are included.
    statement: >-
      Each run invocation MUST allocate a unique, path-safe run_id and, before any model call, atomically write a schema-valid and pre-write-security-scanned running manifest to <results_dir>/<run_id>/run_manifest.json. If the first safe write cannot complete, the invocation MUST return a startup failure, call no model, and leave no partial file at the final path and no overwrite of an existing record; no manifest may exist in that case. A temporary staging file is not a second public manifest.
      The manifest MUST record known identity, parent_run_id, fixed run_clock, config allowlist, observed timing, execution policy reference, call/token counters with usage coverage, canonical availability records with executed/component_missing discriminators, gate/formal decision, model proposal or its missing/invalid representation with validation_status, risk evidence, and applicable artifact references. Unknown or not-yet-produced values are null under the lifecycle schema; they are never fabricated as zero, success, or model text. Every write is subject to SR-01 and every path to SR-02.
      Timing is non-self-referential. All gate/analysis events declared to have occurred MUST be at or before observed_until; observed_until is after the gate and formal material preparation/checks but before terminal serialization. The manifest records event times and a pre-serialization observed cutoff: observed_until, startup_phase_seconds, analysis_seconds, publish_prepare_seconds, and observed_duration_seconds. The production semantic validator enforces observed_duration_seconds = startup_phase_seconds + analysis_seconds + publish_prepare_seconds within 1 microsecond, event ordering, and compatibility aliases; schema alone is not sufficient. finished_at projects observed_until, duration_seconds projects observed_duration_seconds, and publish_seconds projects publish_prepare_seconds; legacy manifest_write_seconds is null in the manifest because its actual value belongs to WriteEvidence, while startup_manifest_write_seconds may reference a completed external startup measurement or be null. Actual startup/terminal serialization-to-fsync durations, replace durations, terminal replace completion time, and external end-to-end duration belong to independent WriteEvidence, not to the immutable manifest. The manifest MUST NOT contain its own replace completion time or its own serialization-to-fsync duration.
      llm_calls counts logical model invocations at the application boundary, including failed calls, structured-output re-invocation, and reflection/settlement; call_id deduplicates repeated callbacks and streaming chunks. Provider-internal retries that are not visible are not invented as logical calls and are disclosed as an observational limit. tool_calls includes failed tools and excludes prefetch. Token usage is tracked per call and per field: complete means every counted call has valid input/output/total fields; partial means at least one valid field but not complete; unavailable means no valid field. Zero calls is complete with real zeros. reported_call_count, unknown_call_count, field_coverage, and aggregation_source are required; field_coverage includes input_tokens, output_tokens, total_tokens, and complete_calls. reported_call_count + unknown_call_count = llm_calls; complete_calls is not greater than any field coverage count; llm_calls_with_usage/without_usage agree with reported/unknown. Known sums of incomplete fields are coverage-qualified contributions, not complete totals or complete billing evidence.
      Normal publication completes the gate and applicable artifacts/security/semantic validation before atomically replacing the running manifest with a completed manifest. completed allows a passed gate or a business-blocked formal decision, but not a gate error, pending formal decision, or invalid artifacts. Terminal completed plus read-time INV-01 is the formal publication; FR-02 creates no second commit marker.
      A handled pre-commit failure writes a failed manifest when a safe terminal write is possible; if not, the last valid running manifest is retained (if one exists) and the caller receives an error. A pre-commit publication failed record is not a successful commit and may be continued under FR-06 recovery conditions with its failure audit retained; a completed manifest is never overwritten. Forced termination guarantees only already-written records under the stated local-filesystem/fault model; no power-loss durability is inferred. A replace result that is uncertain must be resolved by a read-only identity/content check, never by blind rewriting. Once a terminal manifest is replaced, corruption or read-back failure MUST NOT overwrite it with failed; success is withheld and an independent safe diagnostic is recorded when possible.
      A new analysis/checkpoint resume uses a new run_id and records parent_run_id; publication retry/recovery preserves the original run_id. Same run_id with identical versioned immutable content is a no-op returning the original result; different content returns RUN_ID_CONFLICT and never changes committed bytes. Different run_ids publish independently, including same ticker/date/second, and memory allocation follows INV-01. The propagate return shape remains (final_state, signal), where signal comes only from the formal decision; an unpublished/failed run returns the defined error, not a tradeable success.
    fit_criterion:
      - id: FR-02-FC01
        input: >-
          A fixed-version configuration and a complete analysis run, plus a separate run whose gate returns a business block. Read the actual manifest file and formal artifacts, not only in-memory objects.
        expected_result: >-
          Exactly one schema-valid completed manifest exists at the run path; identity/path/run_id/final-state agree; run_status = completed; a passed gate keeps the formal rating, while a business block records formal REVIEW/blocked_for_review rather than failed. The observed timing fields are present and semantically consistent: all declared events are at or before observed_until; the phase sum matches observed_duration within the declared tolerance; compatibility aliases agree; no self-referential replace duration is present. Token coverage fields are present and reconcile with llm_calls. Duplicate manifests = 0; memory-on/off both satisfy the applicable artifact condition.
        verification: >-
          Integration test with schema plus semantic validator, actual file reads, independent expected decisions, and memory-on/off variants; assert the completed/blocked distinction and timing contract.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-02-FC02
        input: >-
          Failure injection at startup, preflight, analysis, gate, memory/report preparation, schema validation, and terminal write. Include cases where the terminal store is writable and where it is not.
        expected_result: >-
          A safe terminal write produces a schema-valid failed manifest with error.stage/type and a safe message; known partial counters/usage/timings are retained; unknown events remain null. If startup write fails, no model call occurs and no manifest is required. If no terminal write is possible, the last valid running manifest (if any) remains and the caller receives an error. No fake analysis_finished_at, fake proposal, fabricated zero usage, or silent success exists.
        verification: >-
          Stage-by-stage fault injection with a field-nullability matrix and caller-error assertions; assert no model call after startup failure and no fabricated fields.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-02-FC03
        input: >-
          A subprocess run killed with SIGKILL/OOM-equivalent during analysis; separate interruptions before and after the terminal replace are exercised.
        expected_result: >-
          The final manifest path contains only a legal old or legal new complete JSON record. Analysis interruption leaves a valid running manifest. An interruption after a successful terminal replace may leave a legal terminal record and MUST NOT be forced back to running. No partial JSON is left at the final path. No power-loss durability is claimed.
        verification: >-
          Subprocess interruption tests with schema validation of the final path and explicit pre-replace/post-replace windows; assert legal-state-only outcomes.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-02-FC04
        input: >-
          A new invocation, a checkpoint resume, a publication retry, and a startup recovery of the same publication.
        expected_result: >-
          A new invocation gets a new run_id; a resume gets a new run_id and parent_run_id; publication retry/recovery preserves the original run_id. Each invocation has exactly one manifest at its own path; resume does not overwrite the interrupted run; orphaned/mismatched manifests = 0. Publication recovery is not mislabeled as graph resume.
        verification: >-
          Independent directory enumeration, parent/lineage assertions, and retry/recovery identity checks.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-02-FC05
        input: >-
          Completed, running, failed-startup, failed-analysis, memory-on, memory-off, risk-valid, risk-invalid, and metric-applicable/non-applicable manifests, including an invalid-rating completed proposal and a component_missing record.
        expected_result: >-
          Lifecycle conditions and discriminator rules pass: running/failed may have proposal = null; completed has a structured proposal with rating either valid or null plus validation_status; executed records have a key and attempts; component_missing records have key = null, attempts = [], status = not_attempted, source = none, and do not enter execution counts. Config contains only allowlisted fields and no endpoint, key, absolute path, or secret. Timing/token nullability is truthful. Schema plus production semantic validator rejects each invalid shape.
        verification: >-
          Schema validation, cross-field semantic checks, and actual-artifact inspection over the lifecycle matrix; assert discriminator and nullability behavior.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-02-FC06
        input: >-
          A deterministic fixture with known logical LLM invocations, one structured-output re-invocation, one failed call, one reflection call, stream chunks and duplicate callbacks for the same call_id, failed tool calls, three prefetch calls, one vendor retry, and one fallback.
        expected_result: >-
          llm_calls equals the independent logical-call ground truth; duplicate callbacks/chunks do not double count; tool_calls includes failures and excludes prefetch; prefetch_calls = 3; reflection_llm_calls is a counted subset; retry/fallback counters match and are not merged into llm_calls/tool_calls/query_executions. Hidden provider retries are disclosed as unknown, not fabricated as zero. Late callbacks after counter freeze cannot change a terminal manifest.
        verification: >-
          Instrumented mock LLM/vendor events compared with an independent event log and call_id set; assert counters and freeze behavior.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-02-FC07
        input: >-
          Usage fixtures: every call complete; some calls with missing fields; calls with invalid/boolean/negative fields; duplicate streaming usage events; provider mapping differences; no usage at all; and zero LLM calls.
        expected_result: >-
          complete/partial/unavailable follow the per-call/per-field definition; field_coverage and reported/unknown call counts are present; input/output/total known sums are null when no contribution exists and are not presented as complete totals when coverage is incomplete; duplicate stream usage is not repeatedly added; zero calls is complete with real zeros. No unknown value is filled with zero. Partial sums are not complete billing evidence.
        verification: >-
          Mock usage matrix with independent expected coverage values and sums; assert status, coverage, null handling, and duplicate suppression.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-02-FC08
        input: >-
          Write failures: ENOSPC/EACCES, schema-invalid candidate, failure before replace, uncertain replace result, and read-back failure after replace.
        expected_result: >-
          Final-path integrity is preserved; an uncertain replace is resolved by read-only identity/content verification; a post-replace failure never overwrites the terminal record and never returns formal success; a retry preserves run identity/content and does not re-run analysis. Silent success = 0.
        verification: >-
          Fault-injection atomic-writer tests with subprocess/real-filesystem interruption where supported, plus read-back verification.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-02-FC09
        input: >-
          Independent completed-state negatives: gate not_run/error; failed security scan; known secret match; null decision digest; pending formal decision; missing report/final-state/memory; wrong record kind; usage-coverage contradiction; zero-call nonzero usage or unavailable zero-call; missing new timing/token fields; phase-sum mismatch or event after observed_until; legacy alias mismatch; risk diagnostic/policy digest tamper; missing proposal disguised as a valid success; invalid-rating mislabeled as valid; and cross-field binding/gate/coverage/profile/snapshot/input-hash mismatches.
        expected_result: >-
          Every negative is rejected by the schema condition or the production semantic-completion validator before a completed result can exist; timing/usage contradictions are rejected semantically even when fields are present. The validator reads actual artifacts and reference digests; it does not accept a string reference alone. False completed records = 0.
        verification: >-
          Schema plus production semantic validator over independent negatives, including actual file/reference reads.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-02-FC10
        input: >-
          Same run_id resubmitted with identical immutable content but different volatile timestamps; changed formal text/evidence/relative reference/version; and concurrent same-run commits.
        expected_result: >-
          Identical immutable content is a no-op returning the original artifact with unchanged bytes; a volatile timestamp difference alone does not cause a conflict. Changed immutable content returns RUN_ID_CONFLICT. Concurrent same-run publication uses one check-and-write boundary; no second publication or overwrite occurs.
        verification: >-
          Complete-directory and manifest digest comparison, same-run concurrency, and identity-conflict tests.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-02-FC11
        input: >-
          Ten worker processes publishing 100 distinct runs for the same ticker, analysis date, and creation second, with disjoint report sections and recovery envelopes, followed by cleanup; memory-enabled and memory-disabled groups.
        expected_result: >-
          All 100 run_ids remain separately retrievable; committed-file overwrite = 0; mixed/stale sections = 0; each committed publication has its own permanent records and section manifest; cleanup does not affect history; duplicate publication per run_id = 0; memory allocation has no version collision and a failed version is not reissued. This is normal concurrent publication, not multi-worker recovery.
        verification: >-
          Concurrent publication fixture with forced same-second paths, disjoint sections, memory groups, cleanup, post-cleanup retrieval, and directory-level comparison.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
    tradeoff: Prioritize lifecycle truthfulness, identity, nullability, counter/usage coverage, and a single commit condition. Actual write/end-to-end performance is PR-01; publication/history/recovery contracts are INV-01/FR-05/FR-06. No raw prompts or tool bodies are stored.
    implementation_dependencies: [FR-01, FR-03]
    constraint_relations:
      - SB-01
      - SR-01
      - SR-02
      - INV-01
      - FR-04
      - INV-02
      - FR-05
      - FR-06
      - FR-07
      - FR-08
      - QR-02
      - PR-01
    conflicts:
      - "A detailed manifest conflicts with the lean D1 scope. Resolution: record structured counters/statuses/hashes, not full prompts or raw tool bodies."
      - "A startup record adds work before model calls. Resolution: write a bounded running record and move actual write timing to external WriteEvidence."
      - "A terminal record conflicts with forced termination. Resolution: guarantee only the last successfully written record; handled failures write failed when possible; post-replace failure never rolls back."
      - "Missing or invalid model ratings must be representable without faking a proposal. Resolution: nullable proposal in running/failed and nullable rating plus validation_status in completed."
      - "Missing token usage can look like zero usage. Resolution: per-field validity, coverage counts, complete/partial/unavailable, and null known sums."
    assumptions:
      - "The manifest schema is versioned at docs/req/run-manifest-schema.json."
      - "run_id is unique per invocation and path-safe; a resume is a new invocation with parent_run_id."
      - "Timing uses monotonic durations and timezone-aware event times; observed_until is fixed before terminal serialization. Actual write/replace/end-to-end measurements are external WriteEvidence."
      - "llm_calls counts logical application-boundary invocations with call_id deduplication; invisible provider retries are disclosed, not invented."
      - "tokens complete/partial/unavailable use per-field validity; zero calls is complete with real zero totals; incomplete fields' known sums are coverage-qualified contributions."
      - "Running and failed manifests may have proposal = null; completed uses a structured proposal that may have rating = null and validation_status invalid_rating or missing."
      - "Manifest publication uses schema validation plus an atomic temp-file/replace within one run's check-and-write boundary; different run_ids do not share ticker/date paths."
      - "WriteEvidence is audit/measurement material, not a commit marker and not part of read-time INV-01 success."
    notes: >-
      FR-02 owns the run record and lifecycle. pre-v1.24.0 AC8 moved to PR-01, AC12 merged into FR-05, AC13 into INV-01, AC14 into FR-06. The external baseline manifest is problem evidence only. The gate runs before the terminal manifest; terminal completion is evaluated after the gate. The nullability/timing/usage revisions in v1.21.0 and the v1.22.0 timing/coverage/WriteEvidence clarifications do not add an AC.


  - id: FR-03
    type: "functional"
    title: "Maintain one canonical data-availability state with a closed critical-gap decision table"
    priority: "Must"
    status: "approved"
    stakeholders: [analyst, trader, reviewer]
    sources:
      origin: "Repository analysis and measured baseline"
      evidence:
        - path: "TradingAgents/tradingagents/agents/state.py"
          locator: "AgentState"
          description: "The graph state has report fields and debate state but no unified data-availability field."
          source_type: "code"
        - path: "TradingAgents/tradingagents/dataflows/router.py"
          locator: "L200 route_to_vendor and L237-L295 fallback outcomes"
          description: "The router produces success, unavailable, not-configured, no-data, and fallback outcomes that are not accumulated into one state."
          source_type: "code"
        - path: "TradingAgents/tradingagents/dataflows/errors.py"
          locator: "L1-L55 vendor error taxonomy"
          description: "NoMarketDataError, VendorUnavailableError, and VendorNotConfiguredError are distinct behaviors; empty and stale data share one error type with only a free-text detail."
          source_type: "code"
        - path: "TradingAgents/tradingagents/dataflows/date_window.py"
          locator: "L67-L190 coverage_gap and withhold rules"
          description: "Coverage gaps, live-only withholding, and point-in-time rules are decided per call, not aggregated into a run state."
          source_type: "code"
        - path: "TradingAgents/tradingagents/agents/analysts/sentiment_analyst.py"
          locator: "L66-L76 prefetch calls"
          description: "The social analyst prefetches three sources directly; failures become placeholder strings with no structured status."
          source_type: "code"
        - path: "baseline/runs/baseline-20261020-01/data-availability.csv"
          locator: "all rows"
          description: "The baseline has 20 success, 4 withheld, 6 not_configured, and 4 unavailable rows; it has no per-requirement aggregation or effective critical profile."
          source_type: "measured_baseline"
    problem: >
      The baseline did not maintain one shared view of source availability.
      Different agents rediscovered the same gaps, the final decision did not
      receive a single canonical list of missing critical data, and the baseline
      CSV had no definition of the minimal record, source identity, success
      threshold, fallback clearing rule, effective critical set, or multi-query
      aggregation. A successful vendor call was not distinguished from data that
      actually satisfied the evidence contract.
    statement: >-
      Each run MUST compute and validate one immutable effective critical profile from the fixed run_clock, asset type, analysis mode, enabled capabilities, and legal overrides, and MUST record the profile together with a declared, versioned availability_plan. The profile names each data requirement, component, query rule, required period slots, evidence contract, fetch owner, criticality, and the allowed/default/override rule; it cannot be modified by the model. Mandatory requirements, historical visibility, and safety conditions cannot be removed by override. An invalid profile is rejected before formal analysis.
      The program MUST maintain one run-scoped data_availability state. The executed-query unit has the unique identity is (run_id, data_query_key) with record_kind = executed; it keeps the original canonical query result, attempts, providers, windows, HTTP count, and provenance. Each supports link carries an independent contract evaluation (satisfied/insufficient/unavailable, eligible evidence IDs/count, contract version); the same execution may satisfy different components differently and is never duplicated. A required component with no execution uses exactly one component_missing record with key = null, attempts = [], source = none, status = not_attempted; it is excluded from all execution/request/cache counts and does not duplicate a planned-but-unexecuted slot.
      Query quorum is fixed by the declared plan Q, not by post-execution supports. For a non-empty Q, all uses the full declared slot set, any uses 1, and min:N uses N with 0 < N <= |Q|; an invalid threshold or a missing mandatory profile component is invalid_critical_profile before analysis. Component and requirement statuses use only satisfied/degraded/missing/not_required as defined. A valid plan whose required component was not executed produces component_missing and may yield degraded/missing; it is not a profile error. An empty set with all/any is missing when required and not_required when optional. Category is a display derivation from the same statuses and is not a second decision authority.
      Only a fallback satisfying the target instrument, window, point-in-time rule, period slots, minimum evidence count, and provenance contract may clear a gap. A component with a usable but insufficient evidence item may be degraded; insufficient_evidence is a record status, never a requirement status. Critical requirements that are degraded/missing produce the unique structured gap list; non-critical failures are limitations and do not change coverage. coverage_status is complete iff every critical requirement is satisfied; invalid profiles cannot produce vacuous completeness.
      The program may compute versioned intermediate availability_view objects with a recorded view_version. Before the gate it MUST seal exactly one coverage_snapshot after a fixed barrier/deadline: declared critical tasks are terminal or timed out, then no late result may change the sealed snapshot. Formal current consumers use the sealed snapshot; FR-08 may use an earlier view with its recorded view_version; a reused historical memory entry keeps its original evidence via reused_decision_ref and is not rewritten with current evidence. Under the same profile and equivalent evidence, order, concurrency, cache, and display language MUST NOT change the canonical business result. SB-01 owns the REVIEW consequence; FR-03 creates no second final decision.
    fit_criterion:
      - id: FR-03-FC01
        input: >-
          A fixed fixture with all eight record statuses, multiple supports contract evaluations on one execution, partially satisfying evidence, and every component/requirement/category combination in the truth table.
        expected_result: >-
          Every record status is from the closed set; success requires the query contract; insufficient_evidence is never treated as requirement success; component and requirement statuses follow only satisfied/degraded/missing/not_required; coverage and gaps match the truth table. An illegal aggregate enum (for example insufficient_evidence as a requirement status) is rejected. Mismatches = 0.
        verification: >-
          Hand-authored expected truth table independent of the reducer; table-driven test asserting every status and aggregate; negative assertion for illegal enum.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-03-FC02
        input: >-
          Fixed queries across Yahoo, SEC, and FRED, one fallback chain, repeated/parallel variants of one key, one payload supporting 1 and 10 different component contracts, a component with no serving source, and a planned slot that was not executed.
        expected_result: >-
          Exactly one executed availability_record exists per (run_id, data_query_key); component_missing is separate with key = null and no attempts; each execution has independent supports contract evaluations and eligible evidence counts; source is provider identity, not tool/URL; attempts, HTTP count, tried/serving sources, fallback, inherited flag, and provenance are correct; Q/E/S are distinct and HTTP counters are conserved. No execution is duplicated to express multiple contract results.
        verification: >-
          Instrumented mock vendors and an independent expected record/support table; assert identity, per-contract results, Q/E/S separation, and HTTP conservation.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-03-FC03
        input: >-
          Stock/crypto x current/historical x news/social/fundamental-enabled combinations; legal and illegal overrides; annual/quarter slot gaps; missing filing dates; a fixed clock spanning midnight.
        expected_result: >-
          Profile and fetch-owner rules match the versioned default: market_price mandatory all modes; stock financial statements mandatory all modes with annual and latest-visible-quarter slots independent of analyst selection; crypto has no statements; current news/social rules match enabled capabilities; historical live-only data cannot be upgraded by override. Illegal override/critical fetch owner is invalid_critical_profile before analysis. The fixed clock does not change across midnight.
        verification: >-
          Table-driven profile tests with exact requirement/component/slot/owner assertions and illegal-override negatives.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-03-FC04
        input: >-
          Fallback cases: same-contract success; too few records/different window/period gap; global news attempting to clear ticker news; undated Yahoo statements attempting to clear SEC statements; an earlier failed attempt followed by a valid fallback.
        expected_result: >-
          Only a target-contract-satisfying fallback clears the gap; partial/different-contract fallback leaves the requirement degraded/missing per the table; global news never clears ticker news; undated statements never clear SEC statements; the resolved attempt history remains but the resolved gap is not the current primary reason. The requirement status set never contains insufficient_evidence. Primary/secondary reasons are ordered correctly.
        verification: >-
          Scripted fallback chains with per-component contracts; assert status, gap_reason, attempt history, and requirement enum.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-03-FC05
        input: >-
          A profile with all/any/min:N rules, repeated queries, different queries yielding the same evidence, partial components, missing slots, shuffled/concurrent insertion, and late results during the seal barrier/deadline.
        expected_result: >-
          The plan denominator is fixed; all/any/min:N aggregation is exact; the same evidence is not counted twice to satisfy min:N; component/requirement/coverage results are order- and concurrency-independent; exactly one seal occurs after the barrier; a late result cannot change the sealed snapshot and is diagnostic only.
        verification: >-
          Shuffled/concurrent table-driven tests with independent expected aggregates, evidence-identity deduplication, and late-result seal tests.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-03-FC06
        input: >-
          Two fixtures: one critical gap plus two non-critical failures; and all critical requirements satisfied with the same two non-critical failures. Also an optional capability that is not_required and one that was queried but failed.
        expected_result: >-
          Critical gaps appear in the Data availability section with all required fields; non-critical or optional observed failures appear in Data limitations and never in critical_gaps or coverage; the second fixture is complete but limitations remain visible. A not_required capability does not hide its observed failure. Mismatches = 0.
        verification: >-
          Report/manifest/final-state consumer diff and structured-field assertions for both fixtures.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-03-FC07
        input: >-
          A never-queried critical component, a partially executed component, an optional capability not executed or executed and failed, and a checkpoint-inherited evidence item.
        expected_result: >-
          A wholly unexecuted required component yields exactly one component_missing with the required identity and zero execution/request/cache counts; a partially executed component uses planned slot gaps without duplicating component_missing; optional failure is visible as a limitation but does not change coverage; inherited evidence is validated by FR-01 and is not counted as a current execution.
        verification: >-
          Mocked tool fixtures with synthetic-record, slot-gap, inheritance, and counter assertions.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-03-FC08
        input: >-
          The same business fixture replayed with shuffled order, concurrency, warm/cold caches, two languages, intermediate views, final seal, memory on/off, and a reused historical memory entry.
        expected_result: >-
          Profile, aggregate statuses, gaps, canonical structured decision, and language-independent summaries are identical; rendered prose/translation and execution metadata are excluded; attempt order remains recorded even when display is sorted. The final snapshot is sealed once; a referenced historical entry is validated but its evidence is not forced equal to current evidence.
        verification: >-
          Deterministic replay/concurrency test and consumer audit comparing canonical business fields, not rendered prose.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-03-FC09
        input: >-
          A fixture with one critical gap and a tradeable proposal where report, manifest, final-state, gate, a new memory entry, a reused historical memory entry, a disabled-memory run, and an early FR-08 brief view are produced.
        expected_result: >-
          Current formal fields match the same sealed snapshot in report, manifest, final-state, gate, and new memory entry; no consumer re-derives a different gap list. A reused historical entry keeps its original evidence and is bound only through reused_decision_ref. Memory-disabled has no memory entity. The brief records its earlier view_version and does not claim equality with the final snapshot. Sealed snapshot is not recomputed by any consumer.
        verification: >-
          End-to-end consumer integration with new/reused/disabled memory and a versioned brief-view fixture.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-03-FC10
        input: >-
          Boundary fixtures: all/any non-empty; min:N in range; all/any empty; min:N with N = 0 or greater than the declared plan size; a valid plan whose required component was not executed; an invalid profile missing a mandatory component; illegal dynamic optional query; and illegal override.
        expected_result: >-
          Non-empty all/any/min:N follow the truth table; empty required is missing and empty optional is not_required. A valid plan with an unexecuted required component yields component_missing and degraded/missing, not a profile error. N invalid, mandatory component missing, illegal override, or dynamic query changing the critical denominator is invalid_critical_profile before analysis and cannot produce vacuous complete. The two cases are mutually exclusive.
        verification: >-
          Table-driven cardinality/threshold/override tests with independent expected results and pre-analysis rejection checks.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
    tradeoff: Prioritize one canonical availability state, fixed plan quorum, independent supports contracts, honest period slots, and deterministic aggregation. Critical and non-critical observations are separated; historical live-only data is not treated as critical. The profile/plan is fixed at run start, not left to implementation discretion.
    implementation_dependencies: [FR-01]
    constraint_relations: [SB-01, INV-01, FR-02, FR-04, INV-02, FR-07, FR-08]
    conflicts:
      - "Showing every gap makes reports longer. Resolution: Data availability for critical gaps and Data limitations for non-critical/optional observations."
      - "A configurable critical set can change the gate. Resolution: fixed defaults, mandatory requirements, and recorded overrides with illegal-profile rejection."
      - "A completed vendor call can return unusable data. Resolution: success requires the evidence contract; insufficient_evidence is a record status, not a requirement status."
      - "A fallback can substitute a weaker source. Resolution: only a target-contract-satisfying fallback clears the gap."
      - "Execution results could redefine the quorum. Resolution: the plan declares Q and thresholds; post-execution supports never changes the denominator."
      - "Historical memory reuse could force current evidence into an old entry. Resolution: validate the reference and keep the historical evidence; current evidence stays in current artifacts."
    assumptions:
      - "Effective profile defaults use profile_version d1-default-v1 and the versioned contract docs/req/requirement-contracts-v1.json."
      - "market_price is mandatory in every run; stock income/balance/cashflow are mandatory in every mode with annual and latest-visible-quarter slots; crypto has no financial statements."
      - "Each financial statement component validates annual and latest-visible-quarter slots independently; one record cannot fill two slots; no single-quarter derivation and no TTM extension."
      - "Current-date ticker_news is critical when news is enabled; social_sentiment is critical when social is enabled with stocktwits/reddit min_successful_components=1 and sentiment_news optional; historical mode excludes live-only data."
      - "Explicit overrides record profile_source=override and cannot remove mandatory requirements or historical/safety conditions; an illegal override is invalid_critical_profile."
      - "requirement_status is closed: satisfied, degraded, missing, not_required; record_status is closed and includes insufficient_evidence; category is display-only."
      - "The final coverage_snapshot is sealed once after a fixed barrier/deadline; late results are diagnostic; intermediate availability_view is versioned and non-final."
    notes: >-
      FR-03 defines the profile/plan, canonical availability state, independent supports contracts, period slots, fallback clearing, evidence deduplication, aggregation, reasons, views, and seal. SB-01 owns the REVIEW consequence; FR-08 uses a versioned intermediate view; INV-01 owns cross-artifact binding and the reused historical memory exception. FR-07 owns financial period span; FR-03 does not derive single quarters or TTM.


  - id: FR-04
    type: "functional"
    title: "Deterministic portfolio-risk evaluation of a structured candidate trade before finalization"
    priority: "Must"
    status: "approved"
    stakeholders: [trader, reviewer, operator, security_reviewer]
    sources:
      origin: "Upstream proposal review, repository analysis, and baseline inspection"
      evidence:
        - path: "TradingAgents/tradingagents/portfolio.py"
          locator: "PortfolioContext"
          description: "Portfolio input is optional cash, currency label, and positions with quantity and average price; it has no valuation time, portfolio total, current-asset value, candidate order value, or currency-consistency contract."
          source_type: "code"
        - path: "TradingAgents/tradingagents/agents/schemas.py"
          locator: "TraderProposal and PortfolioDecision"
          description: "The Trader proposal has optional absolute entry and stop prices plus free-text sizing; the Portfolio decision has a rating but no validated order value, risk metrics, or policy result."
          source_type: "code"
        - path: "TradingAgents/tradingagents/agents/state.py"
          locator: "AgentState.portfolio_context"
          description: "Portfolio context is rendered as prompt text, not an authoritative validated numeric risk input."
          source_type: "code"
        - path: "TradingAgents/tradingagents/graph/setup.py"
          locator: "Portfolio Manager edge to END"
          description: "The graph ends after the Portfolio Manager; no deterministic portfolio-risk evaluator follows the model decision."
          source_type: "code"
        - path: "TradingAgents/tradingagents/agents/managers/portfolio_manager.py"
          locator: "portfolio_manager_node final rating"
          description: "The final rating and decision text are model-produced and are not checked against concentration or stop-distance limits."
          source_type: "code"
        - path: "baseline/runs/baseline-20261020-01/results/reports/NVDA_20261020_193209/5_portfolio/decision.md"
          locator: "entire file"
          description: "The baseline formal decision contains no concentration, stop-distance, risk-input, policy-version, or risk-result field."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/transcripts/final-status.json"
          locator: "final_rating and final_trade_decision"
          description: "The baseline persisted a Hold rating without any deterministic portfolio-risk evaluation or risk evidence."
          source_type: "measured_baseline"
    problem: >
      The upstream pipeline can finalize a Buy or Overweight advisory result
      without a deterministic check of projected concentration or long stop
      distance. Portfolio holdings are optional prompt context, candidate
      sizing is free text, entry and stop prices are optional model fields, and
      the model rating is the final authority. There is no authoritative
      caller-supplied valuation with cash, quantities, prices, currency,
      valuation time, and consistency checks; no structured candidate order;
      no historical valuation cutoff; no versioned policy snapshot; and no
      fail-closed behavior for missing, unsupported, insufficient-cash, or
      inconsistent risk input.
    statement: >-
      Applicability is determined only by asset_type and the model proposal rating. When asset_type is stock and the model proposal rating is Buy or Overweight, the risk check is REQUIRED, even if coverage, snapshot, or another gate check already blocks: the shared gate MUST validate the risk input, run the evaluator, and record a passed, blocked, or error result. A missing, malformed, unsupported, or inconsistent candidate MUST be blocked with MISSING_RISK_INPUT, INVALID_RISK_INPUT, UNSUPPORTED_RISK_INPUT, VALUATION_INCONSISTENT, INSUFFICIENT_CASH, or CURRENCY_MISMATCH; it MUST NOT be reported as not_applicable. Risk status is not_applicable only when asset_type is not stock, or the model rating is Hold, Underweight, or Sell. An invalid model rating MUST block with invalid_model_rating and MUST NOT use not_applicable; the risk branch does not run and the risk result is null or absent, not not_applicable. Crypto Buy and other non-stock assets use not_applicable and remain subject to SB-01.
      The first version supports caller/application-supplied, single-currency, unlevered cash/long portfolios and one common-stock Buy candidate with position_effect new_long or add_long. The caller supplies a structured file/parameters with business identity (market-qualified instrument_id, asset_type, analysis_date, candidate_id, action, instrument_type, order_count, leverage, portfolio_scope, source/provenance) and the numeric input; the current run binds run_id and the canonical input-file digest through an outer envelope. source is provenance, not proof of broker connection. Short, derivative, leveraged, multiple-order, non-common-stock, FX, or unsupported scope cases block as UNSUPPORTED_RISK_INPUT when applicable. A passed risk result is not a trade authorization and does not override another gate blocker.
      Input uses the bounded canonical decimal grammar in docs/req/requirement-contracts-v1.json: at most 30 integer digits and 12 fractional digits; no exponent, plus sign, whitespace, leading zero (except 0), negative zero, or meaningless trailing zeros. Order_count is an integer (not boolean) equal to 1; leverage is canonical 1. Required exact identities are current_asset_value = current_asset_quantity * valuation_price and proposed_order_value = order_quantity * entry_price without intermediate rounding; cash_balance >= proposed_order_value; portfolio_value >= cash_balance + current_asset_value; all monetary fields share one currency; valuation_time is timezone-aware and within the closed freshness interval. The valuation cutoff is min(run_clock.now_utc, end_of_day(run_clock.as_of_date, run_clock.timezone)); a future as_of_date is rejected before risk/analysis as future_analysis_date and is never clipped. A future valuation_time or age outside [0, max_valuation_age_seconds] is STALE_RISK_INPUT; a timezone-less/unparseable time is INVALID_RISK_INPUT.
      A valid policy is a locatable, retained, versioned snapshot with legal thresholds (0 < max_projected_weight <= 1; 0 < max_stop_distance < 1; finite positive integer max_valuation_age_seconds; bounded decimal grammar), precision_rule input<=12dp/ exact cross-product/ display 6dp half-up, threshold_status, human_approval_ref, and policy_digest over a fixed content projection excluding the digest itself and any local filesystem location but including the logical policy_ref, version, thresholds, precision, status, and approval identity. The machine canonical provisional defaults are max_projected_weight=0.3 and max_stop_distance=0.05; display may show 0.300000 or 30%, but the display form is not input canonical syntax and does not participate in policy_digest. They are not approved financial policy. A valid provisional snapshot MAY be used and every result MUST label it provisional; approved requires a real, locatable human approval record, not a non-empty string. Missing/incomplete/unknown/digest-mismatched policy blocks with POLICY_SNAPSHOT_UNAVAILABLE and never defaults to approval.
      After input and policy are valid and P>0 and E>0, concentration uses the exact cross-product comparison C+O <= max_projected_weight*P and stop distance uses E-S <= max_stop_distance*E, with no intermediate rounding; equality passes; division is display-only half-up 6dp and never changes pass/fail. Both breach reasons are retained with POSITION_LIMIT_EXCEEDED primary. A valid input with an invalid policy retains its input artifact and adds a separate safe policy diagnostic; only an invalid input omits the normalized artifact. Valid input is written as a canonical UTF-8 JSON artifact; input_digest is the actual artifact file SHA-256, distinct from the policy content digest and from the caller file bytes. Invalid input writes a safe diagnostic with field names/stage/rule version/reasons and no raw dangerous value. The pure evaluator returns a value object, reads no clock/files/network/LLM/UI, and does not persist; the wrapper/publisher adds references, scans, and hashes. The gate input_hash binds the current input or diagnostic, policy, snapshot, proposal, and version through the unique projection.
      The risk result status is passed/blocked/not_applicable/error; effective_order_value is passed = proposed_order_value, blocked/error = 0, not_applicable = null, and it is never a trade authorization. Current risk evidence is consistent across formal artifacts; a new memory entry carries the current summary; a reused historical memory entry keeps its original evidence through reused_decision_ref. Cache A/B fixes the risk policy/input; risk-policy evaluation is separate. A passed risk result cannot clear a coverage or other gate blocker; a risk block/error produces formal REVIEW and no tradeable output.
    fit_criterion:
      - id: FR-04-FC01
        input: >-
          The canonical fixture docs/req/fixtures/portfolio_risk_input_v1.json with portfolio_value 100000, cash_balance 100000, current_asset_quantity 0, current_asset_value 0, valuation_price 100, order_quantity 300, entry_price 100, proposed_order_value 30000, stop_loss_price 95, one currency, and a valuation_time inside the historical cutoff; the policy is provisional with canonical 0.3/0.05. Include Buy and Overweight, new_long and add_long, memory on/off.
        expected_result: >-
          Exact cross-products show the machine canonical projected_weight = 0.3 (display 0.300000 / 30%) and stop_distance = 0.05; equality passes; risk status = passed; the original legal formal rating is unchanged; input_ref/input_digest are non-null and equal the actual artifact SHA; diagnostic_ref = null; policy snapshot/digest, metrics, currency, valuation_time, valuation_cutoff, threshold_status=provisional, and human_approval_ref=null are recorded. No float or display rounding affects the decision.
        verification: >-
          Independent exact arithmetic and artifact SHA recomputation, then finalized-record integration; read actual files, not only in-memory values.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-04-FC02
        input: >-
          A valid add_long Buy with positive current quantity/value and an exactly representable value just above the canonical 0.3 concentration limit while stop distance is within 0.05.
        expected_result: >-
          Risk blocked with POSITION_LIMIT_EXCEEDED; gate blocks with portfolio_risk_limit_exceeded; formal REVIEW; effective_order_value=0; review_class=portfolio_risk_limit; no tradeable output.
        verification: >-
          Exact cross-multiplication boundary test with independent expected values plus formal-artifact integration.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-04-FC03
        input: >-
          A valid new_long or add_long Buy with stop distance just above 0.05 while concentration is within 0.3, including a case that displays as 0.05 after 6dp rounding but is truly above.
        expected_result: >-
          Risk blocked with STOP_DISTANCE_EXCEEDED; gate blocks; formal REVIEW; effective_order_value=0; review_class=portfolio_risk_limit; no tradeable output. Display rounding cannot convert a breach to a pass.
        verification: >-
          Exact cross-product boundary and display-rounding test plus formal-artifact integration.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-04-FC04
        input: >-
          A valid applicable dual over-limit Buy that exceeds both limits; swap field/input order and repeat the evaluation.
        expected_result: >-
          Both POSITION_LIMIT_EXCEEDED and STOP_DISTANCE_EXCEEDED are retained; POSITION_LIMIT_EXCEEDED is deterministic primary; the gate records portfolio_risk_limit_exceeded; formal REVIEW; no tradeable output; the result is independent of input order. Risk reason priority is separate from the gate's own reason priority.
        verification: >-
          Deterministic multi-breach ordering test with reordered input and formal-artifact integration.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-04-FC05
        input: >-
          One valid positive fixture and invalid/unsupported fixtures: bad numeric grammar/length/sign/trailing zero; zero/negative values; inconsistent identities; insufficient cash; currency mismatch; stale/future/no-timezone valuation; instrument/asset/date/candidate binding mismatch; unsupported portfolio scope/candidate; missing required fields; missing policy; illegal policy thresholds/age/precision; and valid input with invalid policy.
        expected_result: >-
          Valid input passes with non-null input_ref/input_digest and null diagnostic_ref. Each invalid input fails closed with a stable reason from MISSING_RISK_INPUT, INVALID_RISK_INPUT, UNSUPPORTED_RISK_INPUT, CURRENCY_MISMATCH, STALE_RISK_INPUT, VALUATION_INCONSISTENT, INSUFFICIENT_CASH, or POLICY_SNAPSHOT_UNAVAILABLE; no normalized artifact for invalid input; a safe diagnostic has field names/stage/rule version/ordered reasons and no raw invalid value. Valid input + invalid policy retains the input artifact and adds a separate policy diagnostic; default approvals = 0. Multiple reliable reasons are retained; no derived arithmetic is attempted without valid operands.
        verification: >-
          Parameterized malformed-input/policy tests including docs/req/fixtures/portfolio_risk_input_invalid_v1.json, independent expected reason codes, dependency sentinels, and schema assertions.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: FR-04-FC06
        input: >-
          Applicability cases: stock Buy/Overweight with missing/unsupported candidate; crypto Buy with complete coverage; Hold/Underweight/Sell stock; stock Buy with a critical gap plus missing/pass/breach/error risk; and an invalid rating.
        expected_result: >-
          Stock Buy/Overweight never yields not_applicable: missing/unsupported blocks and is recorded even with a critical gap; crypto and Hold/Underweight/Sell use not_applicable and remain subject to SB-01; critical-gap Buy with passed risk still blocks on critical_gap; an evaluator exception follows the SB-01 error path; invalid rating blocks with invalid_model_rating before risk and yields null/absent risk, not not_applicable. effective_order_value is never treated as formal authorization.
        verification: >-
          Table-driven applicability tests combined with the SB-01 gate matrix; assert risk presence, primary reason, formal rating, and nullability.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: FR-04-FC07
        input: >-
          Narrative injection and forged inputs: model text claims risk approval, supplies portfolio/order numbers, replaces the candidate, or instructs ignoring a limit; a tampered policy; and dependency sentinels for LLM/network/vendor/writer/clock/UI calls.
        expected_result: >-
          Only the bound caller input and real policy affect the result; model numbers/narrative do not change it; the model proposal stays unapproved; forbidden dependency calls = 0; the pure evaluator does not persist or mutate input; the wrapper/publisher alone adds input_ref/diagnostic_ref and file hashes. Unsafe approvals = 0.
        verification: >-
          Injection fixtures, import/purity audit, dependency sentinels, and wrapper/publisher boundary tests.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: FR-04-FC08
        input: >-
          Passing and breach fixtures repeated 100 times, values just below/at/above the canonical 0.3/0.05 boundaries, a large-number/cyclic-ratio case, exact-product cases, equivalent timestamps in different timezones, freshness at equality and one unit before/after, future analysis date, timezone-less time, and different evaluation metadata.
        expected_result: >-
          The canonical business projection is identical for identical input; exact cross-products handle large values without float/rounding drift; display values are separate; equivalent timezone instants agree; freshness is a closed interval; a future as_of_date is rejected as future_analysis_date and never clipped; a timezone-less time is invalid; run metadata is excluded from business equality while input file SHA is compared on actual bytes.
        verification: >-
          Repeated exact-arithmetic tests, timezone/cutoff fixtures, boundary fuzzing, and round-trip artifact digest checks.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-04-FC09
        input: >-
          Policy fixtures: complete provisional; complete approved with a real approval reference; missing version/threshold/age/precision; unknown ref; tampered digest; self-referential digest; illegal threshold/age/precision; non-canonical policy threshold "0.30"; policy file removed after evaluation; provisional value mislabeled as approved; logical policy_ref and policy_file_ref separated.
        expected_result: >-
          Thresholds, freshness, precision, status, and approval identity are recorded and independently recomputable from policy_digest; policy_digest excludes itself, policy_file_ref, file SHA, mtime, and generation time, but includes the stable logical policy_ref and content; provisional is labeled provisional and never approved; approved requires a real locatable approval record; missing/invalid/tampered policy blocks; the retained policy_snapshot remains recomputable after the external source disappears; default approvals = 0. A reused historical memory entry keeps its original evidence through reused_decision_ref.
        verification: >-
          Policy-snapshot unit tests, independent digest recomputation, removal/tamper negatives, and finalized-record integration.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
    tradeoff: Prioritize deterministic fail-closed risk evaluation with bounded canonical input and exact cross-product comparison. The first version does not connect to a broker, execute/simulate orders or portfolios, convert FX, or support shorts, derivatives, leverage, or multiple orders. Thresholds remain provisional; a passed risk result is not a trading authorization.
    implementation_dependencies: [SB-01, FR-02, FR-03]
    constraint_relations:
      - INV-01
      - INV-02
      - QR-01
      - FR-05
    conflicts:
      - "A deterministic risk block reduces actionable output. Resolution: fail closed to REVIEW while retaining the unapproved proposal for audit."
      - "A second risk gate would fragment final authority. Resolution: FR-04 is a pure evaluator invoked by the existing SB-01 SafetyGate; it has no writer or decision path."
      - "Missing/unsupported candidates could be excused as not_applicable. Resolution: stock Buy/Overweight blocks; only non-stock or other legal ratings use not_applicable."
      - "Decimal division could look exact. Resolution: use exact cross-multiplication for limits and reserve division for display."
      - "A stop distance could be mistaken for a loss guarantee. Resolution: define it as a price-distance ratio only; no loss-guarantee or maximum-loss claim."
      - "Valid input with invalid policy could discard evidence. Resolution: retain the valid input artifact and add a separate safe policy diagnostic."
      - "Historical memory reuse could overwrite current risk evidence. Resolution: current evidence stays in current artifacts; a reused entry keeps its original evidence via reused_decision_ref."
    assumptions:
      - "The caller/application supplies validated structured input with provenance; model text is never authoritative."
      - "The first version covers stock Buy/Overweight with new_long or add_long in a single-currency, unlevered cash/long portfolio; other cases block when applicable."
      - "The canonical 0.3 concentration and 0.05 stop-distance values are provisional classroom defaults, not approved financial policy; 0.30/30% are display forms only."
      - "Boundary equality passes; comparison uses exact cross-products; display rounding does not affect the decision."
      - "The original requirement and its safety intent remain unchanged; this revision only clarifies input, policy, arithmetic, evidence, and reason semantics."
      - "A passed risk result does not clear other blockers and is not a trade authorization."
      - "The pure evaluator does not persist; wrapper/publisher adds references, scans, and hashes."
      - "Cache A/B holds risk policy/input fixed; risk-policy effects are evaluated separately by QR-01."
      - "Historical memory reuse keeps its original risk evidence via reused_decision_ref; current risk evidence stays in current artifacts."
    notes: >-
      FR-04 adds a deterministic evaluator consumed by SB-01. pre-v1.24.0 AC10 is covered by INV-02; AC11 moved to QR-01. The 30%/5% values are provisional. No runtime benchmark, implementation, or test result is claimed. Input source, exact numeric grammar, portfolio scope, policy validity, and evidence semantics are fixed in v1.21.0-v1.22.0; the v1.22.0 revision uses canonical 0.3, logical policy identity plus file ref, and display-only 0.30/30%. Broker integration remains out of scope.


  - id: FR-05
    type: "functional"
    title: "Historical formal publication retrieval with verified section manifests"
    priority: "Must"
    status: "approved"
    stakeholders: [analyst, operator, reviewer]
    sources:
      origin: "Split from pxs FR-03 and verified against the current source tree"
      evidence:
        - path: "TradingAgents/cli/run.py"
          locator: "_run_directory; save_report_section_decorator; run_analysis"
          description: "CLI reports are written under ticker/date directories and are not exposed as a searchable immutable history."
          source_type: "code"
        - path: "TradingAgents/tradingagents/graph/trading_graph.py"
          locator: "default_report_path; record_decision; save_reports"
          description: "API report export uses a second-resolution path and is not automatically indexed for historical retrieval."
          source_type: "code"
        - path: "TradingAgents/tradingagents/reporting.py"
          locator: "_SECTIONS; _report_parts; _header; write_report_tree"
          description: "A fixed section map renders into existing directories without a section manifest or verified retrieval contract."
          source_type: "code"
        - path: "TradingAgents/tradingagents/dataflows/symbols.py"
          locator: "normalize_symbol and safe_ticker_component"
          description: "Existing symbol normalization and path-component guard can be reused for history filters and path confinement."
          source_type: "code"
        - path: "baseline/runs/baseline-20261020-01/results/reports/NVDA_20261020_193209/"
          locator: "report tree"
          description: "Baseline report tree is keyed by ticker and timestamp and has no history index or read-time verification."
          source_type: "measured_baseline"
    problem: >
      Current reports are written into ticker/date or second-resolution directories
      and can be discovered only as files. There is no canonical history listing,
      no cross-run filter semantics, no section manifest, and no read-time
      verification that a retrieved complete report belongs to one committed
      publication rather than a mixture of files.
    statement: >-
      After a formal publication is committed, the application MUST expose a minimal programmatic historical-publication interface: list_publications(ticker=None, analysis_date=None, limit=50, offset=0) -> HistoryPage and get_run(run_id) -> VerifiedRun or a typed error. History visibility is exactly the committed state: terminal manifest run_status = completed plus successful read-time INV-01 (and applicable INV-02) validation. Analysis completion, pending recovery, failed publication, quarantine, or an unsupported schema version MUST NOT be visible as successful history. A business REVIEW may be visible as history; it is not a trading approval.
      Ticker and analysis_date filters are optional and intersect; omitted and explicit null are equivalent. Ticker is trimmed and canonically normalized with the same canonical instrument identity used by data access; a ticker filter returns every record sharing that canonical ticker and never silently picks one market/asset. analysis_date is strict YYYY-MM-DD, never defaulted; malformed types/empty strings/invalid dates return INVALID_FILTER. Order is analysis_date descending, canonical ticker ascending, run_id ascending. limit is omitted or 50 by default; it must be an integer (not boolean) from 1 to 500; 0, negative, null, non-integer, boolean, or over-500 limit returns INVALID_FILTER. offset is omitted or 0 by default; it must be an integer (not boolean) >= 0; 0 is legal; negative, null, boolean, or non-integer offset returns INVALID_FILTER. These domains are separate. A valid unknown ticker or no-match filter returns an empty valid page, not an error and not a network lookup.
      total_matches counts only valid committed matches in the verified set. returned is the page size; truncated means a later valid page exists; next_offset = offset + returned when truncated, otherwise null; an offset beyond the valid set returns returned=0, truncated=false, next_offset=null. Corrupt, unsupported, or unclassifiable candidates are excluded from total_matches and reported in fixed safe diagnostics: candidate_count, corrupt_candidate_count, unsupported_candidate_count (a corrupt subset), unclassified_candidate_count, warnings, and diagnostic_scope=discovered_candidates_before_filters. Exact totals require verifying candidates; the 500 page limit is not a scan-cost limit. The versioned scan budget/timeout (docs/req/requirement-contracts-v1.json) may return HISTORY_READ_FAILED with SCAN_BUDGET_EXCEEDED; it never returns a false complete count or a false empty success. An optional derived index may discover candidates but is rebuildable, non-authoritative, and every read revalidates. Paging is not a cross-request transaction snapshot.
      get_run(run_id) accepts one safe canonical run_id and rejects path separators, traversal, absolute paths, empty/null, or illegal types as INVALID_FILTER (internally INVALID_RUN_ID). Unknown or explicitly non-completed/quarantined records return NOT_FOUND with no partial content. A record that claims completed but has a damaged, missing, unsupported, or unverifiable required proof returns CORRUPT_RECORD with no partial report fields. Root I/O or scan failure returns HISTORY_READ_FAILED, not NOT_FOUND or an empty success. Error text and diagnostics follow SR-01 and never expose secrets or absolute paths.
      Every read validates the same bytes it returns. The required closure is: terminal manifest buffer and schema/version/identity/completed status; binding; record; complete report; report_section_manifest; final-state; risk evidence/policy references when FR-04 applies; metric bundle when FR-07 applies; and required memory proof. Every ordinary artifact reference resolves inside the current run's permanent publication_snapshot; recovery/, temporary staging, and uncontrolled external paths are not dependencies. The only controlled cross-run exception is a typed reused_decision_ref, which resolves either to a source run's permanent proof under the same configured archive root or to an equivalent proof retained in the current snapshot; it never uses report prose or an unvalidated path to choose its target and never lets an ordinary risk/metric/section reference cross run boundaries. A reused_decision_ref is a typed historical proof: validate source identity, entry_digest, stable decision content, and source permanent proof, with a visited set/max depth to prevent cycles; missing proof returns CORRUPT_RECORD with reason HISTORICAL_REFERENCE_UNVERIFIABLE. Legal memory rotation uses permanent entry content/binding plus a retention proof, not the mutable shared memory file or its whole-file hash; insufficient permanent proof is a publication-contract defect, not a false corruption. Non-authoritative diagnostics/WriteEvidence outside the formal tree do not affect readability.
      The section manifest is the committed immutable ordered set bound by the terminal/permanent record; it never contains the terminal hash. renderer_version and capability_set are bound. The expected section set is derived from the versioned renderer/capability rules and committed present/non-empty markers, without re-running a model or renderer. Every applicable non-empty required section is present; a missing/empty required section fails; non-applicable or allowed-empty sections are not listed. Paths are unique, relative, confined, and SR-02-controlled; byte size is actual UTF-8 bytes, not character count; duplicate path/identity conflicts are rejected. A foreign/stale/undeclared formal file inside the controlled report tree, a deleted manifest item, a tampered capability/renderer, or a changed section/complete digest returns CORRUPT_RECORD. diagnostics and guards outside the report tree are not section contamination. The verified reader returns the validated buffer and never re-renders, repairs, publishes, calls a model/data/graph, or modifies the terminal record. If the manifest changes during the read, retry the whole read or return CORRUPT_RECORD; never return newer unvalidated bytes.
      Export, legacy report migration, full-text indexing, and any new Web UI are deferred. A derived index, if added, never defines commitment. This requirement adds no cryptographic authenticity against an attacker who can rewrite all files and digests; signatures/external trust anchors are out of scope.
    fit_criterion:
      - id: FR-05-FC01
        input: >-
          Mixed committed, pending, failed, and quarantined records for several tickers/dates; duplicate ticker spellings; the same ticker in different markets/assets; combined filters; no match; unknown ticker; malformed/empty/null ticker; invalid date; limit=0 invalid, limit=1/500 valid, limit=501 invalid, limit null/boolean/non-integer invalid; offset=0 valid, offset=total valid empty page, offset>total valid empty page, offset negative/null/boolean/non-integer invalid; a result set larger than a page; a corrupt candidate whose ticker/date cannot be determined; an unsupported candidate; dynamic changes between pages; scan-budget exhaustion; and root I/O failure.
        expected_result: >-
          Only verified committed records enter the valid set and total_matches. Ticker normalization is canonical; ticker/date intersection is exact; unknown/no match returns an empty valid page; invalid parameters return INVALID_FILTER. Order and paging formulas are exact; limit=1 and limit=500 are legal pages; offset=0 is legal; offset at or beyond the valid set returns returned=0, truncated=false, next_offset=null. truncated and next_offset agree. Corrupt/unsupported/unclassified candidates are excluded and reported only through fixed safe diagnostics; a partial I/O/scan failure returns HISTORY_READ_FAILED, not a false empty page or false total. No network lookup occurs. Page-to-page changes do not promise a stable snapshot, but every listed item is verified in that request.
        verification: >-
          Fixture-driven history query tests with an independent valid set and response formula; include archive history fixture, invalid/null/type boundaries, corrupt/unclassified diagnostics, scan-budget and I/O failures, and next-page retrieval.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: FR-05-FC02
        input: >-
          Valid committed IDs; unknown/non-completed/quarantined IDs; illegal run_id path/traversal/absolute/empty/null/type cases; corrupt/missing/unsupported records; tampered section/report/manifest/binding; missing risk/metric/memory proof; a reused historical reference with missing proof/cycle; legal memory rotation; recovery cleanup; and content changing after validation.
        expected_result: >-
          A valid ID returns the verified complete report bytes and verified section manifest; unknown/non-completed/quarantined returns NOT_FOUND with no partial fields; corrupt/unsupported/unverifiable completed returns CORRUPT_RECORD with no partial report fields; illegal run_id returns INVALID_FILTER (internally INVALID_RUN_ID); root/scan failure returns HISTORY_READ_FAILED. A typed reused_decision_ref may resolve to a validated permanent proof under the same configured archive root; an ordinary reference may not cross runs. A cycle/depth-limit/missing proof is verification failure, never a silent skip. The returned bytes are the validated buffer; a competition change yields a retry or CORRUPT_RECORD, never unvalidated bytes. Historical proof validates source identity/entry_digest/stable decision; a cycle/missing proof is CORRUPT_RECORD, not partial success. Legal rotation is not corruption; temporary recovery cleanup does not break the read. No model/data/graph/renderer/repair/publish call and no modification of the terminal record.
        verification: >-
          Retrieval integration tests with per-file tampering, binding/manifest mismatch, missing proofs/cycles, rotation/cleanup, illegal run_id, and dependency sentinels; assert the same validated buffer bytes.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: FR-05-FC03
        input: >-
          A committed run with a section manifest, plus planted foreign/stale/undeclared formal files, a deleted manifest item, a missing/empty required section, tampered capability/renderer, duplicate/absolute/traversing paths, multi-byte content, a changed complete-report digest, and diagnostics outside the report tree. Include a formal report containing a model proposal and process suggestions.
        expected_result: >-
          The section manifest is the exact ordered committed set with renderer/capability binding; only applicable non-empty required sections are listed with unique relative confined paths, actual UTF-8 byte sizes, and SHA-256; a missing/empty required section or any foreign/tampered formal file returns CORRUPT_RECORD. Diagnostics outside the tree are not sections. The complete report uses the gated formal decision; the model proposal/process suggestions remain explicitly unapproved; mismatches = 0. No renderer rebuild or arbitrary directory assembly occurs.
        verification: >-
          Section-isolation/tamper tests with independent exact section sets and byte digests; include archive fixture, path/SR-02 sentinels, multi-byte sizes, and formal/unapproved label assertions.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
    tradeoff: Prioritize verified committed history, exact set/order/pagination formulas, truthful scan-failure behavior, and byte-identical returned content. Export, legacy migration, full-text indexing, a new Web UI, and cryptographic authenticity against total-file tampering are deferred/out of scope. Paging is not a cross-request transaction snapshot.
    implementation_dependencies: [FR-02, INV-01, SR-01]
    constraint_relations: [FR-06, QR-02, INV-02, SR-02]
    conflicts:
      - "A searchable history conflicts with immutable formal publication. Resolution: history reads only committed verified publications and never rewrites them."
      - "Filters/paging can return too much or imply a stable snapshot. Resolution: fixed order, bounded page, exact valid-set counts, and no cross-request snapshot promise."
      - "Directory scanning can mix old and current files. Resolution: permanent snapshot + section manifest + read-time revalidation; undeclared formal files are corruption."
      - "Exact totals can require full validation. Resolution: explicit scan budget/timeout and HISTORY_READ_FAILED rather than a fake total."
      - "Memory rotation/cleanup can look like corruption. Resolution: permanent entry/retention proof; missing required proof is CORRUPT_RECORD; temporary recovery cleanup is irrelevant."
      - "A derived index can go stale. Resolution: index is candidate discovery only, rebuildable, non-authoritative, and every read revalidates."
    assumptions:
      - "The team run_id is the canonical publication identity; UUIDv4 is not required."
      - "Only terminal completed plus read-time INV-01 (and applicable INV-02) is successful history; REVIEW can be historical."
      - "Ticker normalization reuses the canonical data-access instrument identity; dates are strict YYYY-MM-DD; omitted/null filters are equivalent."
      - "The scan budget/timeout, page limit, and reference depth are versioned in docs/req/requirement-contracts-v1.json."
      - "The returned bytes are the same validated buffer; post-return disk changes do not retroactively invalidate that response."
      - "Export, legacy migration, full-text indexing, a Web UI, and cryptographic authenticity are deferred/out of scope; temporary recovery material is not a formal dependency. Renderer section rules and the supported-version matrix are pre-implementation design deliverables, not a requirement-approval blocker."
      - "SR-02 confinement applies to every read path; diagnostics follow SR-01."
      - "The renderer-to-section table, non-empty rule, and supported-version matrix are implementation-design deliverables owned by the publication/report capability role and must be reviewed before FR-05 implementation; they are not a requirement-approval blocker."
    notes: >-
      FR-05 is the historical retrieval requirement. Export, legacy migration, full-text indexing, and the deferred export proof rules are not part of current acceptance. The list/get interface, error mapping, diagnostics, scan budget, closure, section completeness, extra-file rejection, rotation/cleanup behavior, SR-02 dependency, limit/offset separation, and controlled cross-run history proof are fixed in v1.21.0-v1.22.0 without adding an AC.


  - id: FR-06
    type: "functional"
    title: "Startup recovery of pending formal publication"
    priority: "Must"
    status: "approved"
    stakeholders: [operator, analyst, reviewer]
    sources:
      origin: "Split from pxs FR-03 and pxs INV-06, verified against the current source tree"
      evidence:
        - path: "TradingAgents/cli/run.py"
          locator: "_run_directory; save_report_section_decorator; run_analysis"
          description: "CLI writes report files directly and has no startup recovery path for interrupted publication."
          source_type: "code"
        - path: "TradingAgents/tradingagents/graph/trading_graph.py"
          locator: "record_decision; save_reports"
          description: "Publication and persistence paths do not provide a model-free recovery entry point."
          source_type: "code"
        - path: "TradingAgents/tradingagents/reporting.py"
          locator: "write_report_tree"
          description: "The renderer can be re-run from saved inputs, but no persisted recovery snapshot or claim protocol exists."
          source_type: "code"
        - path: "baseline/runs/baseline-20261020-01/run-manifest.json"
          locator: "all fields"
          description: "Baseline manifest is an external collection artifact with no publication-recovery state or claim protocol."
          source_type: "measured_baseline"
    problem: >
      An interrupted formal publication can leave a partially written report tree
      with no safe way to finish it. Re-running the analysis would repeat model
      and data costs and could produce a different report. A second publication
      mechanism would compete with the existing terminal-manifest commit.
    statement: >-
      At normal CLI and programmatic/API startup (or an equivalent application session initialization; arbitrary Python import is not a recovery trigger), the application MUST expose one recover_pending(configured_archive_root) entry that performs bounded, sequential, single-process recovery of pending formal publications under that root before a new analysis starts. No pending task is a normal no-op. A recoverable task failure is isolated and summarized; other legal tasks may continue. If the root cannot be read, the guard cannot be established, or recovery cannot complete, return a typed startup-recovery error and MUST NOT report "no tasks". A second concurrent recovery entry for the same root is busy/unsupported; unsupported multi-worker recovery is rejected. Normal publication of different run_ids remains concurrent as required by FR-02. Recovery and a normal publisher MUST NOT write the same run concurrently; an active normal publisher is not taken over. Ownership/guard implementation is fixed by architecture, but file age alone is not proof that a run is dead.
      Recovery continues the existing formal publication process and is not graph resume. It MUST NOT re-run analysis, call an LLM, external data/vendor, analysis graph, settlement, or reflection, and MUST NOT create a separate archive transaction or commit marker. It uses only saved, verified, redacted formal records and fixed rendering inputs after snapshot_ready. A no-pending startup is normal; a pending identity with a missing snapshot is an error and does not quarantine a nonexistent file. Missing, corrupt, unsupported, or reference-broken snapshots are isolated/quarantined with valid material retained and are not published or returned as success.
      Terminal-first behavior is fixed: a legally completed publication with matching identity that passes read-time INV-01 (and applicable INV-02) is an idempotent no-op, does not repeat memory, and does not require a surviving recovery directory. A completed identity/immutable-content conflict returns RUN_ID_CONFLICT without changing committed bytes. A committed record with damaged/missing permanent proof returns CORRUPT_RECORD; recovery MUST NOT use a residual snapshot to overwrite or auto-republish it. A replace result that is uncertain is resolved by read-only identity/content verification, never by blind rewriting.
      A failed_precommit (pre-commit publication failed) record is not a successful commit. It may continue under the same run_id only when all of the following hold: (1) snapshot_ready exists and verifies, with the formal decision, identity, and immutable business content complete; (2) the failure occurred before the formal terminal commit in publication/storage, the original gate was passed or legitimately business-blocked, and there is no unresolved security/binding failure; (3) the run is not an active writer and the single-process guard/ownership check allows this recovery; (4) the original input, policy, metric, renderer, and memory plan are unchanged and no analysis or business content is recomputed; (5) the failure record's safe copy/digest and recovery-attempt linkage are retained before replacement. The same publisher protocol may then atomically replace failed with completed, preserving the original failure audit. Analysis/gate system errors, missing formal decisions, unresolved security failures, identity conflicts, and invalid snapshots are not automatically converted to success. Recovery attempts/timing are recorded separately and MUST NOT be disguised as original analysis timing.
      The snapshot MUST contain the original formal decision and artifact_binding, terminal-candidate identity, report_section_manifest and fixed render inputs, original schema/renderer/formula versions, risk input and policy references with actual nullability, persisted metric bundle, and memory plan/binding including the original reserved entry version. A temporary recovery summary is audit-only. A new entry performs the first write of the original planned entry; recovery never creates a different decision entry or an additional duplicate. Every ordinary reference resolves inside the snapshot with a validated digest; only the typed reused_decision_ref may use a validated permanent proof under the same controlled archive root (FR-05/INV-01). Risk evidence follows the original business state: passed/limit-blocked retain the valid input and actual policy; invalid input uses only a safe diagnostic with input null; valid input plus invalid policy retains input and a policy diagnostic with policy nullable; not_applicable has no invented input/policy; an invalid rating has no risk result under SB-01. FR-07 metrics are restored from the persisted authoritative bundle, not recalculated, refetched, or model-regenerated. A missing/corrupt metric bundle blocks metric-dependent recovery; a complete n/a bundle is valid.
      Memory follows the original plan: new_entry preserves the original decision/version/reservation and performs the first write or idempotently completes that same entry; reuse_existing validates the original reference and creates no new entry and no current-evidence write-back; disabled stays disabled. Partial entries are completed only when identity/digest is trustworthy; conflicts/corruption are reported without overwriting other legal content. Settlement/reflection calls = 0. After commit and read-back, the permanent publication_snapshot remains readable and temporary recovery material may be cleaned; cleanup failure is committed-plus-warning. All snapshot/read/output/quarantine paths follow SR-02 and diagnostics follow SR-01. Retry counts, backoff, timeout, quarantine layout, guard mechanics, and renderer support matrix are architecture/pre-implementation details; no QR-02 performance or multi-worker claim is made.
    fit_criterion:
      - id: FR-06-FC01
        input: >-
          A valid snapshot_ready recovery from an interrupted or pre-commit-failed publication, with dependency sentinels for LLM, external data, vendor, analysis graph, settlement, reflection, filing retrieval, and a second publisher. Include passed risk, limit-blocked risk, invalid-input diagnostic, valid-input/invalid-policy, persisted metric authoritative values, and a typed controlled historical memory reference.
        expected_result: >-
          Recovery completes once with forbidden calls = 0 and preserves the original run_id, decision, policy, metric values, and memory plan. One committed formal publication revalidates on read; no decision/entry is changed, duplicated, or invented. Risk input/policy/diagnostic fields follow the original state and nullability; metrics are restored from the persisted bundle without refetch or recalculation; a complete n/a bundle is accepted as saved evidence. No independent commit marker is required. All ordinary references resolve inside the snapshot; a typed reused_decision_ref resolves only to a validated permanent proof under the controlled archive root.
        verification: >-
          Offline recovery integration with saved-payload comparison, dependency sentinels, actual file digests/read-time validation, and risk/metric/memory branch assertions; static fixtures are not application tests.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: FR-06-FC02
        input: >-
          Missing, corrupt, unsupported, and reference-broken snapshots; no pending task; a pending identity with a missing snapshot; root unreadable/protection unavailable; completed record with corrupt permanent proof; security scan failure; read failure versus nonexistent file; persistent storage fault; and cleanup failure after commit.
        expected_result: >-
          Missing/corrupt/unsupported/reference-broken snapshots are isolated/quarantined without publication; valid material is retained; a missing file is reported as a missing task identity, not as a moved/quarantined file. No pending task is a normal no-op. Root/protection failure returns a typed startup-recovery failure and never a false empty/no-task result. A committed record with corrupt permanent proof returns CORRUPT_RECORD and is not overwritten or auto-republished. Cleanup failure after commit returns committed plus warning and does not change history or committed identity. False successful publication = 0.
        verification: >-
          Snapshot/reference fault injection, root I/O failure, completed-corruption, cleanup-success/failure, and status-typing tests with retained-material and history-read assertions.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: FR-06-FC03
        input: >-
          Fixtures for analysis_complete, snapshot_ready/pending, publication_committed, pre-commit publication failed, analysis/gate/security failed, quarantined, and no-task states, queried through publication status and history retrieval.
        expected_result: >-
          analysis_complete, pending, and failed are not successful history. A pre-commit publication failed record that satisfies all FR-06 conditions may be atomically continued to completed under the same run_id with its failure audit retained; analysis/gate/security failures, missing formal decisions, unresolved security/binding failures, identity conflicts, and invalid snapshots remain non-success. publication_committed is visible only after read-time INV-01/INV-02 validation; quarantined is reported but not success. Completed status is never overwritten by failed. Status-confusion count = 0.
        verification: >-
          State-transition and history-visibility tests covering the complete failed-to-completed matrix and the immutable completed boundary; assert failure audit retention and no history leak.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: FR-06-FC04
        input: >-
          Repeated recovery retries for one run_id; same-content and changed-content resubmission; two recovery entry points for one root; an active normal publisher competing for the same run; different run_ids publishing concurrently; existing completed matching/conflicting content; completed corrupt; bounded retry exhaustion; and one task failing while another is valid.
        expected_result: >-
          Recovery first reads the terminal manifest/content identity. Completed matching is a no-op and does not repeat memory; changed content is RUN_ID_CONFLICT with committed bytes unchanged; completed corrupt is CORRUPT_RECORD without overwrite. A second recovery scan for the same root is busy/unsupported; recovery does not take over an active publisher; unsupported multi-worker recovery is rejected. Different run_ids still publish concurrently under FR-02 and shared-memory rules. At most one successful publication per run_id; retries are bounded and recorded; task failure is isolated; startup summary counts success/no-op/failure/quarantine/busy with safe reasons.
        verification: >-
          Restart/retry/identity-conflict, two-entry/active-publisher, different-run concurrency, and task-isolation tests with directory digests and guard assertions.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: FR-06-FC05
        input: >-
          Original publications requiring memory: interrupted before first write; partial write; reuse_existing; memory-disabled; a partial entry with trustworthy identity versus conflicting/corrupt identity; and spies on settlement/reflection/new writes.
        expected_result: >-
          new_entry creates exactly the one original planned entry or completes that same entry idempotently; reuse_existing validates the original reference and creates no new entry and no current-evidence write-back; disabled remains disabled. A partial entry is completed only with trustworthy identity/digest; conflicting/corrupt entries are reported without overwriting other legal content. Decision content is unchanged; duplicate/extra entries = 0; settlement/reflection calls = 0.
        verification: >-
          First-write, partial-idempotency, reuse, disabled, identity-conflict, and forbidden-call tests; assert original reservation/entry and no write-back.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: FR-06-FC06
        input: >-
          One CLI startup and one programmatic/API startup under the same configured root, each with a pending recovery; plus no-task, one-task-failure, root-I/O-failure, and active-publisher cases. Capture whether new analysis starts and the returned status summary.
        expected_result: >-
          Both entry points call the same recovery service and semantics. New analysis starts only after the recovery scan completes with no task, or after a safe failure summary; a root failure prevents a false success/no-task start. Both entry points write a complete recovery snapshot before terminal commit and produce separately retrievable committed publications. The existing propagate return shape remains (final_state, signal). Snapshot_ready and committed are distinct; history starts at committed; cleanup removes only pending material and leaves permanent records readable. Missing/invalid snapshots prevent completed publication. Normal publication and recovery share the validation and commit condition.
        verification: >-
          CLI/API entry-point fixtures with startup order, status-summary, no-task, task-failure, root-failure, active-publisher, cleanup/history, and propagate-shape assertions.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
    tradeoff: Prioritize model-free, sequential, single-process recovery with truthful failed-state semantics and preserved original evidence. Analysis/gate/security failures are not auto-promoted. Multi-worker claim/fencing/takeover and QR-02 performance remain deferred.
    implementation_dependencies: [FR-02, INV-01, SR-01]
    constraint_relations: [FR-05, QR-02, INV-02, SR-02]
    conflicts:
      - 'Recovery must not repeat analysis. Resolution: use saved verified formal records and fixed render inputs only.'
      - 'A failed terminal could be confused with a commit. Resolution: only completed is immutable; a pre-commit publication failed may continue under explicit conditions with its audit retained.'
      - 'A recovery mechanism can duplicate publication. Resolution: single-process guard, same-run mutual exclusion, terminal-first identity checks, and bounded retry yield at most one committed result.'
      - 'A commit marker is easy to add but creates a second authority. Resolution: terminal manifest plus read-time INV-01/INV-02 is the only commit condition.'
      - 'Memory recovery can create policy drift. Resolution: only the original new_entry may be completed; reuse_existing is reference-only; disabled stays disabled.'
      - 'Invalid snapshots/root faults can look like no work. Resolution: typed isolation/failure summaries; a root/protection failure is never a false no-task result.'
    assumptions:
      - Recovery continues the existing formal publication process and is not graph resume.
      - "CLI and programmatic/API startup use one recovery service; arbitrary import is not a recovery trigger."
      - "D1 recovery is sequential and single-process; a second scan for the same root is busy/unsupported, and multi-worker claim/fencing/takeover is deferred."
      - "Normal publication of different run_ids remains concurrent; recovery and a normal publisher do not write the same run concurrently."
      - "A pre-commit publication failed record may become completed only under the explicit FR-06 conditions; analysis/gate/security failures remain non-success."
      - The team run_id, original decision, policy, metric bundle, and memory plan are preserved; UUIDv4 is not required.
      - "The terminal manifest plus read-time INV-01/INV-02 is the only commit condition; recovery attempts/timing are separate audit evidence."
      - "Risk evidence follows the original state (input/policy/diagnostic nullability); metrics are restored, not recalculated; memory new/reuse/disabled is preserved."
      - "Renderer support matrix, quarantine layout, retry values, and guard mechanics are implementation-design deliverables reviewed before the module starts."
    notes: >-
      FR-06 is the recovery requirement. pre-v1.24.0 AC3 (multi-worker claim/fencing/takeover) is deferred; FR-06-FC06 carries the recovery-snapshot generation obligation moved from FR-02. v1.22.0 closes startup entry/root failure, single-process/same-run isolation, pre-commit failed continuation, terminal-first corruption/conflict, original risk evidence nullability, restored metrics, and memory new/reuse/disabled semantics. No implementation, benchmark, or runtime result is claimed.

  - id: FR-07
    type: "functional"
    title: "Deterministic derived financial metrics from structured filing facts"
    priority: "Must"
    status: "approved"
    stakeholders: [analyst, trader, reviewer, operator]
    sources:
      origin: "Reviewed personal proposal (source artifact not retained in the repository), corrected against the baseline and current source"
      evidence:
        - path: "baseline/runs/baseline-20261020-01/transcripts/final_state.json"
          locator: "fundamentals_report; final_trade_decision"
          description: "Baseline report states Q2 FY2027 revenue growth of about +68.6%; the filed figures used here give +105.9%."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/transcripts/tool-outputs-clean/0019_get_income_statement.txt"
          locator: "Revenue, Gross Profit, Operating Income, Net Income, Diluted EPS"
          description: "Quarterly statement text used only as a source of structured facts; column position is not an identity."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/transcripts/tool-outputs-clean/0045_get_income_statement.txt"
          locator: "annual statement rows"
          description: "Annual statement text used for fiscal-year periods and TTM inputs."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/transcripts/tool-outputs-clean/0035_get_cashflow.txt"
          locator: "Operating Cash Flow; Capital Expenditure; span labels"
          description: "Cash-flow statement text showing year-to-date spans and capex sign."
          source_type: "measured_baseline"
        - path: "TradingAgents/tradingagents/dataflows/vendors/sec_edgar.py"
          locator: "get_income_statement; get_cashflow; _YEAR_TO_DATE"
          description: "Existing SEC statement source, filing-date visibility, and year-to-date rules."
          source_type: "code"
        - path: "TradingAgents/tradingagents/agents/analysts/fundamentals_analyst.py"
          locator: "TOOLS; system_message"
          description: "Analyst currently receives raw statements and has no deterministic derived-metric tool or block."
          source_type: "code"
        - path: "TradingAgents/tradingagents/agents/tools.py"
          locator: "get_balance_sheet; get_cashflow; get_income_statement"
          description: "Existing tool pattern with injected ticker and trade date; the new path must use the shared data access boundary."
          source_type: "code"
        - path: "TradingAgents/tradingagents/dataflows/router.py"
          locator: "route_to_vendor"
          description: "Unified data-access entry point that must supply facts, run-cache reuse, provenance, and counters."
          source_type: "code"
    problem: >
      Growth rates, margins, and valuation multiples are computed by the model
      from irregular statement tables. Quarterly tables omit fourth quarters and
      contain near-date or duplicate-looking periods, so column position or date
      proximity can select the wrong comparison. The baseline stated +68.6%
      instead of +105.9%, and trailing P/E was cited without distinguishing
      fiscal-year EPS from TTM EPS. There is no structured fact identity, no
      deterministic metric block, and no rule for a model narrative that
      contradicts program-computed metrics.
    statement: >-
      For enabled and applicable SEC US-GAAP stock metrics, the application MUST obtain structured financial facts through the unified data access and FR-01 cache/provenance/counting boundary and compute only the current direct metrics: revenue YoY (quarterly and annual), revenue QoQ, gross/operating/net margin, current ratio, liabilities-to-assets, reported-span free cash flow, and fiscal-year EPS P/E. TTM revenue/EPS/P-E, FCF YoY, and single-quarter derivation by subtraction remain deferred and MUST NOT be claimed. Facts MUST carry subject/issuer, accession, filing_ref, concept, value, unit, currency, period identity, fiscal position, span, duration, filed_at, source, sign convention, and restatement lineage. CIK never substitutes for accession/filing_ref. CSV column position, date proximity, or equal values are never fact identity.
      Facts are filtered by disclosure visibility and matched by complete identity. For the same concept/period/unit identity, select the latest visible version only when an explicit amendment/restatement lineage supports it; two same-day accessions with no decidable relation are ambiguous-filing. Across periods, select the latest disclosed fiscal period by issuer fiscal year/quarter order; an old period filed later or restated does not become the current period. YoY uses the prior fiscal year same fiscal_quarter and span=quarter/annual; QoQ uses the immediately preceding disclosed fiscal quarter and both must be independently reported quarter facts; a Q4 available only by annual-minus-three-quarters is n/a, not a derived quarter. YTD is never used as a quarter. Comparability is primarily fiscal position/span plus a documented issuer-calendar rule; exact day count is not mechanically required. Leap-day and 52/53-week differences are allowed only with verifiable fiscal labels/coverage or calendar evidence, with the comparability evidence saved; without evidence return ambiguous/incomparable n/a rather than a near-date heuristic.
      The first version is date-level visibility, not an intraday point-in-time guarantee. Historical facts are visible when filed_at (date) <= as_of in run_clock timezone, and the limitation is disclosed. For current-date analyses, a fact dated today is used only if its public availability by the cutoff is established; otherwise it is excluded/availability_unknown, never filled from model knowledge. Future analysis dates are rejected by the existing clock rule. P/E uses the latest completed, verifiable close supplied by the price service at the fixed run_clock cutoff, not a future or assumed today close. It records price_as_of, actual price_date, source, currency, freshness policy, and adjustment basis. A historical as_of on a non-trading day may use the preceding completed close; a current date without a completed today close may use the preceding completed close; the row is labeled with the actual price_date, not "today's close". A source that cannot establish completion/freshness returns n/a. Price and EPS must share currency and a compatible per-share basis; if a stock split makes the annual EPS basis incompatible and no verifiable unified adjustment is available, return n/a basis-mismatch. No FX or split adjustment algorithm is added.
      Contract vocabulary: the financial_fact contract records period_start, period_end, fiscal_year, filed_at, subject_id, accession, filing_ref, unit, currency, and restatement lineage; metric_claim and metric_conflict form the structured comparison path with formula_version; the FR-01 run cache and counters apply; the GR-01 reference manifest is an implementation prerequisite; same-day accessions with no decidable relation use ambiguous-filing; direct vendor bypass and recovery refetch are forbidden; p/e on fiscal-year eps is the only P/E; ttm and FCF YoY are deferred. Every metric has one stable metric_id, formula_id/version, input fact_ids, period identity, unit/scale, currency, and rounding rule. Formulas and display resolution are fixed by the versioned metric contract: revenue YoY/QoQ and margins as percentages at 0.1 percentage point; current ratio and P/E at 0.1x; liabilities-to-assets at 0.1 percentage point; FCF as an exact difference in the source currency unit/scale. Use exact decimal/Σ integer-scale arithmetic, never binary float for authority; display half-up. Zero denominator, non-positive growth base, non-positive/zero diluted EPS for P/E, missing required fields, currency/unit mismatch, or incompatible basis return typed n/a. Negative profit and negative FCF are valid values and MUST NOT be rejected merely for being negative. Non-positive total assets, negative current liabilities, or other invalid business domains return invalid-input-domain n/a. Capex is normalized to a positive outflow only when the source sign rule supports it; an unknown sign returns n/a, never an arbitrary abs().
      A deterministic program MUST append the metric block regardless of whether the model calls a tool or the fundamentals LLM is enabled. The block contains metric_id, source fact_ids/filing_refs, formula/fact/policy versions, period, value or n/a reason, and status. The first version emits only computed or n/a; if approximate exists for schema compatibility it MUST NOT be produced by the current policy. For non-applicable assets the block/evidence is explicitly not_supported with a reason and does not by itself create a critical gap; FR-03 coverage owns that consequence. A complete n/a bundle is valid evidence and is different from a missing/corrupt bundle: the former is disclosed and remains subject to other gates; the latter blocks a metric-dependent publication. The metric block and metric_evidence_bundle are persisted in the permanent publication_snapshot and recovery snapshot with input/result digests. Recovery loads the persisted authoritative values and verifies digests; it MUST NOT refetch filings, change formulas, recalculate, or call a model/graph. Already committed records are a no-op; a missing/corrupt bundle rejects the pending publication rather than triggering a live fetch. Structured metric claims with a recognizable metric_id, complete period, parseable value, and unit are compared at the declared display resolution after canonical half-up formatting; a mismatch is disclosed and the claim labeled unverified. Missing unit/period claims are unscoped; computed n/a is unable_to_verify, not a verified model number. No free-form natural-language completeness is claimed and no new formal blocker or materiality score is invented. GR-01 Stage A remains a prerequisite before the first FR-07 application implementation; this requirement does not create or approve the independent reference.
    fit_criterion:
      - id: FR-07-FC01
        input: >-
          The local NVDA fixture with quarterly revenue 96,221 for 2026-07-26 and 46,743 for 2025-07-27, 81,615 for 2026-04-26 and 44,062 for 2025-04-27, gross profit 72,142, operating income 63,734, net income 59,688, annual revenue 215,938 for FY2026 and 130,497 for FY2025, current assets/liabilities 197,412/43,019, total liabilities/assets 91,288/320,272, and declared units/scale.
        expected_result: >-
          revenue_yoy_q is +105.9% for 2026-07-26 and +85.2% for 2026-04-26; revenue_qoq +17.9%; gross/operating/net margins 75.0%/66.2%/62.0%; annual YoY +65.5%; current ratio 4.6x; liabilities-to-assets 28.5%, all half-up at the declared display resolution. Each row records metric_id, formula/version, input fact_ids/period, unit/scale, currency, and rounding. Independent recomputation matches; no binary float authority.
        verification: >-
          Independent high-precision recomputation from the recorded facts and formula contract; compare machine values, units, refs, periods, and display values separately.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-07-FC02
        input: >-
          The FC01 fixture with the exact prior-year period removed; a Q4 or prior-quarter whose exact comparison is absent; a current YTD-only item with no independently reported quarter; and a current fact with no prior comparison.
        expected_result: >-
          Each affected metric is n/a with a structured missing_comparison/ambiguous_period/missing_quarter reason. No neighboring-column, near-date, YTD-as-quarter, or subtraction substitution. Known current input fact refs are retained together with missing_input_roles; input fact_ids are not forced empty merely because a comparison is missing, and no missing fact is fabricated.
        verification: >-
          Removed-period/absent-comparison fixtures with independent expected n/a reasons; assert preserved current refs, missing roles, and no substituted comparison.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-07-FC03
        input: >-
          Near-date equal-value facts; two same-day accessions with different values and no amendment relation; a later restatement with explicit lineage; an old period filed later; 53-week/leap-year comparable periods with and without verifiable fiscal/calendar evidence; annual/instant facts with nullable fiscal_quarter/period_start/duration; and a filing after as-of.
        expected_result: >-
          Near-date facts remain distinct; unresolved equal-value periods are ambiguous_period; unexplained same-day accessions are ambiguous_filing; a later explicit restatement selects the latest visible version for that same period and retains lineage; an old period's late filing does not become the current period. Calendar/leap differences compare only with saved comparable-position evidence; otherwise incomparable/ambiguous. annual/instant null fields follow span and are not fabricated as quarter/start/duration. filed_at date-level visibility is disclosed; a future filing is invisible.
        verification: >-
          Independent expected identity/version/calendar table with distinct fact/accession/period assertions; no date-proximity or equal-value merging.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-07-FC04
        input: >-
          Annual FY2026 diluted EPS 4.90 and actual completed close 217.09 with price_date 2026-10-19; historical as_of on a non-trading day; current date without a completed today close; price older than the freshness policy; currency mismatch; and an unverified split basis between annual EPS and current price.
        expected_result: >-
          pe_fy = 217.09 / 4.90 = 44.3x, labeled fiscal-year and recording price_as_of, actual price_date, source, currency, freshness/availability, and adjustment basis. A non-trading/current-unclosed case uses the preceding completed close and labels the actual date, not "today's close"; a future close is never used. Stale/unverifiable price or currency/basis mismatch returns typed n/a; no TTM row is produced and no split/FX algorithm is added.
        verification: >-
          Fixture recomputation with actual price/availability metadata and negative cases for future/stale/currency/split basis; assert fiscal-year label and no TTM output.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-07-FC05
        input: >-
          Current six-month YTD FY2027 operating cash flow 74,421 and capex 4,434; a source with negative capex sign; negative FCF inputs; unknown capex sign; and a unit/scale variant.
        expected_result: >-
          FCF is 69,987 for the reported span; negative capex is normalized to positive outflow only when the source sign rule is verified, with source sign recorded; unknown sign is n/a, not abs(). Negative FCF is a valid value. Unit/scale is applied explicitly and the output stays in the declared source currency unit/scale. No quarter/YoY derivation.
        verification: >-
          Reported-span/sign/scale fixtures with independent expected FCF and negative-FCF validity; assert no derived quarter or FCF YoY.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-07-FC06
        input: >-
          The same fixture at as_of 2026-06-01; zero revenue; zero/negative EPS; non-positive growth base; missing fields; currency/unit mismatch; invalid business domains (total assets <=0, current liabilities <0); current-domain date-granularity uncertainty; and an all-n/a but complete bundle.
        expected_result: >-
          The latest visible period is 2026-04-26 and no later filing/price is used. Zero denominator/non-positive base/zero-or-negative EPS/currency/unit mismatch/invalid domain produce the typed n/a reason; negative profit or FCF remains valid; unknown current-date availability is excluded, not filled. An all-n/a complete bundle is valid evidence, not corruption. No look-ahead or silent defaults.
        verification: >-
          As-of, malformed/zero/domain, negative-profit/FCF, and complete-n/a bundle fixtures with independent expected reasons.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-07-FC07
        input: >-
          A metrics request under the shared data-access path with an instrumented vendor and FR-01 counters; a sentinel that fails on a direct vendor call.
        expected_result: >-
          Every fact fetch, including historical comparisons, uses unified data access, run cache, provenance, and FR-01 counters; direct vendor calls = 0; query/cache/HTTP/provenance counters are consistent. Metrics create no second data path.
        verification: >-
          Instrumented data-access integration with direct-call sentinels and counter/provenance assertions.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-07-FC08
        input: >-
          The fundamentals node with an LLM that never calls the metrics tool, with the fundamentals analyst enabled and disabled; FR-07 enabled/disabled; an applicable stock and a non-applicable asset; a downstream first consumer; and the persisted publication/recovery material.
        expected_result: >-
          When FR-07 is enabled/applicable, the program appends the numeric block regardless of tool/LLM use or analyst switch; status is computed/n/a only and approximate is not emitted. The bundle is persisted with versions/digests before downstream consumption. A non-applicable asset is explicitly not_supported with a reason and no SEC facts, without by itself creating a critical gap. FR-07 disabled is not evidence that the requirement is satisfied.
        verification: >-
          No-tool fake-LLM node tests with analyst on/off, applicable/non-applicable, downstream-order, status, and persisted-bundle assertions.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-07-FC09
        input: >-
          A structured claim revenue_yoy_q for 2026-07-26 = +68.6% versus computed +105.9%; percent/ratio variants; a claim at the display boundary; a missing-unit/period claim; a computed-n/a claim; and free-form prose with an unmapped number.
        expected_result: >-
          Mapped claims are compared after canonical half-up to the declared display resolution; a mismatch is disclosed with claimed/computed/formula/period/refs and labeled unverified; percent/ratio is normalized, not compared as raw 0.1 vs 10%. Missing unit/period is unscoped; computed n/a is unable_to_verify; free-form unmapped numbers are outside deterministic detection and not called verified. Disclosure/human review does not invent a formal gate block; the wrong number is never authoritative.
        verification: >-
          Independent structured-claim/display-resolution/unscoped/n-a fixtures; assert disclosure fields, labels, and absence of a new formal blocker.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-07-FC10
        input: >-
          An uncommitted snapshot_ready recovery with a persisted bundle; an already committed valid publication; a missing/corrupt bundle; a complete all-n/a bundle; and an unsupported formula/renderer version.
        expected_result: >-
          The uncommitted case restores the persisted authoritative values and completes the original publication without refetch/recalculation/model/graph; the committed case is a no-op and does not rewrite. A missing/corrupt bundle rejects the pending publication without live fetch; a complete n/a bundle is valid and readable; an unsupported formula/renderer version is reported unsupported, not replaced by a new calculation. Digests and versions match the saved bundle.
        verification: >-
          Three-way recovery fixture with dependency sentinels, digest/version comparison, complete-n/a acceptance, and unsupported-version rejection.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
    tradeoff: Prioritize direct, period-aligned, exact-decimal metrics with explicit n/a and saved evidence. TTM, FCF YoY, single-quarter subtraction, a second vendor path, and model arithmetic as numeric authority remain out of scope. GR-01 Stage A is an implementation prerequisite; no independent reference is fabricated here.
    implementation_dependencies: [FR-01, FR-02, FR-03, INV-01, GR-01]
    constraint_relations:
      - SB-01
      - SR-01
      - FR-06
      - FR-08
      - GR-01
    conflicts:
      - 'Model arithmetic can be wrong. Resolution: program metric_block is the numeric authority and mapped conflicts are disclosed.'
      - 'Statement tables are irregular. Resolution: structured period/fact identity and fiscal-order/version rules, not columns or date proximity.'
      - 'Leap/53-week fiscal calendars can differ in days. Resolution: compare fiscal position/span with documented calendar evidence, not exact-day or near-date heuristics.'
      - 'P/E can mix split/currency bases. Resolution: require compatible per-share basis and actual completed price_date, else n/a; no new adjustment algorithm.'
      - 'A complete n/a bundle could look like corruption. Resolution: distinguish complete n/a from missing/corrupt; only the latter blocks metric-dependent publication.'
      - 'The model may ignore the tool or the fundamentals analyst may be disabled. Resolution: program block independent of tool/analyst switch.'
    assumptions:
      - "The source universe is SEC US-GAAP facts; unsupported assets return explicit not_supported without invented SEC facts or automatic critical coverage."
      - "Facts are read through unified data access and FR-01 accounting; no new direct vendor path."
      - "The first version uses date-level filing visibility and a completed close selected by the price service; no intraday point-in-time or assumed today close is claimed."
      - "Fiscal comparability uses issuer fiscal position/span plus documented calendar evidence; leap/52-53-week differences are not automatically incomparable or automatically equal."
      - "Formulas, units/scale, display half-up, and display-resolution claim comparison are fixed in the versioned metric contract; TTM and FCF YoY remain deferred."
      - "Only computed/n/a are produced by the current policy; approximate is schema-only future compatibility and is not an arbitrary degradation path."
      - "A complete n/a bundle is valid evidence; a missing/corrupt bundle blocks metric-dependent publication; recovery loads saved values and does not recalculate."
      - "GR-01 Stage A is frozen before the first FR-07 application implementation; this requirement does not approve a reference."
    notes: >-
      FR-07 is the corrected form of the reviewed personal FR-01 proposal; that source artifact is not retained. pre-v1.24.0 AC10 moved to GR-01; AC4/AC5 are narrowed to fiscal-year P/E and reported-span FCF; TTM metrics and FCF YoY are deferred. NVDA expected values are independently recomputed. v1.22.0 fixes fiscal comparability/version selection, date-level visibility, completed-close P/E, formula/display/claim resolution, analyst-off/non-applicable behavior, n/a-vs-corrupt bundle, and restored-value recovery. No implementation or benefit is claimed.

  - id: FR-08
    type: "functional"
    title: "Unified downstream analyst-report brief with canonical gaps and bounded context"
    priority: "Must"
    status: "approved"
    stakeholders: [operator, reviewer, trader, analyst]
    sources:
      origin: "Reviewed personal proposal (source artifact not retained in the repository), reclassified as a functional context-delivery policy and reviewed against current prompt assembly"
      evidence:
        - path: "baseline/runs/baseline-20261020-01/metrics.json"
          locator: "tokens_in; tokens_out; llm_calls"
          description: "Baseline token totals used only as context; no brief benefit is measured."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/transcripts/final_state.json"
          locator: "analyst report fields"
          description: "Recorded analyst reports including gap statements and report lengths."
          source_type: "measured_baseline"
        - path: "TradingAgents/tradingagents/agents/context.py"
          locator: "report_or_absent"
          description: "The single function through which the five downstream debate agents read analyst reports."
          source_type: "code"
        - path: "TradingAgents/tradingagents/agents/researchers/bull_researcher.py"
          locator: "report_or_absent calls and prompt assembly"
          description: "Representative downstream consumer; the same pattern exists in bear_researcher.py and the three risk debaters."
          source_type: "code"
        - path: "TradingAgents/tradingagents/agents/researchers/bear_researcher.py"
          locator: "report_or_absent calls and prompt assembly"
          description: "Downstream consumer of the same full analyst reports."
          source_type: "code"
    problem: >
      The five downstream debate agents receive all four full analyst reports on
      every run, even when the reports are well below context-overflow thresholds.
      A proposed fixed character limit conflicts with an unlimited requirement to
      preserve every gap paragraph and metric. Keyword matching for unavailable
      data is not a canonical coverage source. A model-written brief can omit or
      forge required content, and token/cost benefit has not been measured.
    statement: >-
      The system MUST define one downstream context-delivery policy for the Bull Researcher, Bear Researcher, and the three risk debaters only. Those five roles receive a downstream_brief that replaces the four full analyst reports (market, sentiment, news, fundamentals); the brief and the four full reports are never injected together for the same role. Other roles keep full inputs. The brief is a downstream view, not a formal artifact and not a second context authority. Mandatory non-compressible content comes from the versioned program FR-03 coverage view (canonical gaps and required limitations), the applicable FR-07 metric block with n/a/not_supported status and source references, and applicable safety constraints. Compressible narrative covers stance, key levels/triggers, and conclusion. Gap content MUST NOT be inferred from words such as unavailable in report text.
      Budgets are tokens from the selected tokenizer/model identity, not bytes or characters. The versioned brief_budget_policy declares budget_unit=tokens, tokenizer_id/version, model/context limit, mandatory_budget M, compressible_budget C, initial brief_total_budget T=M+C, brief_hard_cap H>=T, reserve_output_tokens R, and the full-request input cap L. Byte and character counts are auxiliary only and are never added to tokens. Mandatory content is reserved first and MUST NOT be truncated. The brief's own hard cap is not the whole model request cap: system messages, role inputs, history, tool schemas, reference payload, and output reserve are included when checking the final serialized request against L, with R reserved. If the selected tokenizer is missing or cannot measure reliably, return a typed configuration failure; do not fall back to approximate character success. Missing or invalid functional policy rejects. If mandatory content exceeds H, reject with BRIEF_REJECTED without trying a reference. Otherwise the fixed order is: retain narrative within the initial budget; reduce only compressible content in declared order; expand to H when the policy allows and the full request still fits; use a controlled reference whose payload is resolved, verified, and token-measured before the model call and counted against the request cap; use the saved full report only when it fits the full-request cap and canonical mandatory content is added exactly once; otherwise BRIEF_REJECTED.
      A reference is an application-controlled handle, not a path string; the handle is resolvable only when the application-side resolver returns a verified payload. The resolver MUST obtain a payload bound to the source digest, verify it, inject the actual content into the receiving request, and re-measure the complete token budget before the call. If no resolver exists or the payload cannot be resolved/verified, the reference branch is unavailable and the ordered fallback continues; a handle or path alone is never success. A full-report fallback uses saved original report content, adds any missing canonical mandatory content (one authoritative instance), and must obey the full-request cap. Neither reference nor full-report fallback bypasses safety/source checks. BRIEF_REJECTED is the single terminal rejection; an invalid marker is a rejection_reason=invalid_marker under that terminal state, not a separate continuing status. After BRIEF_REJECTED, affected roles receive no model call and no bypass may use missing context to continue a successful formal run; a diagnostic/error record may exist, consistent with FR-02 context-stage failure.
      The brief uses FR-03 CoverageView, not the final sealed coverage snapshot, and records coverage_view_version/profile_hash, source report digests, metric_bundle_digest, mandatory_digest, source summary, policy/tokenizer/model identity, budget decision, omitted compressible identifiers, reference information, and fallback/rejection reason in a separate ContextAuditMetadata. Before each target-role call, the source/view versions are checked; if they changed, the brief is reassembled under the same policy and the new version is recorded. Earlier calls are not rewritten; the final gate still uses the sealed snapshot. The audit record is not a commit authority and MUST NOT mutate full reports, formal records, history, or recovery material. Deterministic extraction/assembly is the default; model summarization, a new retrieval tool, or a Web UI is not required. Marker syntax/IDs and duplicate/forged/overlong handling are fixed by a versioned contract with deterministic fallback. Byte-identical output is claimed only when the complete delivered request needs no normalization/injection/removal and mandatory content is already present; otherwise only specified semantic fields are preserved.
      FR-08 functional acceptance covers role mapping, mandatory/refs, budget enforcement, ordered fallback, terminal rejection, non-mutation, and audit. It is independent of CR-01 quality/cost optimization: missing prices or unapproved CR-01 thresholds may leave CR-01 blocked but do not block FR-08 functional acceptance. FR-08 makes no cost, token, or whole-application saving claim. The active brief evaluation contract is docs/req/evaluation/brief-eval-contract-v4.json; the frozen evaluation files are unchanged. The frozen evaluation set/rubric/prompt/config/snapshots are not edited to satisfy this requirement.
    fit_criterion:
      - id: FR-08-FC01
        input: >-
          Report fixtures with a valid single brief marker; missing/duplicate/forged/overlong markers; NFC-equivalent text; forged sources; mandatory content duplicated; a missing tokenizer; an invalid marker; and a short report that either already contains all mandatory content or misses it.
        expected_result: >-
          A valid single marker is extracted deterministically. Missing/duplicate/forged/overlong markers use the fixed fallback or terminal BRIEF_REJECTED with rejection_reason invalid_marker; no panic or untyped failure. Forged metrics/sources are not admitted. Unicode/NFC normalization is deterministic; byte-identical is claimed only when the complete delivery already has mandatory content and needs no injection/normalization; otherwise the narrative may remain a separate layer while mandatory content is injected once and the token budget is counted. A missing tokenizer is a typed configuration failure, not character-based success.
        verification: >-
          Offline extractor/fallback tests over marker/Unicode/source/short-complete/short-missing/tokenizer cases; assert typed outcome, mandatory injection once, token budget, and no forged content.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-08-FC02
        input: >-
          Canonical coverage gaps, the metric block, sources, safety constraints, narrative, and fixed tokenizer fixtures where mandatory exceeds M but fits H, mandatory exceeds H, the brief fits but the full request with reserve output exceeds the input cap, a reference resolves with payload tokens, no resolver exists, the reference payload exceeds the request cap, and a full report lacks mandatory content.
        expected_result: >-
          Mandatory is never truncated. The fixed ordered branches are followed: mandatory>H -> BRIEF_REJECTED; otherwise narrate/compress compressible content only, expand to H when allowed and the full request fits; otherwise use a reference only if its resolved payload is verified and token-measured within the full request cap; otherwise full-report fallback only when it fits and mandatory is added exactly once; otherwise BRIEF_REJECTED. A path/handle without resolved content, a missing resolver, or an over-cap payload is not success. Full request input + reserve output never exceeds L. Every success has complete mandatory content and no duplicate full+brief injection.
        verification: >-
          Fixed-tokenizer budget fixture against docs/req/fixtures/brief_budget_policy_v2.json with independent expected branch order, mandatory preservation, resolved payload tokens, output reserve, and full-request cap assertions.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-08-FC03
        input: >-
          The five role prompts and all other readers, with full-report copies before/after brief generation; a source/view change between role calls; a full-report fallback; and the audit metadata.
        expected_result: >-
          Only Bull Researcher, Bear Researcher, and the three risk debaters receive the brief; for those five it replaces the four full reports and no full+brief duplication occurs. Other roles keep full inputs. A source/view change causes reassembly before the next affected role call and records the new brief/view version; earlier calls are not rewritten; the final gate still uses the sealed snapshot. context_audit_metadata records run/role/brief/view/source/policy/tokenizer/budget and fallback/rejection identity. Full reports, formal records, history, and recovery material remain byte-identical before/after brief generation. A full-report fallback contains canonical mandatory exactly once.
        verification: >-
          Prompt-builder and artifact-copy tests with exact role replacement/no-duplication, view-change reassembly, audit linkage, and before/after byte comparison.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-08-FC04
        input: >-
          Deterministic and model-generated briefs with key numbers, canonical gaps, source references, n/a/not_supported metric states, safety constraints, a forged required field, a truncated compressible narrative, a terminal BRIEF_REJECTED, and null CR-01 thresholds/prices. Include post-rejection role/formal-success sentinels.
        expected_result: >-
          Every mandatory key number/gap/source/safety constraint is preserved and traceable; a model brief missing/forging a required field is rejected or falls back; length alone never proves fidelity. truncated applies only to compressible content and never means mandatory loss. BRIEF_REJECTED is terminal: no affected role model call and no formal-success bypass; diagnostic records only. CR-01 null thresholds/prices may leave CR-01 blocked but FR-08 functional behavior can pass independently. No quality/cost optimization threshold is part of this functional criterion.
        verification: >-
          Fidelity/gap/forged-field/n-a/not_supported/truncated/terminal-rejection/post-rejection sentinel tests; assert mandatory traceability and independent FR-08 acceptance with CR-01 blocked.
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
    tradeoff: Prioritize mandatory token-budgeted context, exact role replacement, resolved references, terminal rejection, and auditability. Model mini-summarization, a new retrieval tool, a Web UI, and cost/token optimization are not required. FR-08 functional acceptance is independent of CR-01 quality/cost acceptance.
    implementation_dependencies: [FR-02, FR-03, FR-07, SB-01, INV-01, SR-01]
    constraint_relations:
      - FR-01
      - SB-01
      - INV-01
      - SR-01
      - CR-01
    conflicts:
      - 'A fixed length limit conflicts with unlimited mandatory content. Resolution: token budgets separate mandatory/compressible and mandatory is never truncated.'
      - 'A brief budget is not the whole request. Resolution: check brief H and full request L with output reserve, including system/history/tools/reference payload.'
      - 'A reference handle can be mistaken for content. Resolution: resolve/verify/token-measure before the call; no resolver means the branch is unavailable.'
      - 'Full-report fallback can omit mandatory content. Resolution: add canonical mandatory exactly once and enforce the full-request cap.'
      - 'Early FR-03 view can be confused with the final gate snapshot. Resolution: version the view, reassemble on change, and let the final gate use the sealed snapshot.'
      - 'BRIEF_REJECTED and invalid_marker could diverge. Resolution: one terminal BRIEF_REJECTED with invalid_marker as reason; no bypass.'
      - 'Functional acceptance can be confused with CR-01 optimization. Resolution: FR-08 tests function/safety/budget; CR-01 owns quality/cost thresholds.'
    assumptions:
      - "Only the five named debate roles receive the brief; for those roles it replaces the four full analyst reports; all other roles keep full inputs."
      - "The brief is a view, not a formal artifact or a second context authority; the final gate uses the sealed FR-03 snapshot."
      - "Primary budget is tokens from the selected tokenizer/model; bytes and characters are auxiliary and never summed with tokens."
      - "The brief hard cap is separate from the full model request input cap; output reserve and system/history/tools/reference payload are included."
      - "Reference content is resolved, verified, and measured by the application before the model call; no resolver means the branch is unavailable."
      - "BRIEF_REJECTED is the single terminal rejection; invalid_marker is a reason. Full-report fallback adds mandatory exactly once."
      - "context_audit_metadata is separate and non-authoritative; it never mutates full/formal/history/recovery material."
      - "FR-08 functional acceptance is independent of CR-01 quality/cost optimization; no token/cost saving is claimed."
      - "Tokenizer/budget values, marker grammar, resolver activation, audit layout, and deterministic omission rules are pre-implementation design deliverables reviewed before the context module starts."
    notes: >-
      FR-08 is the corrected functional form of the reviewed personal CR-01 proposal; that source artifact is not retained. pre-v1.24.0 AC5 moved to CR-01. v1.22.0 fixes token-primary budgets, full-request cap, resolved references, five-role replacement/no duplication, versioned FR-03 view use, single terminal BRIEF_REJECTED with invalid_marker reason, audit linkage, and FR-08/CR-01 acceptance separation. The active brief evaluation contract is v3; v2 and v1 are historical and frozen evaluation files are unchanged. No implementation or measured benefit is claimed.

  - id: PR-01
    type: performance
    title: Bounded run-record write and end-to-end overhead
    priority: Should
    status: approved
    stakeholders:
    - reviewer
    - operator
    sources:
      origin: Split from FR-02-AC8 (pre-v1.24.0); baseline run and manifest contract
      evidence:
      - path: baseline/runs/baseline-20261020-01/metrics.json
        locator: duration and call counters
        description: Measured baseline duration and counters used to define the overhead scenario; no manifest-overhead
          measurement exists.
        source_type: measured_baseline
      - path: docs/req/run-manifest-schema.json
        locator: root contract
        description: Manifest payload and lifecycle record exercised by the write-overhead benchmark.
        source_type: document
      - path: TradingAgents/tradingagents/graph/trading_graph.py
        locator: propagate and _run_graph
        description: Run lifecycle where startup and terminal manifest writes occur.
        source_type: code
    problem: FR-02 requires a lifecycle manifest, but the cost of writing it is not measured. Without a paired benchmark
      and a fixed payload, a write-time or end-to-end overhead claim is not trustworthy.
    statement: 'Under a fixed, versioned offline replay workload (one ticker, one analysis date and run clock, one research
      debate round, one risk discussion round, a fixed role/capability set, and a fixed memory state) and a manifest
      payload whose actual serialized UTF-8 size is recorded for every sample and is at most 262144 bytes, measure the
      FR-02 manifest-recording path only. Enabled and disabled conditions MUST keep the same replay inputs, business
      graph, roles, rounds, data/cache initial state, risk policy, gate, report/final-state/memory plan, canonical computation,
      and non-manifest artifact checks. The only permitted difference is manifest-specific work: enabled builds, scans,
      validates, serializes, and atomically writes the running/terminal manifest; disabled uses a test-only no-op recorder
      and does not build or persist manifest-specific output. Shared business or safety work MUST NOT be disabled to
      make the baseline faster; any inseparable shared work is executed on both sides and disclosed. The disabled condition
      is a benchmark control, not a production configuration: it does not produce a committed publication and does not
      return trade authorization. Collect 20 enabled startup and 20 enabled terminal pre-replace write samples in external
      WriteEvidence. Each write sample starts at serialization start and ends when the temporary-file flush/fsync completes
      before the corresponding final atomic replace. That phase excludes the replace and is not the complete durable-write,
      read-back, cleanup, or caller-return latency. The manifest records only the observed cutoff before serialization
      and MUST NOT self-report its own write or replace duration. Separately run 20 valid enabled/disabled pairs in
      fixed AB/BA order: odd pairs run enabled first and even pairs disabled first; all 20 enabled runs MUST NOT be
      completed before the disabled runs. External duration starts at the same monotonic process-start event before
      the child and ends for enabled at successful return of the terminal replace and for disabled at return of the
      no-op recorder at the same coordination point. The external window includes the replace but excludes post-stop
      read-back, cleanup, and final caller return; it MUST NOT be called complete caller-return latency. For pair i,
      absolute_overhead_i = enabled_duration_i - baseline_duration_i and overhead_percent_i = absolute_overhead_i /
      baseline_duration_i * 100, with baseline_duration_i > 0. Compute nearest-rank p50/p95/max separately, with rank
      = ceil(p*N): for N=20, p95 is the 19th sorted sample and p50 is the 10th. Negative differences MUST be retained,
      not clipped, zeroed, or deleted. All attempts, pair_id, condition, order, status, duration or missing-measurement
      reason, actual payload bytes, environment, and input/fixture/source versions and digests are recorded. A functional
      failure, timeout, write failure, schema or semantic error, inequivalent result, or missing critical measurement
      prevents a complete performance pass for that batch and is not relabeled an environment anomaly. Only a pre-declared
      infrastructure failure unrelated to the function under test (for example a lost timing event or a cancelled external
      run) permits a whole-pair rerun; the original attempts are retained and linked to the replacement, retry limits/timeouts
      are fixed before the run, and exhaustion is incomplete, not pass. The 100 ms, 1%, and 1 s targets are provisional.
      Measurement validity, provisional-target attainment, functional acceptance, and formal performance acceptance
      are separate decisions. Missing or unapproved thresholds do not block FR-02 functional acceptance, and no benchmark
      result, speedup, or low-overhead claim is made here. Conclusions are limited to the measured payload sizes, workload
      identity, and declared environment; an untested payload near the cap is not claimed proven.'
    fit_criterion:
    - id: PR-01-FC01
      input: Twenty independent enabled runs of the fixed, versioned one-ticker/one-round workload. Each run records
        the startup pre-replace write duration in external WriteEvidence, from serialization start through temp-file
        flush/fsync before the startup atomic replace; the replace is excluded and the manifest does not self-report
        it. Each sample records the actual serialized UTF-8 payload bytes, which MUST be at most 262144 bytes, and the
        fixed fixture/config/replay/source identity and digests.
      expected_result: Nearest-rank p95 (the 19th sorted sample for N=20) of the 20 startup write samples is at most
        100 ms; N, p50/p95/max, actual payload bytes, environment, phase boundary, pairing/order, and all attempts are
        recorded. Write failures, timeouts, or missing measurements are reported and are not zero-filled or dropped.
        These samples may be the 20 enabled sides of the FC03/FC04 pairs; startup and terminal samples are separate but must come from the same pre-fixed workload. Combined with FC03/FC04, the conclusion is limited to the measured payload and workload.
      verification: External harness with monotonic phase timing over 20 independent enabled runs; report every sample;
        assert the boundary and nearest-rank p95.
      metric: startup_manifest_write_p95_seconds
      operator: <=
      threshold: 0.1
      unit: seconds
      zero_tolerance: false
      measurement_status: not_measured
      threshold_status: provisional
    - id: PR-01-FC02
      input: Twenty independent enabled runs of the same fixed workload and same permitted payload range. Each run records
        the terminal pre-replace write duration in external WriteEvidence, from serialization start through temp-file
        flush/fsync before the terminal atomic replace; the replace is excluded and the manifest does not self-report
        it. Actual UTF-8 payload bytes and fixed input/fixture/source digests are recorded.
      expected_result: Nearest-rank p95 (the 19th sorted sample for N=20) of the 20 terminal write samples is at most
        100 ms; N, p50/p95/max, actual payload bytes, environment, phase boundary, and all attempts are recorded. Startup
        and terminal samples are not mixed. These samples may be the 20 enabled sides of the FC03/FC04 pairs, with the same pre-fixed workload. Write failures, timeouts, or missing measurements are reported and are not
        zero-filled or dropped.
      verification: External harness with monotonic phase timing over 20 independent enabled runs; report every sample;
        assert the boundary and nearest-rank p95.
      metric: terminal_manifest_write_p95_seconds
      operator: <=
      threshold: 0.1
      unit: seconds
      zero_tolerance: false
      measurement_status: not_measured
      threshold_status: provisional
    - id: PR-01-FC03
      input: Twenty valid enabled/disabled pairs in fixed AB/BA order (odd enabled first, even disabled first) under
        the same fixed workload and business-equivalence conditions. Enabled and disabled differ only in manifest-specific
        work; disabled is a test-only no-op recorder, not a production publication path. External duration is measured
        from the same process-start event to successful return of the terminal replace (enabled) or no-op recorder (disabled).
        For pair i, absolute_overhead_i = enabled_duration_i - baseline_duration_i and overhead_percent_i = absolute_overhead_i
        / baseline_duration_i * 100 with baseline_duration_i > 0.
      expected_result: Nearest-rank p95 of the 20 overhead_percent samples is at most 1%; all attempts, order, status,
        negative differences, and missing/failure reasons are retained and reported; no clipping, deletion, zero substitution,
        mean substitution, or subtraction of two condition p95 values is used. A functional failure, timeout, inequivalent
        result, or missing critical measurement prevents a complete pass; only a pre-declared infrastructure failure
        permits a linked whole-pair rerun with the original attempts retained. The same fixed batch supplies FC04.
      verification: External paired benchmark; compute absolute and percent samples separately; assert baseline > 0,
        retained negative samples, and nearest-rank p95.
      metric: end_to_end_overhead_p95_percent
      operator: <=
      threshold: 1.0
      unit: percent
      zero_tolerance: false
      measurement_status: not_measured
      threshold_status: provisional
    - id: PR-01-FC04
      input: The same 20 valid enabled/disabled pairs, fixed AB/BA order, business-equivalence conditions, and external-duration
        boundary as FC03. absolute_overhead_i = enabled_duration_i - baseline_duration_i; disabled is a test-only no-op
        recorder and does not produce a committed publication or trade authorization.
      expected_result: Nearest-rank p95 of the 20 absolute_overhead samples is at most 1 second; all attempts, order,
        status, negative differences, and missing/failure reasons are retained and reported; no clipping, deletion,
        zero substitution, mean substitution, or subtraction of two condition p95 values is used. A functional failure,
        timeout, inequivalent result, or missing critical measurement prevents a complete pass; only a pre-declared
        infrastructure failure permits a linked whole-pair rerun with the original attempts retained. FC03 and FC04 use
        the same pre-fixed batch.
      verification: External paired benchmark; compute absolute samples; assert retained negative samples and nearest-rank
        p95.
      metric: end_to_end_overhead_p95_seconds
      operator: <=
      threshold: 1.0
      unit: seconds
      zero_tolerance: false
      measurement_status: not_measured
      threshold_status: provisional
    tradeoff: Prioritize bounded, separately measured write phases and an explicit paired overhead formula. Thresholds
      remain provisional; no write-time or end-to-end overhead claim is made until the benchmark exists. Functional
      correctness and truthful failure records take precedence.
    implementation_dependencies:
    - FR-02
    constraint_relations:
    - INV-01
    conflicts:
    - 'A startup record adds work before model calls. Resolution: sample startup and terminal writes separately and
      keep the running record bounded.'
    - 'A single run cannot prove overhead. Resolution: use 20 paired enabled/disabled trials, retain negative samples,
      and compute absolute and percent p95 separately.'
    - 'The write phase and the complete durable write are different. Resolution: name the pre-replace phase explicitly;
      the external runtime includes the replace.'
    assumptions:
    - The benchmark uses a fixed, versioned offline replay fixture and an approved local environment; no live model,
      vendor, broker, or network call is required.
    - Enabled and disabled execute the same business, safety, and non-manifest work; only manifest-specific recording
      is replaced by the test-only no-op recorder.
    - Actual serialized UTF-8 payload bytes are recorded per sample; the 262144-byte limit is measured, not inferred
      from an abstract payload size.
    - All 20 pairs are valid and use the same pre-fixed batch; failed or missing attempts are retained and cannot be
      filtered out to obtain a pass.
    - Thresholds are provisional and separate from functional acceptance and formal performance acceptance.
    notes: 'Historical source: FR-02-AC8 (pre-v1.24.0). No benchmark has been run; no overhead or speedup claim is made. The write
      phase and external window are distinct: the write phase ends before the replace, while the external window includes
      the replace and ends at the terminal replace/no-op return. The disabled condition is a benchmark control only.
      Provisional thresholds do not block FR-02 functional correctness.'
  - id: CR-01
    type: cost
    title: Downstream brief local cost attribution and approved target
    priority: Should
    status: approved
    stakeholders:
    - operator
    - reviewer
    - analyst
    sources:
      origin: Split from FR-08-AC5 (pre-v1.24.0); frozen brief evaluation contract
      evidence:
      - path: docs/req/evaluation/brief-eval-contract-v4.json
        locator: thresholds and token direction
        description: Revised brief evaluation contract v4; prices, cost threshold, quality threshold, and human approval
          are absent, so the contract is draft and blocked. v3, v2, and v1 are retained unchanged as historical revision
          drafts.
        source_type: document
      - path: baseline/runs/baseline-20261020-01/metrics.json
        locator: tokens_in; tokens_out; llm_calls
        description: Baseline token totals used only as context; no brief benefit is measured.
        source_type: measured_baseline
      - path: TradingAgents/tradingagents/agents/context.py
        locator: report_or_absent
        description: Downstream report-reading boundary whose input tokens the brief changes.
        source_type: code
    problem: A brief can reduce downstream input tokens while adding generation output tokens. Recording token counts
      does not prove a net cost improvement, and the evaluation contract currently has no approved prices or thresholds.
    statement: 'Under the local cost attribution brief on/off evaluation governed by docs/req/evaluation/brief-eval-contract-v4.json,
      with fixed model, configuration, data snapshot, risk policy, case set, and sample size, the controlled comparison
      MUST keep measurement, quality/safety, execution status, acceptance status, target attainment, and claim classification
      distinct. Measurement is valid only when formula fields use FR-02 field-level usage: each included call is reported
      or unknown with field coverage; unknown is never zero; a true no-generation-call result with G=0 is distinct from
      missing usage; and tokenizer estimates are labeled estimated rather than actual billable usage. G is the brief-generation
      output token total of the generation instance selected by the frozen generation_call_selection rule. A shared
      generation used by multiple roles is counted once; distinct view-update generation instances are recorded separately;
      failed or replaced candidates and retry/fallback calls outside the selected instance are excluded and fully recorded.
      D is the sum over the five target roles of the actual final request input difference, including message wrappers,
      mandatory content, resolved reference or full-report payload, and existing history; other input policies stay
      equal. Brief-generation input cost, excluded retry/fallback calls, downstream output changes, non-brief calls,
      and infrastructure are excluded and disclosed. For sample j, local_net_cost_j = G_j * Pout - D_j * Pin and net_tokens_j
      = G_j - D_j. D may be negative and is never clipped; net_cost is the sum over the fixed included samples, not
      a per-case mean unless a new contract version says otherwise. Amounts use Decimal and unrounded comparison values.
      Missing pre-run inputs, snapshots, prices, thresholds, approval, or required usage makes complete net_cost/net_tokens
      null or explicitly incomplete and cannot be accepted. Quality loss uses the frozen rubric with higher-is-better
      off-on, fixed case/sample equal-weight mean; safety escapes use fixed event definitions and MUST be zero. Execution
      and acceptance are two separate fields with one authority each. execution_status is not_started, running, completed,
      or aborted. acceptance_status is blocked, ready, accepted, or failed, and null only while running; pending and
      aborted are forbidden acceptance values. Before start: missing or invalid pre-run material -> not_started/blocked;
      all preconditions valid and no result -> not_started/ready. While running: running/null; observed_failures are
      recorded but are not an acceptance conclusion. Completed with valid result evidence bound to the current attempt
      and all applicable quality, safety, usage, sample, and cost conditions passing -> completed/accepted. Completed
      with any applicable failure or missing/corrupt/inconsistent evidence -> completed/failed. A started attempt stopped
      before completion -> aborted/failed, retaining the abort reason, observed_failures, produced evidence, and missing
      items; it must not fabricate a completed result. A started attempt MUST NOT return to not_started, ready, or blocked;
      an input digest mismatch after start ends aborted/failed or completed/failed. run_completed, if retained, is auxiliary
      and MUST equal execution_status=completed; contradictory combinations are invalid. accepted and failed are terminal
      for the current attempt; a retry or re-evaluation creates a new attempt and preserves the old input binding, failures,
      observed_failures, and evidence. Only completed/accepted may make budget_met, local_cost_saving, or token_reduction
      claims under the existing rules; null is not ready, accepted, a pass, or a benefit claim. No whole-application
      saving is claimed. Quality or safety failures cannot be offset by cost or token results.'
    fit_criterion:
    - id: CR-01-FC01
      input: Controlled brief on/off evaluation under contract v3 with field-level FR-02 usage, selected and excluded
        generation calls, shared and multi-view generation instances, five-role actual final-request input difference,
        prices, retry/fallback records, missing-price negatives, a true no-generation-call case, a missing-usage case,
        and a tokenizer-estimated case.
      expected_result: Added output tokens, brief-generation input tokens, reduced downstream input tokens, net tokens,
        added output cost, reduced input cost saving, and net cost follow contract v3. Selected generation calls and
        excluded retry/fallback calls are separately traceable; a shared generation is counted once; distinct view-update
        instances are counted separately; D includes wrappers, mandatory content, resolved references, and history.
        Unknown usage is not zero; missing required usage or either price leaves complete cost/token fields null or
        incomplete and unaccepted; a true zero-generation call is distinct from unavailable usage; tokenizer estimates
        are labeled estimated. Negative D is retained. Amounts use Decimal with no display rounding in comparisons.
        Formula or field errors = 0. No saving is claimed before accepted.
      verification: Contract-formula checks with missing-price, single-price, excluded-cost, and retry/fallback negatives;
        record all samples, scope, and digests; fail on any formula or null-handling error.
      metric: measurement_formula_error_count
      operator: ==
      threshold: 0
      unit: errors
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: CR-01-FC02
      input: The same controlled brief A/B with safety-escape counters and prohibited-content fixtures.
      expected_result: Safety escapes = 0; no cost or token result can offset a safety escape. A valid attempt that
        observes an escape is failed; a blocked attempt preserves observed_failures and cannot clear them or claim optimization
        success. Failure evidence remains visible after any retry.
      verification: Dependency and content sentinels on the brief and downstream path; assert zero escapes and failure
        on any escape.
      metric: safety_escapes
      operator: ==
      threshold: 0
      unit: escapes
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: CR-01-FC03
      input: Brief evaluation cases covering missing/invalid pre-run inputs; valid pre-run with no result; running with
        acceptance null; running/ready and running/accepted negatives; completed with all conditions passing; completed/failed
        from quality, cost, safety, missing result, missing sample, missing score, incomplete usage, or corrupt/inconsistent
        evidence; aborted/failed; aborted/ready and aborted/accepted negatives; not_started/null and completed/null
        negatives; acceptance pending and acceptance aborted negatives; input digest mismatch discovered after start;
        and a retry that creates a new attempt while preserving the prior terminal state and observed_failures.
      expected_result: The case table is evaluated by execution_status and acceptance_status, not by a single four-state
        value or run_completed flag. Missing/invalid pre-run material -> not_started/blocked; all preconditions valid
        and no result -> not_started/ready; started attempt -> running/null; completed with valid bound evidence and
        all conditions passing -> completed/accepted; completed with missing/corrupt/inconsistent evidence, missing
        required sample/score/usage, safety escape, or any applicable quality/cost failure -> completed/failed; started
        then stopped -> aborted/failed with abort reason, observed_failures, produced evidence, and missing items retained.
        running/ready, running/accepted, aborted/ready, aborted/accepted, not_started/null, completed/null, acceptance_status
        pending, acceptance_status aborted, and contradictory run_completed/execution_status are invalid. Input digest
        mismatch after start cannot return blocked or ready. accepted/failed are terminal for the attempt; retry creates
        a new attempt and preserves prior evidence.
      verification: 'Contract state-table check over brief_eval_states_v4.json and the validator: assert execution/acceptance
        pairs, invalid-combination rejection, result-evidence handling, and observed-failure/retry preservation.'
      metric: quality_loss
      operator: <=
      threshold_ref: docs/req/evaluation/brief-eval-contract-v4.json#/thresholds/quality_loss_max
      unit: rubric points
      zero_tolerance: false
      measurement_status: not_measured
      threshold_status: provisional
    - id: CR-01-FC04
      input: Ready-state cost evaluation with approved prices and net_cost_max, including below/at/above the boundary,
        positive/zero/negative local net_cost, negative D, token changes, a fixed sample-size version, and missing-sample
        negatives.
      expected_result: accepted requires net_cost <= approved net_cost_max; equality passes; above fails; null or unapproved
        net_cost_max yields blocked. The target compares the sum of local cost attribution over the fixed included samples;
        the case set, repetition count, and sample size are versioned and a change creates a new target version. Missing
        or excluded samples cannot be dropped to claim a pass. Negative differences are retained. Decimal unrounded
        values are compared. A positive difference within a positive budget is budget_met only and is not a saving;
        zero is not a strict saving; a negative local difference is local_cost_saving, never whole-application saving.
        Token change is separate and cannot substitute for cost.
      verification: Cost target boundary, blocked-threshold, zero/positive/negative, and token-substitution negatives
        against contract v4; record net_tokens and net_cost separately.
      metric: net_cost_usd
      operator: <=
      threshold_ref: docs/req/evaluation/brief-eval-contract-v4.json#/thresholds/net_cost_max
      unit: USD
      zero_tolerance: false
      measurement_status: not_measured
      threshold_status: provisional
    - id: CR-01-FC05
      input: 'Claim-classification cases: positive cost within a positive budget; zero difference; negative local difference;
        token reduction with non-negative cost; quality failure; safety escape.'
      expected_result: Positive within-budget => budget_met only; zero => no strict saving; negative local difference
        => local_cost_saving with no whole-application saving claim; token reduction => token_reduction with no whole-application
        saving; a pre-acceptance raw observation may be reported only with its blocked/failed/incomplete status and
        cannot be called optimization success; quality or safety failure => failed and cannot be offset by cost or token
        results; claim_boundary_violation_count = 0.
      verification: Static claim-rule checks over the revised state fixture; assert budget/target, local saving, token
        reduction, zero difference, and no whole-application claim.
      metric: claim_boundary_violation_count
      operator: ==
      threshold: 0
      unit: violations
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    tradeoff: Prioritize measurement correctness, zero safety escapes, quality preservation, an explicitly approved
      local cost target, and truthful claim boundaries. The target is blocked until prices and net_cost_max are approved.
      Budget attainment is not a saving claim; local saving is not whole-application saving; no token target or whole-application
      claim is made.
    implementation_dependencies:
    - FR-02
    - FR-08
    constraint_relations:
    - SB-01
    - INV-01
    conflicts:
    - 'Recording token counts can look like a saving. Resolution: separate measurement, quality/safety, target attainment,
      and claim classification; require an approved net_cost_max and actual net_cost at or below it.'
    - 'Quality can degrade while tokens fall. Resolution: require zero safety escapes and an approved quality_loss_max
      before acceptance.'
    - 'A local attribution can be mistaken for whole-application cost. Resolution: label the scope local, disclose excluded
      terms, and never claim whole-application saving.'
    assumptions:
    - The active contract is docs/req/evaluation/brief-eval-contract-v4.json, status draft and acceptance blocked; v1,
      v2, and v3 are retained historically and are not rewritten.
    - Usage follows the FR-02 field-level reported/unknown/field-coverage definitions; unknown is not zero; tokenizer
      estimates are labeled estimated.
    - G is the selected final delivered generation instance per the frozen selection rule; shared generation is counted
      once; distinct view-update instances are counted separately.
    - D is the five-role actual final-request input difference; other input policies are equal; brief-generation input
      cost, excluded retries/fallback, downstream output changes, non-brief calls, and infrastructure are excluded and
      disclosed.
    - The evaluation scope is local cost attribution; whole-application cost and saving are not claimed.
    - Prices and thresholds are unapproved; null is not zero and yields blocked, not pass.
    notes: 'Historical source: FR-08-AC5 (pre-v1.24.0). Contract v4 is a new revision draft; v3, v2, and v1 are retained
      unchanged. The contract is blocked; no cost or token benefit is measured or claimed. Expanding to full brief-call
      cost is a pending business decision, not approved here. FR-08 functional acceptance is independent of CR-01. Execution
      status is separate from acceptance status.'
  - id: GR-01
    type: governance
    title: Frozen independent reference set for financial metrics
    priority: Must
    status: approved
    stakeholders:
    - reviewer
    - analyst
    sources:
      origin: Split from FR-07-AC10 (pre-v1.24.0); baseline financial evidence
      evidence:
      - path: baseline/runs/baseline-20261020-01/transcripts/final_state.json
        locator: fundamentals_report
        description: Baseline report showing the +68.6% versus +105.9% discrepancy that motivates independent reference
          values.
        source_type: measured_baseline
      - path: TradingAgents/tradingagents/dataflows/vendors/sec_edgar.py
        locator: get_income_statement; get_cashflow
        description: Structured filing source whose expected values must be independently recorded.
        source_type: code
    problem: FR-07 needs reference values that are independent of the implementation under test. Without a frozen reference
      set, a matching result could be generated by the same code and would not validate correctness.
    statement: GR-01 has two stages. Stage A, pre-implementation freeze readiness, MUST pass before FR-07 implementation
      starts. The reference manifest MUST exist and be complete with at least two non-NVDA issuers deduplicated by stable
      issuer identity (not ticker spelling), documented distinct fiscal calendars with year-end/natural-quarter/52-53-week
      evidence, explicit periods, an FR-07 metric coverage matrix, and human review. Every expected value or n/a conclusion
      MUST be supported either by a conforming independently published value or by locatable published facts plus an
      independently reviewable derivation with formula, period, currency, unit/scale, rounding, and provenance. Expected
      values MUST NOT be generated by the implementation under test or any shared critical processing path; independent
      hand calculation, spreadsheets, or scripts are allowed when auditable and human-reviewed. A missing manifest MUST
      fail and MUST NOT pass because an implementation-generated expected-value count is zero. Machine checks prove
      presence, consistency, and ordering, not business independence. Stage B applies only after FR-07 implementation
      starts. The initial valid freeze MUST precede the first related application implementation. The reference version
      used MUST match the reviewed frozen version. A later reference revision is legal when it states the reason, old
      and new values and sources, affected metrics/tests/requirements, is independently re-reviewed, and is frozen before
      use as acceptance evidence; a legal revision need not predate the historical first implementation. Old references,
      failed results, and change reasons are retained; no retroactive freeze, backdated time, or post-hoc expected-value
      edit is allowed. FR-07 MUST list GR-01 as an implementation prerequisite and MUST NOT start implementation or
      acceptance until Stage A passes; GR-01 does not depend on FR-07 having been implemented. Implementation start
      means related application implementation, not documentation or independent reference preparation.
    fit_criterion:
    - id: GR-01-FC01
      input: A reference manifest with at least two non-NVDA issuers deduplicated by stable issuer ID, documented distinct
        fiscal calendars, explicit periods, source locators, and a coverage matrix over the current FR-07 metric families;
        missing, empty, one-issuer, duplicate-issuer, label-only-calendar, partial-coverage, and all-n/a negatives.
      expected_result: The manifest contains at least two distinct non-NVDA issuers; issuer identity is deduplicated
        by stable ID, not ticker spelling; fiscal-calendar differences have evidence, not just different labels; periods
        are explicit; and the coverage matrix shows the current FR-07 metric families and key period scenarios. Missing
        or incomplete manifests fail and do not pass vacuously. Human review confirms calendar and coverage adequacy;
        a revenue-only or all-n/a set cannot be claimed sufficient for the whole metric scope.
      verification: Machine parse for presence, count, calendar distinctness, period explicitness, and locators; human
        review of adequacy.
      metric: reference_company_count
      operator: '>='
      threshold: 2
      unit: companies
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: GR-01-FC02
      input: Per-value records using either a conforming independently published value or published facts plus an independent
        derivation; source records with publisher/source identity, document locator, version or retrieval date, content
        digest, period/unit/scale/rounding evidence; missing-source, wrong-period/unit, bad-digest, and URL-only-hash
        negatives.
      expected_result: Every expected value or n/a conclusion has a locatable source and reviewable derivation; direct
        published values must match the required definition, while derived values have locatable facts, formula, period,
        currency, unit/scale, and rounding. The digest identifies the fixed file or content projection, not merely a
        mutable URL string. A source that does not support the expected value fails. Machine checks confirm presence,
        locator shape, and digest consistency; human review confirms independence and adequacy.
      verification: Machine presence/locator/digest check plus human source-independence review; record the reviewer
        and evidence; machine passing alone does not prove independence.
      metric: expected_value_source_coverage_ratio
      operator: ==
      threshold: 1.0
      unit: ratio
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: GR-01-FC03
      input: Per-value provenance and dependency sentinels around the implementation under test; independent hand/spreadsheet/script
        derivations; implementation-generated or shared-critical-path values; and a missing-manifest zero-counter negative.
      expected_result: implementation_generated_expected_value_count = 0, where the count covers values generated by
        the FR-07 implementation under test or any shared critical processing path, not independent auditable scripts.
        Independent hand calculation, spreadsheets, and scripts are allowed and do not count as implementation-generated.
        A missing manifest fails regardless of the zero counter. Machine checks record provenance and forbidden calls;
        human review confirms the generation path is independent. No vacuous pass.
      verification: Machine provenance/sentinel check plus human review; missing-manifest negative must fail.
      metric: implementation_generated_expected_value_count
      operator: ==
      threshold: 0
      unit: values
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: GR-01-FC04
      input: 'Stage A readiness: reference manifest, per-value sources/provenance, freeze status/time/digest, and human
        review; no FR-07 implementation record is required.'
      expected_result: No FR-07 implementation record is required for Stage A. Stage A passes before implementation
        starts when the manifest is complete, sources/derivations and coverage are recorded, the freeze version/time/content
        digest are valid and digest-matched, and human review is complete. Absence of an implementation record is not
        missing evidence; missing or incomplete material fails. The manifest content digest is computed over a projection
        that excludes its own digest field and avoids a review/manifest digest cycle.
      verification: Machine completeness/digest/human-review-record check; pre-implementation negative case must pass
        without any implementation record, and missing material must fail.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: GR-01-FC05
      input: 'Stage B timing and revision cases: implementation not started; first implementation record after the initial
        freeze; first record before the freeze; reference-version mismatch; a post-implementation revision that is reviewed
        and frozen before use; a post-implementation change used without review; and a retroactively backdated freeze.'
      expected_result: If implementation has not started, Stage B is not_applicable and does not block Stage A. Once
        implementation starts, the initial valid freeze is later than or equal to no event and MUST precede the first
        related implementation record; the used reference version matches the reviewed frozen version; no retroactive
        or backdated freeze is used. A later revision is legal when its reason, old/new values and sources, affected
        metrics/tests/requirements, and review record exist, and it is frozen before use as acceptance evidence; it
        need not predate the historical first implementation. Old references, failed results, and change reasons are
        retained. Early, mismatched, retroactive, backdated, or unreviewed-revision cases fail.
      verification: Implementation-record ordering/version check; pre-start not_applicable case and post-start early/mismatch/retroactive
        negatives.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: GR-01-FC06
      input: The implementation-dependency graph and FR-07 gate state.
      expected_result: FR-07 lists GR-01 as an implementation prerequisite; GR-01 does not depend on FR-07; FR-07 implementation
        and acceptance are blocked until Stage A passes; dependency_gate_violation_count = 0. Static fixture success
        does not prove that a real Stage A reference set or human approval exists.
      verification: Dependency-graph and gate-state check; assert direction, no cycle, and blocked state before Stage
        A passes.
      metric: dependency_gate_violation_count
      operator: ==
      threshold: 0
      unit: violations
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    tradeoff: Prioritize independent, auditable expected values and a satisfiable implementation gate. Stage A can pass
      before FR-07 exists; Stage B applies only after implementation starts. Missing evidence fails rather than passing
      vacuously. Human review, not the script, decides source independence.
    implementation_dependencies: []
    constraint_relations:
    - FR-07
    conflicts:
    - 'A code-generated reference would be circular. Resolution: freeze independent sources and values before implementation
      and record provenance.'
    - 'A missing manifest could make a zero counter look clean. Resolution: require manifest presence before evaluating
      implementation_generated_expected_value_count.'
    - 'A pre-implementation timing check could block forever. Resolution: make Stage A pass without an implementation
      record and apply Stage B only after implementation starts.'
    assumptions:
    - The reference issuers, periods, sources, and coverage are a real human decision (OQ-14); no company, value, or
      approval is invented here.
    - An expected value may come from a conforming independent published value or from published facts plus an independently
      reviewable derivation; independent scripts are allowed when auditable.
    - Machine checks prove structural presence and ordering only; human review is required for independence, calendar
      evidence, and coverage adequacy.
    - Stage A may pass before any FR-07 implementation record exists; Stage B applies only after implementation starts.
    - A legal later reference revision is re-reviewed and frozen before use; it need not predate the historical first
      implementation.
    - Initial freeze timing must not be backfilled; old references and failed results are retained.
    notes: 'Historical source: FR-07-AC10 (pre-v1.24.0). Contract direction: FR-07 depends on GR-01 Stage A, never the reverse. Stage
      B is post-implementation timing and revision compliance only. The reference set is not frozen and no companies
      or values are chosen here; OQ-14 remains blocking for FR-07 implementation, not for approval of the GR-01 requirement
      itself. Static machine checks do not replace the real human reference approval.'
  - id: QR-01
    type: quality
    title: Live cache A/B quality non-regression and risk-policy evaluation separation
    priority: Should
    status: approved
    stakeholders:
    - analyst
    - reviewer
    - trader
    sources:
      origin: Split from the former v1.20.0 FR-01-AC7 and FR-04-AC11; frozen behavior-evaluation contract
      evidence:
      - path: docs/req/evaluation/behavior-eval-contract-v2.json
        locator: thresholds and blocking rules
        description: Active behavior-evaluation contract v2 (draft, blocked); it retains the frozen v1 eval set/rubric
          and adds the fixed scoring merge, adjudication, sample, attempt, REVIEW-rate, and safety-event rules. v1 remains
          frozen and historical.
        source_type: document
      - path: docs/req/evaluation/eval-set-v1.json
        locator: cases
        description: Frozen evaluation cases including the baseline NVDA case.
        source_type: document
      - path: baseline/runs/baseline-20261020-01/metrics.json
        locator: llm_calls and tokens
        description: Baseline context for the A/B workload; no live A/B result exists.
        source_type: measured_baseline
    problem: 'The cache A/B has two different questions: whether fixed replay and gate outcomes stay identical, and
      whether live model sampling degrades beyond the approved quality limit. Mixing them, or attributing a risk-policy
      REVIEW increase to cache regression, produces an invalid comparison.'
    statement: Given that FR-01-FC06 passes for deterministic fixed replay, live cache A/B evaluation uses the frozen
      eval set, docs/req/evaluation/behavior-eval-contract-v2.json, and fixed model/configuration/prompt/data snapshot/risk
      policy/gate version, with one original scored sample per case per condition. Rubric direction is higher-is-better.
      Two independent blinded raters score every dimension 0..5. For each dimension, a difference of at most 1 uses
      the arithmetic mean of the two ratings; a difference greater than 1 uses a third reviewer's reasoned final dimension
      score, not the best of the available ratings. The case score is the weighted mean over the five dimensions with
      weights 0.3/0.2/0.2/0.2/0.1; the set score is the equal-weight mean over the fixed cases. case_drop_i = score_off_i
      - score_on_i; mean_drop = sum(case_drop_i)/N; per_case_drop_max = max(case_drop_i). Negative drops are retained.
      Comparisons use unrounded values. Live mean drop MUST be at most 0.5; no single case drop may exceed 1.0; live
      REVIEW-rate increase MUST be at most 10 percentage points; unsafe output escapes MUST be zero. REVIEW_rate_condition
      = formal REVIEW completed evaluable cases / completed evaluable cases; the increase is 100*(rate_on-rate_off)
      in percentage points, not a relative percentage. Error, missing-score, missing-original-sample, and invalid cases
      are recorded and do not shrink the fixed verification set; if any required sample is missing, the evaluation is
      incomplete and cannot be accepted. Infrastructure retries create a new attempt and do not replace the original
      failed sample; best-of-retries is forbidden. The cache A/B MUST hold the risk policy snapshot, risk inputs, and
      gate version fixed. Risk-policy effects MUST be evaluated in a separate comparison under fixed cache, model, and
      data settings with its own approved thresholds; a risk-policy REVIEW increase MUST NOT be scored as a cache regression.
      The cache sub-evaluation may be accepted independently, but QR-01 all-complete requires the risk-policy comparison
      status; a blocked risk-policy comparison is neither a cache failure nor a full pass. Safety events are defined
      by the fixed event set and are an independent hard check; any real escape fails the formal evaluation and cannot
      be offset by rubric quality, REVIEW rate, tokens, or other improvements. Acceptance is blocked until every case
      snapshot, the fixed contract, and human approval are present; a frozen file is not an approval.
    fit_criterion:
    - id: QR-01-FC01
      input: Live A/B on the frozen eval set with identical model, configuration, prompts, data snapshots, risk policy,
        and gate version, cache enabled versus disabled; FR-01-FC06 passes; two blinded raters per case/condition, a
        <=1-point mean case, a >1-point adjudication case, negative drops, and a missing-score case.
      expected_result: Mean rubric drop at most 0.5 using the fixed weighted case score, equal-weight case-set mean,
        and off-on direction; the adjudicated final score and negative drops are handled as specified. Missing required
        samples make the evaluation incomplete and cannot produce acceptance. Per-case, REVIEW-rate, safety, and risk-policy
        separation are judged separately.
      verification: Run the frozen A/B; validate the contract and snapshots; record aggregate scores and deltas; fail
        on a mean-drop breach.
      metric: mean_rubric_drop
      operator: <=
      threshold: 0.5
      unit: rubric points
      zero_tolerance: false
      measurement_status: not_measured
      threshold_status: provisional
    - id: QR-01-FC02
      input: The same live A/B inspected per case, including a >1-point dimension adjudication that changes the case
        conclusion, an exact 1.0 boundary case, a negative-drop case, and a best-of-retries negative.
      expected_result: No single case rubric drop over 1.0; the per-case statistic uses one original scored sample per
        case/condition and the fixed final adjudicated score; infrastructure retries do not replace the original failed
        sample, and best-of-retries is not used. Mean, REVIEW-rate, safety, and separation are judged separately.
      verification: Per-case score comparison; fail on a per-case breach.
      metric: per_case_rubric_drop_max
      operator: <=
      threshold: 1.0
      unit: rubric points
      zero_tolerance: false
      measurement_status: not_measured
      threshold_status: provisional
    - id: QR-01-FC03
      input: The same live A/B with REVIEW-rate counters, including equal and unequal completed-evaluable denominators,
        error/missing-score runs, ten cases with one and two additional REVIEW outcomes, and a percentage-points-versus-relative-percent
        negative.
      expected_result: Live REVIEW-rate increase at most 10 percentage points; the increase is computed as 100*(rate_on-rate_off)
        and is not a relative percent. The denominator is completed evaluable cases; error, missing-score, and missing-original-sample
        runs are recorded and do not shrink the fixed verification set. If required samples are missing, the evaluation
        is incomplete and cannot be accepted; failed cases are not deleted to claim a pass.
      verification: REVIEW-rate comparison; fail on a rate breach.
      metric: live_review_rate_increase
      operator: <=
      threshold: 10
      unit: percentage points
      zero_tolerance: false
      measurement_status: not_measured
      threshold_status: provisional
    - id: QR-01-FC04
      input: Cache enabled versus disabled with the risk policy snapshot, risk inputs, model, data, and gate version
        fixed; a separate risk-policy comparison with its own approval state; FR-01-FC06 passes; and cases where risk-policy
        is blocked while cache has complete evidence.
      expected_result: Deterministic replay invariance belongs to FR-01-FC06; live output is judged only by FC01-FC03 and
        may vary within those limits. The cache comparison holds risk policy fixed; the risk-policy comparison separately
        changes policy under fixed cache/model/data and uses its own thresholds. A risk-policy REVIEW increase is not
        a cache regression; cache can be accepted independently, but QR-01 all-complete is not claimed while risk-policy
        is blocked. cache_risk_misclassification_count = 0.
      verification: Deterministic behavior-evaluation matrix with fixed-risk cache A/B and separate risk-policy A/B;
        assert separation, blocked state, and no misclassification.
      metric: cache_risk_misclassification_count
      operator: ==
      threshold: 0
      unit: misclassifications
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: QR-01-FC05
      input: The same live A/B with the fixed unsafe-output, gate-escape, secret-exposure, formal-output-violation,
        and risk-bypass event definitions, including a high-rubric-score case with a real escape and a repeated-event
        case.
      expected_result: unsafe_output_escape_count = 0; safety events are an independent hard check, not a rubric dimension
        average; no quality improvement, REVIEW-rate change, token reduction, or other score can offset a real escape;
        any escape fails the formal evaluation; repeated events are deduplicated by event key but their occurrence is
        not hidden. A blocked status does not erase an observed escape.
      verification: Dependency and safety sentinels on the live A/B; assert zero escapes and failure on any escape.
      metric: unsafe_output_escape_count
      operator: ==
      threshold: 0
      unit: escapes
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    tradeoff: Prioritize zero safety escapes and deterministic fixed replay from FR-01-FC06. Live quality is judged by
      separate mean, per-case, and REVIEW-rate criteria; risk-policy comparison isolation uses its own thresholds. No
      live measurement is claimed.
    implementation_dependencies:
    - FR-01
    - FR-04
    constraint_relations:
    - INV-01
    - INV-02
    - SB-01
    conflicts:
    - 'Live sampling noise can look like a cache regression. Resolution: FR-01-FC06 owns deterministic replay; QR-01
      judges live quality separately.'
    - 'A risk-policy REVIEW increase can be misattributed. Resolution: use a separate comparison with its own thresholds
      and keep it blocked until approved.'
    assumptions:
    - The frozen v1 eval set, rubric, config, prompt, and snapshot manifest remain unchanged; behavior-eval-contract-v2
      is the active draft and is blocked until snapshots and human approval exist.
    - One original scored sample per case per condition is the verification unit; retries create new attempts and never
      replace the original sample.
    - Scoring uses the declared two-rater merge, third-reviewer adjudication, five dimension weights, equal-weight case-set
      mean, and off-on direction.
    - REVIEW rate is a percentage-point increase over completed evaluable cases; missing evidence does not shrink the
      fixed denominator.
    - Safety events are an independent hard check and cannot be offset by quality.
    - Cache and risk-policy comparisons are separate; risk-policy blocked is not a cache failure or a full QR-01 pass.
    notes: 'Historical source: former v1.20.0 FR-01-AC7 and FR-04-AC11. FR-01-FC06 owns deterministic fixed replay; QR-01
      judges live quality separately. The contract is currently a draft and blocked; no live A/B result is claimed.
      A frozen contract is not an approval. Sampling, scoring merge, adjudication, attempt, REVIEW-rate, and safety-event
      rules must be fixed before evaluation; no live evaluation is run here.'
  - id: QR-02
    type: "performance"
    title: "Bounded startup recovery performance"
    priority: "Must"
    status: "deferred"
    stakeholders: [operator, analyst, reviewer]
    sources:
      origin: "From pxs QR-02, checked against the current source tree"
      evidence:
        - path: "TradingAgents/cli/run.py"
          locator: "_run_directory and run_analysis"
          description: "Current CLI has no recovery batch entry point to benchmark."
          source_type: "code"
        - path: "TradingAgents/tradingagents/reporting.py"
          locator: "write_report_tree"
          description: "Rendering is synchronous and has no measured recovery workload."
          source_type: "code"
        - path: "baseline/runs/baseline-20261020-01/run-manifest.json"
          locator: "all fields"
          description: "Baseline has no archive-recovery batch or performance evidence."
          source_type: "measured_baseline"
    problem: >
      An interrupted publication must be recovered without repeating analysis,
      and the recovery cost needs a fixed workload and measurable target. Without
      a defined platform, filesystem, output size, timing boundary, and failure
      handling, a timing result is not comparable or trustworthy.
    statement: >
      DEFERRED FOR D1. This requirement defines a future recovery-performance
      target and is not part of current acceptance. When activated, on a
      documented supported local filesystem, not limited to Windows/NTFS and
      excluding network or cloud shares, with 100 committed formal publications
      and 10 pending valid recovery snapshots, and with no competing writer,
      startup recovery MUST recover and validate all 10 pending runs without
      LLM, provider, external data, analysis graph, settlement, or reflection
      calls. Each pending snapshot contains the fixed 12-section report map,
      complete report, section manifest, one risk evidence object with policy
      reference, and one required memory idempotent write. Rendered output per
      run is no larger than 1,048,576 bytes, and each snapshot is no larger than
      1,048,576 bytes. Across 30 independently reset trials the nearest-rank p95
      batch duration MUST be at most 2.000 seconds. The 2-second value is a
      provisional target pending human approval, not an approved service level.
      Every trial MUST be correct. Failed, incorrect, and timed-out samples are
      retained and fail acceptance; they MUST NOT be discarded. No validation,
      hash, path, manifest, or read-time check may be skipped to meet the target.
      A missed time target fails this requirement but does not relax correctness
      or the model-free rule.
      Activation requires FR-06 implementation, an approved platform matrix, a
      frozen benchmark fixture, and human approval of the threshold. Until then
      no target is approved, measured, or used for acceptance.
      The timed boundary starts at the monotonic timer immediately before
      recovery claim and scan, and ends after final read-time retrieval
      validation of every recovered run, including lock acquisition, scans,
      fixed 12-section rendering, risk evidence handling, publication, the required
      memory write, and cleanup attempts. Record platform and OS, CPU/RAM, filesystem and mount,
      rendered output and snapshot sizes, section count, fixture version, source
      commit, all 30 samples, and failure handling.
    fit_criterion:
      - id: QR-02-FC01
        input: "Thirty independently reset trials with 100 committed publications and 10 pending valid snapshots; each pending snapshot contains the fixed 12-section report map, complete report, section manifest, one risk evidence object with policy reference, and one required memory idempotent write; rendered output per run <= 1,048,576 bytes, snapshot <= 1,048,576 bytes, documented supported local filesystem, no competing writer."
        expected_result: "All 300 recoveries pass normal get_run validation; forbidden LLM/provider/external/graph/settlement/reflection calls = 0; the required memory operation is idempotent; the 29th sorted batch duration is <= 2.000 seconds as a provisional target; any incorrect, failed, or timed-out trial fails acceptance; all samples and environment/output/section-count metadata are recorded; no validation is skipped."
        verification: "Recovery benchmark fixture with fixed 12-section/risk/memory workload and monotonic timing from immediately before claim/scan through final read-time validation; record all 30 samples, failures, platform, CPU/RAM, filesystem, mount, output/snapshot sizes, section count, fixture version, and commit."
        zero_tolerance: false
        measurement_status: "not_measured"
        threshold_status: "provisional"
        metric: recovery_batch_p95_seconds
        operator: <=
        threshold: 2.0
        unit: seconds
      - id: QR-02-FC02
        input: "The same recovery workload, including a slow or failing filesystem trial where the timing target is missed."
        expected_result: "Every completed recovery is correct and passes read-time validation; forbidden LLM/provider/external/graph/settlement/reflection calls = 0; no validation, hash, path, manifest, or read-time check is skipped even when the 2.000-second target is missed. Any incorrect, failed, or timed-out recovery fails acceptance. Correctness and model-free violations = 0."
        verification: "Slow/failing-filesystem correctness test with dependency sentinels, read-time validation assertions, and retained failure samples."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
        metric: incorrect_or_failed_recovery_count
        operator: ==
        threshold: 0
        unit: recoveries
    tradeoff: Prioritize correctness, model-free behavior, and the deliverable D1 scope. The 2.000-second target, 30-trial benchmark, and platform matrix are deferred until FR-06 exists and the platform and threshold are approved. Performance work must not skip validation.
    implementation_dependencies: [FR-05, FR-06]
    constraint_relations: [INV-01, SR-01]
    conflicts:
      - "Correctness checks and hashing cost time. Resolution: correctness and model-free behavior are zero-tolerance; the 2-second target is provisional and cannot justify skipping validation."
      - "A single-platform measurement can overfit. Resolution: require a documented supported local filesystem, not Windows/NTFS as the sole platform."
      - "Slow or failed trials can distort a p95. Resolution: retain every sample, record failures and timeouts, and fail acceptance when any trial is incorrect or timed out."
    assumptions:
      - The 2-second target is a provisional design target pending human approval.
      - The workload uses local storage only; network and cloud shares are out of scope.
      - The environment metadata and fixture version are recorded with every run.
      - D1 recovery is single-process; the benchmark measures the FR-06 recovery path.
    notes: >-
      QR-02 is deferred in this revision. The fixed workload, 30 trials, and nearest-rank p95 definition are retained as a future benchmark contract. The 2-second target remains provisional. The pxs Windows/NTFS assumption is not promoted to a project-wide platform restriction. Reactivation requires FR-06, an approved platform matrix, a frozen fixture, and human approval. No implementation, benchmark, or approved target is claimed. Must priority is within the deferred specification and is not a current gate; a future benchmark must not reintroduce active claim/fencing requirements.
  - id: SB-01
    type: invariant
    title: Deterministic fail-closed final-output gate with a separated model proposal
    priority: Must
    status: approved
    stakeholders:
    - trader
    - reviewer
    - security_reviewer
    sources:
      origin: Repository analysis and measured baseline
      evidence:
      - path: TradingAgents/tradingagents/agents/rating.py
        locator: L96-L117 parse_rating, run_rating, is_review
        description: The current rating path parses a rating and returns REVIEW only when no rating can be read; REVIEW
          is already a terminal sentinel outside the five-tier set.
        source_type: code
      - path: TradingAgents/tradingagents/agents/managers/portfolio_manager.py
        locator: L80-L103 invoke_structured
        description: The Portfolio Manager produces the final structured decision and writes final_rating/final_trade_decision
          directly; no data-coverage gate is applied.
        source_type: code
      - path: TradingAgents/tradingagents/graph/trading_graph.py
        locator: L358-L370 record_decision and L437-L465 _log_state
        description: The decision is persisted to the state log and memory before any coverage-aware code gate exists.
        source_type: code
      - path: TradingAgents/cli/run.py
        locator: L310-L340 streaming display and L380-L385 review notice
        description: The CLI streams and displays the Portfolio Manager output before any formal gate, then only warns
          when a rating is unreadable.
        source_type: code
      - path: TradingAgents/tradingagents/reporting.py
        locator: L20-L46 and L92-L119 write_report_tree
        description: Reports copy final_trade_decision and the rating header directly; there is no formal blocked-decision
          body.
        source_type: code
      - path: TradingAgents/tradingagents/memory/log.py
        locator: L32-L60 store_decision
        description: The memory log stores the model decision and rating tag without a gate result or an explicitly
          separated unapproved proposal.
        source_type: code
      - path: TradingAgents/tradingagents/backtest.py
        locator: L150-L170 propagate calls and L196-L207 scoring
        description: Backtest cells call propagate directly and score by rating; REVIEW is excluded from scoring rather
          than produced by a coverage gate.
        source_type: code
      - path: baseline/runs/baseline-20261020-01/transcripts/final-status.json
        locator: final_rating and final_trade_decision
        description: The baseline persisted a Hold decision while news and social sources were unavailable; no gate
          recorded or blocked it.
        source_type: measured_baseline
      - path: baseline/runs/baseline-20261020-01/results/reports/NVDA_20261020_193209/5_portfolio/decision.md
        locator: entire file
        description: The saved formal decision is the model's Hold text, with no coverage/gate notice.
        source_type: measured_baseline
    problem: 'The baseline could persist, display, and score a tradeable rating even when critical sources were unavailable.
      The model decision and the formal decision were the same text, so a critical-gap REVIEW changed only the rating
      and left the trade recommendation visible as the official conclusion. The gate input was not a trusted snapshot,
      incomplete or contradictory inputs had no defined handling, gate failure had no fallback, and the gate was not
      verified across all entry points.

      '
    statement: 'Normal analysis that reaches formal finalization MUST produce a formal decision through deterministic
      gate code from a trusted gate_input containing one immutable coverage_snapshot produced by the availability program
      and one model_proposal. The gate MUST treat the snapshot as authoritative; the model MUST NOT create, supply,
      or mutate coverage_status or critical_gaps. The gate MUST return a gate_result with status passed, blocked, or
      error and reason_codes from the closed gate_reason_code set, and a gate_result or in-memory formal_decision is
      not publication success: every formal output and committed publication still requires the FR-02/INV-01/SR-01/SR-02
      checks, and a gate pass MUST NOT clear a later scan, schema, artifact, or write failure. The formal decision MUST
      be approved only when coverage_status is complete, critical_gaps is empty, every critical requirement has an availability
      record, the critical profile is valid, the snapshot is current, the model rating is one of the five legal ratings,
      and the FR-04 risk branch is either not_applicable under the allowed conditions or applicable and passed. No formal
      approval is allowed unless every other required gate, manifest, and security precondition also passes; SB-01 does
      not override them. Stock Buy or Overweight is always applicable: the gate MUST validate the real risk input and
      actually invoke the shared FR-04 evaluator, recording a passed, blocked, or error result even when coverage or
      another check also blocks; a model-supplied passed risk object is not authoritative. A missing, unsupported, inconsistent,
      insufficient-cash, or invalid risk input MUST block with portfolio_risk_input_invalid; a risk limit breach MUST
      block with portfolio_risk_limit_exceeded; neither may be reported as not_applicable. A risk evaluator exception
      MUST produce gate status error, portfolio_risk_evaluator_error, formal_decision.status = blocked_for_review, final_rating
      = REVIEW, review_class = gate_system_error, and no tradeable output. A critical gap, a model REVIEW, coverage/gap
      contradiction, malformed or missing input, an invalid critical profile, a missing availability record, a stale
      or hash-mismatched snapshot, or a gate exception MUST block the formal decision. A blocked+REVIEW result MAY be
      recorded as completed only when trustworthy real materials satisfy the approved formal-record contract, including
      a real available profile/snapshot/identity and the required artifacts; otherwise the run is failed, or the caller
      receives a typed error when no safe failed record can be written. Missing, invalid, or malformed materials MUST
      NOT be repaired by fabricating a profile, snapshot, gap, success input, or completed record. Startup, analysis,
      scan, and unsafe-write failures follow the FR-02/SR-01 safety-write exceptions; no formal tradeable success is
      ever returned, and a failed file is not claimed to exist when it cannot be written safely. Unsupported profile
      version MUST map to blocked / invalid_critical_profile / input_invalid. Unsupported snapshot schema version MUST
      map to blocked / snapshot_hash_mismatch / gate_system_error with internal_detail = unsupported_snapshot_version;
      there is no alternative mapping. stale_coverage_snapshot means a parseable, integrity-valid snapshot
      whose lineage is not current for the run; snapshot_hash_mismatch means the content digest does not match; an unsupported
      schema version is the stated compatibility mapping. Producer trust is established by the application call boundary,
      controlled object source, and current RunContext, not by a hash alone. When blocked, final_rating MUST be REVIEW
      and the formal decision text MUST use the review_class matched to the primary reason and state that manual review
      is required; it MUST NOT mislabel a rating/system failure as missing data. The model_proposal MUST be retained
      separately with proposal_status = unapproved and MUST NOT be presented as the formal conclusion. The gate MUST
      run before the terminal manifest and every formal output that contains a formal decision; the running startup
      manifest may be written before the gate with safety_gate.status = not_run. The terminal commit is evaluated after
      the gate with no circular wait, and gate pass does not authorize publication if a later scan or write fails. Formal
      outputs MUST consume the same formal_decision and coverage_snapshot. Intermediate streaming, debug, staging, checkpoint,
      and raw-agent outputs MAY show the model proposal only when marked intermediate or not approved. All entry points
      and recovery MUST use the same gate/evidence path; recovery verifies the saved gate result, version, binding,
      and evidence and MUST NOT re-run the model or substitute a new policy decision. A timeout produces a terminal
      error, and a late success MUST NOT overwrite the returned failure or trigger publication. The gate makes no model
      call and is not a second publisher.'
    fit_criterion:
    - id: SB-01-FC01
      input: Five fixtures, one per legal model rating (Buy, Overweight, Hold, Underweight, Sell), each with a valid
        trusted coverage_snapshot that is partial and contains a critical gap. Buy and Overweight provide valid risk
        input; the gate actually calls FR-04 and produces a passed result. Hold, Underweight, and Sell use not_applicable.
        Every model proposal is valid and its decision text contains a trade recommendation.
      expected_result: For all five ratings, gate_result.status = blocked, reason_codes contains critical_gap, formal_decision.status
        = blocked_for_review, final_rating = REVIEW, and the formal decision text uses the data_insufficient review
        class and states that manual review is required. The gate-produced passed risk result is recorded for Buy and
        Overweight but does not override the critical gap. The model_proposal is retained with proposal_status = unapproved
        and is not presented as the formal conclusion. Non-REVIEW formal ratings = 0; report, manifest, final-state,
        and memory agree when the formal records can be formed.
      verification: Integration test over all five ratings, including the applicable passed-risk and not_applicable
        branches; assert gate result, formal rating and text, proposal separation, risk result presence, and every formal
        consumer.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: provisional
    - id: SB-01-FC02
      input: Five fixtures, one per legal model rating, each with complete coverage, empty critical_gaps, every critical
        requirement present, a valid current profile/snapshot, and all other publisher/security preconditions passing.
        Buy and Overweight provide valid risk input and the gate produces a passed FR-04 result; Hold, Underweight,
        and Sell use not_applicable. A sixth subcase passes the gate but fails a later scan or terminal write.
      expected_result: For the five valid fixtures, gate_result.status = passed, formal_decision.status = approved,
        final_rating equals the model rating, no REVIEW is introduced, and the approved model text is used. For Buy
        and Overweight the gate-produced passed risk result is recorded and does not change the rating; not_applicable
        does not block the other three. In the gate-pass/later-failure subcase, no approved publication is exposed and
        the failure is reported safely; gate pass does not clear later failure. Rating changes = 0 for the valid fixtures;
        formal consumers agree when publication succeeds.
      verification: Integration test over all five ratings, including the applicable FR-04 pass and not_applicable branches;
        assert gate result, unchanged rating, approved formal text, risk result presence, and every formal consumer.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: provisional
    - id: SB-01-FC03
      input: A fixture with coverage_status = complete and an empty critical_gaps list, where the model proposal itself
        returns REVIEW and REVIEW text.
      expected_result: Gate_result.status = blocked with reason_codes containing model_review; formal_decision.status
        = blocked_for_review; final_rating = REVIEW; the formal text is the deterministic review notice; REVIEW is not
        converted to Hold and is not treated as a passed five-tier rating; the model proposal is retained as REVIEW
        with proposal_status = unapproved; tradeable formal ratings = 0.
      verification: Unit test for the model-REVIEW case plus integration through the formal consumers; assert gate status,
        final rating, text, and proposal status.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: SB-01-FC04
      input: 'Two independent contradiction fixtures with a Hold rating and no FR-04 risk requirement: complete coverage
        with a non-empty critical_gaps list, and partial coverage with an empty critical_gaps list. Separately, one
        blocked case whose trustworthy materials permit a complete formal record and one whose missing/untrustworthy
        materials do not.'
      expected_result: Both contradictions are blocked with coverage_gap_mismatch, blocked_for_review, REVIEW, and the
        coverage-inconsistency review class; neither is passed or treated as a five-tier decision. The trustworthy blocked
        case may be completed only with real schema-valid artifacts and evidence; the untrustworthy case is failed or
        safely returns an error without claiming a completed record or fabricating a profile/snapshot. Tradeable formal
        ratings = 0.
      verification: Separate unit tests for each contradiction plus integration through the formal consumers; assert
        each case independently.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: SB-01-FC05
      input: 'A table of independent malformed-input fixtures with an otherwise valid Hold rating: illegal coverage_status;
        missing critical_gaps; wrong gap type; missing availability record; invalid critical profile; missing/invalid
        model rating; missing gate_input; unsupported profile version; and unsupported snapshot schema version. Each
        case is paired with a trustworthy-material variant and an untrustworthy-material variant where applicable.'
      expected_result: 'Each fixture has exactly one gate status and primary reason: invalid_coverage_status, missing_gap_list,
        invalid_gap_type, missing_availability_record, invalid_critical_profile, invalid_model_rating, and missing_gate_input
        are blocked with their review class and REVIEW. Unsupported profile version is blocked / invalid_critical_profile
        / input_invalid. Unsupported snapshot schema version is blocked / snapshot_hash_mismatch / gate_system_error
        with internal_detail = unsupported_snapshot_version. No fixture produces a tradeable formal rating and no two
        mutually exclusive outcomes are both accepted. A blocked result is completed only when real trustworthy materials
        satisfy the record contract; otherwise the run is failed or safely errors, with no fabricated snapshot/profile
        and no claimed file that was not written.'
      verification: Table-driven unit tests for every malformed input plus integration through the formal consumers;
        assert each reason code independently.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: SB-01-FC06
      input: Hold-rating fixtures where the model supplies or alters coverage_status and critical_gaps; forged/cross-run
        producer objects; a stale snapshot; a content-hash mismatch; an unsupported snapshot schema version; and a valid
        current program-produced snapshot.
      expected_result: Model-supplied coverage and gaps are ignored. The stale snapshot is blocked with stale_coverage_snapshot;
        the content mismatch is blocked with snapshot_hash_mismatch; the unsupported schema version uses the distinct
        internal_detail unsupported_snapshot_version under the snapshot_hash_mismatch compatibility mapping; a forged
        or cross-run object is not trusted merely because its hash matches. The valid current program object is accepted,
        and the gate and formal report use the same snapshot_hash. Trust, staleness, hash, and version are distinct
        checks; mismatches = 0.
      verification: Unit tests with forged model fields and tampered snapshots plus integration asserting the shared
        snapshot hash in gate output and formal report.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: SB-01-FC07
      input: A blocked run and a gate-pass/later-write-failure run, with capture of streaming messages, debug output,
        staging files, CLI final summary, complete_report.md/html, 5_portfolio/decision.md, final-state, memory, manifest,
