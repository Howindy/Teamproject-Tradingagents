- id: PR-01
  type: performance
  title: Deferred measurement of run-manifest operation overhead
  priority: Should
  status: deferred
  stakeholders:
  - reviewer
  - operator
  sources:
    origin: Split from FR-02-AC8 (pre-v1.24.0); baseline run and manifest contract
    evidence:
    - path: baseline/runs/baseline-20261020-01/metrics.json
      locator: duration and call counters
      description: Baseline duration and counters used only as background; no manifest-operation overhead has been
        measured.
      source_type: measured_baseline
    - path: docs/req/run-manifest-schema.json
      locator: root contract
      description: The path refers to deleted historical manifest-schema material, not a current file or design
        constraint; current FR-02 semantics are defined by this YAML's requirement statement and fit criteria.
      source_type: document
    - path: TradingAgents/tradingagents/graph/trading_graph.py
      locator: propagate and _run_graph
      description: Run lifecycle where the simplified FR-02 manifest creation and update are attempted.
      source_type: code
  problem: 'FR-02 requires a best-effort run manifest, but the operation cost of creating and updating it has not
    been measured. The earlier provisional 100 ms, 1%, and 1 s targets were not approved performance thresholds
    and are not retained. Without real samples, any low-overhead or acceptance claim is unsupported.

    '
  statement: 'This requirement is deferred. It defines future behavior after an explicit scope decision; it is not
    part of current active acceptance, and it MUST NOT be implemented, measured as current acceptance, or claimed
    as achieved without that decision. The two fit criteria are retained as future conditions. Under a declared
    local test environment and a normally writable filesystem, measure the complete operation duration of manifest
    creation and manifest update separately, using fixed representative simplified FR-02 data. Each operation is
    performed 20 times, every sample is recorded, and a nearest-rank p95 is computed separately. Failures, missing
    samples, actual serialized file sizes, and basic environment information are retained. Collect measurement evidence
    first; performance thresholds are determined and approved later. No numeric threshold is currently approved,
    and no performance acceptance, low-overhead claim, or implementation claim may be made. This requirement does
    not change FR-02''s non-blocking failure semantics: performance does not decide analysis success, and no timeout,
    background write, or cancellation mechanism is added. For each timed sample, timing starts when building the
    current manifest record begins and ends when that save operation returns. It includes the record-object construction
    and basic validation, JSON serialization, required directory creation, temporary-file write, any flush/fsync
    the implementation actually performs, the atomic replace, and temporary-file handling before the save function
    returns. It does not require adding fsync or any persistence behavior for PR-01; it covers the actual save path
    the implementation uses. It excludes model or external-data calls, the whole analysis, report or memory saving
    unrelated to the manifest, test-fixture preparation, and any content-verification file read performed after
    the operation returns. External monotonic timing is used; the manifest does not self-report its own write duration,
    and FR-02''s duration_seconds (which excludes the final manifest write) MUST NOT be used as this metric. The
    workload uses fixed representative simplified FR-02 running/completed data. Data content and the run environment
    are fixed before measurement; the 20 samples may vary only in necessary identity such as run_id and paths. No
    256 KiB or other payload cap is required. Each sample records duration, success/failure/missing status, and
    the actual serialized UTF-8 byte count. Basic environment records the operating system, runtime, and a description
    of the actual storage location or medium; a complex platform matrix or hardware certification is not required.
    A reproducible data description is sufficient; layered fixture/source/config digests are not required. Results
    may be recorded in ordinary test output or a measurement report, without a WriteEvidence system, database, or
    separate runtime file requirement. No live model, vendor, broker, or network call is run. A complete batch contains
    20 creations and 20 updates, summarized separately. Nearest-rank p95 is the ceil(0.95*N)-th sorted sample; for
    N=20 it is the 19th. Creation and update samples are not mixed. Failed or missing samples are not zero-filled
    or deleted. If fewer than 20 successful samples with complete timing exist, the existing observations and failures
    may be reported, but the batch is not a complete measurement. No rerun-approval, AB/BA, or infrastructure-failure
    classification protocol is added. Later remeasurement should retain these results and must not overwrite failure
    facts. Thresholds remain undetermined. measurement_status stays not_measured; the performance threshold is unspecified,
    and the old 100 ms, 1%, and 1 s values are not adopted. The threshold is null or otherwise explicitly marked
    as undetermined pending post-measurement confirmation using the existing fields or a short note. If the current
    schema does not accept null for this state, the schema is not changed and no number is invented; the limitation
    is stated in the existing YAML form and reported. Zero is not used as a placeholder. The 20-sample count and
    the p95 definition are not performance target values. In the future, complete a valid measurement first, then
    set the target from the actual environment and results, record the approval basis, and revise this requirement.
    A valid completed measurement and attainment of a performance target are separate decisions; before a threshold
    is approved, only measurement results may be reported and performance acceptance MUST NOT be claimed.'
  fit_criterion:
  - id: PR-01-FC01
    input: Fixed FR-02 running-manifest data, 20 independent creations, each using a new run directory on a normally
      writable filesystem.
    expected_result: Twenty creations are measured using the complete operation boundary in this requirement. Each
      saved file parses and its necessary fields match the input. Every sample's duration, status, actual byte count,
      and environment are retained, and a nearest-rank p95 is computed separately. Failures or missing samples are
      not zero-filled or deleted; with fewer than 20 successful samples the batch is not declared complete. The
      current threshold is undetermined and the result is evidence for a later threshold decision, not a low-overhead
      pass.
    verification: Offline test using external monotonic timing, actual file reads, and comparison with independent
      expected values; verification reads are excluded from the timed operation.
    metric: manifest_create_operation_p95_seconds
    threshold: null
    unit: seconds
    zero_tolerance: false
    measurement_status: not_measured
    threshold_status: undetermined
  - id: PR-01-FC02
    input: Twenty legally prepared running manifests updated with fixed representative completed data.
    expected_result: Timing starts when building the terminal record begins and ends when the save operation returns.
      Each updated JSON parses with the necessary content correct. Twenty update durations, statuses, and actual
      byte counts are recorded separately and a p95 is computed without mixing creation samples. Failures or missing
      samples are retained, and an incomplete batch is not declared complete. The current threshold is undetermined;
      no enabled/disabled whole-run comparison is required and no performance pass is claimed.
    verification: Offline update test with external monotonic timing and actual file checks; preparation and verification
      reads are excluded from timing.
    metric: manifest_update_operation_p95_seconds
    threshold: null
    unit: seconds
    zero_tolerance: false
    measurement_status: not_measured
    threshold_status: undetermined
  tradeoff: Prioritize a deferred, simple, two-operation measurement with an explicit complete-operation boundary
    and a later threshold decision. Accept that no performance target is approved, that a batch with fewer than
    20 successful samples is incomplete, and that FR-02 functional behavior is unchanged. No low-overhead, speedup,
    or performance-acceptance claim is made.
  implementation_dependencies:
  - FR-02
  constraint_relations: []
  conflicts:
  - 'A measurement without an approved threshold cannot prove acceptance. Resolution: collect samples first and
    keep measurement completion separate from later threshold approval.'
  - 'A partial batch could look complete. Resolution: retain failures and missing samples and do not declare completeness
    below 20 successful timed samples.'
  - 'The manifest must not self-report its write cost. Resolution: use external monotonic timing over the full save
    operation and do not use FR-02 duration_seconds.'
  - 'Measurement must not change FR-02 behavior. Resolution: no fsync, timeout, background write, or cancellation
    is added; performance does not decide analysis success.'
  - 'Old provisional numbers could be mistaken for approved thresholds. Resolution: the 100 ms, 1%, and 1 s values
    are removed and no number is adopted.'
  assumptions:
  - PR-01 is deferred; its two FCs are future conditions and are not current active acceptance.
  - The workload and environment are fixed and declared before measurement; only necessary identity fields vary
    across samples.
  - Timing covers the actual save operation from record construction through return, including serialization, directory
    creation, temporary write, actual flush/fsync, replace, and temporary-file handling.
  - No payload-size cap is required; actual serialized UTF-8 bytes are recorded per sample.
  - The nearest-rank p95 uses ceil(0.95*N); for N=20 it is the 19th sorted sample.
  - FR-02 remains the only implementation dependency; a successful manifest write is not required for measurement.
  - No threshold is approved, and no low-overhead or performance-acceptance claim may be made before later approval.
  notes: 'Revised in v1.35.0 and set to deferred. FC mapping from the prior four-FC version: prior FC01 (startup
    pre-replace write p95) and prior FC02 (terminal pre-replace write p95) map to new FC01 for complete manifest-creation
    operation timing; prior FC03 (paired percent overhead) and prior FC04 (paired absolute overhead) map to new
    FC02 for complete manifest-update operation timing. The paired enabled/disabled condition, AB/BA order, WriteEvidence,
    named pre-replace phases, committed-publication control group, risk/gate/memory equivalence, 256 KiB payload
    cap, layered digests, rerun classification, and the 100 ms/1%/1 s thresholds are removed. Thresholds are null/undetermined,
    measurement_status remains not_measured, and no performance result or acceptance is claimed. FR-02 remains the
    only implementation dependency; the INV-01 constraint relation is removed. The prior v1.25.0 approval and validation
    records remain historical; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json,
    docs/req/validation-results.json, and the D2 artifacts still describe the earlier contract and were not updated
    by this revision.'
- id: CR-01
  type: cost
  title: Deferred comparison of model usage and estimated cost with analyst briefs
  priority: Should
  status: deferred
  stakeholders:
  - operator
  - reviewer
  - analyst
  sources:
    origin: Split from FR-08-AC5 (pre-v1.24.0); frozen brief evaluation contract
    evidence:
    - path: docs/req/evaluation/brief-eval-contract-v4.json
      locator: historical contract
      description: The path refers to a deleted historical brief-evaluation contract, not a current file or design
        constraint; current CR-01 behavior is defined by this YAML's requirement statement and fit criteria.
      source_type: document
    - path: baseline/runs/baseline-20261020-01/metrics.json
      locator: tokens_in; tokens_out; llm_calls
      description: Baseline token totals used only as background; no brief benefit is measured.
      source_type: measured_baseline
    - path: TradingAgents/tradingagents/agents/context.py
      locator: report_or_absent
      description: Downstream report-reading boundary whose input tokens a brief could change.
      source_type: code
  problem: 'Analyst briefs can reduce downstream input tokens while adding generation output tokens. Recording token
    counts alone does not prove a net cost improvement, and no prices, cost target, or brief benefit have been approved
    or measured.

    '
  statement: 'This requirement is deferred. It defines future behavior after an explicit scope decision; it is not
    part of current active acceptance, and it MUST NOT be implemented, executed as current acceptance, or claimed
    as achieved without that decision. The three fit criteria are retained as future conditions. In a pre-fixed
    test scenario, compare the original flow with briefs disabled (OFF) against the FR-07 flow with briefs enabled
    (ON). Record the input and output tokens of every application-level model call actually made during the whole
    analysis, and compute an estimated cost from the unit prices given for each model. The comparison covers brief
    generation itself and its effect on downstream calls. It includes actually occurring and observable retries,
    fallbacks, and failed calls, not only the final successful call. Missing usage, applicable prices, or a complete
    run result is marked incomplete; it is not zero-filled, adverse samples are not deleted, and no saving is claimed
    from it. Token and cost differences are reported separately. This requirement does not guarantee lower cost,
    does not prove quality is preserved, does not reconcile real invoices, and does not provide statistical-significance
    conclusions. Measurement comes first; a cost target is decided and approved later. The fixed evaluation has
    three test scenarios, each run as one OFF/ON group. The scenarios and configuration are fixed before execution.
    This revision only defines the plan and does not require choosing, capturing, or running the scenarios now.
    No separate reference-data approval system is added. No best-sample selection is allowed, and no multi-round
    repetition or statistical significance is required. OFF uses the original full analyst-report inputs, does not
    ask analysts to produce extra summaries, and keeps the original analysis flow. ON has analysts produce summaries
    in the same original report call, and the five target roles use a valid summary or the FR-07-defined full-report
    fallback. Valid summaries are not forced to succeed; real fallback consumption belongs to the ON result. Within
    a scenario, both sides fix the ticker, analysis_date, prepared data responses, model/provider and call configuration,
    enabled analysts, debate rounds, initial memory content, and other business settings. Data uses fixed offline
    responses and no live vendor or broker request is made. Model calls are used for real usage measurement; manually
    invented token counts MUST NOT be presented as a real experiment. The two sides'' model outputs need not be
    textually identical, and output differences and resulting consumption are part of the observation. The comparison
    does not claim precise causal cost attribution to one summary passage. Each run uses isolated initial state
    so memory produced by an earlier run cannot change the later condition. This only requires equal experiment
    initial conditions and adds no application memory-management feature. The statistics cover all application-level
    model calls in one analysis: analysts, research and risk debate, managers and Trader, and model retries, fallbacks,
    reflection, and failed calls actually occurring within the analysis scope. Independent background tasks are
    excluded, and invisible provider-internal calls are not inferred. Duplicate callbacks or streaming usage for
    one call are not accumulated twice. Input/output usage is grouped by model and applicable price identity; models
    with the same name but a different provider or applicable unit price MUST NOT share a price. For each analysis,
    estimated_cost = the sum of input_tokens * input_price + output_tokens * output_price. Price units are explicit,
    for example a per-million-token price is divided by 1,000,000; one currency is used; and differences are computed
    with Decimal, not display-rounded values. For each scenario: input_token_delta = ON input_tokens - OFF input_tokens;
    output_token_delta = ON output_tokens - OFF output_tokens; estimated_cost_delta = ON estimated_cost - OFF estimated_cost.
    A negative value is an observed reduction, zero is no reduction, and a positive value is an increase. Positive
    and negative differences are retained. The old G, D, generation_call_selection, local-attribution exclusions,
    and selected-instance-only formula are not retained. If any counted model call lacks valid input or output usage,
    that run''s complete token total and estimated cost cannot be confirmed. If any actually used model lacks an
    applicable unit price, that run''s complete cost cannot be confirmed; known tokens may still be reported separately.
    An unknown complete total is null, not zero, and character counts or tokenizer estimates MUST NOT be presented
    as actual usage. With zero model calls, the token and model-cost values are true zero and no price is needed
    for a nonexistent call. A started but failed model call with valid usage MUST be counted; if its usage is unknown,
    that run''s complete cost remains incomplete. Keep three questions distinct: (1) whether usage and prices are
    sufficient to compute consumption; (2) whether the analysis completed normally; and (3) whether a normal-run
    cost comparison is available. A failed analysis with complete consumption may report the failed run''s observed
    cost but MUST NOT serve as saving evidence for a normally completed scenario. A complete scenario difference
    is reported only when both sides completed normally and the required usage and prices are complete; otherwise
    the difference is null or explicitly incomparable, with existing observations and reasons retained. The complete
    total across the three-scenario batch is given only when every required scenario has a complete normal result
    on both sides. Failed scenarios MUST NOT be deleted to present a subset total as the whole batch; available
    scenario results may be listed separately. The cost is called an "estimated model cost at the given unit prices",
    not a real invoice. The price source or basis, unit, and currency are recorded. Uncovered factors such as special
    cache pricing or invisible internal calls are briefly disclosed; no billing engine is added. A cost reduction
    does not mean quality, safety, or overall functional optimization succeeded. No new quality rubric, safety-escape
    classification, or launch-approval process is established. Measurement comes first. measurement_status stays
    not_measured; no net_cost_max, saving ratio, or quality-loss threshold is approved. The old contract''s unapproved
    values are not retained. The threshold is null or otherwise explicitly marked undetermined using the current
    structure, never zero as a placeholder. If the current schema cannot express this, the compatibility issue is
    reported, the schema is not changed, and no value is invented. The three scenarios are a fixed measurement size,
    not a cost-benefit threshold. Before a threshold is approved, observed differences may be reported, but target
    attainment MUST NOT be claimed; a complete measurement is not a cost-optimization pass.'
  fit_criterion:
  - id: CR-01-FC01
    input: Hand-built fixtures covering one model, multiple models, different provider prices, failed calls, duplicate
      usage events, missing input/output usage, missing prices, and zero calls.
    expected_result: Tokens are grouped with the correct price, unit conversion and the Decimal formula are correct,
      and a failed call with usage is included without double counting. Missing usage makes the complete token and
      cost values unconfirmed; a missing price alone allows tokens to be reported but leaves cost null. Zero calls
      is true zero. No missing value is zero-filled.
    verification: Independent hand calculation and finite parameterized tests; no live call is required.
    metric: measurement_formula_error_count
    operator: ==
    threshold: 0
    unit: errors
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: CR-01-FC02
    input: Three scenarios fixed before execution, each with one OFF/ON group, fixed data responses and model/business
      configuration, and isolated initial memory with the same content.
    expected_result: OFF does not generate extra summaries; ON generates summaries in the same FR-07 call and uses
      a summary or fallback. Real model usage for the whole analysis is collected, including actual retries and
      failed calls. All attempts and adverse samples are retained and no best result is selected. The two sides
      may produce different output; no reference, view, or generation-selection protocol is added.
    verification: Experiment configuration, usage records grouped by call and model, and actual input checks for
      both conditions. This item may need real model calls in the future; it is not executed now.
    zero_tolerance: false
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: CR-01-FC03
    input: Results with cost decrease, increase, equality, missing usage, missing price, run failure, and an incomplete
      batch.
    expected_result: Report both sides' input/output tokens, estimated cost, and ON-OFF differences, retaining positive
      and negative values. A complete difference is used only for scenarios where both sides completed normally
      and measurement is complete. Failed or missing results are not deleted or presented as normal savings. An
      incomplete batch does not produce a false complete total. Conclusions are limited to this batch and the given
      unit prices and MUST NOT be called a real invoice, universal saving, quality preservation, or overall optimization
      success. An undetermined threshold does not support a cost-target pass.
    verification: A finite result table and claim-rule tests; no execution/acceptance two-state machine is established.
    metric: claim_boundary_violation_count
    operator: ==
    threshold: 0
    unit: violations
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  tradeoff: Prioritize a deferred, simple three-scenario OFF/ON comparison of real model usage and estimated cost.
    Accept that no prices or cost target are approved, that failed or incomplete results cannot support a full comparison,
    and that no quality, safety, or overall optimization claim follows from a cost change. FR-02 and FR-07 remain
    the only implementation dependencies.
  implementation_dependencies:
  - FR-02
  - FR-07
  constraint_relations: []
  conflicts:
  - 'Token reduction can look like a cost saving. Resolution: report token and cost differences separately from
    the given unit prices and make no saving claim before measurement and later target approval.'
  - 'A cost change can look like a quality or safety pass. Resolution: cost results do not establish quality, safety,
    or overall optimization success, and no new quality/safety acceptance system is added.'
  - 'A failed or incomplete run can look like a complete comparison. Resolution: complete scenario differences require
    both sides normal and measurement complete; failures and missing data are retained.'
  - 'A subset can look like the whole batch. Resolution: the three-scenario total is given only when every required
    scenario is complete on both sides.'
  - 'A real invoice can be confused with an estimate. Resolution: label the result estimated model cost at given
    unit prices and record price source/basis, unit, and currency.'
  - 'Old unapproved thresholds could be mistaken for current targets. Resolution: the old net_cost_max, quality-loss,
    and saving-ratio values are removed; thresholds remain undetermined.'
  assumptions:
  - CR-01 is deferred; its three FCs are future conditions and are not current active acceptance.
  - FR-07 here means the deferred analyst-summary requirement, not the removed financial-metrics requirement; the
    old FR-08 reference is removed.
  - FR-02 is used only for run identity and basic call statistics; a successful manifest write is not required,
    and no per-model cost detail is added to FR-02.
  - The evaluation tool may collect usage per model in memory or ordinary experiment results, without a new persistence
    or billing system.
  - The three scenarios and their configuration are fixed before execution; this revision does not choose, capture,
    or run them.
  - Prices and cost thresholds are unapproved; null is not zero and no target pass may be claimed.
  notes: 'Revised in v1.36.0 and set to deferred. FC mapping from the prior five-FC version: prior FC01 (local G/D
    attribution and formula) and prior FC04 (net_cost target) map to new FC01 for formula/missing handling and new
    FC03 for result and claim boundaries, with G/D selection and the approved net_cost_max removed; prior FC02 (safety
    escapes) is removed; prior FC03 (execution/acceptance state table) is removed; prior FC05 (claim classification)
    maps to new FC03, with budget_met and the two-state machine removed; new FC02 covers the fixed three-scenario
    OFF/ON measurement. The complete-analysis comparison replaces local attribution; real retries, fallbacks, and
    failed calls are included; the old contract v3/v4, FR-02 field-level coverage, reference/mandatory budgets,
    view updates, input digests, retry state protocol, quality-loss targets, and INV-01/SB-01 coupling are removed.
    Thresholds are null/undetermined and measurement_status is not_measured. FR-02 and FR-07 are the only implementation
    dependencies. The prior v1.25.0 approval and validation records remain historical; docs/req/requirement-mapping.csv,
    docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json,
    docs/req/evaluation/brief-eval-contract-v4.json, and the D2 artifacts still describe the earlier contract and
    were not updated by this revision. No measurement, cost-target approval, cost saving, quality preservation,
    or overall optimization success is claimed.'
- id: SB-01
  type: invariant
  title: Deterministic checks for the final recommendation
  priority: Must
  status: approved
  stakeholders:
  - trader
  - reviewer
  - security_reviewer
  sources:
    origin: Repository analysis and measured baseline
    evidence:
    - path: TradingAgents/tradingagents/agents/rating.py
      locator: L96-L117 parse_rating, run_rating, is_review
      description: The current rating path parses a rating and returns REVIEW only when no rating can be read; REVIEW
        is already a terminal sentinel outside the five-tier set.
      source_type: code
    - path: TradingAgents/tradingagents/agents/managers/portfolio_manager.py
      locator: L80-L103 invoke_structured
      description: The Portfolio Manager produces the final structured decision and writes final_rating/final_trade_decision
        directly; no deterministic final-rating check is applied.
      source_type: code
    - path: TradingAgents/tradingagents/graph/trading_graph.py
      locator: L358-L370 record_decision and L437-L465 _log_state
      description: The decision is persisted to the state log and memory before any deterministic final-rating check
        exists.
      source_type: code
    - path: TradingAgents/cli/run.py
      locator: L310-L340 streaming display and L380-L385 review notice
      description: The CLI streams and displays the Portfolio Manager output before any formal check, then only
        warns when a rating is unreadable.
      source_type: code
    - path: TradingAgents/tradingagents/reporting.py
      locator: L20-L46 and L92-L119 write_report_tree
      description: Reports copy final_trade_decision and the rating header directly; there is no formal blocked-decision
        body.
      source_type: code
    - path: TradingAgents/tradingagents/memory/log.py
      locator: L32-L60 store_decision
      description: The memory log stores the model decision and rating tag without a final-rating check result or
        an explicitly separated unapproved proposal.
      source_type: code
    - path: baseline/runs/baseline-20261020-01/transcripts/final-status.json
      locator: final_rating and final_trade_decision
      description: The baseline persisted a Hold decision while news and social sources were unavailable; no deterministic
        final-rating check recorded or blocked it. The unavailable ticker-news does not automatically equal a current
        FR-03 necessity gap, so the baseline is not claimed to be blocked by the new check.
      source_type: measured_baseline
    - path: baseline/runs/baseline-20261020-01/results/reports/NVDA_20261020_193209/5_portfolio/decision.md
      locator: entire file
      description: The saved formal decision is the model's Hold text, with no deterministic final-rating notice.
      source_type: measured_baseline
  problem: 'The baseline could persist, display, and score a tradeable rating even when data was unavailable. The
    model decision and the formal decision were the same text, so a REVIEW changed only the rating and left the
    trade recommendation visible as the official conclusion. The final-rating check was not a single deterministic
    step over the program-provided availability summary and risk result, gate failure had no explicit REVIEW fallback,
    and the model proposal was not clearly separated from the formal conclusion.

    '
  statement: 'Before the CLI analysis or TradingAgentsGraph.propagate() returns, displays, or saves a final result,
    the system MUST run one deterministic check over the current analysis''s program-produced FR-03 availability
    summary, the applicable FR-04 risk result, and the model rating. When necessary data is missing, an applicable
    risk check did not pass, a required input is missing or invalid, the model itself asks for review, or the check
    raises an unexpected error, the final rating MUST be REVIEW and the formal conclusion MUST be replaced with
    a program-generated manual-review notice. The original model recommendation MUST be retained separately and
    MUST NOT be presented as a final conclusion that passed the check. When the check passes, the original model
    rating and conclusion are kept, but this is not a trade authorization. The check MUST NOT call a model or data
    source, MUST NOT recompute risk, MUST NOT depend on a manifest write, and MUST NOT manage memory, history, recovery,
    or cross-artifact commits. Model rating: the only legal ratings are Buy, Overweight, Hold, Underweight, and
    Sell. A legal rating continues to the data and applicable-risk checks. A model REVIEW, or a missing or invalid
    rating, produces final REVIEW and gate status blocked and states that the rating cannot be confirmed; the check
    MUST NOT guess Hold or invent a model proposal. The model conclusion MUST be non-whitespace text. A missing,
    wrong-type, empty-string, or whitespace-only conclusion is not a valid conclusion; it is an ordinary input-condition
    failure and produces gate status blocked and final rating REVIEW with a program-generated manual-review notice
    stating the actual reason. It MUST NOT be used to fabricate an approved conclusion, and these input errors are
    not SB-01 internal errors. No text length, format, content-quality, factual-correctness, or other semantic scoring
    requirement is added. An unexpected error in the check itself produces final REVIEW and gate status error and
    states that the check could not complete. FR-03 data condition: use the current analysis''s program result and
    do not accept a model-provided or model-overridden completeness claim. A complete result passes the data condition;
    incomplete blocks with REVIEW and lists the missing necessary data; not_applicable is not treated as complete
    and does not by itself block, but keeps the statement that the basic list does not apply. A missing summary,
    an illegal status, a wrongly typed necessary missing field, or a basic state contradiction blocks and states
    that the data condition cannot be confirmed. A basic contradiction is only: complete while also containing a
    missing necessary item, or incomplete with no missing necessary item or corresponding reason. Raw queries, profiles,
    snapshots, hashes, and lineage are not rechecked. Supplementary-data failures remain disclosed by FR-03, do
    not separately trigger REVIEW, and MUST NOT be treated as necessary missing data. A not_applicable pass means
    only that this data condition did not separately block; it does not mean non-stock data is sufficient. FR-04
    risk condition: for a stock Buy or Overweight, a program-produced FR-04 passed result for the current analysis
    MUST exist. A blocked, error, missing, illegal, or wrongly not_applicable risk result fails this condition and
    produces final REVIEW. Other legal stock ratings and legal non-stock ratings do not require the stock purchase-scenario
    check. The check MUST NOT accept "risk approved" from model text, MUST NOT re-call or re-implement FR-04, and
    MUST NOT restore the removed cash, freshness, policy-approval, or digest rules. An FR-04 error means the risk
    condition cannot be confirmed and the check blocks using the existing risk result; it is not relabeled as an
    SB-01 internal error. The check passes only when all of the following hold: the model rating is legal and the
    model conclusion is valid non-whitespace text; the FR-03 data condition does not block; and the applicable FR-04
    risk condition passes. Any ordinary condition failure is blocked; an unexpected error in the check itself is
    error. Both blocked and error produce final REVIEW. When several ordinary problems occur, retain a short reason
    list without a complex primary_reason, review_class, or full error-priority system; a fixed check order may
    be used for display without adding an ordering protocol. Required result fields are model_proposal (the original
    model rating and text, null when none was produced and never fabricated), gate_status (passed/blocked/error),
    reasons (a short safe reason list), final_rating, and final_trade_decision. Field names may match existing structures;
    no second duplicate status set is added. On passed, final_rating and final_trade_decision keep the original
    model values and are not described as financial trade approval. On blocked or error, final_rating is REVIEW
    and final_trade_decision is a program-generated manual-review notice stating the actual reasons; the original
    trade recommendation is not kept as the formal conclusion. If the original recommendation is shown, it appears
    in a separate area explicitly labeled "model original recommendation, failed final check". Intermediate streaming
    or debug output may show the original model content only when marked intermediate or not yet checked, and MUST
    NOT present it as the final conclusion; no new protocol is added for every log, checkpoint, or staging artifact.
    The check uses the program-provided FR-03/FR-04 results from the current analysis and does not parse model text
    as a substitute; no source signature, evidence file, or tamper-proof system is added. Covered entry points are
    the CLI analysis final summary, the propagate() final_state and returned signal, and the merged report and final
    decision display generated by those paths. No separate backtest, memory, history, recovery, or all-internal-call
    acceptance matrix is added. Existing consumers that read final_state may naturally see the post-check fields
    without an additional promise. The check MUST form before the final result is returned, displayed, or saved
    and MUST NOT wait for a manifest. A normal business REVIEW is not an analysis error and FR-02 may be completed;
    a manifest save failure does not change the check result; a check error produces error/REVIEW and a safe notice
    without a new manifest hard failure or publication rollback. Existing analysis-flow exceptions keep their original
    behavior and are not disguised as completed success. The propagate() return shape is unchanged. No gate timeout,
    cancellation, or late-result state machine is added. FR-04 does not change the rating; SB-01 consumes its result
    and decides the final rating, without changing FR-04''s existing responsibility.'
  fit_criterion:
  - id: SB-01-FC01
    input: Five legal model ratings and valid conclusions, with FR-03 complete. A stock Buy or Overweight also has
      an FR-04 passed result; other legal cases do not require the stock purchase-scenario check.
    expected_result: gate_status is passed, and the final rating and conclusion keep the original model values.
      No model, data, or risk computation call is added, and no trade authorization is claimed.
    verification: Finite decision table with independent expected results and a forbidden-extra-call sentinel.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: SB-01-FC02
    input: FR-03 incomplete; FR-03 complete with a supplementary-data failure; a legal FR-03 not_applicable; and
      model text claiming that data is complete.
    expected_result: Incomplete produces REVIEW and states the missing necessary data; a supplementary failure alone
      does not block; not_applicable is not disguised as complete and does not alone block. Model text cannot override
      the program summary.
    verification: Controlled FR-03 results, independent expected outcomes, and formal notice checks; other conditions
      remain valid in each case.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: SB-01-FC03
    input: A stock Buy or Overweight paired with FR-04 passed, blocked, error, missing, illegal, and not_applicable
      risk results.
    expected_result: Only passed satisfies the risk condition. Every other result produces REVIEW and states that
      risk did not pass or could not be confirmed. Model text cannot substitute for the program result, FR-04 is
      not re-called, and other passing conditions do not mask a risk failure.
    verification: Risk-result table, fake model text, and a recomputation sentinel.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: SB-01-FC04
    input: Missing or illegal rating, model REVIEW, a missing, wrong-type, empty-string, or whitespace-only conclusion,
      missing or illegal FR-03 summary, a basic state contradiction, and an exception raised inside SB-01.
    expected_result: Final rating is REVIEW with reasons matching the actual case; a missing, wrong-type, empty-string,
      or whitespace-only conclusion is an ordinary condition failure with gate status blocked and a program-generated
      manual-review notice; other ordinary condition failures are blocked, and an exception in the check itself
      is error. No input, proposal, or Hold is fabricated, and no snapshot, hash, or version check is introduced.
    verification: Finite parameterized negatives and exception injection.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: SB-01-FC05
    input: CLI and propagate() normal and blocked scenarios whose model text contains an explicit trade recommendation;
      then generate a report.
    expected_result: The CLI final summary, final_state, returned signal, and generated report use the same post-check
      result. Under REVIEW the formal conclusion is the manual-review notice, and the original recommendation appears
      only in a separately labeled area. Intermediate output is not presented as final, the return shape is unchanged.
    verification: Offline entry integration, actual output and report inspection, and extra-call counting; memory,
      history, and recovery acceptance are not expanded.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  tradeoff: Prioritize deterministic fail-closed checks and strict separation between the model proposal and the
    formal conclusion. Accept REVIEW and reduced actionable output; the model cannot override the check. Intermediate
    outputs may show the proposal only when marked intermediate or unapproved.
  implementation_dependencies:
  - FR-03
  - FR-04
  constraint_relations: []
  conflicts:
  - 'REVIEW reduces actionable output. Resolution: REVIEW is an explicit terminal safe state, not a hidden Hold.'
  - 'Preserving the model proposal helps audit but risks being read as the conclusion. Resolution: retain it only
    as model_proposal and a separately labeled unapproved area.'
  - 'The model can write data or risk claims. Resolution: only the program FR-03/FR-04 results are authoritative;
    model claims are ignored.'
  - 'A check failure can stop a completed analysis. Resolution: fail closed with REVIEW and a manual-review notice
    without changing the analysis-flow error behavior.'
  - 'Intermediate streaming is useful for observability. Resolution: intermediate output may show the proposal only
    when marked intermediate or not yet checked.'
  - 'Different entry points could implement different checks. Resolution: the CLI and propagate() paths use the
    same deterministic check.'
  - 'A risk check can look like a second final authority. Resolution: FR-04 remains the risk evaluator; SB-01 consumes
    its result and remains the final-rating check.'
  - 'A manifest failure could look like a gate failure. Resolution: the check does not depend on manifest success;
    a manifest write failure does not change the gate result.'
  assumptions:
  - REVIEW is a terminal non-tradeable sentinel outside the five-tier rating set; it is not a sixth trading rating.
  - The FR-03 availability summary and FR-04 risk result come from the current analysis program; the model cannot
    supply or override them.
  - 'Gate status is closed: passed, blocked, error.'
  - The required result fields are model_proposal, gate_status, reasons, final_rating, and final_trade_decision;
    no second duplicate status set is added.
  - A passed result keeps the model rating and conclusion but is not a trade authorization.
  - A blocked or error result is REVIEW with a program-generated manual-review notice; the original recommendation
    is retained only as a separately labeled unapproved proposal.
  - The check runs before the final result is returned, displayed, or saved; it does not wait for a manifest and
    adds no timeout, cancellation, or late-result state machine.
  - FR-04 does not change the rating; SB-01 consumes its result and decides the final rating.
  - No memory, history, recovery, or cross-artifact commit behavior is managed by this requirement.
  notes: 'Revised in v1.40.0 to deterministic checks for the final recommendation. FC mapping from the prior twelve-FC
    version: prior FC01/FC02 (blocked/passed five-rating matrices) map to new FC01 for normal pass; prior FC03 (model
    REVIEW) maps to new FC04; prior FC04/FC05/FC06 (coverage contradictions, malformed input, forged/stale snapshots)
    map to new FC02 for the FR-03 data condition and FC04 for invalid input, with snapshot/hash/profile checks removed;
    prior FC07 (formal/intermediate separation) and FC08 (entry-point matrix) map to new FC05, with backtest/checkpoint/recovery
    acceptance removed; prior FC09 (gate fault) maps to new FC04 for check exceptions, with timeout/late-result
    removed; prior FC10/FC11/FC12 (gate field binding, risk matrix, combined priority) map to new FC03 for the applicable
    risk condition, with primary_reason/review_class/run-status coupling removed. Removed capabilities are not re-expressed
    as hidden obligations. The current fit criteria count is five. At revision v1.40.0, the global FC count was
    71. SB-01 keeps only FR-03 and FR-04 as implementation dependencies; FR-02, INV-01/02, old FR-08, and the publication/recovery
    coupling are removed. The prior v1.25.0 approval and validation records remain historical; docs/req/requirement-mapping.csv,
    docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json,
    and the D2 artifacts still describe the earlier contract and were not updated by this revision. No implementation,
    test pass, or trade authorization is claimed.'
- id: INV-01
  type: invariant
  title: Consistent delivery and persistence of the final result
  priority: Must
  status: approved
  stakeholders:
  - reviewer
  - trader
  - analyst
  sources:
    origin: Repository analysis and measured baseline
    evidence:
    - path: TradingAgents/tradingagents/reporting.py
      locator: L92 write_report_tree
      description: Reports are written to a report tree, independently of the state log and memory log.
      source_type: code
    - path: TradingAgents/tradingagents/graph/trading_graph.py
      locator: L437-L475 _log_state
      description: The full-state log is written separately from reports and memory and has no shared result identity.
      source_type: code
    - path: TradingAgents/tradingagents/memory/log.py
      locator: L32-L60 store_decision and later settlement
      description: The memory entry is written separately, then updated later with outcome and reflection; settlement
        does not regenerate the original decision.
      source_type: code
    - path: baseline/runs/baseline-20261020-01/report-consistency.json
      locator: all fields
      description: The baseline checked decision/report/full-state consistency but did not measure source-status
        consistency or memory agreement. This is not evidence that all baseline outputs disagreed.
      source_type: measured_baseline
    - path: baseline/runs/baseline-20261020-01/memory/trading_memory.md
      locator: entry tag and DECISION block
      description: The baseline memory entry contains trade date, ticker, rating, pending status, and prose; it
        has no shared post-check result identity.
      source_type: measured_baseline
  problem: 'The baseline wrote decision data to reports, a full-state log, and memory, but did not enforce that
    every consumer used the same final result. After SB-01 introduces a deterministic post-check result, a consumer
    could still re-parse the model text into a different rating or display the pre-check recommendation as the formal
    conclusion. The baseline consistency check covered some outputs only; this invariant is about preventing consumers
    from using the wrong result, not about proving that all outputs were previously inconsistent or adding a shared
    data platform.

    '
  statement: 'Within one analysis, the final rating and formal conclusion returned, displayed, or saved by the application
    MUST come from the same final result produced by SB-01. A consumer MUST NOT regenerate the rating, re-parse
    the original model text into a different rating, or substitute the pre-check model recommendation for the formal
    result. The saved final-state and any memory decision record actually created in this run MUST use that final
    result. When memory is disabled or no new record is created, no record is required. The only comparison basis
    is SB-01''s post-check final_rating and final_trade_decision. In a passed case, the SB-01 retained model conclusion
    is used. In a blocked or error case, REVIEW and the program-generated manual-review notice are used. The original
    model_proposal may appear separately as allowed by SB-01 but MUST NOT replace the formal fields. Whole report
    bytes are not compared; headings, layout, wrappers, and existing format differences are allowed as long as the
    formal rating and decision content do not change meaning or get regenerated. Another rating MUST NOT be inferred
    by parsing the full report or model narrative. The consistency scope is limited to outputs actually produced
    in this analysis: the propagate() final_state and returned signal, the CLI final summary, the final rating and
    formal conclusion in a generated report, the corresponding saved final-state JSON fields, and any memory decision
    record newly created in this run. The first three overlap SB-01 FC05 and may reuse its test evidence without
    creating a duplicate acceptance system or modifying SB-01. The manifest is not included in the rating/conclusion
    comparison, and no FR-02 field is added for this invariant. The invariant applies when the result is formed,
    output, and normally saved in this run; it does not require every later historical read to revalidate, and it
    does not guarantee permanent file immutability. If this run creates a new memory decision record, its rating
    and decision body come from the post-check result, not from the pre-check recommendation, and no model call
    is added to restate or regenerate the decision. If memory is disabled or no new record is created, no record
    is required, a reused historical record is not rewritten to the current result, and no history-reuse or version-allocation
    feature is added. Existing settlement/reflection may continue to update outcome, reflection, and similar fields
    under its normal behavior, but these updates MUST NOT regenerate or replace the original recorded rating and
    decision body. No immutable store, hash, retention proof, or tamper detection is required. Same-day versioning,
    reservation, high-water allocation, supersedes, duplicate-decision detection, concurrent allocation, and memory
    recovery protocols are not added. This invariant does not redefine each save flow''s error policy: report, final-state,
    and memory save failures follow their existing handling; a failed file is not claimed as saved; other formed
    results are not rolled back because another artifact is missing; no atomic multi-file transaction, formal commit
    point, read-time validation, or production consistency-scan service is added. Acceptance focuses on whether
    actually produced outputs use the correct result, not on requiring every optional output to exist.'
  fit_criterion:
  - id: INV-01-FC01
    input: A controlled analysis with one SB-01 passed case and one blocked/REVIEW case. The original model recommendation
      and the post-check notice carry different test markers; produce the returned result, CLI summary, report,
      and final-state JSON.
    expected_result: Each actually produced output uses the SB-01 result for its final rating and formal-decision
      area. The rating is not re-parsed from the full text, and the original model recommendation does not replace
      the formal fields. Format, heading, and other report content may differ; whole-file bytes are not compared.
    verification: Offline entry/save integration comparing the corresponding fields and formal-decision area. SB-01
      FC05 evidence may be reused without independently repeating the same test.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: INV-01-FC02
    input: Memory enabled with a newly created record in passed and REVIEW scenarios, and memory disabled or with
      no new record.
    expected_result: The new record's rating and decision body come from the post-check result; REVIEW is not overwritten
      by the original Buy/Hold recommendation. When memory is disabled or no record is added, no record is forced
      and an existing historical record is not modified. Saving the result adds no model call.
    verification: Existing memory-write adapter path, independent expected values, and a call sentinel; no version,
      digest, or historical proof is required.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: INV-01-FC03
    input: An existing decision record followed by the existing normal settlement/reflection update.
    expected_result: Outcome and reflection fields may update under the normal behavior, while the original rating
      and decision body remain and are not regenerated by reflection. No retention proof, immutable log, rotation
      protocol, or later manual-tamper detection is required.
    verification: Compare corresponding fields before and after the update and reuse the existing memory test path.
      A model call that belongs to reflection itself is not misclassified as a new "rewrite decision" call.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  tradeoff: Prioritize consistent delivery and persistence of the SB-01 final result across actually produced outputs.
    Accept that format and layout may differ, that the manifest is not a rating authority, and that save failures
    keep their existing handling; no atomic multi-file commit, immutability, retention, versioning, or recovery
    guarantee is added.
  implementation_dependencies:
  - SB-01
  constraint_relations: []
  conflicts:
  - 'A short report may differ from the formal decision. Resolution: compare only the final rating and formal-decision
    area; whole-file bytes and layout are not compared.'
  - 'A consumer could re-parse the model text. Resolution: the only comparison basis is SB-01''s post-check final_rating
    and final_trade_decision.'
  - 'The pre-check proposal could be mistaken for the formal result. Resolution: the proposal may appear separately
    but cannot replace the formal fields.'
  - 'Settlement updates memory later. Resolution: outcome/reflection may update, but the original rating and decision
    body are not regenerated.'
  - 'A save failure could look like a consistency failure. Resolution: each save flow keeps its existing error policy;
    a failed file is not claimed as saved and other results are not rolled back.'
  assumptions:
  - The comparison scope is the propagate() final_state and signal, CLI final summary, generated report final-decision
    area, saved final-state JSON fields, and any newly created memory decision record.
  - SB-01's post-check final_rating and final_trade_decision are the only comparison basis; consumers do not regenerate
    or re-parse the rating.
  - The original model_proposal may be shown separately as SB-01 allows but is not a formal-field substitute.
  - Format, headings, layout, and wrappers may differ; the formal rating and decision content must not change meaning.
  - Memory is compared only when this run creates a new decision record; disabled or no-new-record runs need no
    record, and historical records are not rewritten.
  - Settlement/reflection may update outcome and reflection fields without regenerating the original rating or decision
    body.
  - The invariant applies at formation/output/normal save in this run; it does not require later historical reads
    to revalidate or guarantee permanent immutability.
  notes: 'Revised in v1.41.0 to consistent delivery and persistence of the final result. FC mapping from the prior
    eleven-FC version: prior FC01/FC03/FC05 (cross-artifact binding, identity/provenance projection, decision text)
    map to new FC01 for output-source consistency; prior FC02/FC04/FC09 (canonicalization, fallback disclosure,
    read-time tamper) are removed; prior FC06/FC07/FC11 (missing artifacts, retry, completed-status negatives) are
    removed; prior FC08/FC10 (settlement/rotation and memory version allocation) map to new FC02 for new memory
    consistency and new FC03 for normal later updates, with retention proof, high-water allocation, supersedes,
    and rotation removed. Removed capabilities are not re-expressed as hidden obligations. The current fit criteria
    count is three. At revision v1.41.0, the global FC count was 63. SB-01 is the only implementation dependency;
    FR-02, the formal-publication/manifest binding, full evidence-chain, and deferred recovery coupling are removed.
    The prior v1.25.0 approval and validation records remain historical; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json,
    docs/req/run-manifest-schema.json, docs/req/validation-results.json, and the D2 artifacts still describe the
    earlier contract and were not updated by this revision. No implementation, test pass, immutability, or permanent-consistency
    guarantee is claimed.'
- id: SR-01
  type: security
  title: Credential protection in configuration and diagnostics
  priority: Must
  status: deferred
  stakeholders:
  - security_reviewer
  - operator
  - reviewer
  sources:
    origin: Repository analysis and measured baseline
    evidence:
    - path: TradingAgents/tradingagents/dataflows/net.py
      locator: L6-L24 get_scrubbed
      description: Existing exact-value scrubber for Alpha Vantage and FRED request error URLs; it replaces the
        configured secret and re-raises without attaching the request/response or exception chain.
      source_type: code
    - path: TradingAgents/tradingagents/dataflows/vendors/alpha_vantage/common.py
      locator: L95-L97 get_scrubbed call and scrubbed notice helper
