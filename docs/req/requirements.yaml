  id: D1-REQ
  title: 'D1 Requirements: Query Reuse, Data Availability, Portfolio Risk, Final Check, Consistent Results, Credential
    Protection, and Deterministic Financial Metrics'
  version: 1.51.0
  status: approved
  date: '2026-11-25'
  language: en
  description: |-
    Round 4 delivery (v1.51.0): FR-03, FR-04, FR-10, SB-01 and INV-01 are implemented and tested (28 FCs). FR-01 and SR-01 join the deferred scope (nine requirements, 37 FCs). All 14 requirements and 65 FCs are retained.

    Target-binding amendment, 2026-11-23: the user approved first-eligible-request binding for FR-03 necessity targets in this conversation. This authorization is separate from PR #12 and is not Round 3 implementation/test-specification approval.

    Historical v1.50.0 scope: 14 requirements / 65 FCs; seven approved active requirements (FR-01, FR-03, FR-04, FR-10, SB-01, INV-01, SR-01) / 37 FCs; seven deferred requirements / 28 FCs. Version 1.50.0 adds FR-10 (Deterministic disclosed financial metrics, ten FCs) as the formal successor to the personal branch's historical financial FR-07, pre-approved in PR #14 comment 7099714477 by Howindy (non-author) at 2026-11-23T11:29:36Z, binding docs/plans/financial-metrics-integration.md @ e99ab57b6e460fad59bb4bf4a81cffa5c717c8da. Current deferred FR-07 (analyst briefs) and the six active requirements pre-approved in PR #12 comment 7089283044 remain intact. This is preparation design/test pre-approval, not final review, feature migration, merge, or product acceptance. Historical v1.49.0 scope: 13 requirements / 55 FCs; six approved active requirements (FR-01, FR-03, FR-04, SB-01, INV-01, SR-01) / 27 FCs; seven deferred requirements / 28 FCs. FR-02, FR-05 and SR-02 join the existing deferred requirements; no IDs or FCs are deleted. Current acceptance excludes native manifests, new precise statistics, history lookup and their dedicated path controls. Existing baseline saves, statistics and protections remain. The scope and specified minimal architecture/test changes were pre-approved by jyy722 (non-author) in PR #12, comment 7089283044 at 2026-11-23T01:37:12Z, binding specification cc2c834c3ce9097f08d95b4beef1a5dc1bb0b7e9. This is design/test pre-approval, not final review, merge or product acceptance. The version paragraphs that follow record historical revision lineage. They preserve their original historical meaning and are not current additional constraints. Where an older paragraph mentions a removed, renamed, or deferred concept, the current 14 requirement objects and the opening statement of this description control. Version 1.1.0 revises FR-01 to limit logical query executions rather than external requests, defines data_query_key, and adds concurrency, terminal-outcome, vendor-cache, retry/fallback, and offline/live acceptance criteria. Version 1.2.0 revises FR-02 to define the run lifecycle, a concrete manifest schema, identity/path coverage, measurement boundaries, missing-token handling, end-to-end overhead, and write-failure integrity. Version 1.3.0 revises FR-03 to define the minimal availability record, source identity, closed record/requirement status sets, the effective critical profile defaults, fallback clearing, multi-query aggregation, and deterministic reporting. Version 1.4.0 revises SB-01 to define the trusted gate input, the formal decision body, model-proposal separation, the complete blocked-input decision table, fail-closed gate-failure behavior, all formal and intermediate output boundaries, and entry-point coverage. Version 1.5.0 revises INV-01 to define the completed checkpoint, artifact binding and per-artifact contract, canonicalization, source-status comparison granularity, legal fallback versus silent substitution, retry and partial- write behavior, and the separate memory decision/settlement lifecycle. Version 1.6.0 revises SR-01 to separate known-secret from versioned pattern checks, define the fixed scan scope and its limits, resolve the preference audit/restore endpoint conflict, add fail-closed failure behavior, preserve existing scrub and .env controls, and add over-redaction controls. Version 1.7.0 renumbers the requirement IDs to match their types: FR-01, FR-02, and FR-03 for functional requirements, SB-01 for safety, INV-01 for invariant, and SR-01 for security. No requirement semantics changed in that renumbering. Version 1.8.0 synchronizes the manifest schema with INV-01, SB-01, FR-03, and SR-01; adds completed-state schema constraints; refines cache A/B comparison, canonicalization and hash inputs, memory entry binding, synthetic missing component records, mandatory capability ownership, security incident records, and external manifest timing. Version 1.9.0 adds the gate error stage, separates write-scan from run-scan results, carries critical profile, coverage snapshot, provenance and input hashes in the manifest, links evidence to multiple requirement components, counts HTTP requests, selects review wording by gate reason, fixes the run clock, and defines same-day rerun, memory-disabled, cross-field semantic, and empty query-set rules. Version 1.10.0 merged two draft requirements from Jiang Yiyang's proposal: FR-04 deterministic portfolio-risk evaluation of a structured candidate trade, and INV-02 deterministic portfolio-risk authority and zero unsafe approvals. Version 1.11.0 rewrites both requirements around one applicability rule, explicit first-entry and add-long fields, timezone-aware historical valuation cutoff, exact amount/price/cash/currency consistency, a locatable policy snapshot with provisional-threshold boundaries, current versus reused historical memory evidence, and separate cache and risk-policy evaluations. Version 1.12.0 fixes the FR-04-AC1 arithmetic, separates normalized risk-input artifacts from safe invalid-input diagnostics, defines the unique timezone-aware valuation cutoff and future analysis-date rejection, fixes the combined coverage-failure plus evaluator-exception result, and adds local evidence fixtures with digest, metric, policy, tamper, wrong-metric, and invalid-input checks. The 30% concentration and 5% stop-distance defaults remain provisional until human approval. Version 1.14.0 merges the corrected valuable parts of yhx: FR-07 deterministic derived financial metrics from structured filing facts and FR-08 unified downstream analyst-report brief. Version 1.13.0 merges the adoptable parts of pxs: FR-05 historical formal-publication retrieval, FR-06 startup recovery of pending formal publication, and QR-02 a provisional recovery-performance target. It merges pxs identity, section-isolation, truthful-completion, and model-free idempotent-recovery rules into FR-02, INV-01, and the existing publication contract; it reuses SR-01 for credentials and adds path-safety and export-conflict criteria. Version 1.14.0 adds FR-07 structured-fact financial metrics with period identity, TTM formulas, program metric blocks, narrative-conflict disclosure, and independent reference requirements, and FR-08 a downstream brief view with canonical gaps, separate mandatory and compressible budgets, downstream-role boundaries, and controlled token/quality evaluation. Version 1.14.1 corrects fiscal-period matching and coverage, fact subject/accession identity, metric persistence and model-free recovery, metric-claim conflict scope, brief budget precedence and audit metadata, and unified quality/lifecycle acceptance. Version 1.15.0 changes every requirement status to draft pending human review, marks QR-02 deferred, and removes unretained personal-proposal source paths. Version 1.16.0 applies the limited split into PR-01, CR-01, GR-01, QR-01, and SR-02, and defers FR-05 export, FR-06 multi-worker recovery, FR-07 TTM/FCF YoY, and QR-02 performance. Version 1.17.0 fixes PR-01 write and overhead statistics, GR-01 prerequisite direction and evidence conditions, CR-01 measurement/improvement semantics and brief-contract alignment, FR-01/QR-01 responsibility duplication, QR-02 type, and deferred-scope and validator consistency. Version 1.18.0 aligns the shared brief-evaluation definition and CR-01 with contract v2, fixes the four-state evidence model and cost-claim boundary, completes the local cost measurement disclosure, and splits GR-01 pre-implementation freeze readiness from post-implementation timing. Version 1.19.0 clarifies query identity/budgets, manifest timing and immutable content, availability snapshot sealing, risk-input binding and reason mapping, history edge semantics, recovery sequencing, financial visibility/conflict consequences, brief deterministic defaults, benchmark boundaries, local-cost usage/aggregation, reference-freeze digest projection, live-quality aggregation, gate blocked/error uniqueness, memory reuse/status mapping, risk-evidence null handling, credential failure scanning, and path read/write boundaries. Version 1.20.0 removes remaining contradictory rules: query budget continuation, manifest timing/write-failure boundaries, coverage record identity and fallback status, invalid-rating risk handling, decimal positive/negative fixtures, FR-08 versus CR-01 acceptance, unique live-sampling rule, SB-01 blocked/error table, INV-01 historical memory projection, concrete empty/short-secret rules, and unsupported-platform path behavior. Version 1.21.0 completes the semantic revision of FR-01 through FR-05: versioned execution and normalization contracts, waiter/execution cancellation separation, bounded timeouts and budgets, checkpoint inheritance; non-self-referential manifest timing, truthful lifecycle nullability, call/usage coverage, discriminator and write-failure semantics; declared query plan Q, executed set E, supports contract set S, fixed quorum, period slots, evidence deduplication, sealed coverage snapshot; bounded canonical risk input, exact cross-product limits, portfolio scope, policy/input/diagnostic separation; and a minimal verified list/get history interface with exact pagination, scan-budget failure, closure, section completeness, and extra-file rejection. No requirement is approved by this revision; all active requirements remain draft. Version 1.22.0 closes the pre-approval gaps for FR-02, FR-04, FR-05, FR-06, FR-07, and FR-08 without adding, deleting, or renumbering ACs: manifest observed-timing arithmetic, lifecycle-required timing/token coverage and semantic negatives; canonical 0.3 policy thresholds, logical policy identity versus file reference, and digest/file-SHA separation; separate limit/offset domains and a controlled cross-run historical proof exception; single-process startup recovery with failed_precommit continuation, terminal-first conflict/corruption handling, original risk-state preservation, restored metrics, and memory new/reuse/disabled modes; fiscal-position/version/date-level/price/completed-close/formula/display/n-a and analyst-off semantics; and token-primary brief budgets, full-request caps, resolved references, five-role replacement, versioned FR-03 views, single terminal BRIEF_REJECTED with invalid_marker reason, audit metadata, and FR-08/CR-01 acceptance separation. No requirement is approved by this revision; all active requirements remain draft and human review remains pending. Version 1.23.0 applies the current modification review to all active requirements without adding, deleting, or renumbering ACs. It closes PR-01 enabled/no-op, AB/BA, failure/rerun, payload and acceptance boundaries; CR-01 field-level usage, selected/shared generation, aggregate/target, execution-status and contract-v3 rules; GR-01 independent-source/derivation paths, issuer/calendar evidence, and initial-versus-revision timing; QR-01 scoring merge/adjudication, sample completeness, percentage-point REVIEW, cache/risk separation and hard safety events; SB-01 gate/publication separation, trustworthy blocked-record conditions, unique unsupported mapping, timeout/recovery evidence and nullable risk state; INV-01 identity/projection separation, per-field canonicalization, pre/post-commit failure, retention proof and reservation high-water rules; INV-02 reason/review-class mapping, independent corpus expectations, current/historical evidence, pure/wrapper boundaries and read-time tamper; SR-01 detected/redacted/residual accounting, credential-store exceptions, extended scope, scanner-failure incidents and post-commit handling; and SR-02 all-operation confinement, trusted-root/link policy, check-use races, typed historical references and honest platform limits. No requirement is approved by this revision; all active requirements remain draft and human review remains pending. Version 1.24.0 records the user-authorized approval of the active D1 requirement design and freezes the approved baseline. It normalizes every fit criterion to the per-requirement <requirement-id>-FCnn format without adding, deleting, merging, splitting, or semantically rewriting any requirement or FC; preserves 18 requirements and 122 FCs; records the complete mapping in docs/req/requirement-mapping.csv; sets the 17 active requirements to approved; keeps QR-02 deferred; and records the approval basis, scope, freeze files, and limitations in the validation approval record. Provisional thresholds, unmeasured criteria, blocked evaluation inputs, external reference evidence, and implementation prerequisites remain in their prior states and are not made approved or complete by this freeze. Version 1.25.0 applies the user-authorized CR-01 local correction without adding, deleting, or renumbering any requirement or FC. It replaces the previous four-value/overloaded CR-01 state wording with two explicit fields: execution_status (not_started/running/completed/aborted) and acceptance_status (blocked/ready/accepted/failed, with null only while running). It forbids pending/aborted acceptance strings, defines running/null, completed/accepted, completed/failed, and aborted/failed, rejects a started attempt returning to blocked/ready, treats run_completed as auxiliary only, and preserves terminal attempts, observed_failures, retry history, the existing cost formula, quality/safety rules, thresholds, approval conditions, and deferred scope. The active brief evaluation contract becomes brief-eval-contract-v4; v3 and earlier remain historical. No other requirement content is changed except the FR-08 active-contract reference; QR-02 remains deferred. Version 1.26.0 converges FR-01 to run-scoped reuse of identical data queries for the explicitly listed get_news paths. It replaces the prior nine fit criteria with five (sequential reuse, query identity, concurrent reuse, run isolation, and real-path integration with result protection), removes the versioned normalization contract, execution policy, retry/fallback budgets, waiter/execution cancellation, shared deadlines, run-cache capacity policy, checkpoint inheritance, cache on/off business-equivalence acceptance, all-entry-point coverage, and benefit acceptance from FR-01, and reduces the global fit-criterion count from 122 to 118. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. No application implementation, test result, or measured benefit is claimed. Version 1.27.0 converges FR-02 to a native, auxiliary per-analysis run manifest for the CLI analysis entry and TradingAgentsGraph.propagate(). It replaces the prior eleven fit criteria with five (normal lifecycle/content, run identity/statistics isolation, call/token accounting, execution failure and non-blocking write failure, and entry-point integration/format), removes FR-02's implementation dependency on FR-01, drops coverage/gate/risk/memory/recovery snapshots, artifact hashes, cross-artifact binding, terminal-manifest commit semantics, phase timing, field-level usage coverage, checkpoint inheritance, same-run resubmission and concurrent publication requirements, and benefit acceptance from FR-02. It fixes the token rule (any counted call without valid input/output usage makes both totals null and usage_complete false), makes manifest write failures non-blocking warnings, and limits supported entry points to CLI analysis and propagate(). The global fit-criterion count recomputes from 118 to 112; the requirement count remains 18. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0 or v1.27.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. No application implementation, test result, or measured benefit is claimed. Version 1.28.0 converges FR-03 to a run-scoped data availability summary for a fixed list of 15 supported call-path positions over 14 methods. It replaces the prior ten fit criteria with five (query status/reason, fixed stock necessity list, supplementary limitations and fallback, last completed result and run isolation, and real-path integration with deterministic display), removes the dynamic critical profile/plan, overrides/fetch owners/auto-preflight, supports contracts, eligible-evidence counts and quorum, annual/quarter slots, HTTP/attempt/provenance ledgers, versioned views, barriers/deadlines/seals, checkpoint inheritance, memory reuse/proof/binding, cross-system business-equivalence acceptance, and FR-03-owned REVIEW or formal-publication decisions. It fixes the stock necessity list at seven analyst-gated items, adopts the last-completed-result rule as of each consumer's time, and states that summary refresh never triggers a new query, refetch, retry, or model re-run. FR-03 no longer declares an implementation dependency on FR-01 and does not require FR-02. The global fit-criterion count recomputes from 112 to 107; the requirement count remains 18. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0, v1.27.0, or v1.28.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. No application implementation, test result, or measured benefit is claimed. Version 1.29.0 converges FR-04 to deterministic risk checks for a stock purchase scenario. It replaces the prior nine fit criteria with five (normal/boundary arithmetic, over-limit, input/config negatives, applicability/authority, entry/report), removes broker/account source approval, cash checks, quantity/value identity, historical valuation cutoff/freshness, the canonical decimal grammar, policy approval/version/digest, input artifact SHA, diagnostic artifact, effective_order_value, gate hash, memory/recovery/cross-artifact consistency, cache/risk-policy A/B, and repeated 100-run requirements, and fixes the caller-supplied minimal input, two formulas, configurable classroom thresholds, applicability, and failure semantics. FR-04 declares no implementation dependency on FR-01, FR-02, FR-03, or SB-01. The global fit-criterion count recomputes from 107 to 103; the requirement count remains 18. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0 through v1.29.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. No application implementation, test result, measured risk event, or over-limit Buy observation is claimed. Version 1.30.0 converges FR-05 to a lightweight historical analysis report lookup. It replaces the prior three fit criteria with five (discovery/bad-record isolation, filtering/ordering, saved-report reading, path/root errors, and save integration with query read-only behavior), removes committed-publication and read-time INV-01/INV-02 validation, VerifiedRun and immutable-report claims, section manifests and renderer/capability binding, hashes/byte sizes/extra-file checks, risk/metric/memory proof closure, reused_decision_ref cycles and rotation proof, indexes/pagination/total-count/scan-budget formulas, concurrent-read transaction consistency, repair/recovery/republication/migration, CLI history menus, export, full-text search, and Web UI, and removes automatic propagate() report saving. FR-05 retains only the direct FR-02 implementation dependency and states basic safe-read rules directly. The global fit-criterion count recomputes from 103 to 105; the requirement count remains 18. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0 through v1.30.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. No application implementation, test result, or retrieval guarantee is claimed. Version 1.31.0 simplifies FR-06 to deferred local recovery of an unfinished merged Markdown report save and moves it from the active approved scope to the deferred scope. It replaces the prior six fit criteria with five (material and normal cleanup, model-free completion in an independent session, repeated recovery/conflict/cleanup failure, bad material/path/storage failure, and entry/non-blocking boundaries), removes formal-publication commit, terminal-first/failed_precommit promotion, read-time INV-01/INV-02 validation, risk/policy/metric/memory proof recovery, multi-process guard/ownership/takeover, digests/failure audits/quarantine/retry scheduling, section/HTML recovery, manifest repair, history registration, and current performance acceptance, and states the single-process, saved-text-only, FR-02-identity dependency directly. FR-06 is not part of current active acceptance; its five FCs are retained as future conditions and remain in the total count. The global fit-criterion count recomputes from 105 to 104; the requirement count remains 18, with 16 approved active requirements and 2 deferred requirements (QR-02 and FR-06). Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26. 0 through v1.31.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. No application implementation, test result, recovery event, or benefit is claimed. Version 1.32.0 removes FR-07 (deterministic derived financial metrics) from the requirement registry because the user decided not to implement it. Its ten fit criteria and its dedicated traceability entry are removed; the remaining requirements and FC IDs are not renumbered, and FR-07 is neither retained as deferred nor reused. The requirement count recomputes from 18 to 17, with 15 approved active requirements and 2 deferred (FR-06 and QR-02); the global fit-criterion count recomputes from 104 to 94. References to FR-07 inside GR-01, FR-08, INV-01, shared definitions, conflict resolutions, and open questions are deliberately left unchanged for later review, so they may be dangling or out of date. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26. 0 through v1.32.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. No application implementation, test result, or benefit is claimed. Version 1.33.0 renames the former downstream-brief FR-08 to FR-07 and simplifies it to deferred analyst short summaries for five downstream debate roles. The former financial-metrics FR-07 was already removed in v1.32.0, so the identifier is reused only for the renamed summary requirement; old financial-FR-07 and old-FR-08 references in other requirements and historical records retain their old meaning and may collide with the new ID. The revision replaces the prior four fit criteria with five (same-call summary structure, target-role replacement scope, character boundary and non-blocking fallback, FR-03 program-limitation preservation, and full-report/integration preservation), removes token budgets, tokenizer dependence, references/resolvers, terminal BRIEF_REJECTED, marker protocols, audit metadata, view versions, financial metric blocks, formal-publication/memory/history/recovery binding, and cost/token/quality benefit claims, and adopts a pending Unicode-character limit, direct FR-03 program-summary inclusion, and full-report fallback. FR-07 is deferred, not part of current active acceptance, and retains its five FCs as future conditions. The requirement count remains 17, with 14 approved active requirements and 3 deferred (FR-06, FR-07, QR-02); the global fit-criterion count recomputes from 94 to 95. Additional dependencies change from old FR-07/SB-01/INV-01/SR-01 to FR-02 and FR-03. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0 through v1.33.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/evaluation/brief-eval-contract-v4.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. No application implementation, test result, token/cost saving, quality improvement, or semantic-fidelity guarantee is claimed. Version 1.34.0 is a strictly limited wording correction: it replaces FR-01 and FR-03 references to the removed financial-metrics feature so they no longer point at the current FR-07, states FR-02 manifest creation/update as required with best-effort persistence, clarifies FR-03 no-completed-result versus not-executed wording, makes FR-04 CLI display and propagate() final_state exposure mandatory, limits FR-05 error/warning output and requires missing registered reports to remain listed while distinguishing reference resolution from existence, clarifies FR-06 no-pending-task normal return, and narrows FR-07 FC02 no-duplication scope. No requirement ID, status, priority, dependency, or FC count/number changed; counts remain 17 requirements and 95 FCs, with 14 approved active requirements and 3 deferred (QR-02, FR-06, FR-07). Historical records and external artifacts are not revalidated by this revision. Version 1.35.0 converges PR-01 to deferred measurement of run-manifest operation overhead. It replaces the prior four fit criteria with two (complete manifest-creation operation timing and complete manifest-update operation timing), removes the enabled/disabled paired benchmark, AB/BA order, independent WriteEvidence, named pre-replace phases, committed-publication control, risk/gate/memory equivalence, 256 KiB payload cap, layered digests, rerun classification, and the 100 ms/1%/1 s thresholds, and adopts 20 samples per operation, nearest-rank p95, retained failures and actual byte counts, and thresholds that remain null/undetermined until after measurement. PR-01 is deferred, not part of current active acceptance, retains its two FCs as future conditions, keeps FR-02 as its only implementation dependency, and drops the INV-01 constraint relation. The requirement count remains 17, with 13 approved active requirements and 4 deferred (FR-06, FR-07, PR-01, QR-02); the global fit-criterion count recomputes from 95 to 93. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0 through v1.35.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. No measurement, implementation, threshold approval, or performance acceptance is claimed. Version 1.36.0 converges CR-01 to deferred comparison of model usage and estimated cost with analyst briefs. It replaces the prior five fit criteria with three (formula/missing handling, fixed three-scenario OFF/ON measurement, and result/claim boundaries), removes the local G/D attribution, selected generation instance, excluded-cost rules, reference/mandatory budgets, view updates, execution_status/acceptance_status machine, input digests, retry-state protocol, approved net_cost_max/quality-loss thresholds, safety/quality acceptance coupling, and INV-01/SB-01 constraints. It adopts three fixed OFF/ON scenarios over whole-analysis application-level usage, includes real retries/fallbacks and failed calls, reports token and estimated cost differences separately from given unit prices, and leaves thresholds undetermined until after measurement. CR-01 is deferred, not part of current active acceptance, retains its three FCs as future conditions, and keeps FR-02 and the renamed deferred FR-07 analyst-summary requirement as its only implementation dependencies. The requirement count remains 17, with 12 approved active requirements and 5 deferred (CR-01, FR-06, FR-07, PR-01, QR-02); the global fit-criterion count recomputes from 93 to 91. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0 through v1.36.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json, docs/req/evaluation/brief-eval-contract-v4.json, and the D2 artifacts are not updated by this revision. No measurement, cost-target approval, cost saving, quality preservation, or overall optimization success is claimed. Version 1.37.0 deletes GR-01, the frozen independent reference set for the removed financial-metrics feature, because that feature no longer exists and the current FR-07 is the deferred downstream-summary requirement. GR-01, its six fit criteria, its dedicated traceability entry, its scope and MoSCoW listings, and its standalone financial-reference scope bullet are removed; GR-01 is not deferred and its identifier is not reused. No other requirement or FC is renumbered, and no replacement requirement is added. The requirement count recomputes from 17 to 16, with 11 approved active requirements and 5 deferred (CR-01, FR-06, FR-07, PR-01, QR-02); the global fit-criterion count recomputes from 91 to 85. References to GR-01 or to the old financial FR-07 inside other requirements, shared definitions, conflict resolutions, and open questions are deliberately left unchanged and may now be dangling. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0 through v1.37.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json,