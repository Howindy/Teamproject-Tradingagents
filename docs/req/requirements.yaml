requirements:
  - id: FR-01
    type: "functional"
    title: "Single execution per identical logical data query within a run"
    priority: "must"
    status: "approved"
    stakeholders: [analyst, trader, operator]
    source:
      origin: "Repository analysis and measured baseline"
      evidence:
        - path: "TradingAgents/tradingagents/dataflows/router.py"
          locator: "L200 route_to_vendor"
          description: "Central data-tool dispatcher; no run-scoped query cache or single-flight guard is present."
          source_type: "code"
        - path: "TradingAgents/tradingagents/agents/analysts/sentiment_analyst.py"
          locator: "L66 get_news.func and L69 jev_screen"
          description: "Sentiment prefetch invokes data functions directly, so its ticker-news query does not pass through an analyst tool call."
          source_type: "code"
        - path: "TradingAgents/tradingagents/graph/setup.py"
          locator: "L157-L166 parallel analyst edges"
          description: "Analysts run concurrently, so identical logical queries can overlap in time."
          source_type: "code"
        - path: "TradingAgents/tradingagents/dataflows/vendors/yahoo/ohlcv.py"
          locator: "L146-L207 load_ohlcv cache"
          description: "The existing OHLCV vendor cache is cross-run and must remain distinct from the new run cache."
          source_type: "code"
        - path: "TradingAgents/tradingagents/dataflows/vendors/sec_edgar.py"
          locator: "L122-L132 _cached_json"
          description: "SEC EDGAR also has a cross-run vendor cache with its own TTL."
          source_type: "code"
        - path: "baseline/runs/baseline-20261020-01/transcripts/tool-events-clean.jsonl"
          locator: "seq 21 and seq 68 get_news rows"
          description: "Two news-analyst tool calls use the same ticker-news arguments within one run."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/transcripts/prefetch-events.jsonl"
          locator: "sentiment_news row"
          description: "A third ticker-news attempt with the same window is made by the sentiment prefetch."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/data-availability.csv"
          locator: "FRED, ticker-news, and prediction-market rows"
          description: "The six FRED rows are distinct indicators and the two prediction-market rows are distinct topics; both sets failed locally without an external request."
          source_type: "measured_baseline"
    problem: >
      The baseline made three logical ticker-news queries with the same key: one
      sentiment prefetch and two news-analyst tool calls. The six FRED rows and
      two prediction-market rows were distinct logical queries that failed
      locally because the source was not configured or withheld for the
      historical date, so they did not produce duplicate external requests.
      Repeating the logical work consumes tool rounds and model context, and the
      existing vendor caches make an external-request count an unreliable
      acceptance target.
    statement: >
      Within one run, the system MUST start at most one query_execution per
      logical_query. The first query_execution MUST own the retries and vendor
      fallback chain for that logical query; retries and fallbacks MUST be
      bounded by separate configured budgets and MUST NOT start another
      query_execution. Concurrent callers for the same key MUST join the same
      in-flight execution. When the execution policy reaches a terminal outcome,
      whether success, no_data, withheld, not_configured, or unavailable/error
      after the budgets allow no further attempt, that outcome MUST be cached and
      reused for the remainder of the run with the same status, reason, and
      provenance. The run cache MUST NOT be shared across runs. Verified
      checkpoint evidence inheritance under a recorded lineage is a separate
      recovery mechanism, tagged origin_run_id/inherited and counted in separate
      inherited counters; it is not ordinary run-cache reuse. Existing vendor
      caches MAY be shared across runs under their existing TTLs; a vendor-cache
      hit is a property of one query_execution and MUST be recorded separately
      from external requests.
    acceptance_criteria:
      - id: FR-01-AC1
        input: "An offline fixture in which three callers submit the same data_query_key sequentially within one run; the mock vendor chain succeeds on its first invocation."
        expected_result: "The logical query is executed exactly once; vendor invocation count = 1; all three callers receive the same payload and provenance; duplicate query_executions for that key = 0."
        verification: "Unit test with a mock vendor call counter and a shared run-scoped access service; assert vendor call count, payload equality, and query_execution_count = 1."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-01-AC2
        input: "An offline fixture in which N callers (N at least 3) submit the same data_query_key concurrently before the first execution completes; the mock vendor blocks until released."
        expected_result: "Exactly one query_execution is started; the other callers wait for and receive its result; vendor invocation count = 1; duplicate concurrent executions = 0."
        verification: "Concurrency test with a thread barrier and a blocking mock vendor; assert a single vendor call and identical results for every caller."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-01-AC3
        input: "Offline fixtures in which the first execution of a data_query_key reaches a terminal outcome under policy: success with no retry needed; no_data without retry; withheld without retry; not_configured without retry; and unavailable/error only after the retry and fallback budgets allow no further attempt. Each fixture is followed by two later callers with the same key."
        expected_result: "Every terminal outcome is cached for the run, including success, no_data, withheld, and not_configured when the policy ends without retries. Later callers do not start a new query_execution; returned status and reason are identical; duplicate executions = 0."
        verification: "Unit test with a mock vendor chain returning each terminal status; assert execution count, status and reason equality, and the recorded retry and fallback counters."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-01-AC4
        input: "Run A uses the data_query_key with an empty run cache and a cold vendor cache; Run B repeats the same key with its own empty run cache and the vendor cache warmed by Run A."
        expected_result: "Each run starts its own query_execution; cross-run run-cache reuse = 0. A warm vendor cache MAY satisfy the execution with external_request_count = 0 and vendor_cache_hit = true; that is not run-cache reuse. Vendor-cache hits and external requests are recorded separately."
        verification: "Integration test with two isolated run contexts; run once cold and once warm; assert two query_executions, zero run-cache reuse, and the expected vendor_cache_hit and external_request counters."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-01-AC5
        input: "An offline fixture in which the first vendor in the configured chain is rate-limited or unavailable and a later vendor succeeds; retry and fallback budgets are set to fixed small values."
        expected_result: "Retry attempts stay within retry_budget and vendor fallbacks stay within fallback_budget; query_executions for the key = 1; retry_attempts, fallback_attempts, external_requests, and query_executions are separate counters; exceeding either budget yields a terminal unavailable outcome without a second query_execution."
        verification: "Unit test with a scripted mock vendor chain and explicit budgets; assert each counter and the terminal outcome."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-01-AC6
        input: "An offline fixture with a fixed model replay or stub and the same injected vendor responses is executed once with FR-01 enabled and once disabled."
        expected_result: "The business conclusions are identical between the enabled and disabled runs: coverage_status, requirement_status, critical_gaps, final rating, and final decision under fixed replay. Execution metadata is expected to differ and is compared separately: query_executions, external_requests, vendor_cache_hits, run_cache_hits, retry_attempts, fallback_attempts, payload identity, and latency. Business-conclusion diff = 0; execution-metadata differences are recorded, not required to be zero."
        verification: "Deterministic model replay or stub; compare the canonical business-conclusion fields for equality and compare the execution-metadata fields in a separate report; assert no business-conclusion differences."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-01-AC7
        input: "A live A/B experiment on eval_set_version = d1-eval-v1 (at least 10 fixed ticker/date cases, including NVDA 2026-10-19), with identical model, configuration, prompts, and data snapshots, and with FR-01 enabled and disabled. The frozen behavior_evaluation_contract and evaluation_rubric are used."
        expected_result: "Deterministic fixed-replay fixtures are zero-tolerance: unsafe_output_escape_count = 0, critical-gap outcomes unchanged, and gate REVIEW outcomes unchanged for identical inputs/coverage. Live model sampling is evaluated separately: mean rubric score drop at most 0.5, no single case drop over 1.0, and live REVIEW-rate increase at most 10 percentage points. Any breach of the matching rule fails acceptance. Exact text equality is not required. Rubric, eval-set version, per-case scores, and deltas are recorded."
        verification: "Validate docs/req/evaluation/behavior-eval-contract-v1.json, eval-set-v1.json, rubric-v1.json, config-v1.json, prompt-v1.0.yaml, and snapshots-v1.json; capture every case snapshot; run live A/B with the frozen set and rubric; record per-case and aggregate scores, safety escapes, coverage changes, REVIEW rate, latency, token, and cost; fail on any threshold breach."
        zero_tolerance: false
        measurement_status: "not_measured"
        threshold_status: "approved"
    implementation_dependencies: []
    constraint_relations: [INV-01]
    conflicts:
      - "Data freshness: a cached success could hide an intra-run update. Resolution: the run cache is scoped to one run and the key includes the requested window and analysis date."
      - "Vendor caches already exist across runs, so an external-request count would misjudge normal behavior. Resolution: the run cache is per-run and never shared; vendor-cache hits are allowed, counted separately, and are not run-cache reuse."
      - "Cache metadata could change report output. Resolution: cache metadata is recorded in run records, not in the user-facing decision text."
      - "Retries and vendor fallbacks would look like duplicate queries. Resolution: they are bounded by separate budgets inside one query_execution and are counted separately."
      - "Concurrent callers could each start the query. Resolution: single-flight joins them to one in-flight execution."
    assumptions:
      - "A normalization function produces a stable data_query_key for method, asset type, normalized instrument or topic, analysis date, requested window or lookback, method-specific parameters, vendor selector digest, and cache_key_version."
      - "Arguments that resolve to the same vendor resource, such as indicator aliases, share one data_query_key."
      - "Retry and fallback budgets are configuration values with documented defaults."
      - "fallback_budget bounds vendor attempts within the configured chain; retry_budget bounds per-vendor retries; the two counters are independent."
      - "The run cache is isolated between concurrent runs; verified checkpoint evidence inheritance is allowed only under a recorded lineage and separate inherited counters; ordinary cross-run cache reuse is forbidden. Existing vendor caches remain cross-run and are recorded as vendor-cache hits."
      - "Terminal outcomes are cached when the execution policy reaches them; success, no_data, withheld, and not_configured may be terminal without retry, while unavailable/error is terminal only after the budgets allow no further attempt."
      - "Business-conclusion fields and execution-metadata fields are compared separately; cache and execution metadata are not required to match across cache-enabled and cache-disabled runs."
    notes: >
      FR-01 v1.1.0 limits logical query executions, not external HTTP requests.
      The baseline proves one repeated logical ticker-news query across the
      sentiment prefetch and news-analyst tool calls. It does not prove
      duplicate external requests for FRED or prediction markets: those rows are
      distinct logical queries that failed locally. Performance, token, and cost
      effects are measured separately and are not part of this requirement.

  - id: FR-02
    type: "functional"
    title: "Emit one lifecycle-complete run manifest"
    priority: "must"
    status: "approved"
    stakeholders: [reviewer, operator, analyst]
    source:
      origin: "Repository analysis and measured baseline"
      evidence:
        - path: "TradingAgents/cli/stats_handler.py"
          locator: "L9 StatsCallbackHandler"
          description: "The callback counts LLM calls, tool calls, and token usage but does not persist them, measure duration, or expose prefetch/reflection counts."
          source_type: "code"
        - path: "TradingAgents/cli/run.py"
          locator: "L135-L140 results directory and message_tool.log"
          description: "The CLI writes reports and a tool-call log but no machine-readable run manifest or lifecycle record."
          source_type: "code"
        - path: "TradingAgents/tradingagents/graph/trading_graph.py"
          locator: "L167-L181 propagate and L372-L401 _run_graph"
          description: "The graph lifecycle has a start and completion path but no startup or terminal manifest writer."
          source_type: "code"
        - path: "TradingAgents/tradingagents/graph/trading_graph.py"
          locator: "L255-L275 run_settings"
          description: "An allowlisted settings view exists and excludes keys, endpoints, and local paths."
          source_type: "code"
        - path: "TradingAgents/tradingagents/graph/trading_graph.py"
          locator: "L308-L335 _memory_step"
          description: "Settlement and reflection run during the analysis and can make LLM calls that must be attributed by the counters."
          source_type: "code"
        - path: "TradingAgents/tradingagents/memory/reflection.py"
          locator: "L63 invoke"
          description: "The Reflector uses the quick-thinking LLM, so reflection calls are observable by the same callback boundary."
          source_type: "code"
        - path: "baseline/runs/baseline-20261020-01/metrics.json"
          locator: "inner counters and llm_usage_missing"
          description: "The baseline metrics were collected by an external wrapper and include llm_calls, tool_calls, tokens, prefetch_event_count, retry_events, and llm_usage_missing."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/run-manifest.json"
          locator: "all fields"
          description: "The baseline manifest is an external collection artifact with a different shape; it has no run_status lifecycle, safety_gate_result, or artifact hashes."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/logs/stderr.log"
          locator: "file size"
          description: "The baseline stderr log is empty; vendor warnings were not visible without an external logging wrapper."
          source_type: "measured_baseline"
    problem: >
      The baseline produced reports and a tool-call log but no native,
      machine-readable run record. The run metrics and manifest were collected
      by an external wrapper, not by the product, and the external manifest does
      not record lifecycle state, a schema version, sanitized configuration,
      artifact hashes, or a terminal failure record. The callback counts also do
      not distinguish prefetch, reflection, retry, fallback, or missing token
      usage, and the baseline contract does not say which calls are included.
    statement: >
      Each run invocation MUST create exactly one manifest at
      <results_dir>/<run_id>/run_manifest.json. The manifest MUST validate
      against docs/req/run-manifest-schema.json and MUST carry schema_version,
      run_id, parent_run_id, run_status, artifact_binding, formal_decision,
      critical_profile, coverage_snapshot, provenance_digest, safety-gate input_hash,
      run_clock, inheritance record, audit-only model_proposal, security scan results, memory entry binding, run identity,
      sanitized configuration allowlist, timing, call and token counters, full
      availability records with data_query_key, supports links, ordered attempts,
      and http_request_count, safety-gate result, and artifact hashes. The
      availability-record structure MUST be the same contract used by FR-03;
      manifest and final-state MUST be able to carry the full record set.
      completed requires a passed or blocked safety gate, clean or redacted
      per-write and run-level security scans with zero known-secret and
      unredacted pattern matches, a non-pending formal decision, and report,
      final-state, and memory-entry artifacts when memory is enabled.
      Before any model call, the system MUST atomically write a running manifest.
      On normal completion or a handled failure, it MUST atomically replace it
      with a completed or failed manifest. A run invocation has a unique run_id;
      a checkpoint resume is a new invocation with parent_run_id set to the
      interrupted run_id. If the process is forcibly terminated (SIGKILL, OOM,
      or power loss), only the last successfully written running manifest is
      guaranteed; no terminal manifest is guaranteed. The manifest MUST NOT
      contain credentials, endpoints, or local absolute paths.
    acceptance_criteria:
      - id: FR-02-AC1
        input: "A complete analysis run using the approved D1 configuration; the graph and persistence succeed."
        expected_result: "Exactly one schema-valid manifest exists at <results_dir>/<run_id>/run_manifest.json; run_status = completed; run_id, ticker, analysis_date, and asset_type match the run context and the final-state run_id; duplicate manifests for the run_id = 0."
        verification: "Integration test; enumerate manifest files, validate the JSON against run-manifest-schema.json, and compare path and identity fields with the run context and final-state."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-02-AC2
        input: "A run in which the graph raises a handled exception after the running manifest is written, or persistence fails after analysis completes."
        expected_result: "The same manifest path is atomically replaced with run_status = failed; error.stage, error.type, and sanitized error.message are present; finished_at and durations are non-null; partial counts are retained; the manifest is schema-valid; duplicate manifests = 0."
        verification: "Failure-injection integration test at analysis and persistence stages; assert the terminal record, error fields, timing, and schema validity."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-02-AC3
        input: "A run terminated by SIGKILL or an equivalent abrupt process stop after the running manifest is written and before completion."
        expected_result: "The last successfully written manifest remains run_status = running and schema-valid; no completed or failed manifest is required; no corrupt or partial file exists at the final manifest path; run_id and identity match the started run."
        verification: "Subprocess test that kills the process during analysis; read and validate the manifest path; assert running status, identity, and absence of corruption."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-02-AC4
        input: "Two run invocations in the same results directory, one of which is a checkpoint resume of an interrupted invocation."
        expected_result: "Each invocation has a unique run_id and exactly one manifest; the resume records parent_run_id and does not overwrite the interrupted run's manifest; the run_id in the manifest equals its directory name and the final-state run_id; duplicate, orphaned, or mismatched manifests = 0."
        verification: "Integration test with two run contexts and a resumed checkpoint; enumerate manifests and assert identity, path, parent linkage, and uniqueness."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-02-AC5
        input: "A completed manifest produced by a run."
        expected_result: "The manifest validates against run-manifest-schema.json; schema_version = 1.0; artifact_binding, formal_decision, audit-only model_proposal and proposal_digest, critical_profile, coverage_snapshot, provenance_digest, run_clock, inheritance record, security (write and run scans), memory entry binding, counts, tokens, timing, and data_source_status are present with the declared types, units, enums, and nullability; each data_source_status record carries data_query_key, supports links, ordered attempts with http_request_count, tried and serving sources, status, reason_code, record_count, and provenance; config contains only the allowlisted fields and no key, endpoint, or local path; validation errors = 0."
        verification: "Schema validation plus a sanitizer scan of config and artifact paths; compare required fields with the schema contract."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-02-AC6
        input: "A deterministic fixture with known LLM calls, including one structured-output retry and one reflection call; known tool calls, including one failed tool call; three prefetch data calls; one vendor retry; and one vendor fallback."
        expected_result: "Manifest llm_calls equals the fixture ground truth and the independent callback count; tool_calls excludes prefetch; prefetch_calls = 3; reflection_llm_calls is a counted subset of llm_calls; retry_attempts and fallback_attempts match the fixture and are not merged into llm_calls, tool_calls, or query_executions; mismatches = 0."
        verification: "Deterministic fixture with instrumented mock LLM and vendors; compare manifest counters against fixture ground truth and an independent event log, not only against the callback totals."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-02-AC7
        input: "Three fixtures: every LLM call reports usage; half report usage; no call reports usage."
        expected_result: "tokens.status is complete, partial, and unavailable respectively; complete requires non-null input, output, and total tokens; partial stores the sum of known calls with correct with-usage and without-usage counts; unavailable stores null tokens and never synthetic zeros; llm_calls_with_usage + llm_calls_without_usage = llm_calls; mismatches = 0."
        verification: "Unit and integration tests with mock LLM responses that include, omit, or partially omit usage_metadata."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-02-AC8
        input: "Twenty pairs (40 runs total) of one-ticker, one-round runs on the fixed fixture: manifest-enabled and no-op-writer runs alternate order with the same model, config, and fixture; payload size at most 256 KiB. End-to-end duration is measured externally from process start to the return of the final manifest replace."
        expected_result: "manifest_write_seconds is measured by the publisher from serialization start to temp-file flush/fsync before the final atomic replace, so it is known before the terminal file is written; duration_seconds equals startup_manifest_write_seconds + analysis_seconds + publish_seconds within 50 ms, where publish_seconds ends before the terminal manifest replace and no timing field depends on its own final value. External paired process duration includes the replace and is used for the overhead comparison. p95 is nearest-rank over the 20 per-pair deltas (sort ascending; rank = ceiling(0.95 x N)). Startup and terminal manifest write p95 at most 100 ms; end-to-end overhead p95 at most 1% and at most 1 second; report N, pairing order, p50/p95/max, payload size, and environment; thresholds are provisional."
        verification: "External paired benchmark with monotonic phase timing and nearest-rank p95; report pairing order, per-pair deltas, p50/p95/max, payload size, and environment."
        zero_tolerance: false
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-02-AC9
        input: "A run in which the final manifest write fails (simulated ENOSPC or EACCES), or the manifest fails schema validation before publication."
        expected_result: "The run reports failure to its caller and does not claim completed; no incomplete or corrupt manifest is left at the final path; the last valid running manifest remains schema-valid; a retry can write a complete manifest; silent success = 0."
        verification: "Failure-injection test monkeypatching the atomic writer and schema validator; assert error propagation, final-path integrity, and retry success."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-02-AC10
        input: "Independent completed-status negative fixtures: safety_gate.status = not_run; safety_gate.status = error; security run scan = failed; known_secret_match_count > 0; artifact_binding.decision_digest = null; formal_decision.status = pending; report artifact missing; final-state artifact missing; memory-entry artifact missing when memory is enabled. Cross-field semantic contradictions: binding.gate_status differs from safety_gate.status; binding.formal_decision_status differs from formal_decision.status; binding.final_rating differs from formal_decision.final_rating; binding.critical_gap_ids differs from safety_gate.critical_gap_ids; binding.coverage_status differs from coverage_snapshot.coverage_status; binding.coverage_snapshot_hash differs from safety_gate.snapshot_hash; binding.run_id differs from run_id; coverage_snapshot.provenance_digest differs from provenance_digest; safety_gate.input_hash differs from the canonical model-proposal gate-input hash."
        expected_result: "Each fixture is rejected by the completed-state schema condition or the cross-field semantic completion check and cannot remain run_status = completed. No false completed record is accepted; mismatches = 0."
        verification: "Schema validation plus a semantic completed-record validator; assert rejection for every independent counterexample."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
    implementation_dependencies: [FR-01, FR-03]
    constraint_relations: [SB-01, SR-01, INV-01]
    conflicts:
      - "A detailed manifest conflicts with the lean D1 scope. Resolution: record counters, statuses, hashes, and the config allowlist, not full prompts or raw tool bodies."
      - "A startup record adds work before model calls. Resolution: keep the running record bounded and measure the write separately from the terminal record."
      - "A terminal record conflicts with forced termination. Resolution: guarantee only the last running record after SIGKILL, OOM, or power loss; handled failures write a failed record."
      - "Callback totals prove transcription but not accuracy. Resolution: reconcile against fixture ground truth and an independent event log."
      - "Missing token usage can look like zero usage. Resolution: use complete, partial, and unavailable statuses with null values and usage-coverage counts."
      - "Writing after analysis hides end-to-end overhead. Resolution: measure analysis, publish, and manifest write separately, and compare enabled versus disabled end-to-end duration."
    assumptions:
      - "The manifest schema is versioned and stored at docs/req/run-manifest-schema.json."
      - "run_id is unique per run invocation and is safe as a path component; a resume uses a new invocation with parent_run_id."
      - "The manifest path is <results_dir>/<run_id>/run_manifest.json."
      - "llm_calls counts every model invocation observed by the run callback boundary, including structured-output retries, provider-level retries visible to the boundary, and reflection/settlement calls; reflection_llm_calls is a subset."
      - "tool_calls counts analyst tool callbacks, including failed tool calls; prefetch_calls counts direct data calls outside tool callbacks."
      - "retry_attempts and fallback_attempts are vendor-boundary counters and are not merged into llm_calls, tool_calls, or query_executions."
      - "A missing token usage value is stored as null with tokens.status partial or unavailable; zeros are never synthesized."
      - "timing.duration_seconds runs from started_at before the startup manifest write through the terminal manifest write; analysis_seconds starts after the startup write, and publish_seconds covers publication plus the terminal manifest write."
      - "Manifest publication uses schema validation and an atomic temp-file plus replace; a failed write is surfaced to the caller."
      - "Internal publish staging files are not additional run manifests; exactly one run manifest is exposed at the run path."
      - "Manifest retention is outside D1; the manifest is written to the run's results directory."
    notes: >
      FR-02 is the lean D1 version. It does not require raw tool-output retention
      or per-agent token attribution. The external baseline manifest is evidence
      of the problem only; it does not satisfy this lifecycle, schema, counter,
      or integrity contract.

  - id: FR-03
    type: "functional"
    title: "Maintain one canonical data-availability state with a closed critical-gap decision table"
    priority: "must"
    status: "approved"
    stakeholders: [analyst, trader, reviewer]
    source:
      origin: "Repository analysis and measured baseline"
      evidence:
        - path: "TradingAgents/tradingagents/agents/state.py"
          locator: "AgentState"
          description: "The graph state has report fields and debate state but no unified data-availability field."
          source_type: "code"
        - path: "TradingAgents/tradingagents/dataflows/router.py"
          locator: "L200 route_to_vendor and L237-L295 fallback outcomes"
          description: "The router produces success, unavailable, not-configured, no-data, and fallback outcomes that are not accumulated into one state."
          source_type: "code"
        - path: "TradingAgents/tradingagents/dataflows/errors.py"
          locator: "L1-L55 vendor error taxonomy"
          description: "NoMarketDataError, VendorUnavailableError, and VendorNotConfiguredError are distinct behaviors; empty and stale data share one error type with only a free-text detail."
          source_type: "code"
        - path: "TradingAgents/tradingagents/dataflows/date_window.py"
          locator: "L67-L190 coverage_gap and withhold rules"
          description: "Coverage gaps, live-only withholding, and point-in-time rules are decided per call, not aggregated into a run state."
          source_type: "code"
        - path: "TradingAgents/tradingagents/agents/analysts/sentiment_analyst.py"
          locator: "L66-L76 prefetch calls"
          description: "The social analyst prefetches three sources directly; failures become placeholder strings with no structured status."
          source_type: "code"
        - path: "baseline/runs/baseline-20261020-01/data-availability.csv"
          locator: "all rows"
          description: "The baseline has 20 success, 4 withheld, 6 not_configured, and 4 unavailable rows; it has no per-requirement aggregation or effective critical profile."
          source_type: "measured_baseline"
    problem: >
      The baseline did not maintain one shared view of source availability.
      Different agents rediscovered the same gaps, the final decision did not
      receive a single canonical list of missing critical data, and the baseline
      CSV had no definition of the minimal record, source identity, success
      threshold, fallback clearing rule, effective critical set, or multi-query
      aggregation. A successful vendor call was not distinguished from data that
      actually satisfied the evidence contract.
    statement: >
      Each run MUST compute one immutable effective critical profile from asset
      type, analysis mode, enabled capabilities, and explicit overrides, and MUST
      record it together with the fixed run_clock. It MUST maintain one canonical
      run-scoped data_availability state. The executed-query unit is one availability_record per logical query
      execution (the FR-01 data_query_key), with record_kind = executed and keyed
      by tool, category, capability, component, supports links, requested and
      observed window, source, status, reason_code, record_count, ordered
      attempts with http_request_count, fallback/provenance, and cache kind. A
      critical component with no
      query_execution MUST be modeled separately as one component_missing_record
      with record_kind = component_missing; it has no data_query_key or attempts
      and is excluded from execution counters. Record status MUST be
      one of success, insufficient_evidence, no_data, unavailable, withheld,
      not_configured, not_attempted, or error; success requires the evidence
      contract, not merely a completed call. Records MUST aggregate
      deterministically into component, requirement, category, and run status
      using the closed requirement statuses satisfied, degraded, missing, and
      not_required. coverage_status MUST be complete if and only if every
      critical requirement is satisfied, otherwise partial. critical_gaps MUST
      contain exactly the degraded or missing critical requirements with a closed
      gap_reason. A fallback clears a gap only when it meets the same capability,
      component, instrument, requested window, as-of date, point-in-time rule,
      minimum-record count, and provenance contract; otherwise the gap remains.
      Non-critical gaps MUST be recorded and shown as limitations without
      affecting coverage_status or critical_gaps. The report, manifest, safety
      gate, and final decision MUST consume the same canonical state. The state
      MUST be deterministic under query reordering, concurrency, cache variation,
      and report language.
    acceptance_criteria:
      - id: FR-03-AC1
        input: "A fixed fixture with a closed set of records: success meeting the evidence contract; insufficient_evidence from too few records, a partial window, or stale data; no_data; unavailable; withheld; not_configured; not_attempted; and error; all mapped to one fixed critical profile."
        expected_result: "Every record status is in the closed set; success is assigned only when the evidence contract is met; insufficient_evidence is never treated as success; component, requirement, coverage, and critical-gap outputs match the decision table exactly; mismatches = 0."
        verification: "Unit test with a table-driven fixture and an expected component/requirement/coverage/gap table; assert every status and aggregate."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-03-AC2
        input: "A fixed fixture with multiple logical queries: two tools served by Yahoo Finance, one by SEC EDGAR, one by FRED, one fallback chain, and repeated/parallel variants of the same component."
        expected_result: "Exactly one executed availability_record exists per data_query_key; component_missing records are separate and have no data_query_key; each executed record carries one or more supports links and each component_missing record carries exactly one; source is the provider identity, not the tool, category, URL, or endpoint; ordered attempts, http_request_count, tried and serving sources, fallback_used, and provenance are correct; aggregation to component, requirement, category, and run follows the supports mapping; mismatches = 0."
        verification: "Unit and integration test with instrumented mock vendors; assert record identity, source identity, and each aggregation level."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-03-AC3
        input: "Four fixed runs: stock with a current-date analysis date; stock with a historical analysis date; crypto with a current-date analysis date; stock with the news and social analysts disabled. A fifth run uses an explicit profile override."
        expected_result: "The run_clock fixes as_of_date, now_utc, timezone, clock_source, analysis_mode, and mode_source; mode is not recomputed from a later today. The effective critical profile equals the default table: market_price is mandatory in every profile and is fetched by the deterministic preflight; stock financial_statements is mandatory in every mode, independent of fundamentals-analyst selection, and is fetched by the deterministic preflight using the versioned annual-plus-latest-quarter as-filed contract; crypto has no financial_statements requirement; current-date stock and crypto add ticker_news when the news analyst is enabled; current-date social_sentiment when the social analyst is enabled uses sentiment_stocktwits and sentiment_reddit with at least one successful component, while sentiment_news is optional context; historical mode excludes live-only social_sentiment, prediction_markets, company_profile, and insider_transactions from the critical set; other disabled analyst capabilities are not required; the override is recorded with profile_source = override; profile_version and profile_source are present; mismatches = 0."
        verification: "Table-driven unit tests over asset type, mode, analyst selection, and override; assert the exact effective critical requirement IDs and flags."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-03-AC4
        input: "Fallback fixtures: primary fails and a same-contract fallback succeeds; fallback succeeds with fewer records or a different window; global news attempts to clear ticker news; an undated Yahoo statement attempts to clear an SEC financial statement."
        expected_result: "A same-contract fallback satisfies the requirement with fallback_used = true and no critical gap; a partial or different-contract fallback leaves the requirement degraded with gap_reason fallback_partial or insufficient_evidence; global news does not clear ticker news; undated Yahoo statements do not clear financial_statements; mismatches = 0."
        verification: "Unit tests with scripted fallback chains and per-component evidence contracts; assert requirement status, gap_reason, and provenance."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-03-AC5
        input: "A fixed profile with financial_statements (income, balance, cashflow; all required) and social_sentiment (sentiment_stocktwits and sentiment_reddit; at least one successful), with multiple records per component, repeated logical queries, and concurrent execution."
        expected_result: "Each component status follows its all, any, or min:N rule; requirement status is satisfied, degraded, or missing exactly as the decision table predicts; coverage_status matches; shuffling record order and running queries concurrently does not change any component, requirement, or run result; mismatches = 0."
        verification: "Table-driven unit and concurrency tests with shuffled and parallel record insertion; assert deterministic aggregation."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-03-AC6
        input: "Two fixtures: one with one critical gap and two non-critical gaps; one with every critical requirement satisfied but the same two non-critical gaps."
        expected_result: "The report contains a Data availability section listing every critical gap with requirement_id, capability, requirement_status, gap_reason, missing components, and provenance; non-critical gaps appear in a separate Data limitations section and never in critical_gaps; in the second fixture coverage_status = complete and the non-critical gaps are still visible; missing or hidden non-critical gaps = 0."
        verification: "Integration test; diff the report sections and assert critical_gaps and coverage_status."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-03-AC7
        input: "A fixed profile containing a critical capability that is never queried, plus a capability excluded from criticality that is queried and fails."
        expected_result: "The never-queried critical component produces exactly one component_missing_record with identity (run_id, requirement_id, capability, component), record_kind = component_missing, data_query_key = null, attempts = [], one supports link, status = not_attempted, and source = none; it produces a critical gap with gap_reason not_attempted and is excluded from query_executions, external_requests, retry_attempts, fallback_attempts, vendor_cache_hits, and run_cache_hits. The excluded capability is recorded as non-critical or not_required, appears in Data limitations if it failed, and does not appear in critical_gaps or change coverage_status; mismatches = 0."
        verification: "Integration test with mocked tool calls; assert synthetic records, criticality, gap membership, and coverage status."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-03-AC8
        input: "The same fixed business fixture replayed with shuffled query order, concurrent queries, warm and cold caches, and two report languages; report, manifest, safety-gate input, and memory are inspected as consumers."
        expected_result: "Business conclusions are identical: effective critical profile, component and requirement statuses, coverage_status, critical_gap_ids and gap_reasons, final rating and final decision under fixed replay, plus language-independent binding and summary fields. Execution metadata may differ and is reported separately: query execution order, attempt timestamps, cache hits, external/http request counts, retry/fallback counts, and latency. Rendered prose and report language are excluded from equality; business-conclusion mismatches = 0."
        verification: "Deterministic replay and concurrency test plus a consumer audit; compare business conclusions and language-independent summaries for equality, and report execution metadata separately."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-03-AC9
        input: "A fixture with one critical gap and a model-produced tradeable rating, where the report, manifest, safety gate, and memory are all produced."
        expected_result: "The final decision receives the same canonical data_availability state; the critical gap and coverage_status are identical in report, manifest, gate input, and memory; no consumer re-derives a different gap list; mismatches = 0. The gate's REVIEW consequence is verified by SB-01, not by this criterion."
        verification: "End-to-end integration test; capture the canonical state and assert every consumer's gap and coverage fields against it."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-03-AC10
        input: "Independent component fixtures for query_rule all with a non-empty query set, any with a non-empty set, min:N with N within range, all with an empty set, any with an empty set, min:N with N = 0, min:N with N greater than the query-set size, a valid profile whose required component has no query execution, and an invalid profile with a required component absent from the profile."
        expected_result: "For a non-empty query set, all requires every query success, any requires at least one success, and min:N requires at least N successes; an empty set with all or any is missing when required and not_required when optional. A valid profile with a required component that has no query execution produces exactly one component_missing_record with status not_attempted. An invalid profile with a missing required component, N = 0, or N greater than the query-set size produces invalid_critical_profile before analysis and blocks; it does not produce component_missing. The two cases are mutually exclusive and every case follows the complete aggregation table; mismatches = 0."
        verification: "Table-driven unit tests over query-set cardinality and thresholds; assert component, requirement, and coverage results for every case."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
    implementation_dependencies: [FR-01]
    constraint_relations: [SB-01, INV-01, FR-02]
    conflicts:
      - "Showing every gap makes reports longer. Resolution: a Data availability section for critical gaps and a separate Data limitations section for non-critical gaps."
      - "A configurable critical set can change the decision gate. Resolution: the effective profile is derived from fixed defaults, mandatory market_price, and recorded overrides."
      - "A completed vendor call can look successful while returning unusable data. Resolution: success requires the evidence contract; insufficient_evidence is a separate status."
      - "Fallback can silently substitute a weaker source. Resolution: a fallback clears a gap only under the same capability, window, point-in-time, and minimum-record contract."
      - "Multiple queries for one capability can disagree. Resolution: component, requirement, and run aggregation follow fixed all, any, min:N, and min_successful_components rules."
      - "Live-only data cannot be served point-in-time. Resolution: historical mode excludes live-only capabilities from the default critical set and reports them as limitations."
    assumptions:
      - "Effective critical profile defaults use profile_version d1-default-v1. analysis_mode is historical when the analysis date is before today (is_historical), otherwise current_date."
      - "market_price is mandatory for every run and cannot be removed by configuration. It requires one successful get_stock_data component with at least one record and the requested window."
      - "For stock only, financial_statements is critical in every mode, independent of fundamentals-analyst selection, because the trade decision requires fundamentals. The deterministic preflight owns the fetch when the analyst is disabled; crypto has no financial_statements requirement."
      - "The financial_statements evidence contract is versioned: each of income_statement, balance_sheet, and cashflow requires at least one annual period and the latest quarterly period known by as_of, with filing/availability date on or before as_of, point_in_time_rule = as_filed, window_rule = as_of_date, min_record_count = 1. A period without a filing date is insufficient_evidence. If either period is missing, the component is not satisfied."
      - "ticker_news is critical in current_date mode when the news analyst is enabled; it requires one successful get_news component with at least one record. The news analyst or the shared ticker-news prefetch owns the fetch. It is non-critical in historical mode because the feed cannot guarantee window coverage."
      - "social_sentiment is critical in current_date mode when the social analyst is enabled and requires sentiment_stocktwits and sentiment_reddit with min_successful_components = 1 and at least one record per successful component. sentiment_news is optional context and does not by itself satisfy social_sentiment. It is non-critical in historical mode."
      - "market_price and stock financial_statements are fetched by a deterministic preflight even when the corresponding analyst is disabled; ticker_news and social_sentiment are analyst-enabled capabilities."
      - "A component_missing_record is not a query_execution and does not increment query_executions, external_requests, retry_attempts, fallback_attempts, vendor_cache_hits, or run_cache_hits."
      - "macro_indicators, technical_indicators, global_news, company_profile, insider_transactions, and prediction_markets are non-critical by default. They may be made critical by an explicit recorded override."
      - "Explicit overrides may add or remove non-mandatory requirements; profile_source is set to override and profile_version is recorded. market_price and stock financial_statements remain mandatory."
      - "record_status is closed: success, insufficient_evidence, no_data, unavailable, withheld, not_configured, not_attempted, error. requirement_status is closed: satisfied, degraded, missing, not_required."
      - "gap_reason priority for a degraded or missing requirement is deterministic: not_attempted, not_configured, error, unavailable, no_data, withheld, insufficient_evidence, fallback_partial."
      - "A component with multiple logical queries uses all, any, or min:N as declared in the effective profile; repeated identical queries are collapsed by FR-01."
      - "The canonical state is computed once per run and sorted by requirement_id, capability, component, and data_query_key before aggregation and reporting."
      - "The run_clock is fixed at run start and records as_of_date, now_utc, timezone, clock_source, analysis_mode, and mode_source; resume/replay inherits it unless a clock_override is recorded."
      - "A component query set is the set of queries linked to that component by supports. all requires a non-empty set and all successes; any requires at least one success; min:N requires at least N successes. An empty set is missing when the component is required and not_required when optional; min:N with N = 0 or N greater than the set size is an invalid critical profile."
      - "http_request_count counts actual outbound HTTP requests per vendor attempt, including retries and redirects; cache hits and local not_configured/withheld short-circuits count 0. external_requests is the sum of http_request_count."
    notes: >
      FR-03 defines the canonical state, the closed status sets, the effective
      critical profile, fallback clearing, multi-query aggregation, and
      deterministic reporting. SB-01 defines the deterministic REVIEW consequence
      for a critical gap. INV-01 requires the same canonical state fields across
      report, manifest, final-state, and memory.

  - id: SB-01
    type: "safety"
    title: "Deterministic fail-closed final-output gate with a separated model proposal"
    priority: "must"
    status: "approved"
    stakeholders: [trader, reviewer, security_reviewer]
    source:
      origin: "Repository analysis and measured baseline"
      evidence:
        - path: "TradingAgents/tradingagents/agents/rating.py"
          locator: "L96-L117 parse_rating, run_rating, is_review"
          description: "The current rating path parses a rating and returns REVIEW only when no rating can be read; REVIEW is already a terminal sentinel outside the five-tier set."
          source_type: "code"
        - path: "TradingAgents/tradingagents/agents/managers/portfolio_manager.py"
          locator: "L80-L103 invoke_structured"
          description: "The Portfolio Manager produces the final structured decision and writes final_rating/final_trade_decision directly; no data-coverage gate is applied."
          source_type: "code"
        - path: "TradingAgents/tradingagents/graph/trading_graph.py"
          locator: "L358-L370 record_decision and L437-L465 _log_state"
          description: "The decision is persisted to the state log and memory before any coverage-aware code gate exists."
          source_type: "code"
        - path: "TradingAgents/cli/run.py"
          locator: "L310-L340 streaming display and L380-L385 review notice"
          description: "The CLI streams and displays the Portfolio Manager output before any formal gate, then only warns when a rating is unreadable."
          source_type: "code"
        - path: "TradingAgents/tradingagents/reporting.py"
          locator: "L20-L46 and L92-L119 write_report_tree"
          description: "Reports copy final_trade_decision and the rating header directly; there is no formal blocked-decision body."
          source_type: "code"
        - path: "TradingAgents/tradingagents/memory/log.py"
          locator: "L32-L60 store_decision"
          description: "The memory log stores the model decision and rating tag without a gate result or an explicitly separated unapproved proposal."
          source_type: "code"
        - path: "TradingAgents/tradingagents/backtest.py"
          locator: "L150-L170 propagate calls and L196-L207 scoring"
          description: "Backtest cells call propagate directly and score by rating; REVIEW is excluded from scoring rather than produced by a coverage gate."
          source_type: "code"
        - path: "baseline/runs/baseline-20261020-01/transcripts/final-status.json"
          locator: "final_rating and final_trade_decision"
          description: "The baseline persisted a Hold decision while news and social sources were unavailable; no gate recorded or blocked it."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/results/reports/NVDA_20261020_193209/5_portfolio/decision.md"
          locator: "entire file"
          description: "The saved formal decision is the model's Hold text, with no coverage/gate notice."
          source_type: "measured_baseline"
    problem: >
      The baseline could persist, display, and score a tradeable rating even when
      critical sources were unavailable. The model decision and the formal
      decision were the same text, so a critical-gap REVIEW changed only the
      rating and left the trade recommendation visible as the official
      conclusion. The gate input was not a trusted snapshot, incomplete or
      contradictory inputs had no defined handling, gate failure had no fallback,
      and the gate was not verified across all entry points.
    statement: >
      Every run MUST produce a formal decision through deterministic gate code
      from a trusted gate_input containing one immutable coverage_snapshot
      produced by the availability program and one model_proposal. The gate MUST
      treat the snapshot as authoritative; the model MUST NOT create, supply, or
      mutate coverage_status or critical_gaps. The gate MUST return a
      gate_result with status passed, blocked, or error and reason_codes from the
      closed gate_reason_code set. The formal decision MUST be approved only when
      coverage_status is complete, critical_gaps is empty, every critical
      requirement has an availability record, the critical profile is valid, the
      snapshot is current, and the model rating is one of the five legal
      ratings. formal_decision.status MUST be approved or blocked_for_review.
      A critical gap, a model REVIEW, coverage/gap contradiction,
      malformed or missing input, an invalid critical profile, a missing
      availability record, a stale or hash-mismatched snapshot, or a gate
      exception MUST block the formal decision. When blocked, final_rating MUST
      be REVIEW and the formal decision text MUST use the review_class matched to
      the primary reason and state that manual review is required; it MUST NOT
      mislabel a rating/system failure as missing data. The model_proposal MUST be
      retained separately with proposal_status = unapproved; it MUST NOT be
      presented as the formal conclusion. The gate MUST run before the terminal
      manifest and every formal output that contains a formal decision; the
      running startup manifest may be written before the gate with
      safety_gate.status = not_run. The independent failed-run manifest and a
      minimal secret-free security incident record are exceptions that may be
      written without completing the normal gate. Formal outputs MUST consume the same
      formal_decision and coverage_snapshot. Intermediate streaming, debug,
      staging, checkpoint, and raw-agent outputs MAY show the model proposal only
      when marked intermediate or not approved. The blocked formal text MUST be
      selected by review_class so a rating anomaly or system failure is not
      misdescribed as missing data. A gate failure MUST fail closed: status error, final
      rating REVIEW, a formal gate-unavailable review notice, a failed run
      record, and no tradeable output. All entry points MUST use the same gate
      path.
    acceptance_criteria:
      - id: SB-01-AC1
        input: "Five fixtures, one per legal model rating (Buy, Overweight, Hold, Underweight, Sell), each with a valid trusted coverage_snapshot that is partial and contains a critical gap; every model proposal is valid and its decision text contains a trade recommendation."
        expected_result: "For all five ratings, gate_result.status = blocked, reason_codes contains critical_gap, formal_decision.status = blocked_for_review, final_rating = REVIEW, and the formal decision text uses the data_insufficient review class and states that manual review is required. The model_proposal is retained with proposal_status = unapproved and is not presented as the formal conclusion. Non-REVIEW formal ratings = 0; report, manifest, final-state, and memory agree."
        verification: "Integration test over all five ratings; assert gate result, formal rating and text, proposal separation, and every formal consumer."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SB-01-AC2
        input: "Five fixtures, one per legal model rating (Buy, Overweight, Hold, Underweight, Sell), each with coverage_status = complete, an empty critical_gaps list, every critical requirement present, a valid profile, and a current snapshot."
        expected_result: "For all five ratings, gate_result.status = passed, formal_decision.status = approved, final_rating equals the model rating, no REVIEW is introduced, and formal decision_text is the approved model decision text. Rating changes = 0; report, manifest, final-state, and memory agree."
        verification: "Integration test over all five ratings; assert gate result, unchanged rating, approved formal text, and every formal consumer."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SB-01-AC3
        input: "A fixture with coverage_status = complete and an empty critical_gaps list, where the model proposal itself returns REVIEW and REVIEW text."
        expected_result: "Gate_result.status = blocked with reason_codes containing model_review; formal_decision.status = blocked_for_review; final_rating = REVIEW; the formal text is the deterministic review notice; REVIEW is not converted to Hold and is not treated as a passed five-tier rating; the model proposal is retained as REVIEW with proposal_status = unapproved; tradeable formal ratings = 0."
        verification: "Unit test for the model-REVIEW case plus integration through the formal consumers; assert gate status, final rating, text, and proposal status."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SB-01-AC4
        input: "Two independent fixtures: one with coverage_status = complete and a non-empty critical_gaps list; one with coverage_status = partial and an empty critical_gaps list."
        expected_result: "Both fixtures are blocked with reason_codes containing coverage_gap_mismatch; formal_decision.status = blocked_for_review; final_rating = REVIEW; the formal text uses the coverage-inconsistency review class, not a generic data-insufficient message; neither is passed or treated as a complete/partial five-tier decision; tradeable formal ratings = 0."
        verification: "Separate unit tests for each contradiction plus integration through the formal consumers; assert each case independently."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SB-01-AC5
        input: "A table of independent malformed-input fixtures: illegal coverage_status value; missing critical_gaps; critical_gaps of the wrong type; a critical requirement with no availability record; an invalid critical profile; a missing or invalid model rating; a missing gate_input."
        expected_result: "Each fixture is blocked or error with its distinct reason code (invalid_coverage_status, missing_gap_list, invalid_gap_type, missing_availability_record, invalid_critical_profile, invalid_model_rating, missing_gate_input), formal_decision.status = blocked_for_review, final_rating = REVIEW, and the formal text uses the review_class matched to that reason. No fixture produces a tradeable formal rating. Cases are tested separately; mismatches = 0."
        verification: "Table-driven unit tests for every malformed input plus integration through the formal consumers; assert each reason code independently."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SB-01-AC6
        input: "Fixtures where the model output attempts to supply or alter coverage_status and critical_gaps; a snapshot with a stale version; a snapshot with a mismatched hash; and a valid program-produced snapshot."
        expected_result: "Model-supplied coverage and gaps are ignored; the stale snapshot is blocked with reason_codes containing stale_coverage_snapshot; the hash mismatch is blocked with snapshot_hash_mismatch; the valid snapshot is accepted only from the program producer. The gate and formal report use the same snapshot_hash; mismatches = 0."
        verification: "Unit tests with forged model fields and tampered snapshots plus integration asserting the shared snapshot hash in gate output and formal report."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SB-01-AC7
        input: "A blocked run, with capture of streaming messages, debug output, staging files, CLI final summary, complete_report.md/html, 5_portfolio/decision.md, final-state, memory, manifest, and API return."
        expected_result: "Intermediate outputs may show the model proposal only as intermediate or unapproved. Formal outputs use formal_decision; the blocked model proposal appears only in a separate Model Proposal (not approved) section or field. No formal output presents the model trade recommendation as the final conclusion; mismatches = 0."
        verification: "Consumer audit and integration test over every formal output path; assert labels, formal fields, and absence of an unapproved trade conclusion in formal text."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SB-01-AC8
        input: "An entry-point matrix with a critical gap: CLI run_analysis, programmatic TradingAgentsGraph.propagate, a backtest cell, a checkpoint-resumed run, and a headless/API run."
        expected_result: "Every entry point invokes the same deterministic gate and produces final_rating = REVIEW, a blocked gate_result, and the same formal review notice. No entry point bypasses the gate; bypass count = 0."
        verification: "Entry-point integration matrix; assert gate invocation, formal result, and manifest safety_gate presence for each path."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SB-01-AC9
        input: "Fault-injection fixtures where the gate raises an exception, times out, cannot parse the snapshot, has a gate/profile version mismatch, or hits an internal error."
        expected_result: "Gate_result.status = error with reason_codes containing gate_internal_error; formal_decision.status = blocked_for_review; final_rating = REVIEW; formal_decision.review_class = gate_system_error and the formal text states that the gate is unavailable and manual review is required; the manifest records run_status = failed with error.stage = gate; tradeable formal outputs = 0; silent pass = 0."
        verification: "Fault-injection integration test for each failure mode; assert error propagation, failed run record, review notice, and absence of tradeable output."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SB-01-AC10
        input: "One passed run and one blocked run, with manifest, report, final-state, memory, and API return captured."
        expected_result: "Manifest safety_gate status, reason_codes, primary_reason_code, coverage_status, critical_gap_ids, profile_version, snapshot_hash, gate_version, input_hash, and run_id match the gate_input snapshot and model_proposal; formal_decision.review_class matches the reason-code mapping; final_rating matches the formal status; and the formal review notice or approved model text matches the gate outcome. Missing or mismatched fields = 0."
        verification: "Integration test; compare every gate field with the snapshot, formal decision, and all formal consumers."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
    implementation_dependencies: [FR-03, FR-02]
    constraint_relations: [INV-01]
    conflicts:
      - "REVIEW reduces actionable output. Resolution: REVIEW is an explicit terminal safe state, not a hidden Hold."
      - "Preserving the model proposal helps audit but risks being read as the conclusion. Resolution: retain it only as model_proposal with proposal_status = unapproved and a separate report section."
      - "The model can write coverage claims. Resolution: only the program-produced coverage_snapshot is authoritative; model claims are ignored."
      - "A gate failure can stop a completed analysis. Resolution: fail closed with REVIEW, a gate-unavailable notice, and a failed run record."
      - "Intermediate streaming is useful for observability. Resolution: intermediate outputs may show the proposal only when explicitly marked intermediate/unapproved; formal outputs use formal_decision."
      - "Different entry points could implement different gates. Resolution: one shared finalization path is required by AC8."
    assumptions:
      - "REVIEW is a terminal non-tradeable sentinel outside the five-tier rating set; it is not a sixth trading rating."
      - "coverage_status and critical_gaps come only from the FR-03 coverage_snapshot; the model cannot supply or mutate them."
      - "Gate status is closed: passed, blocked, error. formal_decision.status is closed: approved, blocked_for_review. model_proposal.proposal_status is unapproved."
      - "gate_reason_code is closed: critical_gap, coverage_gap_mismatch, invalid_coverage_status, missing_gap_list, invalid_gap_type, missing_availability_record, invalid_critical_profile, invalid_model_rating, model_review, missing_gate_input, stale_coverage_snapshot, snapshot_hash_mismatch, gate_internal_error."
      - "reason_codes are sorted by a fixed priority for determinism: gate_internal_error, missing_gate_input, invalid_critical_profile, stale_coverage_snapshot, snapshot_hash_mismatch, invalid_coverage_status, missing_gap_list, invalid_gap_type, missing_availability_record, coverage_gap_mismatch, invalid_model_rating, model_review, critical_gap."
      - "Formal outputs are CLI final summary, complete_report.md/html, 5_portfolio/decision.md, final-state, memory, manifest, API return, and backtest scoring. Intermediate outputs are streaming messages, debug output, staging files, checkpoint state, and raw agent text."
      - "When blocked, the formal decision text uses the review_class matched to the primary reason, states that manual review is required, and lists all reason codes and critical gaps; it contains no trade instruction as the formal conclusion."
      - "The gate runs before the terminal manifest and every formal output with a formal decision; the running startup manifest may precede the gate and uses safety_gate.status = not_run. The gate and formal report use the same coverage_snapshot."
      - "When multiple reasons occur, primary_reason_code is the first reason in the fixed priority list; review_class is derived from that primary reason. All reason_codes are retained and listed as secondary reasons, but they do not change the primary formal prompt. The mapping is: critical_gap or missing_availability_record -> data_insufficient; invalid_model_rating -> model_rating_invalid; model_review -> model_review; invalid_coverage_status or coverage_gap_mismatch -> coverage_inconsistent; missing_gap_list, invalid_gap_type, missing_gate_input, invalid_critical_profile -> input_invalid; stale_coverage_snapshot, snapshot_hash_mismatch, gate_internal_error -> gate_system_error; passed -> none."
      - "Gate failure is a handled failure: the manifest run_status is failed with error.stage = gate, and no tradeable output is produced."
    notes: >
      Decision table. complete + empty gaps + valid rating + valid profile + all
      critical records + current snapshot -> passed. complete + non-empty gaps ->
      blocked coverage_gap_mismatch. partial + empty gaps -> blocked
      coverage_gap_mismatch. partial + non-empty gaps -> blocked critical_gap.
      Invalid coverage -> invalid_coverage_status. Missing gaps -> missing_gap_list.
      Wrong gap type -> invalid_gap_type. Missing availability record ->
      missing_availability_record. Invalid profile -> invalid_critical_profile.
      Missing/invalid rating -> invalid_model_rating. Model REVIEW -> model_review.
      Missing gate input -> missing_gate_input. Stale/mismatched snapshot ->
      stale_coverage_snapshot or snapshot_hash_mismatch. Gate exception ->
      error/gate_internal_error. This gate is the deterministic boundary between
      the unapproved model proposal and every formal decision.

  - id: INV-01
    type: "invariant"
    title: "One bound formal result across report, manifest, final-state, and memory"
    priority: "must"
    status: "approved"
    stakeholders: [reviewer, trader, analyst]
    source:
      origin: "Repository analysis and measured baseline"
      evidence:
        - path: "TradingAgents/tradingagents/reporting.py"
          locator: "L92 write_report_tree"
          description: "Reports are written to a report tree, independent of the state log and memory log."
          source_type: "code"
        - path: "TradingAgents/tradingagents/graph/trading_graph.py"
          locator: "L437-L475 _log_state"
          description: "The full-state log is written separately from reports and memory and has no binding identity."
          source_type: "code"
        - path: "TradingAgents/tradingagents/memory/log.py"
          locator: "L32-L60 store_decision and later settlement"
          description: "The memory entry is written separately, then updated later with outcome and reflection; no run_id or record binding ties it to the other artifacts."
          source_type: "code"
        - path: "baseline/runs/baseline-20261020-01/report-consistency.json"
          locator: "all fields"
          description: "The baseline checked decision/report/full-state consistency but did not measure source-status consistency, identity binding, or memory agreement."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/memory/trading_memory.md"
          locator: "entry tag and DECISION block"
          description: "The baseline memory entry contains only trade date, ticker, rating, pending status, and prose; it has no run_id, record_version, decision digest, coverage, gaps, or gate result."
          source_type: "measured_baseline"
    problem: >
      The baseline wrote decision data to reports, a full-state log, and memory,
      but no identity bound them to one formal result and no invariant defined
      which fields each artifact must carry. Report and memory held different
      shapes from the manifest and final-state, source-status and fallback
      comparison granularity was undefined, and memory was later updated by
      settlement. Missing artifacts, partial writes, crash recovery, and retries
      had no consistency contract.
    statement: >
      INV-01 holds at the completed checkpoint and on every read of a completed
      run's formal artifacts, not while artifacts are incomplete. Report,
      manifest, final-state, and memory MUST bind to one formal result through
      artifact_binding: identical run_id, record_version, decision_digest,
      gate_status, formal_decision_status, final_rating, coverage_status,
      critical_gap_ids, and coverage_snapshot_hash; record_hash, when present,
      MUST also match. The artifact contract MUST be identical in requirement and
      different only in representation: manifest and final-state carry the full
      canonical availability records and full gate/formal-decision fields; report
      carries the binding block plus coverage, critical-gap, fallback, and gate
      summaries; memory carries the binding, formal rating, formal decision text
      or digest, coverage/gap summary, and provenance_digest. Source-status and
      fallback comparison MUST use the canonical availability-record identity,
      ordered attempts, evidence timestamps, and provenance_digest, not rendered
      prose. Legal fallback MUST be disclosed with fallback_used, primary
      failure, attempted_sources, and serving_source; silent substitution is
      forbidden. A missing or empty required artifact, partial write, crash
      before completion, or failed retry MUST fail the invariant and MUST NOT be
      claimed as completed. Retries MUST preserve run_id, record_version, and
      record_hash and MUST NOT create a duplicate memory decision entry. Memory
      binding MUST identify one immutable decision entry through memory_entry_binding,
      not a hash of the shared memory file. Settlement and reflection MAY append
      outcome fields, and policy-based rotation of resolved entries is legal;
      modifying or deleting a retained decision entry, or changing its binding
      fields, is illegal. Rotation that removes an entry MUST be recorded and
      treated as memory not_available, not as a binding mismatch.
    acceptance_criteria:
      - id: INV-01-AC1
        input: "A completed run with one success, one unavailable, one withheld, and one legal fallback source; capture the report binding block, manifest, final-state, and memory."
        expected_result: "Report, manifest, and final-state bind the current run: run_id, decision_id, record_version, decision_digest, gate_status, formal_decision_status, final_rating, coverage_status, critical_gap_ids, and coverage_snapshot_hash are exact across those three. Memory either carries the current binding or a valid reused_decision_ref with matching decision_id/decision_digest/entry_digest; for a reused historical entry, source run_id/snapshot fields are not required to equal the current run. Report/memory summaries equal derived values; mismatches = 0."
        verification: "Integration test; extract machine-readable bindings and summaries from every artifact and compare against the canonical manifest/final-state record."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: INV-01-AC2
        input: "The same completed fixture with different object key order, whitespace, line endings, report language, timestamps, and local absolute paths."
        expected_result: "Canonicalization produces identical bindings, decision_digest values, provenance_digest values, and summaries. Run-level generated_at/evaluated_at/finished_at and local paths are excluded; attempts and attempted_sources keep supplier attempt order; evidence timestamps in attempts and observed windows are preserved and compared; rendered report prose is not compared; false mismatches = 0. A semantic rewrite or an attempt-order change is still detected as a mismatch."
        verification: "Unit canonicalization test plus integration with reordered and reformatted artifacts, including reordered attempts and changed evidence timestamps; assert stable digests, preserved attempt order, and zero false mismatches."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: INV-01-AC3
        input: "A fixture with success, unavailable, withheld, not_configured, and a legal fallback; one provider serves multiple capabilities and multiple availability records exist."
        expected_result: "Availability-record identity is (run_id, record_kind, data_query_key, requirement_id, capability, component, source, status, reason_code, record_count, fallback_used, serving_source, attempted_sources). Executed records carry a data_query_key and ordered attempts; component_missing records carry no data_query_key and no attempts. The full record sets and provenance_digest are equal between manifest and final-state; report and memory fit their declared summaries exactly; mismatches = 0."
        verification: "Integration test; compare full records for manifest/final-state and derived summaries for report/memory, including provenance_digest and fallback labels."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: INV-01-AC4
        input: "A legal same-contract fallback, plus independent silent-substitution fixtures: primary failure omitted; fallback_used = false; serving source presented as the primary; fallback label omitted from report or memory."
        expected_result: "The legal fallback passes with fallback_used = true, primary failure present, attempted_sources and serving_source correct, and disclosure in report, manifest, final-state, and memory (current entry or historical reference). Each silent-substitution fixture fails the invariant with a non-zero mismatch; silent substitutions = 0."
        verification: "Integration tests for the legal fallback and each silent-substitution case separately; assert fallback provenance and failure."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: INV-01-AC5
        input: "A completed run with a formal decision text and rating."
        expected_result: "Report, manifest, and final-state share exact current-run run_id, decision_id, record_version, decision_digest, gate_status, formal_decision_status, final_rating, coverage_status, and critical_gap_ids. final_decision_text is exact between manifest and final-state after canonicalization. Memory is either current-binding-equal or carries a valid reused_decision_ref with the same decision_id, decision_digest, and entry_digest; its source run fields are not compared to the current run. Rendered prose is not used for equality; mismatches = 0."
        verification: "Integration test; compare exact binding fields and text only between manifest/final-state, and compare report/memory against the digest and required summary."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: INV-01-AC6
        input: "Independent negative fixtures in which one required artifact is deleted, empty, or missing a binding field: report, manifest, final-state, and memory."
        expected_result: "Each case fails the invariant, the run is not marked completed, formal success is not claimed, and the missing-artifact error is recorded. False passes = 0; there is no after-the-fix condition."
        verification: "Separate negative test for each artifact; assert non-zero invariant failure and no completed status."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: INV-01-AC7
        input: "Fault injection after each artifact write, followed by a retry that does not re-run the model and reuses the same run_id, record_version, and record_hash."
        expected_result: "Before completion the run is running, partial, or failed and the invariant is not claimed. No completed manifest exists while artifacts are incomplete. Retry completes with exactly one copy of each required artifact, the same binding identity, one memory decision entry with the same memory_entry_binding and entry_digest, and zero cross-artifact mismatches; duplicate or conflicting entries = 0."
        verification: "Crash/restart fault-injection test at each write point; assert publish state, idempotent retry, and final cross-artifact equality."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: INV-01-AC8
        input: "A completed run, followed by settlement/reflection, legal policy-based rotation of resolved entries, and an illegal deletion or modification of a retained decision entry."
        expected_result: "Settlement only appends outcome and reflection fields; memory_entry_binding, entry_digest, evidence_digest, and formal decision fields remain immutable and equal to the other artifacts. The memory artifact hash uses hash_scope = memory_entry, so appends, settlement, lock maintenance, and legal rotation do not invalidate it. Legal rotation removes only resolved entries under policy and records retention_status = rotated or not_available without a binding mismatch. Illegal deletion or modification of a retained decision entry is detected as a binding failure. The shared memory file hash is never used; mismatches = 0 for legal cases."
        verification: "Integration test across decision write, settlement, legal rotation, and illegal deletion/modification; assert memory_entry_binding immutability and the legal/illegal distinction."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: INV-01-AC9
        input: "A run lifecycle captured before completion, at the completed checkpoint, and on a later read; then one binding field is tampered after completion."
        expected_result: "The invariant is not claimed before completion, passes at completion and on a valid read, and detects the tampered binding on the next read, blocking formal exposure. False pass = 0; mismatches = 0 for valid artifacts."
        verification: "Lifecycle test plus read-time validation and tamper injection; assert checkpoint behavior and non-zero detection."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: INV-01-AC10
        input: "Four fixtures: a same-day rerun with the same trade_date/ticker and same decision_id/entry_digest; a same-day rerun with a different decision_id; a same-decision_id fixture with tampered entry_digest; a run with memory disabled."
        expected_result: "The same-binding rerun reuses the existing committed entry, sets memory.status = existing, commit_status = committed, same_day_rerun = true, and records reused_decision_ref; no duplicate is created. The different-decision rerun publishes its report/manifest/final-state independently and writes a pre-commit entry_version greater than the current highest committed version, with supersedes = previous decision_id; the terminal manifest records that version. The effective version is derived as the highest entry_version whose source terminal manifest is committed, so no post-commit write to the old entry is required. A failed new publication leaves a version gap but does not make the provisional version effective and does not remove the old effective version. entry_digest covers stable decision content only; evidence_digest may differ across reruns without blocking reuse. The same-decision_id tampered entry_digest is a conflict and does not overwrite the retained entry. With memory disabled, memory.status = disabled and commit_status = disabled; no memory artifact is required and the other three artifacts still satisfy INV-01. Mismatches = 0."
        verification: "Integration test across same-day rerun, versioned different decisions, tampered entry_digest conflict, and memory-disabled configurations; assert memory versions, supersession, deduplication, and required-artifact rules."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
    implementation_dependencies: [FR-02, SB-01]
    constraint_relations: [FR-01, FR-03, SR-01]
    conflicts:
      - "A short report conflicts with full provenance. Resolution: report carries a binding block plus declared summaries; manifest and final-state carry the full canonical records; report and memory are compared through binding and provenance_digest."
      - "The memory log stores prose and is updated later by settlement. Resolution: INV-01 binds only the immutable decision portion; settlement may append outcome/reflection, and rotation is recorded as not_available."
      - "A lean manifest may not carry every artifact's prose. Resolution: all artifacts share the canonical binding and digests, not rendered prose."
      - "Retries can duplicate memory. Resolution: retries reuse run_id, record_version, and record_hash and must keep one memory decision entry."
      - "Redaction can change compared strings. Resolution: all artifacts use the same sanitizer and compare sanitized canonical values."
    assumptions:
      - "The canonical artifact set is report, manifest, final-state, and memory; report and memory use declared summaries bound by decision_digest and provenance_digest."
      - "The report exposes a machine-readable binding block; memory exposes a binding tag or structured header; manifest and final-state expose binding fields directly."
      - "Canonicalization uses UTF-8, NFC, LF line endings, sorted keys, documented array ordering, and excludes run-level generated_at/evaluated_at/finished_at and local absolute paths. Attempt order and evidence timestamps are preserved."
      - "The full source-status comparison is between manifest and final-state; report and memory compare their declared summaries and provenance_digest against those derived values."
      - "publish_state is closed: running, staged, validated, completed, partial, failed. INV-01 is claimed only for completed."
      - "The invariant is checked before completion, on read, and after retry/resume."
      - "Memory binds through memory_entry_binding to one immutable decision entry; settlement/reflection is append-only; legal rotation of resolved entries is distinct from illegal deletion of a retained entry; rotation absence is recorded as memory not_available."
    notes: >
      This invariant chooses one contract: report, manifest, and final-state bind
      to the current run and the same decision/gate/coverage fields. Memory either
      binds to the current run or carries a valid reused_decision_ref to a
      historical decision; historical source run_id/snapshot fields are not
      compared to the current run. Manifest and final-state hold the full canonical
      record; report and memory hold binding plus declared summaries and
      provenance digest. Missing artifacts, partial writes, crashes, or failed
      retries never satisfy the invariant. It binds FR-01 provenance, FR-03
      coverage, FR-02 manifest, SB-01 formal decision, and SR-01 sanitization
      together.

  - id: SR-01
    type: "security"
    title: "Secret-safe run records with known-value and versioned pattern checks"
    priority: "must"
    status: "approved"
    stakeholders: [security_reviewer, operator, reviewer]
    source:
      origin: "Repository analysis and measured baseline"
      evidence:
        - path: "TradingAgents/tradingagents/dataflows/net.py"
          locator: "L6-L24 get_scrubbed"
          description: "Existing exact-value scrubber for FRED and Alpha Vantage request error URLs; it does not cover other record boundaries or pattern matches."
          source_type: "code"
        - path: "TradingAgents/tradingagents/dataflows/vendors/alpha_vantage/common.py"
          locator: "L95-L97 get_scrubbed call"
          description: "Existing API-key scrub path for Alpha Vantage request errors."
          source_type: "code"
        - path: "TradingAgents/tradingagents/graph/trading_graph.py"
          locator: "L255-L275 run_settings"
          description: "Existing allowlist for report settings; it excludes keys and endpoints but does not scan other writers."
          source_type: "code"
        - path: "TradingAgents/cli/prefs.py"
          locator: "L30-L58 save_last_run"
          description: "Preferences store backend_url and other selections directly, so inline userinfo, query tokens, or fragments can be persisted."
          source_type: "code"
        - path: "TradingAgents/cli/prompts.py"
          locator: "L731-L738 .env creation and chmod"
          description: "Existing .env creation already uses mode 0600; this is a preserved baseline control, not a new D1 acceptance item."
          source_type: "code"
        - path: "TradingAgents/tests/test_api_key_env.py"
          locator: "L168-L190 .env mode tests"
          description: "Existing tests already assert the 0600 .env mode."
          source_type: "code"
        - path: "baseline/runs/baseline-20261020-01/logs/stdout.log"
          locator: "entire file"
          description: "Reviewed baseline stdout; no API key value was observed, but this is not a complete scan."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/logs/stderr.log"
          locator: "file size"
          description: "Empty stderr; the baseline did not run a complete secret scan."
          source_type: "measured_baseline"
    problem: >
      Some provider request errors already replace one exact API key, and report
      settings are allowlisted, but no common detector covers the manifest,
      final-state, memory, report, logs, error records, preferences, or formal
      API return. Preferences can persist a full backend URL, which is needed to
      restore the next run but may contain inline userinfo or query credentials.
      Known-value checking and pattern checking were not separated, rules were
      not versioned, and a scan result was treated as proof that every possible
      credential was safe. There was also no behavior for scanner failure or an
      unredactable secret.
    statement: >
      SR-01 applies to app-controlled run records and formal outputs: run
      manifest, final-state, memory decision entry, report metadata and content,
      logs, preferences, error records, gate and availability reasons, and formal
      API return. Vendor/provider logs, shell history, OS/network captures, and
      external service logs are explicitly out of scope. Sensitive information
      MUST be checked in two separate ways: (1) exact match against secret_value
      values actually configured or used in the run, and (2) the versioned
      secret_pattern_rule set with a fixed minimum detection scope. A clean
      record requires zero known-secret exact matches and zero unredacted
      pattern matches; the result proves only the defined scope, rules, and
      fixtures, not the absence of unknown credential formats outside them.
      Audit/display endpoints MUST contain only scheme, host, and path.
      Preferences MAY keep an endpoint_restore_record with allowlisted
      non-sensitive query parameters and secret_ref names, but MUST NOT contain
      inline userinfo, sensitive query values, or fragments. If a user supplies
      inline sensitive components, the app MUST migrate them to .env or the
      process environment and store references, or omit them and set
      re_entry_required. Redaction MUST replace only the secret value, preserve
      keys, parameter names, structure, status, reason codes, counts, timings,
      source and vendor names, tickers, dates, model ids, and relative paths, and
      MUST avoid over-redaction. If a secret is found and cannot be removed, or
      the detector, sanitizer, or rule version is unavailable or fails, the run
      MUST fail closed: the dangerous content and the affected formal output MUST
      NOT be written. A separate minimal security incident record MAY be written
      only when it contains no secret value and is not a formal decision artifact;
      it records the security stage, rule version, failure type, and a sanitized
      reason. If the incident record cannot be written safely, nothing is
      written. The run is marked failed with a security-stage error. Every write
      MUST perform and record a per-write scan (write_scan_status); the terminal
      manifest MUST also record the final run-level scan (run_scan_status). A
      running manifest may have run_scan_status = not_run. A completed manifest
      requires clean or redacted write_scan_status and run_scan_status. Scan
      scope, rule version, and both scan results MUST be recorded whenever a safe
      record can be written.
    acceptance_criteria:
      - id: SR-01-AC1
        input: "A deterministic run fixture with a configured known API key, a mock provider that accepts the key and endpoint without a network dependency, and an endpoint containing userinfo, a sensitive query value, and a fragment; the run reaches the manifest, final-state, memory, report, log, and preference writers."
        expected_result: "Known secret values are collected and exact-match scanned at every in-scope writer. Scanning each of manifest, final-state, memory, report, logs, and preferences yields zero known-secret exact matches; manifest.security.known_secret_match_count = 0; the audit endpoint contains scheme, host, and path only; no case fails before reaching the record writers; mismatches = 0."
        verification: "Deterministic integration test with a mock provider and instrumented record writers; scan every output and assert the record path was reached."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SR-01-AC2
        input: "Fixtures for the fixed minimum pattern categories: provider key formats, generic bearer and JWT formats, URL userinfo, sensitive query parameter names and values, sensitive authorization headers, and password/token assignments; each printed with secret_rule_version and secret_rule_source."
        expected_result: "Every category is detected by the versioned rule set; each detected value is redacted or the record is blocked; unredacted pattern_match_count = 0; the recorded rule version and source match the rule set used; unknown rule version fails closed. Known-value and pattern checks are reported separately."
        verification: "Table-driven pattern-rule tests with positive and negative controls; assert the rule version, category coverage, redaction or block, and separate counters."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SR-01-AC3
        input: "A preference file written after a run with an endpoint containing userinfo, a sensitive query token, a non-sensitive allowlisted query parameter, and a fragment; and a second case where the sensitive parts cannot be migrated."
        expected_result: "The audit endpoint contains scheme, host, and path only. The restore endpoint keeps scheme, host, path, the non-sensitive allowlisted query parameter, and secret_ref names; it contains no inline userinfo, sensitive query value, or fragment. The secret_ref resolves from .env or the process environment. In the unmigratable case the sensitive parts are omitted and re_entry_required is set; inline sensitive values = 0."
        verification: "Unit test on the preference writer and resolver; assert audit/restore separation, ref resolution, and re-entry behavior."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SR-01-AC4
        input: "Fault injection in which a known secret remains after redaction, the detector or sanitizer raises, or the rule version is missing or unknown."
        expected_result: "The run fails closed: the dangerous content and affected formal output are not written; a separate minimal security incident record may be written with no secret value and only security stage, rule version, failure type, and sanitized reason; if the incident record cannot be written safely, nothing is written. Run status is failed with error.stage = security. known-secret leakage = 0; scanner failure treated as pass = 0."
        verification: "Fault-injection tests at each writer and sanitizer boundary; assert blocked dangerous output, the allowed minimal incident record, failed run status, and no secret in any record."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SR-01-AC5
        input: "A mixed fixture containing a real secret plus public URLs, ticker symbols, dates, model ids, vendor names, status codes, reason codes, counts, timings, and relative paths."
        expected_result: "Only the secret values are replaced; all non-secret values are byte-identical after canonicalization; no whole record, whole URL, or long non-secret string is removed. Over-redaction count = 0."
        verification: "Unit test comparing the redacted and unredacted canonical values; assert secret markers and preserved non-secret fields."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SR-01-AC6
        input: "A run that exercises every in-scope boundary, with a complete scan_scope record and a scan result; a control case with a boundary omitted."
        expected_result: "Every in-scope boundary is scanned and named in scan_scope; rule_version, per-write write_scan_status, and final run_scan_status are recorded; a running manifest may have run_scan_status = not_run, while a completed manifest requires both statuses clean or redacted; out-of-scope boundaries are named explicitly. The omitted-boundary control fails the check. The result states that it proves only the defined scope, rules, and fixtures, not all possible credentials; universal-safety claim = 0."
        verification: "Boundary-coverage audit plus a missing-boundary negative control; assert scope completeness, version recording, and the documented limitation."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SR-01-AC7
        input: "The existing get_scrubbed tests, the existing .env 0600 test, and the new in-scope writers."
        expected_result: "Existing get_scrubbed exact-value scrubbing and the existing .env 0600 behavior continue to pass as preserved controls. The new scan scope adds manifest, final-state, memory, report, logs, preferences, error/gate/availability records, and formal API return. The .env mode is not claimed as a new D1 acceptance item; regressions = 0."
        verification: "Regression suite for existing tests plus boundary inventory for the new scope."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
    implementation_dependencies: [FR-02, INV-01]
    constraint_relations: [FR-03, SB-01]
    conflicts:
      - "Redaction reduces debugging detail. Resolution: replace only secret values and preserve structure, status, reason codes, counts, timings, and public identifiers."
      - "The manifest must record configuration while excluding sensitive parameters. Resolution: use the sanitizer and a sanitized config allowlist."
      - "Preferences need the endpoint for the next run, while audit records must not carry secrets. Resolution: audit endpoint is scheme/host/path; restore endpoint keeps non-sensitive query parameters and secret_ref names, never inline sensitive values."
      - "A scanner can prove only its scope and rules. Resolution: record scope, rule version, counters, and the explicit limitation; do not claim universal credential absence."
      - "Redaction can damage diagnostics. Resolution: preserve non-secret structure and add over-redaction tests."
      - "Scanner failure could silently pass. Resolution: fail closed, block the record, and record a failed security stage."
    assumptions:
      - "Known secret values are collected from the run's configured credentials, URL userinfo, sensitive query values, and sensitive headers; they are held in memory only."
      - "secret_pattern_rule has a fixed minimum category set and is versioned with secret_rule_version, secret_rule_source, and effective_at."
      - "scan_scope is the closed app-controlled boundary set; external provider logs, shell history, OS/network captures, and service-side logs are out of scope."
      - "A clean result means zero known-secret exact matches and zero unredacted pattern matches within the defined scope and fixtures; it does not prove universal secret absence."
      - "The audit endpoint is scheme/host/path only; the restore endpoint may retain allowlisted non-sensitive query parameters and secret_ref names."
      - "Sensitive values are stored in .env or the process environment; .env mode 0600 is an existing control already tested in the baseline."
      - "Redaction replaces only values with a stable marker and preserves keys, structure, and non-secret identifiers."
      - "A detector/sanitizer failure or an unredactable secret fails closed with no record write and a security-stage run failure."
    notes: >
      The existing get_scrubbed path and the .env 0600 control are preserved, not
      re-claimed. D1 adds a two-part known-value and versioned-pattern check over
      the app-controlled record boundaries, a preference audit/restore split for
      endpoints, fail-closed behavior, and over-redaction tests. On failure, the
      dangerous content is blocked; a separate minimal secret-free security
      incident record is allowed and is not a formal decision artifact. The scan
      result is evidence for the defined scope and fixtures only.

conflict_resolutions:
  - id: C-01
    requirements: [FR-02, SR-01]
    description: "FR-02 needs a configuration record; SR-01 forbids sensitive URL parameters."
    resolution: "FR-02 records a sanitized configuration allowlist; SR-01 defines the sanitizer and the zero-match acceptance check."
  - id: C-02
    requirements: [FR-01, INV-01]
    description: "Caching can hide whether a value was reused, which can break provenance consistency."
    resolution: "The run cache stores terminal status, reason, vendor provenance, and vendor-cache-hit state; INV-01 binds the canonical provenance_digest and full records between manifest and final-state, with report and memory carrying the digest plus declared summaries."
  - id: C-03
    requirements: [FR-03, INV-01]
    description: "A user-facing gap summary can omit detail that another artifact retains."
    resolution: "Manifest and final-state contain the full canonical coverage and availability records; report and memory contain the binding, coverage/gap summary, and provenance_digest. INV-01 compares full records only between manifest and final-state and compares report/memory summaries against derived values."
  - id: C-04
    requirements: [FR-03, SB-01]
    description: "FR-03 exposes gaps; SB-01 converts a critical gap into REVIEW, which reduces actionable output."
    resolution: "SB-01 uses the same critical-gap definition as FR-03 and records the gate result; REVIEW is the explicit safe state."
  - id: C-05
    requirements: [FR-02, INV-01]
    description: "A lean manifest may not carry enough detail for the consistency invariant."
    resolution: "The manifest is the canonical machine-readable record. Report, manifest, and final-state carry the current artifact_binding; memory carries the current binding or a reused_decision_ref. Report and memory carry declared summaries and provenance_digest, while manifest and final-state carry the full records."
  - id: C-06
    requirements: [FR-01, FR-02]
    description: "Cache reuse reduces calls, while the manifest must still explain what was served."
    resolution: "The manifest records cache hits and source status; run-cache reuse and vendor-cache reads are distinguishable, and reused values keep their original provenance."
  - id: C-07
    requirements: [FR-02, FR-01, SB-01]
    description: "Recording and gating add work to a latency-sensitive run."
    resolution: "A bounded running manifest is written before model calls and atomically finalized after execution; the safety gate is deterministic and does not call a model. Startup, publish, and manifest-write overhead are measured separately."
  - id: C-08
    requirements: [SR-01, INV-01]
    description: "Redaction can change the exact strings compared across artifacts."
    resolution: "All artifacts use the same sanitizer; consistency checks compare sanitized canonical values and digests, not unsanitized raw text."

moscow:
  must:
    - FR-01
    - FR-02
    - FR-03
    - SB-01
    - INV-01
    - SR-01
  should: []
  could: []
  wont:
    - id: "StockTwits-alternative"
      reason: "The 403 root cause is unknown and no keyless replacement has been validated."
    - id: "SEC-point-in-time-profile"
      reason: "Current SEC classification fields are not proven to be historical vintages and could leak later information."
    - id: "parallel-risk-perspectives"
      reason: "It changes debate semantics and requires a separate quality A/B before adoption."
    - id: "LLM-replay-cache"
      reason: "It can mask data or model changes and is outside the approved D1 scope."
    - id: "full-exchange-calendar"
      reason: "It adds a new dependency; D1 does not require a calendar service."
    - id: "multi-user-encryption"
      reason: "The D1 deployment is a single-user local tool; the threat model is not approved."
  rationale: >
    All six approved requirements are Must for D1. The deferred items are
    excluded because they require new vendors, new historical-vintage work, a
    quality A/B, a new dependency, or a deployment model that D1 does not cover.

