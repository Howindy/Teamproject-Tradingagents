validation:
  status: passed
  machine_status: passed
  human_review_status: approved
  human_review_notes: The user explicitly authorized approval of the current D1 requirement design in this session, including
    the local CR-01 execution_status/acceptance_status semantics correction. This approval covers the 17 active requirements
    only; QR-02 remains deferred. No application implementation, application test, live model/vendor/broker evaluation, measured
    performance/cost/quality result, provisional threshold approval, external GR-01 reference, or omitted human business decision
    is asserted.
  schema: docs/req/req-schema.json
  script: docs/req/validate_requirements.py
  command: python3 -m pip install pyyaml jsonschema && python3 docs/req/validate_requirements.py
  result_record: docs/req/validation-results.json
  tool: Python pyyaml + jsonschema Draft 2020-12 and custom Python checks
  checks:
  - id: schema_compile
    result: pass
    details: req-schema.json declares draft 2020-12 and compiles; fit_criterion, sources, tradeoff, and structured non-functional
      fields are validated.
  - id: schema_validation
    result: pass
    details: requirements.yaml version 1.25.0 was loaded as YAML and validated against req-schema.json.
  - id: scope_status_consistency
    result: pass
    details: scope.approved_ids lists the 17 active requirements; scope.draft_ids is empty; scope.deferred_ids lists QR-02;
      every requirement status matches exactly one list.
  - id: requirement_count
    result: pass
    details: '18 requirements: 8 functional, 3 invariant, 2 performance (1 active, 1 deferred), 1 cost, 1 governance, 1 quality,
      2 security.'
  - id: fit_criterion_count
    result: pass
    details: 122 fit criteria (FR-01=9, FR-02=11, FR-03=10, FR-04=9, FR-05=3, FR-06=6, FR-07=10, FR-08=4, plus non-functional
      and deferred criteria); all IDs use <requirement-id>-FCnn; no FC added, removed, merged, split, or renumbered in v1.25.0;
      the only content change is the authorized CR-01 state-table correction; the complete mapping is in docs/req/requirement-mapping.csv.
  - id: traceability_paths
    result: pass
    details: All requirement, traceability, and source evidence paths resolve.
  - id: brief_contract_v4
    result: pass
    details: Contract v4 is the active revision draft; v3, v2, and v1 are retained. It fixes the two-field execution/acceptance
      state table, forbids pending/aborted acceptance values, treats run_completed as auxiliary, and preserves FR-02 field-level
      usage, selected/shared generation, five-role input difference, total-sum aggregation, and unapproved null prices/thresholds.
      The contract remains blocked.
  - id: behavior_contract_v2
    result: pass
    details: Behavior contract v2 is the active revision draft; v1 remains frozen. It fixes the two-rater merge, third-reviewer
      adjudication, dimension weights, off-on direction, one original sample per case/condition, retry retention, percentage-point
      REVIEW rate, safety hard checks, and separate cache/risk-policy comparisons. It remains blocked pending snapshots and
      human approval.
  - id: spec_consistency
    result: pass
    details: CR-01 now uses execution_status and acceptance_status as separate authorities with the fixed six-row state table;
      PR/GR/QR/SB/INV/SR consistency and deferred scope are preserved; FR-01 FC01-FC09, FR-02 timing/token coverage, FR-04 canonical
      policy, FR-05 limit-offset/history proof, FR-06 failed_precommit recovery, FR-07 fiscal/price/n-a/recovery, and FR-08
      token budget/resolver/terminal rejection remain unchanged.
  - id: threshold_ref_resolution
    result: pass
    details: CR-01 threshold refs resolve to contract v4; net_cost_max and quality_loss_max are null/unresolved and are not
      treated as approved numeric targets.
  - id: gr01_freeze_fixture
    result: pass
    details: Stage A passes without an implementation record; missing/incomplete material fails; independent scripts are allowed;
      implementation-generated expected values fail; issuer/calendar/coverage negatives fail; Stage B handles initial timing,
      reviewed post-implementation revision, unreviewed revision, version mismatch, retrospective freeze, and backdated records.
