validation:
  status: "passed"
  machine_status: "passed"
  human_review_status: "pending"
  human_review_notes: "Machine checks passed for version 1.14.1; human approval of the revised requirements, the draft portfolio-risk and archive/recovery requirements, the policy snapshot, the provisional risk thresholds, and the provisional QR-02 recovery target remains pending."
  schema: "docs/req/req-schema.json"
  script: "docs/req/validate_requirements.py"
  command: "python3 -m pip install pyyaml jsonschema && python3 docs/req/validate_requirements.py"
  result_record: "docs/req/validation-results.json"
  tool: "Python pyyaml + jsonschema Draft 2020-12 and custom Python checks"
  checks:
    - id: "schema_compile"
      result: "pass"
      details: "req-schema.json declares draft 2020-12 and compiles in a draft-2020-12 validator; date fields are enforced by ISO-date patterns."
    - id: "schema_validation"
      result: "pass"
      details: "requirements.yaml version 1.14.1 was loaded as YAML and validated against req-schema.json; result: valid."
    - id: "run_manifest_schema"
      result: "pass"
      details: "run-manifest-schema.json compiles under draft 2020-12; it carries artifact_binding, formal_decision, audit-only model_proposal, critical_profile, coverage_snapshot, provenance_digest, run_clock, inheritance record, memory entry binding, write/run security scans, full availability records with supports links and ordered attempts, an optional portfolio_risk result with policy_snapshot, input_ref, input_digest, diagnostic_ref, valuation_cutoff, closed risk reason codes, the portfolio_risk_limit review class, and portfolio_risk_evaluator_error gate reason, an optional report_section_manifest with renderer/capability/section digests and complete-report digest, an optional metric_evidence_bundle with structured facts, formula/fact/policy versions, metric block, input_digest, and result_digest, and completed-state constraints; it accepts representative running, completed, failed-gate, failed-startup, memory-disabled, risk-passed, risk-blocked, input-invalid, and evaluator-error manifests while rejecting completed records with not_run/error gates, failed security scans, pending formal decisions, cross-field contradictions, missing risk evidence, missing report_section_manifest, duplicate section paths, or missing report/final-state/memory-entry artifacts."
    - id: "availability_decision_table"
      result: "pass"
      details: "FR-03 defines closed record, requirement, and coverage status sets; per-component evidence contracts; deterministic component and requirement aggregation with empty-set and threshold rules; fallback clearing; effective critical profile defaults; component_missing records and supports links; and ten acceptance criteria."
    - id: "gate_decision_table"
      result: "pass"
      details: "SB-01 defines the trusted coverage snapshot, the formal decision body with reason-specific review classes, model-proposal separation, closed gate statuses and reason codes, the complete blocked-input decision table, fail-closed gate failure with error.stage = gate, formal/intermediate output boundaries, the risk branch, and twelve acceptance criteria."
    - id: "portfolio_risk_document_coverage"
      result: "pass"
      details: "Document coverage check only, not behavior verification. FR-04 text defines one applicability rule (stock Buy/Overweight always enters risk review; crypto and other non-stock or non-tradeable ratings may be not_applicable), new_long and add_long scope, exact amount/price/cash/currency/valuation consistency, the unique timezone-aware min(now_utc, end-of-day) valuation cutoff with future-date rejection, a locatable policy snapshot with actual thresholds, freshness window, precision rule, provisional approval boundary and policy_digest, input_ref, input_digest, and safe diagnostic_ref handling, current-run versus reused historical memory evidence, evaluator-error handling, and separate cache and risk-policy evaluations. INV-02 text defines zero unsafe approvals, pure-evaluator authority separation, cross-artifact current-run risk evidence, and unchanged INV-01 reuse/version rules with no blanket no-new-entry rule for risk-blocked reruns. The check confirms required case concepts are present for crypto Buy, missing and unsupported candidates, zero-position new_long, add_long, insufficient cash, historical cutoff, missing policy, dual over-limit, evaluator exception, and historical memory reuse, and that original FR-01 and FR-03 outcomes are required to remain unchanged; both requirements are draft and all acceptance criteria are unmeasured."
    - id: "risk_evidence_fixture"
      result: "pass"
      details: "Local fixtures under docs/req/fixtures recompute the stored input SHA-256, input_ref, policy_digest, timezone-aware valuation cutoff, projected concentration, stop distance, and policy comparison; they also exercise input-byte tampering, wrong-metric, policy-threshold, stop-distance, invalid-input diagnostic, and future-analysis-date rejection negatives. This is a requirement-evidence check, not an application test."
    - id: "archive_document_coverage"
      result: "pass"
      details: "Document coverage check only, not behavior verification. FR-05, FR-06, and QR-02 are draft and cover historical retrieval filters/intersection/order/limit-offset/pagination/revalidation, permanent publication_snapshot versus temporary recovery envelopes, verified_package history-reference closure, startup recovery snapshot contents/claim-fencing/retry/quarantine/no-model rules, the provisional 30-trial nearest-rank p95 workload, and correctness/model-free zero-tolerance. The check confirms that terminal manifest plus read-time INV-01 remains the sole commit condition in the requirement text."
    - id: "archive_static_fixture"
      result: "pass"
      details: "Static example check only. Local archive fixtures under docs/req/fixtures exercise history intersection/order/limit-offset/pagination/truncated/unknown/corrupt/malformed-filter logic and static recovery-status classification, duplicate labels, quarantine, single-success, history visibility, and the required snapshot-template field/reference/version checklist. It does not prove process concurrency, lease takeover/fencing, lost-lease rejection, or zero external calls; those require process-level concurrency and dependency-sentinel tests that were not executed."
    - id: "financial_metrics_document_coverage"
      result: "pass"
      details: "Document coverage check only, not behavior verification. FR-07 is draft and covers structured financial facts, period identity, filed-at visibility, restatement/ambiguity, unique formulas and precision, TTM revenue/EPS formulas, fiscal-year versus TTM P/E, zero denominators, negative EPS, non-positive growth bases, capex sign, data-access reuse, program-generated metric blocks, narrative-conflict disclosure, and independent reference requirements. NVDA expected values are bound to periods, formulas, and rounding."
