      locator: default_report_path; record_decision; save_reports
      description: API report export uses a second-resolution path. CLI/API final results pass through record_decision;
        archiving is not automatic there.
      source_type: code
    - path: TradingAgents/tradingagents/reporting.py
      locator: _SECTIONS; _report_parts; _header; write_report_tree
      description: A fixed section map renders into existing directories without a complete-bundle commit or recovery
        snapshot; headers use the current clock.
      source_type: code
  problem: Re-running analysis during recovery repeats costs and can produce a different report.
  statement: Recovery MUST use the saved report snapshot without invoking an LLM, external data provider, analysis
    graph, trading-memory write, settlement or reflection. It MUST retain the original run ID and snapshot hash
    and create at most one committed archive for that identity.
  acceptance_criteria:
  - id: INV-06-AC1
    input: Repeated recovery of a valid snapshot, including a crash immediately after directory commit.
    expected_result: Forbidden calls = 0; committed directories per run ID <= 1; snapshot identity unchanged.
    verification: 'T-RAR-05, T-RAR-07 and T-RAR-13: forbidden-call spies, actual process termination and repeated
      startup.'
    zero_tolerance: true
    measurement_status: not_measured
  metric: null
  dependencies: []
  conflicts:
  - Exclusive publication and validation consume I/O; zero violations takes precedence over throughput.
  assumptions:
  - One Windows host and an ordinary local NTFS archive root; no cloud synchronization or network share.
  - The source is a completed analysis result; report prose is untrusted data and never controls paths or commit
    state.
  notes: Specified behavior and acceptance targets; application implementation and benchmark results are not claimed.
moscow:
  must:
  - FR-03
  - QR-02
  - INV-03
  - INV-04
  - INV-05
  - INV-06
  should: []
  could: []
  wont:
  - Full-text indexing
  - Automatic pruning
  - Legacy migration
  - Multi-host storage
  tradeoff: Accept snapshot storage, serialized writes and integrity-check cost to obtain recoverability and immutable
    reports at the specified local workload.
conflict_resolutions:
- id: C-ARCH-01
  requirements:
  - FR-03
  - INV-03
  description: Repeated same-day reports need separate identity despite shared legacy paths.
  resolution: Use run IDs for canonical archive paths; retain ticker/date only as filterable metadata.
- id: C-ARCH-02
  requirements:
  - QR-02
  - INV-05
  description: Validation and lock acquisition consume recovery time.
  resolution: Include validation and locks in the timed workload; never drop correctness checks or failed samples
    to meet the target.
