      source_type: code
    - path: TradingAgents/tradingagents/reporting.py
      locator: _SECTIONS; _report_parts; _header; write_report_tree
      description: A fixed section map renders into existing directories without a complete-bundle commit or recovery
        snapshot; headers use the current clock.
      source_type: code
  problem: Files left in a reused report directory can appear to belong to a newer analysis.
  statement: Every archived section MUST derive from the same recovery snapshot and fixed section mapping. Every
    applicable non-empty section MUST be present with the declared byte size and digest, and files from another
    run MUST NOT be implicitly retained.
  acceptance_criteria:
  - id: INV-04-AC1
    input: Runs with disjoint report fields and planted stale section content.
    expected_result: Foreign/stale sections = 0; missing declared sections = 0; size/digest mismatches in successful
      retrieval = 0.
    verification: 'T-RAR-04 and T-RAR-14: exact section and complete-report assertions plus corrupted file fixtures.'
    zero_tolerance: true
    measurement_status: not_measured
  metric: null
  dependencies: []
  conflicts:
  - Exclusive publication and validation consume I/O; zero violations takes precedence over throughput.
  assumptions:
  - One Windows host and an ordinary local NTFS archive root; no cloud synchronization or network share.
  - The source is a completed analysis result; report prose is untrusted data and never controls paths or commit
    state.
  notes: Specified behavior and acceptance targets; application implementation and benchmark results are not claimed.
- id: INV-05
  type: invariant
  title: Truthful archive completion status
  priority: must
  status: draft
  stakeholders:
  - analyst
  - operator
  source:
    origin: Static inspection of main at 2c8996e0e7aec5d6550a52d386cccba32f86ac94
    evidence:
    - path: TradingAgents/cli/run.py
      locator: _run_directory; save_report_section_decorator; run_analysis
