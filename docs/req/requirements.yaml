scope:
  approved_ids:
  - FR-03
  - FR-04
  - SB-01
  - INV-01
  - FR-10
  draft_ids: []
  deferred_ids:
  - SR-01
  - FR-01
  - FR-02
  - FR-05
  - SR-02
  - FR-06
  - FR-07
  - PR-01
  - CR-01
  in_scope:
  - 'Deferred FR-01: run-scoped reuse of identical supported get_news queries reached by the analyst ticker-news tool path
    and the sentiment-news prefetch path.'
  - 'Deferred future scope only; not current acceptance. FR-02: a native, auxiliary per-analysis JSON run manifest
    for the CLI analysis entry and TradingAgentsGraph.propagate(); creation or update is attempted, persistence
    success is best-effort, and failure only warns.'
  - 'FR-03: a run-scoped data-availability summary for the fixed 15 call-path positions over 14 methods, including
    the seven analyst-gated stock necessity items and the last-completed-result rule.'
  - 'FR-04: deterministic projected-concentration and stop-distance checks for a caller-supplied single-stock purchase/add-long
    scenario, with configurable classroom thresholds and visible outcomes.'
  - 'Deferred future scope only; not current acceptance. FR-05: minimal programmatic history lookup over FR-02 completed
    manifests and saved merged Markdown reports, with ticker/analysis_date filters and bad-record isolation.'
  - 'Deferred FR-06: single-process completion of a requested complete_report.md from saved text, without model,
    data, graph, renderer, manifest, history, or memory repair; not part of current active acceptance.'
  - 'Deferred FR-07: analyst-generated three-part short summaries for five downstream roles, generated in the same
    report call, with a configurable Unicode-character limit, full-report fallback, and no separate summary call;
    not part of current active acceptance.'
  - 'Deferred PR-01: separate 20-sample measurements of complete manifest creation and update operation durations,
    with nearest-rank p95 and thresholds undetermined until after measurement; not part of current active acceptance.'
  - 'Deferred CR-01: a fixed three-scenario OFF/ON comparison of whole-analysis model usage and estimated cost with
    analyst briefs; unit prices are supplied before any future cost calculation, and a cost target is determined
    only after measurement; not part of current active acceptance.'
  - 'SB-01: one deterministic check over the current FR-03 summary, applicable FR-04 result, and model rating, forming
    the final rating before the CLI or propagate() result is returned, displayed, or saved.'
  - 'INV-01: consistent use of the SB-01 post-check final rating and formal conclusion in outputs actually produced
    in the run, without atomic multi-file commit, immutability, retention, recovery, or read-time revalidation.'
  - 'Deferred SR-01: limited credential protection in the listed configuration, endpoint-preference, and request-error display
    paths; known values are omitted or replaced with a fixed marker.'
  - 'Deferred future scope only; not current acceptance. SR-02: basic confinement of FR-02''s automatic manifest
    path and FR-05''s history-report read path under the configured results root, including existing symlink-escape
    rejection.'
  - 'FR-10: deterministic selection, Decimal/exact calculation, explicit n/a reasons, period/source provenance,
    and first-call fundamentals-analyst prompt injection for ten disclosed financial metrics; retains existing financial
    tools and leaves shared downstream summaries on the personal branch.'
  out_of_scope:
  - Replacing StockTwits with another social vendor; the 403 root cause is not established.
  - A point-in-time company profile sourced from SEC filings; current filing fields are not proven to be historical
    vintages.
  - Parallel Bull/Bear or risk-analyst execution; it changes debate semantics.
  - A full exchange calendar; D1 does not include a new calendar dependency.
  - Multi-user authentication, encryption at rest, and access control.
  - Portfolio simulation, order execution, position accounting, slippage, fees, and any guarantee of maximum realized
    loss.
  - Short, derivative, leveraged, multiple-order, and non-stock portfolio-risk policies; FX conversion between currencies.
  - Enabling TypeSafe Jev screening by default.
  - A production LLM response cache; replay caching remains outside D1.
  - 'Out-of-scope extensions not retained as deferred requirements: export packages, multi-worker recovery, the
    former recovery-performance target, graph resume redesign, legacy report migration, automatic retention cleanup,
    full-text indexing, a Web UI, multi-host/cloud storage, and power-loss guarantees.'
  - Expanding SR-02 to user-explicit out-of-root report save locations or to archive, recovery, quarantine, and
    cleanup paths.
  assumptions:
  - The system remains a single-user local tool for D1.
  - REVIEW is an acceptable terminal safe state for a run whose check does not pass; it is a non-tradeable sentinel,
    not a sixth five-tier rating.
  - FR-01 applies only to the explicitly listed get_news paths; existing vendor selection, fallback, retry, and
    vendor caches operate unchanged.
  - 'Future deferred assumption only: FR-02 attempts manifest creation and update, but persistence success is best-effort;
    a manifest failure only warns and does not affect analysis, model calls, return values, or the original error.'
  - FR-03 uses the fixed seven-item necessity list and each consumer's last completed result; adding an observation
    or refreshing a summary never starts a new query, refetch, retry, or model re-run.
  - FR-04 uses a caller-supplied structured single-stock purchase/add-long scenario and configurable classroom thresholds;
    it does not manage broker, account, cash, historical-valuation, or policy-approval decisions.
  - 0.30 and 0.05 are demonstration defaults, not approved financial policy; a passed check is not a guarantee of
    maximum loss or investment outcome.
  - SB-01 consumes the current FR-03 and applicable FR-04 results and does not recompute risk or treat a pass as
    trade authorization.
  - INV-01 compares only the post-check final result in outputs actually produced in the run and does not add an
    atomic commit, immutability, retention, or recovery guarantee.
  - 'Future deferred assumption only: FR-05 covers only reports registered by an FR-02 completed manifest and does
    not guarantee immutability or prevent later overwrite.'
  - SR-01 and SR-02 cover only their explicitly listed paths; they do not provide a general secret scanner or an
    all-operation path-protection system.
  - FR-01, SR-01, FR-02, FR-05, SR-02, FR-06, FR-07, PR-01 and CR-01 are deferred and do not block the five active requirements.
  - The repository analysis and baseline artifacts remain the authoritative source for observations in this document.
  - FR-10 operates on structured disclosed facts and completed daily prices using a date-level midnight America/New_York
    cutoff without TTM, FCF YoY, quarter-by-subtraction, or SB-01 formal-rating authority.
stakeholders:
- id: analyst
  name: Research analyst
  interest: Needs reports that distinguish available data from missing or unavailable data.
- id: trader
  name: Trader
  interest: Needs the final decision to fail safe when required data or an applicable risk check does not pass.
- id: reviewer
  name: Reviewer
  interest: Needs run records that connect a decision to the current run and its basic inputs.
- id: operator
  name: Operator
  interest: Needs reused supported queries, clear run records, and no known credential leakage in supported paths.
- id: security_reviewer
  name: Security reviewer
  interest: Needs limited credential and path protections in the explicitly supported paths.
definitions:
  data_query_key: 'The identity of one logical data query: the supported method name plus the effective business
    parameters that the supported method actually uses to affect its result. Ticker, date, window, and other fields
    participate only when applicable to that method. Defaults and positional or keyword binding follow the requirement
    bodies. FR-01 reuse remains limited to the listed get_news paths; FR-03 may apply the same basic identity principle
    to methods in its supported list without extending FR-01 reuse. This adds no versioned protocol, fuzzy semantic
    matching, or date inference.'
  logical_query: A data query identified by data_query_key for a method where the identity principle applies. Two
    callers with the same key in one run are the same logical query, regardless of which analyst, tool, prefetch,
    or path issued it. FR-01 reuse still applies only to its listed get_news paths; this term does not claim reuse
    support for every path.
  query_execution: One run-scoped shared execution registered for a data_query_key. Later or concurrent callers
    reuse its result or its failure. This term does not add cancellation, deadline, retry, fallback, or budget rules.
  vendor_cache: An existing cross-run cache inside a vendor adapter. Vendor-cache behavior is unchanged; no hit
    counter or new cache policy is required.
  availability_record: 'The FR-03 observation for one completed query: method, call-path position, object, request
    parameters, reliably known source, status, reason, and this run''s observation order. A necessary item with
    no completed result follows FR-03; a query still in progress is not described as never called, and no execution
    record is fabricated. This record adds no supports contracts, HTTP ledgers, or evidence contract.'
  source: The reliable known provider identity for a query result, such as Yahoo Finance, SEC EDGAR, FRED, StockTwits,
    or Reddit. When the source is not reliably known, it may be null.
  record_status: 'Closed set: available, no_data, unavailable, withheld. available uses each method''s explicit
    basic success condition and does not claim content truth, complete financial periods, or news sufficiency. no_data
    means no data was returned. unavailable means no usable data was obtained because of missing configuration,
    an unavailable source, or an execution error; it may be a normal returned unavailable indication and does not
    require the whole call to have failed. withheld means existing point-in-time rules withheld the data.'
  missing_necessity_item: An applicable stock necessity item gated by the enabled analysts that has no matching
    available result, including a completed no_data, unavailable, or withheld result, or no completed result yet.
    Only the no-completed-result case uses not_attempted with the FR-03 explanation; a completed but unsuccessful
    item keeps its actual status and reason and is not rewritten as not_attempted.
  basic_completeness: 'The FR-03 summary state: complete, incomplete, or not_applicable. complete means applicable
    necessity items exist and all match an available result. incomplete means at least one applicable necessity
    item has no available result. not_applicable means there is no applicable necessity item or the asset is outside
    this version''s stock list. No empty-set truth, quorum, or profile is added.'
  run_id: Deferred FR-02/FR-05 terminology only; no current implementation obligation. The identifier for one analysis
    invocation. It is unique per invocation and safe as one path component. It is an FR-02 auxiliary record key,
    not a formal publication or commit identity.
  run_manifest: Deferred FR-02/FR-05 terminology only; no current implementation obligation. The native, auxiliary
    JSON record at <results_dir>/<run_id>/run_manifest.json. It records identity, lifecycle status, timezone-aware
    timing, basic configuration, LLM and tool call counts, token totals when usage is complete for every counted
    call, references to produced files, and a safe error summary. Creation or update is attempted; persistence success
    is best-effort and failure only warns. It is not a commit, publication, or recovery authority.
  history_query: 'Deferred FR-02/FR-05 terminology only; no current implementation obligation. The FR-05 programmatic
    list/get lookup over FR-02 completed manifests and saved merged Markdown reports: list_runs with ticker and
    analysis_date filters, and get_report by run_id. It does not add pagination, hashing, immutability validation,
    or complete-artifact verification.'
  model_proposal: The original model rating and text, retained separately. It is not an independent trade authorization.
    When SB-01 passes, the final result may use its rating and conclusion; the proposal cannot bypass the check
    and be treated as the final result directly.
  gate_result: 'The SB-01 check outcome: status passed, blocked, or error, plus a short safe reason list. It does
    not add a review-class system, reason-priority protocol, snapshot binding, or run-status coupling.'
  formal_decision: 'The final result formed by SB-01: final_rating and final_trade_decision. On a pass it keeps
    the model rating and conclusion; on blocked or error it is REVIEW with a program-generated manual-review notice.'
  safety_gate: The deterministic SB-01 check that consumes the current analysis's FR-03 availability summary, applicable
    FR-04 result, and model rating. It does not call a model or data source, recompute risk, or manage publication,
    memory, history, or recovery.
  portfolio_risk_input: The caller-supplied single-stock purchase/add-long scenario for FR-04, including the instrument,
    portfolio value, current position value, proposed buy value, entry price, stop-loss price, and one currency
    label. It is the minimal input for the two deterministic checks; broker, account, cash, historical valuation,
    and policy-approval management are not added.
  candidate_trade: 'The FR-04 candidate: a stock Buy or Overweight purchase/add-long for one instrument. The simplified
    scope does not add short, derivative, leveraged, multiple-order, non-stock, or FX handling.'
  portfolio_risk_result: 'FR-04 evaluator output: status; safely displayable input; projected concentration and
    stop distance; the threshold actually used; and a short reason. When calculation is not possible, fields follow
    FR-04 and may be null. It adds no output field, separate evidence store, policy digest, or artifact binding.'
  secret_value: A credential value actually configured or used by the run, such as an API key, access token, password,
    client secret, or URL userinfo password. Known values are matched exactly. This applies to the SR-01 supported
    configuration, preference, and error-diagnostic paths; it does not imply scanning of all text outputs.
  redaction_policy: 'In the SR-01 supported paths: a configuration field matching a known value is omitted; a supported
    error diagnostic replaces the known value with a fixed marker such as ***; an unsafe endpoint preference is
    not remembered at all; and a handling failure omits the field or uses a fixed safe message. This adds no unknown-secret
    detection, encoding recognition, or global cleanup.'
  endpoint_preference: The saved CLI endpoint used to prefill a later run. An endpoint containing userinfo, a query,
    a fragment, a known credential, or an unparseable form is never saved or restored; the preference item is omitted
    and must be re-entered. The rule adds no secret_ref, credential resolver, migration, or encryption.
  zero_tolerance: A pass requires exactly zero violations. A single violation fails the fit criterion; there is
    no percentage allowance.
  recovery_material: 'For deferred FR-06: the saved complete_report.md text plus the basic task fields needed to
    finish that save. Recovery uses no model, data, graph, or renderer call, does not repair a manifest or history,
    and does not cover sections, HTML, or concurrent recovery.'
  downstream_brief: 'For deferred FR-07: three-part analyst summaries generated in the same report call for the
    five downstream debate roles, under a configurable Unicode-character limit, with full-report fallback and direct
    inclusion of the FR-03 program availability summary. No token budget, resolver, digest, or dual state machine
    is retained.'
  brief_evaluation: 'For deferred CR-01: a fixed three-scenario OFF/ON comparison of whole-analysis model usage
    and estimated cost with analyst briefs. It includes real retries, fallbacks, and failed calls, uses unit prices
    supplied before cost calculation, and determines a cost target only after measurement. It adds no token-budget,
    quality-loss, or contract-approval rules.'
  financial_evaluation_clock: Date-level FR-10 cutoff fixed at 00:00 America/New_York on the analysis date; same-day
    filings or uncompleted daily sessions without explicit time evidence are excluded rather than assumed available.
  financial_metric_bundle: Deterministic JSON-projectable bundle of ten FR-10 metric rows (revenue_yoy_q, revenue_yoy_a,
    revenue_qoq, gross_margin, operating_margin, net_margin, current_ratio, liabilities_to_assets, fcf_reported_span,
    pe_fy), each carrying status, Decimal/display value, explicit n/a reason, period, unit, and input/source provenance.
  financial_metrics_evaluation: Fixed trusted semantic evaluation configuration and four-case benchmark (FM-S01..FM-S04)
    assessing fundamentals-analyst reports against independent expected metric values, periods, sources, and n/a
    rules.
