  notes: 96,221 / 46,743 - 1 = +105.9% against 2025-07-27. The stated +68.6% equals 96,221 / 57,006 -
    1, the 2025-10-26 quarter mislabeled as Q2 FY2026. The value was repeated by both researchers and
    the final decision.
  target: 105.9
  target_status: approved
