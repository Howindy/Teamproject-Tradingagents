  - id: FR-10-FC10
    input: Disabled configuration, fundamentals omitted, unsupported issuer/asset, and provider failure scenarios.
    expected_result: Opt-in only; disabled or fundamentals-omitted runs make zero metric fetches and keep exact
      prior behavior; unsupported issuer/asset and provider failure degrade explicitly without inventing metrics,
      aborting valid baseline analysis, or altering CLI/propagate return shapes.
    verification: Opt-out, omitted-analyst, unsupported-issuer, and provider-failure tests in PR 2.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  tradeoff: Prioritize deterministic, source-preserving calculation over directly reported fiscal periods with explicit
    n/a degradation rather than broad coverage via TTM synthesis, Q4 subtraction, or model math. Accept that unsupported
    issuers, missing XBRL concepts, or incomplete same-day price/filing cutoffs surface as explicit n/a or unavailable
