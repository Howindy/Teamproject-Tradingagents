schema_version: "1.0"

document:
  id: "D1-REQ"
  title: "D1 Requirements: Data Availability, Reuse, Safety Gate, and Audit Records"
  version: "1.0.0"
  status: "approved"
  date: "2026-10-27"
  language: "en"
  description: >
    This document defines the approved D1 requirements for the TradingAgents
    baseline. It records the product narrative, the unified requirement
    registry, traceability to the repository and baseline, MoSCoW decisions,
    conflict resolutions, assumptions, open questions, and validation state.
    Only the six requirements in scope.approved_ids are part of D1.
  baseline_ref: "baseline/runs/baseline-20261020-01"

scope:
  approved_ids:
    - PR-01
    - QR-01
    - FR-02
    - SB-01
    - INV-02
    - SR-02
  in_scope:
    - "Run-scoped reuse of identical data queries and suppression of duplicate external requests."
    - "A lean run manifest with run identity, sanitized configuration, data-source status, call counts, token usage, duration, and safety-gate results."
    - "One run-scoped data-availability state and user-visible reporting of critical gaps."
    - "A deterministic pre-persistence safety gate that returns REVIEW when a configured critical gap exists."
    - "Consistent source status, fallback provenance, final rating, and final decision across reports, manifest, persisted state, and memory."
    - "No credentials or sensitive URL parameters in run records."
  out_of_scope:
    - "Replacing StockTwits with another social vendor; the 403 root cause is not yet established."
    - "A point-in-time company profile sourced from SEC filings; the current filing fields are not proven to be historical vintages."
    - "Parallel Bull/Bear or risk-analyst execution; it changes debate semantics and requires a separate A/B evaluation."
    - "A full exchange calendar; the approved D1 scope does not include a new calendar dependency."
    - "Multi-user authentication, encryption at rest, and access control."
    - "Portfolio simulation, order execution, and position accounting."
    - "Enabling TypeSafe Jev screening by default."
    - "A production LLM response cache; replay caching remains outside D1."
  assumptions:
    - "The system remains a single-user local tool for D1."
    - "The critical-source set is configuration, not a hard-coded vendor list."
    - "REVIEW is an acceptable terminal state for a run with critical data gaps."
    - "The per-run cache is isolated between concurrent runs."
    - "The manifest is written after the analysis completes and does not block the model calls."
    - "The repository analysis and the baseline artifacts are the authoritative source for this document."

stakeholders:
  - id: analyst
    name: "Research analyst"
    interest: "Needs reports that distinguish retrieved evidence from missing or fallback evidence."
  - id: trader
    name: "Trader"
    interest: "Needs a final decision that is safe when critical data is absent."
  - id: reviewer
    name: "Reviewer"
    interest: "Needs reproducible records that connect a decision to its sources and configuration."
  - id: operator
    name: "Operator"
    interest: "Needs bounded duplicate requests, clear run records, and no credential leakage."
  - id: security_reviewer
    name: "Security reviewer"
    interest: "Needs deterministic output checks and safe handling of external text and secrets."

definitions:
  data_query_key: >
    A stable tuple of the vendor method, normalized arguments, analysis date,
    and requested data window. Two requests with the same key are considered the
    same query within one run.
  critical_gap: >
    A configured critical source whose status is unavailable, not_configured, or
    withheld for the current run, or whose fallback is also unavailable.
  coverage_status: >
    Either complete or partial. complete means every configured critical source
    has status success. partial means at least one configured critical source has
    a critical gap.
  safety_gate: >
    Deterministic code that validates the final rating, the coverage status, and
    the critical-gap list before the final decision is persisted, displayed, or
    written to memory. The model cannot override the gate result.
  zero_tolerance: >
    A pass requires exactly zero violations. A single violation fails the
    acceptance criterion; there is no percentage allowance.
  run_manifest: >
    A machine-readable JSON record for one run, containing run identity,
    sanitized configuration, source status, call counts, token usage, duration,
    safety-gate result, and provenance references.
  sensitive_url_parameter: >
    A URL userinfo component, query parameter, or fragment that can carry a
    credential, token, password, or API key. Sensitive parameters are excluded
    from all records.

