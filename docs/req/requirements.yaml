requirements:
  - id: FR-01
    type: "functional"
    title: "Single execution per identical logical data query within a run"
    priority: "Must"
    status: "draft"
    stakeholders: [analyst, trader, operator]
    sources:
      origin: "Repository analysis and measured baseline"
      evidence:
        - path: "TradingAgents/tradingagents/dataflows/router.py"
          locator: "L200 route_to_vendor"
          description: "Central data-tool dispatcher; no run-scoped query cache or single-flight guard is present."
          source_type: "code"
        - path: "TradingAgents/tradingagents/agents/analysts/sentiment_analyst.py"
          locator: "L66 get_news.func and L69 jev_screen"
          description: "Sentiment prefetch invokes data functions directly, so its ticker-news query does not pass through an analyst tool call."
          source_type: "code"
        - path: "TradingAgents/tradingagents/graph/setup.py"
          locator: "L157-L166 parallel analyst edges"
          description: "Analysts run concurrently, so identical logical queries can overlap in time."
          source_type: "code"
        - path: "TradingAgents/tradingagents/dataflows/vendors/yahoo/ohlcv.py"
          locator: "L146-L207 load_ohlcv cache"
          description: "The existing OHLCV vendor cache is cross-run and must remain distinct from the new run cache."
          source_type: "code"
        - path: "TradingAgents/tradingagents/dataflows/vendors/sec_edgar.py"
          locator: "L122-L132 _cached_json"
          description: "SEC EDGAR also has a cross-run vendor cache with its own TTL."
          source_type: "code"
        - path: "baseline/runs/baseline-20261020-01/transcripts/tool-events-clean.jsonl"
          locator: "seq 21 and seq 68 get_news rows"
          description: "Two news-analyst tool calls use the same ticker-news arguments within one run."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/transcripts/prefetch-events.jsonl"
          locator: "sentiment_news row"
          description: "A third ticker-news attempt with the same window is made by the sentiment prefetch."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/data-availability.csv"
          locator: "FRED, ticker-news, and prediction-market rows"
          description: "The six FRED rows are distinct indicators and the two prediction-market rows are distinct topics; both sets failed locally without an external request."
          source_type: "measured_baseline"
    problem: >
      The baseline made three logical ticker-news queries with the same key: one
      sentiment prefetch and two news-analyst tool calls. The six FRED rows and
      two prediction-market rows were distinct logical queries that failed
      locally because the source was not configured or withheld for the
      historical date, so they did not produce duplicate external requests.
      Repeating the logical work consumes tool rounds and model context, and the
      existing vendor caches make an external-request count an unreliable
      acceptance target.
    statement: >-
      Within one run, the system MUST start at most one query_execution per logical_query. The first query_execution MUST own the retries and vendor fallback chain for that logical query; retries and fallbacks MUST be bounded by separate configured budgets and MUST NOT start another query_execution. Concurrent callers for the same key MUST join the same in-flight execution. When the execution policy reaches a terminal outcome, whether success, no_data, withheld, not_configured, or unavailable/error after the budgets allow no further attempt, that outcome MUST be cached and reused for the remainder of the run with the same status, reason, and provenance. The run cache MUST NOT be shared across runs. Verified checkpoint evidence inheritance under a recorded lineage is a separate recovery mechanism, tagged origin_run_id/inherited and counted in separate inherited counters; it is not ordinary run-cache reuse. Existing vendor caches MAY be shared across runs under their existing TTLs; a vendor-cache hit is a property of one query_execution and MUST be recorded separately from external requests. A data_query_key is defined by full request semantics; the same endpoint alone is not equivalent. Canonically equivalent parameters share a key; non-equivalent parameters do not. Retry is a per-vendor attempt after the first; fallback counts vendor switches, not total attempts. Budgets are checked before another attempt. The run cache is a run-scoped snapshot and does not refresh within the run; checkpoint inheritance uses only the existing retained mechanism and adds no resume capability.
    fit_criterion:
      - id: FR-01-AC1
        input: "An offline fixture in which three callers submit the same data_query_key sequentially within one run, including one prefetch caller and one tool-call caller; the mock vendor chain succeeds on its first invocation. Equivalent parameter aliases share a key; different window, indicator, date, frequency, or vendor selector do not."
        expected_result: "The logical query is executed exactly once; vendor invocation count = 1; all three callers receive the same payload and provenance; duplicate query_executions for that key = 0. Equivalent parameter aliases share one execution; non-equivalent parameters do not share. The prefetch and tool paths use the same run-scoped control and the same execution."
        verification: "Unit test with a mock vendor call counter and a shared run-scoped access service; assert vendor call count, payload equality, and query_execution_count = 1."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-01-AC2
        input: "An offline fixture in which N callers (N at least 3) submit the same data_query_key concurrently before the first execution completes; the mock vendor blocks until released."
        expected_result: "Exactly one query_execution is started; the other callers wait for and receive its result; vendor invocation count = 1; duplicate concurrent executions = 0. If the in-flight execution raises, times out, or is cancelled, all waiters are released with that terminal error/status and no waiter starts a duplicate execution."
        verification: "Concurrency test with a thread barrier and a blocking mock vendor; assert a single vendor call and identical results for every caller."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-01-AC3
        input: "Offline fixtures in which the first execution of a data_query_key reaches a terminal outcome under policy: success with no retry needed; no_data without retry; withheld without retry; not_configured without retry; insufficient_evidence under the policy; and unavailable/error only after the retry and fallback budgets allow no further attempt. Each fixture is followed by two later callers with the same key."
        expected_result: "Every terminal outcome is cached for the run, including success, no_data, withheld, and not_configured when the policy ends without retries. Later callers do not start a new query_execution; returned status and reason are identical; duplicate executions = 0. Cached payloads are immutable to callers; one caller's mutation cannot affect another consumer. insufficient_evidence is cached or fallback-eligible only as the execution policy specifies, and its terminal outcome is reused when the policy ends."
        verification: "Unit test with a mock vendor chain returning each terminal status; assert execution count, status and reason equality, and the recorded retry and fallback counters."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-01-AC4
        input: "Run A uses the data_query_key with an empty run cache and a cold vendor cache; Run B repeats the same key with its own empty run cache and the vendor cache warmed by Run A."
        expected_result: "Each run starts its own query_execution; cross-run run-cache reuse = 0. A warm vendor cache MAY satisfy the execution with external_request_count = 0 and vendor_cache_hit = true; that is not run-cache reuse. Vendor-cache hits and external requests are recorded separately."
        verification: "Integration test with two isolated run contexts; run once cold and once warm; assert two query_executions, zero run-cache reuse, and the expected vendor_cache_hit and external_request counters."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-01-AC5
        input: "An offline fixture in which the first vendor in the configured chain is rate-limited or unavailable and a later vendor succeeds; retry and fallback budgets are set to fixed small values. The table includes retry_budget 0/1 and fallback_budget 0/1 traces."
        expected_result: "Retry attempts stay within retry_budget and vendor fallbacks stay within fallback_budget; query_executions for the key = 1; retry_attempts, fallback_attempts, external_requests, and query_executions are separate counters. The first vendor attempt is not a retry. retry_budget is the number of additional attempts per vendor after its first attempt; fallback_budget is the number of vendor switches after the first vendor. Each attempt is checked against the budget before it is issued. Exhausting one vendor's retry budget does not prevent a legal fallback; success ends the execution immediately; only when no legal action remains is the outcome terminal. The terminal status and reason follow the execution policy and are not forced to unavailable."
        verification: "Unit test with a scripted mock vendor chain and explicit budgets; assert each counter and the terminal outcome."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-01-AC6
        input: "An offline fixture with a fixed model replay or stub and the same injected vendor responses is executed once with FR-01 enabled and once disabled; the FR-04 policy snapshot, risk input fixtures, and gate version are held fixed."
        expected_result: "The business conclusions are identical between the enabled and disabled runs: coverage_status, requirement_status, critical_gaps, final rating, and final decision under fixed replay. Execution metadata is expected to differ and is compared separately: query_executions, external_requests, vendor_cache_hits, run_cache_hits, retry_attempts, fallback_attempts, payload identity, and latency. Business-conclusion diff = 0; unsafe_output_escape_count = 0; critical-gap and gate REVIEW outcomes unchanged. Live model sampling is evaluated only in QR-01."
        verification: "Deterministic model replay or stub; compare the canonical business-conclusion fields for equality and report execution-metadata fields separately; assert no business-conclusion differences and zero unsafe escapes."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
    tradeoff: Prioritize one execution per logical query, exact provenance, and deterministic fixed-replay business equivalence. Vendor caches stay cross-run and are counted separately. Live quality and risk-policy comparison isolation are QR-01; no production LLM response cache and no token-reduction claim.
    implementation_dependencies: []
    constraint_relations:
      - INV-01
      - FR-07
      - QR-01
    conflicts:
      - "Data freshness: a cached success could hide an intra-run update. Resolution: the run cache is scoped to one run and the key includes the requested window and analysis date."
      - "Vendor caches already exist across runs, so an external-request count would misjudge normal behavior. Resolution: the run cache is per-run and never shared; vendor-cache hits are allowed, counted separately, and are not run-cache reuse."
      - "Cache metadata could change report output. Resolution: cache metadata is recorded in run records, not in the user-facing decision text."
      - "Retries and vendor fallbacks would look like duplicate queries. Resolution: they are bounded by separate budgets inside one query_execution and are counted separately."
      - "Concurrent callers could each start the query. Resolution: single-flight joins them to one in-flight execution."
    assumptions:
      - "A normalization function produces a stable data_query_key for method, asset type, normalized instrument or topic, analysis date, requested window or lookback, method-specific parameters, vendor selector digest, and cache_key_version."
      - "Arguments that resolve to the same vendor resource, such as indicator aliases, share one data_query_key."
      - "Retry and fallback budgets are configuration values with documented defaults."
      - "fallback_budget bounds vendor attempts within the configured chain; retry_budget bounds per-vendor retries; the two counters are independent."
      - "The run cache is isolated between concurrent runs; verified checkpoint evidence inheritance is allowed only under a recorded lineage and separate inherited counters; ordinary cross-run cache reuse is forbidden. Existing vendor caches remain cross-run and are recorded as vendor-cache hits."
      - "Terminal outcomes are cached when the execution policy reaches them; success, no_data, withheld, and not_configured may be terminal without retry, while unavailable/error is terminal only after the budgets allow no further attempt."
      - "Business-conclusion fields and execution-metadata fields are compared separately; cache and execution metadata are not required to match across cache-enabled and cache-disabled runs."
      - insufficient_evidence follows the same terminal/fallback policy and is cached as a terminal outcome when policy ends.
    notes: >-
      FR-01 limits logical query executions, not external HTTP requests. AC7 is merged into AC6, which keeps the deterministic fixed-replay conditions; live sampling and risk-policy comparison are QR-01. No performance, token, or cost effect is part of this requirement. No unmeasured tool-round, token, or cost reduction is claimed.
  - id: FR-02
    type: "functional"
    title: "Emit one lifecycle-complete run manifest"
    priority: "Must"
    status: "draft"
    stakeholders: [reviewer, operator, analyst]
    sources:
      origin: "Repository analysis and measured baseline"
      evidence:
        - path: "TradingAgents/cli/stats_handler.py"
          locator: "L9 StatsCallbackHandler"
          description: "The callback counts LLM calls, tool calls, and token usage but does not persist them, measure duration, or expose prefetch/reflection counts."
          source_type: "code"
        - path: "TradingAgents/cli/run.py"
          locator: "L135-L140 results directory and message_tool.log"
          description: "The CLI writes reports and a tool-call log but no machine-readable run manifest or lifecycle record."
          source_type: "code"
        - path: "TradingAgents/tradingagents/graph/trading_graph.py"
          locator: "L167-L181 propagate and L372-L401 _run_graph"
          description: "The graph lifecycle has a start and completion path but no startup or terminal manifest writer."
          source_type: "code"
        - path: "TradingAgents/tradingagents/graph/trading_graph.py"
          locator: "L255-L275 run_settings"
          description: "An allowlisted settings view exists and excludes keys, endpoints, and local paths."
          source_type: "code"
        - path: "TradingAgents/tradingagents/graph/trading_graph.py"
          locator: "L308-L335 _memory_step"
          description: "Settlement and reflection run during the analysis and can make LLM calls that must be attributed by the counters."
          source_type: "code"
        - path: "TradingAgents/tradingagents/memory/reflection.py"
          locator: "L63 invoke"
          description: "The Reflector uses the quick-thinking LLM, so reflection calls are observable by the same callback boundary."
          source_type: "code"
        - path: "baseline/runs/baseline-20261020-01/metrics.json"
          locator: "inner counters and llm_usage_missing"
          description: "The baseline metrics were collected by an external wrapper and include llm_calls, tool_calls, tokens, prefetch_event_count, retry_events, and llm_usage_missing."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/run-manifest.json"
          locator: "all fields"
          description: "The baseline manifest is an external collection artifact with a different shape; it has no run_status lifecycle, safety_gate_result, or artifact hashes."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/logs/stderr.log"
          locator: "file size"
          description: "The baseline stderr log is empty; vendor warnings were not visible without an external logging wrapper."
          source_type: "measured_baseline"
    problem: >
      The baseline produced reports and a tool-call log but no native,
      machine-readable run record. The run metrics and manifest were collected
      by an external wrapper, not by the product, and the external manifest does
      not record lifecycle state, a schema version, sanitized configuration,
      artifact hashes, or a terminal failure record. The callback counts also do
      not distinguish prefetch, reflection, retry, fallback, or missing token
      usage, and the baseline contract does not say which calls are included.
    statement: >-
      Each run invocation MUST create exactly one manifest at <results_dir>/<run_id>/run_manifest.json. The manifest MUST validate against docs/req/run-manifest-schema.json and MUST carry schema_version, run_id, parent_run_id, run_status, artifact_binding, formal_decision, critical_profile, coverage_snapshot, provenance_digest, safety-gate input_hash, run_clock, inheritance record, audit-only model_proposal, security scan results, memory entry binding, run identity, sanitized configuration allowlist, timing, call and token counters, full availability records with data_query_key, supports links, ordered attempts, and http_request_count, safety-gate result, and artifact hashes. The availability-record structure MUST be the same contract used by FR-03; manifest and final-state MUST be able to carry the full record set. completed requires a passed or blocked safety gate, clean or redacted per-write and run-level security scans with zero known-secret and unredacted pattern matches, a non-pending formal decision, and report, final-state, and memory-entry artifacts when memory is enabled. Before any model call, the system MUST atomically write a running manifest. On normal completion or a handled failure, it MUST atomically replace it with a completed or failed manifest when a safe terminal write is possible; if no terminal record can be written, it MUST retain the last valid running record and report the write failure to the caller. A run invocation has a unique run_id; a checkpoint resume is a new invocation with parent_run_id set to the interrupted run_id. If the process is forcibly terminated (SIGKILL, OOM, or power loss), only the last successfully written running manifest is guaranteed; no terminal manifest is guaranteed. The manifest MUST NOT contain credentials, endpoints, or local absolute paths. A committed publication's report tree and terminal manifest MUST NOT be overwritten. The team run_id is the publication identity; UUIDv4 is not required. The canonical publication path MUST be per-run and keyed by run_id; ticker and analysis_date are metadata and filters, not the overwrite identity. Retrying the same run_id with the same immutable content is a no-op; different content for an existing run_id is RUN_ID_CONFLICT. The existing programmatic propagate return shape remains (final_state, signal).
    fit_criterion:
      - id: FR-02-AC1
        input: "A complete analysis run using the approved D1 configuration; the graph and persistence succeed."
        expected_result: "Exactly one schema-valid manifest exists at <results_dir>/<run_id>/run_manifest.json; run_status = completed; run_id, ticker, analysis_date, and asset_type match the run context and the final-state run_id; duplicate manifests for the run_id = 0."
        verification: "Integration test; enumerate manifest files, validate the JSON against run-manifest-schema.json, and compare path and identity fields with the run context and final-state."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-02-AC2
        input: "A run in which the graph raises a handled exception after the running manifest is written, persistence fails after analysis completes, or the startup manifest write fails."
        expected_result: "When a safe terminal write succeeds, the same manifest path is atomically replaced with run_status = failed; error.stage, error.type, and sanitized error.message are present; known partial counts are retained; finished_at and timing fields are present when known; the manifest is schema-valid; duplicate manifests = 0. If the startup manifest write fails, no model call starts. If no terminal record can be written, the last valid running manifest remains and the caller receives an error; an unwritable store is not required to contain a failed file."
        verification: "Failure-injection integration test at analysis and persistence stages; assert the terminal record, error fields, timing, and schema validity."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-02-AC3
        input: "A run terminated by SIGKILL or an equivalent abrupt process stop after the running manifest is written and before completion."
        expected_result: "The last successfully written manifest remains run_status = running and schema-valid; no completed or failed manifest is required; no corrupt or partial file exists at the final manifest path; run_id and identity match the started run. No power-loss durability guarantee is inferred."
        verification: "Subprocess test that kills the process during analysis; read and validate the manifest path; assert running status, identity, and absence of corruption."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-02-AC4
        input: "Two run invocations in the same results directory, one of which is a checkpoint resume of an interrupted invocation."
        expected_result: "Each invocation has a unique run_id and exactly one manifest; the resume records parent_run_id and does not overwrite the interrupted run's manifest; the run_id in the manifest equals its directory name and the final-state run_id; duplicate, orphaned, or mismatched manifests = 0."
        verification: "Integration test with two run contexts and a resumed checkpoint; enumerate manifests and assert identity, path, parent linkage, and uniqueness."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-02-AC5
        input: "A completed manifest produced by a run."
        expected_result: "The manifest validates against run-manifest-schema.json; schema_version = 1.0; artifact_binding, formal_decision, audit-only model_proposal and proposal_digest, critical_profile, coverage_snapshot, provenance_digest, run_clock, inheritance record, security (write and run scans), memory entry binding, counts, tokens, timing, and data_source_status are present with the declared types, units, enums, and nullability; each data_source_status record carries data_query_key, supports links, ordered attempts with http_request_count, tried and serving sources, status, reason_code, record_count, and provenance; config contains only the allowlisted fields and no key, endpoint, or local path; validation errors = 0."
        verification: "Schema validation plus a sanitizer scan of config and artifact paths; compare required fields with the schema contract."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-02-AC6
        input: "A deterministic fixture with known LLM calls, including one structured-output retry and one reflection call; known tool calls, including one failed tool call; three prefetch data calls; one vendor retry; and one vendor fallback."
        expected_result: "Manifest llm_calls equals the fixture ground truth and the independent callback count; tool_calls excludes prefetch; prefetch_calls = 3; reflection_llm_calls is a counted subset of llm_calls; retry_attempts and fallback_attempts match the fixture and are not merged into llm_calls, tool_calls, or query_executions; mismatches = 0."
        verification: "Deterministic fixture with instrumented mock LLM and vendors; compare manifest counters against fixture ground truth and an independent event log, not only against the callback totals."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-02-AC7
        input: "Three fixtures: every LLM call reports usage; half report usage; no call reports usage. a zero-LLM-call fixture."
        expected_result: "tokens.status is complete, partial, and unavailable respectively; complete requires non-null input, output, and total tokens; partial stores the sum of known calls with correct with-usage and without-usage counts; unavailable stores null tokens and never synthetic zeros; llm_calls_with_usage + llm_calls_without_usage = llm_calls; mismatches = 0. Zero calls yields complete with zero tokens, not unavailable; partial usage records unknown calls without synthesizing zeros."
        verification: "Unit and integration tests with mock LLM responses that include, omit, or partially omit usage_metadata."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-02-AC9
        input: "A run in which the final manifest write fails (simulated ENOSPC or EACCES), or the manifest fails schema validation before publication."
        expected_result: "The run reports failure to its caller and does not claim completed; no incomplete or corrupt manifest is left at the final path; the last valid running manifest remains schema-valid; a retry can write a complete manifest; silent success = 0."
        verification: "Failure-injection test monkeypatching the atomic writer and schema validator; assert error propagation, final-path integrity, and retry success."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-02-AC10
        input: "Independent completed-status negative fixtures: safety_gate.status = not_run; safety_gate.status = error; security run scan = failed; known_secret_match_count > 0; artifact_binding.decision_digest = null; formal_decision.status = pending; report artifact missing; final-state artifact missing; memory-entry artifact missing when memory is enabled. Cross-field semantic contradictions: binding.gate_status differs from safety_gate.status; binding.formal_decision_status differs from formal_decision.status; binding.final_rating differs from formal_decision.final_rating; binding.critical_gap_ids differs from safety_gate.critical_gap_ids; binding.coverage_status differs from coverage_snapshot.coverage_status; binding.coverage_snapshot_hash differs from safety_gate.snapshot_hash; binding.run_id differs from run_id; coverage_snapshot.provenance_digest differs from provenance_digest; safety_gate.input_hash differs from the canonical gate-input hash over the snapshot hash, model proposal, optional portfolio-risk input digest, and gate version."
        expected_result: "Each fixture is rejected by the completed-state schema condition or the cross-field semantic completion check and cannot remain run_status = completed. No false completed record is accepted; mismatches = 0."
        verification: "Schema validation plus a semantic completed-record validator; assert rejection for every independent counterexample."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-02-AC11
        input: "An existing committed run resubmitted with identical immutable content, then with changed report content or a changed terminal manifest under the same run_id and decision identity."
        expected_result: "Identical resubmission is a no-op. Changed content returns RUN_ID_CONFLICT. Committed bytes and terminal manifest are never overwritten; duplicate committed publications per run_id = 0. The team run_id is preserved and UUIDv4 is not required. The immutable-content projection excludes volatile run timestamps, paths, and generated_at, and is recorded."
        verification: "Identity-conflict integration test with complete-directory and manifest digest comparison before and after resubmission."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: FR-02-AC15
        input: "Ten worker processes publishing 100 distinct runs for the same ticker, analysis date, and creation second, with disjoint report sections and recovery snapshots, followed by cleanup of completed pending snapshots. This is normal concurrent publication of distinct run_ids, not recovery concurrency."
        expected_result: "All 100 run_ids remain separately retrievable; overwritten committed files = 0; mixed-run or stale sections = 0; each committed publication has its own permanent formal records and report_section_manifest; recovery snapshots may be cleaned after commit without affecting history; duplicate publication per run_id = 0."
        verification: "Concurrent publication fixture with forced same-second paths, disjoint sections, cleanup, and post-cleanup retrieval; compare every retrieved report to its permanent formal record."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
    tradeoff: Prioritize lifecycle completeness, identity, counters, and truthful failure records. Publication commit, section manifests, and recovery snapshots are owned by INV-01, FR-05, and FR-06; no raw prompts or tool bodies are stored.
    implementation_dependencies: [FR-01, FR-03]
    constraint_relations:
      - SB-01
      - SR-01
      - INV-01
      - FR-04
      - INV-02
      - FR-05
      - FR-06
      - FR-07
      - FR-08
      - QR-02
      - PR-01
    conflicts:
      - "A detailed manifest conflicts with the lean D1 scope. Resolution: record counters, statuses, hashes, and the config allowlist, not full prompts or raw tool bodies."
      - "A startup record adds work before model calls. Resolution: keep the running record bounded and measure the write separately from the terminal record."
      - "A terminal record conflicts with forced termination. Resolution: guarantee only the last running record after SIGKILL, OOM, or power loss; handled failures write a failed record when a safe terminal write is possible; otherwise the last valid running record is retained and the caller receives an error."
      - "Callback totals prove transcription but not accuracy. Resolution: reconcile against fixture ground truth and an independent event log."
      - "Missing token usage can look like zero usage. Resolution: use complete, partial, and unavailable statuses with null values and usage-coverage counts."
      - "Writing after analysis hides end-to-end overhead. Resolution: measure analysis, publish, and manifest write separately, and compare enabled versus disabled end-to-end duration."
    assumptions:
      - "The manifest schema is versioned and stored at docs/req/run-manifest-schema.json."
      - "run_id is unique per run invocation and is safe as a path component; a resume uses a new invocation with parent_run_id."
      - "The manifest path is <results_dir>/<run_id>/run_manifest.json."
      - "llm_calls counts every model invocation observed by the run callback boundary, including structured-output retries, provider-level retries visible to the boundary, and reflection/settlement calls; reflection_llm_calls is a subset."
      - "tool_calls counts analyst tool callbacks, including failed tool calls; prefetch_calls counts direct data calls outside tool callbacks."
      - "retry_attempts and fallback_attempts are vendor-boundary counters and are not merged into llm_calls, tool_calls, or query_executions."
      - "A missing token usage value is stored as null with tokens.status partial or unavailable; zeros are never synthesized."
      - "Timing relation: duration_seconds = startup_manifest_write_seconds + analysis_seconds + publish_seconds. All three internal fields end at the pre-replace terminal write cut-off; the terminal atomic replace is excluded from the record self-reported duration. A separate external benchmark includes the replace. startup_manifest_write_seconds and manifest_write_seconds end before their respective replaces; analysis_seconds starts after the startup write; publish_seconds covers publication plus the terminal manifest write up to but excluding the terminal replace."
      - "Manifest publication uses schema validation and an atomic temp-file plus replace; a failed write is surfaced to the caller."
      - "Internal publish staging files are not additional run manifests; exactly one run manifest is exposed at the run path."
      - "Manifest retention is outside D1; the manifest is written to the run's results directory."
    notes: >-
      FR-02 is the run-record and lifecycle requirement. AC8 moved to PR-01; AC12 merged into FR-05; AC13 merged into INV-01; AC14 moved to FR-06. The external baseline manifest is evidence of the problem only; it does not satisfy this contract. The gate runs before the terminal manifest; terminal completion is evaluated after the gate, with no circular wait.
  - id: FR-03
    type: "functional"
    title: "Maintain one canonical data-availability state with a closed critical-gap decision table"
    priority: "Must"
    status: "draft"
    stakeholders: [analyst, trader, reviewer]
    sources:
      origin: "Repository analysis and measured baseline"
      evidence:
        - path: "TradingAgents/tradingagents/agents/state.py"
          locator: "AgentState"
          description: "The graph state has report fields and debate state but no unified data-availability field."
          source_type: "code"
        - path: "TradingAgents/tradingagents/dataflows/router.py"
          locator: "L200 route_to_vendor and L237-L295 fallback outcomes"
          description: "The router produces success, unavailable, not-configured, no-data, and fallback outcomes that are not accumulated into one state."
          source_type: "code"
        - path: "TradingAgents/tradingagents/dataflows/errors.py"
          locator: "L1-L55 vendor error taxonomy"
          description: "NoMarketDataError, VendorUnavailableError, and VendorNotConfiguredError are distinct behaviors; empty and stale data share one error type with only a free-text detail."
          source_type: "code"
        - path: "TradingAgents/tradingagents/dataflows/date_window.py"
          locator: "L67-L190 coverage_gap and withhold rules"
          description: "Coverage gaps, live-only withholding, and point-in-time rules are decided per call, not aggregated into a run state."
          source_type: "code"
        - path: "TradingAgents/tradingagents/agents/analysts/sentiment_analyst.py"
          locator: "L66-L76 prefetch calls"
          description: "The social analyst prefetches three sources directly; failures become placeholder strings with no structured status."
          source_type: "code"
        - path: "baseline/runs/baseline-20261020-01/data-availability.csv"
          locator: "all rows"
          description: "The baseline has 20 success, 4 withheld, 6 not_configured, and 4 unavailable rows; it has no per-requirement aggregation or effective critical profile."
          source_type: "measured_baseline"
    problem: >
      The baseline did not maintain one shared view of source availability.
      Different agents rediscovered the same gaps, the final decision did not
      receive a single canonical list of missing critical data, and the baseline
      CSV had no definition of the minimal record, source identity, success
      threshold, fallback clearing rule, effective critical set, or multi-query
      aggregation. A successful vendor call was not distinguished from data that
      actually satisfied the evidence contract.
    statement: >-
      Each run MUST compute one immutable effective critical profile from asset type, analysis mode, enabled capabilities, and explicit overrides, and MUST record it together with the fixed run_clock. It MUST maintain one canonical run-scoped data_availability state. The executed-query unit is one availability_record per logical query execution (the FR-01 data_query_key), with record_kind = executed. Its unique identity is (run_id, data_query_key); tool, category, capability, component, supports links, requested and observed window, source, status, reason_code, record_count, ordered attempts with http_request_count, fallback/provenance, and cache kind are attributes or relations, not additional identities. record_count counts evidence records meeting the component contract; annual plus quarterly composite requirements count each required period separately. A critical component with no query_execution MUST be modeled separately as one component_missing_record with record_kind = component_missing; it has no data_query_key or attempts and is excluded from execution counters. Record status MUST be one of success, insufficient_evidence, no_data, unavailable, withheld, not_configured, not_attempted, or error; success requires the evidence contract, not merely a completed call. Records MUST aggregate deterministically into component, requirement, category, and run status using the closed requirement statuses satisfied, degraded, missing, and not_required. coverage_status MUST be complete if and only if every critical requirement is satisfied, otherwise partial. critical_gaps MUST contain exactly the degraded or missing critical requirements with a closed gap_reason. A fallback clears a gap only when it meets the same capability, component, instrument, requested window, as-of date, point-in-time rule, minimum-record count, and provenance contract; otherwise the gap remains. Non-critical gaps MUST be recorded and shown as limitations without affecting coverage_status or critical_gaps. The report, manifest, safety gate, and final decision MUST consume the same canonical state. The state MUST be deterministic under query reordering, concurrency, cache variation, and report language. The profile is fixed at start, records are collected during execution, and the coverage snapshot is sealed before the decision; late results do not alter a used snapshot and no background recomputation is introduced. Planned queries, executed queries, and successful queries are distinct sets.
    fit_criterion:
      - id: FR-03-AC1
        input: "A fixed fixture with a closed set of records: success meeting the evidence contract; insufficient_evidence from too few records, a partial window, or stale data; no_data; unavailable; withheld; not_configured; not_attempted; and error; all mapped to one fixed critical profile."
        expected_result: "Every record status is in the closed set; success is assigned only when the evidence contract is met; insufficient_evidence is never treated as success; component, requirement, coverage, and critical-gap outputs match the decision table exactly; mismatches = 0. degraded/missing is decided by the requirement rule, not by any partial fallback."
        verification: "Unit test with a table-driven fixture and an expected component/requirement/coverage/gap table; assert every status and aggregate."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-03-AC2
        input: "A fixed fixture with multiple logical queries: two tools served by Yahoo Finance, one by SEC EDGAR, one by FRED, one fallback chain, and repeated/parallel variants of the same component."
        expected_result: "Exactly one executed availability_record exists per data_query_key; component_missing records are separate and have no data_query_key; each executed record carries one or more supports links and each component_missing record carries exactly one; source is the provider identity, not the tool, category, URL, or endpoint; ordered attempts, http_request_count, tried and serving sources, fallback_used, and provenance are correct; aggregation to component, requirement, category, and run follows the supports mapping; mismatches = 0. Only executed records count toward executed sets; planned-but-not-executed queries are separate."
        verification: "Unit and integration test with instrumented mock vendors; assert record identity, source identity, and each aggregation level."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-03-AC3
        input: "Four fixed runs: stock with a current-date analysis date; stock with a historical analysis date; crypto with a current-date analysis date; stock with the news and social analysts disabled. A fifth run uses an explicit profile override."
        expected_result: "The run_clock fixes as_of_date, now_utc, timezone, clock_source, analysis_mode, and mode_source; mode is not recomputed from a later today. The effective critical profile equals the default table: market_price is mandatory in every profile and is fetched by the deterministic preflight; stock financial_statements is mandatory in every mode, independent of fundamentals-analyst selection, and is fetched by the deterministic preflight using the versioned annual-plus-latest-quarter as-filed contract; crypto has no financial_statements requirement; current-date stock and crypto add ticker_news when the news analyst is enabled; current-date social_sentiment when the social analyst is enabled uses sentiment_stocktwits and sentiment_reddit with at least one successful component, while sentiment_news is optional context; historical mode excludes live-only social_sentiment, prediction_markets, company_profile, and insider_transactions from the critical set; other disabled analyst capabilities are not required; the override is recorded with profile_source = override; profile_version and profile_source are present; mismatches = 0. All today values come from the fixed run_clock."
        verification: "Table-driven unit tests over asset type, mode, analyst selection, and override; assert the exact effective critical requirement IDs and flags."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-03-AC4
        input: "Fallback fixtures: primary fails and a same-contract fallback succeeds; fallback succeeds with fewer records or a different window; global news attempts to clear ticker news; an undated Yahoo statement attempts to clear an SEC financial statement."
        expected_result: "A same-contract fallback satisfies the requirement with fallback_used = true and no critical gap; a partial or different-contract fallback does not clear the requirement, and its requirement status and gap_reason are determined only by the aggregation table (degraded, missing, or insufficient_evidence as applicable); global news does not clear ticker news; undated Yahoo statements do not clear financial_statements; mismatches = 0."
        verification: "Unit tests with scripted fallback chains and per-component evidence contracts; assert requirement status, gap_reason, and provenance."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-03-AC5
        input: "A fixed profile with financial_statements (income, balance, cashflow; all required) and social_sentiment (sentiment_stocktwits and sentiment_reddit; at least one successful), with multiple records per component, repeated logical queries, and concurrent execution."
        expected_result: "Each component status follows its all, any, or min:N rule; requirement status is satisfied, degraded, or missing exactly as the decision table predicts; coverage_status matches; shuffling record order and running queries concurrently does not change any component, requirement, or run result; mismatches = 0. The same evidence cannot be counted multiple times to satisfy min:N."
        verification: "Table-driven unit and concurrency tests with shuffled and parallel record insertion; assert deterministic aggregation."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-03-AC6
        input: "Two fixtures: one with one critical gap and two non-critical gaps; one with every critical requirement satisfied but the same two non-critical gaps."
        expected_result: "The report contains a Data availability section listing every critical gap with requirement_id, capability, requirement_status, gap_reason, missing components, and provenance; non-critical gaps appear in a separate Data limitations section and never in critical_gaps; in the second fixture coverage_status = complete and the non-critical gaps are still visible; missing or hidden non-critical gaps = 0."
        verification: "Integration test; diff the report sections and assert critical_gaps and coverage_status."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-03-AC7
        input: "A fixed profile containing a critical capability that is never queried, plus a capability excluded from criticality that is queried and fails."
        expected_result: "The never-queried critical component produces exactly one component_missing_record with identity (run_id, requirement_id, capability, component), record_kind = component_missing, data_query_key = null, attempts = [], one supports link, status = not_attempted, and source = none; it produces a critical gap with gap_reason not_attempted and is excluded from query_executions, external_requests, retry_attempts, fallback_attempts, vendor_cache_hits, and run_cache_hits. The excluded capability is recorded as non-critical or not_required, appears in Data limitations if it failed, and does not appear in critical_gaps or change coverage_status; mismatches = 0."
        verification: "Integration test with mocked tool calls; assert synthetic records, criticality, gap membership, and coverage status."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-03-AC8
        input: "The same fixed business fixture replayed with shuffled query order, concurrent queries, warm and cold caches, and two report languages; report, manifest, safety-gate input, and memory are inspected as consumers."
        expected_result: "Business conclusions are identical: effective critical profile, component and requirement statuses, coverage_status, critical_gap_ids and gap_reasons, final rating and final decision under fixed replay, plus language-independent binding and summary fields. Execution metadata may differ and is reported separately: query execution order, attempt timestamps, cache hits, external/http request counts, retry/fallback counts, and latency. Rendered prose and report language are excluded from equality; business-conclusion mismatches = 0. Cache determinism comparison requires evidence equivalence."
        verification: "Deterministic replay and concurrency test plus a consumer audit; compare business conclusions and language-independent summaries for equality, and report execution metadata separately."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-03-AC9
        input: "A fixture with one critical gap and a model-produced tradeable rating, where the report, manifest, safety gate, and memory are all produced."
        expected_result: "The final decision receives the same canonical data_availability state; the critical gap and coverage_status are identical in report, manifest, gate input, and memory; no consumer re-derives a different gap list; mismatches = 0. The gate's REVIEW consequence is verified by SB-01, not by this criterion. The primary gap reason is retained with secondary reasons."
        verification: "End-to-end integration test; capture the canonical state and assert every consumer's gap and coverage fields against it."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-03-AC10
        input: "Independent component fixtures for query_rule all with a non-empty query set, any with a non-empty set, min:N with N within range, all with an empty set, any with an empty set, min:N with N = 0, min:N with N greater than the query-set size, a valid profile whose required component has no query execution, and an invalid profile with a required component absent from the profile."
        expected_result: "For a non-empty query set, all requires every query success, any requires at least one success, and min:N requires at least N successes; an empty set with all or any is missing when required and not_required when optional. A valid profile with a required component that has no query execution produces exactly one component_missing_record with status not_attempted. An invalid profile with a missing required component, N = 0, or N greater than the query-set size produces invalid_critical_profile before analysis and blocks; it does not produce component_missing. The two cases are mutually exclusive and every case follows the complete aggregation table; mismatches = 0. Overrides cannot bypass mandatory market_price, stock financial_statements, historical visibility, or other safety conditions; optional queries do not change critical all/any/min:N rules. N greater than the actual executed count but within the declared query-set size is not a profile error; it yields degraded or missing by the table."
        verification: "Table-driven unit tests over query-set cardinality and thresholds; assert component, requirement, and coverage results for every case."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
    tradeoff: Prioritize one canonical availability state and deterministic aggregation. Critical and non-critical gaps are reported separately; live-only data is not treated as critical in historical mode. The profile is fixed at run start and not left to implementation discretion.
    implementation_dependencies: [FR-01]
    constraint_relations: [SB-01, INV-01, FR-02, FR-04, INV-02, FR-07, FR-08]
    conflicts:
      - "Showing every gap makes reports longer. Resolution: a Data availability section for critical gaps and a separate Data limitations section for non-critical gaps."
      - "A configurable critical set can change the decision gate. Resolution: the effective profile is derived from fixed defaults, mandatory market_price, and recorded overrides."
      - "A completed vendor call can look successful while returning unusable data. Resolution: success requires the evidence contract; insufficient_evidence is a separate status."
      - "Fallback can silently substitute a weaker source. Resolution: a fallback clears a gap only under the same capability, window, point-in-time, and minimum-record contract."
      - "Multiple queries for one capability can disagree. Resolution: component, requirement, and run aggregation follow fixed all, any, min:N, and min_successful_components rules."
      - "Live-only data cannot be served point-in-time. Resolution: historical mode excludes live-only capabilities from the default critical set and reports them as limitations."
    assumptions:
      - "Effective critical profile defaults use profile_version d1-default-v1. analysis_mode is historical when the analysis date is before today (is_historical), otherwise current_date."
      - "market_price is mandatory for every run and cannot be removed by configuration. It requires one successful get_stock_data component with at least one record and the requested window."
      - "For stock only, financial_statements is critical in every mode, independent of fundamentals-analyst selection, because the trade decision requires fundamentals. The deterministic preflight owns the fetch when the analyst is disabled; crypto has no financial_statements requirement."
      - "The financial_statements evidence contract is versioned: each of income_statement, balance_sheet, and cashflow requires at least one annual period and the latest quarterly period known by as_of, with filing/availability date on or before as_of, point_in_time_rule = as_filed, window_rule = as_of_date, min_record_count = 1. A period without a filing date is insufficient_evidence. If either period is missing, the component is not satisfied."
      - "ticker_news is critical in current_date mode when the news analyst is enabled; it requires one successful get_news component with at least one record. The news analyst or the shared ticker-news prefetch owns the fetch. It is non-critical in historical mode because the feed cannot guarantee window coverage."
      - "social_sentiment is critical in current_date mode when the social analyst is enabled and requires sentiment_stocktwits and sentiment_reddit with min_successful_components = 1 and at least one record per successful component. sentiment_news is optional context and does not by itself satisfy social_sentiment. It is non-critical in historical mode."
      - "market_price and stock financial_statements are fetched by a deterministic preflight even when the corresponding analyst is disabled; ticker_news and social_sentiment are analyst-enabled capabilities."
      - "A component_missing_record is not a query_execution and does not increment query_executions, external_requests, retry_attempts, fallback_attempts, vendor_cache_hits, or run_cache_hits."
      - "macro_indicators, technical_indicators, global_news, company_profile, insider_transactions, and prediction_markets are non-critical by default. They may be made critical by an explicit recorded override."
      - "Explicit overrides may add or remove non-mandatory requirements; profile_source is set to override and profile_version is recorded. market_price and stock financial_statements remain mandatory."
      - "record_status is closed: success, insufficient_evidence, no_data, unavailable, withheld, not_configured, not_attempted, error. requirement_status is closed: satisfied, degraded, missing, not_required."
      - "gap_reason priority for a degraded or missing requirement is deterministic: not_attempted, not_configured, error, unavailable, no_data, withheld, insufficient_evidence, fallback_partial."
      - "A component with multiple logical queries uses all, any, or min:N as declared in the effective profile; repeated identical queries are collapsed by FR-01."
      - "The canonical state is computed once per run and sorted by requirement_id, capability, component, and data_query_key before aggregation and reporting."
      - "The run_clock is fixed at run start and records as_of_date, now_utc, timezone, clock_source, analysis_mode, and mode_source; resume/replay inherits it unless a clock_override is recorded."
      - "A component query set is the set of queries linked to that component by supports. all requires a non-empty set and all successes; any requires at least one success; min:N requires at least N successes. An empty set is missing when the component is required and not_required when optional; min:N with N = 0 or N greater than the set size is an invalid critical profile."
      - "http_request_count counts actual outbound HTTP requests per vendor attempt, including retries and redirects; cache hits and local not_configured/withheld short-circuits count 0. external_requests is the sum of http_request_count."
    notes: >
      FR-03 defines the canonical state, the closed status sets, the effective
      critical profile, fallback clearing, multi-query aggregation, and
      deterministic reporting. SB-01 defines the deterministic REVIEW consequence
      for a critical gap. INV-01 requires the same canonical state fields across
      report, manifest, final-state, and memory.
  - id: FR-04
    type: "functional"
    title: "Deterministic portfolio-risk evaluation of a structured candidate trade before finalization"
    priority: "Must"
    status: "draft"
    stakeholders: [trader, reviewer, operator, security_reviewer]
    sources:
      origin: "Upstream proposal review, repository analysis, and baseline inspection"
      evidence:
        - path: "TradingAgents/tradingagents/portfolio.py"
          locator: "PortfolioContext"
          description: "Portfolio input is optional cash, currency label, and positions with quantity and average price; it has no valuation time, portfolio total, current-asset value, candidate order value, or currency-consistency contract."
          source_type: "code"
        - path: "TradingAgents/tradingagents/agents/schemas.py"
          locator: "TraderProposal and PortfolioDecision"
          description: "The Trader proposal has optional absolute entry and stop prices plus free-text sizing; the Portfolio decision has a rating but no validated order value, risk metrics, or policy result."
          source_type: "code"
        - path: "TradingAgents/tradingagents/agents/state.py"
          locator: "AgentState.portfolio_context"
          description: "Portfolio context is rendered as prompt text, not an authoritative validated numeric risk input."
          source_type: "code"
        - path: "TradingAgents/tradingagents/graph/setup.py"
          locator: "Portfolio Manager edge to END"
          description: "The graph ends after the Portfolio Manager; no deterministic portfolio-risk evaluator follows the model decision."
          source_type: "code"
        - path: "TradingAgents/tradingagents/agents/managers/portfolio_manager.py"
          locator: "portfolio_manager_node final rating"
          description: "The final rating and decision text are model-produced and are not checked against concentration or stop-distance limits."
          source_type: "code"
        - path: "baseline/runs/baseline-20261020-01/results/reports/NVDA_20261020_193209/5_portfolio/decision.md"
          locator: "entire file"
          description: "The baseline formal decision contains no concentration, stop-distance, risk-input, policy-version, or risk-result field."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/transcripts/final-status.json"
          locator: "final_rating and final_trade_decision"
          description: "The baseline persisted a Hold rating without any deterministic portfolio-risk evaluation or risk evidence."
          source_type: "measured_baseline"
    problem: >
      The upstream pipeline can finalize a Buy or Overweight advisory result
      without a deterministic check of projected concentration or long stop
      distance. Portfolio holdings are optional prompt context, candidate
      sizing is free text, entry and stop prices are optional model fields, and
      the model rating is the final authority. There is no authoritative
      caller-supplied valuation with cash, quantities, prices, currency,
      valuation time, and consistency checks; no structured candidate order;
      no historical valuation cutoff; no versioned policy snapshot; and no
      fail-closed behavior for missing, unsupported, insufficient-cash, or
      inconsistent risk input.
    statement: >-
      Applicability is determined only by asset_type and the model proposal rating. When asset_type is stock and the model proposal rating is Buy or Overweight, the risk check is REQUIRED, even if coverage, snapshot, or another gate check already blocks: the shared gate MUST validate the risk input, run the evaluator, and record a passed, blocked, or error result. A missing, malformed, unsupported, or inconsistent candidate MUST be blocked with MISSING_RISK_INPUT, INVALID_RISK_INPUT, UNSUPPORTED_RISK_INPUT, VALUATION_INCONSISTENT, INSUFFICIENT_CASH, or CURRENCY_MISMATCH; it MUST NOT be reported as not_applicable. Risk status is not_applicable only when asset_type is not stock, or the model rating is Hold, Underweight, Sell, or REVIEW. An invalid model rating MUST block with invalid_model_rating and MUST NOT use not_applicable. Crypto Buy and other non-stock assets use the not_applicable branch and remain subject to SB-01. Both first entry and adding to an existing long are in scope. position_effect is new_long when current_asset_quantity = 0 and current_asset_value = 0, and add_long when both are positive. A short position, derivative, leveraged order, multiple-order candidate, non-common-stock instrument, or FX conversion is unsupported when the applicability test is true and MUST be blocked, not not_applicable. The authoritative portfolio_risk_input MUST be supplied by the caller/application as canonical decimal strings with at most 12 fractional digits, finite and without exponent notation, not parsed from model prose, rendered portfolio text, or Markdown. It MUST contain portfolio_value > 0, cash_balance >= 0, current_asset_quantity >= 0, current_asset_value >= 0, valuation_price > 0, order_quantity > 0, entry_price > 0, proposed_order_value > 0, stop_loss_price > 0 and strictly below entry_price, one non-empty currency label shared by every monetary field, and valuation_time as an ISO 8601 timestamp with timezone. The exact decimal identities current_asset_value = current_asset_quantity * valuation_price and proposed_order_value = order_quantity * entry_price MUST hold; cash_balance MUST be at least proposed_order_value; and portfolio_value MUST be at least cash_balance + current_asset_value. Arithmetic inconsistency blocks with VALUATION_INCONSISTENT, insufficient buying power blocks with INSUFFICIENT_CASH, and mixed currencies block with CURRENCY_MISMATCH. No FX conversion is performed. The valuation cutoff is one explicit timezone-aware rule: valuation_cutoff = min(run_clock.now_utc, end_of_day(run_clock.as_of_date, run_clock.timezone)), where end_of_day is 23:59:59.999999 on as_of_date with that timezone offset. A future as_of_date is rejected before risk evaluation and before formal analysis with a future_analysis_date startup failure; it MUST NOT be silently clipped. valuation_time MUST be at or before valuation_cutoff and within max_valuation_age_seconds before it; otherwise the input is stale and blocks with STALE_RISK_INPUT. The evaluator MUST compute projected_weight = (current_asset_value + proposed_order_value) / portfolio_value and stop_distance = (entry_price - stop_loss_price) / entry_price with decimal arithmetic of at least 28 significant digits and no binary floating-point. It MUST compare exact decimals with the policy snapshot. Boundary equality passes: projected_weight at most max_projected_weight and stop_distance at most max_stop_distance. A breach blocks with POSITION_LIMIT_EXCEEDED and/or STOP_DISTANCE_EXCEEDED; when both occur, POSITION_LIMIT_EXCEEDED is the deterministic primary risk code and both codes are retained. Display ratios are rounded half-up to six decimal places, but display rounding MUST NOT affect the comparison. The policy is a locatable portfolio_risk_policy_snapshot, not an unversioned constant. It MUST record policy_version, policy_ref, policy_digest, max_projected_weight, max_stop_distance, max_valuation_age_seconds, precision_rule, threshold_status, and human_approval_ref. The precision_rule is input<=12dp;internal>=28sd;exact_compare;display=6dp_half_up. The default max_projected_weight = 0.30 and max_stop_distance = 0.05 are provisional classroom defaults. Provisional thresholds MAY be used only when the snapshot explicitly records threshold_status = provisional and human_approval_ref = null, and every result and report MUST label them provisional; they MUST NOT be described as approved policy. Approved thresholds require a non-null human_approval_ref. A missing, unknown, or incomplete policy snapshot blocks with POLICY_SNAPSHOT_UNAVAILABLE and MUST NOT default to approval. When invoked, the evaluator MUST return a portfolio_risk_result with evaluation_status passed, blocked, not_applicable, or error; risk_reason_codes from the closed risk_reason_code set; the policy snapshot actually used; input_ref; input_digest; valuation_time; valuation_cutoff; currency; projected_weight; stop_distance; effective_order_value; and evaluated_at. When a risk input is supplied and passes canonicalization, which includes complete input validation of presence, type, decimal scale, finiteness, applicability, currency, valuation time, cash, and arithmetic consistency, the current run MUST write the normalized risk-input artifact under its results directory, include it in scan_scope, and record input_ref with a relative path, SHA-256, and hash_scope = file. When canonicalization or any input validation check fails, the run MUST NOT write a normalized risk-input artifact and MUST NOT persist raw invalid values such as NaN; it records input_ref = null, input_digest = null, and a safe diagnostic_ref containing only the failure outcome and reason code. input_digest equals input_ref.sha256; a reviewer can read the artifact and independently reproduce the metrics and policy comparison. The policy snapshot is locatable through policy_ref and verifiable through policy_digest. An internal evaluator exception MUST return error with EVALUATOR_ERROR and MUST follow the shared gate's error path: gate status error, formal decision blocked_for_review with final_rating REVIEW, review_class gate_system_error, risk reason code EVALUATOR_ERROR, a failed run record with error.stage = gate, and no tradeable output. It MUST NOT pass or default to approval. A passed evaluation is not a guarantee of maximum realized loss, protection against gaps, slippage, fees, or liquidity, or any investment outcome. Stop distance is a price-distance ratio only. The evaluator does not execute or simulate orders. The current run stores its own risk evidence in the manifest, final-state, report summary, and, when a new memory entry is written, a declared memory summary. A reused historical memory entry retains its original evidence and binding and is linked through reused_decision_ref; the current run is not required to inject its current risk summary into that historical entry. Only identical stable decision content reuses an entry; changed decision content creates a new decision version under INV-01. A risk-blocked rerun follows the same reuse-and-version rule and is not governed by a blanket no-new-entry rule. Cache A/B evaluation MUST hold the policy snapshot, risk input fixtures, and gate version fixed. Risk-policy effects MUST be evaluated in a separate comparison under fixed cache, model, and data settings, so an intentional risk-driven REVIEW increase is not misclassified as a cache regression.
            The first version uses caller/application-supplied structured input from a fixed file or parameters. It does not connect to a broker, execute or simulate orders, perform FX conversion, or support short, derivative, leveraged, multiple-order, non-common-stock, or non-stock portfolio-risk policies. Historical applicability requires caller-supplied point-in-time portfolio data and remains subject to OQ-11. The candidate ticker, asset type, and trade fields are bound to the current analysis; a passed risk result does not cover another candidate or clear other blockers. Provisional passed means only that the provisional policy was met. For an invalid rating the risk branch is not run; the gate blocks with invalid_model_rating before risk applicability. A null or absent portfolio_risk result for an invalid rating is not a pass and is not a not_applicable result.
    fit_criterion:
      - id: FR-04-AC1
        input: "The local fixture docs/req/fixtures/portfolio_risk_input_v1.json with portfolio_value 100000, cash_balance 100000, current_asset_quantity 0, current_asset_value 0, valuation_price 100, order_quantity 300, entry_price 100, proposed_order_value 30000, stop_loss_price 95, one currency, and a valuation_time inside the explicit historical cutoff window; the policy snapshot is provisional with limits 0.30 and 0.05."
        expected_result: "projected_weight is exactly 0.30 and stop_distance is exactly 0.05 in decimal arithmetic; both equal-boundary comparisons pass; risk status is passed; the legal model rating remains unchanged; input_ref and input_digest are non-null; diagnostic_ref = null, policy snapshot, policy_digest, metrics, currency, valuation_time, valuation_cutoff, threshold_status = provisional, and human_approval_ref = null are recorded."
        verification: "Recompute the stored input artifact SHA-256 and metrics from the local fixture, then run the finalized-record integration assertion using decimal strings, not binary floats."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-04-AC2
        input: "A valid add_long stock Buy fixture with positive current_asset_quantity and current_asset_value, order value, cash, and prices such that projected_weight is immediately above the provisional 0.30 limit while stop_distance is within its limit."
        expected_result: "Risk status is blocked with POSITION_LIMIT_EXCEEDED; the shared gate blocks with portfolio_risk_limit_exceeded; final_rating is REVIEW; effective_order_value is zero; review_class is portfolio_risk_limit; escaped tradeable results = 0."
        verification: "Exact and immediately-over-boundary decimal unit tests plus formal-artifact integration."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-04-AC3
        input: "A valid new_long or add_long stock Buy fixture whose stop_distance is immediately above the provisional 0.05 limit while projected_weight is within its limit."
        expected_result: "Risk status is blocked with STOP_DISTANCE_EXCEEDED; the shared gate blocks with portfolio_risk_limit_exceeded; final_rating is REVIEW; effective_order_value is zero; review_class is portfolio_risk_limit; escaped tradeable results = 0."
        verification: "Exact and immediately-over-boundary decimal unit tests plus formal-artifact integration."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-04-AC4
        input: "A valid applicable stock Buy dual over-limit fixture that exceeds both the provisional concentration limit and the provisional stop-distance limit."
        expected_result: "Risk status is blocked and both POSITION_LIMIT_EXCEEDED and STOP_DISTANCE_EXCEEDED are retained; POSITION_LIMIT_EXCEEDED is the deterministic primary risk code; the shared gate records portfolio_risk_limit_exceeded; final_rating is REVIEW; no tradeable output is exposed."
        verification: "Unit test for deterministic multi-breach reason ordering plus formal-artifact integration."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-04-AC5
        input: "A parameterized table containing one valid canonical-decimal stock Buy positive fixture and invalid fixtures: zero or negative portfolio_value; negative cash_balance; zero or negative order_quantity, entry_price, proposed_order_value, valuation_price, or stop_loss_price; stop_loss_price at or above entry_price; zero cash with a positive order; insufficient cash; proposed_order_value inconsistent with order_quantity times entry_price; current_asset_value inconsistent with current_asset_quantity times valuation_price; portfolio_value less than cash_balance plus current_asset_value; currency mismatch; input scale over 12 fractional digits; non-finite, boolean, or non-canonical string numeric fields; new_long with nonzero current quantity or value; add_long with zero current quantity or value; missing required fields; stale valuation_time; an unsupported candidate; and a missing policy snapshot."
        expected_result: "The canonical-decimal positive fixture passes with non-null input_ref and input_digest and null diagnostic_ref. Each invalid fixture fails closed with exactly one primary reason code: missing required input -> MISSING_RISK_INPUT; malformed or non-canonical string -> INVALID_RISK_INPUT; unsupported candidate -> UNSUPPORTED_RISK_INPUT; stale valuation_time -> STALE_RISK_INPUT; currency mismatch -> CURRENCY_MISMATCH; arithmetic inconsistency -> VALUATION_INCONSISTENT; insufficient cash -> INSUFFICIENT_CASH; unavailable policy -> POLICY_SNAPSHOT_UNAVAILABLE. The shared gate blocks with portfolio_risk_input_invalid; final_rating is REVIEW; review_class is input_invalid; input_ref and input_digest are null and a safe diagnostic_ref records the failure without raw invalid values; no normalized input artifact is written; default approvals = 0. Multiple applicable reasons are all retained and the primary reason follows the fixed reason order."
        verification: "Parameterized malformed-input unit tests including docs/req/fixtures/portfolio_risk_input_invalid_v1.json, dependency sentinels, and finalized-record schema assertions."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: FR-04-AC6
        input: "Applicability fixtures: stock Buy with a missing candidate; stock Overweight with a short, derivative, leveraged, multiple-order, or non-common-stock candidate; crypto Buy with complete coverage; Hold, Underweight, and Sell stock ratings with complete coverage; stock Buy with a critical data gap and a missing candidate; and stock Buy with a critical data gap and a valid passed risk input."
        expected_result: "Stock Buy or Overweight never yields not_applicable: missing and unsupported candidates block with MISSING_RISK_INPUT or UNSUPPORTED_RISK_INPUT and a blocked result is recorded even when a critical gap also blocks. Crypto Buy and Hold, Underweight, or Sell use not_applicable and remain subject to SB-01. The critical-gap Buy records both critical_gap and the risk result, with critical_gap as primary when both exist. The critical-gap Buy with passed risk records passed risk and still blocks on critical_gap. not_applicable_as_pass_count = 0. An invalid model rating blocks with invalid_model_rating and is never not_applicable. No risk result is required for an invalid rating and no not_applicable result is recorded."
        verification: "Table-driven applicability tests combined with the SB-01 gate matrix; assert applicability, risk result presence, primary gate reason, and formal rating."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: FR-04-AC7
        input: "Applicable fixtures where the model proposal text or analyst narrative claims risk approval, supplies its own portfolio or order numbers, or instructs the evaluator to ignore a limit; plus sentinels that fail on any LLM, network, vendor, persistence, or UI call."
        expected_result: "Narrative and model-supplied numbers do not change the result; authoritative caller-supplied input and the versioned policy snapshot determine the outcome; forbidden dependency calls = 0; the model_proposal remains unapproved; unsafe approvals = 0. The evaluator performs no persistence, writer, UI, model, or network call and does not mutate its input."
        verification: "Narrative-injection fixtures, import audit, and dependency sentinels around the pure evaluator."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: FR-04-AC8
        input: "Passing and limit-breach fixtures evaluated 100 times each under one policy snapshot, including values just below, at, and just above the 0.30 and 0.05 boundaries, current-date valuation, historical valuation at the timezone-aware cutoff, historical valuation after the cutoff, historical valuation older than the freshness window, and a future as_of_date fixture."
        expected_result: "Canonical risk results, decimal ratios, codes, policy digest, and formal ratings are identical for identical input; boundary equality is stable; display rounding never changes pass or fail; the unique cutoff formula uses the timezone-aware end of day or now, whichever is earlier; out-of-window historical valuations block with STALE_RISK_INPUT; a future as_of_date is rejected with a future_analysis_date startup failure and is never silently clipped; floating-point drift and nondeterministic ordering = 0. A valuation_time without a timezone is invalid; cutoff and freshness boundaries are explicit."
        verification: "Repeated deterministic decimal test with canonical serialization, timezone-aware cutoff fixtures, boundary fuzzing, and round-trip assertion of input_digest and policy_digest."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-04-AC9
        input: "Policy fixtures: a complete provisional snapshot with 0.30, 0.05, a freshness window, the precision rule, threshold_status = provisional, and human_approval_ref = null; a complete approved snapshot with a non-null human_approval_ref; a missing policy_version; missing thresholds; a missing freshness window; a missing precision rule; an unknown policy_ref; and a tampered policy_digest."
        expected_result: "The actual thresholds, freshness window, precision rule, threshold_status, and human approval reference are recorded and independently recomputable from policy_digest. Provisional values are labeled provisional and never described as approved. Approved status is accepted only with a non-null human_approval_ref. Missing, incomplete, unknown, or digest-mismatched policy snapshots block with POLICY_SNAPSHOT_UNAVAILABLE; default approvals = 0. The policy is read by policy_ref and its digest is recomputed; a digest does not restore policy content."
        verification: "Policy-snapshot unit tests, digest round-trip, and finalized-record integration; no human approval is inferred from a provisional fixture."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
    tradeoff: Prioritize deterministic fail-closed risk evaluation. The caller supplies a fixed structured input and policy snapshot; the first version does not connect to a broker, execute orders, simulate a portfolio, convert FX, or support shorts, derivatives, leverage, or multiple orders. Thresholds remain provisional.
    implementation_dependencies: [SB-01, FR-02, FR-03]
    constraint_relations:
      - INV-01
      - INV-02
      - QR-01
    conflicts:
      - "A deterministic risk block reduces actionable output. Resolution: fail closed to REVIEW while retaining the model proposal as audit-only."
      - "A second risk gate would fragment final authority. Resolution: FR-04 is a pure evaluator invoked by the existing SB-01 SafetyGate and has no writer or decision path of its own."
      - "Missing or unsupported candidates could be excused as not_applicable. Resolution: applicability is fixed by stock asset type and Buy/Overweight rating; missing and unsupported candidates block."
      - "Caller-supplied valuations can be stale or inconsistent. Resolution: require one currency, an explicit timezone-aware cutoff, exact amount and price identities, cash coverage, and a locatable input artifact."
      - "A stop distance can be mistaken for a loss guarantee. Resolution: define it as a price-distance ratio only and forbid loss-guarantee wording or claims."
      - "Provisional 30% and 5% thresholds could be mistaken for approved policy. Resolution: require a policy snapshot with threshold_status, human_approval_ref, and policy_digest; provisional use is explicit and labeled."
      - "A risk-driven REVIEW increase could be misread as a cache regression. Resolution: hold risk policy fixed in cache A/B and evaluate risk-policy effects separately."
      - "Risk evidence could be forced into historical memory reuse. Resolution: current runs keep current evidence; reused historical entries keep their original evidence through reused_decision_ref."
    assumptions:
      - "The caller/application supplies validated numeric portfolio and candidate-trade inputs with provenance; model text is never authoritative."
      - "The first version covers stock Buy or Overweight proposals with position_effect new_long or add_long; short, derivative, leveraged, multiple-order, non-common-stock, and FX-conversion cases are unsupported and block when applicable."
      - "The portfolio and candidate trade share one currency and one valuation_time; no FX conversion is performed."
      - "The 30% concentration and 5% stop-distance values are provisional classroom defaults, not approved financial policy."
      - "Boundary equality passes; comparison uses exact decimal values and display rounding does not affect the decision."
      - "The evaluator is pure and deterministic; it does not execute orders or guarantee an investment outcome."
      - "The existing SafetyGate, REVIEW, model-proposal separation, and INV-01 artifact binding are reused; FR-04 creates no second finalization path."
      - "Crypto and other non-stock assets use the not_applicable branch; stock Buy/Overweight never does."
      - "risk_reason_code is closed: POSITION_LIMIT_EXCEEDED, STOP_DISTANCE_EXCEEDED, MISSING_RISK_INPUT, INVALID_RISK_INPUT, STALE_RISK_INPUT, UNSUPPORTED_RISK_INPUT, CURRENCY_MISMATCH, VALUATION_INCONSISTENT, INSUFFICIENT_CASH, POLICY_SNAPSHOT_UNAVAILABLE, EVALUATOR_ERROR."
      - "The policy freshness window and the authoritative valuation source are pending human approval; an absent or incomplete policy snapshot blocks an applicable proposal instead of defaulting to approval."
    notes: >-
      FR-04 adds a deterministic evaluator consumed by SB-01. AC10 is covered by INV-02; AC11 moved to QR-01. The 30% and 5% values are provisional, not approved financial policy. No runtime benchmark, implementation, or test result is claimed. Input source and policy thresholds remain pending decisions.
  - id: FR-05
    type: "functional"
    title: "Historical formal publication retrieval with verified section manifests"
    priority: "Must"
    status: "draft"
    stakeholders: [analyst, operator, reviewer]
    sources:
      origin: "Split from pxs FR-03 and verified against the current source tree"
      evidence:
        - path: "TradingAgents/cli/run.py"
          locator: "_run_directory; save_report_section_decorator; run_analysis"
          description: "CLI reports are written under ticker/date directories and are not exposed as a searchable immutable history."
          source_type: "code"
        - path: "TradingAgents/tradingagents/graph/trading_graph.py"
          locator: "default_report_path; record_decision; save_reports"
          description: "API report export uses a second-resolution path and is not automatically indexed for historical retrieval."
          source_type: "code"
        - path: "TradingAgents/tradingagents/reporting.py"
          locator: "_SECTIONS; _report_parts; _header; write_report_tree"
          description: "A fixed section map renders into existing directories without a section manifest or verified retrieval contract."
          source_type: "code"
        - path: "TradingAgents/tradingagents/dataflows/symbols.py"
          locator: "normalize_symbol and safe_ticker_component"
          description: "Existing symbol normalization and path-component guard can be reused for history filters and path confinement."
          source_type: "code"
        - path: "baseline/runs/baseline-20261020-01/results/reports/NVDA_20261020_193209/"
          locator: "report tree"
          description: "Baseline report tree is keyed by ticker and timestamp and has no history index or read-time verification."
          source_type: "measured_baseline"
    problem: >
      Current reports are written into ticker/date or second-resolution directories
      and can be discovered only as files. There is no canonical history listing,
      no cross-run filter semantics, no section manifest, and no read-time
      verification that a retrieved complete report belongs to one committed
      publication rather than a mixture of files.
    statement: >-
      After a formal publication is committed, the application MUST expose historical formal publication listing and retrieval. History visibility is exactly the committed state: terminal manifest run_status = completed plus successful read-time INV-01 validation. Analysis completion alone, a pending recovery task, a failed publication, or a quarantined record MUST NOT be visible as successful history. Listing filters are optional ticker and analysis_date. When both are present they are intersected. Ticker is trimmed and normalized with the same canonical ticker normalization used by data access; analysis_date is a strict YYYY-MM-DD value and is never defaulted. An unknown ticker or a filter with no matches returns an empty list; a malformed filter returns INVALID_FILTER. Results are ordered by analysis_date descending, then ticker ascending, then run_id ascending. limit is an integer (not boolean) from 1 to 500 with default 50; offset is an integer (not boolean) >= 0 with default 0. Zero, negative, boolean, non-integer, or over-limit limit, and negative or non-integer offset, return INVALID_FILTER. The response reports total_matches, returned, truncated, and next_offset; next_offset is null when no more matches exist, otherwise it is offset + returned for the next page. The listing MUST NOT be unbounded. get_run(run_id) MUST revalidate the terminal manifest, artifact_binding, complete report, report_section_manifest, and permanent publication_snapshot references on every read; temporary recovery material is not a required external dependency. It returns the verified complete report and section manifest, or NOT_FOUND for an unknown run_id, or CORRUPT_RECORD for a damaged or unverifiable record. It MUST NOT return partial, stale, or unverified content. Corrupt records are excluded from successful listing results and are counted or warned separately. The returned section manifest MUST come from the committed publication's versioned renderer and recorded current-run capability set. It lists only applicable non-empty sections, each with path, agent or state fields, byte size, and SHA-256. Retrieval MUST NOT mix files from another run or re-derive sections from arbitrary directory contents. The complete report uses the gated formal decision; the model proposal remains unapproved and any process suggestion remains labeled unapproved. Additional export packages, legacy migration, and full-text indexing are deferred and are not part of this requirement. Pagination is not a transaction snapshot; records added between pages may affect later pages.
    fit_criterion:
      - id: FR-05-AC1
        input: "Committed, pending, failed, and quarantined records for mixed tickers/dates, including duplicate ticker spellings, combined ticker/date filters, no matches, an unknown ticker, malformed date/limit/offset filters, zero, negative, boolean, non-integer, and over-limit limits, and a result set larger than the requested page. a no-date-filter case and an invalid calendar date."
        expected_result: "Only verified committed records are listed. Ticker normalization is canonical, ticker and date filters use intersection semantics, unknown ticker and no match return an empty list, and malformed date/limit/offset or invalid limit/offset values return INVALID_FILTER. Order is analysis_date descending then ticker ascending then run_id ascending. The bounded page reports total_matches, returned, truncated, and next_offset; next_offset is offset+returned when more matches exist and null otherwise, so remaining matching records are retrievable by paging. Pending, failed, and quarantined records are not visible as successful history; mismatches = 0. No date filter means no date restriction, not today; an invalid calendar date returns INVALID_FILTER; total_matches counts valid committed matches only and corrupt items are counted or warned separately; offset beyond the match set returns an empty page and next_offset null."
        verification: "Fixture-driven history query tests with exact-set/order assertions, valid and invalid limit/offset values, and next-page retrieval; include the archive history fixture and a missing-filter negative."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: FR-05-AC2
        input: "Valid committed run IDs, an unknown run ID, a corrupt section or manifest, and a record whose read-time hash or binding no longer validates."
        expected_result: "A valid ID returns the verified complete report and report_section_manifest. An unknown ID returns NOT_FOUND. A corrupt or unverifiable record returns CORRUPT_RECORD without partial content. Read-time revalidation is performed on every call; partial or unverified success count = 0. Returned bytes are the verified bytes; if content changes between validation and read, return CORRUPT_RECORD or revalidate, never unverified bytes."
        verification: "Retrieval integration tests with per-file tampering, manifest tampering, binding mismatch, and unknown-ID fixtures."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: FR-05-AC3
        input: "A committed run with a section manifest, plus planted foreign/stale section files, a tampered section digest, a changed complete-report digest, and a formal report containing a model proposal and process suggestions."
        expected_result: "The retrieved section manifest lists only the current run's applicable non-empty sections with path, agent/state fields, byte size, and SHA-256; foreign or stale sections are absent; tampering returns CORRUPT_RECORD. The complete report uses the gated formal decision, the model proposal is not presented as the formal conclusion, and process suggestions remain explicitly unapproved; mismatches = 0."
        verification: "Section-isolation and read-time revalidation tests using the archive history fixture, exact section sets, digest assertions, and formal/unapproved label checks."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
    tradeoff: Prioritize verified committed history, read-time validation, and bounded retrieval. Additional export packages, legacy migration, full-text indexing, and section re-derivation from arbitrary directories are deferred.
    implementation_dependencies: [FR-02, INV-01, SR-01]
    constraint_relations: [FR-06, QR-02, INV-02]
    conflicts:
      - 'A searchable history conflicts with immutable formal publication. Resolution: history reads only committed verified publications and never rewrites them.'
      - 'Filters can return too many records. Resolution: deterministic order plus bounded limit, total_matches, and truncated.'
      - 'Directory scanning can mix old and current files. Resolution: retrieval consumes the committed section manifest and revalidates every section on read.'
    assumptions:
      - The team run_id is the canonical publication identity; UUIDv4 is not required.
      - Only terminal-manifest completed plus read-time INV-01 is visible as successful history.
      - Ticker normalization reuses the data-access canonical symbol normalization; dates are strict YYYY-MM-DD.
      - Additional export packages and legacy report migration are deferred.
      - No full-text search or authoritative index is introduced.
    notes: >-
      FR-05 is the historical retrieval requirement. AC4 (export modes) is deferred with the export capability. No implementation or runtime measurement is claimed.
  - id: FR-06
    type: "functional"
    title: "Startup recovery of pending formal publication"
    priority: "Must"
    status: "draft"
    stakeholders: [operator, analyst, reviewer]
    sources:
      origin: "Split from pxs FR-03 and pxs INV-06, verified against the current source tree"
      evidence:
        - path: "TradingAgents/cli/run.py"
          locator: "_run_directory; save_report_section_decorator; run_analysis"
          description: "CLI writes report files directly and has no startup recovery path for interrupted publication."
          source_type: "code"
        - path: "TradingAgents/tradingagents/graph/trading_graph.py"
          locator: "record_decision; save_reports"
          description: "Publication and persistence paths do not provide a model-free recovery entry point."
          source_type: "code"
        - path: "TradingAgents/tradingagents/reporting.py"
          locator: "write_report_tree"
          description: "The renderer can be re-run from saved inputs, but no persisted recovery snapshot or claim protocol exists."
          source_type: "code"
        - path: "baseline/runs/baseline-20261020-01/run-manifest.json"
          locator: "all fields"
          description: "Baseline manifest is an external collection artifact with no publication-recovery state or claim protocol."
          source_type: "measured_baseline"
    problem: >
      An interrupted formal publication can leave a partially written report tree
      with no safe way to finish it. Re-running the analysis would repeat model
      and data costs and could produce a different report. A second publication
      mechanism would compete with the existing terminal-manifest commit.
    statement: >-
      At startup, the application MUST recover pending formal publication tasks by continuing the existing formal publication process. Recovery is not graph resume and MUST NOT re-run analysis. It MUST NOT create a separate archive transaction. It uses only saved, verified, redacted formal records and fixed rendering inputs. Recovery MUST NOT call an LLM, external data provider, analysis graph, settlement, or reflection. If the original publication required a memory write, recovery MAY perform the first write of that original planned decision entry when the interruption happened before it, or complete the same entry idempotently when a partial write exists. It MUST NOT change the decision content, create a different decision entry, create an additional duplicate of the original planned entry, or change memory policy. Recovery guarantee begins only at snapshot_ready, after a complete recovery_snapshot is durably written and read-back verified. Missing, corrupt, or unsupported snapshots are reported and quarantined; they are not published or returned as success. Persistent faults retain valid snapshot and source material. The snapshot MUST contain the formal decision and artifact_binding, terminal-manifest candidate identity, report_section_manifest and fixed rendering inputs, the risk input and policy references actually used, the original required memory decision identity and reserved entry version, metric_evidence_bundle when FR-07 applies, and the required schema/renderer versions. Every reference MUST resolve inside the snapshot with a validated digest; recovery MUST NOT depend on a separately lost external file. After commit, the permanent publication_snapshot remains readable; the temporary recovery_snapshot and other pending recovery material may be cleaned. Every formal reference MUST resolve against the permanent publication_snapshot after cleanup. Cleanup failure after commit returns committed plus a warning and does not affect history. Before claiming or publishing, recovery MUST first inspect the existing terminal manifest and content identity. A legal completed publication with matching identity is already complete and MUST NOT be republished or repeat memory; snapshot residue alone MUST NOT trigger publication. Different content for an existing run_id is RUN_ID_CONFLICT. D1 recovery is single-process: repeated startup for the same run_id MUST NOT create a second formal publication; bounded retry and a single-process duplicate-start guard are sufficient. Multi-worker claim/fencing/takeover is deferred. A concurrent or multi-worker recovery attempt is unsupported in D1 and MUST be rejected or left disabled; it MUST NOT partially implement the deferred claim/fencing protocol. Failure of one task is isolated from other tasks; retries are bounded; at most one successful formal publication exists per run_id and decision identity. The team run_id is preserved; UUIDv4 is not required. The terminal manifest with run_status = completed plus read-time INV-01 validation is the only commit condition; no independent commit marker is authoritative. Same run_id with the same immutable content is a no-op; different content for an existing run_id is RUN_ID_CONFLICT. Analysis completion, formal publication success, and history visibility are distinct. Recovery is sequential and single-process; a simple exclusive start guard rejects unsupported concurrent recovery. The snapshot is self-contained with local versions, digests, and references. A no-task startup is normal.
    fit_criterion:
      - id: FR-06-AC1
        input: "A valid snapshot_ready recovery snapshot from an interrupted formal publication, with spies on LLM, external data, analysis graph, settlement, reflection, filing retrieval, and vendor calls; the original publication required a memory write and the snapshot includes the formal decision, artifact_binding, risk/policy references, memory decision identity and reserved version, metric_evidence_bundle when FR-07 applies, and schema/renderer versions."
        expected_result: "Recovery completes once without any forbidden call, preserves the original run_id, may create the first write of the original planned decision entry or idempotently complete the same entry, and produces one committed formal publication that revalidates on read. It does not change decision content, create a different decision entry, or create an additional duplicate of the original planned entry. Every snapshot reference resolves with a validated digest; no external lost file is required. Metrics are reconstructed from the persisted metric_evidence_bundle without refetching filings or calling a model. No commit marker is required or authoritative; model/external/graph/settlement/reflection/filing/vendor calls = 0. Saved authoritative metrics and fixed render inputs are used; completed business analysis is not recomputed."
        verification: "Offline recovery integration test with dependency sentinels, a valid snapshot fixture including references and versions, first-write/idempotent memory assertions, and terminal-manifest read-back."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: FR-06-AC2
        input: "Missing, corrupt, unsupported, and reference-broken recovery snapshots; a persistent storage fault; and a cleanup failure after a successful commit. a no-pending-task case."
        expected_result: "Missing, corrupt, unsupported, or reference-broken snapshots are reported and quarantined without publication; valid materials are retained across persistent faults. After commit, permanent formal records remain readable and pending recovery material may be cleaned; a cleanup failure returns committed with a warning and does not change history or the committed identity. False successful publication = 0. No pending task is a normal no-op, not a quarantined file; a pending identity with a missing snapshot is an error and does not quarantine a nonexistent file."
        verification: "Snapshot reference/digest fault injection, persistent-fault, cleanup-success, and cleanup-failure tests with typed status, retained-formal-record, and history-read assertions."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: FR-06-AC4
        input: "Fixtures for analysis_complete, snapshot_ready/pending, publication_committed, failed, and quarantined states, queried through publication status and history retrieval."
        expected_result: "analysis_complete is not visible as published or historical success; pending and failed are not successful history; publication_committed is visible only after read-time INV-01 validation; quarantined records are reported but not returned as success. Status-confusion count = 0."
        verification: "Status and history-visibility integration test using the archive recovery fixture and read-time validation."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: FR-06-AC5
        input: "Repeated recovery retries for one run_id, same-content and changed-content resubmission, an existing committed publication with matching identity, and an existing committed publication with a different immutable record."
        expected_result: "Recovery first reads the existing terminal manifest and content identity. A legal completed publication with matching identity is treated as complete and MUST NOT be republished or repeat memory; snapshot residue alone does not trigger publication. Same run_id and same immutable content is a no-op; changed content returns RUN_ID_CONFLICT; multiple retries yield at most one successful publication; the commit condition is terminal manifest completed plus read-time INV-01; no independent commit marker changes the result; committed bytes remain unchanged; post-cleanup restart duplicate publication = 0. A concurrent or multi-worker recovery attempt is rejected as unsupported and does not create a second publication. The retry count and stop condition are fixed and recorded; one task failure is isolated."
        verification: "Restart-after-cleanup, retry, identity-conflict, and commit-condition tests with terminal-manifest/content-identity checks and complete-directory digest comparison."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: FR-06-AC6
        input: "A recovery snapshot whose original publication required memory and was interrupted before the first write, one interrupted after a partial write, a memory-disabled original publication, and spies on settlement/reflection and new memory writes."
        expected_result: "For the pre-first-write case, recovery creates exactly the one original planned decision entry recorded by the snapshot. For the partial-write case, it idempotently completes that same entry. It never changes decision content, creates a different decision entry, or creates an additional duplicate of the original planned entry; memory-disabled originals remain disabled; settlement and reflection calls = 0; recovery does not change the formal decision; extra/duplicate entries = 0."
        verification: "Pre-first-write, partial-write idempotency, memory-disabled, decision-content-immutability, and forbidden-call tests."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: FR-06-AC7
        input: "One completed CLI analysis and one completed programmatic/API analysis, each with fixed render inputs and a recovery snapshot, followed by successful cleanup of pending recovery material."
        expected_result: "Both entry points automatically write a complete recovery_snapshot before the terminal publication commit and publish separately retrievable committed formal publications under the same configured root without a later optional export. The existing propagate return shape remains (final_state, signal). Snapshot_ready and committed are distinct; history visibility starts only at committed. Cleanup may remove the pending snapshot, while permanent formal records remain readable and history is unchanged. Missing or invalid snapshots prevent completed publication. Normal publication and recovery share the same validation and commit condition."
        verification: "Offline CLI and API entry-point fixtures with snapshot, publication, cleanup, history-read, status-separation, shared-root, and propagation return-shape assertions."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
    tradeoff: Prioritize model-free, single-process recovery that continues the existing formal publication. Multi-worker claim/fencing/takeover and the QR-02 performance target are deferred.
    implementation_dependencies: [FR-02, INV-01, SR-01]
    constraint_relations: [FR-05, QR-02, INV-02]
    conflicts:
      - 'Recovery must not repeat analysis. Resolution: use saved verified formal records and fixed render inputs only.'
      - 'A recovery mechanism can duplicate publication. Resolution: a single-process duplicate-start guard plus bounded retry yields at most one committed result.'
      - 'A commit marker is easy to add but creates a second authority. Resolution: terminal manifest plus read-time INV-01 is the only commit condition.'
      - 'Memory recovery can create policy drift. Resolution: only the original required decision write may be completed idempotently.'
      - 'Invalid snapshots can block startup. Resolution: quarantine them, isolate failures, and retain valid material.'
    assumptions:
      - Recovery continues the existing formal publication process and is not graph resume.
      - The team run_id is preserved; UUIDv4 is not required.
      - The terminal manifest plus read-time INV-01 is the only commit condition.
      - D1 recovery is single-process; concurrent recovery and stale-claim takeover are deferred.
    notes: >-
      FR-06 is the recovery requirement. AC3 (multi-worker claim/fencing/takeover) is deferred; FR-06-AC7 carries the recovery-snapshot generation obligation moved from FR-02. No implementation, benchmark, or runtime result is claimed.
  - id: FR-07
    type: "functional"
    title: "Deterministic derived financial metrics from structured filing facts"
    priority: "Must"
    status: "draft"
    stakeholders: [analyst, trader, reviewer, operator]
    sources:
      origin: "Reviewed personal proposal (source artifact not retained in the repository), corrected against the baseline and current source"
      evidence:
        - path: "baseline/runs/baseline-20261020-01/transcripts/final_state.json"
          locator: "fundamentals_report; final_trade_decision"
          description: "Baseline report states Q2 FY2027 revenue growth of about +68.6%; the filed figures used here give +105.9%."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/transcripts/tool-outputs-clean/0019_get_income_statement.txt"
          locator: "Revenue, Gross Profit, Operating Income, Net Income, Diluted EPS"
          description: "Quarterly statement text used only as a source of structured facts; column position is not an identity."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/transcripts/tool-outputs-clean/0045_get_income_statement.txt"
          locator: "annual statement rows"
          description: "Annual statement text used for fiscal-year periods and TTM inputs."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/transcripts/tool-outputs-clean/0035_get_cashflow.txt"
          locator: "Operating Cash Flow; Capital Expenditure; span labels"
          description: "Cash-flow statement text showing year-to-date spans and capex sign."
          source_type: "measured_baseline"
        - path: "TradingAgents/tradingagents/dataflows/vendors/sec_edgar.py"
          locator: "get_income_statement; get_cashflow; _YEAR_TO_DATE"
          description: "Existing SEC statement source, filing-date visibility, and year-to-date rules."
          source_type: "code"
        - path: "TradingAgents/tradingagents/agents/analysts/fundamentals_analyst.py"
          locator: "TOOLS; system_message"
          description: "Analyst currently receives raw statements and has no deterministic derived-metric tool or block."
          source_type: "code"
        - path: "TradingAgents/tradingagents/agents/tools.py"
          locator: "get_balance_sheet; get_cashflow; get_income_statement"
          description: "Existing tool pattern with injected ticker and trade date; the new path must use the shared data access boundary."
          source_type: "code"
        - path: "TradingAgents/tradingagents/dataflows/router.py"
          locator: "route_to_vendor"
          description: "Unified data-access entry point that must supply facts, run-cache reuse, provenance, and counters."
          source_type: "code"
    problem: >
      Growth rates, margins, and valuation multiples are computed by the model
      from irregular statement tables. Quarterly tables omit fourth quarters and
      contain near-date or duplicate-looking periods, so column position or date
      proximity can select the wrong comparison. The baseline stated +68.6%
      instead of +105.9%, and trailing P/E was cited without distinguishing
      fiscal-year EPS from TTM EPS. There is no structured fact identity, no
      deterministic metric block, and no rule for a model narrative that
      contradicts program-computed metrics.
    statement: >-
      The application MUST derive the listed metrics from a structured financial_fact contract, not from display CSV text, column position, or date proximity. Each fact MUST record fact_id, subject_id (CIK or equivalent issuer identity), accession_no, locatable filing_ref, concept, value, unit, currency, period_start, period_end, fiscal_year, fiscal_quarter, span annual/quarter/ytd/instant, cumulative_duration_days, filed_at, source, sign convention, and restatement lineage (restates_fact_id or supersedes). CIK identifies the issuer but NEVER substitutes for the accession and filing_ref. Facts MUST be obtained through the existing unified data access and FR-01 run cache, provenance, and counting boundary; a new direct vendor bypass is forbidden. Only facts with filed_at on or before run_clock.as_of_date are visible. Multiple filings for the same period identity use the latest filed_at on or before as-of and record the superseded fact. Facts with different period identities are never merged because their dates are close or their values are equal; if more than one period remains a plausible comparison, the metric is n/a with a structured ambiguous-period reason.
            The metric set is revenue year-over-year growth (quarterly and annual), revenue quarter-over-quarter growth, gross/operating/net margin, current ratio, liabilities-to-assets, free cash flow on the reported span, and P/E on fiscal-year EPS. TTM revenue, TTM diluted EPS, TTM P/E, FCF year-over-year growth, and single-quarter derivation are deferred and MUST NOT be claimed. YoY comparisons use the prior fiscal year's same fiscal_quarter, span, and cumulative duration, not equal dates; QoQ comparisons use the immediately preceding fiscal quarter. Historical comparison facts may be read when required for a formula.
            Every metric MUST have one stable metric_id, one formula_id and formula, explicit input fact_ids, one period identity, unit and currency, and a precision/rounding rule. Zero denominator makes a ratio n/a; negative or zero diluted EPS makes P/E n/a; growth on a non-positive base is n/a; missing required fields, currency mismatch, or unit mismatch makes the metric n/a with a reason. Capital expenditure is a positive outflow; if a source presents the opposite sign, normalize it and record the source sign; free cash flow is operating cash flow minus capital expenditure on the reported span. The module MUST NOT derive a single quarter by subtraction.
            A deterministic program MUST append a metric_block to the fundamentals output even when the model never calls the offered tool. The block carries stable metric_id values, source fact_ids and filing_refs, formula_id and formula_version, fact_schema_version, metric_policy_version, period, value or n/a reason, and calculation status computed/approximate/n/a. "verified" means only that the metric inputs and formula validated; it does not verify the whole analysis or investment judgment. The block and its metric_evidence_bundle (structured facts, formula/fact/policy versions, input_digest, and result_digest) MUST be persisted in the permanent publication_snapshot and the recovery_snapshot. Recovery MUST read this bundle and MUST NOT refetch filings, call a model, or rerun analysis; a missing or invalid bundle blocks a metric-dependent publication rather than triggering a live fetch.
            Metric-conflict detection is limited to a model claim with a recognizable metric_id or a declared structured metric_claim, an explicit period, and a parseable numeric value. If such a claim contradicts the computed metric beyond tolerance, the report MUST include a metric_conflict disclosure and label the contradicted claim as unverified; the wrong number MUST NOT remain the authoritative conclusion. Arbitrary free-form financial numbers without a recognizable metric_id are outside this detection scope and MUST NOT be described as comprehensively checked; the report records that limitation rather than claiming full natural-language verification. filed_at/as-of and latest-visible-period rules are explicit; conflict consequences are distinguished.
    fit_criterion:
      - id: FR-07-AC1
        input: "The local financial fixture derived from baseline NVDA quarterly statements 0019, with analysis date 2026-10-19, revenue 96,221 for 2026-07-26 and 46,743 for 2025-07-27, 81,615 for 2026-04-26 and 44,062 for 2025-04-27, gross profit 72,142, operating income 63,734, and net income 59,688 for 2026-07-26."
        expected_result: "revenue_yoy_q for 2026-07-26 is +105.9% and for 2026-04-26 is +85.2%, both computed as period value / exact year-ago period value - 1 and rounded half-up to 0.1 percentage point. revenue_qoq is +17.9%. Gross, operating, and net margins are 75.0%, 66.2%, and 62.0%. Each row lists metric_id, formula_id, input fact_ids, period identity, and rounding rule; mismatches = 0."
        verification: "Independent fixture recomputation from the recorded statement values with exact period identities; compare expected values and formula inputs."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-07-AC2
        input: "The AC1 fixture with the exact 2025-07-27 year-ago period removed, and a fourth-quarter or prior-quarter period whose exact comparison is absent."
        expected_result: "Each affected metric is n/a with a structured missing-comparison or ambiguous-period reason. No neighboring-column substitution, no date-proximity substitution, and no value borrowed from another period. The test does not assert that the result is numerically unequal to an unrelated ratio; it asserts the typed n/a reason and absence of a substituted input."
        verification: "Fixture tests with removed periods and absent comparisons; assert typed n/a reason and input fact_ids are empty, not a numeric inequality."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-07-AC3
        input: "Facts for 2010-07-31 and 2010-08-01 with equal revenue 811, two same-day filings for one period with different accessions and values, a same-period restatement filed later with an explicit lineage, a fact missing accession/filing_ref, a fact from a different subject_id, and a filing dated after the analysis date."
        expected_result: "The near-date facts remain distinct period identities and are not merged even though values are equal; if both remain plausible comparisons the metric is n/a ambiguous-period. Two same-day filings with different accessions and values and no explicit amendment/restatement relation are n/a ambiguous-filing; equal values alone do not merge them. An explicit later restatement selects the latest filed_at on or before as-of and records the superseded fact. A fact with only a CIK and no accession/filing_ref is n/a missing-filing-reference; a comparison spanning different subject_ids is n/a subject-mismatch. A filing after as-of is invisible. Silent merge or look-ahead use = 0. filed_at is date-level <= as_of; the latest visible period is chosen by filing visibility, not period_end alone."
        verification: "Fixture tests for equal-value near dates, same-day multiple accessions, restatement lineage, missing accession, and as-of filtering; assert distinct fact_ids/accessions, typed n/a reasons, supersedes lineage, and no future fact."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-07-AC4
        input: The local NVDA fixture with annual FY2026 (period ending 2026-01-25) diluted EPS 4.90 and close price 217.09 on 2026-10-19.
        expected_result: pe_fy = 217.09 / 4.90 = 44.3x, labeled fiscal-year P/E and reported as a separate row. TTM revenue, TTM diluted EPS, TTM P/E, and their formulas are not produced in this version and no TTM result is claimed. P/E uses the close price on as_of, the annual diluted EPS period, and the same currency; missing price/currency yields n/a.
        verification: Fixture recomputation of fiscal-year P/E from annual diluted EPS and close; assert the fiscal-year label and the absence of TTM rows.
        zero_tolerance: true
        measurement_status: not_measured
        threshold_status: provisional
      - id: FR-07-AC5
        input: The local cash-flow fixture with current six-month YTD FY2027 operating cash flow 74,421 and capital expenditure 4,434, plus a source that presents capex with a negative sign.
        expected_result: Free cash flow is 74,421 - 4,434 = 69,987 for the current reported span. A negative source capex is normalized to positive outflow with the source sign recorded. No quarter is derived by subtraction; prior-year and year-over-year FCF are deferred and are not produced.
        verification: Fixture tests on the labeled six-month span and capex sign normalization; assert the current-span FCF and the absence of prior-year/YoY output.
        zero_tolerance: true
        measurement_status: not_measured
        threshold_status: provisional
      - id: FR-07-AC6
        input: "The same fixture evaluated with analysis date 2026-06-01, plus zero-revenue, zero/negative-EPS, non-positive-growth-base, missing-field, currency-mismatch, and unit-mismatch cases."
        expected_result: "For 2026-06-01 the latest visible period is 2026-04-26 and no later filing or price is used. Zero denominator makes the ratio n/a; zero or negative diluted EPS makes P/E n/a; a non-positive growth base makes growth n/a; missing fields or currency/unit mismatch make the metric n/a with a reason. Look-ahead uses and silent defaults = 0."
        verification: "Fixture tests with as-of filtering and malformed/zero/currency/unit cases; assert typed n/a reasons and no future facts."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-07-AC7
        input: "A metrics request under the shared data-access path with an instrumented vendor and FR-01 counters; a sentinel that fails on a direct vendor call."
        expected_result: "Every fact fetch uses the unified data access, run cache, provenance record, and FR-01 query/counter boundary; direct vendor calls = 0; query_executions, vendor_cache_hits, run_cache_hits, external_requests, and provenance are consistent with the existing contract. Metrics do not create a second data path."
        verification: "Instrumented data-access integration test with direct-call sentinels and counter/provenance assertions."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-07-AC8
        input: "The fundamentals node run with a fake LLM that never calls get_derived_metrics, plus the five downstream prompt builders; the resulting publication_snapshot and recovery_snapshot."
        expected_result: "The metric_block is appended by program logic regardless of model tool invocation; it has stable metric IDs, source fact_ids and filing_refs, formula_id/formula_version, fact_schema_version, metric_policy_version, periods, values or n/a reasons, and computed/approximate/n/a status. The metric_evidence_bundle is persisted in the permanent publication_snapshot and recovery_snapshot with input_digest and result_digest. The tool is offered, but acceptance does not depend on the model calling it. Prompt instructions may tell the model to quote metrics but are not the correctness mechanism."
        verification: "Offline node test with a no-tool fake LLM, prompt-integrity assertions, and persisted-bundle digest checks; assert the block is present and matches deterministic calculator output."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-07-AC9
        input: "A structured metric_claim with metric_id revenue_yoy_q_2026-07-26, an explicit period, and value +68.6% while the computed metric block states +105.9%; a second contradicted claim; and free-form prose containing an unmapped financial number."
        expected_result: "For claims with a recognizable metric_id/period/value, the report includes a metric_conflict disclosure naming the metric, claimed value, computed value, formula, and period; the contradicted claim is labeled unverified and is not authoritative. Free-form numbers without a recognizable metric_id are outside deterministic conflict detection; the report records that limitation and does not claim comprehensive natural-language checking. A correct block alone while a mapped wrong claim remains authoritative fails; unresolved material conflict is surfaced for human review. Distinguish disclosure, human review, and formal blocking; a formal block is not invented without an approved policy."
        verification: "Structured metric_claim conflict and unmapped-prose limitation fixtures; assert disclosure fields, unverified labeling, and absence of the wrong number as the authoritative conclusion."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-07-AC11
        input: "A committed publication with a persisted metric_evidence_bundle, followed by startup recovery with sentinels on filing retrieval, vendor calls, model calls, and analysis graph; and a variant with a missing or corrupt bundle."
        expected_result: "Recovery reconstructs metrics from the persisted facts, formula_version, fact_schema_version, metric_policy_version, input_digest, and result_digest without refetching filings, calling a vendor/model, or rerunning the analysis graph. The recovered metric_block and result_digest match the publication_snapshot. A missing or corrupt bundle blocks metric-dependent publication and is reported/quarantined; it does not trigger a live fetch. Refetch/model/graph calls = 0. The bundle is persisted, read, and recovered under one contract."
        verification: "Persistence and recovery integration test with dependency sentinels, digest comparison, and corrupt/missing bundle negatives."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
    tradeoff: Prioritize direct, period-aligned metrics with baseline correction evidence. TTM revenue, TTM diluted EPS, TTM P/E, FCF year-over-year growth, and single-quarter derivation are deferred. No new vendor path and no model arithmetic as the numeric authority.
    implementation_dependencies: [FR-01, FR-02, FR-03, INV-01, GR-01]
    constraint_relations:
      - SB-01
      - SR-01
      - FR-08
      - GR-01
    conflicts:
      - 'Model arithmetic can be wrong. Resolution: program-computed metric_block is the numeric authority and conflicts are disclosed.'
      - 'Statement tables are irregular. Resolution: use structured period/fact identities, not columns or date proximity.'
      - 'TTM metrics and FCF YoY need cumulative cross-period arithmetic. Resolution: defer them rather than relax period identity.'
      - 'The model may ignore the tool. Resolution: code appends the block regardless of tool invocation.'
      - 'A correct table can coexist with wrong prose. Resolution: require metric_conflict disclosure and unverified narrative labeling.'
    assumptions:
      - The source universe is SEC US-GAAP facts; unsupported instruments return an explicit not-supported result.
      - Facts are read through the existing unified data access and FR-01 run-cache boundary; no new direct vendor path is allowed.
      - The reference manifest for non-NVDA companies, periods, and independent sources is frozen before implementation under GR-01.
      - TTM revenue/EPS/P/E and FCF YoY are deferred.
      - The metric block is a numeric evidence artifact, not a validation of the whole analysis.
      - Literal absence of a percentage in tool text is an observation only; it is not proof that the number was model-computed or wrong.
    notes: >-
      FR-07 is the corrected form of the reviewed personal FR-01 proposal; that source artifact is not retained. AC10 moved to GR-01; AC4/AC5 are narrowed to fiscal-year P/E and current-span FCF; TTM metrics and FCF YoY are deferred. NVDA expected values are independently recomputed. No implementation or benefit is claimed. GR-01 is an implementation prerequisite: FR-07 implementation and acceptance do not start until GR-01 passes.
  - id: FR-08
    type: "functional"
    title: "Unified downstream analyst-report brief with canonical gaps and bounded context"
    priority: "Must"
    status: "draft"
    stakeholders: [operator, reviewer, trader, analyst]
    sources:
      origin: "Reviewed personal proposal (source artifact not retained in the repository), reclassified as a functional context-delivery policy and reviewed against current prompt assembly"
      evidence:
        - path: "baseline/runs/baseline-20261020-01/metrics.json"
          locator: "tokens_in; tokens_out; llm_calls"
          description: "Baseline token totals used only as context; no brief benefit is measured."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/transcripts/final_state.json"
          locator: "analyst report fields"
          description: "Recorded analyst reports including gap statements and report lengths."
          source_type: "measured_baseline"
        - path: "TradingAgents/tradingagents/agents/context.py"
          locator: "report_or_absent"
          description: "The single function through which the five downstream debate agents read analyst reports."
          source_type: "code"
        - path: "TradingAgents/tradingagents/agents/researchers/bull_researcher.py"
          locator: "report_or_absent calls and prompt assembly"
          description: "Representative downstream consumer; the same pattern exists in bear_researcher.py and the three risk debaters."
          source_type: "code"
        - path: "TradingAgents/tradingagents/agents/researchers/bear_researcher.py"
          locator: "report_or_absent calls and prompt assembly"
          description: "Downstream consumer of the same full analyst reports."
          source_type: "code"
    problem: >
      The five downstream debate agents receive all four full analyst reports on
      every run, even when the reports are well below context-overflow thresholds.
      A proposed fixed character limit conflicts with an unlimited requirement to
      preserve every gap paragraph and metric. Keyword matching for unavailable
      data is not a canonical coverage source. A model-written brief can omit or
      forge required content, and token/cost benefit has not been measured.
    statement: >-
      The system MUST define one downstream context-delivery policy for the Bull Researcher, Bear Researcher, and the three risk debaters only. Those five roles receive a downstream_brief of analyst reports; all other roles, the full reports, formal records, history retrieval, and recovery material keep their existing full inputs. The brief is a downstream view, not a formal artifact and not a second context authority. The brief contains mandatory non-compressible content and compressible narrative. Mandatory content includes the program-generated canonical coverage-gap summary from the FR-03 availability state, the FR-07 required metric block and source references, and the applicable safety constraints. Compressible narrative includes stance, key levels or triggers, and conclusion. Gap information MUST NOT be derived by matching English words such as unavailable in report text; it comes from the canonical availability state. A model-generated brief MUST be checked for required fields and source references; passing a length limit alone is not proof of fidelity. The brief budget has separate mandatory and compressible budgets and is governed by a versioned brief_budget_policy. Mandatory content is reserved first and is never truncated. The policy MUST define one ordered resolution sequence and its conditions: expand the total budget up to the recorded hard cap when expansion is allowed; otherwise use a downstream-resolvable reference when reference fallback is allowed; otherwise use the full report only when it fits the existing context hard cap; otherwise reject with BRIEF_REJECTED. A reference must be resolvable by the receiving consumer; an unresolvable path string is invalid. Full-report fallback MUST NOT bypass the existing context hard cap, and if neither the brief, reference, nor full report can be safely accommodated, the policy MUST reject rather than truncate mandatory content. Character limits are auxiliary and measured after Unicode normalization. Token measurement uses the selected model or tokenizer. Missing, duplicate, forged, or overlong markers use the policy's deterministic fallback or rejection path. The brief's source summary, policy version, mandatory-content digest, omitted compressible-content identifiers, budget decision, fallback reason, and reference handle are written to a separate context_audit_metadata object. The full report, formal record, history, and recovery material are unchanged. Token change and local cost attribution are evaluated separately in CR-01; this requirement does not claim a saving. The active brief evaluation contract is docs/req/evaluation/brief-eval-contract-v2.json; FR-08 itself makes no cost, token, or whole-application saving claim. Deterministic extraction and assembly is the default; model summarization is not required. Key numbers are a finite set drawn from the metric block, canonical gaps, and declared sources, not every number in the report. A reference branch is available only when a real consumer resolves it; otherwise it is rejected, not successful. BRIEF_REJECTED is terminal and no incomplete context is used. Byte-identical output is claimed only when normalized output equals input and mandatory content is already present; otherwise semantic preservation is required. FR-08 functional acceptance does not wait for quality or cost optimization thresholds; those are CR-01.
    fit_criterion:
      - id: FR-08-AC1
        input: "Report fixtures with a valid brief marker, a missing marker, duplicate markers, a forged marker claiming a value absent from canonical metrics, an overlong marker block, Unicode text, a short report that already contains all mandatory content, and a short report missing mandatory content."
        expected_result: "A valid single marker is extracted. Missing, duplicate, forged, or overlong markers use the deterministic fallback or a typed rejection. A short report is byte-identical only when its complete delivery already satisfies all mandatory content and needs no normalization; otherwise the narrative may remain unchanged as a separate layer while mandatory content is injected, the total budget is counted, and byte-identical is not claimed. Output never exceeds the applicable total/hard budget after mandatory reservation. Unicode normalization is deterministic; forged metrics or sources are not admitted; panic or untyped failure = 0. Byte-identical is conditional on normalized equality and complete mandatory content."
        verification: "Offline extractor/fallback tests over marker, Unicode, short-complete, and short-missing-mandatory cases; assert typed outcomes, mandatory reservation/injection, budget, and no forged content."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-08-AC2
        input: "A fixture with canonical coverage gaps, the FR-07 metric block, source references, safety constraints, a long compressible narrative, and variants where mandatory content exceeds the total budget, exceeds the hard cap, has an allowed resolvable reference, has a full report within the context hard cap, and has none of those safe options."
        expected_result: "Canonical gaps come from the FR-03 availability state, not keyword matching. Mandatory content is preserved verbatim. Compressible narrative is reduced only after mandatory reservation. The policy's ordered resolution is followed exactly: mandatory content above the hard cap is rejected without trying a reference; otherwise expansion up to the hard cap if allowed; otherwise a downstream-resolvable reference whose payload counts against the context hard cap; otherwise full report only when it fits the existing context hard cap; otherwise BRIEF_REJECTED. Unresolvable references, reference payloads that exceed the context hard cap, and full reports exceeding the context hard cap are rejected; mandatory drops = 0. If no consumer supports the reference, the branch is unavailable and must not be reported as success."
        verification: "Offline budget fixture against docs/req/fixtures/brief_budget_policy_v1.json with canonical gaps, metric block, expansion/reference/full-report/rejection cases, and keyword-only negative control; assert each policy branch and mandatory preservation."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: FR-08-AC3
        input: "The five downstream role prompts, the Portfolio Manager, analyst, memory, history, and recovery readers, with full-report copies captured before and after brief generation, plus the context_audit_metadata."
        expected_result: "Only Bull Researcher, Bear Researcher, and the three risk debaters receive downstream_brief. Other roles keep their existing full inputs. Full report fields, formal records, history results, and recovery material are byte-identical before and after brief generation. Source summary, policy version, mandatory digest, omitted compressible identifiers, budget decision, fallback reason, and reference handle are recorded in separate context_audit_metadata. The brief is not a formal artifact and does not create a second context source."
        verification: "Prompt-builder and artifact-copy integration tests with exact role mapping, before/after byte comparison, and audit-metadata assertions."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: FR-08-AC4
        input: "Deterministic and model-generated briefs with key numbers, canonical gaps, source references, and safety constraints; a model-forged required field. Quality and cost optimization thresholds are not part of this functional criterion."
        expected_result: "Every mandatory key number, canonical gap, source reference, and safety constraint is preserved and traceable. A model brief missing or forging a required field is rejected or falls back; length alone never proves fidelity. Safety escapes = 0. Omitted compressible content and audit metadata are recorded. BRIEF_REJECTED is terminal; no post-rejection bypass. Quality and cost optimization are CR-01 and do not block FR-08 functional acceptance."
        verification: "Fidelity, gap-preservation, forged-field, approved-threshold, unapproved-threshold, quality, and safety tests over model and fallback briefs."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
    tradeoff: Prioritize mandatory content, fidelity, safety, and bounded context. Local cost attribution and any approved target are CR-01; CR-01 uses brief-eval-contract-v2. This requirement makes no cost, token, or whole-application saving claim. Full reports and formal artifacts remain unchanged.
    implementation_dependencies: [FR-02, FR-03, FR-07, SB-01, INV-01, SR-01]
    constraint_relations:
      - FR-01
      - SB-01
      - INV-01
      - SR-01
      - CR-01
    conflicts:
      - 'A fixed length limit conflicts with unlimited mandatory content. Resolution: separate mandatory and compressible budgets; never truncate mandatory content.'
      - 'Briefs can omit or forge gaps and metrics. Resolution: canonical gaps, metric block, sources, and safety constraints are mandatory and validated.'
      - 'Keyword matching can miss or invent gaps. Resolution: read the canonical FR-03 availability state.'
      - 'A brief can become a second context authority. Resolution: it is a downstream view only; full reports and formal artifacts remain unchanged.'
      - 'Context reduction can lower quality. Resolution: quality and safety gates are preserved; cost/quality evaluation is CR-01.'
    assumptions:
      - Only the five named debate roles use the brief; all other roles keep full inputs.
      - The brief is a view, not a formal artifact or formal context source.
      - Character limits are auxiliary; token measurement uses the selected model or tokenizer.
      - Token/cost improvement is evaluated in CR-01 and is not claimed here.
    notes: >-
      FR-08 is the corrected functional form of the reviewed personal CR-01 proposal; that source artifact is not retained. AC5 moved to CR-01. The active evaluation contract is v2; v1 is historical. No implementation or measured benefit is claimed. Removing existing branches would change scope; simplification is a proposal, not done here.
  - id: PR-01
    type: performance
    title: Bounded run-record write and end-to-end overhead
    priority: Should
    status: draft
    stakeholders:
      - reviewer
      - operator
    sources:
      origin: Split from FR-02-AC8; baseline run and manifest contract
      evidence:
        - path: baseline/runs/baseline-20261020-01/metrics.json
          locator: duration and call counters
          description: Measured baseline duration and counters used to define the overhead scenario; no manifest-overhead measurement exists.
          source_type: measured_baseline
        - path: docs/req/run-manifest-schema.json
          locator: root contract
          description: Manifest payload and lifecycle record exercised by the write-overhead benchmark.
          source_type: document
        - path: TradingAgents/tradingagents/graph/trading_graph.py
          locator: propagate and _run_graph
          description: Run lifecycle where startup and terminal manifest writes occur.
          source_type: code
    problem: FR-02 requires a lifecycle manifest, but the cost of writing it is not measured. Without a paired benchmark and a fixed payload, a write-time or end-to-end overhead claim is not trustworthy.
    statement: Under a fixed one-ticker, one-round workload and a manifest payload at most 256 KiB, collect 20 enabled-run startup manifest write samples and 20 enabled-run terminal manifest write samples separately. Each write sample starts at serialization start and ends at temp-file flush/fsync before the corresponding final atomic replace; it is a pre-replace write-phase duration, not the complete durable write including replace. The nearest-rank p95 of each write sample set MUST be at most 100 ms. For the end-to-end overhead, run 20 enabled/disabled pairs in alternating order under the same fixed conditions and measure external duration from process start to the return of the final manifest replace. For pair i, absolute_overhead_i = enabled_duration_i - baseline_duration_i and overhead_percent_i = absolute_overhead_i / baseline_duration_i x 100, with baseline_duration_i > 0. Compute nearest-rank p95 separately for the absolute samples (at most 1 second) and the percent samples (at most 1%). Negative differences MUST be retained, not clipped to zero or deleted. All samples, pairing order, payload size, environment, and p50/p95/max are recorded. Thresholds are provisional and do not block functional acceptance. The workload is a fixed offline replay. Write samples may reuse the enabled paired runs. The no-op baseline ends at the same logical endpoint but does not wait for a replace that does not occur.
    fit_criterion:
      - id: PR-01-AC1
        input: Twenty enabled runs of the fixed one-ticker, one-round workload with a manifest payload at most 256 KiB; each run records startup_manifest_write_seconds from serialization start through temp-file flush/fsync before the startup atomic replace. The final replace is excluded from this sample. The workload is a fixed offline replay.
        expected_result: Nearest-rank p95 of the 20 startup write samples is at most 100 ms; N, p50/p95/max, payload size, environment, and the pre-replace boundary are recorded. Samples may be reused from the enabled side of the paired runs.
        verification: External harness with monotonic phase timing over 20 independent enabled runs; report every sample; assert the boundary and nearest-rank p95.
        metric: startup_manifest_write_p95_seconds
        operator: <=
        threshold: 0.1
        unit: seconds
        zero_tolerance: false
        measurement_status: not_measured
        threshold_status: provisional
      - id: PR-01-AC2
        input: Twenty enabled runs of the same fixed workload and payload; each run records terminal manifest_write_seconds from serialization start through temp-file flush/fsync before the terminal atomic replace. The final replace is excluded from this sample. The workload is a fixed offline replay.
        expected_result: Nearest-rank p95 of the 20 terminal write samples is at most 100 ms; N, p50/p95/max, payload size, environment, and the pre-replace boundary are recorded. Samples may be reused from the enabled side of the paired runs.
        verification: External harness with monotonic phase timing over 20 independent enabled runs; report every sample; assert the boundary and nearest-rank p95.
        metric: terminal_manifest_write_p95_seconds
        operator: <=
        threshold: 0.1
        unit: seconds
        zero_tolerance: false
        measurement_status: not_measured
        threshold_status: provisional
      - id: PR-01-AC3
        input: Twenty enabled/disabled pairs in alternating order under the same fixed workload; external duration is measured from process start to the return of the final manifest replace. For pair i, absolute_overhead_i = enabled_duration_i - baseline_duration_i and overhead_percent_i = absolute_overhead_i / baseline_duration_i x 100; baseline_duration_i > 0. The no-op baseline ends at the same logical endpoint without waiting for a replace.
        expected_result: Nearest-rank p95 of the 20 overhead_percent samples is at most 1%; all samples, including negative differences, are retained and reported; no clipping, deletion, or zero substitution; pairing order, p50/p95/max, and environment are recorded.
        verification: External paired benchmark; compute absolute and percent samples separately; assert baseline > 0, retained negative samples, and nearest-rank p95.
        metric: end_to_end_overhead_p95_percent
        operator: <=
        threshold: 1.0
        unit: percent
        zero_tolerance: false
        measurement_status: not_measured
        threshold_status: provisional
      - id: PR-01-AC4
        input: The same 20 enabled/disabled pairs and external-duration boundary; absolute_overhead_i = enabled_duration_i - baseline_duration_i. The no-op baseline ends at the same logical endpoint without waiting for a replace.
        expected_result: Nearest-rank p95 of the 20 absolute_overhead samples is at most 1 second; all samples, including negative differences, are retained and reported; no clipping, deletion, or zero substitution; pairing order, p50/p95/max, and environment are recorded.
        verification: External paired benchmark; compute absolute samples; assert retained negative samples and nearest-rank p95.
        metric: end_to_end_overhead_p95_seconds
        operator: <=
        threshold: 1.0
        unit: seconds
        zero_tolerance: false
        measurement_status: not_measured
        threshold_status: provisional
    tradeoff: Prioritize bounded, separately measured write phases and an explicit paired overhead formula. Thresholds remain provisional; no write-time or end-to-end overhead claim is made until the benchmark exists. Functional correctness and truthful failure records take precedence.
    implementation_dependencies:
      - FR-02
    constraint_relations:
      - INV-01
    conflicts:
      - 'A startup record adds work before model calls. Resolution: sample startup and terminal writes separately and keep the running record bounded.'
      - 'A single run cannot prove overhead. Resolution: use 20 paired enabled/disabled trials, retain negative samples, and compute absolute and percent p95 separately.'
      - 'The write phase and the complete durable write are different. Resolution: name the pre-replace phase explicitly; the external runtime includes the replace.'
    assumptions:
      - The benchmark uses an approved local environment and a manifest payload at most 256 KiB.
      - The thresholds are provisional until human approval.
    notes: 'Historical source: FR-02-AC8. No benchmark has been run; no overhead claim is made. Provisional thresholds do not block functional correctness.'
  - id: CR-01
    type: cost
    title: Downstream brief local cost attribution and approved target
    priority: Should
    status: draft
    stakeholders:
      - operator
      - reviewer
      - analyst
    sources:
      origin: Split from FR-08-AC5; frozen brief evaluation contract
      evidence:
        - path: docs/req/evaluation/brief-eval-contract-v2.json
          locator: thresholds and token direction
          description: Revised brief evaluation contract; prices, cost threshold, and quality threshold are unapproved and the contract is blocked.
          source_type: document
        - path: baseline/runs/baseline-20261020-01/metrics.json
          locator: tokens_in; tokens_out; llm_calls
          description: Baseline token totals used only as context; no brief benefit is measured.
          source_type: measured_baseline
        - path: TradingAgents/tradingagents/agents/context.py
          locator: report_or_absent
          description: Downstream report-reading boundary whose input tokens the brief changes.
          source_type: code
    problem: A brief can reduce downstream input tokens while adding generation output tokens. Recording token counts does not prove a net cost improvement, and the evaluation contract currently has no approved prices or thresholds.
    statement: 'Under the revised brief on/off evaluation (contract v2) with the same model, configuration, data snapshot, risk policy, and case set, the controlled comparison MUST keep measurement, quality/safety, target attainment, and claim classification distinct. Measurement is correct only when the contract formulas are computed, brief-generation input and output tokens are recorded, retry/fallback occurrences are recorded, downstream input changes are counted under the local scope, downstream output changes and non-brief calls are disclosed as excluded, missing prices produce null cost fields, and no saving is claimed before accepted. The counted metric is a local cost attribution difference, not whole-application net cost. Quality and safety are separate gates: safety escapes MUST be zero and quality loss MUST be at or below the same approved quality_loss_max. Target attainment requires net_cost at or below the approved net_cost_max; null or unapproved thresholds produce blocked, not pass. Target attainment is not a saving claim: a positive difference within a positive budget is budget_met only, zero is not a strict saving, and a negative local difference is local_cost_saving but not whole-application saving. Token change is recorded separately; no token target is approved and token change does not substitute for cost. Blocked, ready, accepted, and failed follow contract v2 evidence checkpoints: blocked when pre-run inputs, snapshots, prices, thresholds, or human approval are missing; ready when pre-run inputs are valid and no result exists for the current attempt; failed when a completed run has missing, corrupt, or inconsistent result evidence or any applicable condition fails; accepted only when the completed run has valid result evidence and every applicable condition passes. Quality or safety failures cannot be offset by cost or token results. A retry or re-evaluation creates a new attempt and preserves prior failed evidence. Usage accounting and target aggregation are defined in contract v2.'
    fit_criterion:
      - id: CR-01-AC1
        input: Controlled brief on/off evaluation under contract v2 with per-node token attribution, brief-generation input and output tokens, input/output prices, retry/fallback records, downstream input difference, and missing-price negatives.
        expected_result: Added output tokens, brief-generation input tokens, reduced downstream input tokens, net tokens, added output cost, reduced input cost saving, and net cost follow the contract formulas; brief-generation input cost and retry/fallback occurrences are recorded even when excluded from net_cost; downstream output changes and non-brief calls are disclosed as excluded; if either price is missing, cost fields are null; no saving is claimed before accepted; formula/field errors = 0. A true zero-generation-call result is distinct from unavailable usage; usage_status is complete, partial, or unavailable.
        verification: Contract-formula checks with missing-price, single-price, excluded-cost, and retry/fallback negatives; record all samples, scope, and digests; fail on any formula or null-handling error.
        metric: measurement_formula_error_count
        operator: ==
        threshold: 0
        unit: errors
        zero_tolerance: true
        measurement_status: not_measured
        threshold_status: not_applicable
      - id: CR-01-AC2
        input: The same controlled brief A/B with safety-escape counters and prohibited-content fixtures.
        expected_result: Safety escapes = 0; no cost or token result can offset a safety escape; the lifecycle state is failed if any escape is observed.
        verification: Dependency and content sentinels on the brief and downstream path; assert zero escapes and failure on any escape.
        metric: safety_escapes
        operator: ==
        threshold: 0
        unit: escapes
        zero_tolerance: true
        measurement_status: not_measured
        threshold_status: not_applicable
      - id: CR-01-AC3
        input: Brief evaluation cases covering missing pre-run inputs, pre-run valid with no result, completed run with missing/corrupt result evidence, quality pass/fail, and all conditions passing.
        expected_result: Missing snapshots, prices, thresholds, or approval -> blocked; pre-run valid with no result -> ready; completed run with missing, corrupt, or inconsistent result evidence -> failed, not ready; quality_loss > approved quality_loss_max -> failed; all applicable conditions pass -> accepted; accepted is not defined as a prerequisite of itself; blocked status preserves observed failures rather than hiding them. Attempt inputs, contract version, and digests are fixed at attempt start; later configuration changes do not revert a terminal attempt. A ready attempt may have null result_digest; a completed run with missing result_digest is failed.
        verification: 'Contract state-machine check over the fixture and validator: assert blocked/ready/accepted/failed, result-evidence handling, and observed-failure preservation.'
        metric: quality_loss
        operator: <=
        threshold_ref: docs/req/evaluation/brief-eval-contract-v2.json#/thresholds/quality_loss_max
        unit: rubric points
        zero_tolerance: false
        measurement_status: not_measured
        threshold_status: provisional
      - id: CR-01-AC4
        input: Ready-state cost evaluation with approved prices and net_cost_max, including below, at, and above the cost boundary, positive/zero/negative net_cost samples, and token changes.
        expected_result: accepted requires net_cost <= approved net_cost_max; the equality boundary is accepted; above the boundary is failed; null or unapproved net_cost_max yields blocked; a positive difference within a positive budget is budget_met only, not a saving; zero is not a strict saving; a negative local difference is local_cost_saving, not whole-application saving; token change is recorded separately and does not replace cost. The target compares the aggregate local cost attribution over the included fixed samples, not a per-case mean unless a new contract version says otherwise. The target is the total (sum) local cost attribution over all included samples, not a per-case mean.
        verification: Cost target boundary, blocked-threshold, zero/positive/negative, and token-substitution negatives against contract v2; record net_tokens and net_cost separately.
        metric: net_cost_usd
        operator: <=
        threshold_ref: docs/req/evaluation/brief-eval-contract-v2.json#/thresholds/net_cost_max
        unit: USD
        zero_tolerance: false
        measurement_status: not_measured
        threshold_status: provisional
      - id: CR-01-AC5
        input: 'Claim-classification cases: positive cost within a positive budget; zero difference; negative local difference; token reduction with non-negative cost; quality failure; safety escape.'
        expected_result: Positive within-budget => budget_met only; zero => no strict saving; negative => local_cost_saving with no whole-application saving claim; token reduction => token_reduction, no whole-application saving; quality or safety failure => failed and cannot be offset by cost or token results; claim_boundary_violation_count = 0.
        verification: Static claim-rule checks over the revised state fixture; assert budget/target, local saving, token reduction, zero difference, and no whole-application claim.
        metric: claim_boundary_violation_count
        operator: ==
        threshold: 0
        unit: violations
        zero_tolerance: true
        measurement_status: not_measured
        threshold_status: not_applicable
    tradeoff: Prioritize measurement correctness, zero safety escapes, quality preservation, an explicitly approved local cost target, and truthful claim boundaries. The target is blocked until prices and net_cost_max are approved. Budget attainment is not a saving claim; local saving is not whole-application saving; no token target or whole-application claim is made.
    implementation_dependencies:
      - FR-02
      - FR-08
    constraint_relations:
      - SB-01
      - INV-01
    conflicts:
      - 'Recording token counts can look like a saving. Resolution: separate measurement, quality/safety, target attainment, and claim classification; require an approved net_cost_max and actual net_cost at or below it.'
      - 'Quality can degrade while tokens fall. Resolution: require zero safety escapes and an approved quality_loss_max before acceptance.'
      - 'A local attribution can be mistaken for whole-application cost. Resolution: label the scope local, disclose excluded terms, and never claim whole-application saving.'
    assumptions:
      - The revised brief evaluation contract v2, its prices, and its thresholds are pending human approval.
      - Token counting follows the FR-02 boundary.
      - The measurement scope is local cost attribution; whole-application cost is not claimed.
      - Brief-generation input cost, retry/fallback calls outside the counted generation call, downstream output changes, non-brief calls, and infrastructure are excluded and disclosed.
    notes: 'Historical source: FR-08-AC5. Contract v2 is a revision draft; v1 is retained unchanged. The contract is blocked; no cost or token benefit is measured or claimed. Expanding to full brief-call cost is a pending decision, not approved here.'
  - id: GR-01
    type: governance
    title: Frozen independent reference set for financial metrics
    priority: Must
    status: draft
    stakeholders:
      - reviewer
      - analyst
    sources:
      origin: Split from FR-07-AC10; baseline financial evidence
      evidence:
        - path: baseline/runs/baseline-20261020-01/transcripts/final_state.json
          locator: fundamentals_report
          description: Baseline report showing the +68.6% versus +105.9% discrepancy that motivates independent reference values.
          source_type: measured_baseline
        - path: TradingAgents/tradingagents/dataflows/vendors/sec_edgar.py
          locator: get_income_statement; get_cashflow
          description: Structured filing source whose expected values must be independently recorded.
          source_type: code
    problem: FR-07 needs reference values that are independent of the implementation under test. Without a frozen reference set, a matching result could be generated by the same code and would not validate correctness.
    statement: 'GR-01 has two stages. Stage A, pre-implementation freeze readiness, MUST pass before FR-07 implementation starts: the reference manifest exists and is complete with at least two non-NVDA companies, distinct fiscal calendars, explicit periods, independently published sources, and every expected value with a locatable independent source and reviewable provenance; the freeze status, freeze time, and digest are valid; and the required human review is complete. The absence of an FR-07 implementation record is not missing evidence and does not prevent A from passing. Stage B, post-implementation timing compliance, applies only after FR-07 implementation starts: the first related implementation record MUST be later than the valid freeze, the reference version used MUST match the frozen version, no retroactive freeze may be used to disguise test-first evidence, and a reference change MUST be re-reviewed and versioned. FR-07 MUST list GR-01 as an implementation prerequisite and MUST NOT start implementation or acceptance until A passes; GR-01 does not depend on FR-07 having been implemented. A missing or incomplete manifest MUST fail, not pass vacuously. Source independence and non-code generation are subject to recorded evidence plus human review; a machine check proves presence, consistency, and ordering, not business independence. Implementation start means related application implementation, not a documentation revision.'
    fit_criterion:
      - id: GR-01-AC1
        input: A reference manifest with at least two non-NVDA companies, distinct fiscal calendars, explicit periods, and independent source locators; missing, empty, and one-company negatives.
        expected_result: The manifest exists and contains at least two non-NVDA companies, distinct fiscal calendars, explicit periods, and source locators; missing or incomplete manifests fail and do not pass vacuously.
        verification: Machine parse for presence, count, calendar distinctness, period explicitness, and locators; human review of adequacy.
        metric: reference_company_count
        operator: '>='
        threshold: 2
        unit: companies
        zero_tolerance: true
        measurement_status: not_measured
        threshold_status: not_applicable
      - id: GR-01-AC2
        input: Each expected value with a locatable source record containing publisher or source identity, URL or document locator, version or retrieval date, and digest; missing-source negatives.
        expected_result: Every expected value has a locatable source record; machine checks confirm presence, locator shape, and digest consistency; human review confirms the source is independent and supports the value; any missing source fails. The manifest digest projection excludes the manifest's own digest field to avoid self-hashing.
        verification: Machine presence/locator/digest check plus human source-independence review; record the reviewer and evidence; machine passing alone does not prove independence.
        metric: expected_value_source_coverage_ratio
        operator: ==
        threshold: 1.0
        unit: ratio
        zero_tolerance: true
        measurement_status: not_measured
        threshold_status: not_applicable
      - id: GR-01-AC3
        input: Per-value provenance records and dependency sentinels around the implementation under test; missing-manifest negative.
        expected_result: code_generated_expected_value_count = 0 only after the manifest exists; a missing manifest fails regardless of the zero counter; machine checks recorded provenance and forbidden calls; human review confirms the generator is independent; no vacuous pass.
        verification: Machine provenance/sentinel check plus human review; missing-manifest negative must fail.
        metric: code_generated_expected_value_count
        operator: ==
        threshold: 0
        unit: values
        zero_tolerance: true
        measurement_status: not_measured
        threshold_status: not_applicable
      - id: GR-01-AC4
        input: 'Stage A readiness: reference manifest, per-value sources/provenance, freeze status/time/digest, and human review; no FR-07 implementation record is required.'
        expected_result: No FR-07 implementation record is required for Stage A. Stage A passes before implementation starts when the manifest is complete, sources and values are recorded, freeze status/time/digest are valid and digest-matched, and human review is complete; absence of an implementation record is not missing evidence; missing or incomplete material fails. The manifest content digest is computed over the projection that excludes its own digest field.
        verification: Machine completeness/digest/human-review-record check; pre-implementation negative case must pass without any implementation record, and missing material must fail.
        zero_tolerance: true
        measurement_status: not_measured
        threshold_status: not_applicable
      - id: GR-01-AC5
        input: 'Stage B timing: FR-07 implementation not started; first implementation record after freeze; first record before freeze; reference-version mismatch; post-freeze change without re-review. Implementation start means related application implementation, not a documentation revision.'
        expected_result: If implementation has not started, Stage B is not_applicable and does not block Stage A. Once implementation starts, the first related implementation record is later than the valid freeze, the used reference version matches the frozen version, no retroactive freeze is used, and a reference change is re-reviewed and versioned; early, mismatched, retroactive, or unversioned cases fail.
        verification: Implementation-record ordering/version check; pre-start not_applicable case and post-start early/mismatch/retroactive negatives.
        zero_tolerance: true
        measurement_status: not_measured
        threshold_status: not_applicable
      - id: GR-01-AC6
        input: The implementation-dependency graph and FR-07 gate state.
        expected_result: FR-07 lists GR-01 as an implementation prerequisite; GR-01 does not depend on FR-07; FR-07 implementation and acceptance are blocked until Stage A passes; dependency_gate_violation_count = 0.
        verification: Dependency-graph and gate-state check; assert direction, no cycle, and blocked state before Stage A passes.
        metric: dependency_gate_violation_count
        operator: ==
        threshold: 0
        unit: violations
        zero_tolerance: true
        measurement_status: not_measured
        threshold_status: not_applicable
    tradeoff: Prioritize independent, auditable expected values and a satisfiable implementation gate. Stage A can pass before FR-07 exists; Stage B applies only after implementation starts. Missing evidence fails rather than passing vacuously. Human review, not the script, decides source independence.
    implementation_dependencies: []
    constraint_relations:
      - FR-07
    conflicts:
      - 'A code-generated reference would be circular. Resolution: freeze independent sources and values before implementation and record provenance.'
      - 'A missing manifest could make a zero counter look clean. Resolution: require manifest presence before evaluating code_generated_expected_value_count.'
      - 'A pre-implementation timing check could block forever. Resolution: make Stage A pass without an implementation record and apply Stage B only after implementation starts.'
    assumptions:
      - The reference companies, periods, and sources are a human decision (OQ-14).
    notes: 'Historical source: FR-07-AC10. Contract direction: FR-07 depends on GR-01 Stage A, never the reverse. Stage B is post-implementation timing only. The reference set is not frozen and no companies or values are chosen here; OQ-14 remains blocking.'
  - id: QR-01
    type: quality
    title: Live cache A/B quality non-regression and risk-policy evaluation separation
    priority: Should
    status: draft
    stakeholders:
      - analyst
      - reviewer
      - trader
    sources:
      origin: Split from FR-01-AC7 and FR-04-AC11; frozen behavior-evaluation contract
      evidence:
        - path: docs/req/evaluation/behavior-eval-contract-v1.json
          locator: thresholds and blocking rules
          description: Frozen contract with live quality thresholds and snapshot/human-approval blocking conditions.
          source_type: document
        - path: docs/req/evaluation/eval-set-v1.json
          locator: cases
          description: Frozen evaluation cases including the baseline NVDA case.
          source_type: document
        - path: baseline/runs/baseline-20261020-01/metrics.json
          locator: llm_calls and tokens
          description: Baseline context for the A/B workload; no live A/B result exists.
          source_type: measured_baseline
    problem: 'The cache A/B has two different questions: whether fixed replay and gate outcomes stay identical, and whether live model sampling degrades beyond the approved quality limit. Mixing them, or attributing a risk-policy REVIEW increase to cache regression, produces an invalid comparison.'
    statement: Given that FR-01-AC6 passes for deterministic fixed replay, live model sampling MUST keep mean rubric drop at most 0.5, no single case drop over 1.0, and live REVIEW-rate increase at most 10 percentage points. Unsafe output escapes MUST remain zero. The cache A/B MUST hold the risk policy snapshot, risk inputs, and gate version fixed. Risk-policy effects MUST be evaluated in a separate comparison under fixed cache, model, and data settings with its own thresholds; a risk-policy REVIEW increase MUST NOT be scored as a cache regression. If the risk-policy thresholds are not approved, that comparison remains blocked rather than reusing the cache A/B thresholds. Acceptance is blocked until every case snapshot, the fixed contract, and human approval are present. Rubric direction is higher-is-better; aggregation is the fixed-case mean. One scored sample per case per condition is required; infrastructure retries are recorded without replacing the original failed sample, and minimum-of-repeats is not used. REVIEW-rate uses completed evaluable cases with error or missing-score runs recorded and not silently dropped.
    fit_criterion:
      - id: QR-01-AC1
        input: Live A/B on the frozen eval set with identical model, configuration, prompts, data snapshots, risk policy, and gate version, cache enabled versus disabled; FR-01-AC6 passes.
        expected_result: Mean rubric drop at most 0.5; per-case, REVIEW-rate, safety, and risk-policy separation are judged by separate fit criteria. Higher rubric is better; the mean is over the fixed cases; one scored sample per case per condition is required; infrastructure retries do not replace the original failed sample.
        verification: Run the frozen A/B; validate the contract and snapshots; record aggregate scores and deltas; fail on a mean-drop breach.
        metric: mean_rubric_drop
        operator: <=
        threshold: 0.5
        unit: rubric points
        zero_tolerance: false
        measurement_status: not_measured
        threshold_status: provisional
      - id: QR-01-AC2
        input: The same live A/B, inspected per case; FR-01-AC6 passes.
        expected_result: No single case rubric drop over 1.0; mean, REVIEW-rate, safety, and separation are judged separately. The per-case statistic is the single scored sample for that case; infrastructure retries do not replace the original failed sample.
        verification: Per-case score comparison; fail on a per-case breach.
        metric: per_case_rubric_drop_max
        operator: <=
        threshold: 1.0
        unit: rubric points
        zero_tolerance: false
        measurement_status: not_measured
        threshold_status: provisional
      - id: QR-01-AC3
        input: The same live A/B with REVIEW-rate counters; FR-01-AC6 passes.
        expected_result: Live REVIEW-rate increase at most 10 percentage points; mean, per-case, safety, and separation are judged separately. REVIEW-rate denominator is completed evaluable cases; error and missing-score runs are recorded and not silently dropped. If required samples are missing, the evaluation is incomplete and cannot be accepted; failed cases are not deleted to claim a pass.
        verification: REVIEW-rate comparison; fail on a rate breach.
        metric: live_review_rate_increase
        operator: <=
        threshold: 10
        unit: percentage points
        zero_tolerance: false
        measurement_status: not_measured
        threshold_status: provisional
      - id: QR-01-AC4
        input: Cache-enabled versus cache-disabled comparison with the risk policy snapshot, risk inputs, model, data, and gate version fixed; a separate risk-policy comparison with its own approval state; FR-01-AC6 passes.
        expected_result: Cache conclusions are unchanged when risk policy is held fixed; the separate risk-policy comparison uses its own thresholds and remains blocked when they are not approved; it is not scored as a cache regression; cache_risk_misclassification_count = 0. Risk-policy thresholds are separate and remain blocked if unapproved.
        verification: Deterministic behavior-evaluation matrix with fixed-risk cache A/B and separate risk-policy A/B; assert separation, blocked state, and no misclassification.
        metric: cache_risk_misclassification_count
        operator: ==
        threshold: 0
        unit: misclassifications
        zero_tolerance: true
        measurement_status: not_measured
        threshold_status: not_applicable
      - id: QR-01-AC5
        input: The same live A/B with unsafe-output and gate-escape sentinels across all cases.
        expected_result: unsafe_output_escape_count = 0; no quality improvement or token reduction can offset a safety escape; any escape fails acceptance.
        verification: Dependency and safety sentinels on the live A/B; assert zero escapes and failure on any escape.
        metric: unsafe_output_escape_count
        operator: ==
        threshold: 0
        unit: escapes
        zero_tolerance: true
        measurement_status: not_measured
        threshold_status: not_applicable
    tradeoff: Prioritize zero safety escapes and deterministic fixed replay from FR-01-AC6. Live quality is judged by separate mean, per-case, and REVIEW-rate criteria; risk-policy comparison isolation uses its own thresholds. No live measurement is claimed.
    implementation_dependencies:
      - FR-01
      - FR-04
    constraint_relations:
      - INV-01
      - INV-02
      - SB-01
    conflicts:
      - 'Live sampling noise can look like a cache regression. Resolution: FR-01-AC6 owns deterministic replay; QR-01 judges live quality separately.'
      - 'A risk-policy REVIEW increase can be misattributed. Resolution: use a separate comparison with its own thresholds and keep it blocked until approved.'
    assumptions:
      - The frozen v1 eval set, rubric, config, prompt, and snapshot manifest remain unchanged.
      - Human approval and snapshots are required before acceptance.
    notes: 'Historical source: FR-01-AC7 and FR-04-AC11. FR-01-AC6 is the deterministic precondition; QR-01 does not repeat its thresholds. The contract is currently blocked; no live A/B result is claimed. Sampling and aggregation rules must be fixed before evaluation; no live evaluation is run here.'
  - id: QR-02
    type: "performance"
    title: "Bounded startup recovery performance"
    priority: "Must"
    status: "deferred"
    stakeholders: [operator, analyst, reviewer]
    sources:
      origin: "From pxs QR-02, checked against the current source tree"
      evidence:
        - path: "TradingAgents/cli/run.py"
          locator: "_run_directory and run_analysis"
          description: "Current CLI has no recovery batch entry point to benchmark."
          source_type: "code"
        - path: "TradingAgents/tradingagents/reporting.py"
          locator: "write_report_tree"
          description: "Rendering is synchronous and has no measured recovery workload."
          source_type: "code"
        - path: "baseline/runs/baseline-20261020-01/run-manifest.json"
          locator: "all fields"
          description: "Baseline has no archive-recovery batch or performance evidence."
          source_type: "measured_baseline"
    problem: >
      An interrupted publication must be recovered without repeating analysis,
      and the recovery cost needs a fixed workload and measurable target. Without
      a defined platform, filesystem, output size, timing boundary, and failure
      handling, a timing result is not comparable or trustworthy.
    statement: >
      DEFERRED FOR D1. This requirement defines a future recovery-performance
      target and is not part of current acceptance. When activated, on a
      documented supported local filesystem, not limited to Windows/NTFS and
      excluding network or cloud shares, with 100 committed formal publications
      and 10 pending valid recovery snapshots, and with no competing writer,
      startup recovery MUST recover and validate all 10 pending runs without
      LLM, provider, external data, analysis graph, settlement, or reflection
      calls. Each pending snapshot contains the fixed 12-section report map,
      complete report, section manifest, one risk evidence object with policy
      reference, and one required memory idempotent write. Rendered output per
      run is no larger than 1,048,576 bytes, and each snapshot is no larger than
      1,048,576 bytes. Across 30 independently reset trials the nearest-rank p95
      batch duration MUST be at most 2.000 seconds. The 2-second value is a
      provisional target pending human approval, not an approved service level.
      Every trial MUST be correct. Failed, incorrect, and timed-out samples are
      retained and fail acceptance; they MUST NOT be discarded. No validation,
      hash, path, manifest, or read-time check may be skipped to meet the target.
      A missed time target fails this requirement but does not relax correctness
      or the model-free rule.
      Activation requires FR-06 implementation, an approved platform matrix, a
      frozen benchmark fixture, and human approval of the threshold. Until then
      no target is approved, measured, or used for acceptance.
      The timed boundary starts at the monotonic timer immediately before
      recovery claim and scan, and ends after final read-time retrieval
      validation of every recovered run, including lock acquisition, scans,
      fixed 12-section rendering, risk evidence handling, publication, the required
      memory write, and cleanup attempts. Record platform and OS, CPU/RAM, filesystem and mount,
      rendered output and snapshot sizes, section count, fixture version, source
      commit, all 30 samples, and failure handling.
    fit_criterion:
      - id: QR-02-AC1
        input: "Thirty independently reset trials with 100 committed publications and 10 pending valid snapshots; each pending snapshot contains the fixed 12-section report map, complete report, section manifest, one risk evidence object with policy reference, and one required memory idempotent write; rendered output per run <= 1,048,576 bytes, snapshot <= 1,048,576 bytes, documented supported local filesystem, no competing writer."
        expected_result: "All 300 recoveries pass normal get_run validation; forbidden LLM/provider/external/graph/settlement/reflection calls = 0; the required memory operation is idempotent; the 29th sorted batch duration is <= 2.000 seconds as a provisional target; any incorrect, failed, or timed-out trial fails acceptance; all samples and environment/output/section-count metadata are recorded; no validation is skipped."
        verification: "Recovery benchmark fixture with fixed 12-section/risk/memory workload and monotonic timing from immediately before claim/scan through final read-time validation; record all 30 samples, failures, platform, CPU/RAM, filesystem, mount, output/snapshot sizes, section count, fixture version, and commit."
        zero_tolerance: false
        measurement_status: "not_measured"
        threshold_status: "provisional"
        metric: recovery_batch_p95_seconds
        operator: <=
        threshold: 2.0
        unit: seconds
      - id: QR-02-AC2
        input: "The same recovery workload, including a slow or failing filesystem trial where the timing target is missed."
        expected_result: "Every completed recovery is correct and passes read-time validation; forbidden LLM/provider/external/graph/settlement/reflection calls = 0; no validation, hash, path, manifest, or read-time check is skipped even when the 2.000-second target is missed. Any incorrect, failed, or timed-out recovery fails acceptance. Correctness and model-free violations = 0."
        verification: "Slow/failing-filesystem correctness test with dependency sentinels, read-time validation assertions, and retained failure samples."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
        metric: incorrect_or_failed_recovery_count
        operator: ==
        threshold: 0
        unit: recoveries
    tradeoff: Prioritize correctness, model-free behavior, and the deliverable D1 scope. The 2.000-second target, 30-trial benchmark, and platform matrix are deferred until FR-06 exists and the platform and threshold are approved. Performance work must not skip validation.
    implementation_dependencies: [FR-05, FR-06]
    constraint_relations: [INV-01, SR-01]
    conflicts:
      - "Correctness checks and hashing cost time. Resolution: correctness and model-free behavior are zero-tolerance; the 2-second target is provisional and cannot justify skipping validation."
      - "A single-platform measurement can overfit. Resolution: require a documented supported local filesystem, not Windows/NTFS as the sole platform."
      - "Slow or failed trials can distort a p95. Resolution: retain every sample, record failures and timeouts, and fail acceptance when any trial is incorrect or timed out."
    assumptions:
      - The 2-second target is a provisional design target pending human approval.
      - The workload uses local storage only; network and cloud shares are out of scope.
      - The environment metadata and fixture version are recorded with every run.
      - D1 recovery is single-process; the benchmark measures the FR-06 recovery path.
    notes: >-
      QR-02 is deferred in this revision. The fixed workload, 30 trials, and nearest-rank p95 definition are retained as a future benchmark contract. The 2-second target remains provisional. The pxs Windows/NTFS assumption is not promoted to a project-wide platform restriction. Reactivation requires FR-06, an approved platform matrix, a frozen fixture, and human approval. No implementation, benchmark, or approved target is claimed. Must priority is within the deferred specification and is not a current gate; a future benchmark must not reintroduce active claim/fencing requirements.
  - id: SB-01
    type: "invariant"
    title: "Deterministic fail-closed final-output gate with a separated model proposal"
    priority: "Must"
    status: "draft"
    stakeholders: [trader, reviewer, security_reviewer]
    sources:
      origin: "Repository analysis and measured baseline"
      evidence:
        - path: "TradingAgents/tradingagents/agents/rating.py"
          locator: "L96-L117 parse_rating, run_rating, is_review"
          description: "The current rating path parses a rating and returns REVIEW only when no rating can be read; REVIEW is already a terminal sentinel outside the five-tier set."
          source_type: "code"
        - path: "TradingAgents/tradingagents/agents/managers/portfolio_manager.py"
          locator: "L80-L103 invoke_structured"
          description: "The Portfolio Manager produces the final structured decision and writes final_rating/final_trade_decision directly; no data-coverage gate is applied."
          source_type: "code"
        - path: "TradingAgents/tradingagents/graph/trading_graph.py"
          locator: "L358-L370 record_decision and L437-L465 _log_state"
          description: "The decision is persisted to the state log and memory before any coverage-aware code gate exists."
          source_type: "code"
        - path: "TradingAgents/cli/run.py"
          locator: "L310-L340 streaming display and L380-L385 review notice"
          description: "The CLI streams and displays the Portfolio Manager output before any formal gate, then only warns when a rating is unreadable."
          source_type: "code"
        - path: "TradingAgents/tradingagents/reporting.py"
          locator: "L20-L46 and L92-L119 write_report_tree"
          description: "Reports copy final_trade_decision and the rating header directly; there is no formal blocked-decision body."
          source_type: "code"
        - path: "TradingAgents/tradingagents/memory/log.py"
          locator: "L32-L60 store_decision"
          description: "The memory log stores the model decision and rating tag without a gate result or an explicitly separated unapproved proposal."
          source_type: "code"
        - path: "TradingAgents/tradingagents/backtest.py"
          locator: "L150-L170 propagate calls and L196-L207 scoring"
          description: "Backtest cells call propagate directly and score by rating; REVIEW is excluded from scoring rather than produced by a coverage gate."
          source_type: "code"
        - path: "baseline/runs/baseline-20261020-01/transcripts/final-status.json"
          locator: "final_rating and final_trade_decision"
          description: "The baseline persisted a Hold decision while news and social sources were unavailable; no gate recorded or blocked it."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/results/reports/NVDA_20261020_193209/5_portfolio/decision.md"
          locator: "entire file"
          description: "The saved formal decision is the model's Hold text, with no coverage/gate notice."
          source_type: "measured_baseline"
    problem: >
      The baseline could persist, display, and score a tradeable rating even when
      critical sources were unavailable. The model decision and the formal
      decision were the same text, so a critical-gap REVIEW changed only the
      rating and left the trade recommendation visible as the official
      conclusion. The gate input was not a trusted snapshot, incomplete or
      contradictory inputs had no defined handling, gate failure had no fallback,
      and the gate was not verified across all entry points.
    statement: >-
      Every run MUST produce a formal decision through deterministic gate code from a trusted gate_input containing one immutable coverage_snapshot produced by the availability program and one model_proposal. The gate MUST treat the snapshot as authoritative; the model MUST NOT create, supply, or mutate coverage_status or critical_gaps. The gate MUST return a gate_result with status passed, blocked, or error and reason_codes from the closed gate_reason_code set. The formal decision MUST be approved only when coverage_status is complete, critical_gaps is empty, every critical requirement has an availability record, the critical profile is valid, the snapshot is current, the model rating is one of the five legal ratings, and the FR-04 risk branch is either not_applicable under the allowed conditions or applicable and passed. No formal approval is allowed unless every other required gate, manifest, and security precondition also passes; SB-01 does not override them. Stock Buy or Overweight is always applicable: the gate MUST validate the risk input and record a passed, blocked, or error result even when coverage or another check also blocks. A missing, unsupported, inconsistent, insufficient-cash, or invalid risk input MUST block with portfolio_risk_input_invalid; a risk limit breach MUST block with portfolio_risk_limit_exceeded; neither may be reported as not_applicable. A risk evaluator exception MUST produce gate status error, reason portfolio_risk_evaluator_error, formal_decision.status = blocked_for_review, final_rating = REVIEW, review_class = gate_system_error, a failed run record with error.stage = gate, and no tradeable output. formal_decision.status MUST be approved or blocked_for_review. A critical gap, a model REVIEW, coverage/gap contradiction, malformed or missing input, an invalid critical profile, a missing availability record, a stale or hash-mismatched snapshot, or a gate exception MUST block the formal decision. When blocked, final_rating MUST be REVIEW and the formal decision text MUST use the review_class matched to the primary reason and state that manual review is required; it MUST NOT mislabel a rating/system failure as missing data. The model_proposal MUST be retained separately with proposal_status = unapproved; it MUST NOT be presented as the formal conclusion. The gate MUST run before the terminal manifest and every formal output that contains a formal decision; the running startup manifest may be written before the gate with safety_gate.status = not_run. The independent failed-run manifest and a minimal secret-free security incident record are exceptions that may be written without completing the normal gate. Formal outputs MUST consume the same formal_decision and coverage_snapshot. Intermediate streaming, debug, staging, checkpoint, and raw-agent outputs MAY show the model proposal only when marked intermediate or not approved. The blocked formal text MUST be selected by review_class so a rating anomaly or system failure is not misdescribed as missing data. A gate failure, including an FR-04 evaluator exception, MUST fail closed: status error, final rating REVIEW, a formal gate-unavailable review notice, a failed run record, and no tradeable output. All entry points MUST use the same gate path. Each malformed input maps to exactly one gate status; blocked and error are never interchangeable. Stale snapshot and version/hash mismatch are distinct. The gate produces the formal decision before the terminal manifest; the terminal manifest commit is evaluated after the gate, with no circular wait. The gate makes no model call; scan or write failure cannot publish dangerous formal output. An invalid model rating blocks with invalid_model_rating before the risk branch; no risk result is required and no not_applicable pass is recorded.
    fit_criterion:
      - id: SB-01-AC1
        input: "Five fixtures, one per legal model rating (Buy, Overweight, Hold, Underweight, Sell), each with a valid trusted coverage_snapshot that is partial and contains a critical gap. Buy and Overweight include a valid passed FR-04 risk result under the active policy; Hold, Underweight, and Sell use not_applicable. Every model proposal is valid and its decision text contains a trade recommendation."
        expected_result: "For all five ratings, gate_result.status = blocked, reason_codes contains critical_gap, formal_decision.status = blocked_for_review, final_rating = REVIEW, and the formal decision text uses the data_insufficient review class and states that manual review is required. The passed risk result is recorded for Buy and Overweight but does not override the critical gap. The model_proposal is retained with proposal_status = unapproved and is not presented as the formal conclusion. Non-REVIEW formal ratings = 0; report, manifest, final-state, and memory agree."
        verification: "Integration test over all five ratings, including the applicable passed-risk and not_applicable branches; assert gate result, formal rating and text, proposal separation, risk result presence, and every formal consumer."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: SB-01-AC2
        input: "Five fixtures, one per legal model rating (Buy, Overweight, Hold, Underweight, Sell), each with coverage_status = complete, an empty critical_gaps list, every critical requirement present, a valid profile, and a current snapshot. Buy and Overweight include a valid passed FR-04 portfolio_risk_result under the active policy; Hold, Underweight, and Sell use FR-04 status not_applicable."
        expected_result: "For all five ratings, gate_result.status = passed, formal_decision.status = approved, final_rating equals the model rating, no REVIEW is introduced, and formal decision_text is the approved model decision text. For Buy and Overweight the passed risk result is recorded and does not change the rating; for the other three ratings the not_applicable result does not block. Rating changes = 0; report, manifest, final-state, and memory agree."
        verification: "Integration test over all five ratings, including the applicable FR-04 pass and not_applicable branches; assert gate result, unchanged rating, approved formal text, risk result presence, and every formal consumer."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: SB-01-AC3
        input: "A fixture with coverage_status = complete and an empty critical_gaps list, where the model proposal itself returns REVIEW and REVIEW text."
        expected_result: "Gate_result.status = blocked with reason_codes containing model_review; formal_decision.status = blocked_for_review; final_rating = REVIEW; the formal text is the deterministic review notice; REVIEW is not converted to Hold and is not treated as a passed five-tier rating; the model proposal is retained as REVIEW with proposal_status = unapproved; tradeable formal ratings = 0."
        verification: "Unit test for the model-REVIEW case plus integration through the formal consumers; assert gate status, final rating, text, and proposal status."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SB-01-AC4
        input: "Two independent fixtures, each with a Hold model rating and no FR-04 risk requirement: one with coverage_status = complete and a non-empty critical_gaps list; one with coverage_status = partial and an empty critical_gaps list."
        expected_result: "Both fixtures are blocked with reason_codes containing coverage_gap_mismatch; formal_decision.status = blocked_for_review; final_rating = REVIEW; the formal text uses the coverage-inconsistency review class, not a generic data-insufficient message; neither is passed or treated as a complete/partial five-tier decision; tradeable formal ratings = 0."
        verification: "Separate unit tests for each contradiction plus integration through the formal consumers; assert each case independently."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SB-01-AC5
        input: "A table of independent malformed-input fixtures with a Hold model rating where the rating is otherwise valid: illegal coverage_status value; missing critical_gaps; critical_gaps of the wrong type; a critical requirement with no availability record; an invalid critical profile; a missing or invalid model rating; a missing gate_input; an unsupported profile version; and an unsupported snapshot schema version."
        expected_result: "Each fixture has exactly one status from the SB-01 decision table: invalid_coverage_status, missing_gap_list, invalid_gap_type, missing_availability_record, invalid_critical_profile, invalid_model_rating, and missing_gate_input are blocked with their table review_class and formal_decision.status = blocked_for_review, final_rating = REVIEW. No fixture produces a tradeable formal rating. Cases are tested separately; mismatches = 0. blocked-or-error is not allowed."
        verification: "Table-driven unit tests for every malformed input plus integration through the formal consumers; assert each reason code independently."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SB-01-AC6
        input: "Hold-rating fixtures where the model output attempts to supply or alter coverage_status and critical_gaps; a snapshot with a stale version; a snapshot with a mismatched hash; and a valid program-produced snapshot."
        expected_result: "Model-supplied coverage and gaps are ignored; the stale snapshot is blocked with reason_codes containing stale_coverage_snapshot; the hash mismatch is blocked with snapshot_hash_mismatch; the valid snapshot is accepted only from the program producer. The gate and formal report use the same snapshot_hash; mismatches = 0. Stale snapshot and version/hash mismatch are distinct."
        verification: "Unit tests with forged model fields and tampered snapshots plus integration asserting the shared snapshot hash in gate output and formal report."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SB-01-AC7
        input: "A blocked run, with capture of streaming messages, debug output, staging files, CLI final summary, complete_report.md/html, 5_portfolio/decision.md, final-state, memory, manifest, and API return."
        expected_result: "Intermediate outputs may show the model proposal only as intermediate or unapproved. Formal outputs use formal_decision; the blocked model proposal appears only in a separate Model Proposal (not approved) section or field. No formal output presents the model trade recommendation as the final conclusion; mismatches = 0."
        verification: "Consumer audit and integration test over every formal output path; assert labels, formal fields, and absence of an unapproved trade conclusion in formal text."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SB-01-AC8
        input: "An entry-point matrix with a critical gap and a Hold model rating: CLI run_analysis, programmatic TradingAgentsGraph.propagate, a backtest cell, a checkpoint-resumed run, and a headless/API run."
        expected_result: "Every entry point invokes the same deterministic gate and produces final_rating = REVIEW, a blocked gate_result, and the same formal review notice. No entry point bypasses the gate; bypass count = 0."
        verification: "Entry-point integration matrix; assert gate invocation, formal result, and manifest safety_gate presence for each path."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SB-01-AC9
        input: "Hold-rating fault-injection fixtures where the gate raises an exception, times out, or hits an internal error."
        expected_result: "Gate_result.status = error with reason_codes containing gate_internal_error; formal_decision.status = blocked_for_review; final_rating = REVIEW; formal_decision.review_class = gate_system_error and the formal text states that the gate is unavailable and manual review is required; the manifest records run_status = failed with error.stage = gate; tradeable formal outputs = 0; silent pass = 0. Gate failure does not wait for the terminal manifest and does not create a circular dependency."
        verification: "Fault-injection integration test for each failure mode; assert error propagation, failed run record, review notice, and absence of tradeable output."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SB-01-AC10
        input: "One passed run and one blocked run, with manifest, report, final-state, memory, and API return captured. When FR-04 applies, the passed run carries a passed portfolio_risk_result with input_ref, input_digest, policy snapshot, and policy_digest; the blocked run carries a blocked portfolio_risk_result with the same independent evidence fields."
        expected_result: "Manifest safety_gate status, reason_codes, primary_reason_code, coverage_status, critical_gap_ids, profile_version, snapshot_hash, gate_version, input_hash, run_id, and portfolio_risk result when applicable match the gate_input snapshot, model_proposal, validated risk input, and policy snapshot; formal_decision.review_class matches the reason-code mapping; final_rating matches the formal status; and the formal review notice or approved model text matches the gate outcome. Missing or mismatched fields = 0."
        verification: "Integration test; compare every gate field with the snapshot, model proposal, risk input artifact, policy snapshot, formal decision, and all formal consumers."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: SB-01-AC11
        input: "A risk-branch gate matrix: stock Buy with complete coverage and passed risk; stock Buy with complete coverage and a missing candidate; stock Overweight with complete coverage and an unsupported candidate; stock Buy with complete coverage and a risk limit breach; stock Buy with complete coverage and a missing policy snapshot; stock Buy with complete coverage and an evaluator exception; stock Buy with partial coverage and a missing candidate; crypto Buy with complete coverage; and Hold with complete coverage."
        expected_result: "The complete-coverage stock Buy passes when risk passes and is approved. A missing or unsupported stock candidate blocks with portfolio_risk_input_invalid and review_class input_invalid; it is never not_applicable. A missing policy snapshot also blocks with portfolio_risk_input_invalid and review_class input_invalid. A risk limit breach blocks with portfolio_risk_limit_exceeded and review_class portfolio_risk_limit. An evaluator exception produces gate status error, reason portfolio_risk_evaluator_error, formal REVIEW with review_class gate_system_error, failed run status, and no tradeable output. The partial-coverage stock Buy records both critical_gap and the blocked risk result, with critical_gap as primary. Crypto Buy and Hold use risk not_applicable and follow unchanged SB-01 rules. Risk-bypass count = 0; masked-failure count = 0."
        verification: "Table-driven SB-01 gate matrix over the risk branch; assert pass condition, primary reason, risk status, review class, run status, and formal rating for every row."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "provisional"
      - id: SB-01-AC12
        input: "A stock Buy fixture with partial coverage, a non-empty critical_gap list, and an FR-04 evaluator exception in the same run."
        expected_result: "The unique combined result is gate status error, run status failed, reason_codes containing both critical_gap and portfolio_risk_evaluator_error, primary_reason_code = portfolio_risk_evaluator_error, review_class = gate_system_error, formal_decision.status = blocked_for_review, final_rating = REVIEW, and no tradeable output. The result MUST NOT be status blocked, MUST NOT have critical_gap as primary, and MUST NOT hide the system exception behind the coverage gap."
        verification: "Combined coverage-gap and evaluator-exception fault-injection test; assert gate status, run status, all reason codes, primary reason, review class, formal rating, and absence of tradeable output."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
    tradeoff: Prioritize deterministic fail-closed safety and strict model-proposal/formal-decision separation. Accept REVIEW and reduced actionable output; the model cannot override the gate. Intermediate outputs may show the proposal only when marked unapproved.
    implementation_dependencies: [FR-03, FR-02]
    constraint_relations: [INV-01, FR-04, INV-02, FR-07, FR-08]
    conflicts:
      - "REVIEW reduces actionable output. Resolution: REVIEW is an explicit terminal safe state, not a hidden Hold."
      - "Preserving the model proposal helps audit but risks being read as the conclusion. Resolution: retain it only as model_proposal with proposal_status = unapproved and a separate report section."
      - "The model can write coverage claims. Resolution: only the program-produced coverage_snapshot is authoritative; model claims are ignored."
      - "A gate failure can stop a completed analysis. Resolution: fail closed with REVIEW, a gate-unavailable notice, and a failed run record."
      - "Intermediate streaming is useful for observability. Resolution: intermediate outputs may show the proposal only when explicitly marked intermediate/unapproved; formal outputs use formal_decision."
      - "Different entry points could implement different gates. Resolution: one shared finalization path is required by AC8."
      - "A portfolio-risk check can look like a second gate. Resolution: FR-04 is a pure evaluator invoked inside this SafetyGate; SB-01 remains the only final decision authority."
    assumptions:
      - "REVIEW is a terminal non-tradeable sentinel outside the five-tier rating set; it is not a sixth trading rating."
      - "coverage_status and critical_gaps come only from the FR-03 coverage_snapshot; the model cannot supply or mutate them."
      - "Gate status is closed: passed, blocked, error. formal_decision.status is closed: approved, blocked_for_review. model_proposal.proposal_status is unapproved."
      - "gate_reason_code is closed: critical_gap, coverage_gap_mismatch, invalid_coverage_status, missing_gap_list, invalid_gap_type, missing_availability_record, invalid_critical_profile, invalid_model_rating, model_review, missing_gate_input, stale_coverage_snapshot, snapshot_hash_mismatch, gate_internal_error, portfolio_risk_input_invalid, portfolio_risk_limit_exceeded, portfolio_risk_evaluator_error."
      - "reason_codes are sorted by a fixed priority for determinism: gate_internal_error, portfolio_risk_evaluator_error, missing_gate_input, invalid_critical_profile, stale_coverage_snapshot, snapshot_hash_mismatch, invalid_coverage_status, missing_gap_list, invalid_gap_type, missing_availability_record, coverage_gap_mismatch, invalid_model_rating, model_review, critical_gap, portfolio_risk_input_invalid, portfolio_risk_limit_exceeded."
      - "Formal outputs are CLI final summary, complete_report.md/html, 5_portfolio/decision.md, final-state, memory, manifest, API return, and backtest scoring. Intermediate outputs are streaming messages, debug output, staging files, checkpoint state, and raw agent text."
      - "When blocked, the formal decision text uses the review_class matched to the primary reason, states that manual review is required, and lists all reason codes and critical gaps; it contains no trade instruction as the formal conclusion."
      - "The gate runs before the terminal manifest and every formal output with a formal decision; the running startup manifest may precede the gate and uses safety_gate.status = not_run. The gate and formal report use the same coverage_snapshot."
      - "When multiple reasons occur, primary_reason_code is the first reason in the fixed priority list; review_class is derived from that primary reason. All reason_codes are retained and listed as secondary reasons, but they do not change the primary formal prompt. The mapping is: critical_gap or missing_availability_record -> data_insufficient; invalid_model_rating -> model_rating_invalid; model_review -> model_review; invalid_coverage_status or coverage_gap_mismatch -> coverage_inconsistent; missing_gap_list, invalid_gap_type, missing_gate_input, invalid_critical_profile -> input_invalid; stale_coverage_snapshot, snapshot_hash_mismatch, gate_internal_error, portfolio_risk_evaluator_error -> gate_system_error; portfolio_risk_input_invalid -> input_invalid; portfolio_risk_limit_exceeded -> portfolio_risk_limit; passed -> none."
      - "Stock Buy or Overweight always enters the FR-04 risk branch; only crypto, other non-stock assets, and Hold, Underweight, Sell, or REVIEW may use not_applicable; an invalid rating blocks with invalid_model_rating. Missing or unsupported stock candidates block, not not_applicable."
      - "The risk policy is a locatable portfolio_risk_policy_snapshot with actual thresholds, freshness window, precision rule, threshold_status, and human_approval_ref. Provisional values are allowed only when explicitly labeled provisional with a null human approval reference."
      - "FR-04 risk evaluation is an internal gate step; it does not create a second final decision path or a second memory write."
      - "Gate failure is a handled failure: the manifest run_status is failed with error.stage = gate, and no tradeable output is produced."
      - "When coverage fails and the risk evaluator errors in the same run, the unique result is gate status error, run status failed, primary reason portfolio_risk_evaluator_error, review_class gate_system_error, and formal REVIEW; critical_gap is retained as a secondary reason and cannot mask the system exception."
      - Gate failure is classified as blocked or error by a fixed table; a system exception is error and is never hidden behind a data gap.
    notes: >
      Decision table. complete + empty gaps + valid rating + valid profile + all critical records + current snapshot + (FR-04 passed or allowed not_applicable) -> passed. complete + non-empty gaps -> blocked coverage_gap_mismatch. partial + empty gaps -> blocked coverage_gap_mismatch. partial + non-empty gaps -> blocked critical_gap. Invalid coverage -> invalid_coverage_status. Missing gaps -> missing_gap_list. Wrong gap type -> invalid_gap_type. Missing availability record -> missing_availability_record. Invalid profile -> invalid_critical_profile. Missing/invalid rating -> invalid_model_rating. Model REVIEW -> model_review. Missing gate input -> missing_gate_input. Stale/mismatched snapshot -> stale_coverage_snapshot or snapshot_hash_mismatch. Gate exception -> error/gate_internal_error. Stock Buy and Overweight always run FR-04. A missing, invalid, inconsistent, insufficient-cash, unsupported, or unavailable-policy risk input -> blocked portfolio_risk_input_invalid with review_class input_invalid; a risk limit breach -> blocked portfolio_risk_limit_exceeded with review_class portfolio_risk_limit; an evaluator exception -> error/portfolio_risk_evaluator_error with review_class gate_system_error and a failed run record. A stock Buy or Overweight risk result is never not_applicable. Crypto and other non-stock assets and Hold, Underweight, Sell, or REVIEW use not_applicable; an invalid rating blocks with invalid_model_rating and remains subject to the other rows. When coverage and a risk input or limit failure both occur, critical_gap remains primary and the risk reason is retained as secondary. A risk evaluator exception is a gate error and follows the higher-priority error path: gate status error, run status failed, primary reason portfolio_risk_evaluator_error, review_class gate_system_error, with critical_gap retained only as a secondary reason. This gate is the deterministic boundary between the unapproved model proposal and every formal decision.


      Authoritative blocked/error decision table (primary status is unique; all rows fail closed):

      | Case | Gate status | Primary reason | Review class | Formal rating | Run outcome |

      |---|---|---|---|---|---|

      | invalid coverage enum | blocked | invalid_coverage_status | coverage_inconsistent | REVIEW | completed with blocked formal decision |

      | missing gap list | blocked | missing_gap_list | input_invalid | REVIEW | completed with blocked formal decision |

      | wrong gap type | blocked | invalid_gap_type | input_invalid | REVIEW | completed with blocked formal decision |

      | missing availability record | blocked | missing_availability_record | data_insufficient | REVIEW | completed with blocked formal decision |

      | invalid critical profile | blocked | invalid_critical_profile | input_invalid | REVIEW | completed with blocked formal decision |

      | invalid or missing rating | blocked | invalid_model_rating | model_rating_invalid | REVIEW | completed with blocked formal decision |

      | missing gate input | blocked | missing_gate_input | input_invalid | REVIEW | completed with blocked formal decision |

      | stale snapshot | blocked | stale_coverage_snapshot | gate_system_error | REVIEW | completed with blocked formal decision |

      | snapshot hash mismatch | blocked | snapshot_hash_mismatch | gate_system_error | REVIEW | completed with blocked formal decision |

      | unsupported profile version | blocked | invalid_critical_profile | input_invalid | REVIEW | completed with blocked formal decision (recommended existing-code mapping; distinct code decision pending) |

      | unsupported snapshot schema version | blocked | snapshot_hash_mismatch | gate_system_error | REVIEW | completed with blocked formal decision (recommended existing-code mapping; distinct code decision pending) |

      | gate internal exception or timeout | error | gate_internal_error | gate_system_error | REVIEW | failed; error.stage=gate |

      | risk evaluator exception | error | portfolio_risk_evaluator_error | gate_system_error | REVIEW | failed; error.stage=gate |

      | coverage gap with ordinary risk input or limit failure | blocked | critical_gap | data_insufficient | REVIEW | completed with blocked formal decision; risk reasons retained |

      | coverage gap with risk evaluator exception | error | portfolio_risk_evaluator_error | gate_system_error | REVIEW | failed; critical_gap retained as secondary |
  - id: INV-01
    type: "invariant"
    title: "One bound formal result across report, manifest, final-state, and memory"
    priority: "Must"
    status: "draft"
    stakeholders: [reviewer, trader, analyst]
    sources:
      origin: "Repository analysis and measured baseline"
      evidence:
        - path: "TradingAgents/tradingagents/reporting.py"
          locator: "L92 write_report_tree"
          description: "Reports are written to a report tree, independent of the state log and memory log."
          source_type: "code"
        - path: "TradingAgents/tradingagents/graph/trading_graph.py"
          locator: "L437-L475 _log_state"
          description: "The full-state log is written separately from reports and memory and has no binding identity."
          source_type: "code"
        - path: "TradingAgents/tradingagents/memory/log.py"
          locator: "L32-L60 store_decision and later settlement"
          description: "The memory entry is written separately, then updated later with outcome and reflection; no run_id or record binding ties it to the other artifacts."
          source_type: "code"
        - path: "baseline/runs/baseline-20261020-01/report-consistency.json"
          locator: "all fields"
          description: "The baseline checked decision/report/full-state consistency but did not measure source-status consistency, identity binding, or memory agreement."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/memory/trading_memory.md"
          locator: "entry tag and DECISION block"
          description: "The baseline memory entry contains only trade date, ticker, rating, pending status, and prose; it has no run_id, record_version, decision digest, coverage, gaps, or gate result."
          source_type: "measured_baseline"
    problem: >
      The baseline wrote decision data to reports, a full-state log, and memory,
      but no identity bound them to one formal result and no invariant defined
      which fields each artifact must carry. Report and memory held different
      shapes from the manifest and final-state, source-status and fallback
      comparison granularity was undefined, and memory was later updated by
      settlement. Missing artifacts, partial writes, crash recovery, and retries
      had no consistency contract.
    statement: >-
      INV-01 holds at the completed checkpoint and on every read of a completed run's formal artifacts, not while artifacts are incomplete. Report, manifest, and final-state MUST bind to the current formal result through artifact_binding: identical run_id, record_version, decision_digest, gate_status, formal_decision_status, final_rating, coverage_status, critical_gap_ids, and coverage_snapshot_hash; record_hash, when present, MUST also match. A new memory entry MUST carry the current binding. A reused historical memory entry MUST retain its original source_run_id, snapshot, evidence, and binding, and MUST be linked from current artifacts through reused_decision_ref; it is not required to carry the current run_id or current coverage summary. The artifact contract MUST be identical in requirement and different only in representation: manifest and final-state carry the full canonical availability records and full gate/formal-decision fields; report carries the binding block plus coverage, critical-gap, fallback, and gate summaries; memory carries the binding, formal rating, formal decision text or digest, coverage/gap summary, and provenance_digest. Source-status and fallback comparison MUST use the canonical availability-record identity, ordered attempts, evidence timestamps, and provenance_digest, not rendered prose. Legal fallback MUST be disclosed with fallback_used, primary failure, attempted_sources, and serving_source; silent substitution is forbidden. A missing or empty required artifact, partial write, crash before completion, or failed retry MUST fail the invariant and MUST NOT be claimed as completed. Retries MUST preserve run_id, record_version, and record_hash and MUST NOT create a duplicate memory decision entry. Memory binding MUST identify one immutable decision entry through memory_entry_binding, not a hash of the shared memory file. Settlement and reflection MAY append outcome fields, and policy-based rotation of resolved entries is legal; modifying or deleting a retained decision entry, or changing its binding fields, is illegal. Rotation that removes an entry MUST be recorded and treated as memory not_available, not as a binding mismatch. The complete report and report_section_manifest MUST bind to the same permanent publication_snapshot and formal decision through the FR-05 contract; every committed section MUST derive from that snapshot and the versioned renderer/current capability set. Completion is truthful only at terminal manifest run_status = completed plus read-time INV-01; no independent commit marker is authoritative. Missing, corrupt, or unsupported section or manifest data fails the invariant and is not returned as complete. Cleanup failure after commit is a warning and does not change the committed identity. run_status, publish_state, and formal_publication status map through the shared publication contract; one status meaning is authoritative. run_status=completed, publish_state=completed, and formal_publication=committed are one committed state; partial or failed runs are not formal success.
    fit_criterion:
      - id: INV-01-AC1
        input: "A completed run with one success, one unavailable, one withheld, and one legal fallback source; capture the report binding block, manifest, final-state, and memory."
        expected_result: "Report, manifest, and final-state bind the current run: run_id, decision_id, record_version, decision_digest, gate_status, formal_decision_status, final_rating, coverage_status, critical_gap_ids, and coverage_snapshot_hash are exact across those three. Memory either carries the current binding or a valid reused_decision_ref with matching decision_id/decision_digest/entry_digest; for a reused historical entry, source run_id/snapshot fields are not required to equal the current run. Report/memory summaries equal derived values; mismatches = 0."
        verification: "Integration test; extract machine-readable bindings and summaries from every artifact and compare against the canonical manifest/final-state record."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: INV-01-AC2
        input: "The same completed fixture with different object key order, whitespace, line endings, report language, timestamps, and local absolute paths."
        expected_result: "Canonicalization produces identical bindings, decision_digest values, provenance_digest values, and summaries. Run-level generated_at/evaluated_at/finished_at and local paths are excluded; attempts and attempted_sources keep supplier attempt order; evidence timestamps in attempts and observed windows are preserved and compared; rendered report prose is not compared; false mismatches = 0. A semantic rewrite or an attempt-order change is still detected as a mismatch."
        verification: "Unit canonicalization test plus integration with reordered and reformatted artifacts, including reordered attempts and changed evidence timestamps; assert stable digests, preserved attempt order, and zero false mismatches."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: INV-01-AC3
        input: "A fixture with success, unavailable, withheld, not_configured, and a legal fallback; one provider serves multiple capabilities and multiple availability records exist."
        expected_result: "Availability-record identity is (run_id, record_kind, data_query_key, requirement_id, capability, component, source, status, reason_code, record_count, fallback_used, serving_source, attempted_sources). Executed records carry a data_query_key and ordered attempts; component_missing records carry no data_query_key and no attempts. The full record sets and provenance_digest are equal between manifest and final-state; report and memory fit their declared summaries exactly; mismatches = 0."
        verification: "Integration test; compare full records for manifest/final-state and derived summaries for report/memory, including provenance_digest and fallback labels."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: INV-01-AC4
        input: "A legal same-contract fallback, plus independent silent-substitution fixtures: primary failure omitted; fallback_used = false; serving source presented as the primary; fallback label omitted from report or memory."
        expected_result: "The legal fallback passes with fallback_used = true, primary failure present, attempted_sources and serving_source correct, and disclosure in report, manifest, final-state, and memory (current entry or historical reference). Each silent-substitution fixture fails the invariant with a non-zero mismatch; silent substitutions = 0."
        verification: "Integration tests for the legal fallback and each silent-substitution case separately; assert fallback provenance and failure."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: INV-01-AC5
        input: "A completed run with a formal decision text and rating."
        expected_result: "Report, manifest, and final-state share exact current-run run_id, decision_id, record_version, decision_digest, gate_status, formal_decision_status, final_rating, coverage_status, and critical_gap_ids. final_decision_text is exact between manifest and final-state after canonicalization. Memory is either current-binding-equal or carries a valid reused_decision_ref with the same decision_id, decision_digest, and entry_digest; its source run fields are not compared to the current run. Rendered prose is not used for equality; mismatches = 0."
        verification: "Integration test; compare exact binding fields and text only between manifest/final-state, and compare report/memory against the digest and required summary."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: INV-01-AC6
        input: "Independent negative fixtures in which one required artifact is deleted, empty, or missing a binding field: report, manifest, final-state, and memory."
        expected_result: "Each case fails the invariant, the run is not marked completed, formal success is not claimed, and the missing-artifact error is recorded. False passes = 0; there is no after-the-fix condition."
        verification: "Separate negative test for each artifact; assert non-zero invariant failure and no completed status."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: INV-01-AC7
        input: "Fault injection after each artifact write, followed by a retry that does not re-run the model and reuses the same run_id, record_version, and record_hash."
        expected_result: "Before completion the run is running, partial, or failed and the invariant is not claimed. No completed manifest exists while artifacts are incomplete. Retry completes with exactly one copy of each required artifact, the same binding identity, one memory decision entry with the same memory_entry_binding and entry_digest, and zero cross-artifact mismatches; duplicate or conflicting entries = 0."
        verification: "Crash/restart fault-injection test at each write point; assert publish state, idempotent retry, and final cross-artifact equality."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: INV-01-AC8
        input: "A completed run, followed by settlement/reflection, legal policy-based rotation of resolved entries, and an illegal deletion or modification of a retained decision entry."
        expected_result: "Settlement only appends outcome and reflection fields; memory_entry_binding, entry_digest, evidence_digest, and formal decision fields remain immutable and equal to the other artifacts. The memory artifact hash uses hash_scope = memory_entry, so appends, settlement, lock maintenance, and legal rotation do not invalidate it. Legal rotation removes only resolved entries under policy and records retention_status = rotated or not_available without a binding mismatch. Illegal deletion or modification of a retained decision entry is detected as a binding failure. The shared memory file hash is never used; mismatches = 0 for legal cases."
        verification: "Integration test across decision write, settlement, legal rotation, and illegal deletion/modification; assert memory_entry_binding immutability and the legal/illegal distinction."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: INV-01-AC9
        input: "A run lifecycle captured before completion, at the completed checkpoint, and on a later read; then one binding field is tampered after completion."
        expected_result: "The invariant is not claimed before completion, passes at completion and on a valid read, and detects the tampered binding on the next read, blocking formal exposure. False pass = 0; mismatches = 0 for valid artifacts."
        verification: "Lifecycle test plus read-time validation and tamper injection; assert checkpoint behavior and non-zero detection."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: INV-01-AC10
        input: "Four fixtures: a same-day rerun with the same trade_date/ticker and same decision_id/entry_digest; a same-day rerun with a different decision_id; a same-decision_id fixture with tampered entry_digest; a run with memory disabled."
        expected_result: "The same-binding rerun reuses the existing committed entry, sets memory.status = existing, commit_status = committed, same_day_rerun = true, and records reused_decision_ref; no duplicate is created. The different-decision rerun publishes its report/manifest/final-state independently and writes a pre-commit entry_version greater than the current highest committed version, with supersedes = previous decision_id; the terminal manifest records that version. The effective version is derived as the highest entry_version whose source terminal manifest is committed, so no post-commit write to the old entry is required. A failed new publication leaves a version gap but does not make the provisional version effective and does not remove the old effective version. entry_digest covers stable decision content only; evidence_digest may differ across reruns without blocking reuse. The same-decision_id tampered entry_digest is a conflict and does not overwrite the retained entry. With memory disabled, memory.status = disabled and commit_status = disabled; no memory artifact is required and the other three artifacts still satisfy INV-01. Mismatches = 0. A new memory entry uses the current run_id; a reused historical entry keeps its original binding and is linked through reused_decision_ref; memory disabled requires no memory artifact; legal rotation records not_available and is not a binding mismatch."
        verification: "Integration test across same-day rerun, versioned different decisions, tampered entry_digest conflict, and memory-disabled configurations; assert memory versions, supersession, deduplication, and required-artifact rules."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: INV-01-AC12
        input: "Completed-status negatives: absent independent commit marker, missing/corrupt/unsupported section or manifest, incomplete publication, and a cleanup failure after a successful commit."
        expected_result: "Completed requires terminal manifest run_status = completed plus read-time INV-01; an absent independent marker does not block or define completion. Missing, corrupt, unsupported, or incomplete artifacts are never returned as successful complete reports. A cleanup failure after commit yields completed with a warning and unchanged binding. False committed results = 0. The terminal manifest completion is checked after the gate; no gate/manifest circular wait."
        verification: "Commit-condition and fault-injection tests asserting terminal-manifest authority, absent-marker irrelevance, truthful completion, and cleanup-warning behavior."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
    tradeoff: Prioritize one bound formal result and truthful completion. Report and memory carry declared summaries while manifest and final-state carry full records. No independent commit marker and no whole-file memory hash. Section and recovery details are owned by FR-05/FR-06.
    implementation_dependencies: [FR-02, SB-01]
    constraint_relations:
      - FR-01
      - FR-03
      - SR-01
      - FR-04
      - INV-02
      - FR-05
      - FR-06
      - FR-07
      - QR-02
      - SR-02
    conflicts:
      - "A short report conflicts with full provenance. Resolution: report carries a binding block plus declared summaries; manifest and final-state carry the full canonical records; report and memory are compared through binding and provenance_digest."
      - "The memory log stores prose and is updated later by settlement. Resolution: INV-01 binds only the immutable decision portion; settlement may append outcome/reflection, and rotation is recorded as not_available."
      - "A lean manifest may not carry every artifact's prose. Resolution: current report, manifest, and final-state share the canonical binding and digests; a reused historical memory entry retains its original binding and is linked through reused_decision_ref, not compared field-for-field to current run identity."
      - "Retries can duplicate memory. Resolution: retries reuse run_id, record_version, and record_hash and must keep one memory decision entry."
      - "Redaction can change compared strings. Resolution: all artifacts use the same sanitizer and compare sanitized canonical values."
    assumptions:
      - "The canonical artifact set is report, manifest, final-state, and memory; report and memory use declared summaries bound by decision_digest and provenance_digest."
      - "The report exposes a machine-readable binding block; memory exposes a binding tag or structured header; manifest and final-state expose binding fields directly."
      - "Canonicalization uses UTF-8, NFC, LF line endings, sorted keys, documented array ordering, and excludes run-level generated_at/evaluated_at/finished_at and local absolute paths. Attempt order and evidence timestamps are preserved."
      - "The full source-status comparison is between manifest and final-state; report and memory compare their declared summaries and provenance_digest against those derived values."
      - "publish_state is closed: running, staged, validated, completed, partial, failed. INV-01 is claimed only for completed."
      - "The invariant is checked before completion, on read, and after retry/resume."
      - "Memory binds through memory_entry_binding to one immutable decision entry; settlement/reflection is append-only; legal rotation of resolved entries is distinct from illegal deletion of a retained entry; rotation absence is recorded as memory not_available."
    notes: >-
      INV-01 binds the canonical result across report, manifest, final-state, and memory. AC11 (section manifest) merged into FR-05-AC3. Section and recovery contracts are owned by FR-05 and FR-06. No implementation or test result is claimed.
  - id: INV-02
    type: "invariant"
    title: "Deterministic portfolio-risk authority and zero unsafe approvals"
    priority: "Must"
    status: "draft"
    stakeholders: [trader, reviewer, security_reviewer, operator]
    sources:
      origin: "Upstream proposal review and repository analysis"
      evidence:
        - path: "TradingAgents/tradingagents/agents/managers/portfolio_manager.py"
          locator: "portfolio_manager_node final rating"
          description: "The final rating and decision text are model-produced and cannot themselves be deterministic authority for numeric portfolio boundaries."
          source_type: "code"
        - path: "TradingAgents/tradingagents/graph/trading_graph.py"
          locator: "record_decision"
          description: "The persistence path needs one deterministic finalization boundary so an alternate writer cannot approve a proposal that violates the active risk policy."
          source_type: "code"
        - path: "TradingAgents/tradingagents/reporting.py"
          locator: "write_report_tree"
          description: "The report writer must consume the same formal risk result rather than re-deriving or omitting it."
          source_type: "code"
        - path: "TradingAgents/tradingagents/memory/log.py"
          locator: "store_decision and settlement"
          description: "The memory writer must preserve the existing decision identity and reuse rules while carrying a risk summary only for a newly written entry."
          source_type: "code"
        - path: "docs/req/run-manifest-schema.json"
          locator: "safety_gate, formal_decision, artifact_binding"
          description: "The existing manifest contract carries the gate, formal decision, and cross-artifact binding that INV-02 extends without a second authority."
          source_type: "document"
        - path: "baseline/runs/baseline-20261020-01/results/reports/NVDA_20261020_193209/5_portfolio/decision.md"
          locator: "entire file"
          description: "The baseline formal decision carries no risk status, risk reason, policy version, or cross-artifact risk binding."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/memory/trading_memory.md"
          locator: "entry tag and DECISION block"
          description: "The baseline memory entry has no formal-decision binding or portfolio-risk summary."
          source_type: "measured_baseline"
    problem: >
      A risk rule is not a safety boundary if model wording, invalid input,
      external dependencies, or an alternate writer can approve a proposal that
      violates the active policy. The upstream pipeline has no single
      deterministic portfolio-risk authority, no zero-unsafe-approval invariant,
      no prohibition on model-supplied risk inputs, no locatable risk-input and
      policy evidence, and no guarantee that current risk evidence is distinct
      from reused historical memory evidence.
    statement: >-
      For every applicable stock Buy or Overweight proposal, the effective formal result MUST be produced by the shared SafetyGate invoking the same pure deterministic FR-04 evaluator. Model text MUST NOT supply authoritative risk input, change the risk result, or approve an over-limit, invalid, stale, inconsistent, insufficient-cash, or unsupported proposal. Missing or invalid required input MUST NOT default to approval. The model proposal and the effective formal result MUST remain distinguishable. INV-02 holds at the completed checkpoint and on every read of a completed run's formal artifacts. The current run's portfolio_risk_result, input_ref, input_digest, policy snapshot, policy_digest, metrics, and formal decision MUST be identical between manifest and final-state, summarized consistently in the current report, and bound to the same formal_decision and artifact_binding required by INV-01. A risk-blocked result MUST have formal_decision.status = blocked_for_review and final_rating = REVIEW. A risk evaluator error MUST have gate status error, formal decision blocked_for_review with final_rating REVIEW, review_class gate_system_error, a failed run record, and no tradeable output. A risk-passed result MUST NOT introduce a block by itself. The applicability rule is mandatory: stock Buy or Overweight MUST NOT carry a not_applicable risk result. Missing, unsupported, or inconsistent candidates on such a proposal MUST carry a blocked result even when another gate check also blocks. Crypto Buy and other non-stock assets may carry not_applicable and remain subject to SB-01. Current-run risk evidence and reused historical memory evidence are distinct. A newly written memory entry carries the declared risk summary with status, reason codes, policy_ref, policy_digest, and threshold_status. A reused historical entry retains its original evidence and binding and is linked through reused_decision_ref; the current run is not required to add its current risk summary to that historical entry. Only identical stable decision content reuses an entry. A changed formal decision status, rating, or text creates a new decision content and version under INV-01. A risk-blocked rerun follows this same rule and is not governed by a blanket no-new-entry rule. A risk result MUST NOT create a second memory key or bypass the existing same-day, supersedes, or memory-disabled rules. The evaluator MUST make no LLM, network, vendor, persistence, or UI call, and MUST NOT execute orders. Risk-policy effects are evaluated separately from cache A/B under QR-01; cache A/B holds the policy snapshot, risk inputs, and gate version fixed, so a legitimate risk-driven REVIEW increase is not treated as a cache regression. A passed evaluation is not a guarantee of maximum realized loss, protection against gaps, slippage, fees, or liquidity, or any investment outcome. FR-04 formulas and applicability are referenced, not duplicated. For an invalid risk input, current-run input_ref and input_digest may be null with a safe diagnostic_ref; a risk-input artifact is not required for that blocked result.
    fit_criterion:
      - id: INV-02-AC1
        input: "A fixed-seed generated corpus of at least 1000 valid, exact-boundary, over-limit, malformed, stale, inconsistent, insufficient-cash, unsupported, not_applicable, and error fixtures evaluated through the shared SafetyGate."
        expected_result: "Every violating applicable fixture is non-tradeable with a stable risk code and formal REVIEW; every passing applicable fixture records its metrics, input_digest, policy snapshot, and policy_digest; stock Buy or Overweight never carries not_applicable; unsafe_approved_count = 0; default_approval_count = 0; not_applicable_as_pass_count = 0. Reuse FR-04 fixtures rather than maintaining a second expectation set; repeated runs do not replace boundary coverage."
        verification: "Generated offline test with recorded seed, failure corpus, and per-fixture canonical result; assert every violation and the zero-tolerance counters."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: INV-02-AC2
        input: "Representative passing, limit-breach, invalid-input, unsupported-input, not_applicable, and evaluator-error fixtures evaluated 100 times each under one policy snapshot, including exact-boundary decimal values and both valuation modes."
        expected_result: "Canonical results, ratios, risk codes, policy snapshot, policy_digest, input_digest, formal rating, and gate reason are identical for identical input; deterministic_result_mismatch_count = 0; floating-point drift = 0."
        verification: "Repeated deterministic unit test with canonical result serialization and exact decimal boundary assertions."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: INV-02-AC3
        input: "Fixtures where narrative fields claim approval, prompt text orders the evaluator to ignore a limit, the model supplies its own portfolio or order numbers, and dependency sentinels fail on any LLM, network, vendor, persistence, or UI call."
        expected_result: "Narrative and model-supplied values do not change the deterministic result; authoritative caller input and the policy snapshot determine the outcome; forbidden_dependency_call_count = 0; the model_proposal remains unapproved; unsafe approvals = 0."
        verification: "Narrative-injection fixtures, import audit, and dependency sentinels around the evaluator and the shared gate."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: INV-02-AC4
        input: "A risk-blocked current run and a risk-passed current run sent through the CLI final summary, complete report, 5_portfolio/decision.md, manifest, final-state, memory, and formal API return, each with one finalized-record identity and its risk-input artifact."
        expected_result: "Every formal consumer uses the same current formal decision, gate reason, risk status, risk reason codes, policy_ref, policy_digest, threshold_status, input_digest, and metrics; input_ref points to the current risk-input artifact; the model proposal appears only as audit-only and unapproved; no second final decision path or duplicate current memory decision entry exists; cross_artifact_mismatch_count = 0. For an invalid risk input, input_ref and input_digest may be null with a safe diagnostic_ref; a risk input artifact is not required. The evaluator has no writer; surrounding records follow FR-02/INV-01."
        verification: "Writer-bypass and cross-artifact integration test using one finalized-record identity, the risk-input artifact, and every formal consumer."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: INV-02-AC5
        input: "Memory fixtures: a same-decision rerun with different risk evidence; a changed formal decision text or digest from changed risk input; a reused historical entry with its original risk summary; a risk-blocked rerun with unchanged formal decision; a risk-blocked rerun with a changed formal decision; and a risk-blocked run with memory disabled."
        expected_result: "Only identical stable decision content reuses the committed entry under the unchanged entry_digest rule. A changed formal decision reserves a new decision_id and entry_version with supersedes under INV-01. A reused historical entry keeps its original evidence and is linked through reused_decision_ref without receiving the current risk summary. A risk-blocked rerun follows the same reuse-or-version rule; it is not automatically required to avoid a new entry. Memory-disabled runs still satisfy INV-02 through report, manifest, and final-state; mismatches = 0. Current consumers use current evidence; a reused historical entry keeps its original evidence and is linked, not field-for-field equal."
        verification: "Integration test across same-day rerun, supersession, risk-blocked reuse, changed-decision versioning, historical-reference reuse, and memory-disabled configurations."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
      - id: INV-02-AC6
        input: "Independent applicability and failure fixtures: a crypto Buy; a stock Buy with a missing candidate; a stock Overweight with an unsupported candidate; a stock Buy with a critical gap and missing risk input; a stock Buy with a critical gap and passed risk; a stock Buy with a risk limit breach; a stock Buy with an evaluator exception; and a Hold with complete coverage."
        expected_result: "Crypto Buy and Hold use not_applicable and follow unchanged SB-01 rules; stock Buy or Overweight never uses not_applicable; missing and unsupported candidates block with the correct input-invalid reason; the critical-gap Buy records both critical_gap and the risk result, with critical_gap primary; the risk-limit Buy blocks with portfolio_risk_limit; the evaluator exception produces gate error, review_class gate_system_error, failed run status, REVIEW, and no tradeable output; not_applicable-as-pass count = 0; risk cannot mask a coverage or model-rating failure."
        verification: "Combined SB-01 and FR-04 gate matrix test; assert applicability, risk result presence, primary gate reason, review class, run status, and absence of masked failures."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "not_applicable"
    tradeoff: Prioritize zero unsafe approvals and one deterministic authority. Accept REVIEW for invalid, missing, stale, inconsistent, insufficient-cash, unsupported, or over-limit risk input. Current and reused historical evidence stay distinct.
    implementation_dependencies: [FR-04, SB-01, INV-01, FR-02]
    constraint_relations:
      - FR-03
      - SR-01
      - QR-01
    conflicts:
      - "Preserving the proposal can be mistaken for preserving its authority. Resolution: all formal consumers use only the finalized result; the proposal remains audit-only."
      - "Fail-closed validation reduces actionable output. Resolution: REVIEW is the explicit safe state for missing, invalid, stale, inconsistent, insufficient-cash, unsupported, or over-limit risk input."
      - "A second risk rule can duplicate the final decision path. Resolution: the evaluator is invoked only by the shared SafetyGate and has no persistence, memory, or writer path of its own."
      - "Risk evidence can fragment memory reuse. Resolution: memory identity remains decision_id, decision_digest, and entry_digest; current run evidence is separate, and reused historical evidence is linked through reused_decision_ref."
      - "A risk-driven REVIEW increase can be misread as a cache regression. Resolution: cache A/B holds risk policy fixed and risk-policy effects are evaluated separately."
      - "A passed risk check can be read as a loss guarantee. Resolution: forbid loss-guarantee claims; stop distance is a price-distance metric only."
    assumptions:
      - "The shared SafetyGate is the only formal finalization authority."
      - "FR-04 provides the authoritative pure portfolio_risk_result."
      - "INV-01 artifact_binding, decision_id, decision_digest, entry_digest, same-day rerun, supersedes, and memory-disabled rules are reused unchanged."
      - "Current-run risk evidence is stored in the current manifest/final-state and a newly written memory entry; reused historical memory keeps its original evidence."
      - "Offline fixtures require no provider credentials, live data, or model calls."
      - "A passed risk check does not guarantee maximum realized loss, execution quality, or investment outcome."
      - "The 30% concentration and 5% stop-distance defaults remain provisional and are never presented as approved policy."
    notes: >-
      INV-02 is the safety and determinism invariant paired with FR-04. AC7 moved to QR-01. It reuses SB-01 REVIEW and INV-01 binding/version rules and defines no second gate, binding, or memory identity. No implementation or test result is claimed.
  - id: SR-01
    type: "security"
    title: "Secret-safe run records with known-value and versioned pattern checks"
    priority: "Must"
    status: "draft"
    stakeholders: [security_reviewer, operator, reviewer]
    sources:
      origin: "Repository analysis and measured baseline"
      evidence:
        - path: "TradingAgents/tradingagents/dataflows/net.py"
          locator: "L6-L24 get_scrubbed"
          description: "Existing exact-value scrubber for FRED and Alpha Vantage request error URLs; it does not cover other record boundaries or pattern matches."
          source_type: "code"
        - path: "TradingAgents/tradingagents/dataflows/vendors/alpha_vantage/common.py"
          locator: "L95-L97 get_scrubbed call"
          description: "Existing API-key scrub path for Alpha Vantage request errors."
          source_type: "code"
        - path: "TradingAgents/tradingagents/graph/trading_graph.py"
          locator: "L255-L275 run_settings"
          description: "Existing allowlist for report settings; it excludes keys and endpoints but does not scan other writers."
          source_type: "code"
        - path: "TradingAgents/cli/prefs.py"
          locator: "L30-L58 save_last_run"
          description: "Preferences store backend_url and other selections directly, so inline userinfo, query tokens, or fragments can be persisted."
          source_type: "code"
        - path: "TradingAgents/cli/prompts.py"
          locator: "L731-L738 .env creation and chmod"
          description: "Existing .env creation already uses mode 0600; this is a preserved baseline control, not a new D1 acceptance item."
          source_type: "code"
        - path: "TradingAgents/tests/test_api_key_env.py"
          locator: "L168-L190 .env mode tests"
          description: "Existing tests already assert the 0600 .env mode."
          source_type: "code"
        - path: "baseline/runs/baseline-20261020-01/logs/stdout.log"
          locator: "entire file"
          description: "Reviewed baseline stdout; no API key value was observed, but this is not a complete scan."
          source_type: "measured_baseline"
        - path: "baseline/runs/baseline-20261020-01/logs/stderr.log"
          locator: "file size"
          description: "Empty stderr; the baseline did not run a complete secret scan."
          source_type: "measured_baseline"
    problem: >
      Some provider request errors already replace one exact API key, and report
      settings are allowlisted, but no common detector covers the manifest,
      final-state, memory, report, logs, error records, preferences, or formal
      API return. Preferences can persist a full backend URL, which is needed to
      restore the next run but may contain inline userinfo or query credentials.
      Known-value checking and pattern checking were not separated, rules were
      not versioned, and a scan result was treated as proof that every possible
      credential was safe. There was also no behavior for scanner failure or an
      unredactable secret.
    statement: >-
      SR-01 applies to app-controlled run records and formal outputs: run manifest, final-state, memory decision entry, report metadata and content, logs, preferences, error records, gate and availability reasons, and formal API return. Vendor/provider logs, shell history, OS/network captures, and external service logs are explicitly out of scope. Sensitive information MUST be checked in two separate ways: (1) exact match against secret_value values actually configured or used in the run, and (2) the versioned secret_pattern_rule set with a fixed minimum detection scope. A clean record requires zero known-secret exact matches and zero unredacted pattern matches; the result proves only the defined scope, rules, and fixtures, not the absence of unknown credential formats outside them. Audit/display endpoints MUST contain only scheme, host, and path. Preferences MAY keep an endpoint_restore_record with allowlisted non-sensitive query parameters and secret_ref names, but MUST NOT contain inline userinfo, sensitive query values, or fragments. If a user supplies inline sensitive components, the app MUST migrate them to .env or the process environment and store references, or omit them and set re_entry_required. Redaction MUST replace only the secret value, preserve keys, parameter names, structure, status, reason codes, counts, timings, source and vendor names, tickers, dates, model ids, and relative paths, and MUST avoid over-redaction. If a secret is found and cannot be removed, or the detector, sanitizer, or rule version is unavailable or fails, the run MUST fail closed: the dangerous content and the affected formal output MUST NOT be written. A separate minimal security incident record MAY be written only when it contains no secret value and is not a formal decision artifact; it records the security stage, rule version, failure type, and a sanitized reason. If the incident record cannot be written safely, nothing is written. The caller receives a security failure; a failed manifest is not required when it cannot be safely written, and the system MUST NOT claim a failed file exists. The run is marked failed only when a safe record can be written. Every write MUST perform and record a per-write scan (write_scan_status); the terminal manifest MUST also record the final run-level scan (run_scan_status). A running manifest may have run_scan_status = not_run. A completed manifest requires clean or redacted write_scan_status and run_scan_status. Scan scope, rule version, and both scan results MUST be recorded whenever a safe record can be written. Archive storage, the history index, and recovery diagnostics are scanned for credentials by SR-01; export diagnostics are included only if the deferred export capability is later enabled; path confinement, symlink/junction escape, and out-of-root writes are SR-02. Export-specific conflict behavior is deferred with FR-05 export. Empty secret strings are never matched. Known secret values shorter than four characters are exact-match only in credential-bearing fields and are not added to generic pattern rules; if safe redaction would destroy required structure or over-redact unrelated content, the record is blocked.
    fit_criterion:
      - id: SR-01-AC1
        input: "A deterministic run fixture with a configured known API key, a mock provider that accepts the key and endpoint without a network dependency, and an endpoint containing userinfo, a sensitive query value, and a fragment; the run reaches the manifest, final-state, memory, report, log, and preference writers."
        expected_result: "Known secret values are collected and exact-match scanned at every in-scope writer. Scanning each of manifest, final-state, memory, report, logs, and preferences yields zero known-secret exact matches; manifest.security.known_secret_match_count = 0; the audit endpoint contains scheme, host, and path only; no case fails before reaching the record writers; mismatches = 0."
        verification: "Deterministic integration test with a mock provider and instrumented record writers; scan every output and assert the record path was reached."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SR-01-AC2
        input: "Fixtures for the fixed minimum pattern categories: provider key formats, generic bearer and JWT formats, URL userinfo, sensitive query parameter names and values, sensitive authorization headers, and password/token assignments; each printed with secret_rule_version and secret_rule_source."
        expected_result: "Every category is detected by the versioned rule set; each detected value is redacted or the record is blocked; unredacted pattern_match_count = 0; the recorded rule version and source match the rule set used; unknown rule version fails closed. Known-value and pattern checks are reported separately. An empty secret is not a match; no empty-string or whole-content redaction is allowed. Known secrets shorter than four characters are exact-match only in credential-bearing fields and are not generic patterns; unsafe over-redaction blocks the record."
        verification: "Table-driven pattern-rule tests with positive and negative controls; assert the rule version, category coverage, redaction or block, and separate counters."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SR-01-AC3
        input: "A preference file written after a run with an endpoint containing userinfo, a sensitive query token, a non-sensitive allowlisted query parameter, and a fragment; and a second case where the sensitive parts cannot be migrated."
        expected_result: "The audit endpoint contains scheme, host, and path only. The restore endpoint keeps scheme, host, path, the non-sensitive allowlisted query parameter, and secret_ref names; it contains no inline userinfo, sensitive query value, or fragment. The secret_ref resolves from .env or the process environment. In the unmigratable case the sensitive parts are omitted and re_entry_required is set; inline sensitive values = 0."
        verification: "Unit test on the preference writer and resolver; assert audit/restore separation, ref resolution, and re-entry behavior."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SR-01-AC4
        input: "Fault injection in which a known secret remains after redaction, the detector or sanitizer raises, or the rule version is missing or unknown."
        expected_result: "The caller receives a security failure and the dangerous content and affected formal output are not written. If a safe failed manifest or incident record can be written, it records error.stage = security; if it cannot be written safely, no record is required and the system does not claim one. A separate minimal incident record is allowed only when it contains no secret value and is not a formal decision artifact. known-secret leakage = 0; scanner failure treated as pass = 0. Scan and redact before binding/hash; hash projections use redacted canonical values."
        verification: "Fault-injection tests at each writer and sanitizer boundary; assert blocked dangerous output, the allowed minimal incident record, failed run status, and no secret in any record."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SR-01-AC5
        input: "A mixed fixture containing a real secret plus public URLs, ticker symbols, dates, model ids, vendor names, status codes, reason codes, counts, timings, and relative paths."
        expected_result: "Only the secret values are replaced; all non-secret values are byte-identical after canonicalization; no whole record, whole URL, or long non-secret string is removed. Over-redaction count = 0. Public URLs in non-audit fields are preserved; audit/display endpoint fields follow the scheme/host/path rule; the two rules are not required to be byte-identical at the same time."
        verification: "Unit test comparing the redacted and unredacted canonical values; assert secret markers and preserved non-secret fields."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SR-01-AC6
        input: "A run that exercises every in-scope boundary, with a complete scan_scope record and a scan result; a control case with a boundary omitted."
        expected_result: "Every in-scope boundary is scanned and named in scan_scope; rule_version, per-write write_scan_status, and final run_scan_status are recorded; a running manifest may have run_scan_status = not_run, while a completed manifest requires both statuses clean or redacted; out-of-scope boundaries are named explicitly. The omitted-boundary control fails the check. The result states that it proves only the defined scope, rules, and fixtures, not all possible credentials; universal-safety claim = 0. No recursive scan of the scanner's own result; export diagnostics are in scope only if export is later enabled."
        verification: "Boundary-coverage audit plus a missing-boundary negative control; assert scope completeness, version recording, and the documented limitation."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
      - id: SR-01-AC7
        input: "The existing get_scrubbed tests, the existing .env 0600 test, and the new in-scope writers."
        expected_result: "Existing get_scrubbed exact-value scrubbing and the existing .env 0600 behavior continue to pass as preserved controls. The new scan scope adds manifest, final-state, memory, report, logs, preferences, error/gate/availability records, and formal API return. The .env mode is not claimed as a new D1 acceptance item; regressions = 0."
        verification: "Regression suite for existing tests plus boundary inventory for the new scope."
        zero_tolerance: true
        measurement_status: "not_measured"
        threshold_status: "approved"
    tradeoff: Prioritize credential safety and fail-closed records. Path confinement, symlink/junction escape, and archive/history/recovery path safety are SR-02. Export-specific conflict behavior is deferred with FR-05 export.
    implementation_dependencies: [FR-02, INV-01]
    constraint_relations:
      - FR-03
      - SB-01
      - FR-05
      - FR-06
      - FR-07
      - FR-08
      - QR-02
      - SR-02
    conflicts:
      - 'Redaction reduces debugging detail. Resolution: replace only secret values and preserve structure, status, reason codes, counts, timings, and public identifiers.'
      - 'The manifest must record configuration while excluding sensitive parameters. Resolution: use the sanitizer and a sanitized config allowlist.'
      - 'Preferences need the endpoint for the next run, while audit records must not carry secrets. Resolution: audit endpoint is scheme/host/path; restore endpoint keeps non-sensitive query parameters and secret_ref names, never inline sensitive values.'
      - 'A scanner can prove only its scope and rules. Resolution: record scope, rule version, counters, and the explicit limitation; do not claim universal credential absence.'
      - 'Redaction can damage diagnostics. Resolution: preserve non-secret structure and add over-redaction tests.'
      - 'Scanner failure could silently pass. Resolution: fail closed and report a security failure; write a failed record only when it can be written safely.'
    assumptions:
      - Known secret values are collected from the run's configured credentials, URL userinfo, sensitive query values, and sensitive headers; they are held in memory only.
      - secret_pattern_rule has a fixed minimum category set and is versioned with secret_rule_version, secret_rule_source, and effective_at.
      - scan_scope is the closed app-controlled boundary set; external provider logs, shell history, OS/network captures, and service-side logs are out of scope.
      - A clean result means zero known-secret exact matches and zero unredacted pattern matches within the defined scope and fixtures; it does not prove universal secret absence.
      - The audit endpoint is scheme/host/path only; the restore endpoint may retain allowlisted non-sensitive query parameters and secret_ref names.
      - Sensitive values are stored in .env or the process environment; .env mode 0600 is an existing control already tested in the baseline.
      - Redaction replaces only values with a stable marker and preserves keys, structure, and non-secret identifiers.
      - A detector/sanitizer failure or an unredactable secret fails closed with no record write and a security-stage run failure.
      - Path confinement is SR-02; export conflict is deferred with FR-05 export.
    notes: >-
      SR-01 owns credential safety. AC8 moved to SR-02; AC9 (export conflict) is deferred with FR-05 export. Existing get_scrubbed and .env 0600 controls are preserved. No implementation or runtime result is claimed.
  - id: SR-02
    type: security
    title: Path confinement and escape protection for archive, history, and recovery
    priority: Must
    status: draft
    stakeholders:
      - security_reviewer
      - operator
      - reviewer
    sources:
      origin: Split from SR-01-AC8; repository path handling
      evidence:
        - path: TradingAgents/tradingagents/dataflows/symbols.py
          locator: normalize_symbol and safe_ticker_component
          description: Existing ticker normalization and path-component guard reused for path confinement.
          source_type: code
        - path: TradingAgents/tradingagents/reporting.py
          locator: write_report_tree
          description: Report tree writer that must not accept traversal or escape paths.
          source_type: code
        - path: baseline/runs/baseline-20261020-01/results/reports/NVDA_20261020_193209/
          locator: report tree
          description: Baseline path-based report tree; no history or recovery path confinement exists.
          source_type: measured_baseline
    problem: Archive, history, recovery, and diagnostic paths can be derived from tickers, dates, run_id, or report text. Without confinement, traversal, absolute-path injection, symlink/junction escape, or out-of-root writes can overwrite files outside the configured root.
    statement: Paths derived from report prose, ticker/date filters, run_id, or recovery material MUST be confined to the configured archive, history, or recovery root. Traversal, absolute-path injection, symlink/junction escape, and out-of-root writes are forbidden. Report prose MUST NOT control a path or commit state. Credential scanning of archive, history, recovery, and diagnostic records reuses SR-01. Export-specific conflict behavior is deferred with the FR-05 export capability. The rule protects reads and writes. Paths come only from trusted configuration and validated identifiers; report prose cannot control a path. Unnecessary links inside the controlled tree are rejected; lexical checks and resolved-target checks agree. Platform coverage and untested platform behavior are recorded. The base path policy can be implemented before all business modules exist; integration acceptance is separate. Unsupported platforms are rejected or explicitly not claimed; no support claim is made for an untested platform.
    fit_criterion:
      - id: SR-02-AC1
        input: Archive, history, and recovery path fixtures with traversal segments, absolute paths, report prose containing path-like text, and run_id-derived paths.
        expected_result: All generated paths remain within the configured root; out-of-root writes = 0; report prose cannot control a path or commit state; traversal and absolute-path injection are rejected. Both reads and writes are confined; lexical and resolved-target checks agree.
        verification: Path-confinement fixtures and out-of-root write sentinels across archive, history, and recovery.
        zero_tolerance: true
        measurement_status: not_measured
        threshold_status: not_applicable
      - id: SR-02-AC2
        input: Fixtures with symlink and junction escapes and credential sentinels in persisted archive, history, recovery, and diagnostic records.
        expected_result: Symlink/junction escapes are rejected; out-of-root writes = 0; credential sentinels in archive/history/recovery diagnostics = 0; SR-01 known-value and versioned-pattern scans are recorded. Platform coverage is recorded; unsupported-platform tests are marked not executed, not passed. Unsupported platforms are rejected or not claimed, never silently treated as supported.
        verification: Link-escape tests and credential boundary scans across archive/history/recovery diagnostics.
        zero_tolerance: true
        measurement_status: not_measured
        threshold_status: not_applicable
    tradeoff: Prioritize path confinement for the retained archive/history/recovery capabilities. Export-conflict behavior is deferred with FR-05 export; no export-specific guarantee is claimed.
    implementation_dependencies:
      - FR-02
      - FR-05
      - FR-06
      - SR-01
    constraint_relations:
      - INV-01
    conflicts:
      - 'Report prose can contain path-like text. Resolution: paths come only from validated identifiers and remain under the configured root.'
      - 'Symlinks can escape a lexical path check. Resolution: reject symlink/junction escapes and verify the resolved target.'
    assumptions:
      - Archive, history, and recovery roots are configuration values.
      - Export is deferred; its conflict behavior is not part of this requirement.
      - Path rules are established independently of later business-module integration.
    notes: 'Historical source: SR-01-AC8. SR-01 retains credential safety; SR-02 owns path confinement. Export conflict is deferred with FR-05 export.'
conflict_resolutions:
  - id: C-01
    requirements: [FR-02, SR-01]
    description: "FR-02 needs a configuration record; SR-01 forbids sensitive URL parameters."
    resolution: "FR-02 records a sanitized configuration allowlist; SR-01 defines the sanitizer and the zero-match acceptance check."
  - id: C-02
    requirements: [FR-01, INV-01]
    description: "Caching can hide whether a value was reused, which can break provenance consistency."
    resolution: "The run cache stores terminal status, reason, vendor provenance, and vendor-cache-hit state; INV-01 binds the canonical provenance_digest and full records between manifest and final-state, with report and memory carrying the digest plus declared summaries."
  - id: C-03
    requirements: [FR-03, INV-01]
    description: "A user-facing gap summary can omit detail that another artifact retains."
    resolution: "Manifest and final-state contain the full canonical coverage and availability records; report and memory contain the binding, coverage/gap summary, and provenance_digest. INV-01 compares full records only between manifest and final-state and compares report/memory summaries against derived values."
  - id: C-04
    requirements: [FR-03, SB-01]
    description: "FR-03 exposes gaps; SB-01 converts a critical gap into REVIEW, which reduces actionable output."
    resolution: "SB-01 uses the same critical-gap definition as FR-03 and records the gate result; REVIEW is the explicit safe state."
  - id: C-05
    requirements: [FR-02, INV-01]
    description: "A lean manifest may not carry enough detail for the consistency invariant."
    resolution: "The manifest is the canonical machine-readable record. Report, manifest, and final-state carry the current artifact_binding; memory carries the current binding or a reused_decision_ref. Report and memory carry declared summaries and provenance_digest, while manifest and final-state carry the full records."
  - id: C-06
    requirements: [FR-01, FR-02]
    description: "Cache reuse reduces calls, while the manifest must still explain what was served."
    resolution: "The manifest records cache hits and source status; run-cache reuse and vendor-cache reads are distinguishable, and reused values keep their original provenance."
  - id: C-07
    requirements: [FR-02, FR-01, SB-01]
    description: "Recording and gating add work to a latency-sensitive run."
    resolution: "A bounded running manifest is written before model calls and atomically finalized after execution; the safety gate is deterministic and does not call a model. Startup, publish, and manifest-write overhead are measured separately."
  - id: C-08
    requirements: [SR-01, INV-01]
    description: "Redaction can change the exact strings compared across artifacts."
    resolution: "All artifacts use the same sanitizer; consistency checks compare sanitized canonical values and digests, not unsanitized raw text."
  - id: C-09
    requirements: [FR-04, SB-01]
    description: "A deterministic portfolio-risk limit can reduce actionable output, and a separate risk gate would fragment final authority."
    resolution: "FR-04 is a pure evaluator invoked inside the existing SB-01 SafetyGate. SB-01 remains the only formal decision and publication authority; a risk breach, invalid risk input, or evaluator exception produces the existing REVIEW or gate-error outcome with new closed gate reason codes."
  - id: C-10
    requirements: [FR-04, INV-01, INV-02]
    description: "Risk evidence is not part of the stable decision identity, so it could accidentally change memory reuse or require a second binding."
    resolution: "Manifest and final-state carry the current full portfolio_risk_result, input_ref, input_digest, policy snapshot, and policy_digest under the existing record and input hashes. A newly written memory entry carries a declared risk summary; a reused historical entry retains its original evidence and is linked through reused_decision_ref. decision_id, decision_digest, entry_digest, and the INV-01 reuse/version rules remain unchanged."
  - id: C-11
    requirements: [FR-04, FR-03, SB-01]
    description: "Coverage failure and portfolio-risk failure are independent blocking reasons and could be ordered differently across entry points."
    resolution: "Stock Buy or Overweight always enters the FR-04 risk branch, even when coverage already blocks; crypto and other non-stock cases may use not_applicable. SB-01 retains all reason codes. When an ordinary risk input or limit failure and a coverage failure occur together, critical_gap remains primary. When the risk evaluator raises, the gate-error priority applies instead: gate status error, run status failed, primary_reason_code portfolio_risk_evaluator_error, review_class gate_system_error, with critical_gap retained only as a secondary reason."

  - id: C-12
    requirements: [FR-02, FR-06, INV-01]
    description: "A recovery mechanism can introduce a second commit authority or a separate archive transaction."
    resolution: "Recovery continues the existing formal publication and uses the same terminal-manifest completed plus read-time INV-01 condition. No independent commit marker or separate archive transaction is authoritative."
  - id: C-13
    requirements: [FR-05, FR-02, INV-01]
    description: "History can mix old report files with a newer run."
    resolution: "Retrieval consumes the committed report_section_manifest, not arbitrary directory contents; foreign and stale sections fail read-time validation."
  - id: C-14
    requirements: [FR-06, QR-02]
    description: "Correctness and hashing cost time while the recovery target is provisional."
    resolution: "Correctness and model-free recovery remain zero-tolerance. The 2-second nearest-rank p95 is provisional; no validation is skipped and failed or timed-out samples are retained."
  - id: C-15
    requirements: [FR-05, SR-01]
    description: "History and export paths can escape the archive root or overwrite user files."
    resolution: "Path confinement and credential scanning reuse SR-01; non-empty export targets return EXPORT_CONFLICT; legacy reports remain unchanged."
  - id: C-16
    requirements: [FR-06, INV-02]
    description: "Recovery can duplicate or mutate trading-memory policy."
    resolution: "Recovery MAY create the one original planned decision entry if it was never written, or idempotently complete that same entry. It MUST NOT create a different decision entry or an additional duplicate, and MUST NOT create a new memory policy, settlement, or reflection."
  - id: C-17
    requirements: [FR-07, FR-01, FR-03]
    description: "Derived metrics can create a second data path or use ambiguous statement columns."
    resolution: "Facts use structured period identity and the existing FR-01 data access, run cache, provenance, and counters. Ambiguous periods return typed n/a and never merge by date or equal value."
  - id: C-18
    requirements: [FR-07, SB-01, INV-01]
    description: "A correct metric block can coexist with a contradictory model narrative."
    resolution: "The metric block is the numeric authority; metric_conflict disclosure and unverified narrative labeling are mandatory. The formal decision still follows SB-01 and INV-01."
  - id: C-19
    requirements: [FR-08, FR-03, FR-07]
    description: "A downstream brief can drop canonical gaps or the verified metric block while meeting a character limit."
    resolution: "Mandatory content is budgeted and reserved first from the FR-03 state and FR-07 block; mandatory overflow rejects/expands rather than truncates."
  - id: C-20
    requirements: [FR-08, FR-02, INV-01]
    description: "A brief can become a second formal context source or claim unmeasured token savings."
    resolution: "The brief is a downstream view only; full reports and formal artifacts remain unchanged. Token and cost effects are a controlled evaluation with provisional thresholds, not a proven optimization."
  - id: C-21
    requirements:
      - FR-02
      - PR-01
    description: The lifecycle record is functional; its write cost is a separate performance target.
    resolution: FR-02 owns the record and lifecycle; PR-01 owns the provisional paired overhead benchmark.
  - id: C-22
    requirements:
      - FR-08
      - CR-01
    description: The brief is functional delivery; net token/cost improvement is a separate cost claim.
    resolution: FR-08 owns brief fidelity and mandatory content; CR-01 owns the controlled cost evaluation and blocked thresholds.
  - id: C-23
    requirements:
      - FR-07
      - GR-01
    description: Metric correctness needs an independent reference set before implementation.
    resolution: FR-07 owns the metric functions; GR-01 freezes independent companies, periods, sources, and expected values.
  - id: C-24
    requirements:
      - FR-01
      - QR-01
    description: Cache dedup correctness and live model quality are different acceptance questions.
    resolution: FR-01 keeps fixed-replay business equivalence; QR-01 owns live quality thresholds and risk-policy separation.
  - id: C-25
    requirements:
      - SR-01
      - SR-02
    description: Credential leakage and path escape have different threats and tests.
    resolution: SR-01 owns credential scanning; SR-02 owns path confinement and escape protection.
moscow:
  must:
    - FR-01
    - FR-02
    - FR-03
    - FR-04
    - FR-05
    - FR-06
    - FR-07
    - FR-08
    - QR-02
    - SB-01
    - INV-01
    - INV-02
    - SR-01
    - SR-02
    - GR-01
  should:
    - PR-01
    - CR-01
    - QR-01
  could: []
  wont:
    - id: "StockTwits-alternative"
      reason: "The 403 root cause is unknown and no keyless replacement has been validated."
    - id: "SEC-point-in-time-profile"
      reason: "Current SEC classification fields are not proven to be historical vintages and could leak later information."
    - id: "parallel-risk-perspectives"
      reason: "It changes debate semantics and requires a separate quality A/B before adoption."
    - id: "LLM-replay-cache"
      reason: "It can mask data or model changes and is outside the D1 scope."
    - id: "full-exchange-calendar"
      reason: "It adds a new dependency; D1 does not require a calendar service."
    - id: "multi-user-encryption"
      reason: "The D1 deployment is a single-user local tool; the threat model is not approved."
  rationale: >-
    All 18 requirements are retained. 17 are draft pending human review and QR-02 is deferred. The five splits each have a separate approval or acceptance path: PR-01 (overhead threshold), QR-01 (live quality), GR-01 (reference freeze), CR-01 (cost threshold), and SR-02 (path threat model). Functional FR-01..FR-08 preserve the trusted-run chain; invariants remain single requirements; deferred sub-scopes are not claimed as delivered.

