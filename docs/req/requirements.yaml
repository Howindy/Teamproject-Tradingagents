      measurement_status: not_measured
      threshold_status: not_applicable
    - id: SB-01-FC08
      input: 'An entry-point matrix with a critical gap and a Hold rating: CLI run_analysis, programmatic TradingAgentsGraph.propagate,
        a backtest cell, a checkpoint-resumed run, a headless/API run, and a recovery path with saved gate evidence.'
      expected_result: Every entry point and recovery path invokes the same deterministic gate/evidence path and produces
        the same REVIEW outcome and formal notice; recovery verifies the original saved gate result, version, binding,
        and evidence and does not re-evaluate with a new policy. No entry point bypasses the gate; bypass count = 0;
        a recovery with missing or incompatible evidence is rejected.
      verification: Entry-point integration matrix; assert gate invocation, formal result, and manifest safety_gate
