requirements:
- id: FR-01
  type: functional
  title: Deterministic derived financial metrics for analysts
  priority: must
  status: draft
  stakeholders:
  - analyst
  - trader
  - reviewer
  source:
    origin: Baseline run evidence and SEC EDGAR statement format inspection
    evidence:
    - path: baseline/runs/baseline-20261020-01/transcripts/final_state.json
      locator: fundamentals_report; final_trade_decision
      description: Model-computed Q2 FY2027 growth of +68.6% (filed figures give +105.9%) reached the
        final decision.
      source_type: measured_baseline
    - path: TradingAgents/tradingagents/dataflows/vendors/sec_edgar.py
      locator: L245 get_income_statement docstring; L83 _YEAR_TO_DATE
      description: Fourth quarters are never derived and cash flows may be year to date, so quarterly
        columns are irregular.
      source_type: code
    - path: TradingAgents/tradingagents/agents/analysts/fundamentals_analyst.py
      locator: L14 TOOLS; L28 system_message
      description: The analyst receives raw statements only and has no tool that computes growth, margins,
        or multiples.
      source_type: code
  problem: 'Growth rates, margins, and valuation multiples are computed by the model from irregular statement
    tables. Quarterly tables omit fourth quarters and contain duplicate end dates, so counting columns
    picks the wrong comparison period. In the baseline a wrong year-over-year growth rate (+68.6% instead
    of +105.9%) turned an accelerating trend into a stated deceleration and reached the final decision.
    "Trailing P/E" was also cited without a definition although the two common definitions give 44.3x
    and 27.4x.

    '
  statement: 'The system MUST provide a get_derived_metrics analyst tool and a deterministic module that
    compute, from SEC EDGAR statements filed on or before the analysis date, the following metrics for
    the latest four periods: revenue, net-income, and diluted-EPS year-over-year growth (quarterly and
    annual), revenue quarter-over-quarter growth, gross, operating, and net margin, trailing-twelve-month
    revenue and diluted EPS, P/E on trailing-twelve-month EPS and P/E on fiscal-year EPS reported separately,
    current ratio, liabilities-to-assets, and free cash flow (operating cash flow minus capital expenditure)
    with its year-over-year growth on the reported span. Growth on a non-positive base MUST be n/a. Comparison
    periods MUST be matched by period-end date (year ago: 355-380 days earlier; prior quarter: 80-100
    days earlier) and never by column position. A metric without a single unambiguous comparison period
    MUST be reported as n/a with a reason. The module MUST NOT derive a quarter by subtraction. Every
    value MUST state its period end, inputs, and formula. The fundamentals analyst MUST be offered the
    tool, and code MUST append the computed table to the end of the fundamentals report as a verified-metrics
    block. Prompts of the fundamentals analyst, both researchers, and the three risk debaters MUST instruct
    the model to quote these values instead of recomputing them.

    '
  acceptance_criteria:
  - id: FR-01-AC1
    input: Baseline NVDA quarterly and annual income statements (tool-outputs-clean 0019 and 0045) with
      analysis date 2026-10-19.
    expected_result: revenue_yoy for 2026-07-26 = +105.9% against 2025-07-27; revenue_yoy for 2026-04-26
      = +85.2%; revenue_qoq = +17.9%; gross, operating, and net margins = 75.0%, 66.2%, 62.0%; each row
      lists inputs and formula.
    verification: Offline unit test on the recorded baseline fixture; expected values computed by hand
      from the filed figures.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: approved
  - id: FR-01-AC2
    input: The AC1 fixture with the 2025-07-27 column removed, and a fourth-quarter period whose year-ago
      quarter is absent.
    expected_result: Both metrics are n/a with a stated reason; neighboring-column substitutions = 0;
      no value equal to a ratio against any other period is emitted.
    verification: Offline unit tests with modified fixtures; assert n/a and reason text.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: approved
  - id: FR-01-AC3
    input: Fixtures with two end dates within 7 days carrying equal values, and two carrying different
      values.
    expected_result: Equal values are merged and computed once; different values give n/a marked ambiguous;
      silent choice between candidates = 0.
    verification: Offline unit tests including the 2010-07-31 / 2010-08-01 pair from the baseline fixture.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: approved
  - id: FR-01-AC4
    input: The AC1 fixture plus close price 217.09 on 2026-10-19.
    expected_result: ttm_revenue = 302,969; ttm_eps = 7.91 marked approximate; pe_ttm = 27.4x and pe_fy
      = 44.3x shown as separate labeled rows.
    verification: Offline unit test with the price source mocked.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: approved
  - id: FR-01-AC5
    input: The same statements evaluated with analysis dates 2026-10-19 and 2026-06-01, and a cash-flow
      fixture with year-to-date columns.
    expected_result: For 2026-06-01 the latest period is 2026-04-26 and no later filing or price is used;
      free cash flow is reported on the labeled 6- or 9-month span against the same span a year earlier;
      look-ahead uses = 0; cross-filing subtractions = 0.
    verification: Offline unit tests with fixtures generated through the existing SEC vendor as-of filter
      and mocked price rows.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: approved
  - id: FR-01-AC6
    input: Three reference companies with different fiscal calendars (NVDA plus two chosen at implementation),
      using values published independently of the implementation such as company earnings releases or
      hand calculation by a team member.
    expected_result: All covered metrics match the independent references within 0.1 percentage point
      (ratios) or 1 unit of the source precision; mismatches = 0; repeated evaluation of identical input
      gives identical output.
    verification: Offline fixture tests; the reference values and their sources are recorded with the
      tests and are not generated by the code under test.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: provisional
  - id: FR-01-AC7
    input: A ticker absent from SEC EDGAR, a crypto instrument, and a vendor error during statement retrieval.
    expected_result: The tool returns an explicit not-supported or unavailable message, no exception escapes,
      and the analyst flow continues; crashes = 0.
    verification: Offline unit tests with the vendor functions mocked to raise NoMarketDataError and VendorUnavailableError.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: approved
  - id: FR-01-AC8
    input: The fundamentals analyst node run offline with a fake LLM, and the five downstream prompt builders.
    expected_result: get_derived_metrics is in the analyst TOOLS; the returned fundamentals_report ends
      with the code-generated verified-metrics block identical to the tool output; all six prompts contain
      the quote-not-recompute instruction.
    verification: Offline node tests in the style of the existing analyst and prompt-integrity tests.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: approved
  dependencies: []
  conflicts:
  - 'Upstream refuses to derive fourth quarters. Resolution: FR-01 never derives a quarter and reports
    those comparisons as n/a; TTM uses only filed annual and quarterly figures.'
  - 'Summing quarterly diluted EPS ignores share-count changes. Resolution: ttm_eps is labeled approximate
    and pe_fy is always reported beside pe_ttm.'
  - 'The appended block lengthens the fundamentals report. Resolution: the block is compact and is counted
    in CR-01 measurements.'
  assumptions:
  - Instruments covered are US SEC filers with us-gaap facts; others receive not-supported.
  - The model may still recompute values despite instructions; FR-01 acceptance tests the tool and the
    appended block, not model compliance.
  - Price comes from the existing verified market snapshot and only rows on or before the analysis date
    are used.
  notes: 'New files: tradingagents/dataflows/derived_metrics.py (a pure calculator with a separate fetch
    adapter), a tool module, and tests. Existing files changed: fundamentals_analyst.py and the prompts
    of bull_researcher.py, bear_researcher.py, and the three *_debator.py files. The calculator takes
    statement text and a price as input and performs no I/O, so AC1 to AC6 are pure-function tests and
    AC7 and AC8 are offline tests with mocked vendors or a fake LLM. Tradeoff: deterministic metrics are
    reliable but narrower than free-form model analysis, and SEC-only coverage excludes non-US instruments.

    '
- id: CR-01
  type: cost
  title: Bounded analyst-report context for downstream agents
  priority: must
  status: draft
  stakeholders:
  - operator
  - reviewer
  - trader
  source:
    origin: Baseline token measurement and downstream prompt assembly inspection
    evidence:
    - path: baseline/runs/baseline-20261020-01/metrics.json
      locator: tokens_in; tokens_out; llm_calls
      description: Baseline used 156,541 input and 27,639 output tokens in 19 LLM calls.
      source_type: measured_baseline
    - path: TradingAgents/tradingagents/agents/context.py
      locator: L190 report_or_absent
      description: The single function through which all five downstream agents read full analyst reports.
      source_type: code
    - path: TradingAgents/tradingagents/agents/researchers/bull_researcher.py
      locator: L18-21 report_or_absent calls and prompt f-string
      description: Each downstream prompt interpolates all four full reports; the same pattern is in bear_researcher.py
        L18 and each *_debator.py L23.
      source_type: code
  problem: 'Five downstream agents each receive the four full analyst reports (45,219 characters in the
    baseline). This repeated evidence is an estimated 36-41% of the run''s input tokens. It is sent on
    every run, well below any context-overflow threshold, so limit-triggered compression would not reduce
    it.

    '
  statement: For the Bull Researcher, Bear Researcher, and the three risk debaters, the system MUST replace
    each full analyst report with a downstream brief of at most a configured size (provisional 2,000 characters
    per report). The market, news, and fundamentals analysts MUST emit the brief in a marked block containing
    stance, key figures, key levels or triggers, and data gaps. A deterministic extractor MUST use that
    block, or fall back to deterministic condensation that keeps headings, conclusion paragraphs, and
    any paragraph stating unavailable or withheld data. Reports already within the size limit MUST pass
    unchanged. The FR-01 verified-metrics block MUST be kept verbatim. Full reports shown to users MUST
    be unchanged. Verification uses offline report fixtures and deterministic prompt checks. Token savings
    remain an estimate; no measured token-reduction or decision-quality benefit is claimed.
  acceptance_criteria:
  - id: CR-01-AC1
    input: Reports with a valid brief block, without one, with an oversized block, and shorter than the
      limit.
    expected_result: Valid blocks are extracted; missing or oversized blocks use the fallback within the
      limit; short reports pass byte-identical; output never exceeds the limit.
    verification: Offline unit tests of the extractor and fallback.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: approved
  - id: CR-01-AC2
    input: Baseline reports from final_state.json, including the news and fundamentals reports that state
      unavailable or withheld data (5 and 7 mentions), with an FR-01 block appended to the fundamentals
      report.
    expected_result: Every paragraph stating unavailable, withheld, or not-configured data is present
      in the brief or fallback output; the verified-metrics block is byte-identical; dropped gap statements
      = 0.
    verification: Offline tests on the recorded baseline text.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: approved
  - id: CR-01-AC3
    input: Downstream prompt builders called with fixed state fixtures, retaining a copy of every full
      report field.
    expected_result: Only the report sections supplied to downstream prompts are condensed; the full report
      fields in state remain unchanged.
    verification: Offline prompt comparison tests.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: approved
  dependencies:
  - FR-01
  conflicts:
  - 'Shorter context can weaken debate detail. Resolution: brief size is configurable, data gaps and verified
    metrics are never dropped, and offline content-preservation checks guard the hand-off.'
  - 'Briefs add analyst output tokens. Resolution: the added output cost remains unmeasured and no net
    token saving is claimed.'
  - 'The team ContextAssembler design also compresses evidence. Resolution: CR-01 is the always-on report
    policy for downstream agents within that design, not a second assembler; the limit-triggered behavior
    stays with its owner.'
  assumptions:
  - The model mostly follows the brief format; the deterministic fallback keeps the requirement met when
    it does not.
  notes: 'Files changed: context.py; market_analyst.py, news_analyst.py, and fundamentals_analyst.py;
    and the five downstream agent files. The brief limit is configured in context.py. No comparison harness
    or baseline-mode switch is included. Cost reductions are planning estimates only; acceptance covers
    deterministic extraction, preservation, and prompt hand-off.'
conflict_resolutions:
- id: C-01
  requirements:
  - FR-01
  - CR-01
  description: Condensing reports could drop verified metrics, which would push downstream agents back
    to model arithmetic.
  resolution: The FR-01 verified-metrics block is excluded from condensation and copied verbatim into
    the fundamentals brief.
- id: C-02
  requirements:
  - FR-01
  - CR-01
  description: The FR-01 block and new prompt instructions add tokens that CR-01 is trying to reduce.
  resolution: Retain the verified-metrics block and count it when estimating context size. No measured
    net token saving or total-input target is claimed in this draft.
moscow:
  must:
  - FR-01
  - CR-01
  should: []
  could: []
  wont:
  - id: derived-quarter-arithmetic
    reason: Subtracting filed periods creates figures no filing states; upstream rejects this and FR-01
      keeps that rule.
  - id: non-sec-fundamentals
    reason: yfinance and Alpha Vantage use different formats and lack filing-date vintages; supporting
      them needs separate validation.
  - id: llm-summarization-call
    reason: A separate summarization call adds cost, latency, and another model failure path; briefs are
      written by the analysts and extracted by code.
  - id: citation-enforcement
    reason: Checking that every quoted figure carries a metric citation depends on model compliance and
      is deferred as a later extension.
  rationale: Both requirements are proposed as Must within this personal draft and remain pending team
    approval.
traceability:
- req_id: FR-01
  code_refs:
  - path: TradingAgents/tradingagents/dataflows/vendors/sec_edgar.py
    locator: L245 get_income_statement; L255 get_cashflow; L83 _YEAR_TO_DATE
    description: Statement sources and the no-derived-quarter and year-to-date rules FR-01 follows.
  - path: TradingAgents/tradingagents/agents/tools.py
    locator: L115 get_balance_sheet; L134 get_cashflow; L153 get_income_statement
    description: Existing tool pattern with InjectedState ticker and trade date to copy for the new tool.
  - path: TradingAgents/tradingagents/agents/analysts/fundamentals_analyst.py
    locator: L14 TOOLS; L28 system_message
    description: Where the new tool is offered and the verified-metrics block is appended.
  baseline_refs:
  - path: baseline/runs/baseline-20261020-01/transcripts/tool-outputs-clean/0019_get_income_statement.txt
    locator: Revenue row
    description: Recorded quarterly revenue used for the AC1 to AC4 fixtures.
  - path: baseline/runs/baseline-20261020-01/transcripts/final_state.json
    locator: fundamentals_report; final_trade_decision
    description: Location of the mis-aligned +68.6% growth figure.
  notes: Design only. Reference values in AC1 and AC4 were computed from recorded figures; nothing is
    implemented.
- req_id: CR-01
  code_refs:
  - path: TradingAgents/tradingagents/agents/context.py
    locator: L190 report_or_absent
    description: Insertion point for the brief extractor used by all downstream agents.
  - path: TradingAgents/tradingagents/agents/researchers/bull_researcher.py
    locator: L18 report_or_absent calls
    description: Representative downstream consumer; same pattern in bear_researcher.py and the three
      debaters.
  baseline_refs:
  - path: baseline/runs/baseline-20261020-01/metrics.json
    locator: tokens_in; tokens_out
    description: Single-run token observation used only as context for planning estimates.
  notes: Token share of repeated reports is estimated from characters. Verification is offline and does
    not establish live token savings or decision-quality equivalence.
validation:
  status: passed
  schema: docs/req/req-schema.json
  tool: Python jsonschema Draft 2020-12 and custom consistency checks
  checks:
  - id: schema_validation
    result: pass
    details: Validated against the team schema (same file in the Yifan and Jiang branches) with Python
      jsonschema Draft 2020-12 on 2026-11-03.
  - id: reference_consistency
    result: pass
    details: Requirement and acceptance IDs are unique, dependencies and MoSCoW entries name defined requirements,
      and every referenced repository path exists at main 2c8996e.
  - id: measurement_honesty
    result: pass
    details: Measured baseline values are labeled measured; token shares are labeled estimates; all targets
      are provisional and no implementation or benefit is claimed.
  notes: These checks validate document structure and internal consistency only; they do not prove implementation
    or team approval.
open_questions:
- id: OQ-01
  question: Does the team confirm FR-01 and CR-01 as this member's identifiers, and which ADR number should
    the design use?
  impact: Requirement IDs, trace matrix, and ADR file name.
  blocking: true
- id: OQ-02
  question: Does the owner of the ContextAssembler design and the BO-12 token target agree that CR-01
    implements the always-on report policy within that design?
  impact: Whether CR-01 proceeds or this member falls back to a different non-functional requirement.
  blocking: true
- id: OQ-04
  question: Is an approximate TTM EPS from summed quarterly EPS acceptable, or should the first version
    report only fiscal-year P/E?
  impact: FR-01 metric list and AC4.
  blocking: false
- id: OQ-05
