      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: provisional
    - id: SB-01-FC11
      input: 'A risk-branch gate matrix: stock Buy with complete coverage and passed risk; stock Buy with a missing
        candidate; stock Overweight with an unsupported candidate; stock Buy with a limit breach; stock Buy with a missing
        policy snapshot; stock Buy with an evaluator exception; stock Buy with partial coverage and missing input; crypto
        Buy with complete coverage; and Hold with complete coverage.'
      expected_result: The complete-coverage stock Buy passes only when the gate actually calls FR-04 and the risk result
        passes. Missing/unsupported stock candidates and a missing policy snapshot block with portfolio_risk_input_invalid
        and review_class input_invalid; they are never not_applicable. A limit breach blocks with portfolio_risk_limit_exceeded
        and review_class = portfolio_risk_limit. An evaluator exception produces gate error, portfolio_risk_evaluator_error,
        review_class gate_system_error, REVIEW, failed run status, and no tradeable output. Partial-coverage stock Buy
        retains both critical_gap and the real blocked risk result, with critical_gap primary. Crypto Buy and Hold use
        not_applicable and follow SB-01. A model-supplied passed risk object is rejected; risk-bypass count = 0; masked-failure
        count = 0.
      verification: Table-driven SB-01 gate matrix over the risk branch; assert pass condition, primary reason, risk
        status, review class, run status, and formal rating for every row.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: provisional
    - id: SB-01-FC12
      input: A stock Buy fixture with partial coverage, a non-empty critical_gap list, an FR-04 evaluator exception
        in the same run, and a variant where the failed record cannot be safely written.
      expected_result: The unique combined result is gate status error, run status failed when a safe record is writable,
        reason_codes containing both critical_gap and portfolio_risk_evaluator_error, primary_reason_code = portfolio_risk_evaluator_error,
        review_class = gate_system_error, blocked_for_review, REVIEW, and no tradeable output. It MUST NOT be status
        blocked, MUST NOT have critical_gap as primary, and MUST NOT hide the system exception. When no safe record
        can be written, the run is failed for the caller and no failed file is claimed.
      verification: Combined coverage-gap and evaluator-exception fault-injection test; assert gate status, run status,
        all reason codes, primary reason, review class, formal rating, and absence of tradeable output.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    tradeoff: Prioritize deterministic fail-closed safety and strict model-proposal/formal-decision separation. Accept
      REVIEW and reduced actionable output; the model cannot override the gate. Intermediate outputs may show the proposal
      only when marked unapproved.
    implementation_dependencies:
    - FR-03
    - FR-02
    constraint_relations:
    - INV-01
    - FR-04
    - INV-02
    - FR-07
    - FR-08
    conflicts:
    - 'REVIEW reduces actionable output. Resolution: REVIEW is an explicit terminal safe state, not a hidden Hold.'
    - 'Preserving the model proposal helps audit but risks being read as the conclusion. Resolution: retain it only
      as model_proposal with proposal_status = unapproved and a separate report section.'
    - 'The model can write coverage claims. Resolution: only the program-produced coverage_snapshot is authoritative;
      model claims are ignored.'
    - 'A gate failure can stop a completed analysis. Resolution: fail closed with REVIEW, a gate-unavailable notice,
      and a failed run record.'
    - 'Intermediate streaming is useful for observability. Resolution: intermediate outputs may show the proposal only
      when explicitly marked intermediate/unapproved; formal outputs use formal_decision.'
    - 'Different entry points could implement different gates. Resolution: one shared finalization path is required
      by FC08.'
    - 'A portfolio-risk check can look like a second gate. Resolution: FR-04 is a pure evaluator invoked inside this
      SafetyGate; SB-01 remains the only final decision authority.'
    assumptions:
    - REVIEW is a terminal non-tradeable sentinel outside the five-tier rating set; it is not a sixth trading rating.
    - coverage_status and critical_gaps come only from the FR-03 coverage_snapshot; the model cannot supply or mutate
      them.
    - 'Gate status is closed: passed, blocked, error. formal_decision.status is closed: approved, blocked_for_review.
      model_proposal.proposal_status is unapproved.'
    - 'gate_reason_code is closed: critical_gap, coverage_gap_mismatch, invalid_coverage_status, missing_gap_list, invalid_gap_type,
      missing_availability_record, invalid_critical_profile, invalid_model_rating, model_review, missing_gate_input,
      stale_coverage_snapshot, snapshot_hash_mismatch, gate_internal_error, portfolio_risk_input_invalid, portfolio_risk_limit_exceeded,
      portfolio_risk_evaluator_error.'
    - 'reason_codes are sorted by a fixed priority for determinism: gate_internal_error, portfolio_risk_evaluator_error,
      missing_gate_input, invalid_critical_profile, stale_coverage_snapshot, snapshot_hash_mismatch, invalid_coverage_status,
      missing_gap_list, invalid_gap_type, missing_availability_record, coverage_gap_mismatch, invalid_model_rating,
      model_review, critical_gap, portfolio_risk_input_invalid, portfolio_risk_limit_exceeded.'
    - Formal outputs are CLI final summary, complete_report.md/html, 5_portfolio/decision.md, final-state, memory, manifest,
      API return, and backtest scoring. Intermediate outputs are streaming messages, debug output, staging files, checkpoint
      state, and raw agent text.
    - When blocked, the formal decision text uses the review_class matched to the primary reason, states that manual
      review is required, and lists all reason codes and critical gaps; it contains no trade instruction as the formal
      conclusion.
    - The gate runs before the terminal manifest and every formal output with a formal decision; the running startup
      manifest may precede the gate and uses safety_gate.status = not_run. The terminal commit is evaluated after the
      gate with no circular wait; a later scan/write failure is not cleared by gate pass.
    - 'When multiple reasons occur, primary_reason_code is the first reason in the fixed priority list; review_class
      is derived from that primary reason. All reason_codes are retained and listed as secondary reasons, but they do
      not change the primary formal prompt. The mapping is: critical_gap or missing_availability_record -> data_insufficient;
      invalid_model_rating -> model_rating_invalid; model_review -> model_review; invalid_coverage_status or coverage_gap_mismatch
      -> coverage_inconsistent; missing_gap_list, invalid_gap_type, missing_gate_input, invalid_critical_profile ->
      input_invalid; stale_coverage_snapshot, snapshot_hash_mismatch, gate_internal_error, portfolio_risk_evaluator_error
      -> gate_system_error; portfolio_risk_input_invalid -> input_invalid; portfolio_risk_limit_exceeded -> portfolio_risk_limit;
      passed -> none.'
    - The model proposal may be null when no proposal was produced, or may carry rating = null and validation_status
      invalid_rating/missing; the gate maps these cases to invalid_model_rating and never invents Hold, REVIEW, or template
      model text as the proposal.
    - Stock Buy or Overweight always enters the FR-04 risk branch; only crypto, other non-stock assets, and Hold, Underweight,
      Sell, or REVIEW may use not_applicable; an invalid rating blocks with invalid_model_rating. Missing or unsupported
      stock candidates block, not not_applicable.
    - The risk policy is a locatable portfolio_risk_policy_snapshot with actual thresholds, freshness window, precision
      rule, threshold_status, and human_approval_ref. Provisional values are allowed only when explicitly labeled provisional
      with a null human approval reference.
    - FR-04 risk evaluation is an internal gate step; it does not create a second final decision path or a second memory
      write.
    - A safe failed record is required only when it can be written; startup/scan/write/security exceptions follow FR-02/SR-01
      and never produce tradeable success.
    - When coverage fails and the risk evaluator errors in the same run, the unique result is gate status error, run
      status failed when writable, primary reason portfolio_risk_evaluator_error, review_class gate_system_error, and
      formal REVIEW; critical_gap is retained as a secondary reason and cannot mask the system exception.
    - Gate failure is classified as blocked or error by a fixed table; a system exception is error and is never hidden
      behind a data gap.
    notes: "Decision table. complete + empty gaps + valid rating + valid profile + all critical records + current snapshot\
      \ + (FR-04 passed or allowed not_applicable) -> passed. complete + non-empty gaps -> blocked coverage_gap_mismatch.\
      \ partial + empty gaps -> blocked coverage_gap_mismatch. partial + non-empty gaps -> blocked critical_gap. Invalid\
      \ coverage -> invalid_coverage_status. Missing gaps -> missing_gap_list. Wrong gap type -> invalid_gap_type. Missing\
      \ availability record -> missing_availability_record. Invalid profile -> invalid_critical_profile. Missing/invalid\
      \ rating -> invalid_model_rating. Model REVIEW -> model_review. Missing gate input -> missing_gate_input. Stale/mismatched\
      \ snapshot -> stale_coverage_snapshot or snapshot_hash_mismatch. Gate exception -> error/gate_internal_error.\
      \ Stock Buy and Overweight always run FR-04. A missing, invalid, inconsistent, insufficient-cash, unsupported,\
      \ or unavailable-policy risk input -> blocked portfolio_risk_input_invalid with review_class input_invalid; a\
      \ risk limit breach -> blocked portfolio_risk_limit_exceeded with review_class = portfolio_risk_limit; an evaluator\
      \ exception -> error/portfolio_risk_evaluator_error with review_class gate_system_error and no tradeable output.\
      \ A stock Buy or Overweight risk result is never not_applicable. Crypto and other non-stock assets and Hold, Underweight,\
      \ Sell, or REVIEW use not_applicable; an invalid rating blocks with invalid_model_rating and remains subject to\
      \ the other rows. When coverage and a risk input or limit failure both occur, critical_gap remains primary and\
      \ the risk reason is retained as secondary. A risk evaluator exception is a gate error and follows the higher-priority\
      \ error path. \n\nAuthoritative blocked/error decision table (primary status is unique; all rows fail closed):\n\
      \n| Case | Gate status | Primary reason | Review class | Formal rating | Run outcome |\n|---|---|---|---|---|---|\n\
      | invalid coverage enum | blocked | invalid_coverage_status | coverage_inconsistent | REVIEW | completed if trustworthy\
      \ record materials exist; otherwise failed/no tradeable |\n| missing gap list | blocked | missing_gap_list | input_invalid\
      \ | REVIEW | completed if trustworthy record materials exist; otherwise failed/no tradeable |\n| wrong gap type\
      \ | blocked | invalid_gap_type | input_invalid | REVIEW | completed if trustworthy record materials exist; otherwise\
      \ failed/no tradeable |\n| missing availability record | blocked | missing_availability_record | data_insufficient\
      \ | REVIEW | completed if trustworthy record materials exist; otherwise failed/no tradeable |\n| invalid critical\
      \ profile | blocked | invalid_critical_profile | input_invalid | REVIEW | completed if trustworthy record materials\
      \ exist; otherwise failed/no tradeable |\n| invalid or missing rating | blocked | invalid_model_rating | model_rating_invalid\
      \ | REVIEW | completed if trustworthy record materials exist; otherwise failed/no tradeable |\n| missing gate\
      \ input | blocked | missing_gate_input | input_invalid | REVIEW | completed if trustworthy record materials exist;\
      \ otherwise failed/no tradeable |\n| stale snapshot | blocked | stale_coverage_snapshot | gate_system_error |\
      \ REVIEW | completed if trustworthy record materials exist; otherwise failed/no tradeable |\n| snapshot content\
      \ hash mismatch | blocked | snapshot_hash_mismatch | gate_system_error | REVIEW | completed if trustworthy record\
      \ materials exist; otherwise failed/no tradeable |\n| unsupported profile version | blocked | invalid_critical_profile\
      \ | input_invalid | REVIEW | completed if trustworthy record materials exist; otherwise failed/no tradeable |\n\
      | unsupported snapshot schema version | blocked | snapshot_hash_mismatch (internal_detail=unsupported_snapshot_version)\
      \ | gate_system_error | REVIEW | completed if trustworthy record materials exist; otherwise failed/no tradeable\
      \ |\n| gate internal exception or timeout | error | gate_internal_error | gate_system_error | REVIEW | failed\
      \ when safe writable; otherwise typed error/no tradeable |\n| risk evaluator exception | error | portfolio_risk_evaluator_error\
      \ | gate_system_error | REVIEW | failed when safe writable; otherwise typed error/no tradeable |\n| coverage gap\
      \ with ordinary risk input or limit failure | blocked | critical_gap | data_insufficient | REVIEW | completed\
      \ if trustworthy record materials exist; risk reasons retained |\n| coverage gap with risk evaluator exception\
      \ | error | portfolio_risk_evaluator_error | gate_system_error | REVIEW | failed when safe writable; critical_gap\
      \ retained as secondary |\n| gate passed but later scan/write failure | passed (in-memory) | none | none | model\
      \ rating in memory only | run failed/not published; no approved exposure |\n\nThe gate result and in-memory formal\
      \ decision are not publication success. A blocked run is completed only with real trustworthy materials satisfying\
      \ the formal-record contract; otherwise it is failed or safely errors. No profile, snapshot, gap, input, or completed\
      \ record is fabricated."
  - id: INV-01
    type: invariant
    title: One bound formal result across report, manifest, final-state, and memory
    priority: Must
    status: approved
    stakeholders:
    - reviewer
    - trader
    - analyst
    sources:
      origin: Repository analysis and measured baseline
      evidence:
      - path: TradingAgents/tradingagents/reporting.py
        locator: L92 write_report_tree
        description: Reports are written to a report tree, independent of the state log and memory log.
        source_type: code
      - path: TradingAgents/tradingagents/graph/trading_graph.py
        locator: L437-L475 _log_state
        description: The full-state log is written separately from reports and memory and has no binding identity.
        source_type: code
      - path: TradingAgents/tradingagents/memory/log.py
        locator: L32-L60 store_decision and later settlement
        description: The memory entry is written separately, then updated later with outcome and reflection; no run_id
          or record binding ties it to the other artifacts.
        source_type: code
      - path: baseline/runs/baseline-20261020-01/report-consistency.json
        locator: all fields
        description: The baseline checked decision/report/full-state consistency but did not measure source-status consistency,
          identity binding, or memory agreement.
        source_type: measured_baseline
      - path: baseline/runs/baseline-20261020-01/memory/trading_memory.md
        locator: entry tag and DECISION block
        description: The baseline memory entry contains only trade date, ticker, rating, pending status, and prose;
          it has no run_id, record_version, decision digest, coverage, gaps, or gate result.
        source_type: measured_baseline
    problem: 'The baseline wrote decision data to reports, a full-state log, and memory, but no identity bound them
      to one formal result and no invariant defined which fields each artifact must carry. Report and memory held different
      shapes from the manifest and final-state, source-status and fallback comparison granularity was undefined, and
      memory was later updated by settlement. Missing artifacts, partial writes, crash recovery, and retries had no
      consistency contract.

      '
    statement: 'INV-01 holds at the completed checkpoint and on every read of a completed run''s formal artifacts, not
      while artifacts are incomplete. Report, manifest, and final-state MUST bind to the current formal result through
      artifact_binding: identical run_id, decision_id, record_version, decision_digest, gate_status, formal_decision_status,
      final_rating, coverage_status, critical_gap_ids, and coverage_snapshot_hash; record_hash, when present, MUST also
      match. The stable record identity is the FR-03 identity: executed records use (run_id, data_query_key); synthetic
      component_missing records use (run_id, requirement_id, capability, component). Status, source, counts, and attempts
      are attributes, not identity; one execution MAY support multiple requirements without duplicating the execution.
      The versioned comparison projection is separate from identity and MUST include record_kind, the query or synthetic
      identity, canonical requested window, result status/reason, ordered attempts and actual evidence timestamps, serving
      and attempted sources, fallback state, every support''s requirement/capability/component/contract/version/evidence/satisfaction
      result, profile linkage, and retained provenance. Manifest and final-state carry the full canonical records; report
      carries the binding plus declared summaries; memory follows new/reuse/disabled below. A new memory entry MUST
      carry the current binding. A reused historical memory entry MUST retain its original source_run_id, snapshot,
      evidence, and binding, and MUST be linked from current artifacts through reused_decision_ref; it is not required
      to carry the current run_id, current coverage summary, or current risk evidence. A disabled memory configuration
      has no memory entity and does not require an entry hash. Canonicalization is per-field, not a global trim or deletion
      of every field with the same name. Encoding is UTF-8/NFC/LF, object keys are sorted, and semantic arrays are ordered
      as declared; attempt order is preserved. Only declared decision-text line-ending or trailing-whitespace normalization
      is allowed; relative paths, source IDs, evidence content, business times, risk valuation/cutoff, filing/evidence
      windows, and attempt times are retained. Run-level generated/observed metadata may be excluded only by an explicit
      field list. A content digest, an artifact file SHA, and the acyclic record projection are separate values. The
      record projection excludes its own digest and every result-derived hash; a file containing a terminal record does
      not include a hash of itself. Before commit, a candidate with a missing or empty required artifact or incomplete
      binding MUST NOT be recorded as completed. After a terminal atomic commit, a later deletion, corruption, or unsupported
      version leaves the original terminal bytes intact but the read MUST fail and MUST return a non-success status;
      a completed record is not rewritten as failed and is not silently repaired. The internal publish_state values
      (including partial, staged, and validated) are not public run_status values; run_status is running/completed/failed.
      Completion is truthful only at terminal run_status = completed plus read-time INV-01; no independent marker is
      authoritative. Retention and rotation MUST use an independent, verifiable retention record containing entry identity/digest,
      policy version, operation time/reason, and permanent source proof. A legal rotation does not rewrite the original
      manifest and does not change the committed formal result; the retained source proof keeps historical references
      verifiable. Illegal modification or deletion of a retained entry is a binding failure. Version allocation MUST use a high-water mark and
      exceed the maximum of all allocated versions, including pending and failed reservations; the effective version
      is the maximum version whose source terminal manifest is legally committed and binding-valid. A retry or recovery
      preserves the original run/decision/reservation identity and content, does not create a duplicate entry, and a
      failed_precommit retry follows FR-06; a completed record is immutable.'
    fit_criterion:
    - id: INV-01-FC01
      input: A completed run with one success, one unavailable, one withheld, and one legal fallback source; capture
        the report binding block, manifest, final-state, and memory.
      expected_result: 'Report, manifest, and final-state bind the current run: run_id, decision_id, record_version,
        decision_digest, gate_status, formal_decision_status, final_rating, coverage_status, critical_gap_ids, and coverage_snapshot_hash
        are exact across those three. Memory is new (current binding), reused (valid reused_decision_ref with matching
        stable decision identity and original evidence), or disabled (no entity). A reused historical entry is not required
        to equal current run/source/coverage fields. An execution that supports multiple requirements remains one execution
        with a complete support list. Mismatches = 0.'
      verification: Integration test; extract machine-readable bindings and summaries from every artifact and compare
        against the canonical manifest/final-state record.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: INV-01-FC02
      input: The same completed fixture with different object key order, whitespace, line endings, report language,
        timestamps, local absolute paths, reordered supports, reordered attempts, changed evidence timestamps, a field
        containing meaningful whitespace, and a same-named run/risk timestamp.
      expected_result: Per-field canonicalization produces identical bindings, decision_digest, provenance_digest, and
        summaries for non-semantic format differences. Only the declared decision-text normalization is allowed; meaningful
        field whitespace is not globally trimmed, and a same-named risk timestamp is not removed with the run-level
        timestamp. Attempt order, evidence timestamps, relative paths, source IDs, and support satisfaction results
        are preserved and compared. Rendered report prose and translation-only text are not compared. A semantic rewrite,
        changed support result, changed attempt order, or changed evidence time is detected. False mismatches = 0.
      verification: Unit canonicalization test plus integration with reordered and reformatted artifacts, including
        reordered attempts and changed evidence timestamps; assert stable digests, preserved attempt order, and zero
        false mismatches.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: INV-01-FC03
      input: A fixture with success, unavailable, withheld, not_configured, a legal fallback, and one execution supporting
        multiple requirements; separate report summary and memory variants.
      expected_result: Executed identity is (run_id, data_query_key); component_missing identity is (run_id, requirement_id,
        capability, component). Status/source/count/attempts are not identity. The versioned comparison projection includes
        record_kind, identity, requested window, status/reason, ordered attempts, evidence timestamps, serving/attempted
        sources, fallback, every support's contract/version/evidence/satisfaction, profile linkage, and provenance.
        Manifest and final-state full record sets and provenance_digest are equal; report and memory equal their declared
        summaries; a change to a support result or evidence is detected. Mismatches = 0.
      verification: Integration test; compare full records for manifest/final-state and derived summaries for report/memory,
        including provenance_digest and fallback labels.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: INV-01-FC04
      input: 'A legal same-contract fallback, plus independent silent-substitution fixtures: primary failure omitted;
        fallback_used = false; serving source presented as the primary; fallback label omitted from report or memory.'
      expected_result: The legal fallback passes with fallback_used = true, primary failure present, attempted_sources
        and serving_source correct, and disclosure in report, manifest, final-state, and memory (current entry or historical
        reference). Each silent-substitution fixture fails the invariant with a non-zero mismatch; silent substitutions
        = 0.
      verification: Integration tests for the legal fallback and each silent-substitution case separately; assert fallback
        provenance and failure.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: INV-01-FC05
      input: A completed run with a formal decision text and rating.
      expected_result: Report, manifest, and final-state share exact current-run run_id, decision_id, record_version,
        decision_digest, gate_status, formal_decision_status, final_rating, coverage_status, and critical_gap_ids. final_decision_text
        is exact between manifest and final-state after canonicalization. Memory is either current-binding-equal or
        carries a valid reused_decision_ref with the same decision_id, decision_digest, and entry_digest; its source
        run fields are not compared to the current run. Rendered prose is not used for equality; mismatches = 0.
      verification: Integration test; compare exact binding fields and text only between manifest/final-state, and compare
        report/memory against the digest and required summary.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: INV-01-FC06
      input: 'Independent negative fixtures: for each required artifact, a pre-commit missing/empty/binding-incomplete
        case and a post-commit deletion or corruption case; memory is tested as new, reused, and disabled.'
      expected_result: A pre-commit missing/empty/binding-incomplete required artifact fails and the run is not completed.
        A post-commit deletion/corruption leaves the terminal bytes and completion status intact but the read fails
        with a non-success status and safe diagnostic; the record is not rewritten as failed or replaced. A disabled-memory
        run is valid without a memory artifact; a new or required reused entry that is missing fails. False passes =
        0.
      verification: Separate negative test for each artifact; assert non-zero invariant failure and no completed status.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: INV-01-FC07
      input: Fault injection after each artifact write, followed by retries that reuse the same run/decision/reservation
        identity, including pending/failed reservations and one new, one reused, and one disabled memory case.
      expected_result: Before completion the run is running/failed and INV-01 is not claimed; no completed manifest
        exists while artifacts are incomplete. Retry completes with exactly one copy of each required artifact, the
        same binding identity, and one new memory entry (or zero for reuse/disabled), with no duplicate or conflicting
        entry. Failed reservations do not cause version reuse. A completed record is not overwritten. Mismatches = 0.
      verification: Crash/restart fault-injection test at each write point; assert publish state, idempotent retry,
        and final cross-artifact equality.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: INV-01-FC08
      input: A completed run followed by settlement/reflection, legal policy-based rotation of resolved entries with
        a verifiable retention record and permanent source proof, an illegal deletion/modification of a retained entry,
        and a post-commit rewrite attempt.
      expected_result: Settlement only appends outcome/reflection fields; binding, entry_digest, evidence_digest, and
        formal decision fields remain immutable. A legal rotation records a verifiable retention record and permanent
        source proof without rewriting the original manifest, and the historical result remains verifiable; missing
        proof is not excused by a rotation label. Illegal deletion/modification or a post-commit rewrite is detected.
        The shared memory file is never hashed as the entry identity. Mismatches = 0 for legal cases.
      verification: Integration test across decision write, settlement, legal rotation, and illegal deletion/modification;
        assert memory_entry_binding immutability and the legal/illegal distinction.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: INV-01-FC09
      input: A run lifecycle captured before completion, at the completed checkpoint, and on a later read; then one
        binding field is tampered after completion.
      expected_result: The invariant is not claimed before completion, passes at completion and on a valid read, and
        detects the tampered binding on the next read, blocking formal exposure. False pass = 0; mismatches = 0 for
        valid artifacts.
      verification: Lifecycle test plus read-time validation and tamper injection; assert checkpoint behavior and non-zero
        detection.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: INV-01-FC10
      input: Fixtures with the same decision rerun; a different decision; same decision_id with a tampered entry_digest;
        reservations including pending/failed versions above the highest committed version; concurrent allocation; and
        memory disabled.
      expected_result: The same stable decision reuses the committed entry with memory.status = existing and reused_decision_ref;
        no duplicate. A different decision reserves entry_version greater than the maximum of all allocated versions
        (not merely the highest committed), with supersedes and a new decision_id. The effective version is the highest
        version whose source terminal manifest is legally committed and binding-valid; a pending/failed higher reservation
        does not become effective and does not invalidate the current effective version. A same-decision_id with different
        entry_digest is a conflict and does not overwrite. Memory disabled has no entity; other artifacts still satisfy
        INV-01. Retry preserves identity and content and creates no duplicate. Concurrent allocation without an atomic
        allocator cannot claim uniqueness. Mismatches = 0.
      verification: Integration test across same-day rerun, versioned different decisions, tampered entry_digest conflict,
        and memory-disabled configurations; assert memory versions, supersession, deduplication, and required-artifact
        rules.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: INV-01-FC11
      input: 'Completed-status negatives: absent independent marker, missing/corrupt/unsupported section or manifest,
        incomplete publication, cleanup failure after commit, partial/staged internal state, and a post-commit tamper.'
      expected_result: Completed requires terminal run_status = completed plus read-time INV-01; an absent independent
        marker does not block or define completion. Missing, corrupt, unsupported, or incomplete artifacts are never
        returned as successful complete reports; a post-commit tamper fails the read without changing terminal bytes.
        A cleanup warning after commit preserves completed identity. partial/staged values remain publish_state only
        and do not appear as public run_status. completed and formal_publication committed are one state; false committed
        results = 0. The terminal manifest completion is checked after the gate with no circular wait.
      verification: Commit-condition and fault-injection tests asserting terminal-manifest authority, absent-marker
        irrelevance, truthful completion, and cleanup-warning behavior.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    tradeoff: Prioritize one bound formal result and truthful completion. Report and memory carry declared summaries
      while manifest and final-state carry full records. No independent commit marker and no whole-file memory hash.
      Section and recovery details are owned by FR-05/FR-06.
    implementation_dependencies:
    - FR-02
    - SB-01
    constraint_relations:
    - FR-01
    - FR-03
    - SR-01
    - FR-04
    - INV-02
    - FR-05
    - FR-06
    - FR-07
    - QR-02
    - SR-02
    conflicts:
    - 'A short report conflicts with full provenance. Resolution: report carries a binding block plus declared summaries;
      manifest and final-state carry the full canonical records; report and memory are compared through binding and
      provenance_digest.'
    - 'The memory log stores prose and is updated later by settlement. Resolution: INV-01 binds only the immutable decision
      portion; settlement may append outcome/reflection, and rotation is recorded as not_available.'
    - 'A lean manifest may not carry every artifact''s prose. Resolution: current report, manifest, and final-state
      share the canonical binding and digests; a reused historical memory entry retains its original binding and is
      linked through reused_decision_ref, not compared field-for-field to current run identity.'
    - 'Retries can duplicate memory. Resolution: retries reuse run_id, record_version, and record_hash and must keep
      one memory decision entry.'
    - 'Redaction can change compared strings. Resolution: all artifacts use the same sanitizer and compare sanitized
      canonical values.'
    assumptions:
    - The canonical artifact set is report, manifest, final-state, and memory; report and memory use declared summaries
      bound by decision_digest and provenance_digest.
    - The report exposes a machine-readable binding block; memory exposes a binding tag or structured header; manifest
      and final-state expose binding fields directly.
    - Canonicalization is per-field with explicit include/exclude lists, UTF-8/NFC/LF, sorted keys, declared array ordering,
      and no global trim or blanket timestamp deletion. Attempt order, relative references, and evidence times are preserved.
    - The full source-status comparison is between manifest and final-state; report and memory compare their declared
      summaries and provenance_digest against those derived values.
    - 'publish_state is closed: running, staged, validated, completed, partial, failed. Only completed is public run_status=completed;
      partial/staged are internal and are not public run_status values.'
    - Memory binds through memory_entry_binding to one immutable decision entry; new/reused/disabled are separate branches;
      settlement/reflection is append-only; legal rotation needs independent retention evidence and permanent proof.
    - Allocation high-water includes pending and failed reservations; effective version considers only legally committed,
      binding-valid versions.
    - The invariant is checked before completion, on read, and after retry/resume.
    notes: INV-01 binds the canonical result across report, manifest, final-state, and memory. Stable identity and the
      versioned comparison projection are separate; content digest, file SHA, and the acyclic projection are separate.
      Pre-commit missing records cannot be completed; post-commit corruption preserves terminal evidence but fails the
      read. Retirement/rotation uses independent evidence and does not rewrite the original manifest. No implementation
      or test result is claimed.
  - id: INV-02
    type: invariant
    title: Deterministic portfolio-risk authority and zero unsafe approvals
    priority: Must
    status: approved
    stakeholders:
    - trader
    - reviewer
    - security_reviewer
    - operator
    sources:
      origin: Upstream proposal review and repository analysis
      evidence:
      - path: TradingAgents/tradingagents/agents/managers/portfolio_manager.py
        locator: portfolio_manager_node final rating
        description: The final rating and decision text are model-produced and cannot themselves be deterministic authority
          for numeric portfolio boundaries.
        source_type: code
      - path: TradingAgents/tradingagents/graph/trading_graph.py
        locator: record_decision
        description: The persistence path needs one deterministic finalization boundary so an alternate writer cannot
          approve a proposal that violates the active risk policy.
        source_type: code
      - path: TradingAgents/tradingagents/reporting.py
        locator: write_report_tree
        description: The report writer must consume the same formal risk result rather than re-deriving or omitting
          it.
        source_type: code
      - path: TradingAgents/tradingagents/memory/log.py
        locator: store_decision and settlement
        description: The memory writer must preserve the existing decision identity and reuse rules while carrying a
          risk summary only for a newly written entry.
        source_type: code
      - path: docs/req/run-manifest-schema.json
        locator: safety_gate, formal_decision, artifact_binding
        description: The existing manifest contract carries the gate, formal decision, and cross-artifact binding that
          INV-02 extends without a second authority.
        source_type: document
      - path: baseline/runs/baseline-20261020-01/results/reports/NVDA_20261020_193209/5_portfolio/decision.md
        locator: entire file
        description: The baseline formal decision carries no risk status, risk reason, policy version, or cross-artifact
          risk binding.
        source_type: measured_baseline
      - path: baseline/runs/baseline-20261020-01/memory/trading_memory.md
        locator: entry tag and DECISION block
        description: The baseline memory entry has no formal-decision binding or portfolio-risk summary.
        source_type: measured_baseline
    problem: 'A risk rule is not a safety boundary if model wording, invalid input, external dependencies, or an alternate
      writer can approve a proposal that violates the active policy. The upstream pipeline has no single deterministic
      portfolio-risk authority, no zero-unsafe-approval invariant, no prohibition on model-supplied risk inputs, no
      locatable risk-input and policy evidence, and no guarantee that current risk evidence is distinct from reused
      historical memory evidence.

      '
    statement: 'For every applicable stock Buy or Overweight proposal, the effective formal result MUST be produced
      by the shared SafetyGate invoking the same pure deterministic FR-04 evaluator. Model text MUST NOT supply authoritative
      risk input, change the risk result, or approve an over-limit, invalid, stale, inconsistent, insufficient-cash,
      or unsupported proposal. Missing or invalid required input MUST NOT default to approval. The model proposal and
      the effective formal result MUST remain distinguishable. INV-02 holds at the completed checkpoint and on every
      read of a completed run''s formal artifacts. The current run''s portfolio_risk_result, input_ref, input_digest,
      policy snapshot, policy_digest, metrics, and formal decision MUST be identical between manifest and final-state,
      summarized consistently in the current report and declared current consumers, and bound to the same formal_decision
      and artifact_binding required by INV-01. Input, policy, and diagnostic evidence follow their real state: a valid
      input with an invalid policy retains the valid input and a nullable policy plus a separate diagnostic; invalid
      input has null input_ref/input_digest and a safe diagnostic; not_applicable does not fabricate input; evaluator
      error keeps trustworthy available evidence and records the error. No uniform evidence shape is fabricated. A risk-blocked
      result MUST have formal_decision.status = blocked_for_review and final_rating = REVIEW. A risk input, policy,
      cash, currency, valuation, or unsupported-candidate failure uses gate reason portfolio_risk_input_invalid and
      review_class input_invalid. A risk limit breach uses gate reason portfolio_risk_limit_exceeded and review_class
      portfolio_risk_limit. A risk evaluator error uses gate status error, gate reason portfolio_risk_evaluator_error,
      review_class gate_system_error, a failed run record when safely writable, and no tradeable output. A risk-passed
      result MUST NOT introduce a block by itself, and a passed risk result is not a formal trading authorization. Stock
      Buy or Overweight MUST NOT carry a not_applicable risk result. Missing or unsupported candidates block even when
      another check also blocks. Crypto Buy and other non-stock assets may be not_applicable and remain subject to SB-01.
      Invalid model ratings are blocked before risk applicability and do not become not_applicable. Current-run risk
      evidence and reused historical memory evidence are distinct. A newly written memory entry carries the declared
      current risk summary with status, reason codes, policy_ref, policy_digest, threshold_status, and real nullability.
      A reused historical entry retains its original evidence and binding and is linked through reused_decision_ref;
      the current run does not inject its current risk summary into that historical entry. Disabled memory has no entity.
      Only identical stable decision content reuses an entry; a changed formal decision status, rating, or text creates
      a new decision content/version under INV-01. A risk-blocked rerun follows the same reuse-or-version rule and is
      not governed by a blanket no-new-entry rule. A risk result MUST NOT create a second memory key or bypass the existing
      same-day, supersedes, or memory-disabled rules. The evaluator MUST make no LLM, network, vendor, persistence,
      UI, or real-time clock call, and MUST NOT execute orders; legitimate policy loading, caller input binding, wrapper
      artifact preparation, and publisher persistence are outside the pure evaluator and are not forbidden by this purity
      rule. Risk-policy effects are evaluated separately from cache A/B under QR-01; cache A/B holds the policy/input/gate
      fixed. A passed evaluation is not a guarantee of maximum realized loss, gap, slippage, fee, liquidity, or investment
      outcome. FR-04 formulas and thresholds are referenced, not duplicated. The generated corpus reuses FR-04 normative
      cases and rules but uses independent expected values or auditable properties, never the evaluator under test as
      its own oracle. Repeated determinism compares the canonical business projection and content/evidence digests;
      run metadata such as actual execution time, temporary path, and attempt diagnostics need not be identical. A read-time
      risk-evidence tamper rejects formal success while retaining committed bytes; recovery validates and uses the original
      risk result, policy, and binding and does not re-evaluate with a new policy.'
    fit_criterion:
    - id: INV-02-FC01
      input: A fixed-seed generated corpus of at least 1000 valid, exact-boundary, over-limit, malformed, stale, inconsistent,
        insufficient-cash, unsupported, not_applicable, invalid-rating, and error cases evaluated through the shared
        SafetyGate, with mandatory category coverage, recorded generator version/distribution/seed, and independent
        expected values or auditable properties.
      expected_result: Every violating applicable case is non-tradeable with a stable risk code and formal REVIEW; every
        passing applicable case records its metrics, input_digest, policy snapshot, and policy_digest; stock Buy/Overweight
        never carries not_applicable; invalid ratings are blocked before risk. unsafe_approved_count = 0; default_approval_count
        = 0; not_applicable_as_pass_count = 0. The corpus reuses FR-04 normative cases/rules but does not use the evaluator
        under test to generate its own expected values. Mandatory boundary/invalid categories are covered; a large random
        pass count cannot dilute them.
      verification: Generated offline test with recorded seed, failure corpus, and per-fixture canonical result; assert
        every violation and the zero-tolerance counters.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: INV-02-FC02
      input: Representative passing, limit-breach, invalid-input, unsupported-input, not_applicable, invalid-rating,
        and evaluator-error cases evaluated 100 times each under one policy snapshot, with fixed business clock/policy/fault
        injection, exact-boundary decimals, and both valuation modes.
      expected_result: The canonical business projection—formal decision fields, risk status/reason codes, exact ratio/display
        results, policy identity/digest, input binding, and content/evidence digests—is identical for identical business
        input. Run metadata (actual execution time, temporary path, attempt diagnostics) is recorded separately and
        is not required to be byte-identical. Business valuation/cutoff and evidence times are retained. deterministic_result_mismatch_count
        = 0; floating-point drift = 0.
      verification: Repeated deterministic unit test with canonical result serialization and exact decimal boundary
        assertions.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: INV-02-FC03
      input: Fixtures where narrative claims approval, prompt text orders the evaluator to ignore a limit, the model
        supplies its own portfolio/order numbers or a passed risk object, dependency sentinels cover the pure evaluator,
        and legitimate policy loading, wrapper artifact preparation, and publisher persistence are exercised.
      expected_result: Narrative and model-supplied values do not change the deterministic result; authoritative caller
        input and policy determine the outcome; a model-supplied passed risk object is rejected. The pure evaluator
        has forbidden_dependency_call_count = 0 for LLM/network/vendor/persistence/UI/realtime-clock/input-mutation;
        legitimate policy loading and wrapper/publisher behavior are not misclassified as violations. The model_proposal
        remains unapproved; unsafe approvals = 0.
      verification: Narrative-injection fixtures, import audit, and dependency sentinels around the evaluator and the
        shared gate.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: INV-02-FC04
      input: A risk-blocked current run and a risk-passed current run through CLI final summary, complete report, 5_portfolio/decision.md,
        manifest, final-state, memory, and formal API return, with valid input/invalid policy, invalid input/diagnostic,
        not_applicable, evaluator error, and a read-time risk-evidence tamper.
      expected_result: Every formal consumer uses the same current formal decision, gate reason, risk status/reason
        codes, policy_ref, policy_digest, threshold_status, input digest, and metrics as applicable. A valid input with
        invalid policy keeps the input and a nullable policy; invalid input has null input_ref/input_digest and a safe
        diagnostic; not_applicable has no fabricated input; evaluator error retains reliable evidence and marks the
        error. Current report/API/CLI compare their declared summary, not a fabricated full input. No second decision
        path or duplicate current memory entry exists; cross_artifact_mismatch_count = 0. A post-commit risk-evidence
        tamper fails the read and is not silently repaired.
      verification: Writer-bypass and cross-artifact integration test using one finalized-record identity, the risk-input
        artifact, and every formal consumer.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: INV-02-FC05
      input: 'Memory fixtures: same-decision rerun with different risk evidence; changed formal decision from changed
        risk input; reused historical entry with original risk summary; risk-blocked rerun unchanged; risk-blocked rerun
        with changed decision; and memory disabled.'
      expected_result: Only identical stable decision content reuses the committed entry. A changed formal decision
        reserves a new decision_id/entry_version with supersedes under INV-01. A reused historical entry keeps its original
        risk evidence and is linked through reused_decision_ref without receiving the current risk summary. A risk-blocked
        rerun follows the same reuse-or-version rule. Memory-disabled runs still satisfy INV-02 through report/manifest/final-state.
        A historical risk-passed entry is never used as the current run's approval; the current run still performs the
        current check. Mismatches = 0.
      verification: Integration test across same-day rerun, supersession, risk-blocked reuse, changed-decision versioning,
        historical-reference reuse, and memory-disabled configurations.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: INV-02-FC06
      input: 'Independent applicability/failure fixtures: crypto Buy; stock Buy with missing candidate; stock Overweight
        with unsupported candidate; stock Buy with critical gap and missing input; stock Buy with critical gap and passed
        risk; stock Buy with limit breach; stock Buy with evaluator exception; invalid rating; and Hold with complete
        coverage; plus a genuine-risk-read tamper and a failed record that cannot be written.'
      expected_result: Crypto Buy and Hold use not_applicable and follow SB-01; stock Buy/Overweight never uses not_applicable;
        missing/unsupported candidates block with portfolio_risk_input_invalid and review_class input_invalid; a limit
        breach blocks with portfolio_risk_limit_exceeded and review_class = portfolio_risk_limit; an evaluator exception
        produces gate error, portfolio_risk_evaluator_error, gate_system_error, failed run status when writable, REVIEW,
        and no tradeable output. The critical-gap Buy records both critical_gap and the real risk result, with critical_gap
        primary; the risk reasons are retained. Invalid ratings are blocked before risk. A risk pass does not mask a
        coverage/model-rating failure; not_applicable-as-pass count = 0. When no safe failed record can be written,
        no file is claimed; the caller still receives failure. Recovery uses the original policy/result, not a new policy.
      verification: Combined SB-01 and FR-04 gate matrix test; assert applicability, risk result presence, primary gate
        reason, review class, run status, and absence of masked failures.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    tradeoff: Prioritize zero unsafe approvals and one deterministic authority. Accept REVIEW for invalid, missing,
      stale, inconsistent, insufficient-cash, unsupported, or over-limit risk input. Current and reused historical evidence
      stay distinct.
    implementation_dependencies:
    - FR-04
    - SB-01
    - INV-01
    - FR-02
    constraint_relations:
    - FR-03
    - SR-01
    - QR-01
    conflicts:
    - 'Preserving the proposal can be mistaken for preserving its authority. Resolution: all formal consumers use only
      the finalized result; the proposal remains audit-only.'
    - 'Fail-closed validation reduces actionable output. Resolution: REVIEW is the explicit safe state for missing,
      invalid, stale, inconsistent, insufficient-cash, unsupported, or over-limit risk input.'
    - 'A second risk rule can duplicate the final decision path. Resolution: the evaluator is invoked only by the shared
      SafetyGate and has no persistence, memory, or writer path of its own.'
    - 'Risk evidence can fragment memory reuse. Resolution: memory identity remains decision_id, decision_digest, and
      entry_digest; current run evidence is separate, and reused historical evidence is linked through reused_decision_ref.'
    - 'A risk-driven REVIEW increase can be misread as a cache regression. Resolution: cache A/B holds risk policy fixed
      and risk-policy effects are evaluated separately.'
    - 'A passed risk check can be read as a loss guarantee. Resolution: forbid loss-guarantee claims; stop distance
      is a price-distance metric only.'
    assumptions:
    - The shared SafetyGate is the only formal finalization authority; FR-04 provides the authoritative pure portfolio
      risk result.
    - Input, policy, and diagnostic evidence follow the real state; missing evidence is null with a safe diagnostic,
      not fabricated.
    - INV-01 artifact_binding, decision_id, decision_digest, entry_digest, same-day rerun, supersedes, and memory-disabled
      rules are reused unchanged.
    - Current-run risk evidence is in the current manifest/final-state, current report summary, and a newly written
      memory entry; reused historical memory keeps its original evidence.
    - Generated-corpus expected values are independent or property-based, not produced by the evaluator under test.
    - Repeated determinism compares the business projection and content/evidence digests, not incidental run metadata.
    - The pure evaluator forbids LLM/network/vendor/persistence/UI/realtime-clock/input mutation; legitimate policy
      loading and wrapper/publisher work are outside that boundary.
    - Offline fixtures require no provider credentials, live data, or model calls.
    - A passed risk check is not a trading authorization and does not guarantee loss, execution quality, or investment
      outcome.
    - The 30% concentration and 5% stop-distance defaults remain provisional and are never presented as approved policy.
    notes: INV-02 is the safety and determinism invariant paired with FR-04. pre-v1.24.0 AC7 moved to QR-01. It reuses SB-01 REVIEW
      and INV-01 binding/version rules and defines no second gate, binding, memory identity, or risk formula. A risk-limit
      breach uses gate reason portfolio_risk_limit_exceeded and review_class = portfolio_risk_limit; a risk input/policy/candidate
      failure uses portfolio_risk_input_invalid/input_invalid. Read-time tamper, recovery of the original policy, generated-corpus
      independence, and pure/wrapper separation are explicitly checked. No implementation or test result is claimed.
  - id: SR-01
    type: security
    title: Secret-safe run records with known-value and versioned pattern checks
    priority: Must
    status: approved
    stakeholders:
    - security_reviewer
    - operator
    - reviewer
    sources:
      origin: Repository analysis and measured baseline
      evidence:
      - path: TradingAgents/tradingagents/dataflows/net.py
        locator: L6-L24 get_scrubbed
        description: Existing exact-value scrubber for FRED and Alpha Vantage request error URLs; it does not cover
          other record boundaries or pattern matches.
        source_type: code
      - path: TradingAgents/tradingagents/dataflows/vendors/alpha_vantage/common.py
        locator: L95-L97 get_scrubbed call
        description: Existing API-key scrub path for Alpha Vantage request errors.
        source_type: code
      - path: TradingAgents/tradingagents/graph/trading_graph.py
        locator: L255-L275 run_settings
        description: Existing allowlist for report settings; it excludes keys and endpoints but does not scan other
          writers.
        source_type: code
      - path: TradingAgents/cli/prefs.py
        locator: L30-L58 save_last_run
        description: Preferences store backend_url and other selections directly, so inline userinfo, query tokens,
          or fragments can be persisted.
        source_type: code
      - path: TradingAgents/cli/prompts.py
        locator: L731-L738 .env creation and chmod
        description: Existing .env creation already uses mode 0600; this is a preserved baseline control, not a new
          D1 acceptance item.
        source_type: code
      - path: TradingAgents/tests/test_api_key_env.py
        locator: L168-L190 .env mode tests
        description: Existing tests already assert the 0600 .env mode.
        source_type: code
      - path: baseline/runs/baseline-20261020-01/logs/stdout.log
        locator: entire file
        description: Reviewed baseline stdout; no API key value was observed, but this is not a complete scan.
        source_type: measured_baseline
      - path: baseline/runs/baseline-20261020-01/logs/stderr.log
        locator: file size
        description: Empty stderr; the baseline did not run a complete secret scan.
        source_type: measured_baseline
    problem: 'Some provider request errors already replace one exact API key, and report settings are allowlisted, but
      no common detector covers the manifest, final-state, memory, report, logs, error records, preferences, or formal
      API return. Preferences can persist a full backend URL, which is needed to restore the next run but may contain
      inline userinfo or query credentials. Known-value checking and pattern checking were not separated, rules were
      not versioned, and a scan result was treated as proof that every possible credential was safe. There was also
      no behavior for scanner failure or an unredactable secret.

      '
    statement: 'SR-01 applies to app-controlled run records and formal outputs: run manifest, final-state, memory decision
      entry, report metadata/content, logs, preferences, error records, gate/availability reasons, stream/debug output,
      context audit, write evidence, retention/recovery audits, archive/history/recovery diagnostics, and formal API
      return. Vendor/provider logs, shell history, OS/network captures, and external service logs are out of scope and
      MUST be named as such; however, vendor/provider content copied by the application into an in-scope log/error/context/record
      remains in scope. Sensitive information MUST be checked in two separate ways: exact match against secret_value
      values actually configured or used in the run, and detection by the versioned secret_pattern_rule set with its
      fixed minimum scope. The in-memory secret registry and any authorized credential store are distinct from run records.
      Run records, preferences, and diagnostics store only secret_ref names, never values. Only an existing explicitly
      authorized credential store (.env or process environment) may retain a value; migration MUST NOT write plaintext
      into an arbitrary .env, overwrite a conflicting existing value, or create an unsafe file. If no authorized mechanism
      exists or the value conflicts, the sensitive part is omitted and re_entry_required is set. Process-environment
      values are not claimed to persist across restarts; if a secret_ref cannot resolve, re-entry is required. Audit/display
      endpoints MUST contain only safe scheme, host, and path, and restore records may keep allowlisted non-sensitive
      query parameters and secret_ref names; however, scheme/host/path structure is not an exemption from secret detection.
      A token in a path/host value MUST be removed or the record blocked. Userinfo, sensitive query values, fragments,
      and sensitive headers are excluded from records. Empty strings are never matched. Known secrets shorter than four
      characters are exact-match only in credential-bearing fields and are not added to generic patterns; unsupported
      encodings or representations must not be claimed detected, and a conflict between preserving a required non-secret
      field and removing a secret is resolved by blocking, not by keeping the secret or deleting unrelated content.
      Detection, redaction, and residual outcome MUST be recorded separately: detected_count is before redaction, redaction_count
      counts allowed replacements, and residual_count is after redaction. The retained known_secret_match_count and
      pattern_match_count fields mean final residual matches, not pre-redaction detections. Overlapping rules do not
      require the detected sum to equal the redaction count. A clean result has no necessary redaction and zero residual
      with no scanner error; redacted has an allowed transformation and zero residual with valid structure; blocked/failed
      has residual, an unavailable/unknown rule version, a detector/sanitizer error, or unsafe over-redaction. completed
      requires zero residual and no scanner error; detected history is not erased. Redaction replaces only the secret
      value with a stable marker and preserves keys, parameter names, structure, status, reason codes, counts, timings,
      source/vendor names, tickers, dates, model ids, and relative paths. Whole-record/whole-URL removal and indiscriminate
      long-string redaction are forbidden. A public URL in a non-audit field is preserved, while an audit/display endpoint
      follows the scheme/host/path rule; the two rules need not be byte-identical at the same time. Every write MUST
      perform and record a pre-write scan (write_scan_status) before canonical binding/hash, and the terminal manifest
      MUST also record a final run-level scan (run_scan_status) over the fixed formal materials. A running manifest
      may have run_scan_status = not_run; a completed manifest requires clean or redacted write_scan_status and run_scan_status.
      The run scan MUST NOT recursively scan its own generated result. Later API/CLI/stream/debug output MUST be scanned
      before emission and MUST NOT rely on the earlier run scan; a stream is scanned per complete safe unit or blocked
      when a secret can cross chunks. If content changes after a scan, it MUST be revalidated. Post-commit discovery
      of a leak or dangerous format MUST reject further formal exposure and preserve immutable evidence; it MUST NOT
      redact in place and recompute a hash to make the original publication appear legitimate. Scanner/sanitizer failure,
      an unknown rule version, an unredactable secret, or unsafe over-redaction MUST fail closed: the dangerous content
      and affected formal output are not written and the caller receives a typed security failure. When a safe failed
      manifest or incident can be written, it records error.stage = security or the equivalent typed stage; when no
      safe record can be written, no record is required and the system does not claim one. A minimal incident record may contain only controlled
      stage/rule version/failure type, static safe reason, and safe run identity; it MUST NOT contain the raw secret,
      exception text, or input fragment, and MUST NOT recursively depend on the failed scanner. The caller still receives
      failure, and no formal success is returned.'
    fit_criterion:
    - id: SR-01-FC01
      input: A deterministic run fixture with a configured known API key, an in-memory registry, a mock provider, and
        an endpoint containing userinfo, a sensitive query value, a token in the path, and a fragment; the run reaches
        manifest, final-state, memory, report, log, preference, context/audit, and API writers.
      expected_result: Known secret values are exact-match scanned at every in-scope writer and never written to a record,
        log, preference, error, or diagnostic. Every scan records detected_count, redaction_count, and residual_count;
        the manifest residuals and retained known_secret_match_count are zero, and detected history may be non-zero.
        The audit endpoint contains scheme/host/path only; the path is still checked and a token in the path is removed
        or blocked. The secret registry stays in memory; only an authorized credential store may retain a value, and
        no arbitrary .env is written. No case fails before reaching the record writers.
      verification: Deterministic integration test with a mock provider and instrumented record writers; scan every
        output and assert the record path was reached.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: SR-01-FC02
      input: Fixtures for the fixed pattern categories (provider key formats, bearer/JWT, URL userinfo, sensitive query
        names/values, sensitive authorization headers, password/token assignments), supported percent/JSON/header-case
        representations, overlapping rules, an empty secret, a short secret in a credential and non-credential field,
        an unknown rule version, and an unsupported encoding.
      expected_result: Every declared category is detected by the versioned rule set; each detected value is redacted
        or the record is blocked; residual pattern_match_count = 0; rule version/source match the set used; unknown
        rule version fails closed. Known and pattern checks are reported separately with detected/redacted/residual
        counts. Empty strings do not match; short secrets are exact-match only in credential-bearing fields and are
        not generic patterns; unsupported encodings are not claimed detected; unsafe over-redaction blocks. A detector
        cannot be claimed to cover an arbitrary custom encoding.
      verification: Table-driven pattern-rule tests with positive and negative controls; assert the rule version, category
        coverage, redaction or block, and separate counters.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: SR-01-FC03
      input: A preference file after a run with an endpoint containing userinfo, a sensitive query token, a non-sensitive
        allowlisted parameter, a fragment, and a token in the path; cases with an authorized existing credential store,
        no authorization, a conflicting existing value, and a process-environment-only value that will not persist.
      expected_result: The audit endpoint is scheme/host/path only. The restore endpoint keeps scheme/host/path, the
        non-sensitive allowlisted parameter, and secret_ref names; it contains no inline userinfo, sensitive query,
        fragment, or path token. The secret_ref resolves only from the authorized store; no arbitrary .env is modified
        or overwritten. With no authorization, conflict, or no persistent mechanism, the sensitive part is omitted and
        re_entry_required is set. Process-environment values are not claimed to survive restart. Inline sensitive values
        = 0.
      verification: Unit test on the preference writer and resolver; assert audit/restore separation, ref resolution,
        and re-entry behavior.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: SR-01-FC04
      input: Fault injection where a known secret remains after redaction; detector/sanitizer raises; rule version is
        unknown; over-redaction would destroy required structure; the safe incident cannot be written; and a leak is
        discovered after commit.
      expected_result: The caller receives a typed security failure; dangerous content and affected formal output are
        not written. If a safe failed manifest/incident is writable, it records the security stage; if not, no record
        is required and the system does not claim one. The minimal incident has no secret/exception text/input fragment and does not recursively
        depend on the failed scanner. Post-commit discovery rejects further formal exposure and preserves immutable
        evidence; it does not redact in place or recompute a hash to legitimize the original publication. known-secret
        leakage = 0; scanner failure treated as pass = 0. Scan/redact happen before binding/hash; hashes use redacted
        canonical values.
      verification: Fault-injection tests at each writer and sanitizer boundary; assert blocked dangerous output, the
        allowed minimal incident record, failed run status, and no secret in any record.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: SR-01-FC05
      input: A mixed fixture with a real secret plus public URLs, tickers, dates, model ids, vendor names, status/reason
        codes, counts, timings, relative paths, a secret that collides with a required non-secret field, audit/restore
        endpoint fields, and a translated/canonical value.
      expected_result: Only secret values are replaced; non-secret values remain byte-identical after canonicalization;
        no whole record, whole URL, or long non-secret string is removed. If a secret collides with a required non-secret
        field and both cannot be preserved, the record is blocked rather than keeping the secret or deleting unrelated
        content. Public URLs in non-audit fields are preserved; audit/display fields follow the scheme/host/path rule;
        the two rules are not required to be byte-identical at the same time. Over-redaction count = 0.
      verification: Unit test comparing the redacted and unredacted canonical values; assert secret markers and preserved
        non-secret fields.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: SR-01-FC06
      input: A run that exercises every in-scope boundary, including stream/debug output, context audit, write evidence,
        retention/recovery audits, archive/history responses, and a scan result; a control with a boundary omitted;
        a stream with a secret split across chunks; a run-scan/self-reference case; and post-run later output.
      expected_result: Every in-scope boundary is scanned and named in scan_scope; rule_version, per-write write_scan_status,
        and final run_scan_status are recorded. A running manifest may have run_scan_status = not_run; a completed manifest
        requires both statuses clean/redacted with zero residual. The omitted-boundary control fails. Stream/debug output
        is verified before emission and cross-chunk content is not declared safe from per-chunk misses. The run scan
        does not recursively scan its own result; later output is not exempted by an earlier run scan. Export diagnostics
        are in scope only if export is later enabled. Universal-safety claim = 0.
      verification: Boundary-coverage audit plus a missing-boundary negative control; assert scope completeness, version
        recording, and the documented limitation.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: SR-01-FC07
      input: The existing get_scrubbed and .env 0600 tests plus the new in-scope writers, context/stream/debug/audit
        boundaries, and post-commit leak handling.
      expected_result: Existing get_scrubbed exact-value scrubbing and .env 0600 behavior continue as preserved controls;
        the new scope covers manifest, final-state, memory, report, logs, preferences, errors/gate/availability, context/audit,
        stream/debug, write evidence, retention/recovery, and formal API return. The .env mode is not claimed as a new
        D1 acceptance item. Post-commit leak handling preserves immutable evidence and does not rewrite hashes. Regressions
        = 0.
      verification: Regression suite for existing tests plus boundary inventory for the new scope.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    tradeoff: Prioritize credential safety and fail-closed records. Path confinement, symlink/junction escape, and archive/history/recovery
      path safety are SR-02. Export-specific conflict behavior is deferred with FR-05 export.
    implementation_dependencies:
    - FR-02
    - INV-01
    constraint_relations:
    - FR-03
    - SB-01
    - FR-05
    - FR-06
    - FR-07
    - FR-08
    - QR-02
    - SR-02
    conflicts:
    - 'Redaction reduces debugging detail. Resolution: replace only secret values and preserve structure, status, reason
      codes, counts, timings, and public identifiers.'
    - 'The manifest must record configuration while excluding sensitive parameters. Resolution: use the sanitizer and
      a sanitized config allowlist.'
    - 'Preferences need the endpoint for the next run, while audit records must not carry secrets. Resolution: audit
      endpoint is scheme/host/path; restore endpoint keeps non-sensitive query parameters and secret_ref names, never
      inline sensitive values.'
    - 'A scanner can prove only its scope and rules. Resolution: record scope, rule version, counters, and the explicit
      limitation; do not claim universal credential absence.'
    - 'Redaction can damage diagnostics. Resolution: preserve non-secret structure and add over-redaction tests.'
    - 'Scanner failure could silently pass. Resolution: fail closed and report a security failure; write a failed record
      only when it can be written safely.'
    assumptions:
    - Known secret values are collected from configured credentials, URL userinfo, sensitive query values, and sensitive
      headers; the registry is in memory only and is never written to a record.
    - Only an existing explicitly authorized credential store may persist a value; unauthorized or conflicting migration
      is omitted with re_entry_required, and process-environment values are not claimed persistent.
    - secret_pattern_rule has a fixed minimum category set and is versioned with secret_rule_version, secret_rule_source,
      and effective_at.
    - scan_scope is the closed app-controlled boundary set, including context/stream/debug and write/retention/recovery
      audits; external logs remain out of scope but copied content remains in scope.
    - detected_count, redaction_count, and residual_count are separate; retained known_secret_match_count/pattern_match_count
      fields mean final residuals.
    - A clean result means zero residual within the defined scope/rules and no scanner error; it does not prove universal
      secret absence.
    - Audit endpoints are scheme/host/path only; restore endpoints may keep allowlisted non-secret query parameters
      and secret_ref names; path/host values are still scanned.
    - Empty secrets do not match; short secrets are exact-match only in credential-bearing fields; unsupported encodings
      are not claimed detected.
    - Redaction replaces only values and preserves non-secret structure; unsafe over-redaction blocks.
    - A detector/sanitizer failure or unredactable secret fails closed; a safe incident is minimal and free of raw values;
      no unsafe record is claimed.
    - Path confinement is SR-02; export conflict is deferred with FR-05 export.
    notes: SR-01 owns credential safety. pre-v1.24.0 AC8 moved to SR-02; AC9 export conflict is deferred. Detected/redacted/residual
      counts are separate; old match counts mean residual. Completed requires zero residual. Secret registry and authorized
      credential storage are distinct; no unauthorized plaintext migration. Stream/debug and context/write/retention/recovery
      audits are in scope; external logs do not exempt copied content. Post-commit leaks preserve immutable evidence
      and are not fixed by rewriting hashes. No implementation or runtime result is claimed.
  - id: SR-02
    type: security
    title: Path confinement and escape protection for archive, history, and recovery
    priority: Must
    status: approved
    stakeholders:
    - security_reviewer
    - operator
    - reviewer
    sources:
      origin: Split from SR-01-AC8 (pre-v1.24.0); repository path handling
      evidence:
      - path: TradingAgents/tradingagents/dataflows/symbols.py
        locator: normalize_symbol and safe_ticker_component
        description: Existing ticker normalization and path-component guard reused for path confinement.
        source_type: code
      - path: TradingAgents/tradingagents/reporting.py
        locator: write_report_tree
        description: Report tree writer that must not accept traversal or escape paths.
        source_type: code
      - path: baseline/runs/baseline-20261020-01/results/reports/NVDA_20261020_193209/
        locator: report tree
        description: Baseline path-based report tree; no history or recovery path confinement exists.
        source_type: measured_baseline
    problem: Archive, history, recovery, and diagnostic paths can be derived from tickers, dates, run_id, or report
      text. Without confinement, traversal, absolute-path injection, symlink/junction escape, or out-of-root writes
      can overwrite files outside the configured root.
    statement: Paths derived from report prose, ticker/date filters, run_id, recovery material, or artifact references
      MUST be confined to the trusted configured archive, history, or recovery root and to the subdomain authorized
      for the operation. Confinement covers read/list/open, create, write, atomic replace, move/rename, quarantine,
      unlink, and recursive cleanup, for every source and target path. Traversal, absolute-path injection, symlink/junction/reparse
      escape, hard-link abuse within the declared threat model, and out-of-root access or modification are forbidden.
      Report prose MUST NOT control a path or commit state. Credential scanning of archive/history/recovery/diagnostic
      records reuses SR-01. Export-specific conflict behavior is deferred with FR-05 export. The trusted root is initialized
      from user/application configuration, resolved to its authorized real target, and fixed for the session. A root
      that is itself reached through a link is accepted only with explicit authorization; otherwise it is rejected,
      and a root change requires re-initialization. The internal controlled artifact tree rejects symlinks, junctions,
      reparse points, and unnecessary non-regular objects by default; an exception requires an explicit versioned policy
      naming the target and operation. Lexical checks use canonical components and platform path semantics, not string
      prefix; inputs are checked after their final decoding boundary, and platform case/Unicode/ reserved-name rules
      are explicit. Resolved-target checks cover existing ancestors and the actual operation, not one resolve of a not-yet-created
      file. The actual read/create/write/replace/move/quarantine/cleanup MUST not escape if a directory, target, mount,
      or link changes after the check; if the implementation cannot maintain the constraint, it MUST fail closed rather
      than fall back to an ordinary open or an unauthorized directory. Cleanup MUST NOT follow an injected link outside
      the root; quarantine and temp cleanup affect only objects owned by the current run. Ordinary artifact references
      are limited to the current run's authorized permanent/temporary domains. Typed reused_decision_ref references
      MAY access the source-run permanent proof only under the same authorized archive root and only within the declared
      proof closure; they do not grant arbitrary cross-run or out-of-root access. Validated identifiers are single business
      components; ticker normalization does not replace safe path-component mapping. Every operation's source and target
      are separately checked, and a move between authorized domains is allowed only when both domains and the non-overwrite
      rule are declared. Unsupported platforms or filesystem capabilities MUST NOT be reported as passed and MUST NOT
      continue processing untrusted paths without protection; the relevant history/recovery/publication operation is
      rejected or the capability is explicitly disabled. The deployment threat model MUST state root permissions, other
      writers, mount assumptions, and whether hard-link resistance relies on an exclusive root; it MUST NOT claim resistance
      to an arbitrary administrator or all local attackers. Failures return typed non-success with SR-01-safe diagnostics,
      do not disclose secrets or forbidden absolute paths, and do not silently switch to another root or the current
      working directory. Base path policy may be implemented and tested before all business modules exist, but whole-requirement
      acceptance requires the actual publisher/history/recovery entry points.
    fit_criterion:
    - id: SR-02-FC01
      input: Archive, history, recovery, and diagnostic fixtures with traversal, absolute paths, prefix-collision paths,
        encoded/double-decoded traversal, report prose containing path-like text, run_id-derived paths, ordinary current-run
        references, legal typed historical references, an illegal ordinary cross-run reference, and read/list/create/replace/move/quarantine/delete
        operations on sources and targets.
      expected_result: All generated paths remain within the authorized root and operation subdomain. Out-of-root read,
        write, modification, and deletion = 0; report prose cannot control a path or commit state. Traversal/absolute
        injection and prefix collisions are rejected after final decoding. Read/list/create/replace/move/quarantine/delete
        and cleanup/temp targets are confined; external synthetic read/write/delete sentinels remain untouched. A move
        requires both authorized domains and does not overwrite another run. Legal typed historical references work
        within the declared proof closure; an ordinary cross-run reference does not. Business ticker identity is not
        changed by safe path mapping. Lexical and resolved-target checks agree.
      verification: Path-confinement fixtures and out-of-root write sentinels across archive, history, and recovery.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    - id: SR-02-FC02
      input: Fixtures with symlink/junction/reparse escapes, an authorized versus unauthorized root link, internal-tree
        links, a check-then-replace race using a controlled barrier, a not-yet-created target with a replaced parent,
        cleanup following a planted link, platform non-regular objects, a hard-link case within the declared threat
        model, an unsupported-platform case, and credential sentinels.
      expected_result: Symlink/junction/reparse escapes and default internal links are rejected; an authorized root
        link is accepted only with explicit authorization. Out-of-root write/delete = 0 and out-of-root read = 0 at
        the operation, not merely at the first resolve. A path change after the check or during cleanup cannot redirect
        the operation; if the constraint cannot be maintained, the operation fails closed without falling back to an
        unauthorized directory. Hard-link behavior matches the declared threat model and is not claimed to resist an
        arbitrary administrator. Unsupported platforms are rejected or explicitly disabled, not marked pass or used
        to process untrusted paths. SR-01 diagnostics contain no secret or forbidden absolute path; failures return
        typed non-success and never a false success.
      verification: Link-escape tests and credential boundary scans across archive/history/recovery diagnostics.
      zero_tolerance: true
      measurement_status: not_measured
      threshold_status: not_applicable
    tradeoff: Prioritize path confinement for the retained archive/history/recovery capabilities. Export-conflict behavior
      is deferred with FR-05 export; no export-specific guarantee is claimed.
    implementation_dependencies:
    - FR-02
    - FR-05
    - FR-06
    - SR-01
    constraint_relations:
    - INV-01
    conflicts:
    - 'Report prose can contain path-like text. Resolution: paths come only from validated identifiers and remain under
      the configured root.'
    - 'Symlinks can escape a lexical path check. Resolution: reject symlink/junction escapes and verify the resolved
      target.'
    assumptions:
    - Archive, history, and recovery roots are trusted configuration values with an authorized real target; root link
      use requires explicit authorization.
    - The internal controlled tree accepts only regular files/directories by default; an explicit versioned policy is
      required for any link exception.
    - All source and target paths of read/create/write/replace/move/quarantine/cleanup are checked, with a final-decoding
      boundary and component-aware comparisons.
    - Ordinary references are current-run scoped; typed reused_decision_ref may access only the declared source-proof
      closure under the same authorized archive root.
    - Read, write, and delete sentinels are existing verification dimensions; check-then-use races are part of the statically
      defined negative matrix.
    - An unsupported platform/capability rejects the affected operation; it is never marked pass or silently unprotected.
    - The threat model and any hard-link/root-permission reliance are stated honestly; resistance to an arbitrary administrator
      is not claimed.
    - Export is deferred; its conflict behavior is not part of this requirement.
    notes: 'Historical source: SR-01-AC8 (pre-v1.24.0). SR-01 retains credential safety; SR-02 owns path confinement across read/create/write/replace/move/quarantine/cleanup
      for every source and target. Trusted-root initialization and internal-link policy are unique; ''unnecessary''
      links are not a discretionary exception. Check-then-change races, typed historical references, platform limits,
      and SR-01-safe diagnostics are explicitly constrained. Export conflict remains deferred. No real directory, permission,
      link, or user file is modified.'
conflict_resolutions:
  - id: C-01
    requirements: [FR-02, SR-01]
    description: "FR-02 needs a configuration record; SR-01 forbids sensitive URL parameters."
    resolution: "FR-02 records a sanitized configuration allowlist; SR-01 defines the sanitizer and the zero-match acceptance check."
  - id: C-02
    requirements: [FR-01, INV-01]
    description: "Caching can hide whether a value was reused, which can break provenance consistency."
    resolution: "The run cache stores terminal status, reason, vendor provenance, and vendor-cache-hit state; INV-01 binds the canonical provenance_digest and full records between manifest and final-state, with report and memory carrying the digest plus declared summaries."
  - id: C-03
    requirements: [FR-03, INV-01]
    description: "A user-facing gap summary can omit detail that another artifact retains."
    resolution: "Manifest and final-state contain the full canonical coverage and availability records; report and memory contain the binding, coverage/gap summary, and provenance_digest. INV-01 compares full records only between manifest and final-state and compares report/memory summaries against derived values."
  - id: C-04
    requirements: [FR-03, SB-01]
    description: "FR-03 exposes gaps; SB-01 converts a critical gap into REVIEW, which reduces actionable output."
    resolution: "SB-01 uses the same critical-gap definition as FR-03 and records the gate result; REVIEW is the explicit safe state."
  - id: C-05
    requirements: [FR-02, INV-01]
    description: "A lean manifest may not carry enough detail for the consistency invariant."
    resolution: "The manifest is the canonical machine-readable record. Report, manifest, and final-state carry the current artifact_binding; memory carries the current binding or a reused_decision_ref. Report and memory carry declared summaries and provenance_digest, while manifest and final-state carry the full records."
  - id: C-06
    requirements: [FR-01, FR-02]
    description: "Cache reuse reduces calls, while the manifest must still explain what was served."
    resolution: "The manifest records cache hits and source status; run-cache reuse and vendor-cache reads are distinguishable, and reused values keep their original provenance."
  - id: C-07
    requirements: [FR-02, FR-01, SB-01]
    description: "Recording and gating add work to a latency-sensitive run."
    resolution: "A bounded running manifest is written before model calls and atomically finalized after execution; the safety gate is deterministic and does not call a model. Startup, publish, and manifest-write overhead are measured separately."
  - id: C-08
    requirements: [SR-01, INV-01]
    description: "Redaction can change the exact strings compared across artifacts."
    resolution: "All artifacts use the same sanitizer; consistency checks compare sanitized canonical values and digests, not unsanitized raw text."
  - id: C-09
    requirements: [FR-04, SB-01]
    description: "A deterministic portfolio-risk limit can reduce actionable output, and a separate risk gate would fragment final authority."
    resolution: "FR-04 is a pure evaluator invoked inside the existing SB-01 SafetyGate. SB-01 remains the only formal decision and publication authority; a risk breach, invalid risk input, or evaluator exception produces the existing REVIEW or gate-error outcome with new closed gate reason codes."
  - id: C-10
    requirements: [FR-04, INV-01, INV-02]
    description: "Risk evidence is not part of the stable decision identity, so it could accidentally change memory reuse or require a second binding."
    resolution: "Manifest and final-state carry the current full portfolio_risk_result, input_ref, input_digest, policy snapshot, and policy_digest under the existing record and input hashes. A newly written memory entry carries a declared risk summary; a reused historical entry retains its original evidence and is linked through reused_decision_ref. decision_id, decision_digest, entry_digest, and the INV-01 reuse/version rules remain unchanged."
  - id: C-11
    requirements: [FR-04, FR-03, SB-01]
    description: "Coverage failure and portfolio-risk failure are independent blocking reasons and could be ordered differently across entry points."
    resolution: "Stock Buy or Overweight always enters the FR-04 risk branch, even when coverage already blocks; crypto and other non-stock cases may use not_applicable. SB-01 retains all reason codes. When an ordinary risk input or limit failure and a coverage failure occur together, critical_gap remains primary. When the risk evaluator raises, the gate-error priority applies instead: gate status error, run status failed, primary_reason_code portfolio_risk_evaluator_error, review_class gate_system_error, with critical_gap retained only as a secondary reason."

  - id: C-12
    requirements: [FR-02, FR-06, INV-01]
    description: "A recovery mechanism can introduce a second commit authority or a separate archive transaction."
    resolution: "Recovery continues the existing formal publication and uses the same terminal-manifest completed plus read-time INV-01 condition. No independent commit marker or separate archive transaction is authoritative."
  - id: C-13
    requirements: [FR-05, FR-02, INV-01]
    description: "History can mix old report files with a newer run."
    resolution: "Retrieval consumes the committed report_section_manifest, not arbitrary directory contents; foreign and stale sections fail read-time validation."
  - id: C-14
    requirements: [FR-06, QR-02]
    description: "Correctness and hashing cost time while the recovery target is provisional."
    resolution: "Correctness and model-free recovery remain zero-tolerance. The 2-second nearest-rank p95 is provisional; no validation is skipped and failed or timed-out samples are retained."
  - id: C-15
    requirements: [FR-05, SR-01]
    description: "History and export paths can escape the archive root or overwrite user files."
    resolution: "Path confinement and credential scanning reuse SR-01; non-empty export targets return EXPORT_CONFLICT; legacy reports remain unchanged."
  - id: C-16
    requirements: [FR-06, INV-02]
    description: "Recovery can duplicate or mutate trading-memory policy."
    resolution: "Recovery MAY create the one original planned decision entry if it was never written, or idempotently complete that same entry. It MUST NOT create a different decision entry or an additional duplicate, and MUST NOT create a new memory policy, settlement, or reflection."
  - id: C-17
    requirements: [FR-07, FR-01, FR-03]
    description: "Derived metrics can create a second data path or use ambiguous statement columns."
    resolution: "Facts use structured period identity and the existing FR-01 data access, run cache, provenance, and counters. Ambiguous periods return typed n/a and never merge by date or equal value."
  - id: C-18
    requirements: [FR-07, SB-01, INV-01]
    description: "A correct metric block can coexist with a contradictory model narrative."
    resolution: "The metric block is the numeric authority; metric_conflict disclosure and unverified narrative labeling are mandatory. The formal decision still follows SB-01 and INV-01."
  - id: C-19
    requirements: [FR-08, FR-03, FR-07]
    description: "A downstream brief can drop canonical gaps or the verified metric block while meeting a character limit."
    resolution: "Mandatory content is budgeted and reserved first from the FR-03 state and FR-07 block; mandatory overflow rejects/expands rather than truncates."
  - id: C-20
    requirements: [FR-08, FR-02, INV-01]
    description: "A brief can become a second formal context source or claim unmeasured token savings."
    resolution: "The brief is a downstream view only; full reports and formal artifacts remain unchanged. Token and cost effects are a controlled evaluation with provisional thresholds, not a proven optimization."
  - id: C-21
    requirements:
      - FR-02
      - PR-01
    description: The lifecycle record is functional; its write cost is a separate performance target.
    resolution: FR-02 owns the record and lifecycle; PR-01 owns the provisional paired overhead benchmark.
  - id: C-22
    requirements:
      - FR-08
      - CR-01
    description: The brief is functional delivery; net token/cost improvement is a separate cost claim.
    resolution: FR-08 owns brief fidelity and mandatory content; CR-01 owns the controlled cost evaluation and blocked thresholds.
  - id: C-23
    requirements:
      - FR-07
      - GR-01
    description: Metric correctness needs an independent reference set before implementation.
    resolution: FR-07 owns the metric functions; GR-01 freezes independent companies, periods, sources, and expected values.
  - id: C-24
    requirements:
      - FR-01
      - QR-01
    description: Cache dedup correctness and live model quality are different acceptance questions.
    resolution: FR-01 keeps fixed-replay business equivalence; QR-01 owns live quality thresholds and risk-policy separation.
  - id: C-25
    requirements:
      - SR-01
      - SR-02
    description: Credential leakage and path escape have different threats and tests.
    resolution: SR-01 owns credential scanning; SR-02 owns path confinement and escape protection.
moscow:
  must:
    - FR-01
    - FR-02
    - FR-03
    - FR-04
    - FR-05
    - FR-06
    - FR-07
    - FR-08
    - QR-02
    - SB-01
    - INV-01
    - INV-02
    - SR-01
    - SR-02
    - GR-01
  should:
    - PR-01
    - CR-01
    - QR-01
  could: []
  wont:
    - id: "StockTwits-alternative"
      reason: "The 403 root cause is unknown and no keyless replacement has been validated."
    - id: "SEC-point-in-time-profile"
      reason: "Current SEC classification fields are not proven to be historical vintages and could leak later information."
    - id: "parallel-risk-perspectives"
      reason: "It changes debate semantics and requires a separate quality A/B before adoption."
    - id: "LLM-replay-cache"
      reason: "It can mask data or model changes and is outside the D1 scope."
    - id: "full-exchange-calendar"
      reason: "It adds a new dependency; D1 does not require a calendar service."
    - id: "multi-user-encryption"
      reason: "The D1 deployment is a single-user local tool; the threat model is not approved."
  rationale: >-
    All 18 requirements are retained. 17 are approved as a requirement-design baseline and QR-02 is deferred. The five splits each have a separate approval or acceptance path: PR-01 (overhead threshold), QR-01 (live quality), GR-01 (reference freeze), CR-01 (cost threshold), and SR-02 (path threat model). Functional FR-01..FR-08 preserve the trusted-run chain; invariants remain single requirements; deferred sub-scopes are not claimed as delivered.

