schema_version: '1.0'
document:
  id: D1-FR01-CR01
  title: 'D1 Personal Draft: Deterministic Derived Financial Metrics and Downstream Context Cost'
  version: 0.2.0
  status: draft
  date: '2026-11-03'
  language: en
  description: "This standalone personal D1 draft proposes one functional requirement (FR-01, deterministic\
    \ derived financial metrics) and one non-functional requirement (CR-01, downstream context token cost)\
    \ for team review. It uses the team registry schema. It does not claim team approval, implementation,\
    \ test completion, or measured benefit. FR-01 and CR-01 identifiers are provisional until the team\
    \ confirms numbering.\n The selected IDs in scope.approved_ids identify this personal draft only and\
    \ do not imply team approval."
  baseline_ref: baseline/runs/baseline-20261020-01
scope:
  approved_ids:
  - FR-01
  - CR-01
  in_scope:
  - Deterministic calculation of growth, margin, trailing-twelve-month, valuation, liquidity, and free-cash-flow
    metrics from SEC EDGAR statements filed on or before the analysis date.
  - A new analyst tool exposing those metrics with period labels, inputs, and formulas, plus a code-appended
    verified-metrics block at the end of the fundamentals report.
  - Prompt instructions telling the fundamentals analyst, the two researchers, and the three risk debaters
    to quote verified metrics instead of recomputing them.
  - A bounded downstream brief of each analyst report for the five downstream debate agents, with deterministic
    extraction and fallback condensation.
  out_of_scope:
  - Fundamentals vendors other than SEC EDGAR (yfinance, Alpha Vantage); unsupported instruments receive
    an explicit not-supported message.
  - Deriving a fourth-quarter figure by subtracting filed quarters from an annual total, or deriving a
    single quarter by subtracting year-to-date filings.
  - Industry comparison, discounted-cash-flow valuation, forecasts, or price targets.
  - Changes to graph topology, AgentState fields, report rendering, memory, the CLI, the router, or the
    Portfolio Manager.
  - Generic token-budget, overflow, and re-injection behavior described in the team ContextAssembler design;
    CR-01 covers only always-on condensation of analyst reports for downstream agents.
  - A brief block in the sentiment analyst prompt. That report is produced from prefetched blocks through
    structured output (invoke_structured_or_freetext), where a free-text marker block would require an
    output-schema change, and it is the shortest report (6,502 characters in the baseline), so the deterministic
    fallback condenser covers it.
  assumptions:
  - Implementation and experiments run on a team member machine with package-index access and the course
    LLM endpoint; offline unit tests need neither.
  - 'SEC EDGAR statement output keeps its current CSV text format: comment header lines starting with
    ''#'', then one header row of period-end dates and one row per line item.'
  - All five downstream consumers read analyst reports through context.report_or_absent, so the brief
    can be applied without new state fields.
  - CR-01 is coordinated with the owner of the team ContextAssembler design and BO-12 token target before
    implementation.
stakeholders:
- id: analyst
  name: Research analyst
  interest: Needs growth and valuation figures that are computed correctly, with the compared periods
    stated.
- id: trader
  name: Trader
  interest: Needs debate and final decisions that do not rest on mis-aligned growth rates or ambiguous
    valuation multiples.
- id: reviewer
  name: Reviewer
  interest: Needs every derived figure traceable to filed inputs and a formula, and token savings measured
    with a repeatable protocol.
- id: operator
  name: Operator
  interest: Needs lower per-run token cost without losing data-gap visibility or decision quality.
definitions:
  data_query_key: 'The team''s stable identifier for a normalized external data request. FR-01 reads statements
    through existing vendor functions and does not create or alter data-query caching behavior.

    '
  critical_gap: 'A team-configured critical evidence source that is unavailable for the current run. CR-01
    briefs must keep any data gap stated in the full report; they do not decide which gaps are critical.

    '
  coverage_status: 'The team''s complete or partial evidence-coverage result. FR-01 and CR-01 do not compute
    or change it.

    '
  safety_gate: 'The team''s deterministic finalization authority. FR-01 and CR-01 run before it, do not
    change final ratings, and add no second gate.

    '
  zero_tolerance: 'A pass requires exactly zero violations of the stated condition; one violation fails
    the acceptance criterion.

    '
  run_manifest: 'The team''s machine-readable run record. CR-01 measurements are written by a separate
    measurement script and may later be copied into the manifest.

    '
  sensitive_url_parameter: 'URL user information, query, or fragment data that may contain credentials.
    FR-01 and CR-01 records must never contain such values.

    '
