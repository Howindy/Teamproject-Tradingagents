schema_version: "1.0"

document:
  id: "D1-REQ"
  title: "D1 Requirements: Data Availability, Reuse, Safety Gate, and Audit Records"
  version: "1.9.0"
  status: "approved"
  date: "2026-11-09"
  language: "en"
  description: >
    This document defines the approved D1 requirements for the TradingAgents
    baseline. It records the product narrative, the unified requirement
    registry, traceability to the repository and baseline, MoSCoW decisions,
    conflict resolutions, assumptions, open questions, and validation state.
    Only the six requirements in scope.approved_ids are part of D1. Version
    1.1.0 revises FR-01 to limit logical query executions rather than external
    requests, defines data_query_key, and adds concurrency, terminal-outcome,
    vendor-cache, retry/fallback, and offline/live acceptance criteria. Version
    1.2.0 revises FR-02 to define the run lifecycle, a concrete manifest schema,
    identity/path coverage, measurement boundaries, missing-token handling,
    end-to-end overhead, and write-failure integrity. Version 1.3.0 revises
    FR-03 to define the minimal availability record, source identity, closed
    record/requirement status sets, the effective critical profile defaults,
    fallback clearing, multi-query aggregation, and deterministic reporting.
    Version 1.4.0 revises SB-01 to define the trusted gate input, the formal
    decision body, model-proposal separation, the complete blocked-input
    decision table, fail-closed gate-failure behavior, all formal and
    intermediate output boundaries, and entry-point coverage. Version 1.5.0
    revises INV-01 to define the completed checkpoint, artifact binding and
    per-artifact contract, canonicalization, source-status comparison
    granularity, legal fallback versus silent substitution, retry and partial-
    write behavior, and the separate memory decision/settlement lifecycle.
    Version 1.6.0 revises SR-01 to separate known-secret from versioned pattern
    checks, define the fixed scan scope and its limits, resolve the preference
    audit/restore endpoint conflict, add fail-closed failure behavior, preserve
    existing scrub and .env controls, and add over-redaction controls. Version
    1.7.0 renumbers the requirement IDs to match their types: FR-01, FR-02, and
    FR-03 for functional requirements, SB-01 for safety, INV-01 for invariant,
    and SR-01 for security. No requirement semantics changed in that renumbering.
    Version 1.8.0 synchronizes the manifest schema with INV-01, SB-01, FR-03, and
    SR-01; adds completed-state schema constraints; refines cache A/B comparison,
    canonicalization and hash inputs, memory entry binding, synthetic missing
    component records, mandatory capability ownership, security incident records,
    and external manifest timing. Version 1.9.0 adds the gate error stage,
    separates write-scan from run-scan results, carries critical profile,
    coverage snapshot, provenance and input hashes in the manifest, links
    evidence to multiple requirement components, counts HTTP requests, selects
    review wording by gate reason, fixes the run clock, and defines same-day
    rerun, memory-disabled, cross-field semantic, and empty query-set rules.
  baseline_ref: "baseline/runs/baseline-20261020-01"

scope:
  approved_ids:
    - FR-01
    - FR-02
    - FR-03
    - SB-01
    - INV-01
    - SR-01
  in_scope:
    - "Run-scoped single execution of identical logical data queries, with separate retry and fallback budgets and explicit vendor-cache semantics."
    - "One lifecycle-complete run manifest per run invocation, with identity, sanitized configuration, data-source status, measurement counters, token usage, timing, safety-gate result, artifact hashes, and running/completed/failed states."
    - "One canonical run-scoped data-availability state with an effective critical profile, closed record and requirement status sets, deterministic aggregation, fallback clearing rules, and separate critical-gap and non-critical-limitation reporting."
    - "A deterministic fail-closed safety gate over a trusted coverage snapshot that produces a formal decision, keeps the unapproved model proposal separate, handles incomplete or contradictory inputs, and returns REVIEW with a formal manual-review notice when it blocks or fails."
    - "One bound formal result across report, manifest, final-state, and memory: identical run_id, record_version, decision_digest, gate/formal-decision fields, coverage and gap summary, canonical provenance, and memory lifecycle rules."
    - "Secret-safe app-controlled run records through separate known-value and versioned-pattern checks, fixed scan scope, audit/restore endpoint rules, fail-closed failure behavior, and over-redaction controls."
  out_of_scope:
    - "Replacing StockTwits with another social vendor; the 403 root cause is not yet established."
    - "A point-in-time company profile sourced from SEC filings; the current filing fields are not proven to be historical vintages."
    - "Parallel Bull/Bear or risk-analyst execution; it changes debate semantics and requires a separate A/B evaluation."
    - "A full exchange calendar; the approved D1 scope does not include a new calendar dependency."
    - "Multi-user authentication, encryption at rest, and access control."
    - "Portfolio simulation, order execution, and position accounting."
    - "Enabling TypeSafe Jev screening by default."
    - "A production LLM response cache; replay caching remains outside D1."
  assumptions:
    - "The system remains a single-user local tool for D1."
    - "The effective critical set is generated from documented defaults for asset type, analysis mode, and enabled capabilities, then adjusted only by explicit recorded overrides; it is not left to implementation discretion."
    - "REVIEW is an acceptable terminal state for a run with critical data gaps or a blocked gate; it is a non-tradeable sentinel, not a sixth five-tier rating."
    - "The per-run cache is isolated between concurrent runs; existing vendor caches remain cross-run and are recorded as vendor-cache hits."
    - "A running manifest is written before model calls and atomically finalized after analysis; terminal writing does not block model calls."
    - "The repository analysis and the baseline artifacts are the authoritative source for this document."

stakeholders:
  - id: analyst
    name: "Research analyst"
    interest: "Needs reports that distinguish retrieved evidence from missing or fallback evidence."
  - id: trader
    name: "Trader"
    interest: "Needs a final decision that is safe when critical data is absent."
  - id: reviewer
    name: "Reviewer"
    interest: "Needs reproducible records that connect a decision to its sources and configuration."
  - id: operator
    name: "Operator"
    interest: "Needs bounded duplicate requests, clear run records, and no credential leakage."
  - id: security_reviewer
    name: "Security reviewer"
    interest: "Needs deterministic output checks and safe handling of external text and secrets."

definitions:
  data_query_key: >
    The stable, normalized identity of a logical data query: method name, asset
    type, normalized instrument or topic, analysis date, requested window or
    lookback, method-specific parameters such as indicator, series, frequency,
    or limit, vendor selector digest, and cache_key_version. Arguments that
    normalize to the same vendor resource share one key. Retries, fallback
    vendor attempts, call site, and timing do not change the key.
  logical_query: >
    The normalized query identity defined by data_query_key. Two callers with
    the same key are the same logical query within one run, regardless of which
    analyst, tool, or prefetch path issued them.
  query_execution: >
    One run-scoped attempt to satisfy a logical_query. It owns the retry and
    vendor fallback chain and produces one cached terminal outcome. It is not
    the same as an external HTTP request count.
  vendor_cache: >
    A pre-existing cross-run cache inside a vendor adapter, such as the Yahoo
    OHLCV cache or the SEC EDGAR JSON cache. A vendor-cache hit is recorded on a
    query_execution and is distinct from run-cache reuse.
  availability_record: >
    The minimal executed-query availability unit: one run-scoped query_execution
    identified by data_query_key and record_kind = executed. It records tool,
    category, capability, component, supports links, requested and observed
    window, status, reason_code, record_count, ordered attempt results with
    http_request_count, tried and serving sources, fallback state, cache kind,
    and provenance. Exactly one executed availability_record exists per
    data_query_key per run; supports maps the same evidence to every requirement
    component it satisfies.
  component_missing_record: >
    A synthetic record for a critical component that has no query_execution. Its
    identity is (run_id, requirement_id, capability, component) and record_kind =
    component_missing. It has data_query_key = null, attempts = [], status =
    not_attempted, and source = none. Exactly one component_missing_record
    exists per missing critical component. It participates in coverage, gaps, and
    summaries but is excluded from query_executions, external_requests,
    retry_attempts, fallback_attempts, vendor_cache_hits, and run_cache_hits.
  source: >
    The stable logical provider identity from the vendor registry, such as Yahoo
    Finance, SEC EDGAR, FRED, Polymarket, StockTwits, or Reddit. It is not the
    tool name, category, URL, or endpoint. A record keeps attempted_sources in
    order and a nullable serving_source; serving_source is set only when that
    provider returned usable evidence.
  critical_requirement: >
    One entry in the effective critical profile: requirement_id, capability,
    required components, per-component query rule (all, any, or min:N), minimum
    record count, window and point-in-time rule, fallback policy, and
    min_successful_components. The profile is derived from asset type, analysis
    mode, enabled capabilities, and explicit overrides, then recorded for the run.
  record_status: >
    Closed set: success, insufficient_evidence, no_data, unavailable, withheld,
    not_configured, not_attempted, error. success requires the evidence contract,
    not merely a completed call; insufficient_evidence covers too few records,
    partial or stale windows, or undated data barred by the point-in-time rule.
  requirement_status: >
    Closed set: satisfied, degraded, missing, not_required. satisfied means the
    component success count meets the requirement rule; degraded means some but
    not enough; missing means none; not_required means the capability is outside
    the effective critical profile.
  critical_gap: >
    A structured record for a critical requirement with requirement_status
    degraded or missing: requirement_id, capability, requirement_status,
    gap_reason from the closed set, missing_components, and provenance.
    critical_gap_ids is the separate ordered list of those requirement IDs.
    Non-critical gaps are limitations, not critical gaps.
  coverage_status: >
    Closed set: complete or partial. complete means every critical requirement
    has requirement_status satisfied. partial means at least one critical
    requirement is degraded or missing.
  critical_profile: >
    The effective critical profile computed once at run start from asset type,
    analysis mode, enabled capabilities, and recorded overrides. It contains
    profile_version, profile_source, contract_version, analysis_mode, asset_type,
    the ordered critical requirements, and profile_hash. Each requirement lists
    requirement_id, capability, query_rule, min_successful_components,
    min_record_count, fallback_policy, criticality, and per-component contracts:
    component, window_rule, min_record_count, point_in_time_rule, and required.
    It is stored in the manifest and referenced by the coverage_snapshot.
  inheritance_record: >
    Resume/inheritance fields in the manifest: inherited, origin_run_id,
    origin_attempt_id, inherited_counters (separate from current execution
    counters), inherited_evidence_digest, and snapshot_rebound_from. Inheritance
    is allowed only for verified checkpoint evidence from the same logical run
    lineage, never for ordinary cross-run cache reuse.
  run_clock: >
    The fixed run clock: as_of_date, now_utc, timezone, clock_source, derived
    analysis_mode, and mode_source. The mode is computed once at run start from
    this clock, never from a later call to today. Resume/replay inherits the
    original clock unless a clock_override is recorded.
  evidence_requirement_link: >
    An explicit link from one availability record to one requirement component:
    requirement_id, capability, component, and criticality. One executed record
    may support multiple links; its primary link is repeated in the record's
    top-level requirement_id/capability/component fields. A component_missing
    record has exactly one link.
  coverage_snapshot: >
    Immutable run-scoped snapshot produced only by the availability program from
    the critical profile, run clock, and actual availability records. It is
    stored in the manifest and contains run_id, critical_profile_hash,
    provenance_digest, coverage_status, structured critical_gaps,
    critical_gap_ids, snapshot_version, snapshot_hash, computed_at, and
    computed_by = program. critical_profile_hash MUST equal the actual
    critical_profile.profile_hash. The model never creates or mutates it.
  input_hash: >
    SHA-256 over the canonical gate input: the coverage_snapshot hash, the
    model_proposal canonical fields, and the gate_version. The safety_gate and
    FinalizedRunRecord carry the same input_hash for one gate evaluation.
  gate_input: >
    The trusted input to the gate: one immutable coverage_snapshot, one
    model_proposal, and the gate_version. Coverage and gaps are read only from
    the snapshot; the model cannot supply or alter authoritative coverage state.
  gate_result: >
    Closed status passed, blocked, or error, plus reason_codes from the closed
    gate_reason_code set, primary_reason_code selected by the fixed priority
    order, run_id, coverage_status, critical_gap_ids, profile_version,
    snapshot_hash, gate_version, input_hash, and evaluated_at.
  model_proposal: >
    The model's unapproved output: model rating (five-tier or REVIEW), decision
    text, and proposal_status = unapproved. It is retained for audit but is not
    the formal decision.
  formal_decision: >
    The deterministic gate output: status approved or blocked_for_review,
    final_rating, decision_text, and gate_result. When blocked, final_rating is
    REVIEW and decision_text uses the review_class matched to the primary gate
    reason; the model proposal is stored separately and marked not approved.
  gate_reason_code: >
    Closed set: critical_gap, coverage_gap_mismatch, invalid_coverage_status,
    missing_gap_list, invalid_gap_type, missing_availability_record,
    invalid_critical_profile, invalid_model_rating, model_review,
    missing_gate_input, stale_coverage_snapshot, snapshot_hash_mismatch,
    gate_internal_error.
  artifact_binding: >
    The canonical identity and decision fields every formal artifact exposes in a
    machine-readable form: run_id, decision_id, record_version, decision_digest,
    gate_status, formal_decision_status, final_rating, coverage_status,
    critical_gap_ids, coverage_snapshot_hash, and an optional record_hash.
    run_id is the invocation identity; decision_id is the content identity used
    by memory reuse. Artifacts bind to one formal result only when these values
    match.
  canonicalization: >
    Per-field comparison rules. Encoding is UTF-8 with NFC and LF; object keys
    are sorted; scalar whitespace is trimmed. Arrays with semantic order keep it:
    attempts and attempted_sources preserve supplier attempt order, artifacts
    preserve their declared order, and critical_gap_ids are sorted by
    requirement_id. Run-level generated_at, evaluated_at, and finished_at are
    excluded from equality and digests. Evidence timestamps in attempts and
    observed windows are preserved in records and included in full-record
    comparison and provenance_digest. Absolute local paths and rendered report
    prose are excluded; the report binding block and required summary are
    compared.
  entry_digest: >
    SHA-256 over the stable decision-content projection: decision_id,
    trade_date/ticker, and formal decision status/rating/text. It excludes
    coverage_status, critical_gap_ids, provenance_digest, run_id, source snapshot
    hash, timestamps, commit_status, and reuse metadata so the same decision can
    be reused across normal reruns with different evidence.
  evidence_digest: >
    SHA-256 over the per-run evidence projection for a memory entry:
    coverage_status, critical_gap_ids, and provenance_digest. It may differ
    across two runs with the same decision_id; evidence difference is not entry
    corruption and does not block reuse.
  decision_digest: >
    SHA-256 over the canonical formal decision input: formal_decision.status,
    final_rating, and decision_text after UTF-8 NFC, LF, and trailing-whitespace
    trimming. Run-level timestamps, paths, and cache metadata are not inputs.
  provenance_digest: >
    SHA-256 over the canonical ordered availability records and fallback
    provenance, including data_query_key, record_kind, component identity,
    ordered attempts, attempt source/status/reason_code/record_count,
    evidence timestamps, tried and serving sources, and criticality. All cache
    metadata (cache_kind, vendor_cache_hit, run_cache_hit) and run-level
    generation timestamps are excluded from the digest input. Report and
    memory carry the digest plus a derived summary; manifest and final-state
    carry the full canonical records.
  record_hash: >
    Optional SHA-256 over the canonical FinalizedRunRecord projection excluding
    volatile run-level timestamps (including run_clock.now_utc), artifact paths,
    cache counters, and computed snapshot timestamps. When present, every artifact
    binding must carry the same value. It is not a hash of the shared memory file.
  memory_entry_binding: >
    A binding to one immutable memory decision entry: source_run_id, decision_id,
    record_version, decision_digest, trade_date/ticker identity, entry_digest,
    evidence_digest, a commit_status projection, pre-commit entry_version,
    optional supersedes, and an optional reused_decision_ref. The
    effective version is the highest entry_version whose source terminal manifest
    is committed; no post-commit write to an older entry is required. entry_digest
    covers only stable decision content (decision_id, trade_date/ticker, formal
    decision fields) and excludes coverage, gaps, provenance, source_run_id,
    source snapshot hash, timestamps, commit_status, and other run metadata.
    evidence_digest covers the per-run evidence and may differ without implying
    entry corruption. The current artifacts keep
    the current run_id; a reused historical entry is referenced through
    reused_decision_ref instead of rewriting its source run identity. The shared memory file itself is not hashed.
    Settlement/reflection and policy-based rotation of resolved entries are
    legal and do not change the binding; modifying or deleting a decision entry
    while it is retained is illegal. The manifest memory object records enabled, status, entry_version, entry_binding,
    entry_digest, evidence_digest, supersedes, reused_decision_ref,
    retention_status, and same_day_rerun.
    A memory artifact uses hash_scope = memory_entry, not a whole-file hash.
  behavior_evaluation_contract: >
    The frozen D1 behavior-evaluation contract: eval_set_version, rubric_version,
    fixed model/config/data snapshots, case count, rubric dimensions, pass
    thresholds, and blocking rules. It must be fixed before any FR-01 live A/B
    acceptance runs; the frozen files are docs/req/evaluation/behavior-eval-contract-v1.json,
    eval-set-v1.json, rubric-v1.json, config-v1.json, prompt-v1.0.yaml, and
    snapshots-v1.json; actual snapshots remain pending capture. Changing them requires a new version and a recorded decision.
  evaluation_rubric: >
    Five 0-to-5 dimensions: evidence fidelity, relevance, coverage correctness,
    safety, and actionability. The rubric records per-case scores and the
    aggregate mean. Safety and coverage correctness are zero-tolerance; quality
    thresholds allow only the declared degradation.
  eval_set_version: >
    A frozen evaluation set (docs/req/evaluation/eval-set-v1.json) of at least
    10 ticker/date cases, including the baseline NVDA 2026-10-19 case, with fixed
    data snapshots, model, configuration, and prompts for every A/B run. Snapshot
    capture is required before behavioral acceptance. The fixed config, prompt,
    and snapshot manifest are recorded with SHA-256 digests in the contract.
  decision_id: >
    The content identity of a formal decision, stable across same-day reruns
    when trade_date, ticker, and decision_digest match. run_id remains unique per
    invocation. Memory reuse is keyed by decision_id, not run_id; a different
    decision_id for the same trade_date/ticker is a conflict.
  review_class: >
    Closed formal-review class derived from gate reason_codes: none,
    data_insufficient, model_rating_invalid, model_review, gate_system_error,
    input_invalid, or coverage_inconsistent. It selects the wording of the
    blocked formal decision so a rating anomaly or system failure is not
    mislabeled as missing data.
  artifact_contract: >
    Per-artifact required content. Report carries the binding plus coverage,
    critical-gap, fallback, and gate summaries. Manifest and final-state carry
    the binding plus full availability records and full gate/formal-decision
    fields. Memory carries the binding plus final rating, formal decision text or
    digest, coverage and gap summary, and provenance digest.
  publish_state: >
    Closed set running, staged, validated, completed, partial, failed. INV-01 is
    claimed only for completed; partial or failed runs are not formal success and
    may be retried with the same run_id, record_version, and record_hash.
  invariant_checkpoint: >
    The invariant is checked before completed is recorded, after publication on
    every read of a completed run's formal artifacts, and after any retry or
    resume. It is not claimed while artifacts are incomplete.
  secret_value: >
    A credential value actually configured or used by the run: an API key,
    access token, bearer token, password, client secret, URL userinfo password,
    or a sensitive query or header value. Values are collected in memory for the
    run and are never written to a record.
  secret_pattern_rule: >
    A versioned detection rule category for values not known in advance. The
    fixed minimum categories are provider key formats, generic bearer and JWT
    formats, URL userinfo, sensitive query parameter names and values, sensitive
    authorization headers, and password/token assignments. Each rule set carries
    secret_rule_version, secret_rule_source, and effective_at.
  scan_scope: >
    The closed set of app-controlled boundaries: run manifest, final-state,
    memory decision entry, formal report metadata and content, logs, preferences,
    error records, gate reasons, availability reasons, and formal API return.
    Vendor/provider logs, shell history, OS/network captures, and external
    service logs are out of scope and MUST be named as such.
  redaction_policy: >
    Known secret values are removed by exact match; pattern-matched values are
    redacted or block the record. Redaction replaces only the secret value with
    a stable marker such as *** and preserves keys, parameter names, structure,
    status, reason codes, counts, timings, source and vendor names, tickers,
    dates, model ids, and relative paths. Whole-record or whole-URL removal and
    indiscriminate long-string redaction are forbidden as over-redaction.
  secret_scan_result: >
    The recorded scan outcome: known_secret_match_count,
    pattern_match_count, redaction_count, scanner_error, rule_version, and the
    scanned scope. A clean result requires zero known-secret matches, zero
    unredacted pattern matches, and no scanner error. The result proves only the
    defined scope, rules, and fixtures, not the absence of unknown credential
    formats outside them.
  endpoint_audit_record: >
    The audit/display endpoint: scheme, host, and path only. Userinfo, query, and
    fragment are removed.
  endpoint_restore_record: >
    The preference restore endpoint: scheme, host, path, allowlisted
    non-sensitive query parameters, and secret_ref names. Inline sensitive values
    are forbidden; a sensitive component is resolved from .env or the process
    environment, and if it cannot be migrated the record marks re_entry_required.
  safety_gate: >
    Deterministic code that consumes the trusted coverage_snapshot and
    model_proposal, validates coverage, gaps, profile, snapshot provenance,
    availability records, and model rating, and produces the formal_decision
    before any formal display, persistence, memory write, manifest, API return,
    or backtest scoring. It is fail-closed: invalid input or a gate error yields
    REVIEW with a manual-review notice, and the model cannot override it.
  zero_tolerance: >
    A pass requires exactly zero violations. A single violation fails the
    acceptance criterion; there is no percentage allowance.
  run_manifest: >
    The one machine-readable JSON record for a run invocation, written at
    <results_dir>/<run_id>/run_manifest.json and valid against
    docs/req/run-manifest-schema.json. It contains schema_version, run
    identity, parent_run_id, lifecycle status, sanitized configuration
    allowlist, timing, call and token counters, data-source status,
    safety-gate result, artifact hashes, and an optional error record.
  sensitive_url_parameter: >
    A URL userinfo component, query parameter, or fragment that can carry a
    credential, token, password, or API key. Sensitive parameters are excluded
    from all records.

