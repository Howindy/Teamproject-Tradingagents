schema_version: "1.0"

document:
  id: "D1-REQ"
  title: "D1 Requirements: Data Availability, Safety Gate, Portfolio Risk, Financial Metrics, Downstream Brief, Archive Retrieval, Recovery, and Audit Records"
  version: "1.44.0"
  status: "approved"
  date: "2026-11-15"
  language: "en"
  description: >-
    This document defines the approved D1 requirements for the TradingAgents baseline. It records the product narrative, the unified requirement registry, traceability to the repository and baseline, MoSCoW decisions, conflict resolutions, assumptions, open questions, and validation state. The 17 active requirements are approved as a requirement-design baseline; QR-02 remains deferred and is not part of current acceptance. Approval does not assert application implementation, tests, live evaluation, or attainment of provisional performance/cost/quality targets. Version 1.1.0 revises FR-01 to limit logical query executions rather than external requests, defines data_query_key, and adds concurrency, terminal-outcome, vendor-cache, retry/fallback, and offline/live acceptance criteria. Version 1.2.0 revises FR-02 to define the run lifecycle, a concrete manifest schema, identity/path coverage, measurement boundaries, missing-token handling, end-to-end overhead, and write-failure integrity. Version 1.3.0 revises FR-03 to define the minimal availability record, source identity, closed record/requirement status sets, the effective critical profile defaults, fallback clearing, multi-query aggregation, and deterministic reporting. Version 1.4.0 revises SB-01 to define the trusted gate input, the formal decision body, model-proposal separation, the complete blocked-input decision table, fail-closed gate-failure behavior, all formal and intermediate output boundaries, and entry-point coverage. Version 1.5.0 revises INV-01 to define the completed checkpoint, artifact binding and per-artifact contract, canonicalization, source-status comparison granularity, legal fallback versus silent substitution, retry and partial- write behavior, and the separate memory decision/settlement lifecycle. Version 1.6.0 revises SR-01 to separate known-secret from versioned pattern checks, define the fixed scan scope and its limits, resolve the preference audit/restore endpoint conflict, add fail-closed failure behavior, preserve existing scrub and .env controls, and add over-redaction controls. Version 1.7.0 renumbers the requirement IDs to match their types: FR-01, FR-02, and FR-03 for functional requirements, SB-01 for safety, INV-01 for invariant, and SR-01 for security. No requirement semantics changed in that renumbering. Version 1.8.0 synchronizes the manifest schema with INV-01, SB-01, FR-03, and SR-01; adds completed-state schema constraints; refines cache A/B comparison, canonicalization and hash inputs, memory entry binding, synthetic missing component records, mandatory capability ownership, security incident records, and external manifest timing. Version 1.9.0 adds the gate error stage, separates write-scan from run-scan results, carries critical profile, coverage snapshot, provenance and input hashes in the manifest, links evidence to multiple requirement components, counts HTTP requests, selects review wording by gate reason, fixes the run clock, and defines same-day rerun, memory-disabled, cross-field semantic, and empty query-set rules. Version 1.10.0 merged two draft requirements from Jiang Yiyang's proposal: FR-04 deterministic portfolio-risk evaluation of a structured candidate trade, and INV-02 deterministic portfolio-risk authority and zero unsafe approvals. Version 1.11.0 rewrites both requirements around one applicability rule, explicit first-entry and add-long fields, timezone-aware historical valuation cutoff, exact amount/price/cash/currency consistency, a locatable policy snapshot with provisional-threshold boundaries, current versus reused historical memory evidence, and separate cache and risk-policy evaluations. Version 1.12.0 fixes the FR-04-AC1 arithmetic, separates normalized risk-input artifacts from safe invalid-input diagnostics, defines the unique timezone-aware valuation cutoff and future analysis-date rejection, fixes the combined coverage-failure plus evaluator-exception result, and adds local evidence fixtures with digest, metric, policy, tamper, wrong-metric, and invalid-input checks. The 30% concentration and 5% stop-distance defaults remain provisional until human approval. Version 1.14.0 merges the corrected valuable parts of yhx: FR-07 deterministic derived financial metrics from structured filing facts and FR-08 unified downstream analyst-report brief. Version 1.13.0 merges the adoptable parts of pxs: FR-05 historical formal-publication retrieval, FR-06 startup recovery of pending formal publication, and QR-02 a provisional recovery-performance target. It merges pxs identity, section-isolation, truthful-completion, and model-free idempotent-recovery rules into FR-02, INV-01, and the existing publication contract; it reuses SR-01 for credentials and adds path-safety and export-conflict criteria. Version 1.14.0 adds FR-07 structured-fact financial metrics with period identity, TTM formulas, program metric blocks, narrative-conflict disclosure, and independent reference requirements, and FR-08 a downstream brief view with canonical gaps, separate mandatory and compressible budgets, downstream-role boundaries, and controlled token/quality evaluation. Version 1.14.1 corrects fiscal-period matching and coverage, fact subject/accession identity, metric persistence and model-free recovery, metric-claim conflict scope, brief budget precedence and audit metadata, and unified quality/lifecycle acceptance. Version 1.15.0 changes every requirement status to draft pending human review, marks QR-02 deferred, and removes unretained personal-proposal source paths. Version 1.16.0 applies the limited split into PR-01, CR-01, GR-01, QR-01, and SR-02, and defers FR-05 export, FR-06 multi-worker recovery, FR-07 TTM/FCF YoY, and QR-02 performance. Version 1.17.0 fixes PR-01 write and overhead statistics, GR-01 prerequisite direction and evidence conditions, CR-01 measurement/improvement semantics and brief-contract alignment, FR-01/QR-01 responsibility duplication, QR-02 type, and deferred-scope and validator consistency. Version 1.18.0 aligns the shared brief-evaluation definition and CR-01 with contract v2, fixes the four-state evidence model and cost-claim boundary, completes the local cost measurement disclosure, and splits GR-01 pre-implementation freeze readiness from post-implementation timing. Version 1.19.0 clarifies query identity/budgets, manifest timing and immutable content, availability snapshot sealing, risk-input binding and reason mapping, history edge semantics, recovery sequencing, financial visibility/conflict consequences, brief deterministic defaults, benchmark boundaries, local-cost usage/aggregation, reference-freeze digest projection, live-quality aggregation, gate blocked/error uniqueness, memory reuse/status mapping, risk-evidence null handling, credential failure scanning, and path read/write boundaries. Version 1.20.0 removes remaining contradictory rules: query budget continuation, manifest timing/write-failure boundaries, coverage record identity and fallback status, invalid-rating risk handling, decimal positive/negative fixtures, FR-08 versus CR-01 acceptance, unique live-sampling rule, SB-01 blocked/error table, INV-01 historical memory projection, concrete empty/short-secret rules, and unsupported-platform path behavior.
    Version 1.21.0 completes the semantic revision of FR-01 through FR-05: versioned execution and normalization contracts, waiter/execution cancellation separation, bounded timeouts and budgets, checkpoint inheritance; non-self-referential manifest timing, truthful lifecycle nullability, call/usage coverage, discriminator and write-failure semantics; declared query plan Q, executed set E, supports contract set S, fixed quorum, period slots, evidence deduplication, sealed coverage snapshot; bounded canonical risk input, exact cross-product limits, portfolio scope, policy/input/diagnostic separation; and a minimal verified list/get history interface with exact pagination, scan-budget failure, closure, section completeness, and extra-file rejection. No requirement is approved by this revision; all active requirements remain draft.
    Version 1.22.0 closes the pre-approval gaps for FR-02, FR-04, FR-05, FR-06, FR-07, and FR-08 without adding, deleting, or renumbering ACs: manifest observed-timing arithmetic, lifecycle-required timing/token coverage and semantic negatives; canonical 0.3 policy thresholds, logical policy identity versus file reference, and digest/file-SHA separation; separate limit/offset domains and a controlled cross-run historical proof exception; single-process startup recovery with failed_precommit continuation, terminal-first conflict/corruption handling, original risk-state preservation, restored metrics, and memory new/reuse/disabled modes; fiscal-position/version/date-level/price/completed-close/formula/display/n-a and analyst-off semantics; and token-primary brief budgets, full-request caps, resolved references, five-role replacement, versioned FR-03 views, single terminal BRIEF_REJECTED with invalid_marker reason, audit metadata, and FR-08/CR-01 acceptance separation. No requirement is approved by this revision; all active requirements remain draft and human review remains pending.
    Version 1.23.0 applies the current modification review to all active requirements without adding, deleting, or renumbering ACs. It closes PR-01 enabled/no-op, AB/BA, failure/rerun, payload and acceptance boundaries; CR-01 field-level usage, selected/shared generation, aggregate/target, execution-status and contract-v3 rules; GR-01 independent-source/derivation paths, issuer/calendar evidence, and initial-versus-revision timing; QR-01 scoring merge/adjudication, sample completeness, percentage-point REVIEW, cache/risk separation and hard safety events; SB-01 gate/publication separation, trustworthy blocked-record conditions, unique unsupported mapping, timeout/recovery evidence and nullable risk state; INV-01 identity/projection separation, per-field canonicalization, pre/post-commit failure, retention proof and reservation high-water rules; INV-02 reason/review-class mapping, independent corpus expectations, current/historical evidence, pure/wrapper boundaries and read-time tamper; SR-01 detected/redacted/residual accounting, credential-store exceptions, extended scope, scanner-failure incidents and post-commit handling; and SR-02 all-operation confinement, trusted-root/link policy, check-use races, typed historical references and honest platform limits. No requirement is approved by this revision; all active requirements remain draft and human review remains pending.
    Version 1.24.0 records the user-authorized approval of the active D1 requirement design and freezes the approved baseline. It normalizes every fit criterion to the per-requirement <requirement-id>-FCnn format without adding, deleting, merging, splitting, or semantically rewriting any requirement or FC; preserves 18 requirements and 122 FCs; records the complete mapping in docs/req/requirement-mapping.csv; sets the 17 active requirements to approved; keeps QR-02 deferred; and records the approval basis, scope, freeze files, and limitations in the validation approval record. Provisional thresholds, unmeasured criteria, blocked evaluation inputs, external reference evidence, and implementation prerequisites remain in their prior states and are not made approved or complete by this freeze.
    Version 1.25.0 applies the user-authorized CR-01 local correction without adding, deleting, or renumbering any requirement or FC. It replaces the previous four-value/overloaded CR-01 state wording with two explicit fields: execution_status (not_started/running/completed/aborted) and acceptance_status (blocked/ready/accepted/failed, with null only while running). It forbids pending/aborted acceptance strings, defines running/null, completed/accepted, completed/failed, and aborted/failed, rejects a started attempt returning to blocked/ready, treats run_completed as auxiliary only, and preserves terminal attempts, observed_failures, retry history, the existing cost formula, quality/safety rules, thresholds, approval conditions, and deferred scope. The active brief evaluation contract becomes brief-eval-contract-v4; v3 and earlier remain historical. No other requirement content is changed except the FR-08 active-contract reference; QR-02 remains deferred.
    Version 1.26.0 converges FR-01 to run-scoped reuse of identical data queries for the explicitly listed get_news paths. It replaces the prior nine fit criteria with five (sequential reuse, query identity, concurrent reuse, run isolation, and real-path integration with result protection), removes the versioned normalization contract, execution policy, retry/fallback budgets, waiter/execution cancellation, shared deadlines, run-cache capacity policy, checkpoint inheritance, cache on/off business-equivalence acceptance, all-entry-point coverage, and benefit acceptance from FR-01, and reduces the global fit-criterion count from 122 to 118. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. No application implementation, test result, or measured benefit is claimed.
    Version 1.27.0 converges FR-02 to a native, auxiliary per-analysis run manifest for the CLI analysis entry and TradingAgentsGraph.propagate(). It replaces the prior eleven fit criteria with five (normal lifecycle/content, run identity/statistics isolation, call/token accounting, execution failure and non-blocking write failure, and entry-point integration/format), removes FR-02's implementation dependency on FR-01, drops coverage/gate/risk/memory/recovery snapshots, artifact hashes, cross-artifact binding, terminal-manifest commit semantics, phase timing, field-level usage coverage, checkpoint inheritance, same-run resubmission and concurrent publication requirements, and benefit acceptance from FR-02. It fixes the token rule (any counted call without valid input/output usage makes both totals null and usage_complete false), makes manifest write failures non-blocking warnings, and limits supported entry points to CLI analysis and propagate(). The global fit-criterion count recomputes from 118 to 112; the requirement count remains 18. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0 or v1.27.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. No application implementation, test result, or measured benefit is claimed.
    Version 1.28.0 converges FR-03 to a run-scoped data availability summary for a fixed list of 15 supported call-path positions over 14 methods. It replaces the prior ten fit criteria with five (query status/reason, fixed stock necessity list, supplementary limitations and fallback, last completed result and run isolation, and real-path integration with deterministic display), removes the dynamic critical profile/plan, overrides/fetch owners/auto-preflight, supports contracts, eligible-evidence counts and quorum, annual/quarter slots, HTTP/attempt/provenance ledgers, versioned views, barriers/deadlines/seals, checkpoint inheritance, memory reuse/proof/binding, cross-system business-equivalence acceptance, and FR-03-owned REVIEW or formal-publication decisions. It fixes the stock necessity list at seven analyst-gated items, adopts the last-completed-result rule as of each consumer's time, and states that summary refresh never triggers a new query, refetch, retry, or model re-run. FR-03 no longer declares an implementation dependency on FR-01 and does not require FR-02. The global fit-criterion count recomputes from 112 to 107; the requirement count remains 18. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0, v1.27.0, or v1.28.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. No application implementation, test result, or measured benefit is claimed.
    Version 1.29.0 converges FR-04 to deterministic risk checks for a stock purchase scenario. It replaces the prior nine fit criteria with five (normal/boundary arithmetic, over-limit, input/config negatives, applicability/authority, entry/report), removes broker/account source approval, cash checks, quantity/value identity, historical valuation cutoff/freshness, the canonical decimal grammar, policy approval/version/digest, input artifact SHA, diagnostic artifact, effective_order_value, gate hash, memory/recovery/cross-artifact consistency, cache/risk-policy A/B, and repeated 100-run requirements, and fixes the caller-supplied minimal input, two formulas, configurable classroom thresholds, applicability, and failure semantics. FR-04 declares no implementation dependency on FR-01, FR-02, FR-03, or SB-01. The global fit-criterion count recomputes from 107 to 103; the requirement count remains 18. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0 through v1.29.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. No application implementation, test result, measured risk event, or over-limit Buy observation is claimed.
    Version 1.30.0 converges FR-05 to a lightweight historical analysis report lookup. It replaces the prior three fit criteria with five (discovery/bad-record isolation, filtering/ordering, saved-report reading, path/root errors, and save integration with query read-only behavior), removes committed-publication and read-time INV-01/INV-02 validation, VerifiedRun and immutable-report claims, section manifests and renderer/capability binding, hashes/byte sizes/extra-file checks, risk/metric/memory proof closure, reused_decision_ref cycles and rotation proof, indexes/pagination/total-count/scan-budget formulas, concurrent-read transaction consistency, repair/recovery/republication/migration, CLI history menus, export, full-text search, and Web UI, and removes automatic propagate() report saving. FR-05 retains only the direct FR-02 implementation dependency and states basic safe-read rules directly. The global fit-criterion count recomputes from 103 to 105; the requirement count remains 18. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0 through v1.30.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. No application implementation, test result, or retrieval guarantee is claimed.
    Version 1.31.0 simplifies FR-06 to deferred local recovery of an unfinished merged Markdown report save and moves it from the active approved scope to the deferred scope. It replaces the prior six fit criteria with five (material and normal cleanup, model-free completion in an independent session, repeated recovery/conflict/cleanup failure, bad material/path/storage failure, and entry/non-blocking boundaries), removes formal-publication commit, terminal-first/failed_precommit promotion, read-time INV-01/INV-02 validation, risk/policy/metric/memory proof recovery, multi-process guard/ownership/takeover, digests/failure audits/quarantine/retry scheduling, section/HTML recovery, manifest repair, history registration, and current performance acceptance, and states the single-process, saved-text-only, FR-02-identity dependency directly. FR-06 is not part of current active acceptance; its five FCs are retained as future conditions and remain in the total count. The global fit-criterion count recomputes from 105 to 104; the requirement count remains 18, with 16 approved active requirements and 2 deferred requirements (QR-02 and FR-06). Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26. 0 through v1.31.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. No application implementation, test result, recovery event, or benefit is claimed.
    Version 1.32.0 removes FR-07 (deterministic derived financial metrics) from the requirement registry because the user decided not to implement it. Its ten fit criteria and its dedicated traceability entry are removed; the remaining requirements and FC IDs are not renumbered, and FR-07 is neither retained as deferred nor reused. The requirement count recomputes from 18 to 17, with 15 approved active requirements and 2 deferred (FR-06 and QR-02); the global fit-criterion count recomputes from 104 to 94. References to FR-07 inside GR-01, FR-08, INV-01, shared definitions, conflict resolutions, and open questions are deliberately left unchanged for later review, so they may be dangling or out of date. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26. 0 through v1.32.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. No application implementation, test result, or benefit is claimed.
    Version 1.33.0 renames the former downstream-brief FR-08 to FR-07 and simplifies it to deferred analyst short summaries for five downstream debate roles. The former financial-metrics FR-07 was already removed in v1.32.0, so the identifier is reused only for the renamed summary requirement; old financial-FR-07 and old-FR-08 references in other requirements and historical records retain their old meaning and may collide with the new ID. The revision replaces the prior four fit criteria with five (same-call summary structure, target-role replacement scope, character boundary and non-blocking fallback, FR-03 program-limitation preservation, and full-report/integration preservation), removes token budgets, tokenizer dependence, references/resolvers, terminal BRIEF_REJECTED, marker protocols, audit metadata, view versions, financial metric blocks, formal-publication/memory/history/recovery binding, and cost/token/quality benefit claims, and adopts a pending Unicode-character limit, direct FR-03 program-summary inclusion, and full-report fallback. FR-07 is deferred, not part of current active acceptance, and retains its five FCs as future conditions. The requirement count remains 17, with 14 approved active requirements and 3 deferred (FR-06, FR-07, QR-02); the global fit-criterion count recomputes from 94 to 95. Additional dependencies change from old FR-07/SB-01/INV-01/SR-01 to FR-02 and FR-03. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0 through v1.33.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/evaluation/brief-eval-contract-v4.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. No application implementation, test result, token/cost saving, quality improvement, or semantic-fidelity guarantee is claimed.
    Version 1.34.0 is a strictly limited wording correction: it replaces FR-01 and FR-03 references to the removed financial-metrics feature so they no longer point at the current FR-07, states FR-02 manifest creation/update as required with best-effort persistence, clarifies FR-03 no-completed-result versus not-executed wording, makes FR-04 CLI display and propagate() final_state exposure mandatory, limits FR-05 error/warning output and requires missing registered reports to remain listed while distinguishing reference resolution from existence, clarifies FR-06 no-pending-task normal return, and narrows FR-07 FC02 no-duplication scope. No requirement ID, status, priority, dependency, or FC count/number changed; counts remain 17 requirements and 95 FCs, with 14 approved active requirements and 3 deferred (QR-02, FR-06, FR-07). Historical records and external artifacts are not revalidated by this revision.
    Version 1.35.0 converges PR-01 to deferred measurement of run-manifest operation overhead. It replaces the prior four fit criteria with two (complete manifest-creation operation timing and complete manifest-update operation timing), removes the enabled/disabled paired benchmark, AB/BA order, independent WriteEvidence, named pre-replace phases, committed-publication control, risk/gate/memory equivalence, 256 KiB payload cap, layered digests, rerun classification, and the 100 ms/1%/1 s thresholds, and adopts 20 samples per operation, nearest-rank p95, retained failures and actual byte counts, and thresholds that remain null/undetermined until after measurement. PR-01 is deferred, not part of current active acceptance, retains its two FCs as future conditions, keeps FR-02 as its only implementation dependency, and drops the INV-01 constraint relation. The requirement count remains 17, with 13 approved active requirements and 4 deferred (FR-06, FR-07, PR-01, QR-02); the global fit-criterion count recomputes from 95 to 93. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0 through v1.35.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. No measurement, implementation, threshold approval, or performance acceptance is claimed.
    Version 1.36.0 converges CR-01 to deferred comparison of model usage and estimated cost with analyst briefs. It replaces the prior five fit criteria with three (formula/missing handling, fixed three-scenario OFF/ON measurement, and result/claim boundaries), removes the local G/D attribution, selected generation instance, excluded-cost rules, reference/mandatory budgets, view updates, execution_status/acceptance_status machine, input digests, retry-state protocol, approved net_cost_max/quality-loss thresholds, safety/quality acceptance coupling, and INV-01/SB-01 constraints. It adopts three fixed OFF/ON scenarios over whole-analysis application-level usage, includes real retries/fallbacks and failed calls, reports token and estimated cost differences separately from given unit prices, and leaves thresholds undetermined until after measurement. CR-01 is deferred, not part of current active acceptance, retains its three FCs as future conditions, and keeps FR-02 and the renamed deferred FR-07 analyst-summary requirement as its only implementation dependencies. The requirement count remains 17, with 12 approved active requirements and 5 deferred (CR-01, FR-06, FR-07, PR-01, QR-02); the global fit-criterion count recomputes from 93 to 91. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0 through v1.36.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json, docs/req/evaluation/brief-eval-contract-v4.json, and the D2 artifacts are not updated by this revision. No measurement, cost-target approval, cost saving, quality preservation, or overall optimization success is claimed.
    Version 1.37.0 deletes GR-01, the frozen independent reference set for the removed financial-metrics feature, because that feature no longer exists and the current FR-07 is the deferred downstream-summary requirement. GR-01, its six fit criteria, its dedicated traceability entry, its scope and MoSCoW listings, and its standalone financial-reference scope bullet are removed; GR-01 is not deferred and its identifier is not reused. No other requirement or FC is renumbered, and no replacement requirement is added. The requirement count recomputes from 17 to 16, with 11 approved active requirements and 5 deferred (CR-01, FR-06, FR-07, PR-01, QR-02); the global fit-criterion count recomputes from 91 to 85. References to GR-01 or to the old financial FR-07 inside other requirements, shared definitions, conflict resolutions, and open questions are deliberately left unchanged and may now be dangling. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0 through v1.37.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. No application implementation, test result, benefit, or full-document consistency is claimed.
    Version 1.38.0 deletes QR-01, the live cache A/B quality and risk-policy separation requirement, because the simplified FR-01 five fit criteria cover basic query-reuse correctness and the user decided not to retain a separate online quality, REVIEW-rate, or risk-policy A/B requirement. QR-01, its five fit criteria, its dedicated traceability entry, its scope and MoSCoW listings, and its standalone live-evaluation scope bullet are removed; QR-01 is not deferred and its identifier is not reused. No other requirement or FC is renumbered, and no replacement requirement is added. The requirement count recomputes from 16 to 15, with 10 approved active requirements and 5 deferred (CR-01, FR-06, FR-07, PR-01, QR-02); the global fit-criterion count recomputes from 85 to 80. References to QR-01, old FR-01-FC06, or the online evaluation contracts inside other requirements, shared definitions, conflict resolutions, and open questions are deliberately left unchanged and may now be dangling. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0 through v1.38.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json, docs/req/evaluation/behavior-eval-contract-v2.json, docs/req/evaluation/eval-set-v1.json, and the D2 artifacts are not updated by this revision. No application implementation, test result, benefit, or full-document consistency is claimed.
    Version 1.39.0 deletes QR-02, the bounded startup-recovery performance target, because it addressed the old formal-publication recovery system while the current FR-06 is the deferred saved-text completion of complete_report.md and no longer has that benchmark scope. QR-02, its two fit criteria, its dedicated traceability entry, its scope and MoSCoW listings, and its standalone deferred recovery-performance scope bullet and scope assumption are removed; QR-02 is not retained as deferred and its identifier is not reused. No other requirement or FC is renumbered, and no replacement requirement is added. The requirement count recomputes from 15 to 14, with 10 approved active requirements and 4 deferred (CR-01, FR-06, FR-07, PR-01); the global fit-criterion count recomputes from 80 to 78. References to QR-02, the 2-second target, 30 trials, or the recovery benchmark inside other requirements, shared definitions, conflict resolutions, and open questions are deliberately left unchanged and may now be dangling. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0 through v1.39.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. No application implementation, benchmark, test result, approved target, benefit, or full-document consistency is claimed.
    Version 1.40.0 converges SB-01 to deterministic checks for the final recommendation. It replaces the prior twelve fit criteria with five (normal pass, FR-03 data condition, applicable FR-04 risk condition, invalid input/check exception, and entry/formal-conclusion separation), removes the immutable coverage snapshot, critical profile, seal, hash, lineage, snapshot revalidation, forced FR-04 re-execution, policy snapshot/cash/freshness/digest rules, formal-publication and cross-artifact binding, memory/history/recovery proof, the full gate reason/review-class system, timeout/late-result protocol, and manifest-failure coupling. It adopts a minimal decision over the current analysis's FR-03 summary, applicable FR-04 result, and model rating, keeps the original model proposal separate, and produces REVIEW with a program-generated manual-review notice on blocked or error. SB-01 remains an approved Must invariant; its only implementation dependencies are FR-03 and FR-04. The requirement count remains 14, with 10 approved active requirements and 4 deferred (CR-01, FR-06, FR-07, PR-01); the global fit-criterion count recomputes from 78 to 71. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0 through v1.40.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. No application implementation, test pass, or trade authorization is claimed.
    Version 1.41.0 converges INV-01 to consistent delivery and persistence of the final result. It replaces the prior eleven fit criteria with three (output-source consistency, new memory decision consistency, and preservation under normal later updates), removes artifact_binding, decision_id/record_version/digests, report/memory binding blocks, full availability-record and provenance-ledger comparison, whole-field canonicalization, all-artifacts-required completion, atomic multi-file commit, independent publish state, read-time revalidation, tamper/corruption detection, retry/recovery identity, memory reservation/high-water/supersedes/concurrent allocation, retention/rotation proof, and the FR-05/FR-06 artifact chain. It restricts the comparison to actually produced outputs and SB-01's post-check rating/decision, permits format differences, keeps the manifest outside the rating comparison, and preserves existing save-failure behavior. INV-01 remains an approved Must invariant; SB-01 is its only implementation dependency. The requirement count remains 14, with 10 approved active requirements and 4 deferred (CR-01, FR-06, FR-07, PR-01); the global fit-criterion count recomputes from 71 to 63. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0 through v1.41.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. No implementation, test pass, immutability, or permanent-consistency guarantee is claimed.
    Version 1.42.0 deletes INV-02, the deterministic portfolio-risk authority and zero-unsafe-approval invariant, because its core guarantees are now covered by the simplified FR-04, SB-01, and INV-01 and the user decided not to retain a separate duplicate acceptance and old risk-evidence management requirement. INV-02, its six fit criteria, its dedicated traceability entry, its scope and MoSCoW listings, and its standalone cross-artifact risk-evidence scope bullet are removed; INV-02 is not deferred and its identifier is not reused. No other requirement or FC is renumbered, no replacement requirement is added, and FR-04, SB-01, and INV-01 retain their existing responsibilities. The requirement count recomputes from 14 to 13, with 9 approved active requirements and 4 deferred (CR-01, FR-06, FR-07, PR-01); the global fit-criterion count recomputes from 63 to 57. References to INV-02 or to the old risk-evidence/policy/version mechanisms inside other requirements, shared definitions, conflict resolutions, and open questions are deliberately left unchanged and may now be dangling. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0 through v1.42.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. No application implementation, test result, benefit, or full-document consistency is claimed.
    Version 1.43.0 converges SR-01 to credential protection in configuration and diagnostics. It replaces the prior seven fit criteria with four (configuration summary, endpoint preference, supported request-error scrubbing, and safe fallback), removes the all-output known-value scan, versioned pattern-rule system, scan counters and manifest scan fields, secret_ref/credential-store migration, stream cross-chunk detection, report-body/API-object/history scans, canonical binding/hash coupling, scan-failure hard exit, and post-commit leak protocol. It limits coverage to the FR-02 manifest config/error summary, existing report/final-state config summaries, CLI endpoint preference save/load, the listed get_scrubbed paths (net.py, Alpha Vantage common.py and its notice helper, FRED fred.py including the passthrough 400 error_message path), and warnings from these handlers. Endpoints with userinfo, query, fragment, a known credential, or an unparseable form are never saved or restored as preferences; known credentials are replaced by a fixed marker in supported request errors, with omission or a fixed safe message on handling failure. SR-01 remains an approved Must security requirement; FR-02 is its only implementation dependency and the INV-01 binding/publication coupling is removed. The requirement count remains 13, with 9 approved active requirements and 4 deferred (CR-01, FR-06, FR-07, PR-01); the global fit-criterion count recomputes from 57 to 54. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0 through v1.43.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. The baseline did not establish an actual key leak, and no implementation, incident, or universal no-leak guarantee is claimed.
    Version 1.44.0 converges SR-02 to basic confinement of controlled result paths. It replaces the prior two fit criteria with three (identifier/automatic manifest path, history-report reference, and scope/error behavior), removes the all-operation read/write/replace/move/quarantine/delete/cleanup framework, check-then-use race guarantee, hard-link/mount/all-platform guarantees, internal-link exception policy, historical-proof/cross-run evidence closure, publication/immutable-artifact transaction, recovery/quarantine/cleanup functionality, and SR-01 credential-scan dependency. It limits coverage to FR-02's <results_dir>/<run_id>/run_manifest.json path and FR-05's manifest-discovery/report-read path, using the existing ticker component check, resolved-component ownership under the configured results root, existing-symlink escape rejection, a clear distinction between absolute run_id rejection and legitimate in-root absolute report references, and preservation of user-chosen out-of-root report save behavior. SR-02 remains an approved Must security requirement; its only implementation dependencies are FR-02 and FR-05, and the INV-01 publication coupling is removed. The requirement count remains 13, with 9 approved active requirements and 4 deferred (CR-01, FR-06, FR-07, PR-01); the global fit-criterion count recomputes from 54 to 55. The baseline already had ticker-component protection and did not establish a path-escape incident. Prior approval and validation records describe v1.25.0 and are not re-issued for v1.26.0 through v1.44.0; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json, and the D2 artifacts are not updated by this revision. No implementation, platform certification, recovery guarantee, or runtime result is claimed.
