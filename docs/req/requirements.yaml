open_questions:
  - id: OQ-02
    question: "How long should run manifests and memory entries be retained after the storage location is fixed?"
    impact: "FR-02 manifest retention and INV-01 memory lifecycle; storage location itself is resolved."
    blocking: false
  - id: OQ-04
    question: "Which existing vendor caches remain cross-run, and what TTL applies to each?"
    impact: "FR-01 vendor-cache-hit accounting and vendor-cache retention policy; the run-cache definition is resolved."
    blocking: false
  - id: OQ-05
    question: "Are the PR-01-FC01/FC02 pre-replace write p95 thresholds (100 ms each), PR-01-FC03 percent overhead p95 (1%), and PR-01-FC04 absolute overhead p95 (1 second) accepted for a payload at most 256 KiB?"
    impact: "PR-01 acceptance thresholds and publisher benchmark design."
    blocking: false
  - id: OQ-08
    question: "Can concurrent runs share a manifest or preference directory without a locking policy?"
    impact: "FR-01 cache isolation and FR-02 manifest writes."
    blocking: false
  - id: OQ-09
    question: "Who is the authoritative supplier of portfolio_value, cash_balance, current_asset_quantity, current_asset_value, valuation_price, order_quantity, proposed_order_value, entry_price, stop_loss_price, currency, and valuation_time, and which broker or portfolio source is approved?"
    impact: "FR-04 input ownership, provenance, currency scope, valuation consistency, and applicability; implementation is blocked until the source and missing-input policy are approved."
    blocking: true
  - id: OQ-10
    question: "Are the provisional 30% concentration limit, 5% stop-distance limit, valuation freshness window, and precision rule approved, and what policy_ref, policy_version, and human_approval_ref should bind them?"
    impact: "FR-04 threshold comparisons, gate REVIEW rate, policy snapshot, threshold_status, and policy_digest; the values remain provisional until human approval."
    blocking: true
  - id: OQ-11
    question: "Is the timezone-aware historical valuation cutoff (end of run_clock.as_of_date in run_clock.timezone) and the point-in-time portfolio source approved for historical and backtest analyses?"
    impact: "FR-04 historical applicability, valuation freshness, and the scope of INV-02 evidence; the cutoff is defined, but the data source and backtest behavior need human confirmation."
    blocking: false
  - id: OQ-12
    question: "Should a new risk-policy behavior-evaluation set and contract version be created, and what separate REVIEW-rate and quality thresholds should apply to it?"
    impact: "FR-04, INV-02, and QR-01 behavior evaluation; the frozen v1 eval set remains unchanged, and risk-policy effects cannot be scored under the cache A/B thresholds."
    blocking: true
  - id: OQ-13
    question: "If QR-02 is reactivated, is the 2.000-second nearest-rank p95 target approved, and which local filesystems and hardware profiles are supported?"
    impact: "QR-02 future performance acceptance; QR-02 is deferred and does not block current acceptance."
    blocking: false
  - id: OQ-14
    question: "Which two non-NVDA reference companies, fiscal periods, and independently published sources should be frozen before FR-07 implementation?"
    impact: "GR-01-FC01–FC06, FR-07 Stage A implementation gate, and independent error tolerances; implementation is blocked until the reference manifest is frozen and Stage A passes."
    blocking: true
  - id: OQ-15
    question: "If TTM metrics are reactivated, is approximate TTM EPS acceptable, or should only fiscal-year P/E be reported?"
    impact: "Future FR-07 TTM EPS/P-E scope; the current version reports fiscal-year P/E only and defers TTM."
    blocking: false
  - id: OQ-16
    question: "What mandatory/compressible brief budgets, quality_loss_max, net_cost_max, prices, and evaluation-contract terms should govern FR-08/CR-01?"
    impact: "CR-01 local cost evaluation and claim classification, FR-08 brief budgets, and brief-eval-contract-v4; no cost or token saving may be claimed until thresholds are approved and measured."
    blocking: true
