requirements:
- id: FR-01
  type: functional
  title: Run-scoped reuse of identical data queries
  priority: Must
  status: deferred
  stakeholders:
  - analyst
  - trader
  - operator
  sources:
    origin: Repository analysis and measured baseline
    evidence:
    - path: TradingAgents/tradingagents/dataflows/router.py
      locator: L200 route_to_vendor
      description: Central data-tool dispatcher; no run-scoped query cache or single-flight guard is present.
      source_type: code
    - path: TradingAgents/tradingagents/agents/analysts/sentiment_analyst.py
      locator: L66 get_news.func and L69 jev_screen
      description: Sentiment prefetch invokes data functions directly, so its ticker-news query does not pass through
        an analyst tool call.
      source_type: code
    - path: TradingAgents/tradingagents/graph/setup.py
      locator: L157-L166 parallel analyst edges
      description: Analysts run concurrently, so identical logical queries can overlap in time.
      source_type: code
    - path: TradingAgents/tradingagents/dataflows/vendors/yahoo/ohlcv.py
      locator: L146-L207 load_ohlcv cache
      description: The existing OHLCV vendor cache is cross-run and must remain distinct from the new run cache.
      source_type: code
    - path: TradingAgents/tradingagents/dataflows/vendors/sec_edgar.py
      locator: L122-L132 _cached_json
      description: SEC EDGAR also has a cross-run vendor cache with its own TTL.
      source_type: code
    - path: baseline/runs/baseline-20261020-01/transcripts/tool-events-clean.jsonl
      locator: seq 21 and seq 68 get_news rows
      description: Two news-analyst tool calls use the same ticker-news arguments within one run.
      source_type: measured_baseline
    - path: baseline/runs/baseline-20261020-01/transcripts/prefetch-events.jsonl
      locator: sentiment_news row
      description: A third ticker-news attempt with the same window is made by the sentiment prefetch.
      source_type: measured_baseline
    - path: baseline/runs/baseline-20261020-01/data-availability.csv
      locator: FRED, ticker-news, and prediction-market rows
      description: The six FRED rows are distinct indicators and the two prediction-market rows are distinct topics;
        both sets failed locally without an external request.
      source_type: measured_baseline
  problem: 'In the baseline run, the sentiment-news prefetch and the news analyst requested the same ticker-news
    window for the same instrument and date range: one sentiment-prefetch attempt and two news-analyst tool calls.
    The baseline evidence establishes repeated ticker-news data-fetch work; it does not establish duplicate external
    HTTP requests, because the relevant vendors were not configured or withheld for the historical date. Existing
    vendor routing, fallback, and vendor caches reduce some network work but do not prevent the same data-fetch
    flow from being started more than once within one analysis run.

    '
  statement: 'Within one analysis run, the system MUST reuse the outcome of an identical supported data query instead
    of starting the existing data-fetch flow again. A query is identified by its supported method name together
    with the business parameters that affect the returned result. For the supported methods, positional and keyword
    arguments bind to the same business fields, a declared default is equivalent whether omitted or written explicitly,
    and keyword-argument order does not change identity. Different methods, or different effective business parameters,
    MUST NOT be merged. The initial supported scope is the get_news data-fetch flow as reached by (a) the analyst
    ticker-news tool path and (b) the sentiment-news prefetch path for the same ticker and date window. Other router
    methods, direct social-data fetchers, future preflight, new queries for the removed financial-metrics feature,
    and checkpoint-derived evidence are not covered by this revision. The first caller starts one existing data-fetch
    flow; later or concurrent callers for the same query in the same run reuse its outcome. Reuse preserves the
    existing flow''s result semantics: normal data, a no-data or unavailable representation, or a failure of the
    same type and reason. A repeated call MUST NOT silently restart the data-fetch flow. Internal vendor selection,
    fallback, retry, and vendor-cache behavior of that flow remain unchanged; this requirement adds no new retry
    policy and does not require one vendor or HTTP request per query. A consumer that mutates a mutable returned
    value MUST NOT affect the reused result or another consumer''s result. Reuse state is scoped to one analysis
    run. A different analysis run MUST NOT reuse another run''s query-reuse state. Existing cross-run vendor caches
    may still serve a run; that is not FR-01 reuse. This requirement does not prescribe storage classes, concurrency
    primitives, deadlines, cancellation protocols, cache capacity, or module layout.'
  fit_criterion:
  - id: FR-01-FC01
    input: Four independent offline scenarios in one run context, each making three sequential calls to the same
      supported get_news query. The controlled data-fetch flow respectively returns normal data, a no-data result,
      an unavailable result, and raises a controlled exception. An independent counter records how many times the
      flow is invoked.
    expected_result: In each scenario the wrapped data-fetch flow executes exactly once. The three calls receive
      equivalent results, or the same failure type and reason, according to the scenario. No later call starts a
      new execution or silently restarts the flow.
    verification: Mock the data-fetch flow and count invocations independently; compare returned content and failure
      type/reason across the three calls. The test must not trust a cache-hit or query-execution counter reported
      by the implementation under test.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-01-FC02
    input: 'Table-driven pairs of supported get_news queries: the same arguments passed positionally and by keyword;
      the same keyword arguments in a different order; a declared default omitted versus written explicitly; and
      pairs that change the method, ticker, date window, or another parameter that affects the returned result.'
    expected_result: Calls classified as the same query reuse one data-fetch execution. Calls with different effective
      business parameters execute separately and return their own results. No undeclared semantic equivalence is
      inferred, and different queries are never merged.
    verification: Table-driven test with an independent expected same/different classification, a flow-invocation
      counter, and distinct result markers per query; assert that mergeable pairs merge and non-mergeable pairs
      do not.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-01-FC03
    input: Three callers in one run request the same supported query concurrently. A barrier or event holds the
      controlled data-fetch flow open until all callers have arrived. Separate scenarios let the flow complete normally
      and let it raise a controlled exception.
    expected_result: The wrapped data-fetch flow is started exactly once. After it finishes, every caller receives
      the corresponding result or the same failure type and reason, and no caller waits indefinitely because it
      missed the completion notification.
    verification: Controlled concurrency test with an independent invocation counter and a test watchdog that fails
      on a hang. The watchdog is a test aid only; it does not add a production deadline or cancellation protocol.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-01-FC04
    input: Run A and Run B each use the same supported query parameters and each call the query twice. A mock data-fetch
      flow returns distinguishable results for the two actual executions.
    expected_result: Each run executes the data-fetch flow once, for two executions in total. Each run's second
      call reuses that run's own result and cannot read the other run's reuse state. An existing vendor-cache hit
      does not change this determination.
    verification: Integration test with two independent run contexts; assert per-run flow invocation counts, run-correlated
      results, and run-state isolation. The test does not require either run to make an HTTP request.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-01-FC05
    input: A controlled analysis run reaches the same get_news query through the real analyst ticker-news tool path
      and the sentiment-news prefetch path. A separate case returns a mutable value so one consumer can mutate its
      own copy.
    expected_result: The two real paths share one wrapped data-fetch execution, and the returned content matches
      the existing flow's result for that query. A mutation by one consumer does not pollute the reused value or
      another consumer's result.
    verification: Replace the underlying data-fetch flow with a controlled substitute, exercise the real call paths,
      and count invocations independently; compare returned content and run a mutable-result pollution negative.
      The test makes no live vendor or model call.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  tradeoff: Prioritize preventing repeated ticker-news data-fetch work in one analysis run with an explicit, minimal
    supported scope. Accept that model tool calls may still repeat, that one wrapped data-fetch flow may still make
    multiple vendor or HTTP requests through existing fallback and retry behavior, and that no token, latency, cost,
    or live-quality benefit is claimed or guaranteed. Reuse state stays run-scoped, and existing vendor behavior
    is unchanged.
  implementation_dependencies: []
  constraint_relations:
  - FR-03
  conflicts:
  - 'Reused data could become stale within a run. Resolution: query identity includes the ticker and the resolved
    date window, and reuse state ends with the run; this requirement adds no TTL or capacity policy.'
  - 'Existing vendor caches already span runs. Resolution: vendor caches are unchanged and are not FR-01 run-scoped
    reuse; run-state isolation is still required.'
  - 'A consumer could mutate a returned value shared with other callers. Resolution: reuse must preserve the existing
    result semantics and isolate consumers from mutation; the implementation mechanism is not prescribed.'
  - 'Existing vendor fallback or retry could look like repeated query execution. Resolution: one execution of the
    wrapped data-fetch flow may contain existing vendor attempts; FR-01 counts flow executions, not internal HTTP
    requests.'
  assumptions:
  - The supported scope is the get_news data-fetch flow reached by the analyst ticker-news tool path and the sentiment-news
    prefetch path; no other entry point is covered by this revision.
  - Positional and keyword arguments bind to the same business fields; a declared default is equivalent when omitted
    or explicit; keyword-argument order is not semantic.
  - Existing vendor selection, fallback, retry, and vendor caches continue to operate unchanged inside the reused
    data-fetch flow.
  - No new alias inference, fuzzy matching, arbitrary list ordering, cross-method merging, or cross-run query reuse
    is required.
  - Failure reuse means the same failure type and reason, not the same exception object or traceback bytes.
  - Concurrent callers share one flow and are released with its result or failure; caller cancellation, shared deadlines,
    and late-result state machines are out of scope.
  - Invalid parameters keep the existing interface's validation and failure behavior; no general parameter-governance
    system is added.
  notes: 'Revised in v1.26.0 to run-scoped reuse of identical data queries. FC mapping from v1.25.0: prior FC01
    (sequential reuse and normalization) maps to new FC01 and FC02; prior FC02 (concurrency, cancellation, deadline)
    maps to new FC03 without cancellation/deadline; prior FC03 (terminal-outcome table and mutation isolation) maps
    to new FC01 for failure reuse and new FC05 for result protection; prior FC04 (run isolation) maps to new FC04;
    prior FC05 (retry/fallback budget), FC06 (cache on/off business equivalence), FC07 (invalid-parameter/policy),
    and FC08 (checkpoint inheritance) are removed; prior FC09 (all-entry-point coverage) is replaced in part by
    new FC05''s two real paths. Removed capabilities are not re-expressed as hidden obligations. The current fit
    criteria count is five. At revision v1.26.0, the global FC count was 118. The prior v1.25.0 approval and validation
    records remain historical; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/validation-results.json,
    and the D2 artifacts still describe v1.25.0 and were not updated by this revision. No application implementation,
    test pass, or measured benefit is claimed.'
- id: FR-02
  type: functional
  title: Native per-analysis run manifest
  priority: Must
  status: deferred
  stakeholders:
  - reviewer
  - operator
  - analyst
  sources:
    origin: Repository analysis and measured baseline
    evidence:
    - path: TradingAgents/cli/stats_handler.py
      locator: L9 StatsCallbackHandler
      description: The callback counts LLM calls, tool calls, and token usage but does not persist them, measure
        duration, or expose prefetch/reflection counts.
      source_type: code
    - path: TradingAgents/cli/run.py
      locator: L135-L140 results directory and message_tool.log
      description: The CLI writes reports and a tool-call log but no machine-readable run manifest or lifecycle
        record.
      source_type: code
    - path: TradingAgents/tradingagents/graph/trading_graph.py
      locator: L167-L181 propagate and L372-L401 _run_graph
      description: The graph lifecycle has a start and completion path but no startup or terminal manifest writer.
      source_type: code
    - path: TradingAgents/tradingagents/graph/trading_graph.py
      locator: L255-L275 run_settings
      description: An allowlisted settings view exists and excludes keys, endpoints, and local paths.
      source_type: code
    - path: TradingAgents/tradingagents/graph/trading_graph.py
      locator: L308-L335 _memory_step
      description: Settlement and reflection run during the analysis and can make LLM calls that must be attributed
        by the counters.
      source_type: code
    - path: TradingAgents/tradingagents/memory/reflection.py
      locator: L63 invoke
      description: The Reflector uses the quick-thinking LLM, so reflection calls are observable by the same callback
        boundary.
      source_type: code
    - path: baseline/runs/baseline-20261020-01/metrics.json
      locator: inner counters and llm_usage_missing
      description: The baseline metrics were collected by an external wrapper and include llm_calls, tool_calls,
        tokens, prefetch_event_count, retry_events, and llm_usage_missing.
      source_type: measured_baseline
    - path: baseline/runs/baseline-20261020-01/run-manifest.json
      locator: all fields
      description: The baseline manifest is an external collection artifact with a different shape; it has no run_status
        lifecycle, safety_gate_result, or artifact hashes.
      source_type: measured_baseline
    - path: baseline/runs/baseline-20261020-01/logs/stderr.log
      locator: file size
      description: The baseline stderr log is empty; vendor warnings were not visible without an external logging
        wrapper.
      source_type: measured_baseline
  problem: 'The baseline already has a callback that counts model calls, tool calls, and token usage, an allowlisted
    run_settings() view, and final-state, report, and tool-log outputs. It does not have a native, unified, machine-readable
    summary saved per analysis run. The baseline metrics and run manifest were produced by an external collection
    wrapper, so they are problem evidence only and cannot be treated as an application implementation of this requirement.
    This revision adds that native run record without rebuilding report publication, recovery, concurrency transactions,
    or the memory version system.

    '
  statement: 'Each analysis started through the CLI analysis entry or a TradingAgentsGraph.propagate() call MUST
    allocate a unique, path-safe run_id and MUST attempt to create and update one JSON run manifest for that analysis
    at <results_dir>/<run_id>/run_manifest.json; successful persistence is best-effort. One analysis operation is
    one run: when the CLI internally calls propagate(), both belong to the same run and MUST NOT create a second
    manifest. Consecutive analyses of the same ticker and date receive different run_ids. No checkpoint lineage,
    parent_run_id, or recovery identity protocol is required. At analysis start the application attempts to record
    status = running; on normal completion it attempts to update the record to completed; when a caught execution
    error ends the analysis or the entry point''s required result saving, it attempts to update the record to failed.
    A business result such as REVIEW may still be completed; run status does not approve the model recommendation.
    If the running write fails and analysis continues, the terminal write is still attempted directly and does not
    require a previously persisted running state. If the terminal write fails, an existing running record may remain;
    that only means the terminal record is missing and does not prove the analysis is still running or that it failed.
    Forced termination, process crash, or an unwritable directory may leave the record missing or running; no automatic
    recovery or terminal guarantee is required. The record contains analysis identity, timezone-aware started_at
    and finished_at, monotonic duration_seconds excluding the final manifest serialization and write, the existing
    run_settings() configuration summary, llm_calls, tool_calls, input and output token totals only when complete,
    the references of result files actually produced, and an optional safe error summary. Unknown values are null;
    the record MUST NOT fabricate zero, success, or a file reference. A manifest update MUST NOT replace a valid
    existing complete JSON record with partial JSON. llm_calls counts application-level model calls started within
    this analysis, including calls that later fail. tool_calls counts tool calls started within this analysis, including
    calls that later fail. Duplicate callbacks or streaming fragments for one call do not add another count. Reflection
    model calls made within the analysis are included in llm_calls without a separate reflection counter. Direct
    data prefetch is not a tool call. Invisible provider-internal retries are not invented. No prefetch, HTTP, retry,
    or fallback counters are required. Counts cover only this analysis and do not accumulate across runs or independent
    background tasks. Token totals use one simple rule. When every counted model call has valid input and output
    usage, tokens_in and tokens_out are the exact sums and usage_complete is true. When any counted call lacks valid
    input or output usage, both totals are null and usage_complete is false. With zero model calls, both totals
    are 0 and usage_complete is true. Valid token counts are non-negative integers and booleans are not accepted.
    Missing fields are never inferred as zero and character counts are never used as estimates. No per-field coverage,
    partial contribution, or billing calculation is required. While running, statistics may be null; a statistics
    snapshot is formed on normal completion or a caught analysis error and is not called complete while calls are
    still unfinished. The manifest is auxiliary and does not decide whether analysis succeeds. Directory creation,
    the first running write, JSON serialization, and the terminal write or replace are each attempted with bounded
    basic effort. Any failure only emits a short safe warning through the existing CLI/logging mechanism. It MUST
    NOT raise a substitute manifest error, change a successful return value or CLI success status, mask or replace
    the original analysis error, re-run a model, roll back reports or memory, or return a false saving success.
    No separate diagnostic database, error return object, or warning file is required. Warnings must not contain
    raw credentials, complete configuration, or uncontrolled exception text, and a failed warning must not override
    the original result or error. This requirement supports only the CLI analysis entry and TradingAgentsGraph.propagate().
    It does not require arbitrary internal functions, future entry points, or independent background tasks to emit
    a run manifest.'
  fit_criterion:
  - id: FR-02-FC01
    input: A controlled analysis with a writable results directory, a controlled clock, known output files, and
      offline fake model/data. Read the actual manifest file during the analysis and again after it finishes.
    expected_result: After analysis start, a parseable running JSON exists at the same path with finished_at and
      duration_seconds null. After normal completion the record is updated to completed, with identity, configuration
      summary, times, and duration matching the inputs and the controlled clock. Artifact references contain only
      files actually produced. No full prompt, raw tool body, credential, or complete configuration is present.
    verification: Actual file reads, fixed field/type checks, a controlled clock, and comparison with independent
      expected data and known output files.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-02-FC02
    input: Two consecutive analyses with the same ticker, analysis date, and configuration, each using a different
      known number of model and tool calls. Read both actual manifest files after each analysis.
    expected_result: The two run_ids and manifest paths differ, and both records are retained; the second analysis
      does not overwrite the first manifest. Each record's call counts belong only to its own analysis and do not
      accumulate counts from the previous run.
    verification: Directory enumeration, actual JSON comparison, and independent call counting for each run.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-02-FC03
    input: Controlled model and tool calls covering successful and failed calls, duplicate callbacks and streaming
      fragments for one call, complete usage, a call missing input or output usage, invalid usage, and zero model
      calls.
    expected_result: llm_calls and tool_calls match the independent event record and one call is not double-counted.
      When every counted model call has complete usage, tokens_in and tokens_out are the exact sums and usage_complete
      is true. If any counted call has incomplete or invalid usage, both token totals are null and usage_complete
      is false. With zero model calls, both totals are 0 and usage_complete is true. Direct prefetch is not counted
      as a tool call, and hidden provider retries are not inferred.
    verification: Mock event records compared with independent expected counts and totals; assert the rule without
      trusting a cache or usage figure self-reported by the implementation under test.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-02-FC04
    input: 'Five injected cases: (1) an analysis execution exception with a writable manifest; (2) the first running
      write fails but a later terminal write can succeed; (3) the terminal update fails; (4) manifest JSON serialization
      fails; and (5) the analysis fails and manifest saving also fails.'
    expected_result: (1) A failed record is produced with a safe error summary and known statistics, while the original
      analysis error propagates as before. (2) Analysis continues with the normal result unchanged, and a complete
      terminal record can be written directly at the end. (3) The normal analysis still returns its normal result
      and any existing valid running record remains complete. (4) Existing valid files are not damaged and the analysis
      result is unchanged. (5) The original analysis error is not replaced by a manifest error. Every manifest failure
      attempts a safe warning, triggers no extra model call, does not roll back other results, and never returns
      a false saving success. Each visible update leaves either the complete old JSON or the complete new JSON,
      never partial JSON.
    verification: Controlled write and serialization fault injection; compare the caller return value, the original
      exception, model call count, warnings, and actual file contents. No forced-termination, power-loss durability,
      or uncertain-replace recovery protocol is added.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-02-FC05
    input: Run controlled normal and failing analyses through the real CLI analysis path and through TradingAgentsGraph.propagate().
      Where the CLI internally calls propagate(), check how many manifests exist for that one analysis.
    expected_result: When record storage is normal, both entry points produce the same manifest format without an
      external wrapper. One analysis has exactly one manifest and nested internal paths do not create another. Required
      fields are present with valid types, and configuration follows the existing run_settings() allowlist. The
      normal invocation, the CLI analysis result, and the propagate() return shape remain compatible.
    verification: Offline integration tests for both entry points plus actual file checks; do not require arbitrary
      internal functions, future entry points, or independent background tasks to emit a run manifest.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  tradeoff: Prioritize a native, low-coupling, best-effort per-analysis record that never interferes with analysis.
    Accept that the record may be missing or remain running after a crash or write failure, that token totals are
    unavailable when any counted usage is incomplete, and that the record is not a formal publication, commit condition,
    hash record, or recovery authority. Write-cost benchmarking remains PR-01; no performance, cost, or quality
    benefit is claimed.
  implementation_dependencies: []
  constraint_relations:
  - SB-01
  - SR-01
  - SR-02
  - FR-05
  - FR-06
  - FR-07
  - PR-01
  - CR-01
  conflicts:
  - 'A detailed manifest can grow into a formal publication record. Resolution: the manifest is auxiliary and records
    only identity, timing, counts, complete token totals, actual result references, and a safe error; it carries
    no coverage, gate, risk, memory, recovery state, or artifact hashes.'
  - 'A manifest write could fail the analysis. Resolution: directory creation, serialization, and every manifest
    update failure are non-blocking safe warnings; the original result, return shape, and error are preserved.'
  - 'Missing token usage can look like zero usage. Resolution: any counted call without valid input and output usage
    makes both totals null and usage_complete false; only a zero-call analysis reports true with real zeros.'
  - 'A retained running record could be mistaken for evidence that a crashed analysis is still running. Resolution:
    a running record only means the terminal record is missing; it is not a liveness, success, or failure claim.'
  - 'A CLI analysis may internally reuse propagate(). Resolution: one analysis operation produces one manifest;
    a nested internal call does not create a second record.'
  assumptions:
  - The supported entry points are the CLI analysis entry and TradingAgentsGraph.propagate(); no other internal
    function, future entry point, or independent background task is covered.
  - One CLI analysis operation or one propagate() call is one run; an internal CLI-to-propagate call belongs to
    the same run.
  - Consecutive analyses of the same ticker and date receive different run_ids; no checkpoint lineage, parent_run_id,
    or recovery identity is required.
  - The existing StatsCallbackHandler event boundary and run_settings() allowlist are the sources for call counts
    and the configuration summary.
  - Token usage validity is evaluated per counted call for input and output fields; booleans and negative values
    are invalid, and missing usage is never treated as zero.
  - Manifest writes use bounded basic attempts; no retry scheduler, background writer, or recovery system is added.
  - The manifest is auxiliary and is never a formal publication, commit condition, artifact-hash record, or recovery
    authority.
  - Result references are locators only and do not guarantee permanence, immutability, or integrity proof.
  notes: 'Revised in v1.27.0 to a native, auxiliary per-analysis run manifest. FC mapping from the prior eleven-FC
    version: prior FC01 (completed/blocked manifest and timing) maps to new FC01 for normal lifecycle/content; prior
    FC02 (failure injection and non-blocking semantics) maps to new FC04; prior FC03 (interruption/legal-state)
    is removed; prior FC04 (new run/resume/retry identity) maps partly to new FC02 for consecutive-run identity
    and isolation, with checkpoint lineage and parent_run_id removed; prior FC05 (lifecycle/discriminator/config)
    maps to new FC01 and FC05 for format and entry integration; prior FC06 (logical call/reflection/prefetch/retry
    counters) maps to new FC03 with prefetch, reflection, and retry sub-counters removed; prior FC07 (per-field
    usage coverage) is replaced by new FC03''s single completeness rule; prior FC08 (write failure and uncertain
    replace) is replaced by new FC04''s non-blocking write failures; prior FC09 (completed-state semantic negatives)
    is removed; prior FC10 (same-run resubmission and conflict) is removed; prior FC11 (100-run concurrent publication)
    is removed. Removed capabilities are not re-expressed as hidden obligations. The current fit criteria count
    is five. At revision v1.27.0, the global FC count was 112. FR-02 no longer declares an implementation dependency
    on FR-01 or FR-03. The prior v1.25.0 approval and validation records remain historical; docs/req/requirement-mapping.csv,
    docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json, docs/req/validation-results.json,
    and the D2 artifacts still describe the earlier contract and were not updated by this revision. No application
    implementation, test pass, or measured benefit is claimed.'
- id: FR-03
  type: functional
  title: Run-scoped data availability summary
  priority: Must
  status: approved
  stakeholders:
  - analyst
  - trader
  - reviewer
  sources:
    origin: Repository analysis and measured baseline
    evidence:
    - path: TradingAgents/tradingagents/agents/state.py
      locator: AgentState
      description: The graph state has report fields and debate state but no unified data-availability field.
      source_type: code
    - path: TradingAgents/tradingagents/dataflows/router.py
      locator: L200 route_to_vendor and L237-L295 fallback outcomes
      description: The router produces success, unavailable, not-configured, no-data, and fallback outcomes that
        are not accumulated into one state.
      source_type: code
    - path: TradingAgents/tradingagents/dataflows/errors.py
      locator: L1-L55 vendor error taxonomy
      description: NoMarketDataError, VendorUnavailableError, and VendorNotConfiguredError are distinct behaviors;
        empty and stale data share one error type with only a free-text detail.
      source_type: code
    - path: TradingAgents/tradingagents/dataflows/date_window.py
      locator: L67-L190 coverage_gap and withhold rules
      description: Coverage gaps, live-only withholding, and point-in-time rules are decided per call, not aggregated
        into a run state.
      source_type: code
    - path: TradingAgents/tradingagents/agents/analysts/sentiment_analyst.py
      locator: L66-L76 prefetch calls
      description: The social analyst prefetches three sources directly; failures become placeholder strings with
        no structured status.
      source_type: code
    - path: baseline/runs/baseline-20261020-01/data-availability.csv
      locator: all rows
      description: The baseline has 20 success, 4 withheld, 6 not_configured, and 4 unavailable rows collected by
        an external wrapper; it has no native run-scoped availability summary.
      source_type: measured_baseline
  problem: 'The current code has vendor error types, no-data and unavailable sentinels, historical withholding,
    fallback, and direct sentiment prefetch, but no unified run-scoped summary of data availability. The baseline
    successfully obtained prices, a market snapshot, technical indicators, three financial statements, global news,
    and Reddit content, while other baseline paths failed; all of those outcomes should be recorded, not only the
    successes. The baseline data-availability CSV was produced by an external collection wrapper, so it is problem
    evidence only and not a native availability summary.

    '
  statement: 'Within one analysis, the system MUST maintain one run-scoped data availability summary for the fixed
    supported call paths. For each completed supported query, the summary records the method or data item, the ticker
    or other actual business object, the requested dates, window, and other business parameters that affect the
    result, the call-path identity, the actual source when reliably known (otherwise unknown or null without fabrication),
    a status with a short safe reason, and a run-local observation order used to decide completion order. It MUST
    NOT store full payloads, prompts, secret values, or the complete configuration. The supported fixed scope is
    15 call-path positions covering 14 distinct methods: Market get_stock_data, get_verified_market_snapshot, and
    get_indicators; Fundamentals get_fundamentals, get_income_statement, get_balance_sheet, get_cashflow, and get_insider_transactions;
    News get_news, get_global_news, get_macro_indicators, and get_prediction_markets; and Sentiment the existing
    get_news prefetch path, fetch_stocktwits_messages, and fetch_reddit_posts. get_news is one method that appears
    in two paths, and the same business query MUST NOT be treated as different data solely because the call path
    differs. Future preflight, queries for the removed financial-metrics feature, arbitrary internal HTTP requests,
    checkpoint inheritance, and all direct vendor methods are not included automatically. Query result status is
    a closed set: available (the method''s explicit basic success condition is met and usable data was obtained),
    no_data (the query completed without data), unavailable (not configured, source unavailable, or an execution
    error, with the concrete reason distinguished), and withheld (an existing historical-visibility or similar policy
    explicitly prohibits provision). available does not claim complete financial periods, truthful content, sufficient
    news, or a correct conclusion; basic recognition uses existing types, return structures, and known sentinels,
    never model judgment or arbitrary fuzzy text guessing. not_attempted means only that a necessary item has no
    completed query result; it MUST NOT fabricate an execution record or call count. When no completed result is
    available, describe it as "no completed result available"; describe an item as "not executed" only when it is
    known not to have been invoked. An intermediate summary MUST NOT mislabel an in-flight query as never started
    or as successful, and a short "no completed result yet" reason is sufficient without adding a full task-state
    machine. The stock necessity list has seven fixed items and is the union for the enabled analysts; disabling
    an analyst removes its item from the decision. The items are: (1) Market stock price series via get_stock_data
    for the current object and requested range; (2) Market verified snapshot via get_verified_market_snapshot for
    the current object and analysis date; (3) Fundamentals income statement via get_income_statement under the existing
    interface date semantics; (4) Fundamentals balance sheet via get_balance_sheet under the same semantics; (5)
    Fundamentals cash flow via get_cashflow under the same semantics; (6) News global news via get_global_news for
    the current news-analysis range; and (7) Sentiment Reddit content via fetch_reddit_posts for the current object
    and prefetch window. StockTwits success MUST NOT substitute for the Reddit necessity item, and no OR or min:N
    aggregation is added. Technical indicators, company profile, insider transactions, ticker news, FRED, prediction
    markets, and StockTwits are supplementary data: an actual failure is disclosed as a limitation, and an unqueried
    supplementary item is not reported item by item. Global news does not represent ticker-news availability; even
    when the necessity list is complete, ticker-news unavailability is still disclosed separately. The necessity
    list adds no forced fetch: if an analyst is enabled but a necessity item was not queried, record not_attempted
    and do not add preflight or automatic refetch. Other assets may record actual query status but do not use the
    stock necessity list, do not claim basic data completeness, and report basic completeness as not_applicable
    with a note that this list supports stocks only. Basic completeness is complete when every applicable necessity
    item is available, incomplete when at least one applicable necessity item is unavailable or has no completed
    result, and not_applicable when there is no applicable necessity item or the asset is outside this version''s
    stock scope. Display MUST call it "basic data completeness" and show supplementary-data limitations separately.
    complete does not mean every supported item succeeded and does not mean the trading recommendation is approved.
    Identical queries are identified by method and the fixed handling of effective business parameters, independent
    of call path; different tickers, windows, or indicators are never merged. When a query has multiple completed
    results, the summary uses the last result completed as of that summary time. A later success replaces an earlier
    failure and a later failure replaces an earlier success; success is never selected preferentially. Order is
    the run-local order in which completed results were accepted by the summary; concurrent ties use a run-local
    increasing sequence, not wall-clock precision, and no distributed ordering is added. An FR-01 cache reuse keeps
    the original status, reason, and available source and is not a new observation; no query-execution count is
    required. Different query windows are retained separately; a necessity item matches on the same object and the
    analysis''s applicable range without complex window-coverage inference. For an enabled stock necessity item,
    bind a target from the first eligible request after existing parameter/date handling and default resolution,
    before executing the fetch; eligibility is independent of its eventual result. Stock prices bind the current
    object''s effective start/end; each of the three statements separately binds the current object''s effective
    date and frequency. Snapshot targets the current object and analysis date; lookback is not a separate necessity
    dimension, and an earlier-date query does not substitute. Global news binds the first eligible request at the
    analysis date, including its effective lookback and limit. Reddit uses the current object''s existing sentiment-prefetch
    window and community parameters. Existing interface and parameter/date rules determine eligibility; no new input
    rejection, CLI input, configuration key, forced frequency, or query is introduced. Concurrent eligible requests
    bind under the registry lock: the first to acquire it wins, regardless of fetch completion or success. Binding
    creates no completed observation or completion sequence. An invalid/rejected request does not bind. A bound
    target never changes during that analysis; an unbound item may bind when its first eligible request occurs later.
    Other targets remain separate observations and cannot substitute. Among updates matching the bound target, the
    last accepted result or query-level failure mark is used. With neither a matching completed observation nor
    a matching query-level failure mark, an applicable item remains not_attempted; say "no completed result available"
    rather than "not executed" unless non-invocation is known. Target bindings are private per-run state, not extra
    summary fields or persisted records. The research stage receives the summary as of its start and the final report
    uses the summary as of report generation; the two may differ because of real later observations. Any new observation
    or summary refresh MUST NOT trigger a new query, refetch, retry, or re-run of a completed model stage. No versioned
    view, seal, barrier or deadline, late-result protocol, or historical summary rewrite is introduced. The existing
    vendor selection, fallback, historical withholding, and exception propagation semantics are preserved. FR-03
    records the final result or failure of the existing fetch flow: a target query that succeeds through existing
    fallback may be available; global news cannot clear ticker-news unavailability; full attempts, HTTP counts,
    evidence contracts, or content digests are not required; completeness MUST NOT bypass historical restrictions;
    and the summary MUST NOT change the formal rating or swallow the original exception. The program-generated summary
    and its deterministic display are used by later stages and the final report; the model cannot rewrite structured
    records or the deterministic display part. FR-03 does not decide the formal rating, trigger extra queries, verify
    financial-metric correctness, or prove all investment evidence sufficient. FR-03 does not depend on FR-01 or
    FR-02 as an implementation prerequisite: it can record and summarize actual query results without a query cache,
    may reuse FR-01''s simple query-identity rule without requiring the cache, preserves the original status, reason,
    and source when FR-01 is enabled, is available inside the analysis without a successful FR-02 manifest write,
    does not require FR-02 to embed availability, and treats an FR-02 write warning as neither data missing nor
    an FR-03 summary change.'
  fit_criterion:
  - id: FR-03-FC01
    input: Per supported method, apply applicable fixtures for normal data, empty data, known unavailable or not-configured,
      withheld, and an execution exception.
    expected_result: Recorded status matches an independent expected table; a failure prompt or an empty result
      is not available; the object, method, range, and safe reason are correct; an unknown source is not fabricated;
      and the original return or exception semantics are unchanged. Every supported path has a mapping and test
      coverage.
    verification: A finite per-method fixture mapping table compared with independent expected statuses; no generic
      evidence-quality judge is added.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-03-FC02
    input: 'Stock analyses with different enabled analyst combinations: all seven necessity items successful; one
      item with no data or a failure; a necessity item never queried; an analyst disabled; no applicable necessity
      item; a non-stock asset; and different valid targets requested in controlled orders, including concurrent
      requests and an initial invalid request.'
    expected_result: The necessity list is generated exactly from the approved mapping and enabled state. If every
      applicable item is available the result is complete; if any is missing the result is incomplete with reasons;
      an unqueried item is not fabricated as executed; no applicable item or a non-stock asset yields not_applicable.
      No automatic refetch occurs, and no dual annual/quarter period or baseline record count is forced. The first
      eligible request binds the target before fetch under the registry lock; invalid requests do not bind. Later
      success for a different target cannot replace it. Later accepted updates for the same target can change its
      status in either direction. A bound in-flight query is not successful or described as never started. Snapshot
      requires the analysis date; global-news overrides bind only at that date; statement dates/frequencies follow
      their existing interface semantics.
    verification: Hand-authored expected necessity lists and a small truth table, not a generic all/any/min:N engine.
      Controlled request and acceptance order verifies fixed target selection, invalid-first handling, non-substitution
      and same-target replacement without live vendor availability assertions.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-03-FC03
    input: Seven necessity items succeed while ticker news, StockTwits, or FRED fails; an existing fallback for
      the same target succeeds; global news succeeds while ticker news fails; and Reddit fails while StockTwits
      succeeds.
    expected_result: Supplementary failures remain disclosed and do not change basic completeness; a same-target
      fallback that finally succeeds may be available; different data items do not substitute for one another; StockTwits
      cannot clear the Reddit necessity item; and existing fallback and withholding policy is unchanged.
    verification: Controlled fetch flows and an independent expected summary; no vendor scheduling or HTTP statistics
      are added.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-03-FC04
    input: The same query failing then succeeding, succeeding then failing, a duplicate observation with the same
      result, different windows, different queries completing concurrently, no completed result at summary time,
      and two independent runs.
    expected_result: Each summary uses only the last completed result as of that time; success is not selected preferentially;
      duplicate results do not create duplicate gaps; different queries are neither lost nor merged; runs are isolated;
      and an item with no completed result MUST NOT be treated as successful. The behavior works with or without
      the FR-01 cache, and a new observation triggers no extra data request, retry, or model re-run.
    verification: Controlled completion order compared with independent expected results, using a data-call sentinel
      to confirm the summary does not query on its own; complex cancellation, seal, and deadline behavior is not
      tested.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-03-FC05
    input: Inject controlled results through the real analyst tool adapter paths and the three sentiment prefetch
      paths; obtain the summary at research start; then add one naturally completed result and generate the report.
    expected_result: Supported paths enter the unified record; research receives the summary as of its start and
      the final report uses its generation-time summary; consumers at the same time receive identical content, and
      different-time summaries need not be permanently equal. The report deterministically shows basic completeness,
      necessity gaps, and supplementary limitations. Model output cannot override structured status or the deterministic
      availability region; validating all model natural language and the formal rating is not required. A new observation
      does not re-run research.
    verification: Offline integration through real entry adapters, downstream input capture, and actual report inspection;
      a fake model may be used and no live service is called.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  tradeoff: Prioritize a simple, fixed, run-scoped availability summary that preserves existing fetch, fallback,
    and withholding behavior and never triggers extra queries. Accept a finite seven-item analyst-gated stock necessity
    list, last-completed-result semantics, and separate disclosure of supplementary limitations. FR-03 is not a
    generic evidence-quality engine, quorum system, financial-correctness check, formal-rating authority, or cross-run
    proof.
  implementation_dependencies: []
  constraint_relations:
  - SB-01
  - FR-07
  conflicts:
  - 'A fixed list may miss ambiguous data needs. Resolution: the seven-item stock list is explicit and analyst-gated;
    other assets are not_applicable; supplementary items are limitations, not completeness criteria.'
  - 'A later observation may change the summary. Resolution: each consumer uses the last completed result as of
    its own time; the research and final-report summaries may differ; a refresh triggers no new query, refetch,
    retry, or model re-run.'
  - 'A fallback may substitute a different source. Resolution: only the existing target flow''s final result counts;
    different data items do not substitute, and global news cannot clear ticker news.'
  - 'One listed method can appear in two call paths. Resolution: get_news identity is method plus business parameters,
    independent of path; the analyst tool path and the sentiment prefetch path share one query identity.'
  - 'Reddit could be replaced by StockTwits. Resolution: no OR or min:N replacement; Reddit is the sole Sentiment
    necessity item and StockTwits is supplementary.'
  - 'A missing FR-02 manifest could look like missing data. Resolution: FR-03 works inside the analysis independently;
    an FR-02 write warning is not a data-availability failure.'
  assumptions:
  - The supported list is exactly 15 call-path positions over 14 methods; no future preflight, FR-07 query, arbitrary
    internal HTTP request, checkpoint inheritance, or other direct vendor method is auto-included.
  - The seven stock necessity items are gated by enabled analysts and evaluated as a union; disabling an analyst
    removes its item from the decision.
  - A completed query matches a necessity item only by the same object and the analysis's applicable range; complex
    window-coverage inference is out of scope.
  - Statuses are available, no_data, unavailable, and withheld; not_attempted means no completed result and is never
    a synthetic execution record or a call count.
  - When multiple completed results exist for one query, the last completed as of the summary time is used, by run-local
    acceptance order; concurrent ties use a run-local increasing sequence, not wall-clock precision.
  - FR-01 cache reuse preserves the original observation and is not a new fetch; FR-03 neither requires the cache
    nor counts query executions.
  - FR-03 declares no implementation dependency on FR-01 or FR-02 and does not require the FR-02 manifest to carry
    availability.
  - Supplementary failures are disclosed as limitations and never change basic completeness.
  notes: 'Revised in v1.28.0 to a run-scoped data availability summary. FC mapping from the prior ten-FC version:
    prior FC01 (closed record statuses and truth table) maps to new FC01; prior FC02 (executed-record identity,
    supports, Q/E/S, HTTP conservation) maps partly to new FC01 for record content and new FC04 for duplicate handling,
    with supports and HTTP ledgers removed; prior FC03 (dynamic profile defaults, overrides, and period slots) is
    replaced by new FC02''s fixed analyst-gated necessity list; prior FC04 (fallback clearing) maps to new FC03;
    prior FC05 (quorum aggregation and seal) maps to new FC02 and FC04 with quorum and seal removed; prior FC06
    (critical-gap versus limitation display) maps to new FC03 and FC05; prior FC07 (component_missing, slots, inheritance)
    maps to new FC02''s not_attempted rule, with inheritance removed; prior FC08 (order/concurrency/cache/language
    equivalence) maps to new FC04 for last-completed ordering; prior FC09 (cross-artifact, memory, and brief-view
    consistency) maps to new FC05''s deterministic report display, with memory and brief-view coupling removed;
    prior FC10 (cardinality/threshold/override negatives) is removed. Removed capabilities are not re-expressed
    as hidden obligations. The current fit criteria count is five. At revision v1.28.0, the global FC count was
    107. FR-03 no longer declares an implementation dependency on FR-01 and does not require FR-02. The prior v1.25.0
    approval and validation records remain historical; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json,
    docs/req/run-manifest-schema.json, docs/req/validation-results.json, and the D2 artifacts still describe the
    earlier contract and were not updated by this revision. No application implementation, test pass, or measured
    benefit is claimed.'
- id: FR-04
  type: functional
  title: Deterministic risk checks for a stock purchase scenario
  priority: Must
  status: approved
  stakeholders:
  - trader
  - reviewer
  - operator
  - security_reviewer
  sources:
    origin: Upstream proposal review, repository analysis, and baseline inspection
    evidence:
    - path: TradingAgents/tradingagents/portfolio.py
      locator: PortfolioContext
      description: Portfolio input is optional cash, a currency label, and positions with quantity and average price;
        quantity and average price do not provide current market value or pre-purchase total portfolio market value,
        and there is no structured purchase scenario.
      source_type: code
    - path: TradingAgents/tradingagents/agents/schemas.py
      locator: TraderProposal and PortfolioDecision
      description: The Trader proposal has optional absolute entry and stop prices plus free-text sizing; the Portfolio
        decision has a rating but no deterministic projected-concentration or stop-distance check.
      source_type: code
    - path: TradingAgents/tradingagents/agents/state.py
      locator: AgentState.portfolio_context
      description: Portfolio context is rendered as prompt text, not an authoritative validated numeric risk input.
      source_type: code
    - path: TradingAgents/tradingagents/graph/setup.py
      locator: GraphSetup.setup_graph
      description: The graph ends after the Portfolio Manager; no deterministic portfolio-risk evaluator follows
        the model decision.
      source_type: code
    - path: TradingAgents/tradingagents/agents/managers/portfolio_manager.py
      locator: portfolio_manager_node model_proposal
      description: The final rating and decision text are model-produced and are not checked against concentration
        or stop-distance limits.
      source_type: code
    - path: baseline/runs/baseline-20261020-01/results/reports/NVDA_20261020_193209/5_portfolio/decision.md
      locator: entire file
      description: The baseline formal decision contains no concentration, stop-distance, purchase-scenario input,
        threshold, or risk-result field.
      source_type: measured_baseline
    - path: baseline/runs/baseline-20261020-01/transcripts/final-status.json
      locator: final_rating and final_trade_decision
      description: The baseline persisted a Hold rating without any deterministic purchase-scenario risk check;
        this is not an observed over-limit Buy.
      source_type: measured_baseline
  problem: 'The existing pipeline can finalize a stock Buy or Overweight advisory result without a deterministic
    check of projected position concentration or stop distance. PortfolioContext is optional prompt context, candidate
    sizing is free text, entry and stop prices are optional model fields, and the model rating is the final authority.
    PortfolioContext quantity and average_price cannot supply current position market value or total portfolio market
    value, and the average purchase price must not be used as a current valuation. The baseline run produced a Hold
    rating, so no over-limit Buy was observed; this requirement is based on the code capability gap, not on a measured
    baseline violation.

    '
  statement: 'For a stock Buy or Overweight recommendation, the system determines risk from a caller-supplied structured
    purchase/add-long scenario. The scenario has: a ticker matching the analysis object under existing ticker normalization;
    portfolio_value (pre-purchase total portfolio market value, including cash) > 0; current_position_value (current
    market value of this stock) >= 0 and <= portfolio_value; proposed_buy_value (the additional amount) > 0; entry_price
    > 0; stop_loss_price satisfying 0 < stop_loss_price < entry_price; and a non-empty common currency label stating
    that the amounts and prices use that currency. Numeric values must be finite; booleans, NaN, Infinity, missing,
    or unparseable values are rejected. Ordinary decimal notation is accepted; special trailing-zero, length, or
    canonical grammar is not required. Calculations use decimal values without display rounding before comparison;
    no implementation class or module is prescribed. The scenario does not add cash, quantity, valuation_price,
    valuation_time, candidate_id, order_count, provenance, or redundant value/quantity equality checks. The caller
    supplies one valuation scenario; the system does not prove the data is live, true, or the account complete,
    and does not fill values from model text, average holding price, or the network. The structure represents one
    stock, one purchase, unlevered buying or adding only; no order type, derivative, leverage, or multiple-order
    model is added. The check covers only the amounts and prices explicitly given in the scenario; a different set
    of numbers proposed by the model is not automatically included and cannot be displayed as verified. The two
    rules are projected_weight = (current_position_value + proposed_buy_value) / portfolio_value, and stop_distance
    = (entry_price - stop_loss_price) / entry_price. The calculation assumes the buy amount is converted from portfolio
    cash and total portfolio value is unchanged; fees, slippage, volatility, and cash sufficiency are not calculated.
    The default thresholds are max_projected_weight = 0.30 and max_stop_distance = 0.05 as configurable classroom
    demonstration defaults, not approved financial policy. Every result displays the thresholds actually used. A
    legal configuration requires 0 < max_projected_weight <= 1 and 0 < max_stop_distance < 1, both finite decimal
    numbers and not booleans. An omitted configuration uses the defaults; an explicitly invalid configuration MUST
    NOT silently fall back or report a pass. No policy version, approval record, digest, or separate policy file
    is required. Both metrics at or below their thresholds pass, including equality. Exceeding either threshold
    is blocked, and when both exceed, both reasons are retained; no complex primary/secondary priority is required.
    Display rounding MUST NOT change the judgment. Applicability and failure semantics: stock + Buy/Overweight MUST
    be checked and missing input is blocked, not not_applicable; stock + Hold/Underweight/Sell is not_applicable;
    a non-stock asset with a legal rating is not_applicable and does not use the stock rules; an illegal or missing
    rating is blocked because a legal check condition cannot be determined, and is not disguised as a normal non-applicability.
    Invalid input, a mismatched object, or an invalid threshold is blocked and names the field or configuration
    category. Any exceeded metric is blocked with the specific reason. An unexpected evaluator error is error with
    a safe summary and MUST NOT pass. passed means only that the given scenario meets the two checks; it is not
    a trade authorization, a claim that the account is trustworthy, or a statement that other checks passed. blocked
    and error explicitly require manual review. FR-04 itself does not change the model rating or predefine a formal
    REVIEW or gate-publication protocol; later SB-01 convergence is separate. A failed check produces a structured
    result and MUST NOT add a hard failure to the analysis entry merely because risk input is missing; unrelated
    existing analysis exceptions keep their original behavior. The result includes at least status (passed/blocked/not_applicable/error),
    the actually parsable and display-safe scenario input, the valid thresholds actually used with the classroom-demonstration
    note, projected_weight and stop_distance (null when they cannot be computed), and a short reason list. It MUST
    NOT display dangerous raw input, credentials, or a complete traceback; invalid input does not require echoing
    the raw value, and no complex diagnostic system is added. The CLI MUST display the result, and propagate() MUST
    expose it in final_state while preserving the existing return shape. A generated report shows the result in
    a deterministic section that the model does not rewrite. No separate risk evidence file, hash, memory binding,
    or publication transaction is added, and no report rollback on a failed check is required. FR-04 is independent
    of FR-01, FR-02, and FR-03: the caller supplies the input without a cache or data fetch, the result does not
    depend on a manifest write, it does not depend on an availability-completeness decision (passed does not mean
    other data is complete), and it does not require an SB-01 implementation to return its own result.'
  fit_criterion:
  - id: FR-04-FC01
    input: 'A normal scenario; a concentration-equal-to-threshold scenario; and a stop-distance-equal-to-threshold
      scenario. Example: portfolio_value=100000, current_position_value=0, proposed_buy_value=30000, entry_price=100,
      stop_loss_price=95, with the default thresholds.'
    expected_result: projected_weight = 0.30 and stop_distance = 0.05; status = passed; values below the boundaries
      also pass. The displayed input and thresholds are accurate, and display rounding does not participate in the
      decision.
    verification: Independent decimal or fraction expected values and a pure calculation test; no model, network,
      or file storage is used.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-04-FC02
    input: Only concentration over the threshold; only stop distance over the threshold; both over the threshold;
      and an actual over-limit value that appears equal to the threshold after display rounding.
    expected_result: status = blocked with accurate reasons; when both exceed, both reasons are retained; model
      narrative and display formatting cannot turn the result into passed.
    verification: A finite table-driven boundary test with independent expected results.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-04-FC03
    input: Missing field; ticker mismatch; portfolio_value <= 0; negative current_position_value; current_position_value
      > portfolio_value; proposed_buy_value <= 0; invalid entry or stop price; missing currency; non-finite value;
      boolean value; and an invalid threshold.
    expected_result: status = blocked with a reason naming the missing or invalid category; no automatic fill from
      model text, average holding price, or network; no unhandled divide-by-zero or numeric error; an invalid explicit
      threshold does not fall back to defaults. Metrics are computed only for legal operands and are null otherwise.
    verification: Parameterized negative cases and a dependency-call sentinel; no file digest or diagnostic artifact
      is required.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-04-FC04
    input: Stock Buy/Overweight; other legal stock ratings; a legal non-stock rating; an illegal rating; an applicable
      scenario with missing input; model text claiming approval or supplying a different set of numbers; and an
      unexpected evaluator error.
    expected_result: Applicability follows the defined categories exactly. Only the structured scenario and valid
      thresholds affect the calculation; model text cannot override the result; passed is not a trade authorization;
      an evaluator error is error and cannot be passed.
    verification: An applicability table, controlled model text, and exception injection; the full SB-01 matrix
      is not introduced.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-04-FC05
    input: The CLI and propagate() provide the same scenario while a fake model returns Buy or Overweight; separate
      cases cover missing input, over-limit, and evaluator error.
    expected_result: Both entries compute consistently; the propagate() return shape is preserved; the risk result
      is available from final_state; the CLI and generated report deterministically show status, available input,
      metrics, thresholds, and reasons. blocked and error explicitly require manual review and are not overridden
      by the model; the original rating is not required to change. Missing risk input does not hard-fail the analysis
      entry.
    verification: Offline real-entry adaptation, downstream result checks, and report inspection; no broker, vendor,
      or live model is called.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  tradeoff: Prioritize a small deterministic check for one explicitly supplied stock purchase/add-long scenario.
    Accept that it validates only the given amounts, prices, and thresholds, does not verify account truth or cash,
    and does not authorize a trade. It is not a broker, portfolio-valuation, policy-approval, historical-valuation,
    FX, or formal-gate system.
  implementation_dependencies: []
  constraint_relations:
  - SB-01
  conflicts:
  - 'A risk block reduces actionable output. Resolution: report blocked or error with a manual-review reason; a
    passed result is not a trade authorization.'
  - 'A second risk authority would fragment final decisions. Resolution: FR-04 returns a structured evaluator result;
    it does not change the model rating or define a formal REVIEW or publication protocol.'
  - 'Missing input could be excused as not_applicable. Resolution: stock Buy/Overweight blocks on missing input;
    only non-stock or other legal ratings use not_applicable.'
  - 'Decimal division could look exact. Resolution: use decimal arithmetic and compare without display rounding;
    equality passes.'
  - 'A stop distance could be mistaken for a loss guarantee. Resolution: it is a price-distance ratio only; no loss-guarantee
    or maximum-loss claim.'
  - 'A model could supply different numbers or claim approval. Resolution: only the caller scenario and valid thresholds
    affect the result; model text cannot override it.'
  - 'An invalid explicit threshold could silently fall back. Resolution: invalid explicit configuration blocks and
    never falls back to defaults or passes.'
  assumptions:
  - The caller supplies one structured single-stock purchase/add-long scenario; model prose and average holding
    price are never authoritative valuation sources.
  - The minimal input is ticker, portfolio_value, current_position_value, proposed_buy_value, entry_price, stop_loss_price,
    and a common currency label.
  - The 0.30 concentration and 0.05 stop-distance values are configurable classroom demonstration defaults, not
    approved financial policy.
  - Boundary equality passes; comparisons use decimal values before any display rounding.
  - Stock Buy/Overweight is checked; Hold, Underweight, Sell, and legal non-stock ratings are not_applicable; an
    illegal or missing rating blocks.
  - passed means only that the two checks passed for the given scenario; it is not a trade authorization or a claim
    about account truth or other data.
  - FR-04 declares no implementation dependency on FR-01, FR-02, FR-03, or SB-01.
  - Missing risk input produces a structured blocked result and does not hard-fail the analysis entry.
  notes: 'Revised in v1.29.0 to deterministic risk checks for a stock purchase scenario. FC mapping from the prior
    nine-FC version: prior FC01 (exact 0.3/0.05 boundary with policy and artifact) maps to new FC01 for normal and
    boundary arithmetic with policy artifacts removed; prior FC02 (concentration breach with gate REVIEW) and prior
    FC03 (stop-distance breach with gate REVIEW) map to new FC02; prior FC04 (dual-breach priority) maps to new
    FC02 with both reasons retained but no complex priority; prior FC05 (input and policy negatives) maps to new
    FC03 with policy artifacts removed; prior FC06 (applicability and gate matrix) and prior FC07 (narrative injection
    and purity) map to new FC04; prior FC08 (100 repetitions, timezones, freshness, and artifacts) is removed; prior
    FC09 (policy snapshot, digest, and approval) is removed. Removed capabilities are not re-expressed as hidden
    obligations. The current fit criteria count is five. At revision v1.29.0, the global FC count was 103. FR-04
    declares no implementation dependency on FR-01, FR-02, FR-03, or SB-01. The prior v1.25.0 approval and validation
    records remain historical; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json,
    docs/req/validation-results.json, and the D2 artifacts still describe the earlier contract and were not updated
    by this revision. No application implementation, test pass, measured risk event, or over-limit Buy observation
    is claimed.'
- id: FR-05
  type: functional
  title: Historical analysis report lookup
  priority: Must
  status: deferred
  stakeholders:
  - analyst
  - operator
  - reviewer
  sources:
    origin: Split from pxs FR-03 and verified against the current source tree
    evidence:
    - path: TradingAgents/cli/run.py
      locator: _run_directory; save_report_section_decorator; run_analysis
      description: CLI reports are written under ticker/date directories and are not exposed through a unified history
        lookup.
      source_type: code
    - path: TradingAgents/tradingagents/graph/trading_graph.py
      locator: default_report_path; record_decision; save_reports
      description: API report saving uses a second-resolution path and is not automatically registered for historical
        retrieval.
      source_type: code
    - path: TradingAgents/tradingagents/reporting.py
      locator: _SECTIONS; _report_parts; _header; write_report_tree
      description: A fixed section map renders the merged report into existing directories; no history lookup contract
        consumes it.
      source_type: code
    - path: TradingAgents/tradingagents/dataflows/symbols.py
      locator: normalize_symbol and safe_ticker_component
      description: Existing symbol normalization and path-component guard can be reused for history filters and
        path confinement.
      source_type: code
    - path: baseline/runs/baseline-20261020-01/results/reports/NVDA_20261020_193209/
      locator: report tree
      description: Baseline report tree is keyed by ticker and timestamp and has no history index or unified lookup.
      source_type: measured_baseline
  problem: 'Current code saves section reports and complete_report.md, but there is no unified history list, no
    cross-run filter semantics, and no by-run identity read interface. Reports are discoverable only as files. The
    baseline report tree is gap evidence only; this requirement does not require migration or retroactive registration
    of old reports, and it does not rebuild report generation, formal publication, integrity proof, or an archive
    system.

    '
  statement: 'The system MUST provide a lightweight programmatic interface that lists registered historical analysis
    reports in the configured results directory, supports optional ticker and analysis-date filters, and reads the
    saved merged Markdown report by run_id. The FR-02 manifest is the only registration source. A record enters
    the history list only when a parseable, supported-format completed manifest registers a merged Markdown report
    reference. An analysis that did not successfully save a manifest, whose manifest remains running or failed,
    produced no merged report, or registered no report reference is not guaranteed to appear in history; this is
    not a claim that the analysis itself failed. History queries and reads MUST NOT call a model, data source, analysis
    graph, or renderer, and MUST NOT regenerate, repair, or modify records. This version provides only the programmatic
    interface: it adds no CLI history menu or command and does not force propagate() to save reports. It does not
    validate immutability, file hashes, section completeness, or the full artifact chain. list_runs(ticker=None,
    analysis_date=None) returns summary records. Each item contains run_id, ticker, analysis_date, started_at, and
    report_available, and MUST NOT contain the complete report body. Omitted or null filters apply no filtering.
    A non-null ticker MUST be a non-empty string, reuses existing ticker normalization, and performs no network
    identity lookup. A non-null analysis_date MUST be a legal YYYY-MM-DD date string and is never defaulted. When
    both filters are present they intersect. A valid unknown ticker or no match returns an empty list. An empty
    string, wrong type, or invalid date returns a parameter error. Results are ordered by the time represented by
    started_at descending, then by run_id string ascending for equal times. started_at MUST be a parseable, timezone-aware
    time; a candidate with a missing or invalid started_at is a bad record. No pagination, limit/offset, total_matches,
    scan budget, index, or cross-request snapshot promise is added. A legal completed manifest with a legal report
    reference is a registered record. When a registered report is missing or currently unreadable, its summary MUST
    remain in the list with report_available = false and a short warning. report_available = true means only that
    the current basic file check succeeds; it does not prove the content is correct, immutable, or readable later.
    The list operation does not read and validate every report body. Warnings accompany the query result through
    a simple warnings list or the project''s existing programmatic warning mechanism; no diagnostic-count system
    or separate file is required, and no complex interface layer is added. get_report(run_id) accepts one non-empty,
    safe run_id and never an arbitrary file path. It finds the merged Markdown report reference through the manifest
    for that run_id, reads only the specified complete_report.md, does not assemble sections, and does not re-render.
    It returns the existing UTF-8 report text and preserves its content. Invalid UTF-8 is a read error and is never
    silently repaired with replacement characters. Minimum error semantics: an illegal run_id is a parameter error;
    no corresponding manifest, or a legal record that is not completed or has no report reference, is not found;
    a manifest that is corrupt, in an unsupported format, has mismatched identity, or has an illegal reference is
    an invalid record; a registered report that is missing or unreadable is a report-read error; an unreadable results
    root is a history-read error. Error names may follow the project''s style, but the meanings MUST remain distinct
    and MUST NOT collapse different failures into an empty report or "not found". The manifest is discovered under
    the FR-02 configured results directory using its existing run_id layout; the system does not scan arbitrary
    directories for reports. A report reference resolves to the target report path under the configured results
    root; file existence and readability are assessed separately for report_available and get_report(). Existing
    ticker/date or timestamp report directories are allowed and are not forced to migrate to a run_id directory.
    A relative reference inside a directory is acceptable; an existing absolute reference is readable only when
    it still resolves inside the authorized results root after resolution. Traversal, escaping, or specifying an
    arbitrary file through run_id is forbidden. Component and actual-target checks are used, not string-prefix tests.
    This version makes no guarantee for all platforms, all local attackers, or runtime races. If an existing programmatic
    call saves a report outside the configured results root, this version does not guarantee retrieval, does not
    copy it automatically, and does not widen the root or read authorization. The read interface validates location
    and basic readability only; it does not validate sections, risk, metrics, memory, or historical proof. A historical
    run_id identifies a registered record but does not guarantee that its referenced file is permanently unchanged.
    get_report returns the content saved at the referenced path at that time: it does not prove the file still holds
    the originally generated bytes, does not detect or repair later manual edits, overwrites, or deletion, and provides
    no version recovery, tamper protection, or immutable archive. Two records existing does not prove that two report
    versions remain. This round adds no snapshot, copied archive, content-addressed storage, hash, or commit protocol.
    A single malformed, metadata-missing, unsupported-format, identity- conflicting, or out-of-root-reference manifest
    is skipped in the list with a short safe warning while other valid results continue. Damaged candidate metadata
    is never used for filtering or sorting. A single missing registered report keeps its summary with report_available
    = false. A missing results root is treated as no history and returns an empty list. A results root that exists
    but is unreadable or fails scanning returns a history-read error and MUST NOT be disguised as an empty list
    or complete result. Errors and warnings MUST NOT include raw file content, credentials, or unnecessary absolute
    paths. No corrupt/unsupported/unclassified exact counts, scan budget, or background rebuild mechanism is added.
    FR-05 retains a direct implementation dependency on FR-02 and uses the manifest''s run_id, ticker, analysis_date,
    started_at, status, and merged report reference to locate records. FR-02 manifest writing remains non-blocking:
    history lookup never blocks analysis, never forces registration or re-analysis, never infers an unregistered
    file as completed, and never requires a second history index or registry file. FR-05 does not require INV-01,
    INV-02, FR-01, FR-03, FR-04, FR-06, or their evidence files as implementation prerequisites; basic safe-read
    requirements are stated directly in this requirement.'
  fit_criterion:
  - id: FR-05-FC01
    input: A temporary results directory containing a legal completed manifest with a merged report reference; running
      and failed manifests; an unregistered report file; a completed record with no merged report reference; malformed,
      metadata-missing, or unsupported-format manifests; and a legal registered record whose report file was deleted.
    expected_result: Only legal completed records with a legal merged-report reference are discovered. Running/failed
      records, unregistered report files, and records without a report reference do not enter the list. A malformed
      manifest is skipped with a warning and does not block other valid records. A legal registration whose report
      was deleted remains listable with report_available = false. No migration of old reports is needed.
    verification: A real temporary directory compared with an independent expected set; the implementation's own
      filtering result is not used as the oracle.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-05-FC02
    input: Legal records across multiple tickers, multiple analysis dates, different started_at values, and equal
      started_at values; also normalized tickers, combined filters, no-match filters, and illegal parameters.
    expected_result: Filtering is accurate and combined filters intersect; no match returns an empty list; an illegal
      parameter returns a clear parameter error. Ordering is started_at descending, with run_id ascending as the
      tie-breaker. Omitted or null filters apply no filtering. No pagination or cross-request stable-snapshot promise
      is made.
    verification: Table-driven queries compared with independent expected ordering and membership.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-05-FC03
    input: A legal run_id whose saved report contains Chinese text, multiple lines, and Markdown; also an unknown
      run_id, a non-completed record, a record with no report reference, a deleted report, an unreadable report,
      and invalid UTF-8.
    expected_result: A valid request returns the saved UTF-8 text without rewriting or regeneration. An unknown
      or out-of-scope record is not found. A missing or unreadable report is a read error and is not returned as
      empty text posing as success. Deleting unrelated section, memory, or risk files does not affect this read.
      After a later legal edit, the current content is returned without claiming to verify the original version.
    verification: Actual files compared with an independent original text and controlled read failures; no hash
      verification is introduced.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-05-FC04
    input: An illegal run_id, directory traversal, an absolute-path input, a manifest reference outside the root,
      a legal old-layout reference inside the root, a missing results root, and an unreadable or scan-failing results
      root.
    expected_result: Only reports under the authorized results root are read. An illegal ID or reference fails clearly,
      and an out-of-root sentinel is not read. A legal in-root reference works. A missing root is an empty history;
      an existing but unreadable or scan-failing root is a history-read error. Errors contain no credentials or
      unnecessary file content.
    verification: Temporary directories, an out-of-root sentinel, and fault injection; not expanded into full cross-platform
      race testing.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-05-FC05
    input: Generate a report with the existing CLI report-saving flow and the programmatic save_reports() path,
      then register it with an FR-02-style completed manifest. Also test a propagate() result with no report and
      a manifest-save-failure scenario.
    expected_result: The registered report is discoverable and readable. A propagate() run with no report is not
      forced to save one, and a manifest save failure triggers no re-run or retroactive registration. The query
      changes no existing file and calls no model, vendor, analysis graph, renderer, report writer, or repair path.
      No CLI history menu is required.
    verification: Offline save-register-list-read integration; after saving, enable dependency sentinels and confirm
      zero query-stage side effects.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  tradeoff: Prioritize a small, read-only history lookup over FR-02 manifests and saved merged Markdown reports.
    Accept that registration depends on a successful completed manifest, that the returned content is the current
    file content rather than an immutable original, and that bad records or unreadable roots are isolated or reported
    without repair. Export, indexing, pagination, hashing, immutability, migration, and a CLI history UI are out
    of scope.
  implementation_dependencies:
  - FR-02
  constraint_relations:
  - FR-06
  - SR-02
  conflicts:
  - 'History depends on a non-blocking manifest write. Resolution: only successfully registered completed records
    appear; a missing manifest means not registered, not an analysis failure, and no re-registration or re-analysis
    is forced.'
  - 'A report file can change after saving. Resolution: get_report returns the current content at the referenced
    path and does not claim the original bytes, immutability, or tamper protection.'
  - 'Directory scans can read unrelated or out-of-root files. Resolution: only FR-02 manifests in the configured
    results root are registration candidates, and references must resolve inside that root using component and actual-target
    checks.'
  - 'A single bad record can break a list. Resolution: skip malformed candidates with a warning, keep valid results,
    and never use damaged metadata for filtering or sorting.'
  - 'A missing report can look like a missing record. Resolution: keep the registered summary with report_available=false
    and a warning; only a missing manifest or a non-completed record is not found.'
  - 'A root failure can look like no history. Resolution: a missing root returns an empty list; an existing unreadable
    or scan-failing root returns a history-read error.'
  - 'The query could regenerate or repair reports. Resolution: the interface is read-only and calls no model, data
    source, graph, renderer, or report writer.'
  - 'An unregistered file could be promoted to history. Resolution: the FR-02 manifest is the only registration
    source; unregistered files and files without merged report references are not listed.'
  assumptions:
  - The FR-02 manifest is the only registration source and remains non-blocking; history never blocks analysis or
    forces registration.
  - The configured results root and existing ticker/date or timestamp report layout are reused; no migration is
    required.
  - list_runs returns summaries only; get_report reads only the saved complete_report.md and does not assemble sections
    or re-render.
  - started_at is parseable and timezone-aware; a missing or invalid started_at marks the candidate a bad record.
  - A report reference is read only when it resolves inside the configured results root; component and actual-target
    checks replace string-prefix tests.
  - report_available reflects only a current basic file check, not content correctness, immutability, or later readability.
  - FR-05 depends directly on FR-02 only for registration; it does not require INV-01, INV-02, FR-01, FR-03, FR-04,
    or FR-06.
  - No CLI history menu, export, indexing, pagination, hashing, immutability, migration, or automatic propagate()
    report saving is added.
  notes: 'Revised in v1.30.0 to a lightweight historical analysis report lookup. FC mapping from the prior three-FC
    version: prior FC01 (committed-set listing, exact paging, diagnostics, scan budget) maps to new FC01 for discovery
    and bad-record isolation and new FC02 for filtering and ordering, with pagination, totals, and scan budget removed;
    prior FC02 (verified get with proof closure, memory, rotation, tamper) maps to new FC03 for saved-report reading
    and new FC04 for path and root errors, with INV-01/INV-02 proof closure removed; prior FC03 (section manifest,
    capability/renderer binding, byte sizes, hashes) is removed. Removed capabilities are not re-expressed as hidden
    obligations. The current fit criteria count is five. At revision v1.30.0, the global FC count was 105. FR-05
    retains only the direct FR-02 implementation dependency. The prior v1.25.0 approval and validation records remain
    historical; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json,
    docs/req/validation-results.json, and the D2 artifacts still describe the earlier contract and were not updated
    by this revision. No application implementation, test pass, or retrieval guarantee is claimed.'
- id: FR-06
  type: functional
  title: Deferred local recovery of an unfinished Markdown report save
  priority: Must
  status: deferred
  stakeholders:
  - operator
  - analyst
  - reviewer
  sources:
    origin: Split from pxs FR-03 and pxs INV-06, verified against the current source tree
    evidence:
    - path: TradingAgents/cli/run.py
      locator: _run_directory; save_report_section_decorator; run_analysis
      description: CLI writes report files directly; no local recovery path exists for an interrupted merged Markdown
        save.
      source_type: code
    - path: TradingAgents/tradingagents/graph/trading_graph.py
      locator: record_decision; save_reports
      description: Report-saving path does not provide a model-free local completion entry point.
      source_type: code
    - path: TradingAgents/tradingagents/reporting.py
      locator: write_report_tree
      description: The renderer produces the merged report; no saved-text recovery material exists.
      source_type: code
    - path: baseline/runs/baseline-20261020-01/run-manifest.json
      locator: all fields
      description: External baseline manifest; no report-save recovery event is recorded, and this is not evidence
        of a real incident or a benefit.
      source_type: measured_baseline
  problem: 'Existing code has optional LangGraph checkpointing and report-saving functions, but no dedicated mechanism
    that completes a merged Markdown report after a process restart without running the model. Checkpoint resume
    resumes analysis execution and may call the model; that is a different behavior from completing an already-produced
    report save. The baseline does not contain a real interrupted report-save event, so this requirement claims
    no observed incident or measured benefit.

    '
  statement: 'This requirement is deferred. It defines future behavior after an explicit scope decision; it is not
    part of current active acceptance, and it MUST NOT be implemented, tested as current acceptance, or claimed
    as delivered without that decision. The five fit criteria are retained as future acceptance conditions. When
    a user or program has already requested that an analysis report be saved, the system attempts to persist enough
    material to recover that file before writing complete_report.md. After a save failure or interruption, the report
    may be completed using only the saved text, without calling a model, data source, analysis graph, or recomputing
    content. Recovery is sequential and single-process. If there are no pending tasks, return normally with an empty
    recovery summary. Invalid material, a conflicting target, or a write failure retains the material and reports
    it without overwriting different content or affecting other legal tasks. Only complete_report.md is guaranteed;
    sections, HTML, the analysis graph, memory, manifest, and history registration are not recovered. Recovery failure
    does not block a new analysis. A recovery task is created only when the original flow actually requests saving
    a report; propagate() is not forced to save. The material contains at least a simple format version; an independent
    report-task identity; the original analysis run_id when available, with a manifest write failure not removing
    the task identity; ticker and analysis_date; the target complete_report.md path inside the configured results
    root; and the complete UTF-8 Markdown text already produced. It does not store the whole LangGraph state, model
    objects, raw messages, account credentials, or the complete configuration. Recovery writes the saved text directly
    and does not call the renderer or recompute risk or financial metrics. The material contains no full evidence
    closure, hashes, policy snapshot, memory plan, or version reservation. The material must be saved completely
    before it can be used for restart recovery; updates use basic atomic file writes so partial JSON is not recognized
    as a valid task, and no power-loss durability or complex commit protocol is required. In the future enabled
    flow: (1) the original flow decides to save a report; (2) it forms the complete_report.md text; (3) it attempts
    to atomically save the recovery material; (4) it atomically updates the target complete_report.md; and (5) after
    the target save succeeds it attempts to clean up the material. If the recovery-material write fails, the system
    emits a safe warning, still attempts the original report save, does not guarantee restart recovery for that
    run, and adds no hard failure to the analysis entry. The target complete_report.md is updated with a basic temporary-file
    replace; on failure it keeps the complete old file or the nonexistent state and never overwrites the target
    with partial text. Other sections and HTML follow the original flow and are not conditions for this recovery
    task''s success or failure. Once the merged Markdown is saved, it is not treated as pending even if another
    report file fails. No automatic retry, background task, forced-termination guarantee, or power-loss durability
    is required. The program interface is recover_pending_reports(results_dir). A CLI analysis session attempts
    recovery automatically before starting a new analysis; a programmatic caller invokes the interface explicitly.
    Every propagate() call is not forced to scan, arbitrary Python import never triggers recovery, and no CLI menu
    is added. The scope is one application instance and sequential recovery; multi-process recovery for the same
    root and competition with another active writer are unsupported. No ownership, lease, fencing, or takeover mechanism
    is added, and no concurrent-safe recovery is claimed. Each task gets one basic recovery attempt; no internal
    retry/backoff scheduler is added. If there are no pending tasks, return normally with an empty recovery summary.
    A single task failure is isolated while other legal tasks continue. A missing results root may return no tasks;
    a root that exists but is unreadable MUST report a recovery-read error and MUST NOT be disguised as no tasks.
    On a recovery error the CLI emits a safe warning and still allows a new analysis; the explicit programmatic
    interface returns a task summary or recovery error for the caller, and does not start or re-run analysis itself.
    Per task: if the target does not exist, atomically write the saved text; if the target''s UTF-8 content equals
    the saved text, treat it as done and do not rewrite; if the target content differs, cannot be read, or is not
    an allowed regular file, report a conflict or read error, retain the material, and do not overwrite. After success
    or equality, clean up the material. A cleanup failure is only a warning, and a task seen again follows the same
    content-equality rule. Old material is not used to repair a different partial file, a manual edit, or another
    run''s result. Ordinary atomic saves reduce the chance of a partial file but do not promise arbitrary corruption
    repair. Paths are confined to the configured results root with basic safe-component and actual-target checks;
    task material cannot specify an arbitrary read or write path. Cleanup removes only this task''s material and
    never recursively deletes other reports. FR-06 retains FR-02 as a direct implementation dependency for the existing
    run identity and run-context handoff order. This dependency is not a dependency on a successful manifest file
    write: a missing, running, or save-failed manifest does not invalidate the recovery material. FR-06 does not
    create, repair, or update a manifest, does not add recovery time to the original analysis duration, does not
    rewrite recovery success as the original analysis being completed, and does not change FR-02''s non-blocking
    semantics. FR-05 still recognizes only its own manifest registration: a successful report completion may restore
    the readability of an already registered path, but without registration or with a manifest outside the FR-05
    history scope the completed file may still not enter FR-05. No automatic history registration or history repair
    is performed. FR-01, FR-03, FR-04, INV-01, INV-02, memory, and full-publication validation are not prerequisites
    for this deferred recovery.'
  fit_criterion:
  - id: FR-06-FC01
    input: A request to save a merged report; a run that does not request saving; a recovery-material write failure;
      and a scenario where the Markdown save succeeds while another report file fails.
    expected_result: A task is created only when saving was requested, and the material is attempted before the
      target Markdown write with the fields needed to restore the original text. A successful Markdown save triggers
      a cleanup attempt regardless of HTML or section results. A material-write failure only warns and the original
      report save is still attempted. propagate() is not forced to save.
    verification: Controlled file-operation ordering and actual file contents compared with independent expected
      data.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-06-FC02
    input: Valid recovery material and a nonexistent target, with the recovery interface invoked in a new process
      or independent session.
    expected_result: The saved complete_report.md is written to match the material without relying on the original
      in-memory state. Model, vendor, analysis graph, settlement, reflection, renderer, and recomputation calls
      are all zero. The material is cleaned on success and no other report is generated.
    verification: Independent recovery invocation, original-text comparison, and dependency sentinels.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-06-FC03
    input: Target missing, target content equal, target content different, target unreadable, and a material-cleanup
      failure after a successful write.
    expected_result: A missing target is completed; equal content is not rewritten; different or unreadable content
      is not overwritten and the material is retained. A cleanup failure only warns, and a later recovery does not
      rewrite an already-equal report. No memory or transaction-idempotency protocol is involved.
    verification: Before-and-after file comparison, write counting, and fault injection.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-06-FC04
    input: Corrupt JSON material, an unsupported version, a missing field, an out-of-root target, a target write
      failure, one bad task alongside one legal task, no task, and an unreadable results root.
    expected_result: An invalid task writes no report, retains the material, and reports a safe reason; no out-of-root
      write occurs. One task failure does not block a legal task, return normally with an empty recovery summary
      when there are no pending tasks, and an unreadable root is reported clearly. Atomic update leaves no partial
      target file, and no automatic quarantine, retry query, or analysis re-run occurs.
    verification: Temporary directories, an out-of-root sentinel, controlled write failures, and actual file checks.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-06-FC05
    input: CLI startup auto-recovery, explicit programmatic recovery, a new analysis after a recovery failure, and
      a manifest-missing or unregistered scenario.
    expected_result: Both entries use the same behavior; the CLI warns and still allows analysis after a recovery
      failure, and the explicit interface lets the caller inspect the result. propagate() is not forced to auto-recover
      or save. The manifest, memory, and FR-05 registration are not modified; a report may be completed but is not
      guaranteed to enter history. The existing call style and return shape are preserved.
    verification: Offline entry integration and a sentinel that forbids writing the related manifest, memory, or
      history files.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  tradeoff: Prioritize a small, deferred, single-process recovery of only the saved complete_report.md text. Accept
    that only tasks created when a report save was requested are eligible, that a manifest may be missing, that
    there is no concurrency or power-loss guarantee, and that a target conflict is never overwritten. The feature
    is inactive in the current scope.
  implementation_dependencies:
  - FR-02
  constraint_relations:
  - FR-05
  conflicts:
  - 'Recovery could be confused with checkpoint resume. Resolution: FR-06 only completes a requested Markdown report
    save from saved text and never resumes analysis or calls a model.'
  - 'A failed save could overwrite a different target. Resolution: a missing target is written, identical content
    is a no-op, and different or unreadable content reports a conflict while retaining material.'
  - 'A manifest write failure could invalidate the task. Resolution: the task keeps its own report-task identity
    and run_id; the FR-02 dependency is only for run identity and context, not manifest success.'
  - 'A bad task could block other tasks. Resolution: isolate a single task failure, continue legal tasks, and return
    no-task normally.'
  - 'A missing root could look like no pending work. Resolution: a missing root may return no tasks; an existing
    unreadable root reports a recovery-read error.'
  - 'Recovery success could be mistaken for analysis completion or history registration. Resolution: it only completes
    complete_report.md and changes no analysis status, manifest, memory, or FR-05 registration.'
  - 'Concurrent recovery could be assumed. Resolution: only one application instance and sequential recovery are
    supported; no lease, fencing, or takeover is claimed.'
  assumptions:
  - FR-06 is deferred; its five FCs are future acceptance conditions and are not current active acceptance.
  - A task exists only when the original flow requested saving a report; propagate() is not forced to save.
  - Material is complete UTF-8 Markdown plus simple identity fields inside the configured results root; no full
    state, model object, raw message, or credential is stored.
  - Recovery is sequential, single-process, and one basic attempt per task; no retry/backoff scheduler, lease, fencing,
    or takeover is added.
  - Only complete_report.md is recovered; sections, HTML, analysis graph, memory, manifest, and history registration
    are not.
  - FR-02 remains the direct implementation dependency for run identity and context; it is not a dependency on successful
    manifest write.
  - FR-05 registration is unchanged; a completed report may restore readability of a registered path but does not
    guarantee history entry.
  notes: 'Revised in v1.31.0 and set to deferred. FC mapping from the prior six-FC version: prior FC01 (snapshot
    recovery with risk/metric/memory) maps to new FC02 for model-free saved-text completion with those branches
    removed; prior FC02 (missing/corrupt snapshot, root/guard failures, cleanup) maps to new FC04 for bad material/path/storage
    failures and new FC03 for cleanup; prior FC03 (publication status/history visibility) is removed; prior FC04
    (retry/identity/conflict/active publisher) maps partly to new FC03 for same/different content and new FC04 for
    one-bad-task isolation, with multi-worker/busy/lease removed; prior FC05 (memory first-write/partial/reuse/disabled)
    is removed; prior FC06 (CLI/API startup and snapshot-before-commit) maps to new FC01 for normal save/material
    and new FC05 for entry boundaries, with terminal commit removed. Removed capabilities are not re-expressed as
    hidden obligations. The current fit criteria count is five. At revision v1.31.0, the global FC count was 104;
    FR-06 is deferred and is not part of current active acceptance. FR-02 remains the only implementation dependency.
    The prior v1.25.0 approval and validation records remain historical; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json,
    docs/req/run-manifest-schema.json, docs/req/validation-results.json, and the D2 artifacts still describe the
    earlier contract and were not updated by this revision. No application implementation, test pass, recovery event,
    or benefit is claimed.'
- id: FR-07
  type: functional
  title: Deferred analyst briefs for downstream debate roles
  priority: Must
  status: deferred
  stakeholders:
  - operator
  - reviewer
  - trader
  - analyst
  sources:
    origin: Reviewed personal proposal (source artifact not retained), reclassified as a functional context-delivery
      policy and reviewed against current prompt assembly
    evidence:
    - path: baseline/runs/baseline-20261020-01/metrics.json
      locator: tokens_in; tokens_out; llm_calls
      description: Baseline token totals are background only; no brief benefit is measured or claimed.
      source_type: measured_baseline
    - path: baseline/runs/baseline-20261020-01/transcripts/final_state.json
      locator: analyst report fields
      description: Recorded analyst reports including gap statements and report lengths.
      source_type: measured_baseline
    - path: TradingAgents/tradingagents/agents/context.py
      locator: report_or_absent
      description: The single function through which the five downstream debate agents read analyst reports.
      source_type: code
    - path: TradingAgents/tradingagents/agents/researchers/bull_researcher.py
      locator: report_or_absent calls and prompt assembly
      description: Representative downstream consumer; the same pattern exists in bear_researcher.py and the three
        risk debaters.
      source_type: code
    - path: TradingAgents/tradingagents/agents/researchers/bear_researcher.py
      locator: report_or_absent calls and prompt assembly
      description: Downstream consumer of the same full analyst reports.
      source_type: code
  problem: 'The five downstream debate agents receive all four full analyst reports on every run, with no short,
    structured summary produced alongside each report. A separate summary model call would add cost, and a model-written
    summary can omit or misdescribe data limitations. The baseline token totals are context only; no brief benefit,
    token saving, or quality improvement has been measured.

    '
  statement: 'This requirement is deferred. It defines future behavior after an explicit scope decision; it is not
    part of current active acceptance, and it MUST NOT be implemented or claimed without that decision. The five
    fit criteria are retained as future acceptance conditions. The four analysts, in their existing report-generation
    call, also provide an independent short summary; no separate summary model call is added. The Bull Researcher,
    Bear Researcher, Aggressive Analyst, Conservative Analyst, and Neutral Analyst use each analyst''s valid short
    summary in place of the corresponding full report. All other roles keep their original full inputs, and the
    full analyst reports are never overwritten by a summary. The program appends the FR-03 data-availability summary
    directly to the inputs of those five target roles; the model summary does not re-judge that program content.
    If a summary is missing, invalid, or exceeds the configured character limit, the corresponding analyst''s full
    report is used as a fallback; if the full report is also missing, the existing missing-input placeholder is
    used. A summary problem MUST NOT block analysis or trigger an extra summary call. This requirement does not
    guarantee a whole-request token cap, semantic faithfulness, cost improvement, or no degradation in analysis
    quality. Each analyst independently provides three parts: (1) main findings and conclusion; (2) key evidence
    or values, preserving the necessary object, period, or unit when a number appears; and (3) data limitations
    and uncertainties. The summary is a brief expression of the report content and is not required to retain every
    number, source, or original limitation paragraph. It is produced in the same original analyst generation call,
    with no dedicated summary call. It does not force a uniform rewrite of every analyst''s existing output framework;
    the format implementation is left to later design. If a valid summary cannot be obtained in that original call,
    fall back directly and do not add a retry for this requirement. Existing analysis-flow calls and retries are
    allowed, but a new summary retry MUST NOT be disguised as existing behavior. All three parts must have explicit
    content; if there is no additional limitation, the summary may explicitly state that there is none rather than
    omitting the structure. The machine checks only structure, type, non-emptiness, and length and does not claim
    to verify every fact in the summary. The configured single-summary character limit is a positive integer in
    Unicode characters, explicitly the same counting semantics as Python len(text); booleans are rejected. The structured
    summary is assembled in a fixed order with labels and separators, and the delivered text is counted, including
    labels, separators, and narrative. The FR-03 program summary is not counted against this limit and MUST NOT
    be truncated. The default value is not approved: it is recorded as pending measurement, and no number such as
    1,000 is adopted as an approved default. The deferred status does not require measurement now. When the feature
    is enabled in the future, a valid explicit configuration must be provided or the default must be confirmed first;
    a missing or invalid configuration makes the summary unavailable and falls back to the full report without blocking
    analysis. Boundary tests use explicit test configuration values and do not approve a product default. Each report
    is chosen independently: a valid summary whose character count is <= the limit is used; a summary that is missing,
    blank, structurally invalid, contains a non-text field, exceeds the limit, or has an invalid configuration uses
    only the corresponding full report; if the full report is also missing, the existing missing placeholder is
    used. There is no hard truncation and no injection of both the full report and the summary for the same analyst.
    No tokenizer, token estimate, or full-request budget management is added. A character reduction MUST NOT be
    presented as a measured token or cost saving. The targets are only the Bull Researcher, Bear Researcher, Aggressive
    Analyst, Conservative Analyst, and Neutral Analyst. Only the four analyst report inputs are replaced for those
    five roles. Role instructions, the investment plan, the Trader plan, existing debate history, the saved full
    report content, memory, history lookup, recovery, and formal-rating rules are unchanged. A summary generated
    within one run is reused and is not regenerated on every debate round. If an analyst naturally produces a new
    report and summary, later calls use the current corresponding content without rewriting or re-running earlier
    calls, and no versioned view or audit system is added. Disabling an analyst keeps the existing missing handling
    and does not call that analyst merely to produce a summary. The FR-03 program-generated summary as of that time
    is used directly, including basic data-completeness status, missing necessary data, and observed supplementary-data
    limitations. This part is clearly separate from the four narrative summaries: it is not re-derived from report
    keywords, the model summary cannot override its structured state, it is not truncated by the summary character
    limit, and no automatic detection or correction of all contradictions in the narrative summaries is promised.
    The program part is identified as the data-availability basis. The FR-03 summary available when the target role
    is called is used; completed roles are not re-run. FR-02 remains a direct implementation dependency for run
    identity, existing call statistics, and later integration order. FR-03 remains a direct functional dependency
    because this requirement explicitly consumes its availability summary. A successful FR-02 manifest write is
    not a condition for running summaries; a manifest write failure MUST NOT block summary selection or analysis
    and adds no new FR-02 field, dedicated audit record, or persistence requirement. When FR-03 is unavailable,
    the system MUST NOT fabricate completeness; it uses an explicit "availability summary not provided" placeholder
    and does not add a summary model call or terminate analysis. Final full acceptance still requires real FR-03
    integration. This deferred requirement does not require the removed financial-metrics feature, SB-01, INV-01,
    or SR-01 full implementation; existing project security behavior is not removed by this change.'
  fit_criterion:
  - id: FR-07-FC01
    input: Controlled outputs from the four analyst types, each with a full report and a three-part short summary;
      also a missing field, a blank value, and a wrong type.
    expected_result: The full report and summary are separate, and a valid summary expresses findings, evidence
      or values, and limitations. No separate summary call and no summary-specific retry is added. An invalid structure
      falls back, and no machine proof of semantic faithfulness is claimed.
    verification: Fake-model outputs, field checks, and independent call counting.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-07-FC02
    input: Full text, summary, plan, and history carrying independent test markers; build prompts for the five target
      roles and for other roles.
    expected_result: A valid summary replaces the corresponding full text for each target role, with no full-plus-summary
      duplication. No additional copy of the four complete analyst reports is injected through another parameter
      to bypass the replacement; existing plans and debate history remain unchanged. Other roles retain their original
      behavior, and role instructions, plan, and history are unchanged.
    verification: Actual prompt capture and independent marker checks.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-07-FC03
    input: Summaries below, at, and above the test-configured character limit; an invalid or missing configuration;
      and different missing combinations of summary and full text.
    expected_result: The fixed rules choose summary, full text, or placeholder. A value equal to the limit is usable;
      there is no truncation, no extra call, and no analysis termination. Length is counted on the actual assembled
      text and is not presented as a token limit. Test values do not become defaults.
    verification: Table-driven boundary tests and an extra-call sentinel.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-07-FC04
    input: FR-03 reports necessary gaps and supplementary limitations; the narrative summary omits or misdescribes
      limitations; and a case where FR-03 is not provided.
    expected_result: Target roles still receive the original program summary; its structured state is not overridden,
      is not recomputed from keywords, and is not truncated. When it is not provided, an explicit placeholder is
      used and no success is fabricated. No automatic correction of all narrative text or change to the formal rating
      is required.
    verification: Downstream actual input, structured fields, and source-marker comparison.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-07-FC05
    input: A controlled analysis with a normal summary and a fallback, saved reports, and repeated downstream debate;
      also an analyst disabled and a manifest save failure.
    expected_result: Full analyst reports are not modified by summaries, and saved reports still contain full content.
      The real five-role path uses the selected input; repeated debate adds no summary call; a disabled analyst
      is not additionally generated; a manifest write failure does not affect summaries. The behavior must not depend
      on history lookup or deferred recovery.
    verification: Offline integration, before-and-after original-text comparison, prompt capture, and model-call
      counting.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  tradeoff: Prioritize a small, deferred, character-bounded summary path that falls back to full reports and never
    adds a summary call. Accept that the machine verifies only structure, type, non-emptiness, and length, that
    the character default is not approved, that no token/cost/quality benefit is claimed, and that FR-03 program
    content is never truncated. The feature is inactive in the current scope.
  implementation_dependencies:
  - FR-02
  - FR-03
  constraint_relations:
  - CR-01
  conflicts:
  - 'A fixed character limit conflicts with preserving every detail. Resolution: the summary is a brief expression,
    not a full record; missing, invalid, or over-limit summaries fall back to the full report.'
  - 'A model summary could contradict the program availability state. Resolution: the FR-03 program summary is appended
    directly, is not counted against the summary limit, and cannot be overridden by model text.'
  - 'A summary could be confused with a separate model task. Resolution: it is produced in the existing analyst
    call; no dedicated summary call or summary-specific retry is added.'
  - 'A full report and summary could both be injected. Resolution: each analyst input is selected independently;
    the two are never combined for the same role.'
  - 'A character reduction could be mistaken for a token or cost saving. Resolution: no tokenizer, token estimate,
    or request-budget management is added, and no saving is claimed.'
  - 'A missing summary or configuration could block analysis. Resolution: fall back to the full report or the existing
    placeholder; analysis continues.'
  - 'The target-role list could expand. Resolution: only the five named roles are targets; other roles keep full
    inputs.'
  - 'An FR-03 summary could be unavailable. Resolution: use an explicit unavailable placeholder, never fabricate
    completeness, and do not add a model call or terminate analysis.'
  assumptions:
  - FR-07 is deferred; its five FCs are future acceptance conditions and are not current active acceptance.
  - The character limit is not an approved default; it is pending measurement and must be explicitly configured
    or confirmed before future enablement.
  - Character counting is Unicode characters equal to Python len(text) on the assembled summary, including labels
    and separators.
  - FR-03 program summary text is appended directly, is not truncated, and is not counted against the summary limit.
  - Only the five named roles replace full reports with summaries; all other roles and all saved full reports are
    unchanged.
  - FR-02 and FR-03 are the only implementation dependencies; a successful FR-02 manifest write is not required.
  - No tokenizer, token estimate, full-request budget, cost/token benefit, or semantic-fidelity guarantee is added.
  notes: 'Revised in v1.33.0 and renamed from FR-08 to FR-07. ID lineage: the former financial-metrics FR-07 was
    deleted in v1.32.0, and the former downstream-brief FR-08 now occupies FR-07. The deleted financial FR-07 and
    the current summary FR-07 are different version meanings; current effective FR-07 references mean the summary
    requirement, while historical text may retain the financial meaning. The FR-08-to-FR-07 lineage is real. FC
    mapping from the prior four-FC version: prior FC01 (marker extraction, fallback, Unicode, tokenizer) maps to
    new FC01 for same-call summary structure, with markers and tokenizer removed; prior FC02 (token budget, reference,
    resolver, full-request cap) maps to new FC03 for character boundary and non-blocking fallback, with token budgets
    and references removed; prior FC03 (five-role replacement, audit, view version) maps to new FC02 for role replacement
    and new FC05 for integration and non-mutation, with audit and versioning removed; prior FC04 (mandatory fidelity,
    terminal rejection, CR-01 separation) maps to new FC04 for FR-03 program-limitation preservation and to new
    FC01/FC03 for structure and length fallback, with terminal rejection removed. Removed capabilities are not re-expressed
    as hidden obligations. The current fit criteria count is five. At revision v1.33.0, the global FC count was
    95. FR-07 is deferred; the requirement stays functional and its Must priority applies only if re-enabled. FR-02
    and FR-03 remain the only implementation dependencies. The prior v1.25.0 approval and validation records remain
    historical; docs/req/requirement-mapping.csv, docs/req/requirement-contracts-v1.json, docs/req/run-manifest-schema.json,
    docs/req/evaluation/brief-eval-contract-v4.json, docs/req/validation-results.json, and the D2 artifacts still
    describe the earlier contract and were not updated by this revision. No application implementation, test pass,
    token/cost saving, quality improvement, or semantic-fidelity guarantee is claimed.'
- id: FR-10
  type: functional
  title: Deterministic disclosed financial metrics
  priority: Must
  status: approved
  stakeholders:
  - analyst
  - trader
  - reviewer
  - operator
  sources:
    origin: Successor in current D1 to the personal branch's historical financial FR-07 (source haoxi @ 7e676fb00fff319930685a9fa059265f3061aeff;
      independent reference freeze fr07-sec-reference-v1 digest a1256bdef7ef8d46f71f0ef3bba7b06550d87e962f957da8b7e30e68702a2af6);
      distinct from current deferred FR-07 (analyst briefs).
    evidence:
    - path: src/tradingagents/agents/analysts/fundamentals_analyst.py
      locator: create_fundamentals_analyst and TOOLS
      description: Existing fundamentals analyst receives no pre-computed deterministic metric table before its
        first model call and relies on uncomputed tool prose.
      source_type: code
    - path: src/tradingagents/dataflows/vendors/sec_edgar.py
      locator: _statement
      description: Existing SEC EDGAR vendor formats statement snippets without computing the ten deterministic
        ratios, margins, growth rates, FCF, or FY P/E.
      source_type: code
    - path: docs/plans/financial-metrics-integration.md
      locator: FM-PREP-2 @ e99ab57b6e460fad59bb4bf4a81cffa5c717c8da
      description: Pre-approved integration preparation specification defining FR-10's ten FCs, date policy, and
        two-PR separation.
      source_type: document
  problem: Fundamentals analysis on main relies on model arithmetic over tool-returned statement text, which risks
    misreading comparative filing fy/fp labels, confusing YTD cumulative revenue with single-quarter revenue, subtracting
    annual minus YTD to invent Q4, mixing share/currency bases, using uncompleted or future prices, or silently
    guessing missing concepts. Current D1 removed the earlier financial FR-07 identifier and reassigned FR-07 to
    deferred analyst briefs, leaving no active requirement ID for deterministic financial metrics.
  statement: When FR-10 is enabled and the fundamentals analyst participates in an analysis run, the system MUST
    select disclosed structured facts for the issuer and actual fiscal position as of the analysis cutoff (00:00
    America/New_York on trade_date), compute ten fixed financial metrics using Decimal/exact arithmetic without
    binary float authority, represent uncomputable rows explicitly as n/a with typed reasons while preserving known
    inputs and periods, and inject the program-rendered table before the fundamentals analyst's first model invocation
    and on tool/wrap-up turns. Existing five financial tools, instructions, debate history, and saved original reports
    MUST remain intact. FR-10 MUST be explicitly opt-in, reuse its calculation within one analysis run without leaking
    mutable state across independent analyses, and degrade explicitly without inventing metrics or aborting otherwise
    valid baseline analysis when disabled, unsupported, or missing provider data. TTM, FCF YoY, subtraction-derived
    Q4, shared downstream briefs, and formal SB-01 veto/authority are excluded.
  fit_criterion:
  - id: FR-10-FC01
    input: Structured issuer facts with filing fy/fp, period dates, concepts, accessions, and calendar evidence
