  notes: "Machine validation passed for version 1.14.1; human review is pending. Earlier version notes use the current IDs for consistency. FR-01 v1.1.0 revised logical query execution and vendor-cache semantics. FR-02 v1.2.0 defined the run lifecycle and manifest integrity. FR-03 v1.3.0 defined the canonical availability record, effective critical profile, and deterministic aggregation. SB-01 v1.4.0 defined the trusted gate input, formal decision body, and fail-closed gate. INV-01 v1.5.0 defined artifact binding, canonicalization, provenance granularity, retry behavior, and memory lifecycle. SR-01 v1.6.0 defines known-value and versioned-pattern scanning, fixed scan scope and limitations, endpoint audit/restore rules, fail-closed failure behavior, existing-control preservation, and over-redaction controls. Version 1.7.0 renumbered requirement and acceptance IDs. Version 1.8.0 synchronized the manifest schema with INV-01, SB-01, FR-03, and SR-01. Version 1.9.0 adds gate/security scan phases, critical profile and coverage snapshot storage, evidence-to-component links, HTTP request counts, reason-specific review classes, fixed run clock, same-day rerun and memory-disabled rules, cross-field semantic checks, and empty query-set aggregation. Version 1.10.0 merged the reviewed personal proposal as draft FR-04 and INV-02, added the portfolio-risk input and result definitions, extended the closed gate reason codes and review classes, bound risk input into the gate input hash, and kept the provisional risk thresholds and human approval pending. Version 1.11.0 rewrites FR-04 and INV-02 around one applicability rule, first-entry and add-long fields, exact input consistency, timezone-aware historical cutoff, policy snapshots with provisional approval boundaries, current versus reused historical memory evidence, evaluator-error handling, and separated cache and risk-policy evaluations. Version 1.12.0 fixes the FR-04-AC1 30% boundary fixture arithmetic, separates normalized input artifacts from safe invalid-input diagnostics, defines the unique timezone-aware cutoff and future-date rejection, fixes the combined coverage-failure plus evaluator-exception result, and adds local fixture digest, metric, policy, tamper, wrong-metric, invalid-input, and future-date checks while labeling keyword checks as document coverage only. Version 1.13.0 merges pxs historical retrieval, startup recovery, and provisional recovery performance as draft FR-05, FR-06, and QR-02; merges identity, section-isolation, truthful-completion, and model-free idempotent-recovery rules into FR-02, INV-01, and the existing publication contract; reuses SR-01 for credential/path/export criteria. Version 1.14.0 merges the corrected valuable parts of yhx as draft FR-07 structured-fact financial metrics and FR-08 downstream brief, adds local financial and brief fixtures, and keeps human approval pending. Version 1.14.1 corrects fiscal-position TTM/cash-flow matching and coverage, subject/accession/filing-ref identity with same-day and restatement handling, metric persistence and model-free recovery, metric-claim-scoped conflict detection, brief budget precedence with resolvable references and context audit metadata, and unified quality/lifecycle acceptance with bound model/config/data/policy digests; human approval remains pending."

