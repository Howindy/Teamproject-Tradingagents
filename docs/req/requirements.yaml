    verification: AAPL positive and XOM missing-concept reference checks in PR 2; semantic cases FM-S01 and FM-S02.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-10-FC04
    input: Balance-sheet instant facts for current assets, current liabilities, total liabilities, and total assets,
      plus invalid/non-positive denominators.
    expected_result: Computes current_ratio and liabilities_to_assets using compatible same-date instant facts;
      invalid or non-positive denominators yield typed n/a.
    verification: Independent reference assertions and negative denominator/mismatch tests in PR 2.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-10-FC05
    input: Compatible-span operating cash flow and PP&E payment facts with explicit, negative, or unknown sign convention.
    expected_result: Computes fcf_reported_span as operating cash flow minus positive reported PP&E payments, preserving
      annual/YTD labels and valid negative FCF; unknown sign yields n/a rather than abs().
    verification: Independent reference assertions and unknown-sign negative test in PR 2.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-10-FC06
    input: Daily completed close price records and annual diluted EPS with price timestamp, currency, share basis,
      and split/cutoff metadata.
    expected_result: Computes pe_fy from eligible completed daily close divided by positive annual diluted EPS with
      explicit price date, EPS period, basis, and freshness evidence (never TTM P/E); future, uncompleted, stale,
      incompatible-basis prices, and non-positive EPS yield n/a.
    verification: Independent reference assertions and price cutoff/basis negative tests in PR 2; semantic case
      FM-S04.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-10-FC07
    input: Valid Decimal/exact financial and price inputs plus forbidden binary float/boolean injection attempts.
    expected_result: Uses Decimal/exact arithmetic with explicit units/scales and ROUND_HALF_UP display (percentages/ratios
      to 1 decimal, FCF in USD millions); values, statuses, reasons, periods, and sources are deterministic and
      JSON-projectable without binary float authority.
    verification: Unit arithmetic, rounding, and JSON projection checks in PR 2.
    zero_tolerance: true
    measurement_status: not_measured
    threshold_status: not_applicable
  - id: FR-10-FC08
    input: Complete, partial, and all-missing structured metric bundles.
    expected_result: Emits the ten stable rows in fixed order; every unavailable row carries a reason and retains
      known inputs and periods; never zero-fills, invents a source, or marks unverified text as verified.
    verification: Bundle structure, row ordering, and n/a retention tests in PR 2.
    zero_tolerance: true
