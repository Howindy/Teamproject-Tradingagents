scope:
  approved_ids:
    - FR-01
    - FR-02
    - FR-03
    - FR-04
    - FR-05
    - SB-01
    - INV-01
    - SR-01
    - SR-02
  draft_ids: []
  deferred_ids:
    - FR-06
    - FR-07
    - PR-01
    - CR-01
  in_scope:
    - "Run-scoped reuse of identical supported data queries within one analysis run: the method name plus normalized business parameters identify a query; an identical query starts one existing data-fetch flow and later or concurrent callers reuse its result or its failure; reuse state is isolated per run; existing vendor selection, fallback, retry, and vendor-cache behavior is unchanged; the current supported scope is the get_news flow reached by the analyst ticker-news tool path and the sentiment-news prefetch path."
    - "A native, auxiliary per-analysis JSON run manifest for the CLI analysis entry and TradingAgentsGraph.propagate(), with a unique run_id, running/completed/failed lifecycle, identity, timezone-aware start/end timing and monotonic duration excluding the final write, run_settings() allowlisted configuration, LLM and tool call counts, input/output token totals only when usage is complete for every counted call, references to result files actually produced, and a safe error summary; manifest creation or update failure is a non-blocking warning and never changes the analysis result."
    - "A run-scoped data-availability summary for the fixed 15 supported call-path positions over 14 methods: each completed query records available/no_data/unavailable/withheld with a short safe reason; a fixed seven-item stock necessity list is generated from the enabled analysts and reports not_attempted for unqueried items; supplementary failures remain visible limitations; each consumer uses the last completed result as of its own time, and the report deterministically displays basic data completeness and limitations."
    - "A deterministic final-rating check over the current analysis's program-produced FR-03 availability summary, applicable FR-04 risk result, and model rating: legal ratings with no blocking data or risk condition keep the model conclusion; missing data, failed or unconfirmed applicable risk, invalid input, model REVIEW, or a check exception produce REVIEW with a program-generated manual-review notice while the original model proposal is retained separately and is not a trade authorization."
    - "Consistent delivery and persistence of the SB-01 post-check final result across actually produced outputs: propagate() final_state and signal, CLI final summary, generated report final-decision area, saved final-state JSON, and any newly created memory decision record; format may differ, the manifest is not a rating authority, and no atomic multi-file commit, immutability, retention, or recovery guarantee is added."
    - "Credential protection in the explicitly supported configuration and diagnostic paths: FR-02 manifest and existing report/final-state configuration summaries reuse the existing allowlist and omit known credential values; CLI endpoint preferences never save or restore userinfo, query, fragment, known-value, or unparseable endpoints; and the listed get_scrubbed request-error paths replace known credentials with a fixed marker, with safe fallback when handling fails."
    - "A caller-supplied single-stock purchase/add-long scenario risk check for stock Buy or Overweight recommendations: deterministic projected-concentration and stop-distance calculation against configurable classroom thresholds, structured caller input, explicit passed/blocked/not_applicable/error outcomes with visible manual-review reasons, and results exposed to the caller and a deterministic report section without model override."
    - "Minimal programmatic historical analysis report lookup: list registered completed runs from FR-02 manifests with ticker/analysis_date intersection filters and started_at ordering, and read the saved merged Markdown report by run_id; invalid or unreadable records are isolated with warnings, only files under the configured results root are read, and no CLI menu, export, indexing, hash or immutability validation, or report regeneration is added."
    - "Deferred: single-process, local recovery of an unfinished merged Markdown report save from complete saved text, only when the original flow requested saving; no model/data/graph/renderer call, no manifest or history repair, no section/HTML recovery, and no concurrent-safe recovery claim; not part of current active acceptance."
    - "Deferred: four analyst-generated three-part short summaries consumed by only the Bull Researcher, Bear Researcher, Aggressive Analyst, Conservative Analyst, and Neutral Analyst in place of the corresponding full reports, with a configurable Unicode-character limit, full-report fallback, direct inclusion of the FR-03 program availability summary, no separate summary call, and no token/cost/quality benefit claim; not part of current active acceptance."
    - "Deferred: separate 20-sample measurements of complete manifest creation and update operation durations under a fixed local environment, reporting nearest-rank p95 and retaining failures, with thresholds to be determined and approved after measurement; not part of current active acceptance."
    - "Deferred: a fixed three-scenario OFF/ON comparison of whole-analysis model token usage and estimated cost with analyst briefs, including brief generation, downstream effects, real retries/fallbacks, and failed calls, with prices and cost targets undetermined until after measurement; not part of current active acceptance."
    - "Basic confinement of controlled result paths for FR-02's automatic manifest path and FR-05's history-report read path: run_id must be one safe path component; ownership uses resolved components under the configured results root, not string prefixes; existing symlink escapes are rejected; an in-root absolute report reference is allowed while an out-of-root one is rejected; user-chosen out-of-root report saves follow existing behavior and do not automatically enter history."
  out_of_scope:
    - "Replacing StockTwits with another social vendor; the 403 root cause is not yet established."
    - "A point-in-time company profile sourced from SEC filings; the current filing fields are not proven to be historical vintages."
    - "Parallel Bull/Bear or risk-analyst execution; it changes debate semantics and requires a separate A/B evaluation."
    - "A full exchange calendar; the D1 scope does not include a new calendar dependency."
    - "Multi-user authentication, encryption at rest, and access control."
    - "Portfolio simulation, order execution, position accounting, slippage, fees, and any guarantee of maximum realized loss."
    - "Short, derivative, leveraged, multiple-order, and non-stock portfolio-risk policies in the first version; FX conversion between currencies."
    - "Enabling TypeSafe Jev screening by default."
    - "A production LLM response cache; replay caching remains outside D1."
    - "Graph resume redesign, a separate archive transaction, a standalone commit marker, legacy report migration, full-text indexing, automatic retention cleanup, multi-host/cloud storage, and power-loss guarantees."
    - "Direct vendor bypass for derived metrics, deriving a single quarter by subtraction, free-form model arithmetic as the numeric authority, non-SEC fundamentals vendors, and a second context assembler for the downstream brief."
  assumptions:
    - "The system remains a single-user local tool for D1."
    - "The effective critical set is generated from documented defaults for asset type, analysis mode, and enabled capabilities, then adjusted only by explicit recorded overrides; it is not left to implementation discretion."
    - "REVIEW is an acceptable terminal state for a run with critical data gaps or a blocked gate; it is a non-tradeable sentinel, not a sixth five-tier rating."
    - "The per-run cache is isolated between concurrent runs; existing vendor caches remain cross-run and are recorded as vendor-cache hits."
    - "A running manifest is written before model calls and atomically finalized after analysis; terminal writing does not block model calls."
    - "The purchase-scenario risk check is a pure deterministic service; it does not create a second final decision authority, change the model rating, or predefine a formal REVIEW or publication protocol."
    - "The caller supplies one structured single-stock purchase/add-long scenario with ticker, portfolio_value, current_position_value, proposed_buy_value, entry_price, stop_loss_price, and a common currency label; model prose, rendered portfolio text, and average holding price are never authoritative valuation sources."
    - "FR-04 thresholds are simple configurable values; an omitted configuration uses classroom demonstration defaults, an explicit invalid configuration blocks, and no policy version, approval record, digest, or separate policy file is required."
    - "Historical valuation, freshness, and point-in-time account checks are outside FR-04."
    - "The 0.30 concentration and 0.05 stop-distance defaults are configurable classroom demonstration values, not approved financial policy."
    - "A passed risk check is not a guarantee of maximum loss or investment outcome; stop distance is a price-distance ratio only."
    - "Stock Buy or Overweight requires the purchase-scenario check and missing input blocks; Hold, Underweight, Sell, and legal non-stock ratings are not_applicable; an illegal or missing rating blocks."
    - "The team run_id is the publication identity; UUIDv4 is not required."
    - "Terminal manifest completed plus read-time INV-01 is the only formal-publication commit condition; no independent commit marker is authoritative."
    - "Recovery continues the existing formal publication process, is not graph resume, and uses only saved verified redacted formal records and fixed render inputs."
    - "Historical visibility is limited to verified committed publications; analysis completion alone is not publication success."
    - "Derived metrics use structured SEC filing facts through the existing unified data access and FR-01 counters; GR-01 freezes an independent non-NVDA reference set before implementation."
    - "The downstream brief is a view for the five debate roles only; mandatory canonical gaps, metric blocks, sources, and safety constraints are never truncated; token/cost improvement is evaluated separately in CR-01."
    - "The repository analysis and the baseline artifacts are the authoritative source for this document."

    - 'FR-01 applies a run-scoped reuse mechanism only to the explicitly listed supported get_news paths. It does not introduce a versioned normalization contract, execution policy, retry/fallback budget, cancellation or deadline protocol, cache capacity policy, or checkpoint inheritance; existing vendor selection, fallback, retry, and vendor caches operate unchanged.'
    - 'FR-02 run manifests are auxiliary and best-effort: started_at is sampled at analysis start and finished_at plus monotonic duration_seconds are sampled after the analysis and the entry point''s existing result saving finish or when a caught execution error is recorded. The final manifest serialization and write are excluded from that duration, and a manifest write failure is only a safe warning that does not affect analysis, model calls, return values, or the original error.'
    - 'FR-03 uses the fixed 15-path support list and a fixed seven-item analyst-gated stock necessity list, not a dynamic critical profile or quorum. It uses the last completed result as of each consumer''s summary time and never triggers a new query, refetch, retry, or model re-run when an observation is added or a summary is refreshed.'
    - 'FR-04 uses a caller-supplied structured single-stock purchase/add-long scenario with ordinary finite decimal numbers and optional configurable thresholds; 0.30/0.05 are classroom demonstration defaults, not approved financial policy. Broker integration, cash-sufficiency checks, historical valuation, currency conversion, and policy approval management are out of scope.'
    - 'FR-05 provides only a minimal programmatic list/get interface over FR-02 manifests and saved merged Markdown reports; it adds no CLI history menu, export, indexing, Web UI, hash or immutability validation, report regeneration, or automatic report saving for propagate().'
    - 'FR-06 is deferred. If re-enabled by an explicit scope decision, its recovery is sequential and single-process, completes only complete_report.md from saved text without a model/data/graph call, never overwrites different content, and does not change FR-02 manifest semantics, memory, analysis status, or FR-05 registration.'
    - 'FR-07 (formerly FR-08) is deferred. If re-enabled, it uses an explicitly configured positive Unicode-character limit whose default is pending measurement; a missing or invalid configuration falls back to the full report. It adds no tokenizer, token budget, or cost/token benefit claim, and it appends the FR-03 program availability summary without truncation.'
    - 'Deferred items are not part of current acceptance: FR-05 export packages, FR-06 multi-worker claim/fencing/takeover, and the QR-02 performance target.'
stakeholders:
  - id: analyst
    name: "Research analyst"
    interest: "Needs reports that distinguish retrieved evidence from missing or fallback evidence."
  - id: trader
    name: "Trader"
    interest: "Needs a final decision that is safe when critical data is absent."
  - id: reviewer
    name: "Reviewer"
    interest: "Needs reproducible records that connect a decision to its sources and configuration."
  - id: operator
    name: "Operator"
    interest: "Needs bounded duplicate requests, clear run records, and no credential leakage."
  - id: security_reviewer
    name: "Security reviewer"
    interest: "Needs deterministic output checks and safe handling of external text and secrets."

definitions:
  data_query_key: >
    The stable, normalized identity of a logical data query. The key MUST include
    method, asset_type, canonical instrument or topic, analysis_date, resolved
    window/lookback including timezone and boundary semantics, every
    method-specific parameter that can change the returned result (for example
    adjusted/raw, frequency, limit, fields, or language), the vendor-selector
    configuration digest, and cache_key_version. Explicit defaults and omitted
    defaults are equivalent only after parsing to the same semantic value.
    Object key order never changes identity; list order is normalized only when
    the method contract declares it non-semantic. Security aliases may share a
    key only within one canonical market. Unknown or invalid parameters are
    rejected before any vendor call; they are never silently dropped. Retries,
    fallback attempts, call site, timing, and the actually serving fallback
    vendor do not change the key. Raw secrets never enter a persisted key; if
    credential identity matters, use a non-secret configured identity digest.
    Each method family has a versioned normalization contract with positive and
    negative examples.
  logical_query: >
    The normalized query identity defined by data_query_key. Two callers with
    the same key are the same logical query within one run, regardless of which
    analyst, tool, prefetch, preflight, or financial-fact path issued them.
  query_execution: >
    One run-scoped shared execution atomically registered for a valid
    data_query_key. It owns the bounded vendor attempt chain and commits at most
    one terminal outcome. The first caller triggers the execution but has no
    privilege to cancel other callers. A single caller's cancellation or wait
    timeout ends only that caller's wait; it does not change the shared
    execution, other waiters, or the run cache. An execution-level deadline,
    execution cancellation, or run cancellation terminates the shared execution
    and releases all remaining waiters with the same canonical terminal outcome.
    A late result after the deadline cannot replace the terminal outcome or
    start a new retry/fallback. Internal absent/in_flight/terminal state is an
    execution detail, not a FR-03 record status and not a new public enum.
  vendor_cache: >
    A pre-existing cross-run cache inside a vendor adapter, such as the Yahoo
    OHLCV cache or the SEC EDGAR JSON cache. A vendor-cache hit is recorded on a
    query_execution and is distinct from run-cache reuse.
  availability_record: >
    The minimal executed-query availability unit: one run-scoped query_execution
    identified by (run_id, data_query_key) with record_kind = executed. It
    records tool, category, capability, component, supports links, requested and
    observed window, status, reason_code, record_count, ordered attempt results
    with http_request_count, tried and serving sources, fallback state, cache
    kind, inherited flag, and provenance. Exactly one executed record exists per
    data_query_key per run. Each supports link has its own contract evaluation
    (contract_id/version, satisfied/insufficient/unavailable, eligible evidence
    IDs and count); the same execution may satisfy different components
    differently without duplicating the execution record. Record-level success
    means the query result satisfied its own contract, not that every linked
    component contract is satisfied.
  component_missing_record: >
    A synthetic record for a critical component that has no query_execution. Its
    identity is (run_id, requirement_id, capability, component) and record_kind =
    component_missing. It has data_query_key = null, attempts = [], status =
    not_attempted, and source = none. Exactly one component_missing_record
    exists per missing critical component. It participates in coverage, gaps, and
    summaries but is excluded from query_executions, external_requests,
    retry_attempts, fallback_attempts, vendor_cache_hits, and run_cache_hits.
  source: >
    The stable logical provider identity from the vendor registry, such as Yahoo
    Finance, SEC EDGAR, FRED, Polymarket, StockTwits, or Reddit. It is not the
    tool name, category, URL, or endpoint. A record keeps attempted_sources in
    order and a nullable serving_source; serving_source is set only when that
    provider returned usable evidence.
  critical_requirement: >
    One entry in the effective critical profile: requirement_id, capability,
    required components, per-component query rule (all, any, or min:N), required
    period slots, minimum record count per component or slot, window and
    point-in-time rules, fallback policy, criticality, and
    min_successful_components. The profile is derived from asset type, analysis
    mode, enabled capabilities, and explicit overrides, then recorded for the
    run. Query quorum is fixed from the declared plan slots, not from the
    post-execution supports set. A category is a display grouping derived from
    the same projection; it is not a second coverage authority.
  record_status: >
    Closed set: success, insufficient_evidence, no_data, unavailable, withheld,
    not_configured, not_attempted, error. success requires the query's own
    evidence contract, not merely a completed call. insufficient_evidence covers
    too few records, partial or stale windows, undated data barred by the
    point-in-time rule, or a period slot with no qualifying evidence. A
    component may be degraded when it has a usable but insufficient evidence
    item; insufficient_evidence is not a requirement or component aggregate
    status.
  requirement_status: >
    Closed aggregate set: satisfied, degraded, missing, not_required. For a
    non-empty query plan, a component is satisfied when its qualifying slot
    count meets its all/any/min:N threshold, degraded when it has at least one
    satisfying or usable-but-insufficient slot but does not meet the threshold,
    and missing otherwise. A requirement uses only its declared quorum
    components: satisfied when the successful-component count meets
    min_successful_components; degraded when not satisfied but at least one
    participating component is satisfied or degraded; missing when every
    participating component is missing. Optional context components never enter
    the quorum. not_required means no effective evaluation obligation; observed
    failures of non-critical capabilities remain visible as limitations.
    insufficient_evidence is never a requirement status.
  critical_gap: >
    A structured record for a critical requirement with requirement_status
    degraded or missing: requirement_id, capability, requirement_status,
    gap_reason from the closed set, missing_components, and provenance.
    critical_gap_ids is the separate ordered list of those requirement IDs.
    A gap is generated only from an unmet obligation. Primary reason priority is
    not_attempted > not_configured > error > unavailable > no_data > withheld >
    insufficient_evidence > fallback_partial; this is display priority and does
    not change the aggregate status. fallback_partial is an auxiliary reason only
    when a fallback occurred and the target contract still failed. Attempt
    history is retained; a resolved fallback removes the current gap but not the
    historical attempt.
  coverage_status: >
    Closed set: complete or partial. complete means every critical requirement
    has requirement_status satisfied. partial means at least one critical
    requirement is degraded or missing. An invalid profile, an empty critical set
    used to manufacture completeness, or a missing mandatory profile component
    cannot produce complete. Non-critical limitations do not change coverage.
  critical_profile: >
    The effective critical profile computed once at run start from asset type,
    analysis mode, enabled capabilities, and recorded overrides. It contains
    profile_version, profile_source, contract_version, analysis_mode, asset_type,
    the ordered critical requirements, the fetch-owner rule for each requirement,
    the allowed/default/override rule for each capability, and profile_hash. Each
    requirement lists requirement_id, capability, query_rule,
    min_successful_components, required period slots, min_record_count,
    fallback_policy, criticality, and per-component contracts: component,
    window_rule, period slots, point_in_time_rule, evidence_contract_id/version,
    and required. The profile is stored in the manifest and referenced by the
    coverage_snapshot. It is not model-mutable.
  inheritance_record: >
    Resume/inheritance fields in the manifest: inherited, origin_run_id,
    origin_attempt_id, inherited_counters (separate from current execution
    counters), inherited_evidence_digest, and snapshot_rebound_from. Inheritance
    is allowed only for verified checkpoint evidence from the same logical run
    lineage. It validates lineage, query identity, window/as-of, canonical
    version, policy compatibility, and content digest. An inherited item is not a
    current query_execution and uses inherited counters. Invalid inheritance is
    rejected before use with a safe reason and then follows one fixed policy:
    reject-and-terminate or one fresh current-run query when remaining budget and
    run conditions allow; it is never silently treated as inherited success. In-
    memory locks, futures, and in-flight executions are not inheritable; no new
    resume capability is introduced.
  run_clock: >
    The fixed run clock: as_of_date, now_utc, timezone, clock_source, derived
    analysis_mode, and mode_source. The mode is computed once at run start from
    this clock, never from a later call to today. as_of_date MUST NOT be after
    the current date in run_clock.timezone; a future analysis date is rejected
    before risk evaluation and before formal analysis with a
    future_analysis_date startup failure, and MUST NOT be silently clipped to
    the current date. Resume/replay inherits the original clock unless a
    clock_override is recorded.
  valuation_cutoff: >
    The unique timezone-aware valuation cutoff:
    min(run_clock.now_utc, end_of_day(run_clock.as_of_date, run_clock.timezone)),
    where end_of_day is 23:59:59.999999 on as_of_date with that timezone offset.
    A future as_of_date is rejected before this calculation; it is never
    clipped. valuation_time MUST be at or before this cutoff and within
    max_valuation_age_seconds before it.
  run_id: >
    The team's canonical identity for one run invocation. It is unique per
    invocation, safe as a path component, preserved across publication retries
    and startup recovery, and does not require UUIDv4. A resume is a new
    invocation with a new run_id and parent_run_id; a publication retry or
    recovery preserves the original run_id.
  formal_publication: >
    The lifecycle of one formal publication: pending_snapshot, snapshot_ready,
    publishing, committed, failed, or quarantined. committed is exactly the
    terminal manifest run_status = completed plus successful read-time INV-01
    validation. A completed terminal manifest and its committed formal bytes are
    never overwritten. A pre-commit publication failed record is not a commit and
    may be continued to completed under FR-06 conditions with its failure audit
    retained; analysis, gate-system, security, identity-conflict, and invalid-
    snapshot failures are not auto-promoted. No independent commit marker is authoritative. analysis_complete
    means only that the graph finished producing a proposal; history_visible
    means the committed publication was revalidated by retrieval. After commit,
    the permanent publication_snapshot remains authoritative and readable;
    temporary pending recovery material may be cleaned without changing history
    visibility.
  publication_snapshot: >
    The permanent formal record set for one committed publication: formal
    decision, artifact_binding, terminal-manifest identity, report_section_manifest,
    complete report, final-state, risk evidence and policy references, the
    required memory entry or binding, metric_evidence_bundle when FR-07 applies,
    schema/renderer versions, and artifact hashes. It is retained after commit and is the source for history retrieval
    and every formal reference. It is distinct from the temporary recovery
    envelope; all formal references MUST resolve against this permanent snapshot
    after pending recovery material is cleaned.
  recovery_snapshot: >
    A complete, durably written, read-back-verified, redacted set of formal
    records and fixed rendering inputs for one run_id. Recovery guarantee begins
    only at snapshot_ready. It MUST include the formal decision and
    artifact_binding, terminal-manifest candidate identity, report_section_manifest
    and fixed rendering inputs, the original risk input/policy/diagnostic state
    with its actual nullability, the persisted authoritative metric bundle, the original required memory decision identity and reserved entry
    version, and the required schema/renderer versions. References MUST resolve
    inside the snapshot and have validated digests; recovery MUST NOT depend on
    a separately lost external file. A missing, corrupt, or unsupported snapshot
    is quarantined and is not published as success. Recovery uses no model,
    external data, analysis graph, settlement, or reflection. The
    recovery_snapshot is a temporary pending-recovery envelope; after commit the
    permanent publication_snapshot is authoritative and remains readable. The
    temporary envelope may be cleaned without affecting history or formal
    references.
  recovery_claim: >-
    An atomic per-run_id claim or lease used by startup recovery, carrying an owner identity and a fencing token. One worker is active per run_id; duplicate startup or duplicate claim does not create a second publication; a stale claim can be reclaimed after its lease expires, and takeover increments the fencing token. Every publication or memory write MUST check current claim ownership and fencing token at commit; a worker that lost its lease or was superseded MUST be rejected without writing. Task failure is isolated; retries are bounded; at most one successful formal publication exists per run_id and decision identity.
     DEFERRED in D1 v1.17.0: multi-worker claim/fencing/takeover is not part of active FR-06; D1 uses a single-process duplicate-start guard.
  report_section_manifest: >
    The ordered list of report sections generated for one committed publication
    from a versioned renderer and the current-run capability set. Each section
    records path, agent or state fields, byte size, and SHA-256; the complete
    report records its path and digest. Only applicable non-empty sections are
    listed. Foreign, stale, or old-run files are forbidden. Retrieval revalidates
    the manifest and section digests on read, and the formal report uses the
    gated formal decision with process suggestions marked unapproved.
  history_query: >
    A historical formal-publication query with optional ticker and
    analysis_date filters. Ticker is trimmed and canonically normalized with the
    same canonical instrument identity used by data access; ticker filtering
    returns every record sharing that canonical ticker and never silently picks
    one asset/market. analysis_date is strict YYYY-MM-DD and is never defaulted;
    both filters use intersection semantics. Omitted and explicit null filters
    are equivalent; a non-string or empty-string ticker is INVALID_FILTER.
    Order is analysis_date descending, canonical ticker ascending, run_id
    ascending. limit is omitted or 50 by default; it must be an integer (not boolean) from 1
    to 500; 0, negative, null, non-integer, boolean, or over-500 limit returns
    INVALID_FILTER. offset is omitted or 0 by default; it must be an integer
    (not boolean) >= 0; 0 is legal; negative, null, non-integer, or boolean
    offset returns INVALID_FILTER. The two parameter domains are separate.
    The minimal program interface is list_publications(ticker, analysis_date,
    limit, offset) -> HistoryPage and get_run(run_id) -> VerifiedRun or a typed
    error. total_matches counts only valid committed matches in the verified set;
    truncated means a later valid page exists; next_offset is offset + returned
    when truncated, otherwise null. Corrupt, unsupported, or unclassifiable
    candidates are reported in fixed safe diagnostics and are not counted as
    valid matches. Exact totals require sufficient candidate verification; the
    500 limit is a page limit, not a scan-cost limit. When the versioned scan
    budget/timeout cannot complete, return HISTORY_READ_FAILED with
    SCAN_BUDGET_EXCEEDED rather than a false total or an empty success. An
    optional derived index may find candidates but is rebuildable,
    non-authoritative, and every read revalidates. Paging is not a cross-request
    transaction snapshot.
  history_reference_closure: >-
    The transitive proof required when a verified_package follows a reused_decision_ref. It MUST include source_run_id, source_decision_id, source_entry_digest, the source terminal manifest hash, source publication proof (terminal manifest completed plus read-time INV-01 evidence), source decision content or digest, and any source artifact_binding needed to verify the reference. If any source proof is unavailable, the package MUST be labeled historical_reference_unverified and its independent verification scope is limited to the current run; it MUST NOT claim full-history INV-01 and MUST NOT depend on files that exist only on the original machine.
     DEFERRED in D1 v1.17.0: used only by the deferred FR-05 export package, not by active history retrieval.
  export_target: >-
    A user-selected destination for an additional report export. Two modes are distinct: display_copy contains the verified complete report, section manifest, and binding summary and is not independently verifiable as a full formal package; verified_package additionally contains the current terminal manifest, final-state, risk evidence and policy references, memory entry or binding, every artifact needed for read-time INV-01, and a history_reference_closure for every followed reused_decision_ref. If any historical source proof is unavailable, the package is labeled historical_reference_unverified and its independent verification scope is limited to the current run. It MUST NOT depend on original-machine-only historical files. A non-empty target returns EXPORT_CONFLICT and is never overwritten in either mode. Legacy report trees are not automatically migrated, indexed, or modified. Path confinement and credential protection reuse SR-01.
     DEFERRED in D1 v1.17.0: FR-05 export packages are not part of current acceptance; this definition is retained as a future specification.
  financial_fact: >
    A structured SEC filing fact: fact_id, subject_id (CIK or equivalent issuer
    identity), accession_no, locatable filing_ref, concept, value, unit, currency,
    period_start, period_end, fiscal_year, fiscal_quarter, span
    annual/quarter/ytd/instant, cumulative_duration_days, filed_at, source, sign
    convention, and restatement lineage (restates_fact_id or supersedes).
    period_start/fiscal_quarter/cumulative_duration_days are nullable when the
    span makes them inapplicable (for example instant or annual), and a field
    being present in the contract never requires inventing a value. filed_at is
    date-level visibility in the first version; intraday publication time is not
    claimed. CIK
    identifies the subject but NEVER substitutes for the accession and filing_ref.
    Display CSV text, column position, and date proximity are not the
    authoritative fact identity.
  financial_period: >-
    A period identity defined by subject_id, period_start, period_end, fiscal_year, fiscal_quarter, span annual/quarter/ytd/instant, cumulative_duration_days, and coverage_interval. Annual, quarterly, year-to-date, and point-in-time periods are distinct; a near-by date is a different period unless the structured identity is the same. Comparability is primarily fiscal position/span plus documented issuer-calendar evidence; exact day-count equality is not mechanically required. Leap-day and 52/53-week differences are allowed only with verifiable fiscal labels/coverage or calendar evidence; without that evidence the metric is ambiguous/incomparable n/a. Within the same complete period identity, select the latest visible version only with explicit amendment/restatement lineage; across periods, select the latest disclosed fiscal period by issuer fiscal order. An old period filed later or restated does not become the current period. Same-day accessions without a decidable relation are ambiguous_filing. Fiscal-year continuity is explicit: a current YTD period starts after the latest annual period end, its fiscal_year is the next fiscal year, and a prior-year YTD comparison has fiscal_year - 1, the same fiscal_quarter, the same span, and a matching cumulative duration. TTM periods therefore do NOT share start or end dates; they share fiscal position and cumulative coverage. Restatements retain period identity and a filed_at/accession lineage.
     TTM periods are deferred in D1 v1.17.0; active FR-07 reports fiscal-year P/E only.
  derived_metric: >
    One deterministic metric result: metric_id, name, formula_id, formula_version,
    fact_schema_version, metric_policy_version, input fact_ids, missing_input_roles,
    period identity, unit/scale, currency, precision and rounding rule, value or
    structured n/a reason, calculation status computed/n/a, and source fact
    references. approximate is schema-only future compatibility and is not
    produced by the current policy. Known current input refs are retained even
    when a comparison is missing; missing roles are explicit. A
    metric is verified only at the metric level when all inputs and the formula
    validate; it does not verify the whole analysis. Formula and policy versions
    are persisted with the result.
  metric_block: >
    The code-generated block appended to the formal numeric output. It contains
    stable metric_id values, source fact_ids, filing_refs, formula_id and
    formula_version, period, value or n/a reason, calculation status
    computed/n/a, and not_supported with a reason for a non-applicable asset.
    A complete n/a block is valid evidence. It is
    the authoritative numeric source for the listed derived metrics; model
    narrative cannot override it. It is not a second safety gate or a validation
    of the investment conclusion. The block and its metric_evidence_bundle are
    persisted in the formal publication_snapshot and recovery_snapshot; recovery
    reads them and MUST NOT refetch filings or call a model.
  metric_conflict: >
    A disclosed mismatch between a program-computed derived metric and a model
    claim that is reliably mapped by an explicit metric_id or a declared
    structured claim. Detection is limited to claims with a recognizable
    metric_id, complete period, parseable numeric value, and unit; percent/ratio
    is normalized and the comparison uses the declared display resolution after
    canonical half-up formatting. Arbitrary natural-language financial numbers
    are not claimed to be comprehensively checked; a computed n/a claim is
    unable_to_verify, not verified. The report
    MUST show the conflict, label the contradicted claim as unverified, and MUST
    NOT present the wrong number as authoritative. The metric_block remains the
    numeric authority.
  metric_claim: >
    A structured or reliably mapped model statement naming one metric_id, its
    period identity, and a parseable numeric value. Only such claims participate
    in deterministic metric-conflict detection; free-form prose without a
    recognizable metric_id is outside that detection scope and may be labelled
    as unscoped narrative.
  metric_evidence_bundle: >
    The persisted financial evidence for one formal publication: structured
    facts (with subject_id, accession_no, filing_ref, periods, units/scale,
    currencies, filed_at, and restatement lineage), formula_version,
    fact_schema_version, metric_policy_version, the derived metric_block with
    computed/n/a/not_supported statuses, input_digest, result_digest, and the
    actual price/availability metadata for P/E. A complete n/a bundle is valid;
    a missing/corrupt bundle is a different failure. It is stored in the permanent publication_snapshot and in the
    recovery_snapshot. Recovery MUST use this bundle without refetching filings
    or calling a model; a missing or invalid bundle blocks a metric-dependent
    publication rather than triggering a live fetch.
  downstream_brief: >
    A downstream context view of analyst reports for the Bull Researcher, Bear
    Researcher, and the three risk debaters only. For those five roles it replaces
    the four full analyst reports; the same role never receives both. It contains
    mandatory non-compressible content (canonical coverage gaps, required metric block and
    source references, safety constraints) and compressible narrative (stance,
    key levels or triggers, conclusion). It is not a formal artifact and never
    replaces or mutates the full report, formal record, history, or recovery
    material. Its source summary, policy version, resolver handle, mandatory
    digests, fallback/rejection reason, budget decision, view/source versions,
    tokenizer/model identity, reference payload tokens, and omitted compressible
    information are recorded in a separate ContextAuditMetadata object; it is
    not a second context authority.
  context_audit_metadata: >
    The audit metadata for one downstream brief: run_id, role, brief_version,
    coverage_view_version/profile_hash, source report digests,
    metric_bundle_digest, source summary, policy/tokenizer/model identity,
    mandatory-content digest, omitted compressible-content identifiers, budget
    decision, measured tokens, fallback/expansion/rejection reason, and resolved
    reference identity/payload tokens if any. It is
    stored separately from the full report and does not mutate the full report,
    formal publication_snapshot, history, or recovery material. A reference
    handle must be resolvable by the receiving downstream consumer.
  brief_budget_policy: >
    A versioned policy with budget_unit=tokens bound to the selected tokenizer and
    model. It separates mandatory_budget M, compressible_budget C, initial
    brief_total_budget T=M+C, brief_hard_cap H>=T, reserve_output_tokens R, and
    the full-request input cap L. Mandatory content is budgeted first and is
    never truncated. The policy MUST define one ordered resolution sequence and
    its conditions: reject if mandatory exceeds H; otherwise retain/compress
    compressible content, expand to H when allowed and the full request fits,
    use a resolved/verified/token-measured reference within the request cap,
    use a saved full report with canonical mandatory added exactly once when it
    fits, otherwise reject with BRIEF_REJECTED. Byte/character counts are
    auxiliary and are never added to tokens. A reference is an application-controlled handle; its payload MUST be resolved,
    verified, injected, and token-measured before the model call. A path string
    or unresolved handle is not success; no resolver means the branch is
    unavailable. Full-report fallback MUST add canonical mandatory exactly once
    and obey the full-request cap; if no safe branch fits, reject without
    truncating mandatory content.
    Character limits are auxiliary; token measurement uses the selected model or
    tokenizer. Unicode is normalized, and missing, duplicate, forged, or
    overlong markers use the policy's deterministic fallback or rejection path.
    Brief status is a closed set: ok, fallback, truncated, short_passthrough,
    short_narrative_plus_mandatory, expanded, reference, full_report,
    BRIEF_REJECTED. invalid_marker is a rejection_reason under BRIEF_REJECTED,
    not a continuing independent status. truncated applies only to compressible
    content.
  brief_evaluation: The controlled downstream-brief evaluation. The active authority for state and thresholds is docs/req/evaluation/brief-eval-contract-v4.json;
    brief-eval-contract-v3, v2, and v1 are historical and must not be used as the current specification. Contract
    v4 defines the switch, fixed inputs, prices, thresholds, two-field execution/acceptance state table, generation-call
    selection, usage policy, sample aggregation, attempt records, claim definitions, and evidence requirements. The
    counted local cost attribution difference is added brief-generation output cost minus reduced downstream input
    cost saving. G is the selected final delivered successful generation instance; shared generation is counted once;
    distinct view-update instances are separate; excluded retry/fallback calls are recorded. D is the five-role actual
    final-request input difference including wrappers, mandatory content, resolved references, and history. Brief-generation
    input cost, excluded retry/fallback calls, downstream output changes, non-brief calls, and infrastructure are
    excluded and disclosed. A net_cost at or below an approved net_cost_max is budget_met, not necessarily a saving.
    local_cost_saving requires net_cost < 0 under this local formula. Token change is recorded, but no independent
    token-improvement target is approved. A whole-application saving is never claimed. Missing pre-run inputs, snapshots,
    prices, thresholds, or human approval -> blocked; valid pre-run and no result -> ready; running/aborted is execution
    status, not ready; a completed attempt with missing/corrupt/inconsistent result evidence or any failing quality,
    safety, or cost condition -> failed; all applicable conditions pass with valid result evidence -> accepted. Execution
    status is not_started/running/completed/aborted; acceptance_status is blocked/ready/accepted/failed and null only
    while running. pending and aborted are forbidden acceptance values. running maps to acceptance null; completed
    maps to accepted/failed; aborted maps to failed. A started attempt never returns to not_started/ready/blocked.
    accepted/failed are terminal for the current attempt; retry creates a new attempt and preserves prior evidence
    and observed_failures. Quality or safety failures cannot be offset by cost or token results. CR-01 is the active
    requirement.
  recovery_benchmark: >-
    The fixed recovery-performance workload and measurement contract: 100 committed formal publications and 10 pending valid recovery snapshots on a documented supported local filesystem. Each pending snapshot contains the fixed 12-section report map, complete report, section manifest, one risk evidence object with policy reference, and one required memory idempotent write; rendered output is no larger than 1,048,576 bytes and the snapshot is no larger than 1,048,576 bytes. 30 independently reset trials, nearest-rank p95, and a provisional 2.000-second target pending approval. Timing includes claim, scans, fixed rendering, publication, the required memory write, and cleanup attempts. All samples, failures, timeouts, platform/OS, CPU/RAM, filesystem/mount, output sizes, fixture version, and source commit are recorded. Correctness and model-free behavior are zero-tolerance; validation is never skipped to meet the time target.
     QR-02 is deferred in D1 v1.17.0; this benchmark is a future specification and not current acceptance.
  evidence_requirement_link: >
    An explicit link from one availability record to one requirement component:
    requirement_id, capability, component, and criticality. One executed record
    may support multiple links; its primary link is repeated in the record's
    top-level requirement_id/capability/component fields. A component_missing
    record has exactly one link.
  coverage_snapshot: >
    Immutable run-scoped snapshot produced only by the availability program from
    the record of the critical profile, run clock, declared availability_plan,
    actual executed/component_missing records, supports contract evaluations, and
    deduplicated evidence. It is stored in the manifest and contains run_id,
    plan_hash, critical_profile_hash, provenance_digest, coverage_status,
    structured critical_gaps, critical_gap_ids, view_version, snapshot_version,
    snapshot_hash, sealed_at, and computed_by = program. It is sealed once after
    a fixed barrier and deadline: before sealing, declared critical tasks are
    terminal or timed out; after sealing, late results may only be diagnostic and
    cannot change the snapshot. critical_profile_hash MUST equal the actual
    critical_profile.profile_hash. The model never creates or mutates it.
  input_hash: >
    SHA-256 over the canonical gate input: coverage_snapshot.snapshot_hash, the
    model_proposal canonical fields (including nullable rating and validation
    status), the portfolio_risk input_digest or safe diagnostic digest, the
    portfolio_risk policy digest when FR-04 applies, and gate_version. All
    missing optional inputs are explicit null. The safety_gate and
    FinalizedRunRecord carry the same input_hash for one gate evaluation. The
    projection is unique and versioned; no consumer may recompute a different
    projection.
  gate_input: >
    The trusted input to the gate: one immutable sealed coverage_snapshot, one
    model_proposal (including the missing/invalid-rating representation), one
    validated portfolio_risk_input or safe diagnostic_ref and the
    portfolio_risk_policy_snapshot when FR-04 applies, and the gate_version.
    Coverage and gaps are read only from the sealed snapshot; the model cannot
    supply or alter authoritative coverage state, risk input, diagnostic, or
    policy snapshot.
  gate_result: >
    Closed status passed, blocked, or error, plus reason_codes from the closed
    gate_reason_code set, primary_reason_code selected by the fixed priority
    order, run_id, coverage_status, critical_gap_ids, profile_version,
    snapshot_hash, gate_version, input_hash, evaluated_at, and the
    portfolio_risk_result when FR-04 applies.
  model_proposal: >
    The model's unapproved output. When a proposal exists it carries a model
    rating that is either one of the five tiers, REVIEW, or null when the rating
    is missing or cannot be parsed; decision text; proposal_status = unapproved;
    validation_status from the closed set valid, invalid_rating, missing; and a
    proposal_digest over the stable proposal fields. The running and failed
    manifest states may carry proposal = null when no model proposal was
    produced; the completed state must use a structured proposal object, which
    may have rating = null and validation_status invalid_rating or missing.
    No consumer may invent Hold, REVIEW, or template text to replace a missing or
    invalid proposal. The proposal is retained for audit but is never the formal
    decision.
  formal_decision: >
    The deterministic gate output: status approved or blocked_for_review,
    final_rating, decision_text, and gate_result. When blocked, final_rating is
    REVIEW and decision_text uses the review_class matched to the primary gate
    reason; the model proposal is stored separately and marked not approved.
  gate_reason_code: >
    Closed set: critical_gap, coverage_gap_mismatch, invalid_coverage_status,
    missing_gap_list, invalid_gap_type, missing_availability_record,
    invalid_critical_profile, invalid_model_rating, model_review,
    missing_gate_input, stale_coverage_snapshot, snapshot_hash_mismatch,
    gate_internal_error, portfolio_risk_input_invalid,
    portfolio_risk_limit_exceeded, portfolio_risk_evaluator_error.
  artifact_binding: 'The canonical identity and decision fields every formal artifact exposes in a machine-readable
    form: run_id, decision_id, record_version, decision_digest, gate_status, formal_decision_status, final_rating,
    coverage_status, critical_gap_ids, coverage_snapshot_hash, and an optional record_hash. run_id is the invocation
    identity; decision_id is the content identity used by memory reuse. Artifacts bind to one formal result only when
    these values match. The stable record identity and the versioned comparison projection are separate: status, source,
    counts, and attempts are attributes, and one execution may support multiple requirements. The binding does not
    replace full canonical records in manifest/final-state or the declared summaries in report/memory.'
  canonicalization: 'Per-field comparison rules. Encoding is UTF-8 with NFC and LF; object keys are sorted. Only declared
    decision-text line-ending/trailing-whitespace normalization is allowed; scalar whitespace is not globally trimmed.
    Arrays with semantic order keep it: attempts and attempted_sources preserve supplier attempt order, artifacts
    preserve their declared order, supports preserve their declared order, and critical_gap_ids are sorted by requirement_id.
    Run-level generated_at, the top-level safety_gate evaluated_at, and finished_at are excluded only by explicit
    field list; the portfolio_risk evaluated_at and other immutable risk evidence timestamps are retained. Evidence
    timestamps in attempts and observed windows are preserved in records and included in full-record comparison and
    provenance_digest. Relative artifact paths and relative evidence references are retained because they carry run
    meaning; only absolute local paths are excluded. Same-named run and risk timestamps are not removed together by
    recursion. A content digest, a file SHA, and the acyclic record projection are separate values. Manifest timing
    records an observed cutoff before serialization; actual serialization-to-fsync/replace durations and replace completion
    times are external WriteEvidence and are not embedded in the immutable record.'
  entry_digest: >
    SHA-256 over the stable decision-content projection: decision_id,
    trade_date/ticker, and formal decision status/rating/text. It excludes
    coverage_status, critical_gap_ids, provenance_digest, run_id, source snapshot
    hash, timestamps, commit_status, and reuse metadata so the same decision can
    be reused across normal reruns with different evidence. Portfolio-risk
    evidence is not an entry_digest input; only stable formal decision content
    controls reuse.
  evidence_digest: >
    SHA-256 over the per-run evidence projection for a memory entry:
    coverage_status, critical_gap_ids, and provenance_digest. It may differ
    across two runs with the same decision_id; evidence difference is not entry
    corruption and does not block reuse. Portfolio-risk evidence is stored in
    the current run manifest/final-state and in a newly written memory entry's
    declared summary; a reused historical entry retains its original evidence
    and is linked through reused_decision_ref.
  decision_digest: >
    SHA-256 over the canonical formal decision input: formal_decision.status,
    final_rating, and decision_text after UTF-8 NFC, LF, and trailing-whitespace
    trimming. Run-level timestamps, paths, and cache metadata are not inputs.
  provenance_digest: >
    SHA-256 over the canonical ordered availability records and fallback
    provenance, including data_query_key, record_kind, component identity,
    ordered attempts, attempt source/status/reason_code/record_count,
    evidence timestamps, tried and serving sources, and criticality. All cache
    metadata (cache_kind, vendor_cache_hit, run_cache_hit) and run-level
    generation timestamps are excluded from the digest input. Report and
    memory carry the digest plus a derived summary; manifest and final-state
    carry the full canonical records.
  record_hash: >-
    Optional SHA-256 over the canonical FinalizedRunRecord projection excluding volatile run-level timestamps (including run_clock.now_utc), artifact paths, cache counters, and computed snapshot timestamps. When present, every artifact binding must carry the same value. It is not a hash of the shared memory file. The projection excludes artifact_binding.record_hash and every result-carrying hash; no self-hash or mutual-hash loop is allowed.
  memory_entry_binding: 'A binding to one immutable memory decision entry: source_run_id, decision_id, record_version,
    decision_digest, trade_date/ticker identity, entry_digest, evidence_digest, a commit_status projection, pre-commit
    entry_version, optional supersedes, and an optional reused_decision_ref. The effective version is the highest
    entry_version whose source terminal manifest is legally committed and binding-valid; no post-commit write to an
    older entry is required. Allocation uses a high-water mark over all allocated versions, including pending and
    failed reservations, so a failed reservation is not reused. entry_digest covers only stable decision content and
    excludes coverage, gaps, provenance, source_run_id, source snapshot hash, timestamps, commit_status, and other
    run metadata. evidence_digest covers the per-run evidence and may differ without implying entry corruption. The
    current artifacts keep the current run_id; a reused historical entry is referenced through reused_decision_ref
    instead of rewriting its source run identity. The shared memory file itself is not hashed. Settlement/reflection
    and policy-based rotation of resolved entries are legal only with an independent verifiable retention record and
    permanent source proof; modifying or deleting a decision entry while it is retained is illegal. new/reused/disabled
    are separate branches.'
  behavior_evaluation_contract: The frozen D1 behavior-evaluation contract. docs/req/evaluation/behavior-eval-contract-v2.json
    is the active draft and is blocked until snapshots and human approval exist; behavior-eval-contract-v1.json is
    retained historical/frozen. The active contract fixes the eval set, rubric, model/config/data snapshots, case
    count, rubric dimensions, two-rater merge, third-reviewer adjudication, dimension weights, case-set aggregation,
    off-on direction, one original sample per case/condition, retry/attempt handling, REVIEW-rate denominator and
    percentage-point unit, safety-event hard checks, and blocking rules. FR-01 cache A/B holds the FR-04 policy snapshot,
    risk input fixtures, and gate version fixed and does not use a risk-policy change as its independent variable.
    FR-04 risk-policy effects are evaluated separately under fixed cache, model, and data settings and may increase
    REVIEW by design. The frozen files remain docs/req/evaluation/behavior-eval-contract-v1.json, eval-set-v1.json,
    rubric-v1.json, config-v1.json, prompt-v1.0.yaml, and snapshots-v1.json; actual snapshots remain pending capture.
    Any new risk-policy evaluation set requires a new version and a recorded decision; v1 is not edited in place.
  evaluation_rubric: 'Five 0-to-5 dimensions: evidence fidelity, relevance, coverage correctness, safety, and actionability,
    with weights 0.3/0.2/0.2/0.2/0.1. Higher is better. Two independent blinded raters score every dimension for each
    case/condition; a same-dimension difference of at most 1 uses the arithmetic mean, and a difference greater than
    1 uses a third reviewer''s reasoned final score (not best-of). The case score is the weighted mean; the set score
    is the equal-weight mean over the fixed cases. Safety events remain an independent hard check and cannot be offset
    by a high rubric average. The rubric records per-case scores and the aggregate mean; unsupported cases are not
    dropped.'
  eval_set_version: >
    A frozen evaluation set (docs/req/evaluation/eval-set-v1.json) of at least
    10 ticker/date cases, including the baseline NVDA 2026-10-19 case, with fixed
    data snapshots, model, configuration, and prompts for every A/B run. Snapshot
    capture is required before behavioral acceptance. The fixed config, prompt,
    and snapshot manifest are recorded with SHA-256 digests in the contract.
  decision_id: >
    The content identity of a formal decision, stable across same-day reruns
    when trade_date, ticker, and decision_digest match. run_id remains unique per
    invocation. Memory reuse is keyed by decision_id, not run_id. Repeating the
    same decision_id for the same trade_date/ticker is valid only when its
    stable decision content matches; a same decision_id with different stable
    content is a conflict and blocks reuse. A different decision_id for the same
    trade_date/ticker is a new decision version managed by INV-01, not a
    conflict.
  review_class: >
    Closed formal-review class derived from gate reason_codes: none,
    data_insufficient, model_rating_invalid, model_review, gate_system_error,
    input_invalid, coverage_inconsistent, or portfolio_risk_limit. It selects
    the wording of the blocked formal decision so a rating anomaly, system
    failure, or portfolio-risk limit is not mislabeled as missing data. Risk
    input, policy, cash, currency, or valuation-consistency failures use
    input_invalid; a risk limit breach uses portfolio_risk_limit; a risk
    evaluator exception uses gate_system_error.
  portfolio_risk_input: >
    Authoritative caller/application-supplied risk input for one candidate
    trade. It contains portfolio_value, cash_balance, current_asset_quantity,
    current_asset_value, valuation_price, valuation_time as an ISO 8601
    timestamp with timezone, one non-empty currency label, position_effect
    new_long or add_long, order_quantity, entry_price, proposed_order_value,
    stop_loss_price, source/provenance, and the business identity fields
    instrument_id (market-qualified), asset_type, analysis_date, candidate_id,
    action, instrument_type, order_count, leverage, and portfolio_scope. The
    current run binds run_id and the canonical input-file digest through an outer
    envelope; the business input may be reused by a new run without carrying a
    new run_id. candidate_id is caller-supplied or derived from canonical
    candidate content by a versioned rule. Inputs are canonical decimal strings
    under the bounded grammar in docs/req/requirement-contracts-v1.json: at most
    30 integer digits and 12 fractional digits, no exponent, plus sign,
    whitespace, leading zero (except 0), negative zero, or meaningless trailing
    zeros. All monetary fields use the same currency and valuation_time; no FX
    conversion is performed. Model prose, rendered portfolio text, and Markdown
    are never authoritative. new_long requires current_asset_quantity = 0 and
    current_asset_value = 0; add_long requires both positive. Validation covers
    presence, type, grammar, bounds, instrument/asset/date/candidate binding,
    supported scope, currency, valuation time, exact identities, cash, and
    portfolio total. A value that can be serialized but fails any check is
    invalid and MUST NOT produce a normalized input artifact. A valid input with
    an invalid policy remains valid input and retains its normalized artifact.
  candidate_trade: >
    The structured stock trade evaluated by FR-04. position_effect is new_long
    or add_long; action is Buy; instrument_type is common_stock; order_count is
    an integer (not boolean) equal to 1; leverage is the canonical decimal 1;
    order_quantity and proposed_order_value are positive; proposed_order_value
    equals order_quantity times entry_price exactly without intermediate
    rounding; entry_price is positive; stop_loss_price is positive and strictly
    below entry_price; and every monetary field uses one portfolio currency.
    Short, derivative, leveraged, multiple-order, non-common-stock, and
    FX-conversion cases are unsupported when applicability is true and are
    blocked, not not_applicable. The candidate is bound to the run's instrument,
    asset type, analysis date, and candidate_id; a result for another candidate
    or instrument is invalid.
  portfolio_risk_policy_snapshot: >
    Versioned, locatable policy snapshot actually used by one risk evaluation:
    policy_version, logical policy_ref, policy_file_ref, policy_digest,
    max_projected_weight, max_stop_distance, max_valuation_age_seconds,
    precision_rule, threshold_status, and human_approval_ref. The precision_rule is
    input<=12dp;internal=exact_cross_product;exact_compare;display=6dp_half_up.
    Policy values use the bounded decimal grammar and legal ranges in
    docs/req/requirement-contracts-v1.json. The default max_projected_weight =
    0.30 and max_stop_distance = 0.05 are provisional classroom defaults, not
    approved financial policy. threshold_status is provisional with
    human_approval_ref = null until a recorded human approval exists; approved
    requires a non-null human_approval_ref that resolves to a real review record,
    not merely a non-empty string. policy_digest is computed over a fixed content
    projection that excludes policy_digest itself, policy_file_ref, file SHA,
    mtime, and generation time, but includes the stable logical policy_ref,
    version, thresholds, precision, status, and approval identity. policy_ref is
    a logical identity such as portfolio-risk-policy-v2; policy_file_ref locates
    the artifact. The policy content and its file SHA are retained in permanent
    material; recovery does not depend on an external source that may disappear. Missing, unknown,
    incomplete, or digest-mismatched policy fails closed.
  portfolio_risk_result: 'Deterministic evaluator output: evaluation_status passed, blocked, not_applicable, or error;
    risk_reason_codes from the closed FR-04 set; the portfolio_risk_policy_snapshot actually used (nullable when the
    policy is unavailable); input_ref; input_digest; diagnostic_ref; valuation_time; valuation_cutoff; currency; projected_weight
    and stop_distance as canonical decimal strings; effective_order_value; and evaluated_at. effective_order_value
    is the candidate amount allowed by the risk branch, not a trade authorization: passed uses proposed_order_value,
    blocked/error uses 0, not_applicable is null. A normalized input has a non-null input_ref and input_digest and
    a null diagnostic_ref. Invalid input has null input_ref and input_digest and a safe diagnostic_ref; a valid input
    with an invalid policy retains input_ref/input_digest and adds a separate safe policy/diagnostic reference. Raw
    invalid values such as NaN are never persisted. The result is produced by code, never by the model, and is consumed
    by the shared SafetyGate. A risk-limit breach maps to gate reason portfolio_risk_limit_exceeded and review_class
    portfolio_risk_limit; an input/policy/candidate failure maps to portfolio_risk_input_invalid and input_invalid;
    an evaluator error maps to portfolio_risk_evaluator_error and gate_system_error.

    '
  risk_input_ref: >
    A run-scoped locatable reference to the canonical stored risk-input
    artifact: relative path, SHA-256, and hash_scope = file. The artifact exists
    only for an input that passed canonicalization and complete validation, is
    written under the run results directory, and is included in scan_scope. A
    reviewer can read the artifact, recompute input_digest, and independently
    reproduce projected_weight, stop_distance, and the policy comparison. The
    same reference shape is used for diagnostic_ref; a diagnostic reference
    contains only safe validation metadata and no raw invalid value.
  risk_reason_code: >
    Closed FR-04 set: POSITION_LIMIT_EXCEEDED, STOP_DISTANCE_EXCEEDED,
    MISSING_RISK_INPUT, INVALID_RISK_INPUT, STALE_RISK_INPUT,
    UNSUPPORTED_RISK_INPUT, CURRENCY_MISMATCH, VALUATION_INCONSISTENT,
    INSUFFICIENT_CASH, POLICY_SNAPSHOT_UNAVAILABLE, EVALUATOR_ERROR.
  risk_input_digest: >
    SHA-256 over the exact bytes of the canonical stored risk-input artifact. It
    equals risk_input_ref.sha256, binds the exact input used by one evaluation,
    and is included with the policy digest in the gate input_hash and the
    immutable record. It is a file-byte digest of the canonical artifact, not a
    hash of the caller's original file bytes and not a policy content digest.
  risk_behavior_evaluation: >
    Two separate evaluations. The cache A/B holds the portfolio-risk policy
    snapshot, risk input fixtures, and gate version fixed while comparing cache
    enabled versus disabled, so an intentional risk-driven REVIEW increase is
    not attributed to cache regression. The risk-policy evaluation compares
    policy variants under fixed cache, model, and data settings, uses its own
    thresholds, and may increase REVIEW by design. Deterministic risk fixtures
    cover crypto Buy, missing and unsupported candidates, zero position, add to
    long, insufficient cash, historical valuation cutoff, missing policy,
    dual over-limit, evaluator exception, and historical memory reuse.
  artifact_contract: >
    Per-artifact required content. Report carries the binding plus coverage,
    critical-gap, fallback, gate, and, when FR-04 applies, a portfolio-risk
    summary with status, reason codes, policy_ref, policy_digest,
    threshold_status, and metrics. Manifest and final-state carry the binding
    plus full availability records, full gate/formal-decision fields, the full
    portfolio_risk_result, input_ref, input_digest, and policy snapshot when
    FR-04 applies, the report_section_manifest, and the metric_evidence_bundle
    when FR-07 applies. The report carries the metric_block and any metric
    conflict disclosure. A newly written memory entry
    carries the binding plus final rating, formal decision text or digest,
    coverage and gap summary, provenance digest, and a declared risk summary
    with status, reason codes, policy_ref, policy_digest, and threshold_status.
    A reused historical entry retains its own original content and risk evidence
    and is linked through reused_decision_ref; the current run does not inject
    its current risk summary into that historical entry.
  publish_state: Closed internal publication state set running, staged, validated, completed, partial, failed. INV-01
    is claimed only for completed. partial, staged, and validated are not public run_status values; public run_status
    is running/completed/failed. A pre-commit publication failed may be retried/continued with the same run_id, record_version,
    and record_hash under FR-06; a completed record is immutable and is never replaced by failed or a second publication.
    A post-commit deletion/corruption preserves terminal bytes but fails read-time validation.
  invariant_checkpoint: >
    The invariant is checked before completed is recorded, after publication on
    every read of a completed run's formal artifacts, and after any retry or
    resume. It is not claimed while artifacts are incomplete.
  secret_value: >
    A credential value actually configured or used by the run: an API key,
    access token, bearer token, password, client secret, URL userinfo password,
    or a sensitive query or header value. Values are collected in memory for the
    run and are never written to a record.
  secret_pattern_rule: >
    A versioned detection rule category for values not known in advance. The
    fixed minimum categories are provider key formats, generic bearer and JWT
    formats, URL userinfo, sensitive query parameter names and values, sensitive
    authorization headers, and password/token assignments. Each rule set carries
    secret_rule_version, secret_rule_source, and effective_at.
  scan_scope: 'The closed set of app-controlled boundaries: run manifest, final-state, portfolio-risk input artifact,
    portfolio-risk diagnostic artifact, portfolio-risk policy snapshot, memory decision entry, formal report metadata
    and content, report section manifest, archive storage, history index and responses, recovery snapshot and diagnostics,
    export diagnostics (only if export is enabled), logs, preferences, error records, gate reasons, availability reasons,
    context audit, write evidence, retention/recovery audits, stream/debug output, and formal API return. Vendor/provider
    logs, shell history, OS/network captures, and external service logs are out of scope and MUST be named as such;
    app-copied vendor content inside an in-scope record remains in scope.'
  redaction_policy: Known secret values are removed by exact match; pattern-matched values are redacted or block the
    record. Redaction replaces only the secret value with a stable marker such as *** and preserves keys, parameter
    names, structure, status, reason codes, counts, timings, source and vendor names, tickers, dates, model ids, and
    relative paths. Whole-record or whole-URL removal and indiscriminate long-string redaction are forbidden as over-redaction.
    If a secret conflicts with a required non-secret field, the record is blocked rather than keeping the secret or
    deleting unrelated content. Audit/display endpoint clipping and non-audit public URL preservation are separate
    rules.
  secret_scan_result: 'The recorded scan outcome: known_secret_detected_count, pattern_detected_count, redaction_count,
    known_secret_match_count, pattern_match_count, residual_secret_count, scanner_error, rule_version, rule_source,
    and the scanned scope plus write_scan_status and run_scan_status. detected_* counts are before redaction; redaction_count
    counts allowed replacements; residual_* counts are after redaction. The retained known_secret_match_count and
    pattern_match_count fields mean final residual matches, not pre-redaction detections. A clean result requires
    no necessary redaction, zero residual, and no scanner error; a completed result requires zero residual and no
    scanner error. Overlapping rules do not require the detected sum to equal the redaction count. The result proves
    only the defined scope, rules, and fixtures, not the absence of unknown credential formats outside them.'
  endpoint_audit_record: >
    The audit/display endpoint: scheme, host, and path only. Userinfo, query, and
    fragment are removed.
  endpoint_restore_record: 'The preference restore endpoint: scheme, host, path, allowlisted non-sensitive query parameters,
    and secret_ref names. Inline sensitive values are forbidden. A sensitive component is resolved only from an existing
    explicitly authorized credential store (.env or process environment); migration must not write to an arbitrary
    .env, overwrite a conflicting value, or create an unsafe file. If the value cannot be migrated or resolved, the
    record marks re_entry_required. Process-environment values are not claimed to persist across restarts. Scheme/host/path
    structure is not an exemption from secret detection.'
  safety_gate: >
    Deterministic code that consumes the trusted coverage_snapshot,
    model_proposal, and validated portfolio_risk_input and policy snapshot when
    FR-04 applies; validates coverage, gaps, profile, snapshot provenance,
    availability records, model rating, and portfolio risk; and produces the
    formal_decision before any formal display, persistence, memory write,
    manifest, API return, or backtest scoring. It is fail-closed: invalid
    input, a risk limit breach, a risk evaluator exception, or a gate error
    yields REVIEW with a manual-review notice, and the model cannot override
    it. FR-04 is an internal evaluator of this gate, not a second finalization
    authority.
  zero_tolerance: >
    A pass requires exactly zero violations. A single violation fails the
    fit criterion; there is no percentage allowance.
  run_manifest: >
    The native, auxiliary, best-effort machine-readable JSON record for one
    analysis run, written at <results_dir>/<run_id>/run_manifest.json. It records
    schema_version, run_id, ticker, analysis_date, status (running, completed, or
    failed), timezone-aware started_at and finished_at, monotonic
    duration_seconds excluding the final serialization and write, the existing
    run_settings() allowlisted configuration summary, llm_calls, tool_calls,
    tokens_in, tokens_out, usage_complete, references to result files actually
    produced, and an optional safe error summary. Unknown values are null and are
    never fabricated as zero, success, or a file reference. Token totals are
    reported only when every counted model call has valid input and output usage;
    otherwise tokens_in and tokens_out are null and usage_complete is false. A
    running manifest may have null timing and statistics until analysis
    completes. The manifest is auxiliary: its creation, serialization, or update
    failure only produces a safe warning and never fails the analysis, blocks a
    model call, changes the analysis result or return shape, or replaces the
    original error. The manifest does not contain full prompts, raw tool bodies,
    credentials, complete configuration, or an uncontrolled traceback, and it is
    not a formal publication, commit condition, artifact-hash record, or recovery
    authority.
  sensitive_url_parameter: >
    A URL userinfo component, query parameter, or fragment that can carry a
    credential, token, password, or API key. Sensitive parameters are excluded
    from all records.

  execution_policy: >
    The immutable, locatable, versioned and digest-bound policy used by one run.
    It fixes the configured vendor chain, retry_budget, fallback_budget, the
    action for each record status, request timeout, shared execution deadline,
    waiter timeout, and run-cache capacity. Budgets are non-negative integers
    and reject boolean, negative, or non-integer values; deadlines and timeouts
    are finite positive values. A missing or invalid policy fails before any
    vendor call and never defaults to unbounded retry. retry_budget is the
    maximum number of additional attempts per vendor after its first attempt;
    fallback_budget is the maximum number of vendor switches. Exhausting the
    retry budget does not prevent a legal fallback. Pagination, batch
    decomposition, and authentication are real HTTP actions counted in
    http_request_count but are not new query_executions. Adapter-internal
    retries MUST be disabled or counted against the same unified budget.
    The provisional default values and status-action table are in
    docs/req/requirement-contracts-v1.json.

  method_normalization_contract: >
    A versioned per-method-family normalization contract that defines required
    and default parameters, aliases, canonical instrument/topic identity,
    window and timezone resolution, parameter types and limits, which list
    orders are semantic, and which parameters are rejected. It provides positive
    and negative examples for key equivalence. The contract version participates
    in cache_key_version. It is a requirements contract, not an application
    implementation. The provisional default contract is
    docs/req/requirement-contracts-v1.json.

  availability_plan: >
    The immutable, versioned query plan Q declared before execution for one
    critical profile. It contains the ordered query slots (requirement_id,
    capability, component, period slot, canonical normalized parameters needed
    to derive each key, and contract_id/version) and the fixed component and
    requirement quorum thresholds. Optional dynamic queries may add context but
    never change the critical plan denominator or threshold. A declared
    equivalence or replacement rule must be part of the plan; it cannot be
    invented from execution results. An invalid plan is rejected before formal
    analysis.

  availability_view: >
    A program-produced, model-immutable, versioned intermediate aggregation of
    the availability state used before the final seal (for example by the
    FR-08 brief). Each view has view_version, the profile/plan identity, the
    component and requirement statuses, gaps, and evidence references. A view
    may be recomputed while work is in progress and is not a substitute for the
    final sealed coverage_snapshot. A consumer that acts on a view records the
    view_version and reassembles if the view changes before delivery.

  write_evidence: >
    Independent measurement and audit material for actual manifest writes:
    startup serialize-to-fsync pre-replace duration, startup replace duration,
    terminal serialize-to-fsync pre-replace duration, terminal replace duration,
    terminal replace completed_at, and external end-to-end duration. It is
    produced by a harness or writer outside the immutable manifest projection.
    It is not a commit marker, not part of read-time INV-01 success, and never
    causes a completed terminal manifest to be rewritten. WriteEvidence failure
    or absence is a measurement limitation, not a publication success or a
    terminal rollback.

  history_page: >
    The list response: items in the fixed order, total_matches, returned,
    truncated, next_offset, and diagnostics with candidate_count,
    corrupt_candidate_count, unsupported_candidate_count (a corrupt subset),
    unclassified_candidate_count, warnings, and
    diagnostic_scope = discovered_candidates_before_filters. Diagnostics contain
    only safe identities and reasons, never partial report content. The page
    limit does not bound scan cost; scan budget and timeout are versioned.

  verified_run: >
    The get response for one committed and revalidated publication: run_id,
    canonical ticker, asset_type, analysis_date, formal decision summary,
    verified complete_report bytes with media_type, verified section_manifest,
    and process suggestions marked unapproved. The model proposal is never
    substituted for the formal decision. The returned bytes are the same bytes
    validated in that read; if the manifest changes during the read, the service
    may retry the whole read or return CORRUPT_RECORD, never unvalidated bytes.

  portfolio_scope: >
    The declared first-version portfolio scope: single-currency, unlevered cash
    plus long positions, one candidate order, common stock, action Buy,
    position_effect new_long or add_long. It explicitly excludes short,
    derivative, leveraged, multiple-order, non-common-stock, FX conversion, and
    broker integration. The caller declares this scope and must not use it to
    imply detection of undisclosed liabilities. A scope that is unsupported or
    cannot be declared blocks an applicable proposal as
    UNSUPPORTED_RISK_INPUT; it never becomes not_applicable.

  risk_input_diagnostic: >
    A safe audit record for an invalid or unsupported risk input or an invalid
    policy: field_names, validation_stage, rule_version, ordered reason codes,
    run binding, and a digest. It never contains raw invalid values, secrets, or
    unbounded model text. It may coexist with a valid normalized input when the
    input is valid but the policy is invalid; the two artifacts are distinct.

