name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    outputs:
      semantic_required: ${{ steps.classify.outputs.semantic_required }}
      approval_applicable: ${{ steps.classify.outputs.approval_applicable }}
      security_applicable: ${{ steps.classify.outputs.security_applicable }}
      ai_log_required: ${{ steps.classify.outputs.ai_log_required }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/ci_checks.py classify --base "$BASE_SHA" --head "$HEAD_SHA" > classification.json
          python -c "import json; d=json.load(open('classification.json')); print('\n'.join(f'{k}={str(d[k]).lower()}' for k in ('semantic_required','approval_applicable','security_applicable','ai_log_required','docs_only')))" >> "$GITHUB_OUTPUT"

  requirements-schema:
    name: requirements-schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CI checks
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Validate requirements schema
        run: python scripts/ci_checks.py schema --requirements docs/req/requirements.yaml --schema docs/req/req-schema.json

  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Lint the repository
        run: python -m ruff check .

  type-check:
    name: type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project and CI checks
        run: python -m pip install -e ".[dev]" -r .github/requirements-ci.txt -c .github/type-check-constraints.txt
      - name: Type-check against the recorded baseline
        run: python scripts/ci_checks.py mypy --output mypy-current.txt --baseline mypy-baseline.txt

  dependency-check:
    name: dependency-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project and CI checks
        run: python -m pip install -e ".[dev]" -r .github/requirements-ci.txt
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Import smoke check
        run: python -c "import tradingagents, cli.main; print('import smoke OK')"

  regression:
    name: tests (py${{ matrix.python-version }}${{ matrix.tz && format(', {0}', matrix.tz) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.12"
            tz: America/New_York
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras and CI test dependencies)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -r .github/requirements-ci.txt
      - name: Run offline regression suite
        run: pytest -q

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fresh install and import
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -c "import tradingagents, cli.main; print('clean-install import OK')"

  test-approval:
    name: test-approval
    if: github.event_name == 'pull_request' && needs.classify.outputs.approval_applicable == 'true'
    needs: classify
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Write PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
      - name: Verify test pre-approval evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci_checks.py approval \
            --pr-body-file "$RUNNER_TEMP/pr-body.txt" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --token "$GH_TOKEN"

  security-paths:
    name: security-paths
    if: github.event_name == 'pull_request' && needs.classify.outputs.security_applicable == 'true'
    needs: classify
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project and CI checks
        run: python -m pip install -e ".[dev]" -r .github/requirements-ci.txt
      - name: Check permission configuration
        run: python scripts/ci_checks.py permissions --path .opencode/permissions.jsonc
      - name: Check selected public API signatures
        run: python scripts/ci_checks.py api
      - name: Check safety-critical ADR reference
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          python scripts/ci_checks.py security-paths \
            --pr-body-file "$RUNNER_TEMP/pr-body.txt" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"
      - name: Run applicable security tests
        run: |
          pytest -q \
            test/offline/test_get_scrubbed.py \
            test/offline/test_safe_ticker_component.py \
            test/offline/test_cli_prefs.py \
            test/offline/test_api_key_env.py \
            test/offline/test_ci_gates.py

  contract-tests:
    name: contract-tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project and CI checks
        run: python -m pip install -e ".[dev]" -r .github/requirements-ci.txt
      - name: Write PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
      - name: Select, collect, and run current-round contract tests
        run: |
          python scripts/ci_checks.py contract-tests \
            --pr-body-file "$RUNNER_TEMP/pr-body.txt" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  ai-use-log:
    name: ai-use-log
    if: github.event_name == 'pull_request' && needs.classify.outputs.ai_log_required == 'true'
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CI checks
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Extract base AI-use log
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE_SHA:docs/ai-use-log.yaml" 2>/dev/null; then
            git show "$BASE_SHA:docs/ai-use-log.yaml" > "$RUNNER_TEMP/base-ai-use-log.yaml"
          else
            printf 'schema_version: "1.0"\nentries: []\n' > "$RUNNER_TEMP/base-ai-use-log.yaml"
          fi
      - name: Verify AI-use log association
        run: |
          python scripts/ci_checks.py ai-log \
            --base-log "$RUNNER_TEMP/base-ai-use-log.yaml" \
            --head-log docs/ai-use-log.yaml \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  evidence-check:
    name: evidence-check
    if: github.event_name == 'pull_request'
    needs: classify
    permissions:
      contents: read
      statuses: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CI checks
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Verify trusted semantic evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          SEMANTIC_REQUIRED: ${{ needs.classify.outputs.semantic_required }}
        run: |
          args=()
          if [ "$SEMANTIC_REQUIRED" = "true" ]; then args+=(--semantic-required); fi
          python scripts/ci_checks.py evidence \
            --candidate "$CANDIDATE_SHA" \
            --repo "${{ github.repository }}" \
            --default-branch "${{ github.event.repository.default_branch }}" \
            --token "$GH_TOKEN" \
            --semantic-config docs/ci/semantic_eval.yaml \
            "${args[@]}"

  aggregate:
    name: aggregate
    if: always() && github.event_name == 'pull_request'
    needs:
      - classify
      - test-approval
      - requirements-schema
      - static
      - type-check
      - dependency-check
      - regression
      - smoke-install
      - security-paths
      - ai-use-log
      - evidence-check
      - contract-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Aggregate required gate results
        run: |
          python scripts/ci_checks.py aggregate \
            --needs-json '${{ toJSON(needs) }}' \
            --required "classify,test-approval,requirements-schema,static,type-check,dependency-check,regression,smoke-install,security-paths,ai-use-log,evidence-check,contract-tests" \
            --applicable "test-approval=${{ needs.classify.outputs.approval_applicable }},security-paths=${{ needs.classify.outputs.security_applicable }},ai-use-log=${{ needs.classify.outputs.ai_log_required }}"
