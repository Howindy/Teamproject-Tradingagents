name: Trusted evaluation

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit SHA to evaluate
        required: true
        type: string
      mode:
        description: Evaluation mode
        required: true
        type: choice
        options:
          - semantic
          - live
          - semantic-not-applicable
      not_applicable_reason:
        description: Human-reviewed reason for semantic not-applicable
        required: false
        default: ""
        type: string
      reviewer:
        description: Human reviewer who approved the not-applicable determination
        required: false
        default: ""
        type: string
      approval_evidence:
        description: URL of the human review or comment
        required: false
        default: ""
        type: string
      semantic_runner:
        description: Optional module:function runner for an approved semantic config
        required: false
        default: ""
        type: string

permissions:
  contents: read
  statuses: write
  actions: read

concurrency:
  group: trusted-evaluation-${{ inputs.candidate_sha }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  evaluate:
    environment: trusted-evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Require default-branch dispatch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            echo "trusted evaluation must be dispatched from the default branch"
            exit 1
          fi
      - name: Checkout trusted workflow version
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify trusted tool checkout
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "${{ github.sha }}" ]; then
            echo "trusted tool checkout $actual does not match workflow SHA ${{ github.sha }}"
            exit 1
          fi
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
      - name: Verify candidate checkout
        run: |
          actual="$(git -C candidate rev-parse HEAD)"
          if [ "$actual" != "${{ inputs.candidate_sha }}" ]; then
            echo "checked-out HEAD $actual does not match candidate ${{ inputs.candidate_sha }}"
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project and CI checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "candidate[dev]" -r .github/requirements-ci.txt
      - name: Write semantic evidence record
        if: inputs.mode == 'semantic'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/ci_semantic_eval.py \
            --config docs/ci/semantic_eval.yaml \
            --candidate "${{ inputs.candidate_sha }}" \
            --workflow-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --output record.json \
            --details-output "${{ runner.temp }}/semantic-details.json" \
            --runner "${{ inputs.semantic_runner }}"
      - name: Write reviewed not-applicable record
        if: inputs.mode == 'semantic-not-applicable'
        run: |
          python scripts/ci_semantic_eval.py \
            --config docs/ci/semantic_eval.yaml \
            --candidate "${{ inputs.candidate_sha }}" \
            --workflow-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --output record.json \
            --not-applicable \
            --reason "${{ inputs.not_applicable_reason }}" \
            --reviewer "${{ inputs.reviewer }}" \
            --approval-evidence "${{ inputs.approval_evidence }}"
      - name: Run live suite
        if: inputs.mode == 'live'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "DEEPSEEK_API_KEY is not configured; live evidence is not a pass"
            exit 1
          fi
          set +e
          (cd candidate && pytest -q -o addopts="" test/live/ --junitxml="$RUNNER_TEMP/live.xml") | tee "$RUNNER_TEMP/live.txt"
          pytest_rc=${PIPESTATUS[0]}
          set -e
          python scripts/ci_checks.py live-result --junit "$RUNNER_TEMP/live.xml"
          if [ "$pytest_rc" -ne 0 ]; then
            echo "live suite failed"
            exit 1
          fi
          python -c "import json,os; json.dump({'candidate_sha':os.environ['CANDIDATE_SHA'],'workflow_sha':os.environ['WORKFLOW_SHA'],'run_id':os.environ['RUN_ID'],'kind':'live','status':'passed','executed':True,'collected_only':False,'config_version':'','reason':'','reviewed_by':''}, open('record.json','w'), indent=2)"
      - name: Upload evidence record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ inputs.candidate_sha }}-${{ inputs.mode }}
          path: record.json
          if-no-files-found: error
      - name: Upload semantic details artifact
        if: always() && inputs.mode == 'semantic'
        uses: actions/upload-artifact@v4
        with:
          name: ci-semantic-details-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/semantic-details.json
          if-no-files-found: ignore
      - name: Write candidate status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          MODE: ${{ inputs.mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          context="semantic-eval/evidence"
          if [ "$MODE" = "live" ]; then context="live-tests/evidence"; fi
          if [ "$MODE" = "semantic-not-applicable" ]; then context="semantic-eval/not-applicable"; fi
          state="failure"
          description="required evidence is missing or failed"
          if [ -f record.json ]; then
            state="$(python -c "import json; r=json.load(open('record.json')); print('success' if r.get('status') == 'passed' or r.get('status') == 'not_applicable' else 'failure')")"
            description="evidence recorded for $CANDIDATE_SHA"
          fi
          gh api --method POST "repos/${{ github.repository }}/statuses/$CANDIDATE_SHA" \
            -f state="$state" -f context="$context" -f description="$description" -f target_url="$RUN_URL"
          test "$state" = "success"
